    - "Before reporting implementation or repair work complete, run the project-backed verification commands: `cargo fmt --all -- --check`; then `cargo clippy --workspace --all-targets -- -D warnings`; then `cargo nextest run`; then `cargo build`. A non-zero exit blocks success; fix the cause and rerun."
    - "Use the repository CI workflows as verification evidence and keep local commands aligned with them: `.github/workflows/ci.yml`, `.github/workflows/claude-code-review.yml`, `.github/workflows/claude.yml`, `.github/workflows/docs.yml`, `.github/workflows/lint.yml`, `.github/workflows/release.yml`."
    - "执行任何 shell 命令时遵循项目 RTK 规则；测试只使用 `rtk cargo nextest run` 系列或最终门禁 `rtk ./scripts/run-tests.sh`，禁止裸跑 `cargo test -p ralph-cli`。"
    - "本运行是只读实施审查：不要修改 tracked source、计划文件、preset、schema、分支或 worktree；仅写当前流程明确允许的审查产物。"
    - "不要手工编辑 `.ralph/` 运行时状态；通过 Ralph CLI 与 runtime API 观察和推进。"
    - "项目权威验证入口为 `rtk cargo fmt --all -- --check`、`rtk cargo clippy --all-targets --all-features -- -D warnings`、`rtk ./scripts/run-tests.sh` 与 `rtk cargo build --release`；只读审查不得执行这些门禁，只能审阅已有证据。"
telemetry:
  runtime_diagnosis:
    enabled: true
    write_artifacts: true
    prompt_injection_enabled: true
    max_repeated_recoveries: 2
    max_prompt_findings: 8
    artifact_retention: 20
    max_prompt_chars: 4096
    retry_window_iterations: 8

