# Harness Extensions Demo Preset
#
# A minimal working example of Ralph's four Harness Extension mechanisms.
# Use this as a starting point for methodology-heavy workflows where
# consistency and auditability matter.
#
# Usage:
#   ralph run -c presets/harness-demo.yml -p "Your task here"

core:
  scratchpad: .ralph/agent/scratchpad.md

  # FR-2: Event Projection — auto-copy matching events to sidecar JSONL files
  event_projection:
    enabled: true
    rules:
      - name: decision-log
        trigger_events:
          - "decision.made"
          - "decision.revised"
        fields:
          - "topic"
          - "payload"
        target_file: .ralph/decisions.jsonl
        mode: append

  # FR-3: State File Injection — inject structured JSON/JSONL into prompts
  state_files:
    enabled: true
    inject_preamble: |
      ## External State
      The following files contain machine-readable state. Trust these values
      over any paraphrased or recalled information.
    files:
      - path: .ralph/agent/context.json
        format: json
        char_budget: 3000

  # FR-4: Preflight Extension Hooks — run external commands during preflight
  preflight_extensions:
    enabled: true
    hooks:
      - name: check-decisions-log
        command: "test -f .ralph/decisions.jsonl || echo '[]' > .ralph/decisions.jsonl"
        stage: before_native
        fail_on_error: false

      - name: lint-config
        command: "echo 'preflight hook demo: {{config_path}}'"
        stage: after_native
        fail_on_error: false

# FR-1: Event Filtering — per-Hat allowlists
events:
  decision.made:
    description: "A decision has been recorded"
  decision.revised:
    description: "A decision has been revised"

hats:
  planner:
    name: "Planner"
    triggers: ["loop.start"]
    publishes: ["plan.created"]
    event_filter:
      enabled: true
      mode: allowlist
      events:
        - "loop.start"
        - "plan.executed"
        - "decision.made"

  executor:
    name: "Executor"
    triggers: ["plan.created"]
    publishes: ["plan.executed"]
    event_filter:
      enabled: true
      mode: allowlist
      events:
        - "plan.created"
        - "plan.executed"

  reviewer:
    name: "Reviewer"
    triggers: ["plan.executed"]
    publishes: ["review.complete"]
    event_filter:
      enabled: true
      mode: allowlist
      events:
        - "plan.executed"
        - "review.complete"
        - "decision.made"
