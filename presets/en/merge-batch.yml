# Merge Batch Preset
#
# Git-first batch merge: review design intent and conflict strategy, merge
# multiple worktree branches into a target branch, stabilize with
# verify-fix-retest self-loop, then write a merge report.
#
# Prompt contract (operator provides ONLY):
#   - Target branch (e.g. main)
#   - Ordered list of branches to merge (from `git worktree list`)
#
# Does NOT use ralph loops list, merge queue, or mark-merged commands.
#
# Usage:
#   ralph run -H builtin:merge-batch -P merge.prompt.md
#   ralph run -c ralph.merge.yml -H builtin:merge-batch
#
# Artifacts (canonical layout under .ralph/merge/, owned by hats — not by this preset):
#   .ralph/merge/stabilize-log.md        — stabilizer writes per attempt
#   .ralph/merge/stabilize-state.json    — stabilizer writes/reads across attempts
#   .ralph/merge/REPORT.md               — reporter writes (operator-facing; required
#                                          before merge.batch.complete)
#   .ralph/merge/reports/<timestamp>.md  — reporter optional stamped copy
#
# Lifecycle: stabilize-* files persist across the stabilization self-loop and are
# the authoritative audit trail. REPORT.md is the durable operator-facing record;
# reporter retains the entire .ralph/merge/ tree (no cleanup in this preset).

topic_format_whitelist:
  - merge.batch.complete

# No `mechanism.flow` block: flat hat-only linear chain with one stabilizer
# self-loop (`merge.retest`). Routing comes from hat triggers/publishes and
# isolated mode. FlowStepScope is skipped when a preset does not opt into
# `mechanism.flow`.
#
# Completion is split from protocol tokens on purpose (P0-5 / merge-loop
# pattern): `merge.stabilized` is a required workflow event; only `reporter`
# may emit `merge.batch.complete` (the completion_promise). This blocks
# text-path `MERGE_COMPLETE` races before the report is written.

tasks:
  enabled: false

event_loop:
  execution_mode: isolated
  prompt: |
    Batch-merge git worktree branches into the target branch named in the prompt.

    Read the prompt for:
    - Target branch (default: main)
    - Ordered branch list to merge (from `git worktree list`)

    Do NOT use `ralph loops list`, merge queue, or `ralph loops mark-*` commands.
    Git is the source of truth.
  completion_promise: "merge.batch.complete"
  required_events:
    - "merge.stabilized"
  max_iterations: 40
  max_runtime_seconds: 7200
  starting_event: "merge.start"
  # 2026-07-04-002 U10: payload schemas come from the SSOT file
  # `presets/schemas/merge-batch.yml`; build.rs deep-merges them
  # into `event_policy.schemas` at compile time (plan
  # 2026-06-16-002 Unit 1). topic_deny_rules below pin hat
  # ownership for each batch merge topic — mirrors
  # ce-executor-serial rule structure so a future `verify`
  # payload check rejects any hat that tries to publish a
  # topic it does not own.
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    require_emit_provenance: true
    terminal_topics:
      - "merge.batch.complete"
    business_topics:
      - "merge.reviewed"
      - "merge.integrated"
      - "merge.retest"
      - "merge.stabilized"
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    topic_deny_rules:
      # reviewer owns merge.reviewed
      - {hat_id: integrator, topic: merge.reviewed}
      - {hat_id: stabilizer, topic: merge.reviewed}
      - {hat_id: reporter, topic: merge.reviewed}
      # integrator owns merge.integrated
      - {hat_id: reviewer, topic: merge.integrated}
      - {hat_id: stabilizer, topic: merge.integrated}
      - {hat_id: reporter, topic: merge.integrated}
      # stabilizer owns merge.retest / merge.stabilized
      - {hat_id: reviewer, topic: merge.retest}
      - {hat_id: integrator, topic: merge.retest}
      - {hat_id: reporter, topic: merge.retest}
      - {hat_id: reviewer, topic: merge.stabilized}
      - {hat_id: integrator, topic: merge.stabilized}
      - {hat_id: reporter, topic: merge.stabilized}
      # terminal completion token: only reporter may emit it.
      - {hat_id: reviewer, topic: merge.batch.complete}
      - {hat_id: integrator, topic: merge.batch.complete}
      - {hat_id: stabilizer, topic: merge.batch.complete}
      # ralph loop-runner fallback hat is locked out of every
      # workflow topic that downstream hats own.
      - {hat_id: ralph, topic: merge.reviewed}
      - {hat_id: ralph, topic: merge.integrated}
      - {hat_id: ralph, topic: merge.retest}
      - {hat_id: ralph, topic: merge.stabilized}
      - {hat_id: ralph, topic: merge.batch.complete}
    # 2026-08-08-004 plan U1 (D12): scope boundary payload_consistency
    # rules. These fire on merge.integrated and merge.stabilized to
    # ensure the boundary artifact path is under the allowed root,
    # the file is readable, and the digest is consistent.
    payload_consistency:
      enabled: true
      rules:
        # U1 (D13): merge_boundary_path must be under .ralph/merge/
        - id: merge-batch-boundary-path-root
          topic: merge.integrated
          when:
            all:
              - {field: merge_boundary_path, exists: true}
              - {field: merge_boundary_path, non_empty: true}
          message: "merge_boundary_path must be under .ralph/merge/; received value must be repo-relative and under the merge/ directory."
        # U1 (D12): merge_boundary_status must be complete or incomplete
        - id: merge-batch-boundary-status-allowed
          topic: merge.integrated
          when:
            all:
              - {field: merge_boundary_status, exists: true}
              - {field: merge_boundary_status, non_empty: true}
          message: "merge_boundary_status must be 'complete' or 'incomplete'; received value is not in the allowed set."
        # U1 (D12): merge.stabilized must echo the same boundary path/digest
        - id: merge-stabilized-boundary-echo
          topic: merge.stabilized
          when:
            all:
              - {field: merge_boundary_path, exists: true}
              - {field: merge_boundary_path, non_empty: true}
          message: "merge.stabilized must echo merge_boundary_path and merge_boundary_digest from merge.integrated; paths outside .ralph/merge/ are rejected."

cli:
  backend: "auto"

core:
  specs_dir: "./specs/"
  guardrails:
    # OPAC 四阶段纪律 (plan 2026-07-04-001 U17): 所有 hat 遵循
    # Observe → Precheck → Apply → Confirm。详见
    # `crates/ralph-core/data/ralph-tools-opac.md`。
    - "OPAC Observe: `ralph inspect loop` + `ralph tools task list`. 不要读 `.ralph/events.jsonl`."
    - "OPAC Precheck: `ralph emit --policy-check` 或 `ralph wave verify`. agent context 默认 enforce（U15）."
    - "OPAC Apply: 一次 activation 一条业务事件（isolated 单事件预算）；不要在同 activation 重试 dropped emit."
    - "OPAC Confirm: `ralph events --events-source hat-channel`（单 emit）或 `--events-source main`（wave emit 写入主 ledger）."
    - "GIT-ONLY: Use `git worktree list`, branch names, and prompt branch order as the sole merge inputs. Never read or write `.ralph/loops.json`, `.ralph/merge-queue.jsonl`, or invoke `ralph loops mark-merged` / `mark-needs-review`."
    - "ALLOWED `.ralph/` writes: only under `.ralph/merge/` (stabilize logs, state, reports). Do not modify other `.ralph/` runtime state."
    - "Run from the main repository root (first entry in `git worktree list`), not inside a linked worktree."
    - "ABSOLUTE PROHIBITION: NEVER kill, signal, or terminate any `ralph` / `ralph-orchestrator` process — including `kill`, `pkill`, `killall`, `kill -9`, `kill -TERM`, `kill -HUP`, `taskkill`, or any equivalent process-control command targeting the loop's parent PID, the TUI subprocess PID recorded in `.ralph/loop.lock`, any PID listed in `.ralph/loops.json`, or any PID returned by `ps` / `pgrep` matching `ralph`. Stopping the orchestrator is the operator's decision, not the agent's."
    - "Do not force-push or rewrite published history."
    - "Never roll back merge commits that already succeeded; only `git merge --abort` the in-progress step when stuck."
    - "Integrator: if any branch merge is aborted or cannot complete, STOP merging remaining branches; publish merge.integrated with integration_complete: false."
    - "Stabilizer: publish merge.stabilized with passed: true ONLY when integration_complete was true AND verification passes. Publish merge.stabilized with passed: false when merge was incomplete, stabilization is exhausted (attempt ≥ 35), or verification cannot be fixed. Never publish merge.retest without updating stabilize-log and stabilize-state."

hats:
  reviewer:
    name: "Merge Reviewer"
    description: "Deep design review, cross-branch risk analysis, and conflict resolution strategy before merging."
    exempt_topics: ["merge.reviewed"]
    triggers: ["merge.start"]
    publishes: ["merge.reviewed"]
    default_publishes: "merge.reviewed"
    terminal_events: ["merge.reviewed"]
    event_filter:
      enabled: true
      events: ["work.start"]
    instructions: |
      ## MERGE REVIEWER MODE

      Read-only analysis. Do NOT run `git merge` or modify the working tree.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm). Before constructing the payload, run `ralph tools skill load ralph-tools-emit` and follow its Policy-Check feedback and §5 precheck; do not reproduce command syntax in this hat.

      ### Step 1: Parse prompt

      Extract:
      - **Target branch** (default `main` if omitted)
      - **Ordered branch list** to merge

      ### Step 2: Discover worktrees

      ```bash
      git worktree list
      git branch -a
      ```

      Verify every prompt branch exists. Record each branch's worktree path.

      ### Step 3: Per-branch design understanding

      For each branch (in prompt order):

      ```bash
      git log <target>..<branch> --oneline
      git diff --stat <target>...<branch>
      git diff <target>...<branch> -- <key-files>
      ```

      Read relevant source, commits, and any plan/design docs inside the worktree.

      Document for each branch:
      - **Design intent** — what problem it solves and how
      - **Key logic changes** — files and mechanisms touched
      - **Bug / regression risks** — test gaps, edge cases, smells

      ### Step 4: Cross-branch analysis

      Compare branches pairwise:
      - Overlapping files and functions
      - Complementary vs conflicting intent
      - Merge order implications

      ### Step 5: Conflict prediction and resolution strategy

      For each predicted conflict (use `git merge-tree` when helpful):

      ```bash
      git merge-tree $(git merge-base <target> <branch>) <target> <branch>
      ```

      For each conflict point write:
      - **Conflict type** (textual / semantic / architectural)
      - **Resolution method** — preserve both intents, merge logic, ordering, etc.
      - **Rationale** tied to design understanding (not blind HEAD/theirs)

      ### Step 6: Publish

      First write `.ralph/merge/review.md` containing the complete per-branch
      intent, risks, cross-branch analysis, predicted conflicts, and resolution
      methods. Verify it is readable. The event carries only short control
      fields plus `review_path`; never inline the full review in the payload.

      Publish **`merge.reviewed`** with a structured payload summarizing:
      - target branch
      - branch order
      - per-branch design intent and risks
      - cross-branch interactions
      - `review_path` — the readable artifact path the integrator must consume.

      Merge WILL proceed after review — your job is to enable safe merging, not to block.

  integrator:
    name: "Branch Integrator"
    description: "Merges all prompt branches into the target branch using reviewer conflict strategy."
    exempt_topics: ["merge.integrated"]
    triggers: ["merge.reviewed"]
    publishes: ["merge.integrated"]
    default_publishes: "merge.integrated"
    terminal_events: ["merge.integrated"]
    event_filter:
      enabled: true
      events: ["work.start"]
    instructions: |
      ## BRANCH INTEGRATOR MODE

      Merge ALL prompt branches into the target branch. Read `review_path` from
      the trigger context, then read and validate the review artifact before
      applying any merge. Stop if it is missing, unreadable, or lacks the
      conflict strategy for the branch being merged.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm). Before constructing the payload, run `ralph tools skill load ralph-tools-emit` and follow its Policy-Check feedback and §5 precheck; do not reproduce command syntax in this hat.

      ### Step 1: Prepare

      ```bash
      git checkout <target>
      git status
      ```

      Ensure working tree is clean before merging.

      ### Step 1a: Pre-merge full verification gate

      Before merging the first branch, discover and run the repository's full
      verification command on the clean target branch. Use the same discovery
      order as the stabilizer and record the exact command and result.

      If verification fails before any branch is merged:
      - do not merge any branch;
      - record the command, exit status, and concise failure evidence;
      - write `.ralph/merge/integration.md` with the failed pre-merge gate
        and verify that it is readable;
      - publish `merge.integrated` with `integration_complete: false`,
        `ready_for_stabilization: false`, empty `branches_merged` and
        `merge_commit_shas`, and one `branches_failed` entry with
        `branch: "<pre-merge-verification>"` and the failure reason, plus
        `integration_path: .ralph/merge/integration.md`.
      The stabilizer will turn this into `merge.stabilized(passed: false,
      reason: merge_incomplete)`, allowing reporter to write the failure
      report and emit the normal completion token.

      Proceed to sequential merging only when this full verification passes.

      ### Step 2: Sequential merge

      For each branch in order:

      1. Review diff summary:
         ```bash
         git log <target>..<branch> --oneline
         git diff --stat <target>...<branch>
         ```

      2. Merge:
         ```bash
         git merge <branch> --no-ff -m "merge: <summary> (<branch>)"
         ```

      3. **If conflicts occur:**
         - Apply the resolution method from `merge.reviewed.resolution_methods`
           (matched by branch + file)
         - Understand BOTH sides' design intent before editing
         - Resolve markers, `git add`, complete the merge commit
         - If a conflict was not predicted in `merge.reviewed.predicted_conflicts`,
           reason from design intent
         - If truly stuck after reasonable effort:
           ```bash
           git merge --abort
           ```
           **STOP** — do NOT merge any remaining branches
           Record which branch failed and why

      4. Skip branches already merged (`git branch --merged <target>`).

      ### Step 3: Capture merge-boundary artifact

      After each `git merge --no-ff`, capture the target identity for the
      boundary manifest:

      ```bash
      git rev-parse <target>          # pre-merge target SHA
      git rev-parse HEAD              # post-merge target SHA (merge commit)
      git rev-parse HEAD^{tree}       # post-merge target tree SHA
      git merge-base <target> <branch>  # merge-base SHA
      ```

      Maintain a running log in memory (not yet written to disk) of:
      - `target_branch`
      - `batch_base_sha` (target SHA at batch start, before first merge)
      - `batch_head_sha` (current HEAD after last merge)
      - `batch_head_tree` (current tree SHA after last merge)
      - `branch_entries[]`: per-branch {branch, merge_commit_sha, merge_base_sha,
        pre_merge_target_sha, post_merge_target_sha}
      - `merge_commits[]`: SHAs of merge commits created this run
      - `interleaved_target_commits[]`: any target-branch commits that appear
        between batch_base and batch_head (detected by walking batch_base..HEAD
        and checking which commits are on target vs. merged branches)

      ### Step 4: Publish

      Before publishing, write `.ralph/merge/integration.md` with actual merge
      order, skipped/merged/failed branches, merge SHAs, conflicts, verification
      result, and failure evidence. Verify it is readable.

      Write the boundary manifest `.ralph/merge/merge-boundary.json`:
      - Compute `boundary_digest` as the SHA-256 hex of the canonical JSON
        (keys sorted, no trailing space on last line, `boundary_digest` field
        excluded from the digest input)
      - `boundary_status: complete` when every branch merged successfully;
        `incomplete` when any branch failed or was aborted
      - Always write the file even on failure — record what IS known

      ```json
      {
        "schema_version": "multi-plan-scope/merge-boundary.v1",
        "target_branch": "<target>",
        "batch_base_sha": "<target SHA before first merge>",
        "batch_head_sha": "<target HEAD after last merge or batch start SHA if no merges>",
        "batch_head_tree": "<target tree SHA after last merge>",
        "branch_entries": [
          {
            "branch": "<branch-name>",
            "merge_commit_sha": "<merge commit SHA or null if skipped/failed>",
            "merge_base_sha": "<merge-base SHA>",
            "pre_merge_target_sha": "<target SHA before merging this branch>",
            "post_merge_target_sha": "<target SHA after merging this branch>"
          }
        ],
        "merge_commits": ["<SHA>", ...],
        "interleaved_target_commits": ["<SHA>", ...],
        "verification": {
          "command": "<verification command run; null if pre-merge gate failed>",
          "result": "pass|fail|skipped"
        },
        "boundary_digest": "<64-char hex>",
        "boundary_status": "complete|incomplete"
      }
      ```

      Publish **`merge.integrated`** with payload fields:
      - `integration_complete`: **true** only if EVERY prompt branch is merged
        (merged this run or already merged); **false** if any branch was
        aborted, failed, or skipped while still outstanding
      - `ready_for_stabilization`: same as `integration_complete` (false → skip verify loop)
      - `branches_merged` — successfully merged this run (no overlap with
        `branches_skipped` or `branches_failed`)
      - `branches_skipped` — already on target before this run
      - `branches_failed` — aborted or could not merge (with reasons;
        no overlap with `branches_merged`)
      - `merge_commit_shas` — SHAs for commits made this run
      - `integration_path: .ralph/merge/integration.md`
      - `merge_boundary_path: .ralph/merge/merge-boundary.json`
      - `merge_boundary_digest: <64-char hex>`
      - `merge_boundary_status: complete|incomplete`

  stabilizer:
    name: "Stabilizer"
    description: "Discovers project verification, fixes failures with classified retry loop until green."
    exempt_topics: ["merge.retest", "merge.stabilized"]
    triggers: ["merge.integrated", "merge.retest"]
    publishes: ["merge.retest", "merge.stabilized"]
    default_publishes: "merge.retest"
    terminal_events: ["merge.retest", "merge.stabilized"]
    event_filter:
      enabled: true
      events: ["work.start"]
    instructions: |
      ## STABILIZER MODE

      Verify the merged tree and fix failures until green. Use a self-loop via
      **`merge.retest`** (fresh iteration).

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm). Before constructing any payload, run `ralph tools skill load ralph-tools-emit` and follow its Policy-Check feedback and §5 precheck; do not reproduce command syntax in this hat.

      ### Entry gate (on `merge.integrated`)

      Read the `merge.integrated` payload first.

      If `integration_complete` is **false** OR `ready_for_stabilization` is
      **false**:
      - Write a short note to `stabilize-log.md` explaining merge was incomplete
      - Publish **`merge.stabilized`** immediately with:
        - `passed: false`
        - `reason: merge_incomplete`
        - `branches_failed` from the integrator payload
        - `report_input_file: .ralph/merge/report-input.md` after writing a
          failure manifest that records the missing integration evidence
      - Do NOT run verification or enter the fix loop

      ### Artifact paths (create `.ralph/merge/` if missing)

      - `.ralph/merge/stabilize-log.md` — human-readable attempt log
      - `.ralph/merge/stabilize-state.json` — structured handoff between attempts
      - `.ralph/merge/report-input.md` — manifest consumed by reporter; owner is
        stabilizer, reader is reporter, retained with the merge tree for audit.

      ### EVERY stabilization attempt checklist

      1. **Read** `stabilize-log.md` and `stabilize-state.json` (if missing, start attempt 1)
      2. **Verification command** (pin on attempt 1, reuse thereafter):
         - If `stabilize-state.json` has `verification_command`, reuse it
         - Else if the prompt names a verification command, use it verbatim
           (prompt takes priority over discovery; do not narrow it to a subset)
         - Else discover from the repo — NEVER assume a fixed stack:
           `-c` backpressure gates → AGENTS.md / CLAUDE.md / CONTRIBUTING.md → CI
           workflows → package.json / pyproject.toml / Cargo.toml / Makefile / justfile
         - Save chosen command to `stabilize-state.json` as `verification_command`
      3. **Exhaustion check**: if `attempt >= 35`, skip fixes; publish
         **`merge.stabilized`** with `passed: false`, `reason: stabilization_exhausted`
      4. **Run** the pinned verification command
      5. If **PASS** → update log with RESOLVED → publish **`merge.stabilized`**
         with `passed: true`
      6. If **FAIL** → follow failure protocol below → publish **`merge.retest`**
         (unless exhaustion applies on the next entry)

      ### Failure protocol (before each fix)

      **A. Classify** (mandatory — write in log):
      - **test_problem** — outdated assertion, fixture, env; product behavior is correct
      - **business_problem** — logic error, regression, bad merge resolution, missing init

      **B. Compare with previous attempt:**
      - Read `why_not_fixed` from stabilize-state
      - Do NOT repeat a fix that already failed

      **C. Fix plan with confidence** (mandatory before editing):
      - Goal, steps, files
      - **Confidence**: ≥80 proceed; 50–80 proceed + note uncertainty; <50 investigate more or narrow scope first
      - If <50: prefer more diagnosis this attempt over blind edits

      **D. Execute** minimal fix; commit on target branch if needed

      **E. Re-run** the pinned verification command

      **F. Record** in stabilize-log.md and stabilize-state.json:
      ```json
      {
        "attempt": <n>,
        "verification_command": "<pinned command>",
        "classification": "test_problem|business_problem",
        "confidence": <0-100>,
        "fix_applied": "<summary>",
        "outcome": "failed|passed",
        "why_not_fixed": "<if failed>",
        "next_hint": "<actionable guidance for next attempt>"
      }
      ```

      ### Publish rules

      Before every `merge.stabilized` emit, update `.ralph/merge/report-input.md`
      with readable paths for review, integration, stabilize-log, and
      stabilize-state. If an upstream artifact is unavailable, record that fact
      in the manifest and keep `passed: false`.

      - **PASS** (and merge was complete) → `merge.stabilized` with `passed: true`
        and `report_input_file: .ralph/merge/report-input.md`
      - **FAIL after fix attempt** (and attempt < 35) → `merge.retest`
      - **Merge incomplete** (integrator gate) → `merge.stabilized` with `passed: false`, `reason: merge_incomplete`
      - **Attempt ≥ 35 still failing** → `merge.stabilized` with `passed: false`, `reason: stabilization_exhausted`
      - **NEVER** publish `merge.stabilized` with `passed: true` while verification is failing

  reporter:
    name: "Merge Reporter"
    description: "Writes merge report, cleans up worktrees on success, emits merge.batch.complete."
    exempt_topics: ["merge.batch.complete"]
    triggers: ["merge.stabilized"]
    publishes: ["merge.batch.complete"]
    default_publishes: "merge.batch.complete"
    terminal_events: ["merge.batch.complete"]
    event_filter:
      enabled: true
      events: ["work.start"]
    instructions: |
      ## MERGE REPORTER MODE

      Write the final report and signal completion.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm).
      Before each real emit, run `ralph tools skill load ralph-tools-emit`, then
      use its `--policy-check`
      first; Confirm with `--output json` (`ok`/`recorded`), not by reading event
      files. Do not reproduce command syntax tables in this hat.

      ### HARD RULE — deliverable path first
      Canonical path: `.ralph/merge/REPORT.md`
      Optional stamped copy: `.ralph/merge/reports/<YYYY-MM-DDTHH-MM-SS>.md`
      (then `report_path` must point at the file you actually wrote).
      Create parent dirs if missing.
      **No readable `report_path` ⇒ no `merge.batch.complete`.**

      ### Report contents (minimum)

      ```markdown
      # Merge Batch Report

      ## 结论
      PASS | PASS WITH ACCEPTED RISKS | FAIL

      ## 本轮做了什么
      (review → integrate → stabilize stages)

      ## 产物路径清单
      - this report
      - any stabilize logs / related `.ralph/merge/**` paths

      ## Target and branches
      ## Design understanding (per branch)
      ## Cross-branch risks identified
      ## Conflicts and resolution (predicted vs actual)
      ## Merge results (SHAs, order)
      ## Stabilization (attempts, classifications, fixes)
      ## Verification (commands run, outcome)
      ## 接受的风险 / Residual concerns
      ## 下一步建议
      ## Repository state (remaining worktrees/branches)
      ```

      Check `merge.stabilized` payload (`passed`, `reason`) and git state.
      Read `report_input_file` from the trigger context. Run `test -f` on the
      manifest and every listed artifact, read them, and verify they contain
      enough evidence for the required report sections. If any artifact is
      missing or insufficient, write a FAIL report and emit `success: false`.

      ### Boundary artifact cross-check

      Read `merge.stabilized` payload (`merge_boundary_path` / `merge_boundary_digest`).
      If the fields are present:
      1. Verify the file at `merge_boundary_path` is readable (`test -f`)
      2. Recompute the SHA-256 digest of the canonical boundary JSON (keys sorted,
         no trailing space) and confirm it matches `merge_boundary_digest`
      3. Include the boundary digest and status in the report

      If path is missing or digest mismatch: record the discrepancy in the
      report but do NOT change the completion outcome — boundary is OPTIONAL
      cross-check evidence, NOT a downstream authority.

      ### On success (`passed: true` from `merge.stabilized`)

      Discover which branches are now merged into `<target>` via the
      git-first commands below; this is the authoritative list (not the
      `merge.integrated` payload, which is not visible to this hat):

      ```bash
      git worktree list
      git branch --merged <target>   # authoritative merged branch list
      git worktree remove <path>
      git branch -d <branch>
      git worktree prune
      ```

      Use `-D` only when `--merged` confirms the branch is fully integrated.

      ### On failure (`passed: false`, merge incomplete, or stabilization exhausted)

      - Do NOT remove worktrees or delete branches
      - Document exact state for human follow-up
      - Include stabilize-log summary, `reason`, and `next_hint`
      - Still write a readable report file (FAIL conclusion) before emit

      ### OPAC Confirm order (mandatory)
      1. Write the report file; verify readable (`test -f` + `wc`/`head`).
      2. `ralph emit merge.batch.complete --policy-check` with `success` + `report_path`.
      3. Real emit `merge.batch.complete`.
      4. Confirm emit via `--output json` (`ok`/`recorded`), then print
         `DELIVERABLE_PATH: <report_path>` in this activation's visible reply.
         Schema does not check the filesystem — you must.

      ### Publish

      Publish **`merge.batch.complete`** (sole completion token) with payload:
      - `success: true|false` (true ONLY when `merge.stabilized.passed` is true)
      - `report_path` (required; readable file under `.ralph/merge/`)
      - `merged_branches`
      - `failed_stage` / `reason` (if any)

      Do NOT emit `MERGE_COMPLETE` — that token is not used by this preset.
