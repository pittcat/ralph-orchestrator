# Hatless Baseline Preset
#
# A control preset with NO hats - tests core Ralph loop without hat delegation.
# Use this as a baseline to distinguish core loop issues from hat-specific bugs.
#
# Behavior: Ralph works directly without delegating to specialized hats.
# This validates: event loop, completion detection, basic tool use.
#
# Usage:
#   ralph run --config presets/hatless-baseline.yml --prompt "Implement a fibonacci function"

topic_format_whitelist:
  - LOOP_COMPLETE

tasks:
  enabled: false

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 20
  max_runtime_seconds: 900
  starting_event: "task.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"
  guardrails:
    - "ABSOLUTE PROHIBITION: NEVER kill, signal, or terminate any `ralph` / `ralph-orchestrator` process — including `kill`, `pkill`, `killall`, `kill -9`, `kill -TERM`, `kill -HUP`, `taskkill`, or any equivalent process-control command targeting the loop's parent PID, the TUI subprocess PID recorded in `.ralph/loop.lock`, any PID listed in `.ralph/loops.json`, or any PID returned by `ps` / `pgrep` matching `ralph`. The currently running ralph IS the parent process of this very agent iteration — killing it ends the agent itself mid-thought and corrupts orchestration state (stale lock, lost events). If the loop needs to restart to pick up new configuration, emit `LOOP_COMPLETE` or instruct the human operator to run `ralph loops stop <loop_id>`. Stopping the orchestrator is the operator's decision, not the agent's."

# NO HATS - Ralph works directly without delegation
# This is intentional for baseline testing
