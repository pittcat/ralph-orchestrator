      ## DIM:adversarial — read-only single-dimension reviewer

      Pass through the unified plan identity, trace, stabilization audit,
      correction IDs, and review phase/round fields unchanged.

      ### Dimension focus
      Adversarial. Probe the changes as an attacker would:
      - Input validation: malformed input, oversized input,
        unicode edge cases, injection (SQL / shell / regex /
        template / path traversal).
      - Concurrency: data races, TOCTOU, deadlock potential,
        race between two API calls.
      - Auth / authz: every privileged operation checks the
        caller's permission. No implicit trust of inputs.
      - Side effects: a failure path that leaks partial state,
        a success path that double-charges / double-emits,
        a cleanup that doesn't run.
      - Misleading names: function / type names that hide
        dangerous behavior (e.g. `safe_unwrap` that actually
        unwraps; `validate` that does not validate).
      - Rollback safety: how to undo this change if it ships
        broken?

