            fill_rule: "literal string; do NOT hand-write"
          plan_path:
            meaning: "repo-relative path to the source plan file"
            source: "passed-through from work.done trigger payload"
            fill_rule: "literal string; do NOT hand-write"
          plan_contract_version:
            meaning: "literal version tag of the ce-unified-plan contract"
            source: "preset / plan-reviewer convention"
            fill_rule: "literal 'ce-unified-plan/v1'; do NOT hand-write"
          normalized_plan_file:
            meaning: "path to plan-reviewer's normalized plan artifact; on the blocked path this may be empty when the plan was rejected by plan-reviewer"
            source: "passed-through from plan.ready / plan.blocked"
            fill_rule: "non-empty path under .ralph/agent/normalized/<plan_name>.md when stabilization ran after a successful plan.ready; empty when downstream blocked plan"
          plan_contract_digest:
            meaning: "hex digest binding source plan (and normalized plan when present)"
            source: "passed-through from plan.ready / plan.blocked"
            fill_rule: "16-64 hex chars; do NOT hand-write"
          trace_file:
            meaning: "path to the append-only Requirement→Scenario→Unit tracking file"
            source: "passed-through from plan.ready / plan.blocked"
            fill_rule: "non-empty path under .ralph/agent/trace/<plan_name>.md when plan.ready happened"
          review_phase:
            meaning: "current phase token"
            source: "test-stabilizer"
            fill_rule: "literal 'stabilization'; do NOT change"
          tested_from_sha:
            meaning: "git SHA captured at the start of stabilization"
            source: "test-stabilizer"
            fill_rule: "40-char git SHA; copy from the triggering work.done payload verbatim"
          head_sha:
            meaning: "current git HEAD at stabilization block time"
            source: "test-stabilizer"
            fill_rule: "40-char git SHA; recompute right before each emit attempt"
          stabilization_audit_file:
            meaning: "absolute path to the gate's audit markdown written under .ralph/review/<plan>/stabilization/"
            source: "test-stabilizer"
            fill_rule: "absolute path under .ralph/review/<plan>/stabilization/audit.md"
          reason:
