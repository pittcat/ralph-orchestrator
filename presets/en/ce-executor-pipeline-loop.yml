      - {hat_id: fix-planner, topic: review.artifact.blocked}
      - {hat_id: fixer, topic: review.artifact.blocked}
      - {hat_id: review-gate, topic: review.artifact.blocked}
      - {hat_id: review-reentry, topic: review.artifact.blocked}
      - {hat_id: test-stabilizer, topic: review.artifact.blocked}
      - {hat_id: alignment, topic: review.artifact.blocked}
      - {hat_id: reporter, topic: review.artifact.blocked}
    # Inline payload schemas (no `presets/schemas/` SSOT file for this
    # preset — same authoring pattern as `merge-loop`). Each schema
    # lists the `required_fields` for the topic; lint verifies every
    # emit against its schema before writing to the events file.
    schemas:
      plan.ready:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "plan_revised"
          - "review_summary"
          - "flow_audit"
          - "resolved_baseline_sha"  # written by plan-reviewer §Step 2.5b
      plan.blocked:
        required_fields: ["plan_name", "plan_path", "plan_contract_version", "plan_contract_digest", "semantic_gaps", "reason", "report_input_file"]
        field_docs:
          report_input_file:
            meaning: "repo-relative path under .ralph/ to the report-input artifact bundle the plan-reviewer wrote for reporter consumption; reporter reads ONLY this file"
            source: "plan-reviewer writes the bundle before emitting plan.blocked"
            fill_rule: "write and reopen the .ralph/ bundle before emit, then provide its non-empty repo-relative path; stop instead of inventing a missing or stale path"
      work.done:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through from plan.ready
          - "planned_units"
          - "completed_units"
          - "baseline_verification_status"
          - "baseline_verification_file"
          - "post_verification_status"
          - "post_verification_file"
          - "verification_delta_file"
          - "baseline_existing_count"
          - "new_business_regressions_count"
          - "test_compatibility_updates_count"
          - "flaky_or_environmental_count"
          - "tests_run"
          - "tests_passed"
          - "changed_lines"
          - "commit_count"
          - "attempted_units"
          - "failed_units"
          - "blocked_units"
          - "skipped_units"
          - "decisions_file"
          - "execution_status"
        field_docs:
          plan_name:
            meaning: "plan file basename without extension; copied from plan.ready for downstream hat routing"
            source: "executor carries forward from plan.ready"
            fill_rule: "literal copy of the same field from the prior plan.ready payload"
          plan_path:
            meaning: "repo-relative path to the original plan file; executor uses it to re-read the plan if needed"
            source: "executor carries forward from plan.ready"
            fill_rule: "literal copy of the same field from the prior plan.ready payload"
          executor_head_sha:
            meaning: "git SHA at HEAD after the last executor commit; the SHA reviewers/reporter anchor their work onto"
            source: "executor runs `git rev-parse HEAD` after the final executor commit"
            fill_rule: "40-char git SHA; recompute on every emit attempt; do not reuse a stale SHA"
          resolved_baseline_sha:
            meaning: "canonical baseline SHA carried through from plan.ready §Step 2.5b — reconciliation anchor"
            source: "executor carries forward from plan.ready"
            fill_rule: "literal copy; do NOT hand-write"
          planned_units:
            meaning: "ordered array of U-IDs from the original plan's Implementation Units"
            source: "executor extracts from plan_path Implementation Units section"
            fill_rule: "array of U-ID strings; preserve order; settlement invariant: planned_units = disjoint union(completed_units, failed_units, blocked_units, skipped_units)"
          completed_units:
            meaning: "ordered array of U-IDs that reached a commit this run"
            source: "executor derives from git log over the executor range"
            fill_rule: "subset of planned_units; alignment will flag any U missing here as residual; emit work.done (not work.failed) whenever this set is non-empty"
          baseline_verification_status:
            meaning: "result of the Step 1.75 baseline-snapshot verifier (green / red / unknown / skipped)"
            source: "executor runs the baseline-verifier subagent"
            fill_rule: "literal one of green, red, unknown, skipped"
          baseline_verification_file:
            meaning: "absolute path to the baseline verifier report written under .ralph/review/<plan>/"
            source: "executor writes via the Write tool; path follows the basename-verifier convention"
            fill_rule: "absolute path; do NOT make up a path — write the file first"
          post_verification_status:
            meaning: "result of the Step 1.95 delta-verifier final snapshot"
            source: "executor runs the delta-verifier subagent after the final Unit commit"
            fill_rule: "literal one of green, red, unknown"
          post_verification_file:
            meaning: "absolute path to the final-verification report under .ralph/review/<plan>/"
            source: "executor writes via the Write tool"
            fill_rule: "absolute path; do NOT make up a path"
          verification_delta_file:
            meaning: "absolute path to the baseline-vs-final delta report under .ralph/review/<plan>/"
            source: "executor writes via the Write tool"
            fill_rule: "absolute path; do NOT make up a path"
          baseline_existing_count:
            meaning: "failures that already existed before this run; report-only — do not block"
            source: "executor / delta-verifier classifies"
            fill_rule: "integer >= 0"
          new_business_regressions_count:
            meaning: "failures clearly introduced by this diff; report-only — document in verification_delta_file, do not force work.failed"
            source: "executor / delta-verifier classifies"
            fill_rule: "integer >= 0; report-only — record in verification_delta_file; post_verification_status must honestly reflect red when > 0; never force work.failed for this count alone"
          test_compatibility_updates_count:
            meaning: "tests intentionally updated to reflect intended behavior change; counted separately from regressions"
            source: "executor / delta-verifier classifies"
            fill_rule: "integer >= 0; document each test in the delta file"
          flaky_or_environmental_count:
            meaning: "failures that cannot be trusted without a repro-worthy environment signal; report-only"
            source: "executor / delta-verifier classifies"
            fill_rule: "integer >= 0; report-only — record in verification_delta_file; never force work.failed for this count alone"
          tests_run:
            meaning: "total tests run across the final verification suite"
            source: "executor captures from the final-suite command output"
            fill_rule: "integer >= 0"
          tests_passed:
            meaning: "total checks that passed in the final verification run"
            source: "executor captures from the final-suite command output"
            fill_rule: "integer; tests_passed < tests_run is allowed when the delta is accounted in new_business_regressions_count / flaky_or_environmental_count and documented in verification_delta_file"
          changed_lines:
            meaning: "insertions + deletions since DIFF_BASE; shortstat snapshot of the executor range"
            source: "executor runs `git diff --shortstat <DIFF_BASE>..HEAD`"
            fill_rule: "integer >= 0; recompute on every emit attempt"
          commit_count:
            meaning: "commits in DIFF_BASE..HEAD attributable to executor; one per passed Unit"
            source: "executor runs `git rev-list --count <DIFF_BASE>..HEAD`"
            fill_rule: "integer; must be >= the number of completed_units"
          attempted_units:
            meaning: "ordered U-IDs for which a Unit subagent was actually dispatched and returned an outcome"
            source: "executor's per-Unit dispatch log in decisions_file"
            fill_rule: "array of U-ID strings; failed_units must be a subset"
          failed_units:
            meaning: "ordered attempted U-IDs whose implementation or verification actually failed"
            source: "Unit subagent result plus executor acceptance evidence"
            fill_rule: "subset of attempted_units; never include a Unit that was only predicted to be difficult"
          blocked_units:
            meaning: "ordered unattempted U-IDs made unsafe by an explicit dependency on an actually failed Unit"
            source: "Dependencies fields in the original plan plus failed_units"
            fill_rule: "array of U-ID strings; record the failed dependency edge in decisions_file"
          skipped_units:
            meaning: "ordered U-IDs legitimately closed by the existing-commit skip path or not dispatched due to blocked dependencies"
            source: "flow-audit and git-log evidence"
            fill_rule: "array of U-ID strings; remaining work, context pressure, or elapsed time are not skip reasons; emit only after full walk of remaining independent Units"
          decisions_file:
            meaning: "execution ledger containing dispatch, acceptance, commit, failure, and dependency evidence"
            source: "executor writes .ralph/agent/decisions.md"
            fill_rule: "literal .ralph/agent/decisions.md after recording every planned Unit's disposition"
          execution_status:
            meaning: "overall execution outcome: complete when every planned Unit reached a commit; partial when any Unit failed, was blocked, or was skipped, or when all Units were blocked off a prior dependency failure (zero failed and zero completed but the dependency chain broke); partial is a settlement bill, not a failure — it carries the residual Unit classification for downstream processing"
            source: "executor settlement audit"
            fill_rule: "one of complete, partial; complete only when completed_units == planned_units; partial when failed_units / blocked_units / skipped_units is non-empty or completed_units is a proper subset of planned_units"
      work.failed:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "planned_units"
          - "attempted_units"
          - "completed_units"
          - "failed_units"
          - "blocked_units"
          - "skipped_units"
          - "baseline_verification_file"
          - "decisions_file"
          - "reason"
          - "report_input_file"
        field_docs:
          report_input_file:
            meaning: "repo-relative path under .ralph/ to the report-input artifact bundle the executor wrote for reporter consumption; reporter reads ONLY this file"
            source: "executor writes the bundle before emitting work.failed"
            fill_rule: "write and reopen the .ralph/ bundle before emit, then provide its non-empty repo-relative path; stop instead of inventing a missing or stale path"
          plan_name:
            meaning: "plan file basename without extension; identifies which execution failed"
            source: "executor copies from plan.ready"
            fill_rule: "literal copy"
          plan_path:
            meaning: "repo-relative original plan path"
            source: "executor copies from plan.ready"
            fill_rule: "literal copy"
          planned_units:
            meaning: "ordered U-IDs extracted from the original plan"
            source: "executor reads the Implementation Units section"
            fill_rule: "complete ordered array; do not omit unfinished Units"
          attempted_units:
            meaning: "ordered U-IDs for which a Unit subagent was actually dispatched and returned"
            source: "executor dispatch log in decisions_file"
            fill_rule: "failed_units must be a subset"
          completed_units:
            meaning: "attempted Units accepted and committed independently"
            source: "dispatch log plus git log"
            fill_rule: "subset of attempted_units"
          failed_units:
            meaning: "attempted Units with an observed implementation or verification failure"
            source: "Unit subagent outcome plus executor acceptance evidence"
            fill_rule: "subset of attempted_units; predicted difficulty is forbidden"
          blocked_units:
            meaning: "unattempted Units blocked by an explicit dependency on an actually failed Unit"
            source: "plan Dependencies fields plus failed_units"
            fill_rule: "record every dependency edge in decisions_file"
          skipped_units:
            meaning: "Units legitimately closed by the existing-commit skip path"
            source: "flow-audit and git-log evidence"
            fill_rule: "remaining work, context pressure, or elapsed time are not skip reasons"
          baseline_verification_file:
            meaning: "baseline verifier report produced before implementation"
            source: "baseline-verifier subagent"
            fill_rule: "existing path under .ralph/review/<plan>/"
          decisions_file:
            meaning: "execution ledger with dispatch, acceptance, commit, failure, and dependency evidence"
            source: "executor writes .ralph/agent/decisions.md"
            fill_rule: "literal .ralph/agent/decisions.md"
          reason:
            meaning: "dead-end execution failure: no deliverable commits, cannot produce verification handoff, or external unreachable blocker; plan size or predicted context pressure is not a failure"
            source: "executor evidence"
            fill_rule: "starts with unreachable / no_deliverable_commits / cannot_produce_handoff and names the observed blocker; work.failed is forbidden when completed_units is non-empty — use work.done with execution_status=partial instead"
      review.round.ready:
        required_fields:
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "stabilization_audit_file"
          - "correction_ids"
          - "plan_name"
          - "plan_path"
          - "review_round"
          - "source_topic"
          - "executor_head_sha"
          - "resolved_baseline_sha"
          - "round_base_sha"
          - "diff_patch_file"
          - "review_plan"
      review.goalalign.done:
        required_fields:
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "stabilization_audit_file"
          - "correction_ids"
          - "plan_name"
          - "plan_path"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through from plan.ready
          - "review_round"
          - "round_base_sha"
          - "diff_patch_file"
          - "dimension"
          - "findings_file"
          - "findings_count"
      review.correctness.done:
        required_fields:
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "stabilization_audit_file"
          - "correction_ids"
          - "plan_name"
          - "plan_path"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through
          - "review_round"
          - "round_base_sha"
          - "diff_patch_file"
          - "dimension"
          - "findings_file"
          - "findings_count"
      review.testing.done:
        required_fields:
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "stabilization_audit_file"
          - "correction_ids"
          - "plan_name"
          - "plan_path"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through
          - "review_round"
          - "round_base_sha"
          - "diff_patch_file"
          - "dimension"
          - "findings_file"
          - "findings_count"
      review.maintainability.done:
        required_fields:
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "stabilization_audit_file"
          - "correction_ids"
          - "plan_name"
          - "plan_path"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through
          - "review_round"
          - "round_base_sha"
          - "diff_patch_file"
          - "dimension"
          - "findings_file"
          - "findings_count"
      review.standards.done:
        required_fields:
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "stabilization_audit_file"
          - "correction_ids"
          - "plan_name"
          - "plan_path"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through
          - "review_round"
          - "round_base_sha"
          - "diff_patch_file"
          - "dimension"
          - "findings_file"
          - "findings_count"
      review.adversarial.done:
        required_fields:
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "stabilization_audit_file"
          - "correction_ids"
          - "plan_name"
          - "plan_path"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through (last dim; review-synthesizer reads it)
          - "review_round"
          - "round_base_sha"
          - "diff_patch_file"
          - "dimension"
          - "findings_file"
          - "findings_count"
      review.synthesized:
        # 2026-07-09-003 plan (U6): review-gate consumes this topic.
        # Mirror `trigger_context` and `known_fields` to the SSOT file
        # `presets/schemas/ce-executor-pipeline-loop.yml`. The fields
        # listed under `known_fields` are referenced by hint conditions
        # but are pass-through rather than gate decisions.
        known_fields:
          - "round_base_sha"
          - "diff_patch_file"
          - "synthesized_review_file"
        trigger_context:
          summary_fields:
            - "review_round"
            - "must_fix_now_count"
            - "blocking_main_conflict_count"
            - "residual_findings_count"
            - "loop_decision_basis"
            - "verdict"
            - "synthesized_review_file"
          routing_hints:
            - label: "accept_or_residual_report_only"
              conditions:
                - field: "blocking_main_conflict_count"
                  op: "eq"
                  value: 0
              guidance: "If blocking_main_conflict_count == 0: emit only review.accepted. Any residual P0/P1 findings are report-only; do not open another fix round for them."
            - label: "must_fix_only"
              conditions:
                - field: "blocking_main_conflict_count"
                  op: "gt"
                  value: 0
              guidance: "If blocking_main_conflict_count > 0 and review_round < 6: emit only fix.requested and treat only must_fix_now findings as actionable; ignore residual_findings_count for fix planning."
            - label: "max_round_blocked"
              conditions:
                - field: "review_round"
                  op: "gte"
                  value: 6
                - field: "blocking_main_conflict_count"
                  op: "gt"
                  value: 0
              guidance: "If review_round >= 6 and blocking_main_conflict_count > 0: emit only review.loop.blocked with max_review_rounds: 6. Do not request another fix round."
        required_fields:
          - "plan_name"
          - "plan_path"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through from review.adversarial.done
          - "review_round"
          - "round_base_sha"
          - "diff_patch_file"
          - "synthesized_review_file"
          - "findings_count"
          - "p0_count"
          - "p1_count"
          - "must_fix_now_count"
          - "main_conflict_count"
          - "unfixed_previous_count"
          - "new_regression_p0_count"
          - "newly_discovered_residual_count"
          - "blocking_main_conflict_count"
          - "residual_findings_count"
          - "findings_summary"
          - "loop_decision_basis"
          - "verdict"
        # 2026-07-09-001 plan U8: agent-facing field metadata
        # for the U3 enrichment layer (policy-check errors) and
        # the U6 schema-aware prompt section. Mirror this block
        # to `presets/schemas/ce-executor-pipeline-loop.yml`
        # (the SSOT) so `schema_reference_parity` lint passes.
        field_docs:
          plan_contract_version:
            meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
            source: "review-synthesizer carries forward from plan.ready"
            fill_rule: "literal copy; do NOT recompute"
          normalized_plan_file:
            meaning: "canonical semantic projection of the source plan that downstream hats read"
            source: "review-synthesizer carries forward from plan.ready"
            fill_rule: "literal copy; do NOT make up a path"
          plan_contract_digest:
            meaning: "hex digest binding the source plan and normalized_plan_file for this execution chain"
            source: "review-synthesizer carries forward from plan.ready"
            fill_rule: "literal copy; do NOT recompute"
          trace_file:
            meaning: "append-only requirement→scenario→unit trace file for this plan"
            source: "review-synthesizer carries forward from plan.ready"
            fill_rule: "literal copy; do NOT make up a path"
          review_round:
            meaning: "current convergence round (1..max_review_rounds); review-synthesizer increments"
            source: "review-synthesizer reads it from .ralph/review/<plan>/round-<n>/"
            fill_rule: "do NOT hand-write; copy the round directory name"
          synthesized_review_file:
            meaning: "path to the synthesized review file written by review-synthesizer"
            source: "review-synthesizer"
            fill_rule: "absolute path; do NOT make up a filename"
          must_fix_now_count:
            meaning: "findings classified as must_fix_now in this round; not every current-round P0/P1 is automatically a blocking loop obligation"
            source: "review-synthesizer computes from p0/p1"
            fill_rule: "integer; use blocking_main_conflict_count for the gate decision"
          main_conflict_count:
            meaning: "current findings that are the loop's main conflict: initial review P0/P1, unfixed previous obligations, or current-fix P0 regressions"
            source: "review-synthesizer classifies findings from the synthesized table and current round context"
            fill_rule: "integer; count only findings that should drive this loop, not all severe residuals"
          unfixed_previous_count:
            meaning: "prior fix-plan obligations that are still not closed in this review round"
            source: "review-synthesizer compares current findings with previous fix-plan / fix.done fixed_findings"
            fill_rule: "integer; 0 when all prior obligations are closed"
          new_regression_p0_count:
            meaning: "P0 findings clearly introduced by the current fix diff"
            source: "review-synthesizer checks evidence against the current fix diff range"
            fill_rule: "integer; evidence must point to the current fix diff, otherwise classify as residual"
          newly_discovered_residual_count:
            meaning: "new severe findings discovered after round 1 that are not current-fix regressions and therefore report-only"
            source: "review-synthesizer"
            fill_rule: "integer; these do not keep the loop open"
          blocking_main_conflict_count:
            meaning: "gate-driving count; if > 0 review-gate requests fixes or blocks at max rounds, if 0 review-gate accepts"
            source: "review-synthesizer"
            fill_rule: "integer; usually main_conflict_count, and must exclude report-only residuals"
          residual_findings_count:
            meaning: "findings kept in the report but not blocking the loop (baseline / out-of-scope / newly discovered)"
            source: "review-synthesizer"
            fill_rule: "integer; 0 means nothing left to report"
          loop_decision_basis:
            meaning: "short explanation of why the loop should continue or close"
            source: "review-synthesizer"
            fill_rule: "one short sentence; mention main conflict closure, unfixed prior obligations, or current-fix regression evidence"
          verdict:
            meaning: "final decision for the topic"
            source: "review-synthesizer"
            fill_rule: "one of pass, blocked, failed"
        examples:
          - plan_name: "2026-07-09-001-feat-policy-check-agent-feedback-plan"
            plan_path: "docs/plans/2026-07-09-001-feat-policy-check-agent-feedback-plan.md"
            review_round: 1
            must_fix_now_count: 2
            main_conflict_count: 2
            unfixed_previous_count: 0
            new_regression_p0_count: 0
            newly_discovered_residual_count: 0
            blocking_main_conflict_count: 2
            residual_findings_count: 0
            loop_decision_basis: "round 1 P0/P1 findings are initial main-conflict obligations"
            verdict: "blocked"
      review.accepted:
        # 2026-07-09-003 plan (U6): alignment consumes this topic;
        # mirror `trigger_context` to the SSOT file.
        trigger_context:
          summary_fields:
            - "review_round"
            - "must_fix_now_count"
            - "blocking_main_conflict_count"
            - "residual_findings_count"
            - "loop_decision_basis"
            - "verdict"
          routing_hints:
            - label: "alignment_after_acceptance"
              conditions:
                - field: "blocking_main_conflict_count"
                  op: "eq"
                  value: 0
              guidance: "If blocking_main_conflict_count == 0: the review round has been accepted. residual_findings_count is report-only context; do not open another fix round from alignment. Record residuals and emit align.done."
        required_fields:
          - "plan_name"
          - "plan_path"
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "review_round"
          - "executor_head_sha"
          - "resolved_baseline_sha"
          - "p0_count"
          - "p1_count"
          - "must_fix_now_count"
          - "main_conflict_count"
          - "blocking_main_conflict_count"
          - "residual_findings_count"
          - "loop_decision_basis"
          - "verdict"
        field_docs:
          plan_contract_version:
            meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
            source: "review-gate"
            fill_rule: "literal copy; do NOT recompute"
          normalized_plan_file:
            meaning: "canonical semantic projection of the source plan that downstream hats read"
            source: "review-gate"
            fill_rule: "literal copy; do NOT make up a path"
          plan_contract_digest:
            meaning: "hex digest binding the source plan and normalized_plan_file for this execution chain"
            source: "review-gate"
            fill_rule: "literal copy; do NOT recompute"
          trace_file:
            meaning: "append-only requirement→scenario→unit trace file for this plan"
            source: "review-gate"
            fill_rule: "literal copy; do NOT make up a path"
          must_fix_now_count:
            meaning: "accepted review has no remaining blocking loop obligations"
            source: "review-gate"
            fill_rule: "must be 0 when closing the loop"
          main_conflict_count:
            meaning: "main-conflict findings that remain after review-gate decision"
            source: "review-gate"
            fill_rule: "must be 0 on review.accepted"
          blocking_main_conflict_count:
            meaning: "gate-driving count; accepted only when this is 0 even if residual P0/P1 findings remain"
            source: "review-gate"
            fill_rule: "must be 0"
          loop_decision_basis:
            meaning: "short explanation of why residuals do not keep the loop open"
            source: "review-gate"
            fill_rule: "one short sentence"
          verdict:
            meaning: "must equal 'pass' on this topic; the review-gate never accepts with anything else"
            source: "review-gate"
            fill_rule: "literal string 'pass'"
      fix.requested:
        # 2026-07-09-003 plan (U6): fix-planner consumes this topic;
        # mirror `trigger_context` and `known_fields` to the SSOT file.
        known_fields:
          - "round_base_sha"
          - "diff_patch_file"
          - "synthesized_review_file"
        trigger_context:
          summary_fields:
            - "review_round"
            - "must_fix_now_count"
            - "blocking_main_conflict_count"
            - "residual_findings_count"
            - "loop_decision_basis"
            - "synthesized_review_file"
            - "diff_patch_file"
          routing_hints:
            - label: "fix_planner_must_fix_only"
              conditions:
                - field: "blocking_main_conflict_count"
                  op: "gt"
                  value: 0
              guidance: "If blocking_main_conflict_count > 0: write a full fix plan with one Unit per must_fix_now finding. residual_findings_count is report-only; do not create fix Units for residual findings."
        required_fields:
          - "plan_name"
          - "plan_path"
          - "review_round"
          - "executor_head_sha"
          - "resolved_baseline_sha"
          - "round_base_sha"
          - "diff_patch_file"
          - "synthesized_review_file"
          - "p0_count"
          - "p1_count"
          - "must_fix_now_count"
          - "main_conflict_count"
          - "unfixed_previous_count"
          - "new_regression_p0_count"
          - "newly_discovered_residual_count"
          - "blocking_main_conflict_count"
          - "residual_findings_count"
          - "findings_summary"
          - "loop_decision_basis"
          - "verdict"
        field_docs:
          round_base_sha:
            meaning: "git SHA at the start of the current review round (fixer rebases onto this)"
            source: "review-gate"
            fill_rule: "40-char git SHA; do NOT hand-write"
          diff_patch_file:
            meaning: "path to the round-N diff patch (review.* and fix.* are diff-locked to this)"
            source: "review-gate / loop runner"
            fill_rule: "absolute path under .ralph/review/<plan>/round-<n>/"
          must_fix_now_count:
            meaning: "findings that the synthesizer marked must_fix_now for this round"
            source: "review-gate"
            fill_rule: "integer >= 1 when blocking_main_conflict_count > 0"
          blocking_main_conflict_count:
            meaning: "gate-driving count for the requested fix round"
            source: "review-gate"
            fill_rule: "integer >= 1; do not request fixes for report-only residuals"
          loop_decision_basis:
            meaning: "short explanation of why the loop is still blocked"
            source: "review-gate"
            fill_rule: "one short sentence"
          verdict:
            meaning: "must equal 'blocked' on this topic; review-gate never requests fixes for a passing review"
            source: "review-gate"
            fill_rule: "literal string 'blocked'"
      review.complete:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "review_round"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through from plan.ready
          - "fix_base_sha"
          - "fix_plan_file"
          - "findings_count"
          - "p0_count"
          - "p1_count"
          - "must_fix_now_count"
          - "main_conflict_count"
          - "unfixed_previous_count"
          - "new_regression_p0_count"
          - "newly_discovered_residual_count"
          - "blocking_main_conflict_count"
          - "residual_findings_count"
          - "findings_summary"
          - "loop_decision_basis"
          - "verdict"
        field_docs:
          plan_contract_version:
            meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
            source: "fix-planner carries forward from review.synthesized"
            fill_rule: "literal copy; do NOT recompute"
