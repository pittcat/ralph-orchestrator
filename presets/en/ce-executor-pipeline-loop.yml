# ce-executor-pipeline-loop: review/fix loop single-chain plan-driven execution preset
#
# Ralph primary path (plan 2026-07-07-006): the recommended CE executor for
# plan-driven work. Single consumer per topic, flat hat-only chain, no
# runtime unit loop, no fallback rescue. Executor owns unit/subagent work
# internally; downstream hats only see a single `work.done` / `work.failed`.
#
# 15-hat topology with linear single-consumer chain + review/fix loop:
# - plan-reviewer: Reviews the plan file in-place; no per-unit breakdown, no
#   code edits. Output: plan.ready (with review_summary + plan_revised flag)
#   or plan.blocked (plan unusable).
# - executor: Whole-plan execution with TDD. Hard DoD = baseline-aware
#   verification that always runs and is classified; introduced regressions
#   are report-only (honest red delta). Any auditable deliverable commit →
#   work.done (execution_status complete|partial with the Unit bill);
#   work.failed is reserved for true dead-ends (zero deliverable commits,
#   no handoff artifact, or unreachable blocker).
#   The main executor delegates each Implementation Unit to exactly one
#   subagent, then reviews, commits, checkpoints, and emits the final event
#   itself. No runtime task breakdown (`tasks.enabled: false`).
# - test-stabilizer (2026-07-16-001 U3): post-execution test
#   stabilization gate. Subscribes to `work.done`, can modify both
#   test code and production code (with stable correction IDs and
#   new commits), and emits stabilization.done on success or
#   stabilization.blocked on unrecoverable attribution / full-suite /
#   dirty-worktree failures.
# - review-reentry: Normalizes stabilization.done / fix.done into the
#   next review round; emits review.round.ready.
# - dim:goal-alignment / dim:correctness / dim:testing / dim:maintainability /
#   dim:project-standards / dim:adversarial: Six read-only dimension hats in
#   a flat serial chain — each reviews ONE dimension for the current
#   review_round, writes a findings product file under
#   `.ralph/review/<plan>/round-XX/`, reads the canonical
#   `review.diff.patch` from that same round directory, emits EXACTLY ONE
#   done event triggering the next dimension (last dimension triggers
#   review-synthesizer). Previous rounds are preserved; never overwrite
#   round-N files from an earlier round.
# - review-synthesizer: Reads all 6 dimension products from the current
#   round directory, dedupes / merges / ranks P0-P3, writes
#   synthesized_review_file in that same round directory, emits EXACTLY ONE
#   review.synthesized.
# - review-gate: Three-way gate after synthesis. Emits review.accepted,
#   fix.requested, or review.loop.blocked. The gate uses convergence
#   semantics: only findings classified as must_fix_now keep the loop open;
#   baseline / out-of-scope / newly discovered residuals are reported but do
#   not keep creating fix rounds. Max 6 review rounds.
# - fix-planner: Reads synthesized_review_file, writes fix_plan_file in the
#   current round directory, emits EXACTLY ONE review.complete.
# - fixer: Applies the **fix-planner fix plan only** (NOT the original
#   plan), using one subagent per actionable fix Unit; empty fix plan →
#   no-op + fix.done{fixes_applied:0}.
# - alignment: Cross-checks original plan execution vs fix-plan execution
#   (separate git ranges). Records residuals; does NOT loop or block.
# - reporter: Aggregates plan change / execution / 6-dim review / fixes /
#   alignment residuals. Writes report, emits report.done + LOOP_COMPLETE.
#   Sole consumer of plan.blocked / work.failed / review.loop.blocked.
#
# Why this architecture:
#   - No multi-consumer topics: every event has exactly one subscriber
#   - No coordinator loop: the chain is flat and deterministic
#   - Dimensions are first-class hats, not parallel calls; executor may use
#     one subagent per Implementation Unit inside its own activation.
#   - Review-gate drives the loop: fix.done → review-reentry → next round,
#     or review.accepted → alignment → terminal.
#   - Verdict is single field (pass / pass_with_residuals / blocked) —
#     downstream subscribes to ONE terminal pair, never two siblings.
#
# The chain passes WAC strict lint cleanly: `EGRESS_MAX_HOPS=12` in
# `crates/ralph-core/src/preset_lint/workflow_activation.rs` covers the
# 11-hop path from `fix-planner` to `report.done` (fix-planner → fixer →
# review-reentry → 6 dim hats → review-synthesizer → review-gate →
# alignment → reporter → report.done). No topology exemption needed.
#
# No `mechanism.flow` block: this preset is a flat hat-only linear chain.
# Routing + scope enforcement come from hat triggers/publishes, isolated mode,
# and `event_policy` (topic_deny_rules + inline schemas). FlowStepScope is
# skipped at runtime when a preset does not opt into `mechanism.flow`.

topic_format_whitelist:
  - LOOP_COMPLETE

tasks:
  enabled: false

event_loop:
  execution_mode: isolated  # R3: 12 hats > 3-hat coordinator limit; per R1/R11 this preset MUST be isolated.
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  required_events: ["report.done"]
  completion_payload_match:
    topic: report.done
    fields: [report_path]
  starting_event: "work.start"
  max_iterations: 80
  max_runtime_seconds: 28800  # 8 hours
  enforce_hat_scope: true
  ephemeral_isolation: true
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    terminal_topics:
      - "LOOP_COMPLETE"
    business_topics:
      - "plan.ready"
      - "plan.blocked"
      - "work.done"
      - "work.failed"
      # 2026-07-16-001 plan U3: Test Hat business events.
      - "stabilization.done"
      - "stabilization.blocked"
      - "review.round.ready"
      - "review.goalalign.done"
      - "review.correctness.done"
      - "review.testing.done"
      - "review.maintainability.done"
      - "review.standards.done"
      - "review.adversarial.done"
      - "review.synthesized"
      - "review.accepted"
      - "fix.requested"
      - "review.complete"
      - "fix.done"
      - "review.loop.blocked"
      # review-synthesizer 的 mandatory artifact fail-close gate
      # event. Routes to reporter only.
      - "review.artifact.blocked"
      - "align.done"
      - "report.done"
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    require_emit_provenance: true
    plan_name_equality_required: true
    # plan 2026-07-22-004 U5: opt-in same-payload consistency gates.
    # The loop preset's fix.done schema is a superset of linear with the
    # same referenced-field contract (review_verdict / fixes_applied /
    # planned_fix_units / fix_status / post_verification_status /
    # new_business_regressions_count), so the identical rules apply.
    # Each rule predicates on the CURRENT fix.done payload only (never
    # event history); a hit rejects the emit with a
    # `payload_consistency:<id>` semantic gate whose message tells the
    # fixer exactly which fields contradict. Guards are deliberate:
    # rule 1 keeps `planned_fix_units non_empty` (empty-plan fast path)
    # AND `fix_status=applied` (legal partial/blocked exits) so it only
    # fires on the genuine "claimed applied but applied nothing" shape.
    payload_consistency:
      enabled: true
      rules:
        - id: fix-done-blocked-zero-fixes-applied
          topic: fix.done
          when:
            all:
              - {field: review_verdict, eq: blocked}
              - {field: fixes_applied, eq: 0}
              - {field: planned_fix_units, non_empty: true}
              - {field: fix_status, eq: applied}
          message: "fix_status=applied contradicts review_verdict=blocked with zero fixes applied and a non-empty planned_fix_units; set fix_status to partial or blocked and add failure_reason, or apply the planned fixes"
        - id: fix-done-green-with-regressions
          topic: fix.done
          when:
            all:
              - {field: new_business_regressions_count, gt: 0}
              - {field: post_verification_status, eq: green}
          message: "post_verification_status=green contradicts new_business_regressions_count>0; set post_verification_status to red or resolve the introduced regressions"
        - id: work-done-green-with-regressions
          topic: work.done
          when:
            all:
              - {field: new_business_regressions_count, gt: 0}
              - {field: post_verification_status, eq: green}
          message: "post_verification_status=green contradicts new_business_regressions_count>0; set post_verification_status to red or resolve the introduced regressions"
    # Topic-deny rules: every business topic has exactly one owner hat.
    # Every other hat is denied the topic. This is the runtime's second
    # line of defense after `publishes` declarations on each hat — if
    # any hat tries to emit a topic it does not own, the policy rejects
    # the emit with isolated_scope_violation.
    topic_deny_rules:
      # plan-reviewer owns plan.ready / plan.blocked
      - {hat_id: executor, topic: plan.ready}
      - {hat_id: dim:goal-alignment, topic: plan.ready}
      - {hat_id: dim:correctness, topic: plan.ready}
      - {hat_id: dim:testing, topic: plan.ready}
      - {hat_id: dim:maintainability, topic: plan.ready}
      - {hat_id: dim:project-standards, topic: plan.ready}
      - {hat_id: dim:adversarial, topic: plan.ready}
      - {hat_id: review-synthesizer, topic: plan.ready}
      - {hat_id: fix-planner, topic: plan.ready}
      - {hat_id: fixer, topic: plan.ready}
      - {hat_id: alignment, topic: plan.ready}
      - {hat_id: reporter, topic: plan.ready}
      - {hat_id: executor, topic: plan.blocked}
      - {hat_id: dim:goal-alignment, topic: plan.blocked}
      - {hat_id: dim:correctness, topic: plan.blocked}
      - {hat_id: dim:testing, topic: plan.blocked}
      - {hat_id: dim:maintainability, topic: plan.blocked}
      - {hat_id: dim:project-standards, topic: plan.blocked}
      - {hat_id: dim:adversarial, topic: plan.blocked}
      - {hat_id: review-synthesizer, topic: plan.blocked}
      - {hat_id: fix-planner, topic: plan.blocked}
      - {hat_id: fixer, topic: plan.blocked}
      - {hat_id: alignment, topic: plan.blocked}
      # executor owns work.done / work.failed
      - {hat_id: plan-reviewer, topic: work.done}
      - {hat_id: plan-reviewer, topic: work.failed}
      - {hat_id: dim:goal-alignment, topic: work.done}
      - {hat_id: dim:correctness, topic: work.done}
      - {hat_id: dim:testing, topic: work.done}
      - {hat_id: dim:maintainability, topic: work.done}
      - {hat_id: dim:project-standards, topic: work.done}
      - {hat_id: dim:adversarial, topic: work.done}
      - {hat_id: review-synthesizer, topic: work.done}
      - {hat_id: fix-planner, topic: work.done}
      - {hat_id: fixer, topic: work.done}
      - {hat_id: alignment, topic: work.done}
      - {hat_id: reporter, topic: work.done}
      # 2026-07-16-001 plan U3: review-reentry no longer consumes work.done
      # (test-stabilizer owns the executor→review handoff now). Keep this
      # deny so review-reentry is explicitly forbidden from publishing it.
      - {hat_id: review-reentry, topic: work.done}
      # 2026-07-16-001 plan U3: test-stabilizer is the gate, not the
      # emitter — executor remains the sole work.done owner.
      - {hat_id: test-stabilizer, topic: work.done}
      - {hat_id: plan-reviewer, topic: work.failed}
      - {hat_id: dim:goal-alignment, topic: work.failed}
      - {hat_id: dim:correctness, topic: work.failed}
      - {hat_id: dim:testing, topic: work.failed}
      - {hat_id: dim:maintainability, topic: work.failed}
