      fix.done:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "review_round"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through from review.complete
          - "fixed_from_sha"
          - "head_sha"
          - "fix_plan_file"
          - "review_verdict"
          - "fixes_applied"
          - "fixes_skipped"
          - "planned_fix_units"
          - "attempted_fix_units"
          - "completed_fix_units"
          - "skipped_fix_units"
          - "failed_fix_units"
          - "blocked_fix_units"
          - "fix_attempt_commit_sha"
          - "worktree_status"
          - "fix_status"
          - "failure_reason"
          - "decisions_file"
          - "baseline_verification_status"
          - "baseline_verification_file"
          - "post_verification_status"
          - "post_verification_file"
          - "verification_delta_file"
          - "baseline_existing_count"
          - "new_business_regressions_count"
          - "test_compatibility_updates_count"
          - "flaky_or_environmental_count"
          - "fix_summary"
          - "next_review_plan"
        field_docs:
          plan_contract_version:
            meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
            source: "fixer carries forward from review.complete"
            fill_rule: "literal copy; do NOT recompute"
          normalized_plan_file:
            meaning: "canonical semantic projection of the source plan that downstream hats read"
            source: "fixer carries forward from review.complete"
            fill_rule: "literal copy; do NOT make up a path"
          plan_contract_digest:
            meaning: "hex digest binding the source plan and normalized_plan_file for this execution chain"
            source: "fixer carries forward from review.complete"
            fill_rule: "literal copy; do NOT recompute"
          trace_file:
            meaning: "append-only requirement→scenario→unit trace file for this plan"
            source: "fixer carries forward from review.complete"
            fill_rule: "literal copy; do NOT make up a path"
          fix_status:
            meaning: "outcome of this fixer attempt; the topic is still fix.done because the fixer is handing off a complete attempt report, not claiming all fixes succeeded; blocked is reserved for true dead-end and is decoupled from review_verdict"
            source: "fixer"
            fill_rule: "one of applied, partial, blocked; blocked only when no fix Unit could be applied and no auditable progress remains — never set blocked solely because review_verdict=blocked or new_business_regressions_count > 0"
          failure_reason:
            meaning: "short reason when fix_status is partial or blocked; empty string only when fix_status is applied"
            source: "fixer verification / subagent result / blocker notes"
            fill_rule: "one short sentence; include why the fixer could not complete all actionable Units or reach green verification"
          failed_fix_units:
            meaning: "actionable fix Units attempted but not completed successfully"
            source: "fixer per-Unit execution log"
            fill_rule: "array of U tokens; [] only when no Unit failed"
          fix_attempt_commit_sha:
            meaning: "git commit SHA that captures this fixer attempt, including partial or blocked attempt evidence when changes were made"
            source: "git rev-parse HEAD after the final fixer commit"
            fill_rule: "40-char git SHA; if no files changed, use the unchanged HEAD and explain in failure_reason"
          worktree_status:
            meaning: "final git worktree state after fixer commits or reverts the attempt"
            source: "git status --porcelain --untracked-files=all (excluding .ralph/)"
            fill_rule: "clean on successful handoff; dirty only when fix_status is blocked on unowned residual dirt — never fabricate clean"
          new_business_regressions_count:
            meaning: "failures clearly introduced by the fix diff; report-only — document in verification_delta_file"
            source: "fixer / delta-verifier classifies"
            fill_rule: "integer >= 0; report-only — record in verification_delta_file; post_verification_status must honestly reflect red when > 0; fix_status=blocked is reserved for true dead-end, not for this count alone"
          flaky_or_environmental_count:
            meaning: "failures that cannot be trusted without a repro-worthy environment signal; report-only"
            source: "fixer / delta-verifier classifies"
            fill_rule: "integer >= 0; report-only — record in verification_delta_file; never force fix_status=blocked for this count alone"
      review.loop.blocked:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "review_round"
          - "max_review_rounds"
          - "executor_head_sha"
          - "resolved_baseline_sha"
          - "p0_count"
          - "p1_count"
          - "must_fix_now_count"
