      - {hat_id: plan-reviewer, topic: stabilization.done}
      - {hat_id: plan-reviewer, topic: stabilization.blocked}
      - {hat_id: executor, topic: stabilization.done}
      - {hat_id: executor, topic: stabilization.blocked}
      - {hat_id: review-reentry, topic: stabilization.done}
