            source: "review-gate writes the bundle before emitting review.loop.blocked"
            fill_rule: "write and reopen the .ralph/ bundle before emit, then provide its non-empty repo-relative path; stop instead of inventing a missing or stale path"
          max_review_rounds:
            meaning: "hard cap on the review loop (6 in ce-executor-pipeline-loop); loop.blocked fires when reached with must_fix_now > 0"
            source: "review-gate / preset"
            fill_rule: "integer; do NOT hand-write (preset constant)"
          must_fix_now_count:
            meaning: "must-fix findings still present when the loop gives up"
            source: "review-gate"
            fill_rule: "integer >= 1"
          blocking_main_conflict_count:
            meaning: "gate-driving count still open at max rounds"
            source: "review-gate"
            fill_rule: "integer >= 1"
          loop_decision_basis:
            meaning: "short explanation of the remaining main conflict"
            source: "review-gate"
            fill_rule: "one short sentence"
          reason:
            meaning: "human-readable reason the loop gave up (exceeded max_review_rounds, etc.)"
            source: "review-gate"
            fill_rule: "free text; do NOT include the synthetic 'pass' verdict"
      align.done:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "review_round"
          - "executor_head_sha"
          - "resolved_baseline_sha"  # pass-through from fix.done
          - "fix_plan_file"
          - "review_verdict"
          - "plan_executed"
          - "fix_plan_executed"
          - "residuals_count"
          - "residuals_summary"
          - "report_input_file"
        field_docs:
          report_input_file:
            meaning: "repo-relative path under .ralph/ to the report-input artifact bundle the alignment hat wrote for reporter consumption; reporter reads ONLY this file"
            source: "alignment writes the bundle before emitting align.done"
            fill_rule: "write and reopen the .ralph/ bundle before emit, then provide its non-empty repo-relative path; stop instead of inventing a missing or stale path"
      # Inline stabilization schemas keep the embedded runtime view complete.
      # the raw preset passes strict preset check without relying on
      # the schema SSOT to back-fill them at build time. Field set
      # mirrors the SSOT (presets/schemas/ce-executor-pipeline-loop.yml
      # stabilization.done / stabilization.blocked) — required_fields
      # must match the SSOT list, field_docs supply per-field meaning
      # / source / fill_rule for the agent.
      stabilization.done:
        required_fields:
          - "plan_name"
          - "plan_path"
          - "plan_contract_version"
          - "normalized_plan_file"
          - "plan_contract_digest"
          - "trace_file"
          - "review_phase"
          - "tested_from_sha"
          - "head_sha"
          - "stabilization_audit_file"
          - "correction_ids"
          - "classification_counts"
          - "worktree_status"
          - "tests_run"
          - "tests_passed"
        field_docs:
          plan_name:
            meaning: "stable identifier of the plan under stabilization; matches `plan_name` from `work.done` trigger payload"
            source: "passed-through from work.done trigger payload"
            fill_rule: "literal string; do NOT hand-write"
          plan_path:
            meaning: "repo-relative path to the source plan file"
            source: "passed-through from work.done trigger payload"
            fill_rule: "literal string; do NOT hand-write"
          plan_contract_version:
            meaning: "literal version tag of the ce-unified-plan contract; pinned at the preset level (currently 'ce-unified-plan/v1')"
            source: "preset / plan-reviewer established convention"
            fill_rule: "literal 'ce-unified-plan/v1'; do NOT hand-write"
          normalized_plan_file:
            meaning: "path to plan-reviewer's normalized plan artifact (semantic projection of the source plan); review chain anchors on it"
            source: "passed-through from plan.ready / plan-reviewer via projection"
            fill_rule: "non-empty path under .ralph/agent/normalized/<plan_name>.md; do NOT make up a path"
          plan_contract_digest:
            meaning: "hex digest binding source plan + normalized plan; review chain compares the digest rather than re-reading the source plan"
            source: "passed-through from plan.ready"
            fill_rule: "16-64 hex chars; do NOT hand-write"
          trace_file:
            meaning: "path to the append-only Requirement→Scenario→Unit tracking file"
            source: "passed-through from plan.ready"
            fill_rule: "non-empty path under .ralph/agent/trace/<plan_name>.md"
          review_phase:
            meaning: "current phase token; review chain distinguishes review rounds via this field"
            source: "test-stabilizer"
            fill_rule: "literal 'stabilization'; do NOT change"
