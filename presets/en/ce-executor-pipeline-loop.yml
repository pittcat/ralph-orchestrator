            source: "test-stabilizer"
            fill_rule: "40-char git SHA; recompute right before each emit attempt"
          stabilization_audit_file:
            meaning: "absolute path to the gate's audit markdown written under .ralph/review/<plan>/stabilization/"
            source: "test-stabilizer"
            fill_rule: "absolute path under .ralph/review/<plan>/stabilization/audit.md"
          correction_ids:
            meaning: "stable correction IDs for any production-code commits the gate produced; empty array when only test code (or nothing) was changed"
            source: "test-stabilizer"
            fill_rule: "array of strings; [] is valid but producers MUST document why an empty list is allowed alongside any production change"
          classification_counts:
            meaning: "summary of per-category failure counts observed during the full-suite run"
            source: "test-stabilizer"
            fill_rule: "object with keys test_bug, production_bug, pre_existing_failure, flaky_or_env, unattributable; integer per key"
          worktree_status:
            meaning: "real git worktree status at stabilization emit (excluding .ralph/)"
            source: "test-stabilizer"
            fill_rule: "one of clean | dirty; never fake-clean"
          tests_run:
            meaning: "total number of test cases executed during the full-suite run"
            source: "test-stabilizer"
            fill_rule: "non-negative integer; do NOT fabricate numbers"
          tests_passed:
            meaning: "number of test cases that passed during the full-suite run"
