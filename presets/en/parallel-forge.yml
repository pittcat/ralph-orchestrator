# parallel-forge (Parallel Forge): Spec-First multi-worktree parallel development
#
# Based on parallel-dev-preset.md v2.0. **execution_model: supervisor**
# (`event_loop.supervisor.enabled: true`): runtime manages per-slot worktrees,
# forge-dispatcher fans out `exec.unit.ready` waves; executor slots publish
# `exec.unit.done` / `exec.unit.failed`; supervisor injects
# `exec.wave.complete` / `exec.wave.failed` (agents must NOT emit those).
# Development concurrent via supervisor waves; integration serial; one atomic
# commit per Unit; manager Markdown report terminal.
#
# Hats: 12 spec hats + forge-dispatcher + forge-failure-handler (supervisor
# infrastructure; mirrors ce-executor-supervisor exec-wave-dispatcher /
# exec-failure-handler).
#
# Usage:
#   ralph run -H builtin:parallel-forge -p <plan-or-requirements.md>
#
# Lint / check (HARD): always use the embedded builtin so schema SSOT is merged:
#   ralph preset check -H builtin:parallel-forge --strict
# Checking `presets/en/parallel-forge.yml` by file path alone fails
# `publishes_missing_schema` because schemas live in `presets/schemas/parallel-forge.yml`
# and are merged only at build embed time.
#
# Artifacts root: `.ralph/forge/<plan-key>/`
# Lifecycle: owner=`reporter` (cleanup of unit worktrees after report);
#   writers=each producer hat; readers=downstream hats via trigger paths;
#   retention=keep until operator deletes; do not treat as runtime ledger.
#
# Artifact templates (SSOT, parallel-dev-preset.md §4 / §10.14 / §13.4 / §21):
#   Embedded in the `ralph` binary. Materialize at runtime:
#     ralph preset materialize-artifacts parallel-forge --plan-key <plan-key>
#   Default output: `.ralph/forge/<plan-key>/templates/`
#     development-plan.template.md  → development-plan.md
#     unit.template.yml             → execution-plan.yml units[]
#     execution-plan.template.yml   → execution-plan.yml
#     unit-completion.template.md   → units/<id>-completion.md
#     manager-report.template.md    → docs/reports/<date>-<task>-manager-report.md

topic_format_whitelist:
  - LOOP_COMPLETE

mechanism:
  flow:
    type: declared
    version: 1
    terminal_emits: [LOOP_COMPLETE]
    # 2026-07-28-001 plan §3.1: explicit 14-step flow authority. Each
    # cross-hat handoff uses the next step's `on`; multi-source block
    # branches use `on_any_of` on `report`. exec_wave unit topics and
    # `work.failed` are non-transition (NON_TRANSITION_TOPICS). The
    # generic positional fallback is preserved for any preset that does
    # not opt into the declared contract.
    steps:
      - id: planning
        kind: linear
        allowed_emits:
          - forge.plan.inspected
          - forge.plan.blocked
      - id: plan_authoring
        kind: linear
        "on": forge.plan.inspected
        allowed_emits:
          - forge.plan.ready
          - forge.plan.blocked
      - id: concurrency_review
        kind: linear
        "on": forge.plan.ready
        allowed_emits:
          - forge.concurrency.approved
          - forge.plan.blocked
      - id: worktree_setup
        kind: linear
        "on": forge.concurrency.approved
        allowed_emits:
          - forge.worktrees.ready
          - forge.wave.worktrees.ready
          - forge.plan.blocked
      # U7 (plan 2026-07-29-001): repeatable per-wave spine. The
      # development loop runs once per static wave. Each iteration
      # emits the wave's full handoff chain and a `forge.wave.settled`
      # terminal that triggers the next iteration's prepare (or the
      # final `forge.exec.development.done` once the plan is empty).
      # `transition_emits` controls the loop body's step ordering; the
      # outside-this-loop flow advances to `final_verify` only when the
      # last wave's `forge.wave.settled` lands.
      - id: development_loop
        kind: loop
        runs: forge.development_loop
        "on": forge.worktrees.ready
        allowed_emits:
          - forge.wave.worktrees.ready
          - forge.wave.prepare
          - exec.unit.ready
          - exec.unit.done
          - exec.unit.failed
          - exec.wave.complete
          - exec.wave.failed
          - forge.wave.reviewed
          - forge.wave.review.failed
          - forge.wave.integrated
          - forge.wave.verified
          - forge.verification.failed
          - forge.correction.requested
          - forge.correction.done
          - forge.wave.settled
          - forge.exec.development.done
          - forge.final.correction.settled
          - forge.plan.blocked
          - work.failed
        transition_emits:
          - forge.exec.development.done
          - work.failed
      - id: full_verify
        kind: linear
        "on": forge.exec.development.done
        allowed_emits:
          - forge.full.verified
          - work.failed
          - forge.report.done
      - id: audit
        kind: linear
        "on": forge.full.verified
        allowed_emits:
          - forge.audit.done
          - forge.plan.blocked
      - id: report
        kind: await
        on_any_of:
          - forge.audit.done
          - forge.plan.blocked
          - work.failed
        allowed_emits:
          - forge.report.done
      - id: plan_end
        kind: terminal
        "on": forge.report.done
        allowed_emits:
          - LOOP_COMPLETE
    repair_budget: 3
    enforce_schema: hard
    state_idempotency: required

tasks:
  enabled: true
  coordinator_hats:
    - forge-dispatcher

event_loop:
  execution_mode: isolated
  supervisor:
    enabled: true
    db_path: .ralph/supervisor.db
    max_concurrent_workers: 10
    aggregate_timeout_secs: 7200
    # A unit gets three executor attempts in total (one initial run plus
    # two retries). Every attempt is a fresh backend process resuming the
    # same worktree, and only the third failure surfaces as a wave
    # failure for the correction path.
    slot_retry_budget: 2
  ephemeral_isolation: true
  enforce_current_unit: true
  enforce_hat_scope: true
  progress_steward:
    enabled: false
  completion_promise: "LOOP_COMPLETE"
  required_events:
    - forge.report.done
  completion_payload_match:
    topic: forge.report.done
    fields: [report_path]
  path_required_events: []
  starting_event: forge.start
  max_iterations: 60
  max_runtime_seconds: 28800
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    require_emit_provenance: true
    terminal_topics:
      - LOOP_COMPLETE
    business_topics:
      - forge.plan.inspected
      - forge.plan.ready
      - forge.concurrency.approved
      - forge.worktrees.ready
      - forge.exec.development.done
      - forge.units.reviewed
      - forge.integration.done
      - forge.incremental.verified
      - forge.full.verified
      - forge.audit.done
      - forge.report.done
      - forge.plan.blocked
      - exec.unit.ready
      - exec.unit.done
      - exec.unit.failed
      - work.failed
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    topic_deny_rules:
      # Supervisor coordination topics: runtime-only (R-COORD-4).
      - {hat_id: inspector, topic: exec.wave.complete}
      - {hat_id: planner, topic: exec.wave.complete}
      - {hat_id: guardian, topic: exec.wave.complete}
      - {hat_id: worktree, topic: exec.wave.complete}
      - {hat_id: executor, topic: exec.wave.complete}
      - {hat_id: reviewer, topic: exec.wave.complete}
      - {hat_id: integrator, topic: exec.wave.complete}
      - {hat_id: forge-dispatcher, topic: exec.wave.complete}
      - {hat_id: forge-failure-handler, topic: exec.wave.complete}
      # `exec.wave.failed` is injected by the supervisor fan-in only.
      # forge-failure-handler consumes it and must never forge one.
      - {hat_id: inspector, topic: exec.wave.failed}
      - {hat_id: planner, topic: exec.wave.failed}
      - {hat_id: guardian, topic: exec.wave.failed}
      - {hat_id: worktree, topic: exec.wave.failed}
      - {hat_id: executor, topic: exec.wave.failed}
      - {hat_id: reviewer, topic: exec.wave.failed}
      - {hat_id: integrator, topic: exec.wave.failed}
      - {hat_id: forge-dispatcher, topic: exec.wave.failed}
      - {hat_id: forge-failure-handler, topic: exec.wave.failed}
      - {hat_id: executor, topic: exec.unit.ready}
      - {hat_id: reviewer, topic: exec.unit.ready}
      - {hat_id: integrator, topic: exec.unit.ready}
      # forge-dispatcher owns exec.unit.ready (wave emit).
      - {hat_id: worktree, topic: exec.unit.ready}
      - {hat_id: executor, topic: exec.unit.ready}
      - {hat_id: inspector, topic: exec.unit.ready}
      # executor owns slot terminals.
      - {hat_id: forge-dispatcher, topic: exec.unit.done}
      - {hat_id: forge-dispatcher, topic: exec.unit.failed}
      - {hat_id: reviewer, topic: exec.unit.done}
      # forge-failure-handler owns work.failed from exec path.
      - {hat_id: executor, topic: work.failed}
      - {hat_id: forge-dispatcher, topic: work.failed}
      # Per-hat topic ownership.
      - {hat_id: planner, topic: forge.plan.inspected}
      - {hat_id: guardian, topic: forge.plan.inspected}
      - {hat_id: worktree, topic: forge.plan.ready}
      - {hat_id: forge-dispatcher, topic: forge.worktrees.ready}
      - {hat_id: reviewer, topic: forge.exec.development.done}
      - {hat_id: integrator, topic: forge.units.reviewed}
      - {hat_id: reporter, topic: forge.audit.done}
      - {hat_id: inspector, topic: forge.report.done}
      - {hat_id: executor, topic: LOOP_COMPLETE}
      - {hat_id: reviewer, topic: LOOP_COMPLETE}
    payload_consistency:
      # Post-review fix (#5): `verified_base_commit` is documented as a
      # 40-char git SHA but was only `required_fields`-checked (field
      # present), so an EMPTY string passed and a lazy worktree could
      # fan out the next wave from an empty base, breaking the S5
      # trust boundary. No format/length predicate exists in the
      # whitelist (eq/ne/gt/gte/exists/non_empty), so we gate the
      # positively-detectable violation: a base that IS the empty
      # string. `eq: ""` fires (Hit => violation) exactly when the
      # producer emits an empty base; a real SHA misses and passes.
      enabled: true
      rules:
        - id: parallel-forge-prepare-empty-base
          topic: forge.wave.prepare
          when: {field: verified_base_commit, eq: ""}
          message: "verified_base_commit must be a non-empty commit SHA; an empty base breaks the lazy-worktree trust boundary."
        - id: parallel-forge-worktrees-ready-empty-base
          topic: forge.wave.worktrees.ready
          when: {field: verified_base_commit, eq: ""}
          message: "verified_base_commit must be a non-empty commit SHA; an empty base breaks the lazy-worktree trust boundary."
        - id: parallel-forge-settled-empty-base
          topic: forge.wave.settled
          when: {field: verified_base_commit, eq: ""}
          message: "verified_base_commit must be a non-empty commit SHA; the next wave's worktree base is taken from this value."

cli:
  backend: auto

core:
  guardrails:
    - "OPAC Observe: `ralph inspect loop` + `ralph tools task list`. Do not read `.ralph/events.jsonl` or `.ralph/supervisor.db`."
    - "OPAC Precheck: `ralph tools skill load ralph-tools-emit` then `ralph emit --policy-check` before every real emit (per `ralph-tools` §5)."
    - "Wave Precheck: dispatcher must `ralph wave verify --payloads-stdin` then same payloads `ralph wave emit` (per `ralph-tools-wave`)."
    - "Artifact templates: run `ralph preset materialize-artifacts parallel-forge --plan-key <plan-key>` then copy from `.ralph/forge/<plan-key>/templates/` — do not write free-form artifacts."
    - "Artifact lifecycle: `.ralph/forge/<plan-key>/` owner=reporter (cleanup unit worktrees after manager report); producers write; consumers read only via trigger/projection paths."
    - "Blocked/failed: write context artifact under blocks/ or failures/ before emit; include context_artifact_path + forge_artifact_root + plan_key."
    - "One business event per isolated activation unless reporter terminal pair (forge.report.done then LOOP_COMPLETE)."
    - "Development may be parallel; integration must be serial per execution-plan integration_order."
    - "One worktree per Unit; one atomic commit per Unit in final linear history."
    - "Never weaken tests, skip assertions, or use `.only` to pass gates."
    - "Preset check: use `-H builtin:parallel-forge` (schema SSOT merged at embed); do not rely on raw presets/en file-path check."

hats:
  inspector:
    name: "Inspector"
    description: "Reviews the operator plan/requirements and repository readiness before specification."
    triggers: [forge.start]
    publishes: [forge.plan.inspected, forge.plan.blocked]
    exempt_topics: [forge.plan.inspected, forge.plan.blocked]
    terminal_events: [forge.plan.inspected, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.start]
    instructions: |
      ## INSPECTOR MODE

      Read-only. Do not edit production code or tests.

      OPAC: `ralph-tools-opac` (auto-injected). Before emit:
      `ralph tools skill load ralph-tools-emit` then `--policy-check` per emit skill §5.

      ### Mission
      Review the operator plan/requirements and repository. Produce a Plan Inspection Report artifact, then emit exactly one business event.

      ### Steps
      1. Observe: read plan path from task/loop anchor (`ralph inspect loop`); inspect README, test entry, CI config, existing modules.
      2. Derive `plan_key` = plan basename without `.md`. Write `.ralph/forge/<plan-key>/inspection-report.md`.
      3. Success: precheck then emit `forge.plan.inspected` (`plan_usable: true`, `plan_path`, `inspection_report_path`, `plan_key`).
      4. Block: write `.ralph/forge/<plan-key>/blocks/inspector-blocked.md`, then emit `forge.plan.blocked` with `reason`, `plan_path`, `context_artifact_path`, `forge_artifact_root` (`.ralph/forge/<plan-key>/`), `plan_key`.

      Single business event only.

  planner:
    name: "Planner"
    description: "Spec-First, BDD, ATDD, Outside-In, and Unit DAG authoring (no code edits)."
    triggers: [forge.plan.inspected]
    publishes: [forge.plan.ready, forge.plan.blocked]
    exempt_topics: [forge.plan.ready, forge.plan.blocked]
    terminal_events: [forge.plan.ready, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.plan.inspected]
    instructions: |
      ## PLANNER MODE

      只写计划，不改生产代码、不 commit、不建 worktree。

      OPAC：`ralph-tools-opac`（已注入）。emit 前：`ralph tools skill load ralph-tools-emit`，再 `--policy-check`（emit skill §5）。
      materialize 细节：`ralph tools skill load ralph-tools-cmdref`「materialize-artifacts」。

      ### 模板（必须先 materialize 再复制填写）

      ```bash
      ralph preset materialize-artifacts parallel-forge --plan-key <plan-key>
      ```

      从 `.ralph/forge/<plan-key>/templates/` 复制：
      - `development-plan.template.md` → `development-plan.md`
      - `execution-plan.template.yml` + `unit.template.yml` → `execution-plan.yml`

      `<plan-key>` = 操作者 plan 文件 basename（去掉 `.md`）。

      ### 步骤 1 — Observe

      1. 读 trigger 的 `inspection_report_path`（完整读 artifact）。
      2. 读操作者 plan / `ralph inspect loop` 的 `plan_path`。
      3. 仓库发现（README、CI、测试入口、AGENTS.md/CLAUDE.md）；未确认项标 `executor_must_confirm`。

      ### 步骤 2 — Apply：development-plan.md

      1. `mkdir -p .ralph/forge/<plan-key>`
      2. 复制模板 → `development-plan.md`；**保留模板全部一级章节**；填 BDD Scenario、Outside-In、Unit DAG、TDD 拆分、门禁。
      3. 自检：每个 Scenario 有验收层级；无模糊验收。

      ### 步骤 3 — Apply：execution-plan.yml

      1. 按 templates 写 `execution-plan.yml`（含 `units[]` DAG 字段）。
      2. 校验无环；并行 Unit 无共享写冲突；设 `plan_key` / `source_plan_path` / `development_plan_path`。
      3. **`execution_wave` 在 YAML 里就是 1-based 正整数**（无依赖 = 1；
         `wave(unit) = 1 + max(wave(dep))`）。`development-plan.md` 章节标题
         也写「Wave 1..W」，与 YAML 同号；**禁止**写「Wave 0」叙事标签。

      ### 步骤 4 — Artifact-first handoff（disk 是唯一 task authority）

      不要调用任何 task mutation CLI，也不要在事件 payload 中构造
      `unit_tasks`、`unit_count`、`wave_total` 或 `execution_plan_digest`。
      runtime 会从 `execution-plan.yml` 原子派生 task key、依赖、wave 和
      integration order；payload 中出现 `unit_tasks` 会被拒收。

      写盘后自检：
      - `plan_key` 等于 `.ralph/forge/<plan-key>/` 目录名
      - `units[]` 非空且 `id` 唯一
      - `execution_wave` 从 1 开始连续，无 0、无跳号
      - 同一 wave 内 Unit 之间互不依赖
      - `integration_order` 全局唯一连续 1..N
      - 每个 `depends_on` 指向已声明 Unit，且依赖的 wave/order 更小

      ### 步骤 5 — Emit

      1. `test -f` 两个 artifact；用 `yq` 完整复核 `execution-plan.yml`。
      2. 构造 reference-only JSON payload，只含 `plan_path`、`plan_key`、
         `development_plan_path`、`execution_plan_path`。`plan_path` 从
         `ralph inspect loop` / trigger 取得，禁止手写。
      3. 先执行 `ralph emit forge.plan.ready '<JSON>' --json --policy-check`。
         CLI 会在同一 artifact snapshot 上验证 workspace 边界并加入
         canonical `plan_digest`；通过后用同一原始 JSON 去掉
         `--policy-check` 正式 emit，CLI 会确定性地加入相同 digest。
      4. path/digest/YAML/DAG 校验失败时修复 artifact 后重新 precheck；
         禁止跳过 `--policy-check`，禁止退回 payload 双写。
      5. 阻塞：写 `blocks/planner-blocked.md`，emit `forge.plan.blocked`
         （含 `reason`、`plan_path`、`context_artifact_path`、
         `forge_artifact_root`、`plan_key`）。
      6. 本 activation 仅一条业务事件。

  guardian:
    name: "Guardian"
    description: "Audits Unit DAG, shared resources, and concurrency safety."
    triggers: [forge.plan.ready]
    publishes: [forge.concurrency.approved, forge.plan.blocked]
    exempt_topics: [forge.concurrency.approved, forge.plan.blocked]
    terminal_events: [forge.concurrency.approved, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.plan.ready]
    instructions: |
      ## GUARDIAN MODE

      Read-only on code. Audit the execution plan for safe parallelism.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Mission
      Verify DAG acyclicity, shared-resource single owner, path boundaries
      (`allowed_paths` / `forbidden_paths`), and that parallel Units do not
      write the same files. Checklist (write into approval artifact):
      1. Every `depends_on` target exists; no cycles.
      2. Parallel Units (same wave / no edge) have disjoint write paths.
      3. Shared modules have exactly one Owner Unit.
      4. Foundation-before-parallel ordering is explicit in integration_order.

      ### Steps
      1. Read `development_plan_path` and `execution_plan_path` from trigger; derive `plan_key` from those paths.
      2. Write `.ralph/forge/<plan-key>/concurrency-approval.md` using the checklist above; record
         `approval_report_path` = that file (repo-relative).
      3. If safe: precheck then emit `forge.concurrency.approved` with all required fields:
         `approved: true`, `approval_report_path`, `execution_plan_path` (copy from trigger).
      4. Else: write `blocks/guardian-blocked.md`, emit `forge.plan.blocked`
         (`context_artifact_path`, `forge_artifact_root`, `plan_key`, `reason`, `plan_path`).

      Single business event only. Do not require any repo file outside trigger paths / forge artifacts.

  worktree:
    name: "Worktree"
    description: "Per-wave integration branch + lazy worktree creation from verified_base_commit."
    triggers:
      - forge.concurrency.approved
      - forge.wave.prepare
    publishes:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.plan.blocked
    exempt_topics:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.plan.blocked
    terminal_events:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.plan.blocked
    event_filter:
      enabled: true
      events:
        - forge.concurrency.approved
        - forge.wave.prepare
    instructions: |
      ## WORKTREE MODE — lazy per-wave worktrees

      U4 / R8: create worktrees **only for the current wave**, never
      for future waves. The trigger carries an explicit
      `verified_base_commit`; only honour it after `git cat-file -t`
      proves it is a real commit. If the commit does not exist or
      the branch/path already exists with a different SHA, fail
      closed — never rebase / reset / force push.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Task visibility（红线）

      本 hat **不在** `tasks.coordinator_hats` 中，所有 unit task 的
      `owner_hat_id` 都是 `executor`。你可能会在 prompt 里看到
      `<ready-tasks>` 列表（runtime 注入），但那些 task 对你
      **只读可见，不可 mutate**。

      **禁止**调用任何 task lifecycle mutation：

      - 禁止 `ralph tools task start <id>` — 会被 runtime 拒（owner≠worktree）
      - 禁止 `ralph tools task close <id>` — 同上
      - 禁止 `ralph tools task fail <id>` / `ralph tools task reopen <id>` — 同上
      - 禁止 `ralph tools task add` / `ralph tools task ensure` — 非 coordinator 拒绝

      唯一允许的 task 命令是只读：`ralph tools task list` /
      `ralph tools task show` / `ralph tools task ready`，且**仅用于
      定位 unit 元数据**（例如对 `task_key` 反查 `unit_id`）。
      撞 ACL（exit≠0 含 "owned by hat"）**不要重试**——继续按
      Mission 走 worktree 创建，task 由 dispatcher / executor 管。

      ### Mission
      - On `forge.concurrency.approved`: create the integration
        branch (or reuse it) and emit `forge.worktrees.ready` with
        the **first** wave's worktree map (R5: minimum open wave
        index from the plan).
      - On each `forge.wave.prepare`: ensure the named branch /
        worktree exists at `verified_base_commit`, then emit
        `forge.wave.worktrees.ready` with the wave-scoped map.
        Future waves are **absent** from the map.

      Worktrees are cleaned by **reporter** after the manager
      report (lifecycle owner). When reused, the prior wave's
      runtime record is archived to the worktree's
      `.ralph/reuse-history/` first, matching the
      `--worktree --reuse-worktree` rule.
      1. Read `execution_plan_path` from trigger; derive `plan_key`; run from main repo root (`git worktree list` first entry).
      2. Create integration branch; record `base_commit` after Foundation units land.
      3. For each parallel Unit: `git worktree add` + dedicated branch (one worktree per Unit).
      4. Write `.ralph/forge/<plan-key>/worktree-map.yml` (unit → branch → path).
      5. Precheck then emit `forge.worktrees.ready` including `plan_key`, `worktree_map_path`, `execution_plan_path`, `integration_branch`, `base_commit`.
      6. On failure: write `blocks/worktree-blocked.md`, emit `forge.plan.blocked` with context paths.

      Do not delete worktrees in this hat. Single business event only.

  forge-dispatcher:
    name: "Forge Dispatcher"
    description: "Supervisor exec-wave dispatcher: static-wave fan-out from execution-plan.yml via ralph wave emit exec.unit.ready."
    triggers:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.wave.settled
    trigger_multi_consumer_topics:
      - forge.wave.worktrees.ready
      - forge.wave.settled
    publishes:
      - exec.unit.ready
      - forge.wave.prepare
      - forge.exec.development.done
    event_filter:
      enabled: true
      events:
        - forge.wave.worktrees.ready
        - forge.worktrees.ready
        - forge.wave.settled
    exempt_topics:
      - exec.unit.ready
      - forge.wave.prepare
      - forge.exec.development.done
    terminal_events:
      - exec.unit.ready
      - forge.wave.prepare
      - forge.exec.development.done
    instructions: |
      ## FORGE DISPATCHER MODE — Static-wave fan-out

      Dispatcher hat for `event_loop.supervisor.enabled: true`. The
      execution plan's **static** `execution_wave` field is the
      single source of truth for which Units may run now. You never
      recompute the ready set from task state or dependency edges.
      The integration_order / execution_wave schedule was
      validated by Guardian and remains valid until plan revocation.

      OPAC: follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm.
      Load on demand: `ralph tools skill load ralph-tools-wave` (red box)
      and `ralph tools skill load ralph-tools-emit` (§5 precheck).

      ### Role boundary — you dispatch, you do not implement

      - You only **dispatch**: read the execution plan, pick the next
        wave, and emit `ralph wave emit exec.unit.ready --payloads-stdin`
        for the ready units. You never implement any Unit.
      - The `<ready-tasks>` block in your prompt is **read-only** for
        you. Unit tasks are owned by `executor`; the prompt may mark
        them `[read-only]` even though you have lifecycle rights for
        coordination. Do **not** `ralph tools task start` a unit task,
        do not write Unit code, do not commit Unit output.
      - If you cannot dispatch this round (no open wave, payload
        construction fails, etc.), emit only the failure / advance
        topic your `publishes` allow. Do **not** "help out" by
        implementing a Unit yourself.

      ### Single-shot budget

      Per activation publish **at most one** of:
      - one `ralph wave emit exec.unit.ready --payloads-stdin` batch (current wave fan-out), OR
      - `ralph emit forge.wave.prepare` (request next wave's worktree creation), OR
      - `ralph emit forge.exec.development.done` (all waves settled).

      Do **not** publish supervisor fan-in topics (`exec.wave.*`).
      The runtime injects those after slot fan-in. Your triggers
      may *receive* fan-in signals; you never write them.

      ### Static wave selection

      U4 / R5: read `execution_plan_path` from the trigger. Find
      the **smallest** `wave_index` whose Units are still open in
      `ralph tools task list`. If no open wave exists, transition
      to `forge.exec.development.done` (after U5 has settled
      the previous wave). Re-entry on the same `wave_id` is
      idempotent — never re-prepare a wave that already has
      `forge.worktrees.ready`.

      ### Wave payload (per ready unit) — required fields

      Sort by `integration_order` ascending (ties broken by `unit_id`).
      For each unit look up the **live** `task_id` / `task_key` from
      `ralph tools task list`; never hand-write `task_id`. Include
      `wave_id`, `slot_index`, `unit_id`, `plan_key`,
      `execution_plan_path`, `worktree_map_path` (from the trigger
      / projection).

      ### Wave OPAC (HARD)

      1. Build payloads.jsonl (one JSON object per ready unit).
      2. `cat payloads.jsonl | ralph wave verify exec.unit.ready --payloads-stdin`
         — must succeed (ticket). **Do not skip verify.**
      3. Same unmodified payloads:
         `cat payloads.jsonl | ralph wave emit exec.unit.ready --payloads-stdin`
      4. Confirm with `ralph wave inspect <wave_id>` (not events.jsonl).

      Schema `--policy-check` alone is **not** a substitute for `wave verify`.

      ### On worktrees-ready, settlement, or supervisor fan-in re-entry

      1. Read `execution_plan_path`, `worktree_map_path`, `plan_key`,
         `verified_base_commit` from trigger/projection.
      2. If `forge.wave.settled` just landed: select the next
         static wave (smallest open wave_index) and emit
         `forge.wave.prepare` with the new wave's Unit ids and
         the **settled** `verified_base_commit` (the new verified
         base that Settlement just pinned).
      3. If `forge.wave.worktrees.ready` just landed: ready set
         = that wave's Unit ids; sort by `integration_order`; verify
         → wave emit.
      4. If every static wave is settled and no open tasks remain:
         emit `forge.exec.development.done` (`execution_plan_path`,
         counts, `plan_key`).

  forge-failure-handler:
    name: "Forge Failure Handler"
    description: "Routes execution/review/verification failures to bounded wave-fixer correction; never short-circuits to work.failed."
    triggers:
      - exec.wave.failed
      - forge.wave.review.failed
      - forge.verification.failed
    publishes:
      - forge.correction.requested
      - forge.final.correction.settled
      - forge.plan.blocked
      - work.failed
    exempt_topics:
      - forge.correction.requested
      - forge.final.correction.settled
      - forge.plan.blocked
      - work.failed
    terminal_events:
      - forge.correction.requested
      - forge.final.correction.settled
      - forge.plan.blocked
      - work.failed
    event_filter:
      enabled: true
      events:
        - exec.wave.failed
        - forge.wave.review.failed
        - forge.verification.failed
    instructions: |
      ## FORGE FAILURE HANDLER MODE — evidence-first correction

      U6 / R16–R24: a **single** failure event never terminates
      the plan. Route to `forge.correction.requested` instead.
      `work.failed` is reserved for the 3-round exhaustion + 90/75
      confidence gate.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### 当 trigger 是 `exec.wave.failed`（执行波次整体失败）

      这条 trigger 的 payload 只有 `wave_id`、`reason`、
      `blocking_slots`、`slot_failures`（每项含 `slot_index` /
      `reason` / `failure_class`）、`salvaged_slots`、
      `redrive_slots`。它**没有** `plan_key` / `wave_index` /
      `execution_plan_path` / `worktree_map_path` /
      `failure_fingerprint`，下面四步先把它们补齐再进入通用 Steps。

      收到这条 trigger 说明每个 `blocking_slots` 里的槽位都已经用光了
      自己的全部尝试（每次都是新进程接着同一个 worktree 继续做），不是
      只失败过一次。别再指望"重跑一遍就好"，correction 必须针对根因。

      - **永久失败先分流**。若 `slot_failures` 中**每一项**的
        `failure_class` 都是 `identity_mismatch` 或 `unknown`，
        再修也不会变，别烧 correction 轮次：按
        `blocks/forge-failure-handler-blocked.md` 写清哪些 slot、
        哪些 `failure_class`，然后 emit 一条
        `forge.plan.blocked`（`reason` / `plan_path` /
        `context_artifact_path` / `forge_artifact_root` /
        `plan_key`）并结束本轮。只要有一项是 `timeout` /
        `orphan_or_empty_result` / `required_slot_failure` /
        `cancel`，就说明活可能干了一半，继续往下走。
      - **补齐 wave 上下文**。`plan_key`、`wave_index`、
        `execution_plan_path`、`worktree_map_path`、
        `verified_base_commit` 从 projection 里本 `wave_id` 的
        `forge.wave.prepare` / `forge.wave.worktrees.ready` 取；
        对不上 `wave_id` 的一律不用。
      - **slot 映射回 unit**。用 `worktree_map_path` 把
        `blocking_slots` 的每个 `slot_index` 映射成 `unit_id` 和
        `candidate_branch`，得到 `affected_unit_ids`；
        `affected_task_ids` 用 `ralph tools task list` 取 live id
        （字段约束见 `ralph-tools-tasks` red box，禁止手写
        `task_id`）。
      - **合成 `failure_fingerprint`**。执行波次失败没有上游
        fingerprint，自己按固定格式拼一个，使同一组 slot 以同样方式
        再失败时得到同一个值（否则重复轮次检测失效）：
        `exec:<wave_id>:<blocking_slots 升序逗号连接>:<failure_class
        去重升序逗号连接>`。

      补齐后按下面 Steps 的 2-6 继续，`failure_topic` 记
      `exec.wave.failed`。`salvaged_slots` 里的 Unit 已经完成，
      不要放进 `affected_unit_ids`。`redrive_slots` 只是信息字段，
      你无权重新派发 worker——修复只能由 correction 完成。

      ### Steps
      1. Read wave_id, wave_index, failure_fingerprint, affected_task_ids from the trigger.
      2. Read `ralph tools task list` to confirm ids are live; record `correction_round` from `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/counter` (start at 0).
      3. Scan `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/` for prior round
         fingerprints; reject duplicate-round requests (no confidence gain).
      4. Read `execution_plan_path` from trigger / projection.
         Derive `allowed_paths` from each `affected_unit_ids`'s
         `unit.template.yml` `allowed_paths`; `forbidden_paths` is the
         complement of the union.
      5. Write `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/round-<n>.md`
         (round, fingerprint, scope, evidence path).
      6. Emit `forge.correction.requested` with `correction_request_path`.

      ### Final correction (3 rounds exhausted)

      When the round counter is 3 the budget is exhausted. You have
      exactly one decision to make, and the two terminal emits are
      mutually exclusive (at most one of them per activation):

      - **Hand off to the final full tester** (preferred path when
        the failure is not a dead-end): emit exactly one
        `forge.final.correction.settled` with `correction_round: 3`
        + `plan_key` + `wave_id` + `verification_log_path`. The
        `correction_round` field is runtime-validated to be exactly
        `3` (the budget-exhausted final round); emitting it at an
        earlier round is rejected. Use `ralph tools task list` (or
        the trigger payload) for the live `wave_id` / `plan_key`.
      - **Dead-end escape** (only when the fail-confidence-rubric
        scores confidence ≥90 + coverage ≥75 AND the dead-end
        precheck passes): emit exactly one `work.failed` with
        `dead_end_confidence` + `dead_end_evidence_*` + `reason` +
        `plan_path` + `context_artifact_path` + `forge_artifact_root`
        + `plan_key`. Do NOT also emit `forge.final.correction.settled`.

      9. Never re-emit round 4. Never emit both terminal events for
         the same exhaustion. After either terminal emit, do not
         re-dispatch workers.

  executor:
    name: "Executor"
    description: "Per-slot TDD implementation in an isolated worktree for one Unit."
    concurrency: 4
    timeout: 3600
    idle_heartbeat_secs: 600
    idle_weak_signal_cap: 8
    # Cold-start grace window (mirrors ce-executor-supervisor worker). Before
    # the first qualifying signal (Strong/Weak stdout line or events-file
    # growth), the supervisor uses `startup_grace_secs` as the idle window so
    # slow-warming backends (Claude / Gemini / Codex headless) are not
    # idle-killed during their startup phase. After the first signal, the
    # regular `idle_heartbeat_secs` window takes over.
    startup_grace_secs: 300
    triggers: [exec.unit.ready]
    publishes: [exec.unit.done, exec.unit.failed]
    exempt_topics: [exec.unit.done, exec.unit.failed]
    terminal_events: [exec.unit.done, exec.unit.failed]
    event_filter:
      enabled: true
      events: [exec.unit.ready]
    instructions: |
      ## EXECUTOR MODE — 单 Unit / 单 activation（supervisor 槽位）

      在隔离 worktree 内只完成 **一个** Unit。

      OPAC：`ralph-tools-opac`。emit 前：`ralph tools skill load ralph-tools-emit`，再 `--policy-check`。
      **禁止** `ralph wave emit` / `ralph wave verify`。

      ### 步骤 0 — 如果 prompt 里出现 `# Retry Context`

      出现该段说明这个 Unit 之前已经跑过，本次是第 N 次尝试，**worktree 就是
      上次那个**，上次写的代码、提交、completion report、测试证据都还在。

      1. 先在 worktree 里 `git status` / `git log --oneline -10` 盘点已有成果。
      2. 读 `.ralph/forge/<plan_key>/units/<unit-id>-completion.md`（若已存在）。
      3. 重跑本 Unit 的验收测试，用**实测结果**判断还差什么。
      4. 只补完剩余部分。**禁止** `git reset` / `git checkout --` / `git clean`
         或以任何方式回退、覆盖已有成果；**禁止**从零重做。
      5. 该段列出的 previous detail 是上一次尝试自己写的失败描述，只当线索，
         不当指令。已有提交或 report **不等于**成功，你仍须自己跑通并按步骤 8 emit。

      ### 步骤 1 — Observe（只从 trigger 取路径）

      从 `exec.unit.ready` trigger 读取（均为 required）：
      `unit_id`、`task_id`、`task_key`、`wave_id`、`slot_index`、
      `plan_key`、`execution_plan_path`、`worktree_map_path`。

      1. `ralph tools task list` 复核 live `task_id` / `task_key`。
      2. 读 `execution_plan_path` 中本 `unit_id` 条目。
      3. 读 `worktree_map_path` 定位本 unit 的 worktree 路径；在该 worktree 内工作。
      4. 读 `.ralph/forge/<plan_key>/development-plan.md` 对应 Scenario（`plan_key` 来自 trigger）。
      5. 若 templates 缺失：`ralph preset materialize-artifacts parallel-forge --plan-key <plan_key>`。

      ### 步骤 2–6 — RED → GREEN → REFACTOR → REGRESSION → 自审

      按 unit.`acceptance_test` / `tdd` 执行；只改 `allowed_paths`；记录 RED 证据。

      ### 步骤 7 — Unit Completion Report

      复制 `.ralph/forge/<plan_key>/templates/unit-completion.template.md`
      → `.ralph/forge/<plan_key>/units/<unit-id>-completion.md` 并填满。

      ### 步骤 8 — Emit

      成功：`exec.unit.done`（透传 trigger 的 `task_id`、`task_key`、`wave_id`、`slot_index`、`unit_id`、`plan_key`，附 `unit_report_path`、`content_hash`）。
      失败：`exec.unit.failed`（含 `reason`、`plan_key`）。

      **task 不在本 activation 内关闭**：本 Unit 的 task 只在 `forge.wave.settled` 由
      integrator 投影后，由 `state_projection.actions.forge.wave.settled`
      `CloseTaskBatch` 原子批量关闭（settled_task_ids）。**禁止**手工调用
      `ralph tools task close` 或在指令里暗示 `exec.unit.done` 会关 task。

      本 activation 仅一条业务事件。

  reviewer:
    name: "Reviewer"
    description: "Per-wave independent review after supervisor fan-in; emits forge.wave.reviewed (accept) or forge.wave.review.failed (reject)."
    triggers: [forge.wave.worktrees.ready, exec.wave.complete, forge.correction.done]
    trigger_multi_consumer_topics:
      - forge.wave.worktrees.ready
      - exec.wave.complete
      - forge.correction.done
    publishes: [forge.wave.reviewed, forge.wave.review.failed, forge.units.reviewed, forge.plan.blocked]
    exempt_topics: [forge.wave.reviewed, forge.wave.review.failed, forge.units.reviewed, forge.plan.blocked]
    terminal_events: [forge.wave.reviewed, forge.wave.review.failed, forge.units.reviewed, forge.plan.blocked]
    event_filter:
      enabled: true
      events:
        - forge.wave.worktrees.ready
        - exec.wave.complete
        - forge.correction.done
    instructions: |
      ## REVIEWER MODE

      Read-only on code. Review each completed Unit after supervisor development phase.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. 从 trigger 读 `wave_id` / `wave_index` / `wave_total` /
         `unit_verdicts` / `execution_plan_path` / `plan_key`。
         trigger 入口固定为 `forge.wave.worktrees.ready` /
         `exec.wave.complete` / `forge.correction.done`（per U3
         event_filter 三选一）。
      2. 列 unit：execution-plan + `ralph tools task list`。
      3. 每 unit：读 `.ralph/forge/<plan_key>/units/<unit-id>-completion.md`；按 worktree-map 跳进 unit worktree 看 diff。
      4. 写 `.ralph/forge/<plan_key>/reviews/<unit-id>-review.md` 与 `reviews/summary.md`。
      5. 全 APPROVED：emit `forge.wave.reviewed`（`wave_id`、`wave_index`、`unit_verdicts`、`aggregate_verdict: ACCEPTED`、`review_report_path`、`plan_key`）。
      6. 否则：写 `waves/<wave_id>/failure-observation.md`，emit `forge.wave.review.failed`（`failure_fingerprint` = kind + command + base SHA、`unit_verdicts`、`affected_task_ids`、`failure_observation_path`、`plan_key`）。forge-failure-handler 接管下一步。

      **禁止** emit `forge.units.reviewed`（旧 topic 仍保留在 `publishes` 作兼容别名；不在主路径上）。
      **禁止** 直接 `work.failed` —— 失败走 `forge.wave.review.failed` observation。

      单条业务事件 / activation。

  wave-fixer:
    name: "Wave Fixer"
    description: "Bounded correction agent for failed wave; modifies only failed Units' paths on candidate branch."
    triggers: [forge.correction.requested]
    publishes: [forge.correction.done, forge.plan.blocked]
    exempt_topics: [forge.correction.done, forge.plan.blocked]
    terminal_events: [forge.correction.done, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.correction.requested]
    instructions: |
      ## WAVE FIXER MODE

      U6 / R20 / R21: bounded correction agent. You share the same
      isolated worktree semantics as the executor slot. You **only**
      touch files in `allowed_paths`; any change outside is a hard
      block (`forge.plan.blocked`).

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. Read `wave_id`, `wave_index`, `correction_round`, `affected_unit_ids`,
         `allowed_paths`, `forbidden_paths`, `base_commit`, `candidate_branch`,
         `failure_fingerprint` from `forge.correction.requested`.
      2. Check candidate branch ref; checkout fixer's own worktree
         at `base_commit`. Never reset or force push.
      3. Read `.ralph/forge/<plan-key>/waves/<wave_id>/failure-observation.md`
         (or `verification-failure.md`) for the prior failure context.
      4. Apply the minimum fix; run **only** the affected Units'
         focused tests; commit on candidate branch.
      5. Write `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/round-<n>/report.md`.
      6. Emit `forge.correction.done` (`commit_sha`, `affected_unit_ids`,
         `correction_report_path`).

      Re-review/reverify happens next: reviewer → integrator → verifier
      must re-run before any settlement. The next wave's
      `forge.wave.settled` is the only place tasks move to closed.

  integrator:
    name: "Integrator"
    description: "Per-wave sequential rebase/merge of approved Units; emits forge.wave.integrated then fast-forwards and emits forge.wave.settled."
    triggers: [forge.wave.reviewed, forge.wave.verified]
    publishes: [forge.wave.integrated, forge.wave.settled, forge.integration.done, work.failed]
    exempt_topics: [forge.wave.integrated, forge.wave.settled, forge.integration.done, work.failed]
    terminal_events: [forge.wave.integrated, forge.wave.settled, forge.integration.done, work.failed]
    event_filter:
      enabled: true
      events:
        - forge.wave.reviewed
        - forge.wave.verified
    instructions: |
      ## INTEGRATOR MODE

      Serial integration only — development was parallel; integration is strictly ordered.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. **入口一**（`forge.wave.reviewed`）：reviewer 接受，开始 candidate 写入。
         从 trigger 取 `all_approved` / `execution_plan_path` / `plan_key` / `unit_verdicts` /
         `review_report_path`。任一 unit REJECTED → 写 `waves/<wave_id>/failure-observation.md`，
         emit `forge.wave.integration.failed`（schema 字段 + `failure_fingerprint` /
         `affected_task_ids` / `affected_unit_ids`）；**禁止** 直接 `work.failed`。
      2. **入口二**（`forge.wave.verified`）：verifier 通过。正式 FF `integration_branch`。
         从 trigger 取 `verification_log_path` / `integration_branch` / `verified_base_commit` /
         `candidate_commit_sha` / `settled_unit_ids` / `plan_key`。
      3. 读取 `integration_branch`：从 worktree-map / projection `forge.integration_branch`；
         用真名，不要发明；`git branch --list` 在主仓确认。
      4. 按 `integration_order` 逐 unit rebase → squash → FF merge；append `integration-log.md`。
      5. 写 `.ralph/forge/<plan_key>/integration-log.md` + `commit-map.yml`。
      6. 校验线性历史（一 unit / 一 commit；无 merge/WIP tail）。
      7. 入口一成功：emit `forge.wave.integrated`（`integration_branch`、`integration_log_path`、
         `integration_complete`、`commit_map_path`、`linear_history`、`plan_key` 等 schema 字段）。
      8. 入口二成功：emit `forge.wave.settled`（`wave_id`、`wave_index`、`settled_task_ids`、
         `settled_unit_ids`、`verified_base_commit`、`plan_key`、`settlement_log_path`）。
         **任务关闭由 runtime 在收到 `forge.wave.settled` 时通过 `CloseTaskBatch` 投影原子批量完成**；
         本 hat 不调用 `ralph tools task close`。
      9. 失败：写 `failures/integrator-failed.md` + 模板 `wave-failure.template.md` /
         `merge-conflict.template.md`（per case），emit 对应 `forge.wave.integration.failed`
         或 `forge.wave.settled` 缺路径的 `plan.blocked`；**禁止** 直接 `work.failed`。

      单 activation 一条业务事件（终态发 `forge.wave.integrated` /
      `forge.wave.settled`；非终态失败发对应 `forge.wave.integration.failed` /
      `plan.blocked`，不要再补 `work.failed`）。

      主路径只用新 topic；旧 `forge.integration.done` 仅作兼容别名保留在
      `publishes`，禁止在 steps 里 emit。

  verifier:
    name: "Verifier"
    description: "Per-wave verification on candidate HEAD; emits forge.wave.verified (pass) or forge.verification.failed (fail)."
    triggers: [forge.wave.integrated, forge.integration.done]
    publishes: [forge.wave.verified, forge.verification.failed, work.failed]
    exempt_topics: [forge.wave.verified, forge.verification.failed, work.failed]
    terminal_events: [forge.wave.verified, forge.verification.failed, work.failed]
    event_filter:
      enabled: true
      events:
        - forge.wave.integrated
        - forge.integration.done
    instructions: |
      ## VERIFIER MODE

      Run incremental regression per integrated Unit chain.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. 从 trigger 读 `integration_log_path` / `integration_branch` /
         `verified_base_commit` / `plan_key`。trigger 入口固定为
         `forge.wave.integrated` / `forge.integration.done`（后者仅兼容别名）。
      2. 按 development-plan / execution-plan 跑 incremental test 命令。
      3. 写 `.ralph/forge/<plan_key>/incremental-verification.md`。
      4. 成功：emit `forge.wave.verified`（`wave_id`、`wave_index`、
         `verification_log_path`、`passed`、`last_integrated_unit`、
         `candidate_commit_sha`、`plan_key`）。
      5. 失败：写 `failures/verifier-failed.md`（建议用 `wave-failure.template.md`
         骨架），emit `forge.verification.failed`（`wave_id`、`wave_index`、
         `candidate_commit_sha`、`failure_fingerprint`、`affected_task_ids`、
         `plan_key`、`verification_failure_path`）。
         **禁止** 直接 `work.failed`（plan 005 G5）；forge-failure-handler
         接管下一轮。

      单 activation 一条业务事件；主路径只用新 topic `forge.wave.verified` /
      `forge.verification.failed`，旧 `forge.incremental.verified` 仅在
      `publishes` 中作兼容别名保留。

  tester:
    name: "Tester"
    description: "Full regression and CI-equivalent gates after all Units integrated."
    triggers: [forge.exec.development.done, forge.final.correction.settled]
    publishes: [forge.full.verified, work.failed]
    exempt_topics: [forge.full.verified, work.failed]
    terminal_events: [forge.full.verified, work.failed]
    event_filter:
      enabled: true
      events:
        - forge.exec.development.done
        - forge.final.correction.settled
    instructions: |
      ## TESTER MODE

      Full project verification — not only unit tests.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. 从 trigger 读 `verification_log_path`（或 final correction 的 `correction_report_path`）/
         `plan_key`。trigger 入口为 `forge.exec.development.done`（首次全测）或
         `forge.final.correction.settled`（3 轮 correction 耗尽后全测）。
      2. 跑 development-plan / repo README+CI+Makefile 中声明的全量 test / lint /
         build / typecheck 命令（per `ralph-tools-cmdref` 「materialize-artifacts」）。
      3. 写 `.ralph/forge/<plan_key>/full-verification.md`。
      4. 成功：emit `forge.full.verified`（`verification_report_path`、
         `all_required_passed`、`plan_key`）。
      5. 失败：写 `failures/tester-failed.md`（模板 `wave-failure.template.md`），
         emit `forge.full.verification.failed` observation（schema 字段）；
         **禁止** 直接 `work.failed` —— 失败走 observation，forge-failure-handler
         接管是否进入 final correction（3 轮后 emit `forge.final.correction.settled`）。

      单 activation 一条业务事件；主路径只发 `forge.full.verified` /
      `forge.full.verification.failed`。

  auditor:
    name: "Auditor"
    description: "Final delivery audit: plan traceability, git history, tests, workspace cleanliness."
    triggers: [forge.full.verified]
    publishes: [forge.audit.done, forge.plan.blocked]
    exempt_topics: [forge.audit.done, forge.plan.blocked]
    terminal_events: [forge.audit.done, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.full.verified]
    instructions: |
      ## AUDITOR MODE

      Read-only audit. Verdict: ACCEPTED | REJECTED | BLOCKED.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. From trigger read `verification_report_path` and `plan_key`.
      2. Cross-check requirements→scenarios→tests→commits using artifacts under `.ralph/forge/<plan_key>/` (paths from trigger/projection only).
      3. Verify linear git history, clean worktree, no skipped tests.
      4. Write `.ralph/forge/<plan_key>/final-audit.md`.
      5. Emit `forge.audit.done` (`verdict`, `audit_report_path`, `plan_key`) or write `blocks/auditor-blocked.md` and emit `forge.plan.blocked` with context paths.

      Single business event.

  reporter:
    name: "Reporter"
    description: "Writes manager-readable Markdown report; terminal hat."
    triggers: [forge.audit.done, forge.plan.blocked, work.failed, forge.units.reviewed]
    publishes: [forge.report.done, LOOP_COMPLETE]
    exempt_topics: [forge.report.done, LOOP_COMPLETE]
    terminal_events: [forge.report.done, LOOP_COMPLETE]
    event_filter:
      enabled: true
      events: [forge.audit.done, forge.plan.blocked, work.failed]
    instructions: |
      ## REPORTER MODE — 终态 hat

      只读聚合 + 写报告；不改生产代码。OPAC：`ralph-tools-opac`。
      emit 前：`ralph tools skill load ralph-tools-emit`，再 `--policy-check`。
      materialize：`ralph tools skill load ralph-tools-cmdref`「materialize-artifacts」。

      ### Lifecycle（本 hat 是 forge artifact / worktree 清理 owner）

      写完 manager report 并确认后：若存在 `worktree_map_path`（projection 或
      `.ralph/forge/<plan_key>/worktree-map.yml`），对 map 中每个 unit worktree
      执行 `git worktree remove`（失败记入报告附录，不阻断 LOOP_COMPLETE）。
      不删 `.ralph/forge/<plan_key>/` 业务文件（留给操作者）。

      ### 模板

      若 templates 目录不存在：
      `ralph preset materialize-artifacts parallel-forge --plan-key <plan_key>`
      复制 `manager-report.template.md` →
      `docs/reports/<YYYY-MM-DD>-<task-name>-manager-report.md`

      ### 步骤 1 — Observe（artifact-first，禁止扫 event history）

      **从当前 trigger 取路径**（不要猜）：
      - `forge.audit.done`：`audit_report_path`、`verdict`、`plan_key`
      - `forge.plan.blocked` / `work.failed`：`context_artifact_path`、
        `forge_artifact_root`、`plan_key`、`reason`、`plan_path`

      若 trigger 是 `forge.plan.blocked` 且 payload 缺 `plan_key` /
      `context_artifact_path`，从 `.ralph/forge/` 下唯一子目录名解析
      `plan_key`，再读对应 `worktree-map.yml` / `execution-plan.yml` 兜底；
      仍无法解析时，报告写「信息缺失，无法确认」并把 `status=BLOCKED`、
      `final_audit=BLOCKED`。

      再读 trigger/projection 指向的完整 artifact：
      - `<forge_artifact_root>/development-plan.md`、`execution-plan.yml`
      - `units/*-completion.md`、`reviews/summary.md`（若存在）
      - `integration-log.md`、`full-verification.md`、`final-audit.md`（若存在）
      - 以及 `context_artifact_path` 全文

      缺失写「信息缺失，无法确认」。

      ### 步骤 2 — Apply：按模板逐节填写

      保留模板章节；为每个 Unit 复制 Unit 小节；填自检清单。

      ### 步骤 3 — status 映射

      | 来源 | report `status` / `final_audit` |
      |---|---|
      | Auditor ACCEPTED | COMPLETED / ACCEPTED |
      | Auditor REJECTED（整体不可交付） | FAILED / REJECTED |
      | Auditor REJECTED（部分） | PARTIAL / REJECTED |
      | Auditor BLOCKED 或 `forge.plan.blocked` | BLOCKED / BLOCKED |
      | `work.failed` | FAILED / FAILED |

      ### 步骤 4 — Confirm & emit

      1. `test -f` 报告路径；记下同一 `report_path`。
      2. 先 `ralph emit forge.report.done --policy-check`（payload 含
         `report_path`、`status`、`final_audit`、`plan_key`），通过后再去掉
         `--policy-check` 真正写盘。若 `--policy-check` 失败或正式 emit 被
         runtime 拒收（拒收原因如 `flow_unknown_emit`），**禁止** emit
         `LOOP_COMPLETE` 或任何其他业务事件 — 跳过 `forge.report.done` 直接
         发 `LOOP_COMPLETE` 必被 required_events 门禁拒收。把拒收原因与当前
         trigger 上下文写入报告附录后停止本轮（遵守单业务事件预算 + Resume
         规则，让 `ralph run` 自然结束）。
      3. 再 emit `LOOP_COMPLETE`（reporter 窄例外双终态），payload 必须含同一 `report_path`
        （与 schema required_fields 一致；禁止省略）。**runtime 门禁会强制比较**
        `LOOP_COMPLETE.report_path` 与最近 accepted `forge.report.done.report_path`；
        不一致会被拒收并 correction。
      4. 打印 `DELIVERABLE_PATH: <report_path>`。
      5. 执行 worktree cleanup（见上）。

      ### Resume 规则

      若 loop 在 `forge.report.done` 后中断，resume 时**不得**重写既有 audit/report
      事实来制造新的成功终态。只能补发与先前 `forge.report.done.report_path` 匹配的
      `LOOP_COMPLETE`；若需新报告，必须先重发 `forge.report.done` 建立新基准。

state_projection:
  actions:
    - on: forge.plan.inspected
      set:
        forge.inspection_report_path: "$.inspection_report_path"
        forge.plan_path: "$.plan_path"
        forge.plan_key: "$.plan_key"
    - on: forge.plan.ready
      set:
        forge.development_plan_path: "$.development_plan_path"
        forge.execution_plan_path: "$.execution_plan_path"
        forge.unit_count: "$.unit_count"
        forge.plan_key: "$.plan_key"
    - on: forge.concurrency.approved
      set:
        forge.approval_report_path: "$.approval_report_path"
    - on: forge.worktrees.ready
      set:
        forge.worktree_map_path: "$.worktree_map_path"
        forge.integration_branch: "$.integration_branch"
        forge.base_commit: "$.base_commit"
        forge.plan_key: "$.plan_key"
    - on: forge.exec.development.done
      set:
        forge.execution_plan_path: "$.execution_plan_path"
        forge.plan_key: "$.plan_key"
        forge.completed_unit_count: "$.completed_unit_count"
        forge.failed_unit_count: "$.failed_unit_count"
    - on: forge.units.reviewed
      set:
        forge.review_summary_path: "$.summary_path"
        forge.all_units_approved: "$.all_approved"
        forge.plan_key: "$.plan_key"
    - on: forge.integration.done
      set:
        forge.integration_log_path: "$.integration_log_path"
        forge.commit_map_path: "$.commit_map_path"
        forge.plan_key: "$.plan_key"
    - on: forge.full.verified
      set:
        forge.full_verification_path: "$.verification_report_path"
        forge.plan_key: "$.plan_key"
    - on: forge.audit.done
      set:
        forge.audit_verdict: "$.verdict"
        forge.audit_report_path: "$.audit_report_path"
        forge.plan_key: "$.plan_key"
    - on: forge.plan.blocked
      set:
        forge.block_context_path: "$.context_artifact_path"
        forge.artifact_root: "$.forge_artifact_root"
        forge.plan_key: "$.plan_key"
        forge.plan_path: "$.plan_path"
    - on: work.failed
      set:
        forge.failure_context_path: "$.context_artifact_path"
        forge.artifact_root: "$.forge_artifact_root"
        forge.plan_key: "$.plan_key"
        forge.plan_path: "$.plan_path"
