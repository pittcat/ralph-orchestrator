# parallel-forge (Parallel Forge): Spec-First multi-worktree parallel development
#
# Based on parallel-dev-preset.md v2.0. **execution_model: supervisor**
# (`event_loop.supervisor.enabled: true`): runtime manages per-slot worktrees,
# forge-dispatcher fans out `exec.unit.ready` waves; up to three independent
# waves may overlap; executor slots publish
# `exec.unit.done` / `exec.unit.failed`; supervisor injects
# `exec.wave.complete` / `exec.wave.failed` (agents must NOT emit those).
# Development is required to fan out via supervisor waves; integration serial; one atomic
# commit per Unit; manager Markdown report terminal.
#
# Hats: 12 spec hats + forge-dispatcher + forge-failure-handler (supervisor
# infrastructure; mirrors ce-executor-supervisor exec-wave-dispatcher /
# exec-failure-handler).
#
# Usage:
#   ralph run -H builtin:parallel-forge -p <plan-or-requirements.md>
#
# Lint / check (HARD): always use the embedded builtin so schema SSOT is merged:
#   ralph preset check -H builtin:parallel-forge --strict
# Checking `presets/en/parallel-forge.yml` by file path alone fails
# `publishes_missing_schema` because schemas live in `presets/schemas/parallel-forge.yml`
# and are merged only at build embed time.
#
# Artifacts root: `.ralph/forge/<plan-key>/`
# Lifecycle: owner=`cleanup` (cleanup of forge worktrees/branches before report);
#   writers=each producer hat; readers=downstream hats via trigger paths;
#   retention=keep until operator deletes; do not treat as runtime ledger.
#
# Artifact templates (SSOT, parallel-dev-preset.md §4 / §10.14 / §13.4 / §21):
#   Embedded in the `ralph` binary. Materialize at runtime:
#     ralph preset materialize-artifacts parallel-forge --plan-key <plan-key>
#   Default output: `.ralph/forge/<plan-key>/templates/`
#     development-plan.template.md  → development-plan.md
#     unit.template.yml             → execution-plan.yml units[]
#     execution-plan.template.yml   → execution-plan.yml
#     unit-completion.template.md   → units/<id>-completion.md
#     manager-report.template.md    → docs/reports/<date>-<task>-manager-report.md

topic_format_whitelist:
  - LOOP_COMPLETE

mechanism:
  flow:
    type: declared
    version: 1
    terminal_emits: [LOOP_COMPLETE]
    # 2026-07-28-001 plan §3.1: explicit declared flow authority. Each
    # cross-hat handoff uses the next step's `on`; multi-source block
    # branches use `on_any_of` on `report`. exec_wave unit topics and
    # `work.failed` are non-transition (NON_TRANSITION_TOPICS). The
    # generic positional fallback is preserved for any preset that does
    # not opt into the declared contract.
    steps:
      - id: planning
        kind: linear
        allowed_emits:
          - forge.plan.inspected
          - forge.plan.blocked
      - id: plan_authoring
        kind: linear
        "on": forge.plan.inspected
        allowed_emits:
          - forge.plan.ready
          - forge.plan.blocked
      - id: concurrency_review
        kind: linear
        "on": forge.plan.ready
        allowed_emits:
          - forge.concurrency.approved
          - forge.plan.blocked
      - id: worktree_setup
        kind: linear
        "on": forge.concurrency.approved
        allowed_emits:
          - forge.worktrees.ready
          - forge.wave.worktrees.ready
          - forge.plan.blocked
        # Explicit: do not inherit allowed_emits as transitions.
        # `forge.wave.worktrees.ready` is in-loop (development_loop), not
        # a forward `on` for the next step. Leaving transition_emits empty
        # lets precheck desugar copy every allowed topic and fail
        # `flow_transition_emit_no_forward_target`.
        transition_emits:
          - forge.worktrees.ready
          - forge.plan.blocked
      # U7: repeatable per-wave spine. The development loop may have
      # several independent waves active at once. Each wave emits its
      # full handoff chain and a `forge.wave.settled` terminal; that
      # terminal unlocks only its dependent waves.
      # `transition_emits` controls the loop body's step ordering; the
      # outside-this-loop flow advances to `full_verify` either when
      # the last wave settles and the dispatcher emits
      # `forge.exec.development.done`, or when the correction budget
      # is exhausted and the failure handler emits
      # `forge.final.correction.settled` (tester's second entry).
      - id: development_loop
        kind: loop
        runs: forge.development_loop
        "on": forge.worktrees.ready
        allowed_emits:
          - forge.wave.worktrees.ready
          - forge.wave.prepare
          - exec.unit.ready
          - exec.unit.done
          - exec.unit.failed
          - exec.wave.complete
          - exec.wave.failed
          - forge.wave.reviewed
          - forge.wave.review.failed
          - forge.wave.integration.failed
          - forge.wave.integrated
          - forge.wave.verified
          - forge.verification.failed
          - forge.correction.requested
          - forge.correction.done
          - forge.wave.settled
          - forge.exec.development.done
          - forge.final.correction.settled
          - forge.plan.blocked
          - work.failed
        transition_emits:
          - forge.exec.development.done
          - forge.final.correction.settled
          - work.failed
      - id: full_verify
        kind: linear
        # Two entries: the normal all-waves-settled path, and the
        # correction-exhausted path where the tester runs the full gate
        # on the final correction's result (review 2026-08-26 F-003).
        on_any_of:
          - forge.exec.development.done
          - forge.final.correction.settled
        allowed_emits:
          - forge.full.verified
          # Tester failure path: typed failure topic first; only the
          # forge-failure-handler may land the terminal work.failed.
          - forge.full.verification.failed
          - work.failed
          - forge.report.done
        # Explicit: `forge.full.verification.failed` stays in-step for the
        # failure-handler; it must not copy into transition_emits via
        # precheck desugar on `work.failed`.
        transition_emits:
          - forge.full.verified
          - work.failed
      - id: audit
        kind: linear
        "on": forge.full.verified
        allowed_emits:
          - forge.audit.done
          - forge.plan.blocked
      - id: finalize
        kind: linear
        "on": forge.audit.done
        allowed_emits:
          - forge.finalized
          - forge.plan.blocked
      - id: cleanup
        kind: linear
        on_any_of:
          - forge.finalized
          - forge.plan.blocked
          - work.failed
        allowed_emits:
          - forge.cleanup.done
      - id: report
        kind: await
        "on": forge.cleanup.done
        allowed_emits:
          - forge.report.done
      - id: plan_end
        kind: terminal
        "on": forge.report.done
        allowed_emits:
          - LOOP_COMPLETE
    repair_budget: 3
    enforce_schema: hard
    state_idempotency: required

tasks:
  enabled: true
  coordinator_hats:
    - forge-dispatcher

event_loop:
  execution_mode: isolated
  supervisor:
    enabled: true
    db_path: .ralph/supervisor.db
    max_concurrent_workers: 8
    aggregate_timeout_secs: 7200
    # A unit gets three executor attempts in total (one initial run plus
    # two retries). Every attempt is a fresh backend process resuming the
    # same worktree, and only the third failure surfaces as a wave
    # failure for the correction path.
    slot_retry_budget: 2
    # 2026-09-03-0959 plan U10: cut parallel-forge to the runtime-owned
    # work-conserving DAG scheduler authority. The new driver owns per-Unit
    # admission; `forge.exec.development.done` is emitted by runtime after
    # all Units are integrated and projection-acknowledged, exactly once.
    # Legacy WaveTracker authority (the previous `forge.wave.*` /
    # `forge-dispatcher` wave-fan-in path) is retired via follow-up
    # cleanup work; this commit only flips the gate per §13 minimum.
    scheduler_mode: dag
  ephemeral_isolation: true
  enforce_current_unit: true
  enforce_hat_scope: true
  progress_steward:
    enabled: false
  completion_promise: "LOOP_COMPLETE"
  required_events:
    - forge.report.done
  completion_payload_match:
    topic: forge.report.done
    fields: [report_path]
  path_required_events: []
  starting_event: forge.start
  max_iterations: 60
  max_runtime_seconds: 28800
  # Fan-out `forge.worktrees.ready` has no LLM precheck gate: a
  # synthesized `precheck-forge.worktrees.ready` hat sat between
  # worktree and forge-dispatcher and could leave dispatcher unactivated
  # after an accepted ready. Empty-field payload_consistency still
  # rejects garbage identity on the bare topic. Other key-stage LLM
  # gates below are unchanged.
  precheck:
    enabled: true
    rules:
      forge.wave.worktrees.ready:
        prompt:
          - "Step 1: open `worktree_map_path` and verify it exists, is readable, and contains only the current wave's Unit worktrees; reject with `worktree_map_missing` when it cannot be verified."
          - "Step 2: verify `verified_base_commit` is the exact 40-character commit from the preceding `forge.wave.prepare` event and is an ancestor of every current wave worktree HEAD; reject with `verified_base_commit_mismatch` when the base cannot be proven."
          - "Step 3: verify `wave_id`, `wave_index`, and `plan_key` match the current wave projection and that every expected Unit has a mapped worktree; reject with `wave_identity_mismatch` or `wave_unit_missing` as applicable."
          - "Step 4: if every check passes, re-emit `forge.wave.worktrees.ready` verbatim; otherwise emit `forge.wave.worktrees.ready.rejected` with failed_checks and one actionable reason."
        on_fail:
          target: "worktree"
          retry_budget: 3
          on_exhausted: "forge.plan.blocked(reason=precheck_failed)"
          reason: "wave_worktree_evidence_insufficient"
        recovery_guidance:
          common:
            - "rebuild the wave-scoped worktree map from the current execution plan and verify every Unit's base commit; do not edit only the payload"
            - "rerun `ralph emit forge.wave.worktrees.ready --policy-check` with the corrected evidence before the real emit"
      forge.wave.reviewed:
        prompt:
          - "Step 1: open `review_report_path` and verify it is readable, non-empty, and contains one verdict for every Unit in the wave."
          - "Step 2: independently compare `unit_verdicts` with the review report; `aggregate_verdict=ACCEPTED` is valid only when every Unit is ACCEPTED and no Unit is REJECTED."
          - "Step 3: verify `wave_id`, `wave_index`, and `plan_key` match the current wave projection."
          - "Step 4: if every check passes, re-emit `forge.wave.reviewed` verbatim; otherwise emit `forge.wave.reviewed.rejected` with failed_checks and one actionable reason."
        on_fail:
          target: "reviewer"
          retry_budget: 3
          on_exhausted: "forge.plan.blocked(reason=precheck_failed)"
          reason: "wave_review_evidence_insufficient"
        recovery_guidance:
          common:
            - "re-read every Unit review artifact, align unit_verdicts and aggregate_verdict, then rerun the policy check"
      forge.wave.settled:
        prompt:
          - "Step 1: open `settlement_log_path` and verify it is readable, non-empty, and records review, integration, verification, and the commit map."
          - "Step 2: read live task IDs with `ralph tools task list`; verify `settled_task_ids` and `settled_unit_ids` are non-empty arrays of equal length, contain only live IDs for this wave, and preserve the evidence order."
          - "Step 3: verify `verified_base_commit` equals the integrated candidate HEAD and `wave_id`, `wave_index`, and `plan_key` match the current wave projection."
          - "Step 4: if every check passes, re-emit `forge.wave.settled` verbatim; otherwise emit `forge.wave.settled.rejected` with failed_checks and one actionable reason."
        on_fail:
          target: "integrator"
          retry_budget: 3
          on_exhausted: "forge.plan.blocked(reason=precheck_failed)"
          reason: "wave_settlement_evidence_insufficient"
        recovery_guidance:
          common:
            - "rebuild both ID arrays from the live task list and settlement artifact; never call task close manually"
      work.failed:
        prompt:
          - "Step 1: open `dead_end_evidence_file` and verify it is readable, non-empty, and supports the claimed terminal failure."
          - "Step 2: independently score `dead_end_confidence` (must be at least 90) and `dead_end_evidence_coverage` (must be at least 75); reject inflated or unsupported scores."
          - "Step 3: `dead_end_gate_passed=true` is valid only with `failure_evidence_status=complete` and `correction_status=exhausted` (or `not_applicable` for a permanent failure). Verify the context and evidence files before forwarding."
          - "Step 4: if every check passes, re-emit `work.failed` verbatim; otherwise emit `work.failed.rejected` with failed_checks and one actionable reason."
        on_fail:
          target: "forge-failure-handler"
          retry_budget: 3
          on_exhausted: "forge.plan.blocked(reason=precheck_failed)"
          reason: "dead_end_evidence_insufficient"
        recovery_guidance:
          common:
            - "open the evidence and context artifacts, correct the underlying failure record, then recompute scores and rerun the policy check"
      forge.audit.done:
        prompt:
          - "Step 1: open `audit_report_path` and verify it is readable, non-empty, and explicitly records the final verdict."
          - "Step 2: accept only `verdict=ACCEPTED`; verify `target_branch`, `target_start_sha`, and `target_status_fingerprint` still match the fan-out projection and the current target worktree."
          - "Step 3: verify `integration_head_sha` is a descendant of `target_start_sha` with `git merge-base --is-ancestor`; reject drift, a missing SHA, or a non-ancestor integration head."
          - "Step 4: if every check passes, re-emit `forge.audit.done` verbatim; otherwise emit `forge.audit.done.rejected` with failed_checks and one actionable reason."
        on_fail:
          target: "auditor"
          retry_budget: 3
          on_exhausted: "forge.plan.blocked(reason=precheck_failed)"
          reason: "final_audit_evidence_insufficient"
        recovery_guidance:
          common:
            - "re-run the final audit against the current target HEAD and status fingerprint; do not rewrite only the verdict"
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    require_emit_provenance: true
    terminal_topics:
      - LOOP_COMPLETE
    business_topics:
      - forge.plan.inspected
      - forge.plan.ready
      - forge.concurrency.approved
      - forge.worktrees.ready
      - forge.exec.development.done
      - forge.wave.integration.failed
      - forge.units.reviewed
      - forge.integration.done
      - forge.incremental.verified
      - forge.full.verified
      - forge.audit.done
      - forge.finalized
      - forge.cleanup.done
      - forge.report.done
      - forge.plan.blocked
      - exec.unit.ready
      - exec.unit.done
      - exec.unit.failed
      - work.failed
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    topic_deny_rules:
      # Supervisor coordination topics: runtime-only (R-COORD-4).
      - {hat_id: inspector, topic: exec.wave.complete}
      - {hat_id: planner, topic: exec.wave.complete}
      - {hat_id: guardian, topic: exec.wave.complete}
      - {hat_id: worktree, topic: exec.wave.complete}
      - {hat_id: executor, topic: exec.wave.complete}
      - {hat_id: reviewer, topic: exec.wave.complete}
      - {hat_id: integrator, topic: exec.wave.complete}
      - {hat_id: forge-dispatcher, topic: exec.wave.complete}
      - {hat_id: forge-failure-handler, topic: exec.wave.complete}
      # `exec.wave.failed` is injected by the supervisor fan-in only.
      # forge-failure-handler consumes it and must never forge one.
      - {hat_id: inspector, topic: exec.wave.failed}
      - {hat_id: planner, topic: exec.wave.failed}
      - {hat_id: guardian, topic: exec.wave.failed}
      - {hat_id: worktree, topic: exec.wave.failed}
      - {hat_id: executor, topic: exec.wave.failed}
      - {hat_id: reviewer, topic: exec.wave.failed}
      - {hat_id: integrator, topic: exec.wave.failed}
      - {hat_id: forge-dispatcher, topic: exec.wave.failed}
      - {hat_id: forge-failure-handler, topic: exec.wave.failed}
      - {hat_id: executor, topic: exec.unit.ready}
      - {hat_id: reviewer, topic: exec.unit.ready}
      - {hat_id: integrator, topic: exec.unit.ready}
      # forge-dispatcher owns exec.unit.ready (wave emit).
      - {hat_id: worktree, topic: exec.unit.ready}
      - {hat_id: executor, topic: exec.unit.ready}
      - {hat_id: inspector, topic: exec.unit.ready}
      # executor owns slot terminals.
      - {hat_id: forge-dispatcher, topic: exec.unit.done}
      - {hat_id: forge-dispatcher, topic: exec.unit.failed}
      - {hat_id: reviewer, topic: exec.unit.done}
      # forge-failure-handler owns work.failed from exec path.
      - {hat_id: executor, topic: work.failed}
      - {hat_id: forge-dispatcher, topic: work.failed}
      # Single-writer rule (plan 2026-08-27-1430 U2): only the
      # forge-failure-handler may publish work.failed; the tester routes
      # full-gate failures through forge.full.verification.failed.
      - {hat_id: tester, topic: work.failed}
      - {hat_id: integrator, topic: work.failed}
      - {hat_id: verifier, topic: work.failed}
      # Per-hat topic ownership.
      - {hat_id: planner, topic: forge.plan.inspected}
      - {hat_id: guardian, topic: forge.plan.inspected}
      - {hat_id: worktree, topic: forge.plan.ready}
      - {hat_id: forge-dispatcher, topic: forge.worktrees.ready}
      - {hat_id: reviewer, topic: forge.exec.development.done}
      - {hat_id: integrator, topic: forge.units.reviewed}
      - {hat_id: cleanup, topic: forge.finalized}
      - {hat_id: cleanup, topic: forge.plan.blocked}
      - {hat_id: cleanup, topic: work.failed}
      - {hat_id: reporter, topic: forge.cleanup.done}
      - {hat_id: inspector, topic: forge.report.done}
      - {hat_id: executor, topic: LOOP_COMPLETE}
      - {hat_id: reviewer, topic: LOOP_COMPLETE}
    payload_consistency:
      # Post-review fix (#5): `verified_base_commit` is documented as a
      # 40-char git SHA but was only `required_fields`-checked (field
      # present), so an EMPTY string passed and a lazy worktree could
      # fan out the next wave from an empty base, breaking the S5
      # trust boundary. No format/length predicate exists in the
      # whitelist (eq/ne/gt/gte/exists/non_empty), so we gate the
      # positively-detectable violation: a base that IS the empty
      # string. `eq: ""` fires (Hit => violation) exactly when the
      # producer emits an empty base; a real SHA misses and passes.
      enabled: true
      rules:
        - id: parallel-forge-prepare-empty-base
          topic: forge.wave.prepare
          when: {field: verified_base_commit, eq: ""}
          message: "verified_base_commit must be a non-empty commit SHA; an empty base breaks the lazy-worktree trust boundary."
        - id: parallel-forge-worktrees-ready-empty-base
          topic: forge.wave.worktrees.ready.proposed
          when: {field: verified_base_commit, eq: ""}
          message: "verified_base_commit must be a non-empty commit SHA; an empty base breaks the lazy-worktree trust boundary."
        - id: parallel-forge-settled-empty-base
          topic: forge.wave.settled.proposed
          when: {field: verified_base_commit, eq: ""}
          message: "verified_base_commit must be a non-empty commit SHA; the next wave's worktree base is taken from this value."
        # Fan-out identity: empty fields Hit on the bare topic (no LLM
        # gate in front of dispatcher). `eq: ""` fires exactly when the
        # producer emits an empty identity/evidence field.
        - id: parallel-forge-worktrees-ready-empty-target-branch
          topic: forge.worktrees.ready
          when: {field: target_branch, eq: ""}
          message: "target_branch must be the non-empty value of RALPH_CURRENT_BRANCH; an empty target branch breaks the fan-out identity contract."
        - id: parallel-forge-worktrees-ready-empty-start-sha
          topic: forge.worktrees.ready
          when: {field: target_start_sha, eq: ""}
          message: "target_start_sha must be a non-empty commit SHA (`git rev-parse HEAD` in RALPH_WORKSPACE_ROOT); an empty start SHA makes target-drift detection impossible."
        - id: parallel-forge-worktrees-ready-empty-fingerprint
          topic: forge.worktrees.ready
          when: {field: target_status_fingerprint, eq: ""}
          message: "target_status_fingerprint must be a non-empty SHA-256 of the canonical status porcelain; an empty fingerprint makes target-drift detection impossible."
        - id: parallel-forge-worktrees-ready-empty-map-path
          topic: forge.worktrees.ready
          when: {field: worktree_map_path, eq: ""}
          message: "worktree_map_path must be a non-empty path to the worktree map artifact; the dispatcher reads it."
        - id: parallel-forge-wave-worktrees-empty-map
          topic: forge.wave.worktrees.ready.proposed
          when: {field: worktree_map_path, eq: ""}
          message: "worktree_map_path must identify the current wave worktree map."
        - id: parallel-forge-wave-worktrees-empty-wave-id
          topic: forge.wave.worktrees.ready.proposed
          when: {field: wave_id, eq: ""}
          message: "wave_id must identify the current wave."
        - id: parallel-forge-reviewed-empty-report
          topic: forge.wave.reviewed.proposed
          when: {field: review_report_path, eq: ""}
          message: "review_report_path must identify the wave review artifact."
        - id: parallel-forge-reviewed-not-accepted
          topic: forge.wave.reviewed.proposed
          when: {field: aggregate_verdict, ne: "ACCEPTED"}
          message: "only an ACCEPTED aggregate review may enter integration."
        - id: parallel-forge-settled-empty-task-ids
          topic: forge.wave.settled.proposed
          when: {field: settled_task_ids, eq: []}
          message: "settled_task_ids must be a non-empty live task ID array."
        - id: parallel-forge-settled-empty-unit-ids
          topic: forge.wave.settled.proposed
          when: {field: settled_unit_ids, eq: []}
          message: "settled_unit_ids must be a non-empty Unit ID array."
        - id: parallel-forge-settled-empty-log
          topic: forge.wave.settled.proposed
          when: {field: settlement_log_path, eq: ""}
          message: "settlement_log_path must identify the settlement evidence."
        - id: parallel-forge-failed-empty-context
          topic: work.failed.proposed
          when: {field: context_artifact_path, eq: ""}
          message: "context_artifact_path must identify the failure evidence."
        - id: parallel-forge-failed-empty-evidence-file
          topic: work.failed.proposed
          when: {field: dead_end_evidence_file, eq: ""}
          message: "dead_end_evidence_file must identify the terminal failure evidence."
        - id: parallel-forge-failed-gate-without-complete-evidence
          topic: work.failed.proposed
          when:
            all:
              - {field: dead_end_gate_passed, eq: true}
              - {field: failure_evidence_status, eq: incomplete}
          message: "dead_end_gate_passed cannot be true while failure evidence is incomplete."
        - id: parallel-forge-failed-gate-without-exhausted-correction
          topic: work.failed.proposed
          when:
            all:
              - {field: dead_end_gate_passed, eq: true}
              - {field: correction_status, eq: not_exhausted}
          message: "dead_end_gate_passed cannot be true before correction is exhausted."
        - id: parallel-forge-audit-not-accepted
          topic: forge.audit.done.proposed
          when: {field: verdict, ne: ACCEPTED}
          message: "only verdict=ACCEPTED authorizes the finalizer."
        - id: parallel-forge-audit-empty-report
          topic: forge.audit.done.proposed
          when: {field: audit_report_path, eq: ""}
          message: "audit_report_path must identify the final audit evidence."
        - id: parallel-forge-audit-empty-start-sha
          topic: forge.audit.done.proposed
          when: {field: target_start_sha, eq: ""}
          message: "target_start_sha must identify the fan-out target snapshot."
        # Plan 2026-08-27-1430 U10 (S19/S20; D3): the four receipt
        # topics below have no precheck and no `.proposed` rewrite, so
        # their rules target the BARE topic names. Each rule rejects a
        # false-success or empty-field receipt at emit time with zero
        # LLM cost.
        - id: parallel-forge-dev-done-empty-plan
          topic: forge.exec.development.done
          when: {field: execution_plan_path, eq: ""}
          message: "execution_plan_path must be a non-empty path; an empty plan path is a false development-done receipt."
        - id: parallel-forge-dev-done-nonzero-failed
          topic: forge.exec.development.done
          when: {field: failed_unit_count, gt: 0}
          message: "failed_unit_count must be 0 on forge.exec.development.done; units that reached exec.unit.failed must not be reported as development complete."
        - id: parallel-forge-full-verified-false
          topic: forge.full.verified
          when: {field: all_required_passed, eq: false}
          message: "all_required_passed=false contradicts the forge.full.verified success receipt; take the failure path instead of emitting a success topic."
        - id: parallel-forge-full-verified-empty-report
          topic: forge.full.verified
          when: {field: verification_report_path, eq: ""}
          message: "verification_report_path must be a non-empty path to the full-verification report."
        - id: parallel-forge-finalized-empty-sha
          topic: forge.finalized
          when: {field: target_commit_sha, eq: ""}
          message: "target_commit_sha must be the non-empty post-merge target HEAD SHA."
        - id: parallel-forge-finalized-empty-target-branch
          topic: forge.finalized
          when: {field: target_branch, eq: ""}
          message: "target_branch must be a non-empty branch name."
        - id: parallel-forge-finalized-empty-report
          topic: forge.finalized
          when: {field: finalization_report_path, eq: ""}
          message: "finalization_report_path must be a non-empty path to the finalization report."
        - id: parallel-forge-report-empty-path
          topic: forge.report.done
          when: {field: report_path, eq: ""}
          message: "report_path must be a non-empty path to the manager report."
        - id: parallel-forge-report-completed-without-accepted-audit
          topic: forge.report.done
          when:
            all:
              - {field: status, eq: "COMPLETED"}
              - {field: final_audit, ne: "ACCEPTED"}
          message: "status=COMPLETED is inconsistent with final_audit!=ACCEPTED; a completed manager report requires an accepted final audit."

cli:
  backend: auto

core:
  guardrails:
    - "OPAC Observe: `ralph inspect loop` + `ralph tools task list`. Do not read `.ralph/events.jsonl` or `.ralph/supervisor.db`."
    - "OPAC Precheck: `ralph tools skill load ralph-tools-emit` then `ralph emit --policy-check` before every real emit (per `ralph-tools` §5)."
    - "Wave Precheck: dispatcher must `ralph wave verify --payloads-stdin` then same payloads `ralph wave emit` (per `ralph-tools-wave`)."
    - "Artifact templates: run `ralph preset materialize-artifacts parallel-forge --plan-key <plan-key>` then copy from `.ralph/forge/<plan-key>/templates/` — do not write free-form artifacts."
    - "Artifact lifecycle: `.ralph/forge/<plan-key>/` owner=cleanup (cleanup forge worktrees/branches before manager report); producers write; consumers read only via trigger/projection paths."
    - "Blocked/failed: write context artifact under blocks/ or failures/ before emit; include context_artifact_path + forge_artifact_root + plan_key."
    - "One business event per isolated activation unless reporter terminal pair (forge.report.done then LOOP_COMPLETE)."
    - "Concurrency is the default: execution-plan.yml must maximize concurrent execution of every dependency-safe Unit; integration_order controls only deterministic integration, never worker admission."
    - "One worktree per Unit; one atomic commit per Unit in final linear history."
    - "Never weaken tests, skip assertions, or use `.only` to pass gates."
    - "Preset check: use `-H builtin:parallel-forge` (schema SSOT merged at embed); do not rely on raw presets/en file-path check."

hats:
  inspector:
    name: "Inspector"
    description: "Reviews the operator plan/requirements and repository readiness before specification."
    triggers: [forge.start]
    publishes: [forge.plan.inspected, forge.plan.blocked]
    exempt_topics: [forge.plan.inspected, forge.plan.blocked]
    terminal_events: [forge.plan.inspected, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.start]
    instructions: |
      ## INSPECTOR MODE

      Read-only. Do not edit production code or tests.

      OPAC: `ralph-tools-opac` (auto-injected). Before emit:
      `ralph tools skill load ralph-tools-emit` then `--policy-check` per emit skill §5.

      ### Mission
      Review the operator plan/requirements and repository. Produce a Plan Inspection Report artifact, then emit exactly one business event.

      ### Steps
      1. Observe: read plan path from task/loop anchor (`ralph inspect loop`); inspect README, test entry, CI config, existing modules.
      2. Derive `plan_key` = plan basename without `.md`. Write `.ralph/forge/<plan-key>/inspection-report.md`.
      3. Success: precheck then emit `forge.plan.inspected` (`plan_usable: true`, `plan_path`, `inspection_report_path`, `plan_key`).
      4. Block: write `.ralph/forge/<plan-key>/blocks/inspector-blocked.md`, then emit `forge.plan.blocked` with `reason`, `plan_path`, `context_artifact_path`, `forge_artifact_root` (`.ralph/forge/<plan-key>/`), `plan_key`.

      Single business event only.

  planner:
    name: "Planner"
    description: "Spec-First, BDD, ATDD, Outside-In, and Unit DAG authoring (no code edits)."
    triggers: [forge.plan.inspected]
    publishes: [forge.plan.ready, forge.plan.blocked]
    exempt_topics: [forge.plan.ready, forge.plan.blocked]
    terminal_events: [forge.plan.ready, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.plan.inspected]
    instructions: |
      ## PLANNER MODE

      Write the plan only. Do not modify production code, commit, or create worktrees.

      OPAC: `ralph-tools-opac` is injected. Before emitting, run
      `ralph tools skill load ralph-tools-emit`, then use `--policy-check` (emit skill §5).
      For materialization, load `ralph-tools-cmdref` and use `materialize-artifacts`.

      ### Templates (materialize before copying and filling)

      ```bash
      ralph preset materialize-artifacts parallel-forge --plan-key <plan-key>
      ```

      Copy from `.ralph/forge/<plan-key>/templates`:
      - `development-plan.template.md` → `development-plan.md`
      - `execution-plan.template.yml` + `unit.template.yml` → `execution-plan.yml`

      `<plan-key>` is the operator plan filename without `.md`.

      ### Step 1 — Observe

      1. Read the trigger's `inspection_report_path` in full.
      2. Read the operator plan at `plan_path` from the trigger or `ralph inspect loop`.
      3. Inspect the repository (README, CI, test entry points, AGENTS.md/CLAUDE.md);
         mark unconfirmed items as `executor_must_confirm`.

      ### Resource budget (minimal worktrees / minimal preemption)

      Plan waves by peak resource demand, not by Unit count: place Units in the
      same wave only when each can obtain an independent worktree, temp directory,
      port, database/schema, container project, and cache. Split Units that use
      fixed or non-namespacable resources into different waves, and record the
      reason in the development-plan concurrency boundary table. Do not create
      future-wave worktrees just to fill supervisor slots; future waves stay lazy.
      The Planner owns this resource strategy: later hats may validate or execute
      it, but must not redesign the wave schedule during dispatch.

      ### Step 2 — Apply: development-plan.md

      1. `mkdir -p .ralph/forge/<plan-key>`
      2. Copy the template to `development-plan.md`; **keep every top-level section**;
         fill in BDD scenarios, Outside-In, Unit DAG, TDD decomposition, and gates.
      3. Self-check that every Scenario has an acceptance level and unambiguous acceptance.

      ### Step 3 — Apply: execution-plan.yml

      1. Write `execution-plan.yml` from the templates, including the `units[]` DAG fields.
      2. For every Unit, fill `owned_resources`, `parallel_reason`, and
         `serial_reason` from the resource matrix. Give each shared resource
         exactly one Owner Unit and list all consumers; include worktrees,
         ports, databases/schemas, container projects, temp directories,
         external services, and caches.
      3. Validate the DAG has no cycles or shared write conflicts between
         parallel Units; set `plan_key` / `source_plan_path` /
         `development_plan_path`.
      3a. **Mandatory fan-out:** `parallel-forge` must not obey an operator
          request to execute independent Units serially. Split independent
          implementation slices and let the runtime place every dependency-safe
          Unit in the earliest possible wave. Preserve only real dependency
          edges and hard resource-conflict boundaries. A plan with no actual
          independent Units cannot be made safe by force and remains serial.
      4. **`execution_wave` is a 1-based positive integer in YAML**, but it is
         only a planning hint. Runtime recomputes the earliest safe wave from
         `depends_on`; do not use a larger wave or prose saying “serial” to
         suppress concurrency. `integration_order` is only the deterministic
         integration sequence.

      ### Step 4 — Artifact-first handoff (disk is the only task authority)

      Do not call any task mutation CLI or construct
      `unit_tasks`, `unit_count`, `wave_total`, or `execution_plan_digest`.
      Runtime atomically derives task keys, dependencies, waves, and integration
      order from `execution-plan.yml`; payloads containing `unit_tasks` are rejected.

      After writing, self-check:
      - `plan_key` equals the `.ralph/forge/<plan-key>/` directory name
      - `units[]` is non-empty and every `id` is unique
      - `execution_wave` starts at 1 and is contiguous, with no 0 or gaps
      - Units with no dependency path between them are placed for concurrent execution
      - At least one execution wave contains 2 or more independent Units when the DAG permits it
      - Every Unit fills `owned_resources`, `parallel_reason`, and `serial_reason`
      - Every shared resource has exactly one Owner; non-namespacable resources
        are split across different waves
      - Each wave's peak demand fits the confirmed port, database, container,
        cache, and disk capacity
      - `integration_order` is globally unique and contiguous from 1..N
      - Every `depends_on` points to a declared Unit; runtime derives wave order from these edges

      ### Step 5 — Emit

      1. Run `test -f` on both artifacts and fully review `execution-plan.yml` with `yq`.
      2. Construct a reference-only JSON payload containing only `plan_path`, `plan_key`,
         `development_plan_path`, and `execution_plan_path`. Read `plan_path` from
         `ralph inspect loop` or the trigger; never hand-write it.
      3. First run `ralph emit forge.plan.ready '<JSON>' --json --policy-check`.
         The CLI validates workspace boundaries on the same artifact snapshot and adds
         the canonical `plan_digest`; then formally emit the same raw JSON without
         `--policy-check`, which deterministically adds the same digest.
      4. If path, digest, YAML, or DAG validation fails, repair the artifact and rerun
         precheck; never skip `--policy-check` or fall back to double-written payloads.
      5. If blocked, write `blocks/planner-blocked.md` and emit `forge.plan.blocked`
         with `reason`, `plan_path`, `context_artifact_path`, `forge_artifact_root`,
         and `plan_key`.
      6. Emit only one business event in this activation.

  guardian:
    name: "Guardian"
    description: "Audits Unit DAG, shared resources, and concurrency safety."
    triggers: [forge.plan.ready]
    publishes: [forge.concurrency.approved, forge.plan.blocked]
    exempt_topics: [forge.concurrency.approved, forge.plan.blocked]
    terminal_events: [forge.concurrency.approved, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.plan.ready]
    instructions: |
      ## GUARDIAN MODE

      Read-only on code. Audit the execution plan for safe parallelism.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Mission
      Planner owns the resource strategy in the artifacts; Guardian only verifies
      it and blocks unsafe or incomplete plans. Do not redesign waves here.

      Verify DAG acyclicity, shared-resource single owner, path boundaries
      (`allowed_paths` / `forbidden_paths`), and that parallel Units do not
      write the same files. Checklist (write into approval artifact):
      1. Every `depends_on` target exists; no cycles.
      2. Parallel Units (same wave / no edge) have disjoint write paths.
      3. Shared modules have exactly one Owner Unit.
      4. Foundation-before-dependent ordering is explicit in `depends_on`; `integration_order` does not serialize worker execution.
      5. Audit test/resource competition, not only source paths. For every
         Unit's `acceptance_test` / `tdd` command, identify ports, databases,
         Docker/Compose projects, fixed temp paths, external services, and
         shared caches. Treat an unspecified resource as potentially shared.
      6. Same-wave Units may run together only when each shared resource is
         independently namespaced, or when the test is read-only and proven
         safe for concurrent use. A fixed resource name is an exclusive
         conflict unless the Unit has an explicit dependency edge.
      7. Treat scarce resources as the only non-dependency concurrency boundary:
         if a resource cannot be independently namespaced, record that hard
         conflict and keep only those conflicting Units out of the same wave.
         Do not serialize independent Units merely because the operator plan
         or `integration_order` lists them sequentially.
      8. Record the resource name, why it is isolated or serialized, and the
         evidence command in `concurrency-approval.md`. If the plan does not
         provide enough information to establish safety, write
         `blocks/guardian-blocked.md` and stop; do not approve based on a
         guess.

      ### Steps
      1. Read `development_plan_path` and `execution_plan_path` from trigger; derive `plan_key` from those paths.
      2. Write `.ralph/forge/<plan-key>/concurrency-approval.md` using the checklist above; record
         `approval_report_path` = that file (repo-relative).
      3. If safe: precheck then emit `forge.concurrency.approved` with all required fields:
         `approved: true`, `approval_report_path`, `execution_plan_path` (copy from trigger).
      4. Else: write `blocks/guardian-blocked.md`, emit `forge.plan.blocked`
         (`context_artifact_path`, `forge_artifact_root`, `plan_key`, `reason`, `plan_path`).

      Single business event only. Do not require any repo file outside trigger paths / forge artifacts.

  worktree:
    name: "Worktree"
    description: "Per-wave integration branch + lazy worktree creation from verified_base_commit."
    triggers:
      - forge.concurrency.approved
      - forge.wave.prepare
    publishes:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.plan.blocked
    exempt_topics:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.plan.blocked
    terminal_events:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.plan.blocked
    event_filter:
      enabled: true
      events:
        - forge.concurrency.approved
        - forge.wave.prepare
    instructions: |
      ## WORKTREE MODE — lazy per-wave worktrees

      U4 / R8: create worktrees only for a ready wave; waves whose
      dependencies are not settled remain absent. The trigger carries an explicit
      `verified_base_commit`; only honour it after `git cat-file -t`
      proves it is a real commit. If the commit does not exist or
      the branch/path already exists with a different SHA, fail
      closed — never rebase / reset / force push.

      Do not preempt or reuse a worktree, branch, port, database, container, or
      temp directory that does not belong to this plan and current wave. If a
      resource with the same name is occupied, record its exact path/name,
      current owner, and SHA first. If safe reuse within this plan cannot be
      proven, stop and emit `forge.plan.blocked`; never use `--force`, delete,
      reset, or "claim it first".

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Task visibility (red line)

      This hat is **not** in `tasks.coordinator_hats`; every Unit task has
      `owner_hat_id: executor`. The runtime may inject a `<ready-tasks>` list,
      but those tasks are **read-only and cannot be mutated** here.

      **Do not** call any task lifecycle mutation:

      - Do not run `ralph tools task start <id>` — runtime rejects it (owner != worktree).
      - Do not run `ralph tools task close <id>` — same restriction.
      - Do not run `ralph tools task fail <id>` / `ralph tools task reopen <id>` — same restriction.
      - Do not run `ralph tools task add` / `ralph tools task ensure` — non-coordinator hats are rejected.

      The only allowed task commands are read-only: `ralph tools task list`,
      `ralph tools task show`, and `ralph tools task ready`, used **only to locate
      Unit metadata** (for example, mapping a `task_key` back to `unit_id`).
      If ACL rejects a command (non-zero exit containing "owned by hat"), **do not
      retry**; continue with worktree creation. Dispatcher and executor manage tasks.

      ### Mission
      - On `forge.concurrency.approved`: create the integration
        branch (or reuse it) and emit `forge.worktrees.ready` with
        the first ready wave's worktree map.
      - On each `forge.wave.prepare`: ensure the named branch /
        worktree exists at `verified_base_commit`, then emit
        `forge.wave.worktrees.ready` with the wave-scoped map.
        Waves that are not yet ready are **absent** from the map;
        multiple ready-wave maps may coexist for one plan.

      Worktrees are cleaned by the **cleanup** hat before the
      reporter runs (lifecycle owner, per the artifact lifecycle
      declaration at the top of this preset); never delete them in
      this hat. When reused, the prior wave's
      runtime record is archived to the worktree's
      `.ralph/reuse-history/` first, matching the
      `--worktree --reuse-worktree` rule.
      1. Read `execution_plan_path` from trigger; derive `plan_key`; run forge
         resource commands from the repository root, but identify the current
         Ralph loop's checkout from `RALPH_WORKSPACE_ROOT` and
         `RALPH_CURRENT_BRANCH`. These runner-injected values refer to the
         outer `--worktree` checkout when one is active.
      2. Create integration branch; record `base_commit` after Foundation units land.
      3. For each parallel Unit: `git worktree add` + dedicated branch (one worktree per Unit).
      4. Write `.ralph/forge/<plan-key>/worktree-map.yml` (unit → branch → path).
      5. Set `target_branch` to the exact non-empty value of
         `RALPH_CURRENT_BRANCH`, and set `target_worktree` to
         `RALPH_WORKSPACE_ROOT`. These identify the checkout that launched
         this Ralph loop. Do not derive the target from the first entry of
         `git worktree list`, and never guess `main`, `master`, or the
         integration branch. If either value is missing, write
         `blocks/worktree-blocked.md` and emit `forge.plan.blocked`.
      6. Snapshot the target identity in `$RALPH_WORKSPACE_ROOT` and put both
         values into the payload:
         - `target_start_sha`: `git -C "$RALPH_WORKSPACE_ROOT" rev-parse HEAD`
           (full 40-char hex).
         - `target_status_fingerprint`: SHA-256 of the canonical status
           porcelain, computed exactly as:
             status = `git -C "$RALPH_WORKSPACE_ROOT" status --porcelain=v1 --untracked-files=all`
             lines  = status split on "\n", dropping the trailing empty line
             kept   = lines whose path (for renames, the path right of " -> ";
                      otherwise the path after the status code) does not start
                      with ".ralph/"
             canonical = kept joined with "\n", plus one trailing "\n" when
                      kept is non-empty (empty string when kept is empty)
             fingerprint = hex(SHA-256(canonical as utf-8 bytes))
           (full 64-char hex SHA-256).
      7. Emit `forge.worktrees.ready` including `plan_key`,
         `worktree_map_path`, `execution_plan_path`, `integration_branch`,
         `target_branch`, `target_start_sha`, `target_status_fingerprint`,
         and `base_commit`. Run `--policy-check` before the real emit
         (per `ralph-tools` §5). Empty identity fields are rejected by
         deterministic structure checks; do not skip the policy check.
      8. On failure: write `blocks/worktree-blocked.md`, emit `forge.plan.blocked` with context paths.

      Do not delete worktrees in this hat. Single business event only.

  forge-dispatcher:
    name: "Forge Dispatcher"
    description: "Supervisor exec-wave dispatcher: static-wave fan-out from execution-plan.yml via ralph wave emit exec.unit.ready."
    triggers:
      - forge.wave.worktrees.ready
      - forge.worktrees.ready
      - forge.wave.settled
    publishes:
      - exec.unit.ready
      - forge.wave.prepare
      - forge.exec.development.done
    event_filter:
      enabled: true
      events:
        - forge.wave.worktrees.ready
        - forge.worktrees.ready
        - forge.wave.settled
    exempt_topics:
      - exec.unit.ready
      - forge.wave.prepare
      - forge.exec.development.done
    terminal_events:
      - exec.unit.ready
      - forge.wave.prepare
      - forge.exec.development.done
    instructions: |
      ## FORGE DISPATCHER MODE — Dependency-ready multi-wave fan-out

      Dispatcher hat for `event_loop.supervisor.enabled: true`. The
      execution plan's **static** `execution_wave` field is the
      single source of truth for which Units may run now. You never
      recompute the ready set from task state or dependency edges.
      The integration_order / execution_wave schedule was
      validated by Guardian and remains valid until plan revocation.

      OPAC: follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm.
      Load on demand: `ralph tools skill load ralph-tools-wave` (red box)
      and `ralph tools skill load ralph-tools-emit` (§5 precheck).

      ### Role boundary — you dispatch, you do not implement

      - You only **dispatch**: read the execution plan, find dependency-ready
        waves, and emit one `ralph wave emit exec.unit.ready
        --payloads-stdin` batch per selected wave. You never implement any
        Unit.
      - The `<ready-tasks>` block in your prompt is **read-only** for
        you. Unit tasks are owned by `executor`; the prompt may mark
        them `[read-only]` even though you have lifecycle rights for
        coordination. Do **not** `ralph tools task start` a unit task,
        do not write Unit code, do not commit Unit output.
      - If you cannot dispatch this round (no open wave, payload
        construction fails, etc.), emit only the failure / advance
        topic your `publishes` allow. Do **not** "help out" by
        implementing a Unit yourself.

      ### Dispatch budget

      Per activation dispatch up to **three** independent ready waves. Each
      wave must use its own payload file and its own `ralph wave verify` →
      `ralph wave emit` pair. Never combine two logical waves into one
      `wave emit` call: one call creates one shared `wave_id`.
      If no ready wave exists, publish at most one of:
      - `ralph emit forge.wave.prepare` (request next wave's worktree creation), OR
      - `ralph emit forge.exec.development.done` (all waves settled).
      Emit `forge.exec.development.done` only when every wave settled
      cleanly: `failed_unit_count` must be 0 and `execution_plan_path`
      must be the real non-empty plan path — a receipt with an empty
      plan path or a non-zero failed count is rejected at emit time.

      Do **not** publish supervisor fan-in topics (`exec.wave.*`).
      The runtime injects those after slot fan-in. Your triggers
      may *receive* fan-in signals; you never write them.

      ### Ready-wave selection

      U4 / R5: read `execution_plan_path` from the trigger. Find every
      wave whose Units are still open and whose dependency edges are
      satisfied by already-settled predecessor waves. These are the
      ready-wave candidates. Select up to three independent candidates per
      activation, ordered by `integration_order`, and dispatch each as its
      own wave. Independent candidates may be active concurrently because the
      runtime/supervisor owns the global worker cap. Re-entry on the
      same `wave_id` is idempotent — never re-prepare a wave that already
      has `forge.worktrees.ready`.

      Dispatch the approved wave as-is; never compensate for scarce resources by
      opening extra worktrees, re-dispatching a busy slot, or launching a second
      copy of the same Unit. Resource capacity was settled by Planner + Guardian;
      if the wave no longer fits, stop and emit the permitted failure / block topic
      with evidence instead of preempting existing resources.

      ### Wave payload (per ready unit) — required fields

      Sort by `integration_order` ascending (ties broken by `unit_id`).
      For each unit look up the **live** `task_id` / `task_key` from
      `ralph tools task list`; never hand-write `task_id`. Include
      `wave_id`, `slot_index`, `unit_id`, `plan_key`,
      `execution_plan_path`, `worktree_map_path` (from the trigger
      / projection).

      ### Wave OPAC (HARD)

      1. Build one payloads file per selected wave (one JSON object per ready
         unit; do not mix wave indexes).
      2. For each file, run
         `cat wave-<index>.jsonl | ralph wave verify exec.unit.ready --payloads-stdin`
         — must succeed (ticket). **Do not skip verify.**
      3. For each verified file, pass the same unmodified bytes to
         `ralph wave emit exec.unit.ready --payloads-stdin`.
      4. Confirm every returned `wave_id` with
         `ralph wave inspect <wave_id>` (not events.jsonl).

      Schema `--policy-check` alone is **not** a substitute for `wave verify`.

      ### On worktrees-ready, settlement, or supervisor fan-in re-entry

      1. Read `execution_plan_path`, `worktree_map_path`, `plan_key`,
         `verified_base_commit` from trigger/projection.
      2. If `forge.wave.settled` just landed: recompute all ready-wave
         candidates. If a candidate lacks a worktree, emit
         `forge.wave.prepare` for the lowest such candidate; otherwise
         dispatch up to three candidates whose bases are valid. The
         `verified_base_commit` must be the settled commit for each
         prepared wave.
      3. If `forge.wave.worktrees.ready` just landed: include that wave in
         the ready set, then continue dispatching other independent ready
         waves whose worktrees are already available; verify → wave emit once
         per wave.
      4. If every wave is settled and no open tasks remain:
         emit `forge.exec.development.done` (`execution_plan_path`,
         counts, `plan_key`).

  forge-failure-handler:
    name: "Forge Failure Handler"
    description: "Routes execution/review/verification failures to bounded wave-fixer correction; never short-circuits to work.failed."
    triggers:
      - exec.wave.failed
      - forge.wave.review.failed
      - forge.wave.integration.failed
      - forge.verification.failed
      - forge.full.verification.failed
    publishes:
      - forge.correction.requested
      - forge.final.correction.settled
      - forge.plan.blocked
      - work.failed
    exempt_topics:
      - forge.correction.requested
      - forge.final.correction.settled
      - forge.plan.blocked
      - work.failed
    terminal_events:
      - forge.correction.requested
      - forge.final.correction.settled
      - forge.plan.blocked
      - work.failed
    event_filter:
      enabled: true
      events:
        - exec.wave.failed
        - forge.wave.review.failed
        - forge.wave.integration.failed
        - forge.verification.failed
        - forge.full.verification.failed
    instructions: |
      ## FORGE FAILURE HANDLER MODE — evidence-first correction

      U6 / R16–R24: a **single** failure event never terminates
      the plan. Route to `forge.correction.requested` instead.
      `work.failed` is reserved for the 3-round exhaustion + 90/75
      confidence gate.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### When the trigger is `exec.wave.failed` (the whole execution wave failed)

      This trigger contains only `wave_id`, `reason`, `blocking_slots`,
      `slot_failures` (each with `slot_index` / `reason` / `failure_class`),
      `salvaged_slots`, and `redrive_slots`. It does **not** contain `plan_key`,
      `wave_index`, `execution_plan_path`, `worktree_map_path`, or
      `failure_fingerprint`; reconstruct those four context values before the
      common Steps.

      This trigger means every slot in `blocking_slots` exhausted all attempts
      (each retry is a new process continuing in the same worktree), not that it
      failed once. Do not simply rerun it; correction must address the root cause.

      - **Route permanent failures first.** If every `failure_class` in
        `slot_failures` is `identity_mismatch` or `unknown`, write
        `blocks/forge-failure-handler-blocked.md` with the slots and classes,
        then emit `forge.plan.blocked` with `reason`, `plan_path`,
        `context_artifact_path`, `forge_artifact_root`, and `plan_key`.
        If any class is `timeout`, `orphan_or_empty_result`,
        `required_slot_failure`, or `cancel`, continue because partial work may exist.
      - **Restore wave context.** Read the global projection keys
        (`forge.plan_key`, `forge.execution_plan_path`,
        `forge.worktree_map_path`) and the wave-scoped projection keys
        (`forge.wave.current_wave_id`, `forge.wave.current_wave_index`,
        `forge.wave.verified_base_commit` — pinned by
        `forge.wave.worktrees.ready` and refreshed by each
        `forge.wave.settled`). Fail closed: if
        `forge.wave.current_wave_id` does not match the trigger's
        `wave_id`, write `blocks/forge-failure-handler-blocked.md` with
        the mismatch and emit `forge.plan.blocked`; never use another
        wave's base. Use the restored `forge.wave.verified_base_commit`
        as the `base_commit` for `forge.correction.requested`.
      - **Map slots back to Units.** Use `worktree_map_path` to map each
        `blocking_slots.slot_index` to `unit_id` and `candidate_branch`, producing
        `affected_unit_ids`. Get live `affected_task_ids` from
        `ralph tools task list`; never hand-write task IDs.
      - **Build `failure_fingerprint`.** Use this stable format so the same slot
        set produces the same fingerprint:
        `exec:<wave_id>:<blocking_slots ascending comma-separated>:<failure_class
        deduplicated ascending comma-separated>`.

      Continue with common Steps 2-6 after restoring context, and set
      `failure_topic` to `exec.wave.failed`. `salvaged_slots` are complete and
      must not enter `affected_unit_ids`. `redrive_slots` is informational; you
      cannot redispatch workers, and correction is the only repair path.

      ### When the trigger is `forge.full.verification.failed` (full gate failed)

      The tester already ran the full regression and declared failure; this
      path is terminal, not correctable. Do **not** emit
      `forge.correction.requested` here — there is no wave left to fix.

      - Rebuild the context: read `plan_key` from the trigger and derive
        `plan_path` from the loop anchor / projection (`forge.plan_key` is
        pinned by `forge.worktrees.ready`); `forge_artifact_root` is
        `.ralph/forge/<plan-key>/`.
      - Write `.ralph/forge/<plan-key>/failures/forge-failure-handler-failed.md`
        summarizing the tester's `reason`, `failure_fingerprint`, and
        `verification_report_path` from the trigger.
      - Emit exactly one `work.failed` with `reason` (copy the trigger's
        reason), `plan_path`, `context_artifact_path` (the failure note just
        written), `forge_artifact_root`, and `plan_key`. Run
        `ralph emit work.failed --policy-check -j '<payload>'` first, then
        emit for real. Cleanup and the reporter take over from there.

      ### Steps
      1. Read wave_id, wave_index, failure_fingerprint, affected_task_ids from the trigger.
      2. Read `ralph tools task list` to confirm ids are live; record `correction_round` from `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/counter` (start at 0).
      3. Scan `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/` for prior round
         fingerprints; reject duplicate-round requests (no confidence gain).
      4. Read `execution_plan_path` from trigger / projection.
         Derive `allowed_paths` from each `affected_unit_ids`'s
         `unit.template.yml` `allowed_paths`; `forbidden_paths` is the
         complement of the union.
      5. Write `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/round-<n>.md`
         (round, fingerprint, scope, evidence path).
      6. Emit `forge.correction.requested` with `correction_request_path`.

      ### Final correction (3 rounds exhausted)

      When the round counter is 3 the budget is exhausted. You have
      exactly one decision to make, and the two terminal emits are
      mutually exclusive (at most one of them per activation):

      - **Hand off to the final full tester** (preferred path when
        the failure is not a dead-end): emit exactly one
        `forge.final.correction.settled` with `correction_round: 3`
        + `plan_key` + `wave_id` + `verification_log_path`. The
        `correction_round` field is runtime-validated to be exactly
        `3` (the budget-exhausted final round); emitting it at an
        earlier round is rejected. Use `ralph tools task list` (or
        the trigger payload) for the live `wave_id` / `plan_key`.
      - **Dead-end escape** (only when the fail-confidence-rubric
        scores confidence ≥90 + coverage ≥75 AND the dead-end
        precheck passes): emit exactly one `work.failed` with
        `dead_end_confidence` + `dead_end_evidence_*` + `reason` +
        `plan_path` + `context_artifact_path` + `forge_artifact_root`
        + `plan_key`. Do NOT also emit `forge.final.correction.settled`.

      9. Never re-emit round 4. Never emit both terminal events for
         the same exhaustion. After either terminal emit, do not
         re-dispatch workers.

  executor:
    name: "Executor"
    description: "Per-slot TDD implementation in an isolated worktree for one Unit."
    concurrency: 8
    timeout: 3600
    idle_heartbeat_secs: 600
    idle_weak_signal_cap: 8
    # Cold-start grace window (mirrors ce-executor-supervisor worker). Before
    # the first qualifying signal (Strong/Weak stdout line or events-file
    # growth), the supervisor uses `startup_grace_secs` as the idle window so
    # slow-warming backends (Claude / Gemini / Codex headless) are not
    # idle-killed during their startup phase. After the first signal, the
    # regular `idle_heartbeat_secs` window takes over.
    startup_grace_secs: 300
    triggers: [exec.unit.ready]
    publishes: [exec.unit.done, exec.unit.failed]
    exempt_topics: [exec.unit.done, exec.unit.failed]
    terminal_events: [exec.unit.done, exec.unit.failed]
    event_filter:
      enabled: true
      events: [exec.unit.ready]
    instructions: |
      ## EXECUTOR MODE — one Unit / one activation (supervisor slot)

      Complete **one** Unit in its isolated worktree.

      OPAC: `ralph-tools-opac`. Before emitting, load `ralph-tools-emit` and use
      `--policy-check`. **Do not** run `ralph wave emit` or `ralph wave verify`.

      ### Step 0 — If the prompt contains `# Retry Context`

      This means the Unit ran before and this is attempt N. **The worktree is the
      same one**, and its code, commits, completion report, and test evidence remain.

      1. Inspect existing work with `git status` and `git log --oneline -10`.
      2. Read `.ralph/forge/<plan_key>/units/<unit-id>-completion.md` if present.
      3. Rerun the Unit acceptance tests and use measured results to identify gaps.
      4. Complete only the remaining work. **Do not** run `git reset`,
         `git checkout --`, `git clean`, or otherwise roll back or overwrite work;
         **do not** start over.
      5. Treat previous detail as a clue, not an instruction. Existing commits or
         reports do **not** prove success; rerun the checks and follow Step 8.

      ### Step 1 — Observe (read paths only from the trigger)

      Read these required fields from the `exec.unit.ready` trigger:
      `unit_id`、`task_id`、`task_key`、`wave_id`、`slot_index`、
      `plan_key`、`execution_plan_path`、`worktree_map_path`。

      1. Use `ralph tools task list` to verify the live `task_id` / `task_key`.
      2. Read this Unit's entry from `execution_plan_path`.
      3. Use `worktree_map_path` to locate the Unit worktree and work there.
      4. Read the matching Scenario in `.ralph/forge/<plan_key>/development-plan.md`.
      5. If templates are missing, run `ralph preset materialize-artifacts parallel-forge --plan-key <plan_key>`.

      ### Steps 2–6 — RED → GREEN → REFACTOR → REGRESSION → self-review

      Follow `unit.acceptance_test` / `tdd`, modify only `allowed_paths`, and record RED evidence.

      ### Test resource isolation (hard concurrency requirement)

      1. Get resource constraints from this Unit's `acceptance_test` / `tdd` and
         Guardian's `concurrency-approval.md`; a worktree alone does not isolate
         ports, databases, or temp directories.
      2. Every test process must derive unique temp directories, test databases/
         schemas, Docker/Compose project names, and configurable cache directories
         from `plan_key` + `wave_id` + `slot_index`. Prefer dynamic ports; otherwise
         use a preassigned port reserved for this identity and not used by another Unit.
      3. Do not use fixed `/tmp` files, database names, container projects, or service
         ports. If a command cannot be isolated and the plan has no explicit serial
         dependency, stop this Unit, record the conflict and reproduction command in
         the completion/failure artifact, and emit `exec.unit.failed`; do not hide
         contention with retries.
      4. Run test commands in phases; release ports, databases/schemas,
         containers, temp directories, and cache locks as soon as each phase no
         longer needs them instead of holding resources for the whole activation.
         Do not kill, delete, or take over another Unit's resources under pressure.
      5. After testing, clean up temporary resources created by this slot; never
         delete resources belonging to another Unit, another loop, or the existing
         repository.

      ### Step 7 — Unit Completion Report

      Copy `.ralph/forge/<plan_key>/templates/unit-completion.template.md` to
      `.ralph/forge/<plan_key>/units/<unit-id>-completion.md` and fill every section.

      ### Step 8 — Emit

      **Precheck:** before emitting, run `test -f .ralph/forge/<plan_key>/units/<unit-id>-completion.md`.
      If the completion report is absent, emit `exec.unit.failed` with
      `reason: "completion report missing for unit <unit_id>"`; do not cite the path,
      create a workaround, or fabricate the file. This is the **only** failure path
      under the one-business-event budget.

      **Mandatory precheck:** on success, first run `ralph emit exec.unit.done --policy-check`,
      then formally write the same payload without `--policy-check` (per `ralph-tools-emit` §5).
      **Never** send the real event without the precheck.

      Success: emit `exec.unit.done`, passing through the trigger's `task_id`, `task_key`,
      `wave_id`, `slot_index`, `unit_id`, and `plan_key`, plus `unit_report_path` and `content_hash`.
      Failure: emit `exec.unit.failed` with `reason` and `plan_key`.

      **Do not close tasks in this activation.** Do **not** call
      `ralph tools task close` or imply that `exec.unit.done` closes a task.

      Emit only one business event in this activation.

  reviewer:
    name: "Reviewer"
    description: "Per-wave independent review after supervisor fan-in; emits forge.wave.reviewed (accept) or forge.wave.review.failed (reject)."
    triggers: [exec.wave.complete, forge.correction.done]
    publishes: [forge.wave.reviewed, forge.wave.review.failed, forge.units.reviewed, forge.plan.blocked]
    exempt_topics: [forge.wave.reviewed, forge.wave.review.failed, forge.units.reviewed, forge.plan.blocked]
    terminal_events: [forge.wave.reviewed, forge.wave.review.failed, forge.units.reviewed, forge.plan.blocked]
    event_filter:
      enabled: true
      events:
        - exec.wave.complete
        - forge.correction.done
    instructions: |
      ## REVIEWER MODE

      Read-only on code. Review each completed Unit after supervisor development phase.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. Read `wave_id`, `wave_index`, and `plan_key` from the trigger; read
         `execution_plan_path` from the current projection. Do not assume the
         trigger provides `wave_total` or `unit_verdicts`: read the current wave's
         completion artifacts and diffs, then calculate each verdict and the wave total.
         Valid trigger entries are `exec.wave.complete` (first review after the
         wave's fan-in) or `forge.correction.done` (re-review after a fix round).
      2. List Units from the execution plan and `ralph tools task list`.
      3. For each Unit, read its completion report and inspect its worktree diff via the map.
      4. Write `.ralph/forge/<plan_key>/waves/<wave_id>/review.md` with one entry
         per fan-in Unit — this is the `review_report_path` you will emit. Record
         each Unit's reviewed commit as its worktree HEAD at review time
         (`git rev-parse` in that Unit's worktree). Review happens **before**
         integration, so never reference `forge.wave.integrated.*` fields — that
         event does not exist yet in your activation.
      5. If all Units are APPROVED, emit `forge.wave.reviewed` with `wave_id`, `wave_index`,
         `unit_verdicts`, `aggregate_verdict: ACCEPTED`, `review_report_path`, and `plan_key`.
      6. Otherwise write `waves/<wave_id>/failure-observation.md` and emit
         `forge.wave.review.failed` with the failure fingerprint, verdicts, affected task IDs,
         failure observation path, and `plan_key`. The failure handler takes over.

      **Do not** emit the legacy alias `forge.units.reviewed` or directly emit `work.failed`.
      Route failures through `forge.wave.review.failed`.

      Emit only one business event per activation.

  wave-fixer:
    name: "Wave Fixer"
    description: "Bounded correction agent for failed wave; modifies only failed Units' paths on candidate branch."
    triggers: [forge.correction.requested]
    publishes: [forge.correction.done, forge.plan.blocked]
    exempt_topics: [forge.correction.done, forge.plan.blocked]
    terminal_events: [forge.correction.done, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.correction.requested]
    instructions: |
      ## WAVE FIXER MODE

      U6 / R20 / R21: bounded correction agent. You share the same
      isolated worktree semantics as the executor slot. You **only**
      touch files in `allowed_paths`; any change outside is a hard
      block (`forge.plan.blocked`).

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. Read `wave_id`, `wave_index`, `correction_round`, `affected_unit_ids`,
         `allowed_paths`, `forbidden_paths`, `base_commit`, `candidate_branch`,
         `failure_fingerprint` from `forge.correction.requested`.
      2. Check candidate branch ref; checkout fixer's own worktree
         at `base_commit`. Never reset or force push.
      3. Read `.ralph/forge/<plan-key>/waves/<wave_id>/failure-observation.md`
         (or `verification-failure.md`) for the prior failure context.
      4. Apply the minimum fix; run **only** the affected Units'
         focused tests; commit on candidate branch.
      5. Write `.ralph/forge/<plan-key>/waves/<wave_id>/corrections/round-<n>/report.md`.
      6. Emit `forge.correction.done` (`commit_sha`, `affected_unit_ids`,
         `correction_report_path`).

      Re-review/reverify happens next: reviewer → integrator → verifier
      must re-run before any settlement. The next wave's
      `forge.wave.settled` is the only place tasks move to closed.

  integrator:
    name: "Integrator"
    description: "Per-wave sequential rebase/merge of approved Units; emits forge.wave.integrated then fast-forwards and emits forge.wave.settled."
    triggers: [forge.wave.reviewed, forge.wave.verified]
    publishes: [forge.wave.integrated, forge.wave.settled, forge.wave.integration.failed, forge.integration.done, forge.plan.blocked]
    exempt_topics: [forge.wave.integrated, forge.wave.settled, forge.wave.integration.failed, forge.integration.done, forge.plan.blocked]
    terminal_events: [forge.wave.integrated, forge.wave.settled, forge.wave.integration.failed, forge.integration.done, forge.plan.blocked]
    event_filter:
      enabled: true
      events:
        - forge.wave.reviewed
        - forge.wave.verified
    instructions: |
      ## INTEGRATOR MODE

      Serial integration only — development was parallel; integration is strictly ordered.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. **Entry one** (`forge.wave.reviewed`): the reviewer accepted and candidate
         integration begins. Read `aggregate_verdict`, `review_report_path`, and
         `plan_key` from the trigger; read `execution_plan_path` from the projection
         and `unit_verdicts` in full from the review report. If any Unit is REJECTED,
         write the failure observation and emit `forge.wave.integration.failed` with
         the wave, verdict, fingerprint, affected IDs, observation path, and `plan_key`;
         **do not** emit `work.failed` directly.
      2. **Entry two** (`forge.wave.verified`): verification passed; fast-forward
         `integration_branch`. Read `wave_id`, `wave_index`,
         `candidate_commit_sha`, `verification_log_path`, and `plan_key` from the
         trigger (those are its schema fields); read `integration_branch` from
         the projection (`forge.integration_branch`, pinned by
         `forge.worktrees.ready`). The trigger does not carry `settled_unit_ids`
         or `verified_base_commit`: derive the settled id arrays at step 8 and
         the verified base after the fast-forward; never copy them from the
         trigger.
      3. Read the real `integration_branch` from the worktree map or projection and
         confirm it with `git branch --list` in the main repository.
      4. In `integration_order`, rebase, squash, and fast-forward merge each Unit;
         append to `integration-log.md`.
      5. Write `.ralph/forge/<plan_key>/integration-log.md` and `commit-map.yml`.
      6. Verify linear history: one commit per Unit, with no merge or WIP tail.
      7. On entry one success, emit `forge.wave.integrated` with the schema fields
         `wave_id`, `wave_index`, `candidate_branch`, `candidate_commit_sha`
         (`git rev-parse` of the candidate branch HEAD after this wave's merges),
         `commit_map_path`, `units_integrated`, and `plan_key`.
      8. On entry two success, emit `forge.wave.settled` with `wave_id`, `wave_index`, `settled_task_ids`,
         `settled_unit_ids`、`verified_base_commit`、`plan_key`、`settlement_log_path`）。
         `verified_base_commit` is the integration branch HEAD after the
         fast-forward (`git rev-parse <integration_branch>`); it must equal the
         verified `candidate_commit_sha` and becomes the next wave's worktree
         base.
         **Payload shape is a hard requirement:** `settled_task_ids` and
         `settled_unit_ids` must be JSON arrays of strings, never a JSON string
         containing an array, comma-separated strings, or empty arrays. Validate with `ralph emit forge.wave.settled --schema`
         and `--policy-check`; if live ID arrays are unavailable, stop and write
         `failures/integrator-failed.md` instead of guessing or fabricating IDs.
      Runtime atomically closes tasks through `CloseTaskBatch` when it receives
      `forge.wave.settled`; this hat does not call `ralph tools task close`.
      If the runtime rejects the settlement, do not close tasks manually; rebuild
      both arrays from the live task list and re-emit only after `--policy-check`.
      9. On failure, write the failure and merge-conflict templates, then emit
         `forge.wave.integration.failed` or `forge.plan.blocked` for missing settlement
         paths; **do not** emit `work.failed` directly.

      Emit only one business event per activation. Use the new topics on the main path;
      retain `forge.integration.done` only as a legacy alias in `publishes`.

      ### Rejected-resume discipline

      If the runtime rejects `forge.wave.settled` and sends `task.resume`,
      read the correction context and rebuild both ID arrays from the current
      settlement evidence. Do not call `ralph tools task close` and do not
      resend the rejected string-encoded payload. First run
      `ralph emit forge.wave.settled --policy-check -j '<payload>' --output json`,
      then formally emit the identical corrected payload and require
      `recorded=true`. If the live IDs cannot be proven, stop and emit the
      declared integration-failure or blocked event with its evidence instead
      of guessing.

  verifier:
    name: "Verifier"
    description: "Per-wave verification on candidate HEAD; emits forge.wave.verified (pass) or forge.verification.failed (fail)."
    triggers: [forge.wave.integrated, forge.integration.done]
    publishes: [forge.wave.verified, forge.verification.failed]
    exempt_topics: [forge.wave.verified, forge.verification.failed]
    terminal_events: [forge.wave.verified, forge.verification.failed]
    event_filter:
      enabled: true
      events:
        - forge.wave.integrated
        - forge.integration.done
    instructions: |
      ## VERIFIER MODE

      Run incremental regression per integrated Unit chain.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. On the main-path trigger `forge.wave.integrated`, read `wave_id`,
         `wave_index`, `candidate_branch`, `candidate_commit_sha`,
         `commit_map_path`, and `plan_key` from the trigger (its schema fields);
         read `integration_branch` from the projection (`forge.integration_branch`,
         pinned by `forge.worktrees.ready`) and per-Unit integration detail from
         the commit map artifact. The compatibility entry `forge.integration.done`
         carries `integration_branch` and `integration_log_path` directly and gets
         candidate HEAD from integration-log/commit-map artifacts. Do not read
         `verified_base_commit`.
      2. Run incremental tests from the development and execution plans. Although
         verification is serial after integration, check for fixed ports, databases,
         Docker projects, temp files, and external services; if safety is unknown,
         stop and record the resource, command, and conflict risk in
         `failures/verifier-failed.md`.
      3. Use temp directories, caches, and test-data namespaces derived from
         `plan_key` + `wave_id`; never reuse fixed resources from another Unit or loop.
      4. Write `.ralph/forge/<plan_key>/incremental-verification.md`.
      5. Emit `forge.wave.verified` at most once per `(wave_id, candidate_commit_sha)`;
         do not resend it after a successful emit in the same activation.
      6. On success, emit `forge.wave.verified` with `wave_id`, `wave_index`,
         `verification_log_path`、`passed`、`last_integrated_unit`、
         `candidate_commit_sha`、`plan_key`）。
      7. On failure, write `failures/verifier-failed.md` using the wave-failure
         template and emit `forge.verification.failed` with the wave, candidate SHA,
         fingerprint, affected task IDs, `plan_key`, and failure path. **Do not** emit
         `work.failed` directly; the failure handler takes over.

      Emit only one business event per activation. Use `forge.wave.verified` and
      `forge.verification.failed` on the main path; retain the old
      `forge.incremental.verified` only as a compatibility alias in `publishes`.

  tester:
    name: "Tester"
    description: "Full regression and CI-equivalent gates after all Units integrated."
    triggers: [forge.exec.development.done, forge.final.correction.settled]
    publishes: [forge.full.verified, forge.full.verification.failed]
    exempt_topics: [forge.full.verified, forge.full.verification.failed]
    terminal_events: [forge.full.verified, forge.full.verification.failed]
    event_filter:
      enabled: true
      events:
        - forge.exec.development.done
        - forge.final.correction.settled
    instructions: |
      ## TESTER MODE

      Full project verification — not only unit tests.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. Read `plan_key` from the trigger. The trigger is
         `forge.exec.development.done` for the first full run — also read its
         `execution_plan_path`; per-wave verification logs, when needed for
         context, live at `.ralph/forge/<plan_key>/waves/*/verification.md` —
         or `forge.final.correction.settled` after three correction rounds,
         which carries `verification_log_path` and `wave_id` in its schema.
      2. This hat owns full verification for the loop. Before starting, check
         whether an equivalent full verification is already running; wait for it
         or report the conflict instead of launching a second gate in parallel.
      3. Run all test, lint, build, and typecheck commands declared by the plan,
         README, CI, and Makefile. Use isolated temp/cache directories, test
         databases, and service namespaces for `plan_key`; serialize fixed ports
         or external resources that cannot be isolated and record the reason.
      4. Write `.ralph/forge/<plan_key>/full-verification.md` with actual commands,
         resource namespaces, and any serialization decisions.
      5. On success, emit `forge.full.verified` with `verification_report_path`,
         `all_required_passed`, and `plan_key`. Emit it only when every
         required gate actually passed: `all_required_passed: false` or an
         empty `verification_report_path` is rejected at emit time — take
         the failure path in step 6 instead of emitting a false-success
         receipt.
      6. On failure, write `failures/tester-failed.md` from the wave-failure template,
         then emit `forge.full.verification.failed` with `plan_key`,
         `verification_report_path`, `failure_fingerprint`, `context_artifact_path`,
         `forge_artifact_root`, and `reason`. **Never** emit `work.failed`
         yourself — it is denied for this hat; the forge-failure-handler owns
         the terminal failure event and takes over from your typed failure.
         Do not send an undeclared failure topic.

      Emit only one business event per activation; the main path emits only
      `forge.full.verified` or `forge.full.verification.failed`.

  auditor:
    name: "Auditor"
    description: "Final delivery audit: plan traceability, git history, tests, workspace cleanliness."
    triggers: [forge.full.verified]
    publishes: [forge.audit.done, forge.plan.blocked]
    exempt_topics: [forge.audit.done, forge.plan.blocked]
    terminal_events: [forge.audit.done, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.full.verified]
    instructions: |
      ## AUDITOR MODE

      Read-only audit. Verdict: ACCEPTED | REJECTED | BLOCKED.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit` then `--policy-check`.

      ### Steps
      1. From trigger read `verification_report_path` and `plan_key`.
      2. Cross-check requirements→scenarios→tests→commits using artifacts under `.ralph/forge/<plan_key>/` (paths from trigger/projection only).
      3. Verify linear git history, clean worktree, no skipped tests.
      4. Write `.ralph/forge/<plan_key>/final-audit.md`.
      5. For an accepted audit, also copy `target_branch`, `target_start_sha`,
         `target_status_fingerprint`, and `integration_head_sha` from the
         projection and verify the integration head is a descendant of the
         target start SHA. Emit `forge.audit.done` with all fields, or write
         `blocks/auditor-blocked.md` and emit `forge.plan.blocked` with context paths.
         A non-ACCEPTED verdict must never emit `forge.audit.done`.

      Single business event.

  finalizer:
    name: "Finalizer"
    description: "Final delivery gate: materialize artifacts and fast-forward the integration branch into the starting branch."
    triggers: [forge.audit.done]
    publishes: [forge.finalized, forge.plan.blocked]
    exempt_topics: [forge.finalized, forge.plan.blocked]
    terminal_events: [forge.finalized, forge.plan.blocked]
    event_filter:
      enabled: true
      events: [forge.audit.done]
    instructions: |
      ## FINALIZER MODE — delivery boundary

      This hat owns the last handoff from the forge integration branch to the
      branch checked out before the run. It may change Git refs and copy forge
      artifacts, but it must not edit production source files.

      OPAC: `ralph-tools-opac`. Before emit: `ralph tools skill load ralph-tools-emit`
      then run `--policy-check` with the exact finalization payload.

      1. Read `integration_branch`, `target_branch`, `worktree_map_path`,
         `audit_report_path`, and `plan_key` from the trigger/projection;
         read `target_worktree` from `RALPH_WORKSPACE_ROOT`.
         `target_branch` and `target_worktree` are the runner-injected
         identity of the checkout that launched this loop; never infer them
         from a preset name or from the first `git worktree list` entry.
      2. Verify the target worktree is clean and that target and integration
         are different real branches. Run
         `git merge-base --is-ancestor <target HEAD> <integration HEAD>`.
         If the target advanced or the check fails, write
         `.ralph/forge/<plan_key>/blocks/finalizer-blocked.md` and emit
         `forge.plan.blocked`; never reset, force-push, or overwrite the target.
      3. Before cleanup, materialize every required artifact into the main
         repository artifact root: `final-audit.md`, `full-verification.md`,
         `integration-log.md`, one `waves/<wave_id>/review.md` for every
         settled wave, and one
         `units/<unit_id>-completion.md` for every settled Unit. If an artifact
         exists only in an integration or executor worktree, copy it to the
         corresponding main-repository path and verify it with `test -f`.
      4. Write `finalization.md` containing target branch, integration branch,
         pre-merge target SHA, integration SHA, and resulting target SHA.
      5. From `target_worktree` run `git merge --ff-only <integration_branch>`.
         A non-fast-forward result is a hard block, not a retry with reset or
         force merge. Record the resulting target SHA in `finalization.md`.
      6. Only after the merge and all artifact checks pass, emit
         `forge.finalized` with `target_branch`, `integration_branch`,
         `target_commit_sha`, `finalization_report_path`, and `plan_key`.
         Every value must be real and non-empty: an empty
         `target_commit_sha`, `target_branch`, or
         `finalization_report_path` is rejected at emit time — fix the
         evidence first instead of emitting an empty receipt.

      Single business event. The cleanup hat runs after this event and owns
      forge resource cleanup. Do not emit `forge.report.done` or
      `LOOP_COMPLETE` from this hat.

  cleanup:
    name: "Cleanup"
    description: "Cleans forge unit worktrees and temporary branches before reporting."
    triggers: [forge.finalized, forge.plan.blocked, work.failed, forge.units.reviewed]
    publishes: [forge.cleanup.done]
    exempt_topics: [forge.cleanup.done]
    terminal_events: [forge.cleanup.done]
    event_filter:
      enabled: true
      events: [forge.finalized, forge.plan.blocked, work.failed, forge.units.reviewed]
    instructions: |
      ## CLEANUP MODE — forge resource lifecycle owner

      You own forge resource cleanup for this preset. Cleanup happens before the
      reporter; the reporter only reads your result and must not clean worktrees
      or branches. Runtime still performs fallback cleanup of supervisor
      `ralph/*` slot resources when the loop terminates. OPAC: `ralph-tools-opac`;
      load `ralph-tools-emit`, run `--policy-check`, then formally emit.

      If the trigger is the legacy alias `forge.units.reviewed`, record the
      observation and stop; do not clean up or emit `forge.cleanup.done` from this
      non-terminal trigger.

      ### Trigger and policy

      1. Read `plan_key`, `worktree_map_path`, `integration_branch`, and
         `target_branch` from the trigger/projection. Prefer the
         `forge.worktrees.ready` projection for the map; if absent, use
         `.ralph/forge/<plan_key>/worktree-map.yml`.
      2. On `forge.finalized`, remove the Unit worktrees, Unit branches, and
         integration branch created by this plan. Never remove `target_branch`.
      3. On `forge.plan.blocked` or `work.failed`, remove safely removable
         worktrees but retain Unit and integration branches for diagnosis; mark
         them `retained_for_diagnosis`.
      4. Process only exact branches and paths in the worktree map; never use
         broad globs or delete a branch outside the map.

      ### Cleanup action for each resource

      1. Run `git worktree list --porcelain` and confirm the current path/branch
         binding; if the path is absent, continue and do not treat the resource as complete.
      2. If the path exists, run `git worktree remove --force <exact-path>`.
      3. After successful delivery, if the branch is not `target_branch`, verify
         `git show-ref --verify --quiet refs/heads/<exact-branch>` and run
         `git branch -D <exact-branch>`. Do not do this for failed runs.
      4. Record `unit_id`, `path`, `branch`, `worktree_removed`,
         `branch_removed` or `retained`, and the failure reason for every resource.
      5. Run `git worktree prune` and recheck the final path/branch state.

      ### Confirm

      Write `.ralph/forge/<plan_key>/cleanup.md`. After confirming it exists,
      load `ralph-tools-emit`, run `ralph emit forge.cleanup.done --policy-check`,
      then formally emit the same payload. The payload must contain:

      - `cleanup_report_path`: the repo-relative path to cleanup.md;
      - `cleanup_status`: `completed`, `partial`, or `retained_for_diagnosis`;
      - `attempted_count`, `cleaned_count`, and `pending_count`;
      - `plan_key`。

      Never claim `completed` when cleanup fails. Make a best effort on remaining
      resources and emit `partial`, so the reporter records uncleared items.

      Single business event.

  reporter:
    name: "Reporter"
    description: "Writes manager-readable Markdown report; terminal hat."
    triggers: [forge.cleanup.done]
    publishes: [forge.report.done, LOOP_COMPLETE]
    exempt_topics: [forge.report.done, LOOP_COMPLETE]
    terminal_events: [forge.report.done, LOOP_COMPLETE]
    event_filter:
      enabled: true
      events: [forge.cleanup.done]
    instructions: |
      ## REPORTER MODE — terminal hat

      Aggregate read-only evidence and write the report; do not modify production
      code. OPAC: `ralph-tools-opac`. Before emitting, load `ralph-tools-emit` and
      use `--policy-check`. For materialization, load `ralph-tools-cmdref`.

      ### Lifecycle (the cleanup hat has reclaimed resources)

      Read the cleanup.md referenced by `forge.cleanup.done.cleanup_report_path` and
      copy every resource path, branch, and result into the manager report. Do not
      repeat `git worktree remove` or `git branch -D`. Do not delete business files
      under `.ralph/forge/<plan_key>/`; they belong to the operator.

      ### Templates

      If the templates directory is missing:
      `ralph preset materialize-artifacts parallel-forge --plan-key <plan_key>`
      Copy `manager-report.template.md` to
      `docs/reports/<YYYY-MM-DD>-<task-name>-manager-report.md`

      ### Step 1 — Observe (artifact-first; do not scan event history)

      **Read paths from the current trigger; do not guess:**
      - `forge.cleanup.done`：`cleanup_report_path`、`cleanup_status`、
        `attempted_count`、`cleaned_count`、`pending_count`、`plan_key`
      - Read other report paths from the projection or cleanup.md.

      The cleanup hat must generate cleanup.md for every path. If the cleanup
      report is missing or the payload lacks `plan_key`, derive it from the only
      child directory under `.ralph/forge/`, then fall back to its
      `worktree-map.yml` / `execution-plan.yml`. If it still cannot be resolved,
      write "Information missing; cannot confirm" and set `status=BLOCKED` and
      `final_audit=BLOCKED`.

      Then read the complete artifacts referenced by the trigger/projection:
      - `<forge_artifact_root>/development-plan.md` and `execution-plan.yml`
      - `units/*-completion.md` and `waves/*/review.md` if present
      - `integration-log.md`, `full-verification.md`, and `final-audit.md` if present
      - the complete `context_artifact_path`

      For `forge.finalized`, the finalizer should have verified terminal artifacts
      beyond the cleanup report. For blocked/failed paths, report only artifacts
      that actually exist; never claim missing content was verified or map
      `cleanup_status=partial` or `retained_for_diagnosis` to `COMPLETED`.

      For missing evidence, write "Information missing; cannot confirm".

      ### Step 2 — Apply: fill each template section

      Keep the template sections, copy the Unit subsection for each Unit, and fill the self-checklist.

      ### Step 3 — Status mapping

      | Source | report `status` / `final_audit` |
      |---|---|
      | cleanup trigger from accepted audit | COMPLETED / ACCEPTED |
      | cleanup trigger from blocked plan | BLOCKED / BLOCKED |
      | cleanup trigger from failed work | FAILED / FAILED |

      ### Step 4 — Confirm & emit

      1. Run `test -f` on the report path and record the same `report_path`.
         Never emit `forge.report.done` with an empty `report_path`, and
         never claim `status: COMPLETED` while `final_audit` is not
         `ACCEPTED` — both shapes are rejected at emit time, so fix the
         report content or the status mapping instead of forcing the
         success receipt through.
      2. First run `ralph emit forge.report.done --policy-check` with `report_path`,
         `status`, `final_audit`, and `plan_key`; then formally write the same
         payload without `--policy-check`. If precheck or formal emit is rejected,
         **do not** emit `LOOP_COMPLETE` or another business event. Record the
         reason and trigger context in the report appendix, then stop and let
         `ralph run` resume naturally.
      3. Emit `LOOP_COMPLETE` as the reporter's narrow dual-terminal exception with
         the same `report_path`; runtime rejects mismatches with the accepted
         `forge.report.done` path.
      4. Print `DELIVERABLE_PATH: <report_path>`.

      ### Resume rules

      If the loop stops after `forge.report.done`, resume must **not** rewrite
      existing audit/report facts to manufacture a new success. Only resend
      `LOOP_COMPLETE` with the previous `forge.report.done.report_path`; to create
      a new report, emit a new `forge.report.done` first.
