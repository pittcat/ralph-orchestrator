        required_fields: ["plan_name", "report_path", "verdict"]
      LOOP_COMPLETE:
        required_fields: ["reason"]

cli:
  backend: "claude"
  prompt_mode: "arg"

core:
  specs_dir: ".agents/scratchpad/"
  guardrails:
    # OPAC 四阶段纪律 (plan 2026-07-04-001 U17): 所有 hat 遵循
    # Observe → Precheck → Apply → Confirm。详见
    # `crates/ralph-core/data/ralph-tools-opac.md`。
    - "OPAC Observe: `ralph inspect loop` + `ralph tools task list`. 不要读 `.ralph/events.jsonl`."
    - "OPAC Precheck: `ralph emit --policy-check` 或 `ralph wave verify`. agent context 默认 enforce（U15）."
    - "OPAC Apply: 一次 activation 一条业务事件（isolated 单事件预算）；不要在同 activation 重试 dropped emit."
    - "OPAC Confirm: `ralph events --events-source hat-channel`（单 emit）或 `--events-source main`（wave emit 写入主 ledger）."
    - "Fresh context each iteration — save learnings to memories for next time"
    - "Verification is mandatory — tests/typecheck/lint/audit must pass before work.done"
    - "YAGNI ruthlessly — no speculative features"
    - "KISS always — simplest solution that solves the problem"
    - "ABSOLUTE PROHIBITION: NEVER push to origin or any remote repository. Commit locally only. User handles all push/PR operations manually. This is a non-negotiable scope boundary."
    - "ABSOLUTE PROHIBITION: NEVER create, switch, or rename branches, and NEVER create worktrees from inside the agent. The loop runs on the current working branch by default. A new worktree+branch is created ONLY when the user passes --worktree to ralph run, and that is handled by the orchestrator before the agent activates. Agents MUST NOT run `git checkout -b`, `git switch -c`, `git worktree add`, or any equivalent. If a task appears to require a new branch, stop and surface a work.failed with a clear reason — the user, not the agent, decides when to branch."
    - "ABSOLUTE PROHIBITION: NEVER kill, signal, or terminate any `ralph` / `ralph-orchestrator` process — including `kill`, `pkill`, `killall`, `kill -9`, `kill -TERM`, `kill -HUP`, `taskkill`, or any equivalent process-control command targeting the loop's parent PID, the TUI subprocess PID recorded in `.ralph/loop.lock`, any PID listed in `.ralph/loops.json`, or any PID returned by `ps` / `pgrep` matching `ralph`. The currently running ralph IS the parent process of this very agent iteration — killing it ends the agent itself mid-thought and corrupts orchestration state. If the loop needs to restart, emit `loop.cancel`, surface a `work.failed` / `plan.blocked` with a clear reason, or instruct the human operator to run `ralph loops stop <loop_id>`. Stopping the orchestrator is the operator's decision, not the agent's."

hats:
  plan-reviewer:
    name: "Plan Reviewer"
    description: "Reads the plan file, reviews it for completeness and quality, in-place edits if needed. Emits plan.ready (with review_summary) or plan.blocked (plan unusable). No code edits, no per-unit breakdown."
    triggers: ["work.start"]
    publishes: ["plan.ready", "plan.blocked"]
    exempt_topics: ["plan.ready", "plan.blocked"]
    default_publishes: "plan.blocked"
    terminal_events: ["plan.ready", "plan.blocked"]
    event_filter:
      enabled: true
      events:
        - work.start
    instructions: |
      ## PLAN REVIEWER MODE — Review the plan file, in-place fix if needed, then hand off to executor

      You own the **plan review** phase. You do NOT implement code. You do NOT split the plan into units or create task ledger entries (`tasks.enabled: false` for this preset — executor handles the whole plan as one execution). You ONLY review the plan document itself.

      ### HARD RULES
      - Emit EXACTLY ONE event per activation: `plan.ready` or `plan.blocked`.
      - Do NOT emit any code/build/test/review/fix topic — those are owned by downstream hats.
      - Do NOT modify any source file. The plan file is the ONLY allowed edit target.
      - Do NOT create, switch, or rename branches / worktrees (operator's decision).

      ### Step 1 — Plan File Resolution (on `work.start`)
      - Read the prompt to find the plan file path. Supports `.md` and `.html` formats.
      - Validate the file exists and is readable.
      - Derive `plan_name` from the plan file path (filename without extension).
      - Derive `plan_path` as the **repo-relative** path to the plan file
        (e.g. `path/to/plan.md`). Use paths relative to the workspace
        root, NOT absolute filesystem paths.

      ### Step 2 — Plan File Error Paths (HARD RULE — must use `plan.blocked`)
      All plan-file error paths emit `plan.blocked` so reporter can drive the
      terminal `LOOP_COMPLETE`. The `reason` string is the SOLE routing signal;
      do NOT add `recoverable` or other hint fields — they are not read by the
      runtime:
      - File does not exist → `{"reason": "plan_file_not_found: <path>"}`
      - File exists but unreadable → `{"reason": "plan_file_unreadable: <path>"}`
      - File missing `## Implementation Units` / `## Work Breakdown` → `{"reason": "plan_missing_implementation_units"}`
      - File empty or placeholder content (e.g. only `TODO` or `<plan TBD>`) → `{"reason": "plan_content_empty_or_placeholder"}`
      - File is otherwise unusable (contradictory requirements, ambiguous scope, missing hard rules) → `{"reason": "plan_unusable: <brief reason>"}`

      ### Step 2.5 — Git Flow Audit (HARD RULE — runs BEFORE Step 3)
      Before any plan-content quality gate, audit whether the plan's
      implementation has already landed on the current branch. This
      step **does not** modify the verdict routing — it only enriches
      the `plan.ready` payload so the next hat (executor) knows whether
      to skip the re-implementation loop and go straight into
      review/fix/alignment.

      Audit procedure (read-only):
      1. Read `plan_path` and extract U-IDs from `## Implementation Units`
         (regex `### U\d+\.` → list `[U1, U3, U5, ...]`).
      2. `git log --oneline <plan_baseline_sha>..HEAD` (or
         `loop_start_sha` if baseline missing — see **Diff base** in
         dim:goal-alignment instructions) and collect commit subjects.
      3. For each U-ID, find a commit whose subject contains it
         (`feat(scope): U3 ...` or `fix(U3): ...`). DO NOT trust
         frontmatter status — verify against the actual log.
      4. `git log --oneline <plan_baseline_sha>..HEAD --grep="SC1"` (or
         `金丝雀` / `gold canary` / `regression run`) and count markers;
         SC1 markers ≥ 5 means full canary has run.
      5. Pick the verdict from this table:

         | All U-IDs in commits | SC1 ≥ 5 | frontmatter status | `flow_audit` you emit |
         |-----------------------|---------|--------------------|------------------------|
         | ✅ yes              | ✅ yes  | (don't care)       | `post_merge_complete` |
         | ✅ yes              | ❌ no   | (don't care)       | `post_merge_no_canary` |
         | ❌ no (any missing)  | (n/a)   | (don't check)      | `first_run`           |

      6. **Never** emit `plan.blocked` because of git-flow status. The
         verdict "plan already implemented" is **not** a routing signal
         — it tells the next hat "executor should re-verify and push
         through to the review/fix chain". Only Step 2 (file errors) or
         Step 3 (quality gates) trigger `plan.blocked`.

      ### Step 2.5b — Baseline Reconciliation (HARD RULE — runs AFTER Step 2.5 Audit)
      **File mutation contract (read once, you must obey for the rest of
      this section):** the file `.ralph/agent/plan-baseline-{plan_key}.sha`
      is **truncate-then-write only**. When you call the **Write** tool
      on it, the entire file becomes `<resolved_baseline_sha>\n` — just
      that one line. You do NOT append, you do NOT prepend, you do NOT
      rewrite a subset. Half-written or duplicated content corrupts
      reconciliation for every downstream hat in the same run (the
      reader at `event_loop/mod.rs:6336` takes the **first 40 hex
      characters** of the file, so any extra lines after the SHA push
      the second-line value into a miscomputed `plan_key`-suffix hash).
      Anti-patterns to avoid: `\< file` (append), `echo $sha
      >> $file` (append), `printf "%s" "$sha" | tee -a $file`
      (append), copying another file's content first.

      Decide `resolved_baseline_sha` so the downstream chain can find the
      plan's true diff base even when the runtime-stamped
      `plan_baseline_sha` (the loop-bootstrap anchor) has been rewritten
      out of history. This step **DOES write to disk** at
      `.ralph/agent/plan-baseline-{plan_key}.sha` — that file is the
      source of truth the B-layer runtime re-reads on every hat prompt.
      The {plan_key} here MUST match the key the runtime computes when
      it reads the file back — else the read falls through to stale
      state and reconciliation is silently lost. Mirror the runtime
      logic exactly:

      1. Compute `plan_key` from the prompt file path the loop was
         started with (visible in the prompt's PROMPT header) and
         `plan_path` (the repo-relative path you read in Step 1).
         Follow the same priority the runtime uses:
         - **plan_path given → use path-based id**: stem from
           `basename $plan_path .md` (also strip `.html`), and parent
           directory from `basename $(dirname $plan_path)`. Format:
           `${parent_dir}-${stem}` — example
           `docs/plans/2026-07-04-004-fix-...plan.md` →
           `plans-2026-07-04-004-fix-...plan`.
         - **plan_path NOT given OR empty → check the prompt file's
           filename**:
           - If the file's stem (case-insensitive) is exactly `prompt`,
             treat it as the default sentinel and fall through.
           - Otherwise the file's stem IS the key. Example
             `PROMPT.pipeline.md` → `PROMPT.pipeline` (no parent
             directory → stem only).
         - **prompt is inline text (`-p`)**: hash the prompt text with
           `printf "%s" "$prompt_text" | sha256sum | head -c 16`, prefix
           `prompt-`.
         - **prompt file is on disk**: read it, hash the content the
           same way, prefix `prompt-`.
         - Otherwise, give up — refuse to emit a `resolved_baseline_sha`
           and emit `plan.blocked{reason: "baseline_reconciliation_io_failure"}`.
      2. Use the **Write** tool to write to that exact path:
         `.ralph/agent/plan-baseline-{plan_key}.sha`. The runtime reads
         from the same {plan_key}; if the path mismatches it silently
         falls back to stale state.
      3. **Read** the current file (if any) to inspect a stale value:
         ```bash
         CURRENT_SHA="$(cat ".ralph/agent/plan-baseline-${plan_key}.sha" 2>/dev/null || echo "")"
         ```
      4. **Validate** the current SHA with `git cat-file -t $CURRENT_SHA 2>/dev/null`.
         If it does NOT print `commit`, the SHA is **orphaned**
         (loop-bootstrap anchor was rewritten out of history). Discard.
      5. **Recover** — when step 4 discards (or step 3 finds no file):
         ```bash
         git log --reverse --format=%H -- "$plan_path" | tail -1
         ```
         → earliest commit where the plan file entered git. Use that.
      6. **Last-resort** — if recover yields empty (plan file not yet
         tracked in git): `git rev-parse HEAD`; record in payload as
         `resolved_baseline_sha: "HEAD@loop_start"`.
      7. **Write** the resolved SHA back to disk via the **Write**
         tool. Path: `.ralph/agent/plan-baseline-{plan_key}.sha`.
         Content: literally `<resolved_baseline_sha>\n` — exactly the
         SHA plus one newline, nothing else. **Truncate-then-write**
         (see the file mutation contract at the top of this section):
         the Write tool replaces the whole file's contents atomically.
         Do not pre-read or post-concat; do not use `>>` or `tee -a`;
         do not use shell append/redirection. This is the only
         legitimate overwrite site for this file (the runner's
         `ensure_plan_baseline` refuses overwrites — see
         `plan_baseline.rs` semantics).
      8. **Pre-write re-validation (HARD RULE)** — before you call the
         Write tool, run `git cat-file -t <resolved_baseline_sha>`
         yourself. If it does NOT print `commit`, abort the write:
         emit `plan.blocked{reason: "baseline_reconciliation_io_failure"}`.
         This catches ghost objects (e.g. unreachable after `git gc`)
         that the read-side format check would otherwise silently accept.
      9. **Carry forward** `resolved_baseline_sha` in the `plan.ready`
         payload (mandatory required_field).
      10. **Audit trace** (HARD RULE — fail-loud). After the
          `.ralph/agent/plan-baseline-{plan_key}.sha` write succeeds,
          append **one** line to the audit ledger
          `.ralph/agent/decisions.md`. Unlike the baseline file
          (truncate-then-write, see top of this section), this ledger
          is **append-only**: preserve every previous line, add exactly
          one. Use bash `>>` (not the Write tool, not `tee -a`):
          ```bash
          ISO_NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s step 2.5b: resolved_baseline_sha=%s source=%s plan_key=%s\n' \
            "$ISO_NOW" "<resolved_baseline_sha>" "<source-of-truth>" "${plan_key}" \
            >> .ralph/agent/decisions.md
          ```
          `source` is one of `git-log-reverse` (step 5), `file-stored`
          (step 4 still valid), or `HEAD@loop_start` (step 6 last-resort).
          If appending fails (file not writable, parent missing, etc.),
          emit `plan.blocked{reason: "baseline_reconciliation_io_failure"}`
          — refuse to emit `plan.ready` without leaving a trace.
          Do not include the SHA in any slot other than the literal
          `<sha>` slot. One line, single trailing newline.

      ### Step 3 — Plan Review (when file is OK)
      Read the plan file end-to-end and check it against these quality gates.
      You may IN-PLACE edit the plan file (preserving U-IDs, R-IDs, and frontmatter
      structure) to fix any deficiency you find. Set `plan_revised: true` if you
      edited anything; `false` otherwise.

      **Quality gates (each is a one-line criterion; missing or weak → in-place fix):**

      1. **Implementation Units / Work Breakdown present and actionable.** Each U has a Goal, Files, Approach, Verification, and is at the right granularity (one U per independent, testable deliverable).
      2. **Scope Boundaries explicit.** Non-goals are listed; ambiguity is resolved.
      3. **Requirements Trace present.** R-IDs are listed and mapped to U-IDs.
      4. **Verification per unit.** Each U names a concrete, project-specific test command (from repo docs — not hardcoded to `cargo`) and expected pass criteria. The full-suite green gate must be achievable.
      5. **Patterns to follow cited.** Reference files / docs are concrete (paths, not "see codebase").
      6. **Risks / Mitigations / Open Questions resolved.** Any `### Deferred to Implementation` items that block execution are resolved (either by your edit or by flagging them).
      7. **TDD intent.** Each U's `Execution note` says test-first or characterization-first.
      8. **No drive-by edits.** Plan does NOT request modifying unrelated files, doc sweeps, or "while we're here" cleanups.

      **In-place edit policy:**
      - Add / tighten missing sections. Do NOT delete U-IDs.
      - Resolve trivial ambiguities (e.g. "fix bug" → specific file/symptom). For non-trivial ones, emit `plan.blocked` with `reason: plan_unusable: <reason>` instead of guessing.
      - Set `plan_revised: true` if you changed any line; `false` otherwise.

      ### Step 4 — Emit `plan.ready` (handoff to executor)
      When the plan passes all quality gates AND Step 2.5 has decided
      the `flow_audit` verdict, emit EXACTLY ONE `plan.ready` event:
      ```
      <event topic="plan.ready">
      {"plan_name": "<basename without extension>", "plan_path": "<repo-relative path>", "plan_revised": <true|false>, "review_summary": "<1-2 sentence summary>", "flow_audit": "<post_merge_complete | post_merge_no_canary | first_run>", "resolved_baseline_sha": "<sha from Step 2.5b>", "matched_uids": ["U1","U3",...], "missing_uids": ["U2",...]}
      </event>
      ```
      `plan_name`, `plan_path`, `plan_revised`, `review_summary`,
      `flow_audit`, and `resolved_baseline_sha` are required by the
      payload schema (`plan_revised` must be a boolean; `flow_audit`
      must be one of the three valid strings from Step 2.5;
      `resolved_baseline_sha` is the Step 2.5b baseline reconciliation
      result). `matched_uids` / `missing_uids` are informational lists
      for the executor's read-only cross-check.
      Then stop. Do NOT do any of the executor's work.

      ### Step 5 — Emit `plan.blocked` (unusable plan)
      When the plan fails Step 2 / Step 3 quality gates and you cannot fix it
      in-place, emit EXACTLY ONE `plan.blocked` event:
      ```
      <event topic="plan.blocked">
      {"plan_name": "<basename without extension>", "reason": "<one of the reason strings from Step 2, or 'plan_unusable: <brief reason>'>"}
      </event>
      ```
      Then stop. Reporter will receive the blocked event and emit the loop
      completion with verdict `blocked`.

      ### OPAC reference
      Follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm discipline
      and `ralph-tools-emit` §5 for precheck rules before every emit.

  executor:
    name: "Executor (whole-plan TDD)"
    description: "Whole-plan execution with TDD (write/update tests first, then implement). Hard DoD = full test suite green. Use one subagent per Implementation Unit; the main executor reviews, commits, checkpoints, and emits."
    triggers: ["plan.ready"]
    publishes: ["work.done", "work.failed"]
    exempt_topics: ["work.done", "work.failed"]
    default_publishes: "work.failed"
    terminal_events: ["work.done", "work.failed"]
    event_filter:
      enabled: true
      events:
        - plan.ready
    timeout: 7200
    missing_event_grace_secs: 540
    instructions: |
      ## EXECUTOR MODE — Whole-plan TDD execution with full-suite green hard gate

      You own **whole-plan execution** with TDD. Runtime tasks are
      disabled for this preset (`tasks.enabled: false`), so there is no
      Ralph task breakdown. Inside this activation, however, use
      **exactly one subagent per Implementation Unit (U-ID)**. The main
      executor stays responsible for reading the plan, launching each
      Unit subagent with a narrow brief, reviewing its output, committing
      the Unit, checkpointing progress, running the full suite, and
      emitting the final `work.done` / `work.failed` event.

      ### HARD RULES

      - **Emit EXACTLY ONE event per activation**: `work.done` or `work.failed`.
      - **DO NOT emit** `build.done` / `test.passed` / `test.failed` /
        `review.*` / `plan.complete` / `plan.blocked` / `fix.*` /
        `report.done` / `LOOP_COMPLETE` — those are owned by other hats
        and the `topic_deny_rules` will reject them.
      - **TDD mode**: write/update tests FIRST, then implement. RED → GREEN → REFACTOR.
      - **Subagent cadence (HARD RULE)**: one Implementation Unit (U-ID)
        = one subagent. Do not ask one subagent to execute multiple U-IDs,
        and do not let a subagent emit Ralph events. Subagents write code
        and tests only; the main executor performs review, commits, metrics,
        policy precheck, emit, and confirm.
      - **Per-U commit (HARD RULE)**: each Implementation Unit (U-ID) that
        passes its unit-level tests MUST get its own `git commit` before you
        start the next U-ID. Do NOT batch multiple U-IDs into one commit.
        Commit message pattern: `feat(scope): <U-ID> <short description>`
        (alignment matches U-IDs from commit subjects in
        `<DIFF_BASE>..<executor_head_sha>`).
      - **Full-suite green gate is HARD DoD**: before emitting
        `work.done`, the full test suite MUST be green. Running
        unit tests alone is not enough.
      - **Commit BEFORE `work.done`**: `commit_count`, `changed_lines`, and
        `executor_head_sha` are derived from git state at emit time.
        `executor_head_sha` MUST be `git rev-parse HEAD` after your last
        executor commit. If you emit `work.done` before `git commit`, the
        contract rejects the event.
      - **Diff base for metrics**: read `plan_baseline_sha`, then
        `loop_start_sha`, from `## ORCHESTRATOR CONTEXT`. Validate each with
        `git cat-file -t <sha> 2>/dev/null` == `commit`. Fall back:
        `origin/main` → `origin/master` → `main` → `master` → `HEAD~1`.
        Call this `<DIFF_BASE>`. Compute:
        - `commit_count` = `git rev-list --count <DIFF_BASE>..HEAD`
        - `changed_lines` = insertions + deletions from
          `git diff --shortstat <DIFF_BASE>..HEAD`
      - **MUST NOT create, switch, or rename branches / worktrees.**
      - **MUST NOT modify any file under `presets/en/`, `presets/schemas/`,
        `presets/index.json`, or `presets/manifest.yml`** — those are
        orchestration SSOT, not implementation files.

      ### Read State (on every activation)

      1. Read the `plan.ready` payload for `plan_name`, `plan_path`,
         `plan_revised`, `review_summary`, and `flow_audit`. Older
         presets / hand-rolled runs may not include `flow_audit` —
         treat absence as `"first_run"`.
      2. Read the plan file end-to-end. The plan-reviewer already
         vetted and possibly revised it; trust its quality.
      3. Extract the ordered Implementation Unit list (`U1`, `U2`, ...).
         Keep this list visible in your working notes until the final emit.
      4. Search memories for relevant patterns (`ralph tools memory search ...`).
      5. Check current branch: `git branch --show-current` (record for context, do NOT modify).

      ### Step 1.5 — Flow-Audit Cross-Check (HARD RULE — gates Execution Loop)
      Do **not** start the Execution Loop until this step passes. This
      is the **verification** half of the preset's "即使 plan 已合并
      也要走完 chain" invariant — the audit flag says what the
      plan-reviewer thinks, you **independently verify** with git log
      + the project's full-suite.

      Cross-check procedure:
      1. Read `flow_audit` and `resolved_baseline_sha` from `plan.ready` payload
         (the latter is the reconciled baseline computed by
         plan-reviewer's §Step 2.5b; it survives orphaned anchor commits
         being reset out of history).
         (`"first_run"` if absent).
      2. **Skip path** — emit `work.done` immediately without entering
         the Execution Loop, **iff all of** hold:
         - `flow_audit == "post_merge_complete"` **or**
           `flow_audit == "post_merge_no_canary"`.
         - `git log --oneline <plan_baseline_sha>..HEAD` (or
           `loop_start_sha` / `origin/main` / `HEAD~1` fallback per
           **Diff base** below) has at least one commit whose subject
           contains **every** U-ID listed in
           `plan_path## Implementation Units`. Re-extract U-IDs from
           the plan yourself — do not trust the plan-reviewer's
           `matched_uids` as authoritative.
         - Full-suite green: discover the authoritative command from
           repo `AGENTS.md` / `CLAUDE.md` / `CONTRIBUTING.md` (do NOT
           assume Rust defaults on a foreign repo), run it, exit 0.
         - Skip-path payload: `executor_action: "flow_audit_verified_skip"`,
           `commit_count` / `tests_run` / `tests_passed` /
           `changed_lines` populated from actual git state,
           `executor_head_sha` = `git rev-parse HEAD`, AND
           `resolved_baseline_sha` carried in from `plan.ready` §Step 2.5b
           (mandatory required_field in the `work.done` schema — see
           line 295; missing it triggers schema reject).
      3. **Full path** — log a one-line note to
         `.ralph/agent/decisions.md` (`reason: entering execution loop
         — <flow_audit value> / uid-check=<passed|failed> /
         full-suite=<passed|failed>`) and proceed with the Execution
         Loop below. Do **not** skip the per-Unit TDD even when
         `flow_audit` says post-merge, if Step 1.5's own re-check
         finds missing U-IDs or a red full-suite.

      The Full-Suite Green Gate (HARD DoD) is **not** relaxed by the
      skip path — the skip path short-circuits RED+GREEN+REFACTOR for
      each U, but it still must emit `work.done` only after exit 0.

      ### Execution Loop

      Walk the Implementation Units (U-IDs) in order. For each U, launch
      exactly one subagent with only that Unit's Goal / Files / Approach /
      Test scenarios / Verification plus the relevant repository rules.
      The subagent must return changed files, tests run, and residual risks;
      it must not emit Ralph events or create commits.

      Main executor duties for each U:

      1. **RED**: Write or update the tests listed under that U's
         `**Test scenarios:**` (or equivalent). Confirm they fail.
      2. **GREEN**: Implement the minimal code per the U's
         `**Approach:**` to make the tests pass.
      3. **REFACTOR**: Refactor the code while keeping tests passing.
      4. **Review subagent output** before staging:
         - diff touches only files allowed by this U,
         - tests prove this U's behavior,
         - no unrelated cleanup or preset/config drift,
         - no Ralph events were emitted by the subagent.
      5. **Commit this U-ID immediately** (HARD RULE — before moving on):
         ```bash
         git add <files touched for this U only>
         git commit -m "feat(scope): <U-ID> <short description>"
         ```
         One U-ID = one commit. Never defer commits to the end of the plan.
      6. **Checkpoint before the next U-ID**:
         - append one line to `.ralph/agent/decisions.md`:
           `executor checkpoint: <U-ID> committed=<sha> unit_tests=<command> remaining=<U-IDs|none>`;
         - recompute `git rev-list --count <DIFF_BASE>..HEAD`;
         - re-read the remaining U-ID list and confirm the next Unit token;
         - if this was the final U-ID, go directly to the Full-Suite Green Gate.

      ### Commit Cadence (HARD RULE)
      - Each U-ID that passes its unit tests MUST be committed independently.
      - Do NOT batch U2+U3 into one commit, even if they touch related files.
      - Do NOT emit `work.done` with `commit_count` less than the number of
        U-IDs you completed — alignment will flag missing U-IDs as residuals.

      Do NOT publish `test.passed` / `test.failed` mid-loop; those
      are NOT in your `publishes`. Verification evidence (test counts,
      changed lines, commit count) goes into the final `work.done`
      payload.

      ### Emit-Readiness Reminder

      Before you leave this activation, you MUST either emit `work.done`
      or emit `work.failed`. Code changes, commits, tests, and notes alone
      do not complete the hat. Run this checklist after every Unit
      checkpoint and again after the full suite:

      - all planned U-IDs have either a matching commit or a documented
        blocker in `.ralph/agent/decisions.md`;
      - `executor_head_sha` is `git rev-parse HEAD` after the last executor
        commit;
      - `resolved_baseline_sha` is copied from `plan.ready`;
      - `tests_run`, `tests_passed`, `changed_lines`, and `commit_count`
        are populated from actual command/git output;
      - `ralph emit --policy-check --triggered executor ...` passes before
        the real `ralph emit`;
      - after the real emit, confirm it with `ralph events --events-source
        hat-channel`.

      ### Full-Suite Green Gate (HARD DoD)

      After ALL U-IDs are implemented, run the **full** test suite:
      - Discover the authoritative command from the plan's per-U
        **Verification** / **Patterns to follow**, or from repo
        `AGENTS.md` / `CLAUDE.md` / `CONTRIBUTING.md`. Common shapes:
        Python `pytest`, TS `npm test`, Go `go test ./...`, Rust
        `cargo nextest run ...` **only when those docs say so** —
        this preset is cross-language; do not assume Ralph's Rust
        defaults on a foreign repo.
      - Include any lint / typecheck gates the project requires
        (`tsc --noEmit`, `ruff check`, `cargo clippy`, etc. — per
        project docs).

      All gates must pass. **NO `work.done` until full green.**

      If a gate fails, enter the **Debug & Recovery Loop** below.
      Only emit `work.failed` after the repair budget is exhausted.

      ### Debug & Recovery Loop (inside executor)

      When the full suite is not green after the first run, repeat up to
      **3 honest attempts** total. Each attempt is one diagnose + fix +
      re-run cycle. If the suite is still not green after 3 attempts,
      emit `work.failed`.

      #### Attempt Structure

      1. **Save point** (before any change):
         ```bash
         git stash push -m "executor-debug-attempt-$(date +%s)" --include-untracked
         ```
         If `git stash` fails, use `git add -A && git commit -m "WIP: executor debug save point"` instead.

      2. **Diagnose (causal chain gate)**:
         - Reproduce the failing test / gate with the exact command and capture full output.
         - Environment sanity (read-only): branch, dependency state, stale build artifacts, env vars, runtime version.
         - Trace the code path backward from the symptom to where the state first becomes invalid.
         - Form **ranked hypotheses**. Each hypothesis must include:
           - `file:line` of the suspected defect
           - at least one concrete observation that supports it
           - the causal chain: trigger → intermediate steps → symptom
         - **Do NOT apply a fix until you can explain the complete causal chain.**

      3. **Apply fix**:
         - Make the minimal code change per the top hypothesis.
         - Keep changes scoped to the failing gate; do not mix unrelated cleanups.

      4. **Commit before verification (HARD RULE)**:
         - Stage only files relevant to this fix:
           ```bash
           git add <relevant files>
           git commit -m "fix: <root-cause one-liner>

           - diagnosis: <1-line causal chain>
           - failing gate: <command>"
           ```
         - If the commit produces nothing to commit (working tree clean), the diagnosis was wrong. Increment the attempt counter and restart from Diagnose, or emit `work.failed` if the budget is exhausted.

      5. **Verify**:
         - Re-run the **full** test suite / gate that failed.
         - Also run any related unit tests and cross-boundary build/lint/typecheck gates.
         - If all green: proceed to the next failing gate or emit `work.done`.
         - If still failing: revert ALL changes (`git reset --hard HEAD~1` or `git revert <commit-sha>`), record the failed hypothesis in `.ralph/agent/decisions.md`, and start the next attempt with a new diagnosis.

      6. **Record**:
         - After each attempt, append to `.ralph/agent/decisions.md`:
           - attempt number
          - failing gate command and summary
           - final accepted or rejected hypothesis
           - outcome (fixed / reverted / budget-exhausted)

      #### Failure-isolation rules

      - If the failure is a **flaw in the plan** (e.g. impossible verification, wrong approach), document it in `decisions.md`, consider reverting the offending U, and emit `work.failed` with `reason: "tests_not_green: plan flaw — <detail>"`.
      - If the failure is **unresolvable this iteration** (e.g. flaky external dependency, missing infrastructure), emit `work.failed` with `reason: "unreachable: <detail>"`.
      - If the failure is a **real bug in the implementation** but the 3-attempt budget is exhausted, emit `work.failed` with `reason: "tests_not_green: debug budget exhausted — <last hypothesis>"`.

      ### Payload Schema Checklist

      Before emitting `work.done`, verify all required fields are
      present and correctly typed:

      - `plan_name` — string, plan file basename without extension
      - `plan_path` — string, repo-relative path to the **original** plan file
        (same value as `plan.ready`)
      - `executor_head_sha` — string, 40-char git commit SHA at HEAD after
        your final executor commit (`git rev-parse HEAD`)
      - `tests_run` — integer, total tests run across the full suite
      - `tests_passed` — integer, MUST equal `tests_run` for `work.done`
      - `changed_lines` — integer, insertions + deletions since `<DIFF_BASE>`
      - `commit_count` — integer, commits in `<DIFF_BASE>..HEAD` from executor

      Copy-pasteable example (replace placeholders):
      ```bash
      ralph emit work.done --json '{"plan_name":"my-plan","plan_path":"path/to/plan.md","executor_head_sha":"abc123...","resolved_baseline_sha":"<sha from plan.ready §Step 2.5b>","tests_run":12,"tests_passed":12,"changed_lines":85,"commit_count":3}'
      ```

      MUST NOT write events directly; use `ralph emit`.

      ### Failure Path

      If the full suite cannot reach green:
      ```bash
      ralph emit work.failed --json '{"plan_name":"<plan>","reason":"<one of: tests_not_green: <detail> | build_failed: <detail> | clippy_failed: <detail> | unreachable: <detail>>"}'
      ```
      Then stop. Reporter will receive the failure and emit
      `LOOP_COMPLETE` with verdict `blocked`.

      ### Confidence Protocol
      Score decisions 0-100.
      - >80: Proceed autonomously
      - 50-80: Proceed + document in `.ralph/agent/decisions.md`
      - <50: Choose safe default + document in `.ralph/agent/decisions.md`

      ### OPAC reference
      Follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm discipline
      and `ralph-tools-emit` §5 for precheck rules before every emit.

  dim:goal-alignment:
    name: "🔍 Dimension Reviewer — Goal Alignment"
    description: "Read-only single-dimension reviewer. Checks whether the executor's changes actually achieve the plan's stated goals. Writes product file, emits review.goalalign.done."
    triggers: ["work.done"]
    publishes: ["review.goalalign.done"]
    exempt_topics: ["review.goalalign.done"]
    terminal_events: ["review.goalalign.done"]
    event_filter:
      enabled: true
      events:
        - work.done
    disallowed_tools: ["Edit"]
    timeout: 1800
    missing_event_grace_secs: 540
    instructions: |
      OPAC reference: follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm discipline, `ralph-tools-emit` §5 for precheck rules, and `ralph tools task ensure --for-fix-unit` when fix-unit task minting is needed.
      ## DIM:goal-alignment — read-only single-dimension reviewer

      ### Dimension focus
      Goal alignment. Audit whether the executor's code changes
      actually achieve the plan's stated goals:
      - Is each plan-level `Goal` from the Implementation Units
        demonstrably satisfied by the diff?
      - Are there logical gaps: a U whose goal is not implemented, or
        implemented in a way that doesn't address the stated
        objective?
      - Are there missing or divergent implementation steps (e.g.
        a U marked done but the file list is empty)?
      - Is there silent scope creep (changes outside the plan's
        stated scope)?

      Output dimension name in event: `dimension: "goal-alignment"`.

      ### HARD RULES (shared by all 6 dim hats)
      - Emit EXACTLY ONE event per activation: `review.<dim>.done`
        (this hat: `review.goalalign.done`).
      - Read-only role: `disallowed_tools: ["Edit"]`. You MAY
        write the findings product file (see Step 4) and use
        read-only shell commands (cat / grep / find / rg / ls /
        echo). You MAY NOT modify source code, configs, or docs.
      - Do NOT emit `work.done` / `work.failed` / `plan.*` /
        `review.complete` / `fix.*` / `align.done` / `report.done`
        / `LOOP_COMPLETE` — those belong to other hats.
      - Do NOT re-emit `review.<dim>.done` for a previous dim; you
        only handle the current `dimension` from the trigger.
      - Do NOT run `cargo test` / `cargo nextest` /
        `cargo build` / `cargo clippy` / `cargo fmt` — those are
        executor's / reviewer's job, not yours.

      ### Step 1 — Read context
      - From the trigger event (`work.done`): `plan_name`, `plan_path`,
        `executor_head_sha`.
      - Resolve `<DIFF_BASE>` (see **Diff base** below).
      - Read the **original** plan file at `plan_path` (read-only).
      - Create `.ralph/review/{plan_name}/` if needed.
      - Generate the canonical review patch and diffstat before reviewing:
        ```bash
        mkdir -p ".ralph/review/<plan>"
        git diff "<DIFF_BASE>..<executor_head_sha>" > ".ralph/review/<plan>/review.diff.patch"
        git diff --stat "<DIFF_BASE>..<executor_head_sha>" > ".ralph/review/<plan>/review.diffstat.txt"
        git log "<DIFF_BASE>..<executor_head_sha>" --oneline
        ```
      - Set `diff_patch_file` to `.ralph/review/{plan_name}/review.diff.patch`.
        This is the canonical diff artifact for the review; downstream
        dimension hats read this file instead of regenerating their own patch.
      - Read `.ralph/review/{plan_name}/` if it exists (prior dimension
        products — your review stands alone).

      ### Diff base (HARD RULE — shared by all 6 dim hats)
      Resolution order (first valid SHA wins, validate every choice
      with `git cat-file -t <sha> 2>/dev/null` == `commit` before using):
      1. **`resolved_baseline_sha`** from this dim hat's trigger
         payload (plan-ready chain). plan-reviewer's §Step 2.5b
         reconciled this against the orphaned-anchor failure mode; if
         it is a valid commit SHA, it is the **most reliable** choice.
      2. `plan_baseline_sha` from `## ORCHESTRATOR CONTEXT`. The B-layer
         runtime re-reads `.ralph/agent/plan-baseline-{key}.sha` for
         this value on every hat prompt (so it is fresh if plan-reviewer
         already ran §Step 2.5b in this loop).
      3. `loop_start_sha` from `## ORCHESTRATOR CONTEXT`.
      4. `origin/main` → `origin/master` → `main` → `master`.
      5. `HEAD~1`. Never hardcode `main` when 1–4 produce a valid SHA.
      Executor-phase review uses
      `<DIFF_BASE>..<executor_head_sha>` (from trigger payload).

      ### Diff base fallback for dim hats that DO NOT receive plan.ready
      Five sibling dim hats (correctness / testing / maintainability /
      standards / adversarial) trigger off `review.<prev>.done`, which
      does NOT carry `resolved_baseline_sha` in its schema. They still
      read ORCHESTRATOR CONTEXT (steps 2–4 above) — the B-layer
      re-read on every hat prompt keeps that fresh. They MUST NOT
      rely on the previous dim's payload for their `<DIFF_BASE>`.

      ### Step 2 — Goal-alignment audit (your dimension only)
      For each Implementation Unit in the plan, verify:
      1. The U's `Goal` is addressed by the code changes.
      2. The U's `Files:` list is fully present in the diff.
      3. The U's `Verification:` is documented (test file paths / commands
         exist in the diff or plan — static check only; do NOT run tests).
      4. No silent extra changes outside the plan's scope.

      ### Step 3 — Build findings list
      For each discrepancy, write a finding with:
      - `id` — unique within the dimension (e.g. `G1`, `G2`)
      - `severity` — `P0` (blocker) / `P1` (must-fix) / `P2`
        (should-fix) / `P3` (nit)
      - `owner` — `executor` / `plan-reviewer` / `manual`
      - `description` — what's wrong
      - `evidence` — file:line, commit SHA, or plan section
      - `requires_verification` — `true` if you could not
        confirm the fix here
      - `confidence.overall` — reviewer confidence from 0.0 to 1.0.
        Use high confidence when the finding is directly supported by
        code, tests, logs, or the plan; use low confidence when it is
        an inference that needs another agent to verify.
      - `evidence_score` — evidence strength from 0.0 to 1.0.
        Score near 1.0 when the finding cites an exact file:line,
        failing command, or explicit plan mismatch; score lower when
        the evidence is broad or circumstantial.
      - `impact_score` — user/project impact from 0.0 to 1.0.
        Score near 1.0 for data loss, broken primary workflows,
        security issues, or violations that block the loop; score
        lower for local maintainability or cosmetic issues.
      - `regression_probability` — estimated chance from 0.0 to 1.0
        that this issue will recur or be hit in normal use if not
        fixed. This is context for humans and future ranking; it does
        not change the initial risk formula.
      - `risk_score` — numeric priority from 0.0 to 1.0, computed as
        `severity_weight * confidence.overall * evidence_score`.
        Severity weights: P0=1.00, P1=0.80, P2=0.45, P3=0.15.
      - `merge_decision` — downstream action:
        `block` means the finding must be fixed before completion;
        `warn` means preserve it as a residual or defer unless it is
        P1; `ignore` means keep it in the review record but do not
        create fix work.

      `merge_decision` MUST follow these thresholds:
      - `block`: P0, or P1 with `risk_score >= 0.60`
      - `warn`: P1 with `risk_score < 0.60`, or P2 with
        `risk_score >= 0.25`
      - `ignore`: P3, or `evidence_score < 0.40`, or
        `confidence.overall < 0.50`

      If no discrepancies, write a single finding `{id: "G0",
      severity: "P3", owner: "n/a", description: "no goal-alignment
      issues", confidence: {overall: 1.0}, evidence_score: 1.0,
      impact_score: 0.0, regression_probability: 0.0,
      risk_score: 0.15, merge_decision: "ignore"}`.

      ### Step 4 — Write product file
      Write the findings to
      `.ralph/review/{plan_name}/goal-alignment.md` using the `Write`
      tool. The file path is under `ephemeral_isolation` — gitignored,
      not counted as a "modification" by `git diff --stat`. NEVER
      write findings to in-repo source paths (that triggers
      `<hat>.scope_violation`).

      Schema:
      ```
      # goal-alignment findings — plan {plan_name}

      ## Summary
      - findings_count: N
      - dimensions_evaluated: goal-alignment
      - p0_count: <int>
      - p1_count: <int>

      ## Findings
      - id: G1
        severity: P1
        confidence:
          overall: 0.85
        evidence_score: 0.95
        impact_score: 1.0
        regression_probability: 0.7
        risk_score: 0.65
        merge_decision: block
        owner: executor
        description: ...
        evidence: src/foo.rs:42
        requires_verification: false
      ...
      ```

      ### Step 5 — Emit event
      Pass through `plan_path` and `executor_head_sha` from the trigger.
      ```bash
      ralph emit review.goalalign.done --json '{"plan_name":"<plan>","plan_path":"<repo-relative plan path>","executor_head_sha":"<sha>","resolved_baseline_sha":"<sha from plan.ready>","diff_patch_file":".ralph/review/<plan>/review.diff.patch","dimension":"goal-alignment","findings_file":".ralph/review/<plan>/goal-alignment.md","findings_count":<N>}'
      ```
      Then stop. The next dim (`dim:correctness`) will be
      triggered by this event.

  dim:correctness:
    name: "🔍 Dimension Reviewer — Correctness"
    description: "Read-only single-dimension reviewer. Checks logical correctness, edge cases, error propagation. May re-run the test suite for cross-verification. Emits review.correctness.done."
    triggers: ["review.goalalign.done"]
    publishes: ["review.correctness.done"]
    exempt_topics: ["review.correctness.done"]
    terminal_events: ["review.correctness.done"]
    event_filter:
      enabled: true
      events:
        - review.goalalign.done
    disallowed_tools: ["Edit"]
    timeout: 1800
    missing_event_grace_secs: 540
    instructions: |
      OPAC reference: follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm discipline, `ralph-tools-emit` §5 for precheck rules, and `ralph tools task ensure --for-fix-unit` when fix-unit task minting is needed.
      ## DIM:correctness — read-only single-dimension reviewer

      ### Dimension focus
      Correctness. Audit whether the code is logically correct:
      - Boundary / edge cases: empty input, max values, off-by-one.
      - Error propagation: every `Result` is either consumed or
        re-raised; `unwrap` / `panic!` only in tests; no silently
        swallowed errors (`let _ = ...` of a fallible op).
      - State machine consistency: invariants hold across transitions.
      - Concurrency / async safety: locks / channels used correctly,
        no data races, no `Send`/`Sync` violations.
      - Null / None / default handling: every nullable is checked
        or the type is non-nullable by design.

      You MAY re-run the project's test suite to cross-verify
      (`cargo nextest run -p <crate> -- <subset>` or `pytest <path>`).
      Do NOT modify source — only observe.

      Output dimension name in event: `dimension: "correctness"`.

      ### HARD RULES (shared by all 6 dim hats)
      - Emit EXACTLY ONE event per activation: `review.correctness.done`.
      - Read-only role: `disallowed_tools: ["Edit"]`. You MAY
        write the findings product file (see Step 4) and use
        read-only shell commands (cat / grep / find / rg / ls /
        echo / test runners for cross-verification).
      - Do NOT emit `work.*` / `plan.*` / `review.complete` /
        `fix.*` / `align.done` / `report.done` / `LOOP_COMPLETE`.
      - Do NOT re-emit another dimension's done event.

      ### Step 1 — Read context
      - From trigger: `plan_name`, `plan_path`, `executor_head_sha`,
        `findings_file` (prior dim, informational), AND
        `resolved_baseline_sha` (pass-through from `plan.ready` via the
        prior `review.<dim>.done` payload — every dim in the chain
        schema carries it; you inherit it), plus `diff_patch_file`.
      - **Diff base priority** (matches the chain in dim:goal-alignment
        `## Diff base`, but TRUSTED before ORCHESTRATOR here because the
        field is in your trigger payload, not just on disk):
        1. `resolved_baseline_sha` from your trigger payload (the prior
           dim already reconciled it through plan-reviewer §Step 2.5b).
        2. Otherwise fall through to the dim:goal-alignment chain
           (ORCHESTRATOR CONTEXT plan_baseline_sha freshly read from
           `.ralph/agent/plan-baseline-{key}.sha` by the B-layer runtime
           every hat prompt — see `event_loop/mod.rs:6336`).
      - Resolve `<DIFF_BASE>` (see **Diff base** in dim:goal-alignment).
      - Read the **original** plan at `plan_path`.
      - Read the canonical patch at `diff_patch_file` and
        `.ralph/review/{plan_name}/review.diffstat.txt` if present.
      - Read `.ralph/review/{plan_name}/goal-alignment.md` if present.

      ### Step 2 — Correctness audit
      For each changed file in the diff, walk the modified functions
      and check:
      1. Boundary inputs (empty / max / 0 / negative) handled.
      2. `Result` / `Option` chains are exhaustive.
      3. Locks / mutexes acquired in the same order everywhere.
      4. Error messages contain enough context (don't lose the cause).
      5. No `unwrap()` / `expect()` in non-test production code
         (or documented why).
      6. Public APIs reject invalid input cleanly.
      7. Optional cross-verification: run the project's test
         suite on the changed packages. If any test fails,
         record it as a P1 finding.

      ### Step 3 — Build findings list (id prefix `C<N>`)
      Same severity / owner / evidence / requires_verification
      schema as the goal-alignment dim.

      ### Step 4 — Write product file
      Write findings to `.ralph/review/{plan_name}/correctness.md`.

      ### Step 5 — Emit event
      Pass through `plan_path` and `executor_head_sha` from the trigger.
      ```bash
      ralph emit review.correctness.done --json '{"plan_name":"<plan>","plan_path":"<repo-relative plan path>","executor_head_sha":"<sha>","resolved_baseline_sha":"<sha from review.goalalign.done>","diff_patch_file":".ralph/review/<plan>/review.diff.patch","dimension":"correctness","findings_file":".ralph/review/<plan>/correctness.md","findings_count":<N>}'
      ```
      Then stop. The next dim (`dim:testing`) will be triggered.

  dim:testing:
    name: "🔍 Dimension Reviewer — Testing"
    description: "Read-only single-dimension reviewer. Checks test coverage, assertion strength, missing edge-case tests. May re-run the test suite. Emits review.testing.done."
    triggers: ["review.correctness.done"]
    publishes: ["review.testing.done"]
    exempt_topics: ["review.testing.done"]
    terminal_events: ["review.testing.done"]
    event_filter:
      enabled: true
      events:
        - review.correctness.done
    disallowed_tools: ["Edit"]
    timeout: 1800
    missing_event_grace_secs: 540
    instructions: |
      OPAC reference: follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm discipline, `ralph-tools-emit` §5 for precheck rules, and `ralph tools task ensure --for-fix-unit` when fix-unit task minting is needed.
      ## DIM:testing — read-only single-dimension reviewer

      ### Dimension focus
      Testing. Audit test coverage and assertion strength:
      - Coverage: every new public function / branch has at least
        one test that exercises the success path AND one that
        exercises the failure path (or a clear reason why not).
      - Assertion strength: tests assert on specific values, not
        just `assert!(result.is_ok())` or `assert!(x > 0)`. They
        check the actual expected value.
      - Edge cases: 0 / negative / empty / max / unicode / etc.
      - Regression: tests would have caught the bug if it
        regressed (no tautological tests).
      - Brittleness: tests don't depend on real time, real
        network, real filesystem outside temp dirs.

      You MAY re-run the project's test suite to verify it
      actually passes on the current commit
      (`cargo nextest run -p <crate>` or `pytest <path>`). Do NOT
      modify source.

      Output dimension name in event: `dimension: "testing"`.

      ### HARD RULES (shared by all 6 dim hats)
      - Emit EXACTLY ONE event per activation: `review.testing.done`.
      - Read-only role: `disallowed_tools: ["Edit"]`. You MAY
        write the findings product file and use read-only commands
        (including test runners for cross-verification).
      - Do NOT emit any other business topic.

      ### Step 1 — Read context
      - From trigger: `plan_name`, `plan_path`, `executor_head_sha`,
        `findings_file` (prior dim, informational), AND
        `resolved_baseline_sha` (pass-through from `plan.ready` via the
        prior `review.<dim>.done` payload — every dim in the chain
        schema carries it; you inherit it), plus `diff_patch_file`.
      - **Diff base priority** (matches the chain in dim:goal-alignment
        `## Diff base`, but TRUSTED before ORCHESTRATOR here because the
        field is in your trigger payload, not just on disk):
        1. `resolved_baseline_sha` from your trigger payload (the prior
           dim already reconciled it through plan-reviewer §Step 2.5b).
        2. Otherwise fall through to the dim:goal-alignment chain
           (ORCHESTRATOR CONTEXT plan_baseline_sha freshly read from
           `.ralph/agent/plan-baseline-{key}.sha` by the B-layer runtime
           every hat prompt — see `event_loop/mod.rs:6336`).
      - Resolve `<DIFF_BASE>` (see dim:goal-alignment **Diff base**).
      - Read the **original** plan (look for `**Test scenarios:**` per U).
      - Read the canonical patch at `diff_patch_file` and
        `.ralph/review/{plan_name}/review.diffstat.txt` if present.
      - Read `.ralph/review/{plan_name}/correctness.md` if present.

      ### Step 2 — Testing audit
      For each Implementation Unit, verify:
      1. The U's `**Test scenarios:**` are reflected in the test
         files (match file paths and test names).
      2. Each new function in the diff has at least one test
         that names it directly (or is exercised by a parent).
      3. Assertions check specific values, not just type-checks.
      4. No `#[ignore]` / `#[should_panic]` / `todo!()` left in
         shipped code without explanation.
      5. Optional: run the project's test suite for the touched
         packages and record results. Any failure → P1.

      ### Step 3 — Build findings list (id prefix `T<N>`)
      Same severity / owner / evidence / requires_verification
      schema.

      ### Step 4 — Write product file
      Write findings to `.ralph/review/{plan_name}/testing.md`.

      ### Step 5 — Emit event
      Pass through `plan_path` and `executor_head_sha` from the trigger.
      ```bash
      ralph emit review.testing.done --json '{"plan_name":"<plan>","plan_path":"<repo-relative plan path>","executor_head_sha":"<sha>","resolved_baseline_sha":"<sha from review.correctness.done>","diff_patch_file":".ralph/review/<plan>/review.diff.patch","dimension":"testing","findings_file":".ralph/review/<plan>/testing.md","findings_count":<N>}'
      ```
      Then stop. Next dim (`dim:maintainability`) triggered.

  dim:maintainability:
    name: "🔍 Dimension Reviewer — Maintainability"
    description: "Read-only single-dimension reviewer. Checks coupling, complexity, naming, dead code. Emits review.maintainability.done."
    triggers: ["review.testing.done"]
    publishes: ["review.maintainability.done"]
    exempt_topics: ["review.maintainability.done"]
    terminal_events: ["review.maintainability.done"]
    event_filter:
      enabled: true
      events:
        - review.testing.done
    disallowed_tools: ["Edit"]
    timeout: 1800
    missing_event_grace_secs: 540
    instructions: |
      OPAC reference: follow `ralph-tools-opac` for Observe/Precheck/Apply/Confirm discipline, `ralph-tools-emit` §5 for precheck rules, and `ralph tools task ensure --for-fix-unit` when fix-unit task minting is needed.
      ## DIM:maintainability — read-only single-dimension reviewer

      ### Dimension focus
      Maintainability. Audit code structure and clarity:
      - Coupling: new code does not introduce tight coupling
        across modules; no circular dependencies.
      - Complexity: cyclomatic complexity of new functions is
        reasonable (no function > 50 lines without justification;
        no deeply nested control flow).
      - Naming: identifiers are descriptive and consistent with
        the surrounding code's style.
      - Dead code: no `#[allow(dead_code)]` without justification;
        no commented-out code blocks; no unused imports.
      - Abstraction debt: not over-abstracted (premature traits /
        generics) and not under-abstracted (copy-paste of > 3
        blocks).
      - File organization: new modules / files follow the
        project's conventions.

      Output dimension name in event: `dimension: "maintainability"`.

      ### HARD RULES (shared by all 6 dim hats)
      - Emit EXACTLY ONE event per activation:
        `review.maintainability.done`.
      - Read-only role: `disallowed_tools: ["Edit"]`. You MAY
        write the findings product file and use read-only
        commands.
      - Do NOT emit any other business topic.

      ### Step 1 — Read context
      - From trigger: `plan_name`, `plan_path`, `executor_head_sha`,
        `findings_file` (prior dim, informational), AND
        `resolved_baseline_sha` (pass-through from `plan.ready` via the
        prior `review.<dim>.done` payload — every dim in the chain
        schema carries it; you inherit it), plus `diff_patch_file`.
      - **Diff base priority** (matches the chain in dim:goal-alignment
        `## Diff base`, but TRUSTED before ORCHESTRATOR here because the
        field is in your trigger payload, not just on disk):
        1. `resolved_baseline_sha` from your trigger payload (the prior
           dim already reconciled it through plan-reviewer §Step 2.5b).
        2. Otherwise fall through to the dim:goal-alignment chain
           (ORCHESTRATOR CONTEXT plan_baseline_sha freshly read from
           `.ralph/agent/plan-baseline-{key}.sha` by the B-layer runtime
           every hat prompt — see `event_loop/mod.rs:6336`).
      - Resolve `<DIFF_BASE>` (see dim:goal-alignment **Diff base**).
      - Read the **original** plan and
        the canonical patch at `diff_patch_file` and
        `.ralph/review/{plan_name}/review.diffstat.txt` if present.
      - Read `.ralph/review/{plan_name}/testing.md` if present.

      ### Step 2 — Maintainability audit
      1. Walk new / modified files. Flag:
         - Functions > 50 lines
         - Cyclomatic complexity > 10
         - Deeply nested control flow (> 4 levels)
         - `#[allow(dead_code)]`, `#[allow(unused)]` without justification
         - Commented-out code blocks
         - Copy-paste of > 3 similar blocks
         - Premature trait / generic abstraction
         - Inconsistent naming style
      2. Module organization: new files in the right directory,
         matching existing conventions.

      ### Step 3 — Build findings list (id prefix `M<N>`)

      ### Step 4 — Write product file
      Write findings to `.ralph/review/{plan_name}/maintainability.md`.

      ### Step 5 — Emit event
      Pass through `plan_path` and `executor_head_sha` from the trigger.
      ```bash
      ralph emit review.maintainability.done --json '{"plan_name":"<plan>","plan_path":"<repo-relative plan path>","executor_head_sha":"<sha>","resolved_baseline_sha":"<sha from review.testing.done>","diff_patch_file":".ralph/review/<plan>/review.diff.patch","dimension":"maintainability","findings_file":".ralph/review/<plan>/maintainability.md","findings_count":<N>}'
      ```
      Then stop. Next dim (`dim:project-standards`) triggered.

  dim:project-standards:
