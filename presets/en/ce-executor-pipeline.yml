      - {hat_id: reporter, topic: plan.ready}
      - {hat_id: executor, topic: plan.blocked}
      - {hat_id: dim:goal-alignment, topic: plan.blocked}
      - {hat_id: dim:correctness, topic: plan.blocked}
      - {hat_id: dim:testing, topic: plan.blocked}
      - {hat_id: dim:maintainability, topic: plan.blocked}
      - {hat_id: dim:project-standards, topic: plan.blocked}
