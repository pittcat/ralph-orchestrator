# ce-executor-pipeline: linear single-chain plan-driven execution preset
#
# Ralph primary path (plan 2026-07-07-006): the recommended CE executor for
# plan-driven work. Single consumer per topic, flat hat-only chain, no
# runtime unit loop, no fallback rescue. Executor owns unit/subagent work
# internally; downstream hats only see a single `work.done` / `work.failed`.
#
# 13-hat topology with linear single-consumer chain:
# - plan-reviewer: Reviews the plan file in-place; no per-unit breakdown, no
#   code edits. Output: plan.ready (with review_summary + plan_revised flag)
#   or plan.blocked (plan unusable).
# - executor: Whole-plan execution with TDD. Hard DoD = full test suite green.
#   The main executor delegates each Implementation Unit to exactly one
#   subagent, then reviews, commits, checkpoints, and emits the final event
#   itself. No runtime task breakdown (`tasks.enabled: false`).
# - dim:goal-alignment / dim:correctness / dim:testing / dim:maintainability /
#   dim:project-standards / dim:adversarial: Six read-only dimension hats in
#   a flat serial chain — each reviews ONE dimension using the canonical
#   `.ralph/review/<plan>/review.diff.patch`, writes a findings product file,
#   emits EXACTLY ONE done event triggering the next dimension (last dimension
#   triggers review-synthesizer).
# - review-synthesizer: Reads all 6 dimension products, dedupes / merges /
#   ranks P0-P3, writes synthesized_review_file, emits EXACTLY ONE
#   review.synthesized.
# - fix-planner: Reads synthesized_review_file, writes fix_plan_file, emits
#   EXACTLY ONE review.complete.
# - fixer: Applies the **fix-planner fix plan only** (NOT the original
#   plan), using one subagent per actionable fix Unit; empty fix plan →
#   no-op + fix.done{fixes_applied:0}.
# - alignment: Cross-checks original plan execution vs fix-plan execution
#   (separate git ranges). Records residuals; does NOT loop or block.
# - reporter: Aggregates plan change / execution / 6-dim review / fixes /
#   alignment residuals. Writes report, emits report.done + LOOP_COMPLETE.
#   Sole consumer of plan.blocked / work.failed.
#
# Why this architecture:
#   - No multi-consumer topics: every event has exactly one subscriber
#   - No coordinator loop: the chain is flat and deterministic
#   - Dimensions are first-class hats, not parallel calls; executor may use
#     one subagent per Implementation Unit inside its own activation.
#   - No re-review loop: alignment records residuals, never re-enters review
#   - Verdict is single field (pass / pass_with_residuals / blocked) —
#     downstream subscribes to ONE terminal pair, never two siblings.
#
# The chain passes WAC strict lint cleanly: `EGRESS_MAX_HOPS=12` in
# `crates/ralph-core/src/preset_lint/workflow_activation.rs` covers the
# 10-hop path from `dim:goal-alignment` to `report.done`. No topology
# exemption needed.
#
# No `mechanism.flow` block: this preset is a flat hat-only linear chain.
# Routing + scope enforcement come from hat triggers/publishes, isolated mode,
# and `event_policy` (topic_deny_rules + inline schemas). FlowStepScope is
# skipped at runtime when a preset does not opt into `mechanism.flow`.

topic_format_whitelist:
  - LOOP_COMPLETE

tasks:
  enabled: false

event_loop:
  execution_mode: isolated  # R3: 12 hats > 3-hat coordinator limit; per R1/R11 this preset MUST be isolated.
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  required_events: ["report.done"]
  starting_event: "work.start"
  max_iterations: 40
  max_runtime_seconds: 28800  # 8 hours
  enforce_hat_scope: true
  ephemeral_isolation: true
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    terminal_topics:
      - "LOOP_COMPLETE"
    business_topics:
      - "plan.ready"
      - "plan.blocked"
      - "work.done"
      - "work.failed"
      - "review.goalalign.done"
      - "review.correctness.done"
      - "review.testing.done"
      - "review.maintainability.done"
      - "review.standards.done"
      - "review.adversarial.done"
      - "review.synthesized"
      - "review.complete"
      - "fix.done"
      - "align.done"
      - "report.done"
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    require_emit_provenance: true
    plan_name_equality_required: true
    # Topic-deny rules: every business topic has exactly one owner hat.
    # Every other hat is denied the topic. This is the runtime's second
    # line of defense after `publishes` declarations on each hat — if
    # any hat tries to emit a topic it does not own, the policy rejects
    # the emit with isolated_scope_violation.
    topic_deny_rules:
      # plan-reviewer owns plan.ready / plan.blocked
      - {hat_id: executor, topic: plan.ready}
      - {hat_id: dim:goal-alignment, topic: plan.ready}
      - {hat_id: dim:correctness, topic: plan.ready}
      - {hat_id: dim:testing, topic: plan.ready}
      - {hat_id: dim:maintainability, topic: plan.ready}
      - {hat_id: dim:project-standards, topic: plan.ready}
      - {hat_id: dim:adversarial, topic: plan.ready}
      - {hat_id: review-synthesizer, topic: plan.ready}
      - {hat_id: fix-planner, topic: plan.ready}
      - {hat_id: fixer, topic: plan.ready}
      - {hat_id: alignment, topic: plan.ready}
      - {hat_id: reporter, topic: plan.ready}
      - {hat_id: executor, topic: plan.blocked}
      - {hat_id: dim:goal-alignment, topic: plan.blocked}
      - {hat_id: dim:correctness, topic: plan.blocked}
      - {hat_id: dim:testing, topic: plan.blocked}
      - {hat_id: dim:maintainability, topic: plan.blocked}
      - {hat_id: dim:project-standards, topic: plan.blocked}
      - {hat_id: dim:adversarial, topic: plan.blocked}
      - {hat_id: review-synthesizer, topic: plan.blocked}
      - {hat_id: fix-planner, topic: plan.blocked}
      - {hat_id: fixer, topic: plan.blocked}
      - {hat_id: alignment, topic: plan.blocked}
      # executor owns work.done / work.failed
      - {hat_id: plan-reviewer, topic: work.done}
      - {hat_id: plan-reviewer, topic: work.failed}
      - {hat_id: dim:goal-alignment, topic: work.done}
      - {hat_id: dim:correctness, topic: work.done}
      - {hat_id: dim:testing, topic: work.done}
      - {hat_id: dim:maintainability, topic: work.done}
      - {hat_id: dim:project-standards, topic: work.done}
      - {hat_id: dim:adversarial, topic: work.done}
      - {hat_id: review-synthesizer, topic: work.done}
      - {hat_id: fix-planner, topic: work.done}
      - {hat_id: fixer, topic: work.done}
      - {hat_id: alignment, topic: work.done}
      - {hat_id: reporter, topic: work.done}
      - {hat_id: plan-reviewer, topic: work.failed}
