# ce-executor-isolated: Isolated Mode Plan-Driven Work Execution with Wave Code Review, Auto-Fix, Debug Resolver, and Manager Report
# Pattern: Plan → Execute → Wave Review → Auto-Fix → Debug Resolver → Fix Plan → Review → Ship → Report
#
# Same 10-hat topology as ce-executor, but with `execution_mode: isolated` to
# eliminate hat impersonation at the architecture level — each hat sees only its
# own instructions and events, and can_publish() enforces topic scope by hat.
#
# 10 Hats:
# - Coordinator: Parses plan files, assesses complexity, creates working directory and runtime tasks
# - Executor: TDD implementation following plan content, one runtime task per iteration; also executes fix plans from debug-resolver
# - review-coordinator: Diff analysis, intent discovery, conditional dimension selection, wave emission
# - dimension-reviewer (wave, concurrency 9): Parallel focused code review per dimension
# - review-synthesizer (aggregate): Merges all dimension findings, deduplicates, routes
# - Fixer: Applies safe_auto findings up to 3 rounds
# - debug-resolver: Root-cause diagnosis after Fixer exhaustion; ports ce-debug Phase 0–2 discipline
# - plan-gate: Reconciles review verdict against plan.md / progress.md / runtime tasks; decides queue.advance vs plan.complete
# - Shipper: Final validation, plan status update, final commit (no PR creation)
# - Reporter: Generates manager-facing completion report
#
# Usage:
#   ralph run -H builtin:ce-executor-isolated -p "docs/plans/my-plan.md"
#
# Wave Review Architecture:
#   work.done → review-coordinator → review.wave.ready (wave emit N dimensions)
#     → dimension-reviewer × N (concurrent) → review.dimension.done × N
#     → review-synthesizer (aggregate) → review.passed/failed/complete
#     → plan-gate → queue.advance (more steps) OR plan.complete (all done)
#   review.failed → Fixer (≤3 safe_auto rounds) → fix.applied → review-coordinator
#   Fixer → fix.exhausted → debug-resolver → fix.plan.ready → Executor → work.done → review-coordinator
#   debug-resolver → debug.exhausted → Shipper → REVIEW_COMPLETE → Reporter → LOOP_COMPLETE
#   plan-gate → plan.complete / plan.blocked → Shipper → REVIEW_COMPLETE → Reporter → LOOP_COMPLETE

topic_format_whitelist:
  - LOOP_COMPLETE
  - REVIEW_COMPLETE

tasks:
  enabled: true
  coordinator_hats:
    - coordinator
    - executor
    - plan-gate
    - fixer
    - debug-resolver
    - shipper
    - reporter

event_loop:
  execution_mode: isolated
  prompt_file: "PROMPT.md"
  # U11: runtime diagnosis is intentionally NOT declared in this preset.
  # Telemetry is operator-controlled (not hat-collection-controlled) due
  # to the operator/hat-collection security boundary. Hat collections
  # cannot silently enable diagnostics, artifact writes, or prompt
  # injection. Operators must enable it in their project ralph.yml under
  # the top-level `telemetry:` key, or set RALPH_DIAGNOSTICS=1.
  completion_promise: "LOOP_COMPLETE"
  required_events: ["report.done"]
  starting_event: "work.start"
  max_iterations: 50
  max_runtime_seconds: 28800  # 8 hours
  enforce_hat_scope: true
  # 2026-06-14-003 plan R3: enable ephemeral file isolation so
  # runtime artefacts (`scratchpad.md`, `tmp*.md`, `*.bak`) that
  # land in source trees are auto-relocated to
  # `.ralph/agent/scratchpad-{loop_id}.md` between iterations.
  ephemeral_isolation: true
  # 2026-06-14-003 plan R4: enable the per-step single-U contract
  # so `TaskStore::ensure` rejects sibling unit tasks in the same
  # step (the original `calm-oak` failure mode).
  enforce_current_unit: true
  verdict_gate:
    # Reject LOOP_COMPLETE if the most recent REVIEW_COMPLETE event has
    # pass_or_fail == "fail". Backstops the shipper+reporter chain when
    # either hat misclassifies a P0 residual as a pass.
    topic: "REVIEW_COMPLETE"
    fail_field: "pass_or_fail"
    fail_value: "fail"
    # 2026-06-09 fix: also gate on `report.done` mirroring the
    # pass_or_fail field.  When a rogue LOOP_COMPLETE follows a
    # `report.done` that carries pass_or_fail="fail", the gate
    # must still fire.  This is the second layer of defense
    # alongside the reporter's `conditional_forbid_topics`
    # obligation — either one alone would close the gap, but
    # running both gives a defense-in-depth posture.
    additional_topics: ["report.done"]
  # U4 (2026-06-17-002 plan): pre-handoff progress ↔ task gate.
  # Rejects `queue.advance` / `plan.complete` when `.ralph/agent/progress.md`
  # is not consistent with `.ralph/agent/tasks.jsonl` (e.g. the agent
  # closed a task but did not mark the step as completed in progress.md).
  # Mismatches inject `plan.blocked` so plan-gate can remediate on the
  # next iteration. Default `false` for non-tier-0 presets.
  workflow_contract:
    step_handoff:
      progress_task_gate: true
  # U7: Enable execution contract for work.done validation.
  # Protects against false positives when executor forgets to emit or emits invalid work.done.
  execution_contracts:
    enabled: true
    rules:
      work.done:
        # commit_count + changed_lines let the review-coordinator
        # gate distinguish "empty diff" from "non-trivial diff".
        # Trivial steps are exempt via allow_empty_for_steps; the
        # executor still reports commit_count=0, changed_lines=0 for
        # them so the schema stays consistent.
        require_payload_fields: ["plan_name", "plan_path", "task_id", "task_key", "step", "commit_count", "changed_lines"]
        require_task:
          id_field: "task_id"
          key_field: "task_key"
          loop_scoped: true
          allowed_terminal_statuses: ["closed"]
          auto_close_on_valid: false
        require_git_change:
          mode: "diff_or_commit"
          allow_empty_for_steps: ["trivial"]
        require_test_evidence:
          mode: "optional"  # "optional" | "required_payload_field"
          payload_field: "tests"  # field name to check when mode is "required_payload_field"
  # Plan 2026-06-16-002 Unit 1: `presets/schemas/ce-executor-isolated.yml`
  # is the authoring SSOT for `event_policy.schemas`; `build.rs` deep-merges
  # it into the embedded preset at compile time. The inline `schemas:` block
  # below is a per-topic override layer during transition — prefer editing
  # the SSOT file and clearing matching inline entries. Do not reintroduce
  # `schema_file` here (broken for builtin presets without on-disk anchor).
  event_policy:
    enabled: true
    mode: enforce
    # WAC-U4 (2026-06-12-002): reject_with_resume is the canonical
    # violation action for R10 (null payload on whitelist topics)
    # and the plan-gate / execution_contract hard gates. Agents
    # that emit a null or string-as-object payload must see a
    # `task.resume` routing rather than a silent warn-through.
    on_violation: reject_with_resume
    # U5 (2026-06-13): force every `ralph emit` / `ralph wave emit` to
    # pre-validate against this event_policy schema BEFORE writing to
    # the events file. The previous default let `--no-policy-check`
    # silently bypass the contract — that bypass was the root cause of
    # the 2026-06-12 incident where 7 review.wave.ready events (missing
    # `depth`) wrote to jsonl, then were policy-rejected at loop read
    # time, then the runner mis-fired `missing_event_gate`. With these
    # two flags, the CLI fails fast at the agent and the bad payload
    # never lands in jsonl. `allow_unsafe_cli_emit: false` removes the
    # `--no-policy-check` escape hatch — there is no other way to write
    # a non-conforming event under this preset.
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    # Unit 4: topic-deny rules with glob support.
    # executor must never emit build.done (it is a review-synthesizer output).
    # coordinator must never emit build.done or any debug.* topic.
    # ralph (the loop-runner fallback hat) is locked out of every
    # workflow topic that downstream hats own. The JSONL origin guard
    # already rejects ralph at read time, but enforcing the same
    # deny-list at the policy layer means an event never even lands in
    # the events file under ralph's hat.
    # The `debug.*` glob uses Topic::matches_str for segment wildcard matching.
    topic_deny_rules:
      - {hat_id: executor, topic: build.done}
      - {hat_id: coordinator, topic: build.done}
      - {hat_id: coordinator, topic: 'debug.*'}
      - {hat_id: ralph, topic: review.wave.ready}
      - {hat_id: ralph, topic: review.passed}
      - {hat_id: ralph, topic: work.ready}
      - {hat_id: ralph, topic: queue.advance}
      - {hat_id: ralph, topic: plan.complete}
      - {hat_id: ralph, topic: plan.blocked}
    # U4: enable plan_name equality validation — work.done plan_name must match
    # the current_plan_name from work.ready.
    plan_name_equality_required: true
    # U1 (2026-06-11-002): trivial_step semantic gate. Mirrors the wave
    # gate's `changed_lines_min: 50`. A `review.passed` event with
    # `skip_reason=trivial_step` is rejected by the event policy when
    # the payload shows `findings_count > 0` OR
    # `changed_lines >= trivial_step_max_changed_lines`. This stops
    # the agent from bypassing Fixer by labeling a non-trivial diff
    # as trivial. Set to 0 to disable the gate (NOT recommended for
    # ce-executor-isolated). The 50-line threshold matches the wave
    # gate so the two stay synchronized.
    trivial_step_max_changed_lines: 50
    # NOTE: schemas below are merged from
    # `presets/schemas/ce-executor-isolated.yml` by `build.rs` at compile
    # time (plan 2026-06-16-002 Unit 1). That file is the authoring
    # single source of truth; the entries here are kept as a per-field
    # override layer during the transition. For stable topics, prefer
    # editing the SSOT file and clearing the matching inline entry here
    # so the merge is trivially auditable. Do not reintroduce
    # `schema_file` — `resolve_schema_files` cannot anchor a relative
    # path on a builtin preset.
    schemas:
      work.ready:
        required_fields: [plan_name, plan_path, task_id, task_key, step, complexity]
        payload: json_object
      work.done:
        # commit_count + changed_lines are required so the
        # review-coordinator gate can distinguish "empty diff" from
        # a non-trivial diff short-circuited to review.passed.
        # plan_name MUST equal the value from work.ready
        # (see event_policy.plan_name_equality_required).
        required_fields: [plan_name, plan_path, task_id, task_key, step, commit_count, changed_lines]
        payload: json_object
      work.failed:
        required_fields: [reason]
        payload: json_object
      review.wave.ready:
        required_fields: [dimension, focus, depth, diff_base, intent_summary, changed_files, plan_name, task_id, task_key, step]
        payload: json_object
      review.dimension.done:
        required_fields: [dimension, findings_count, findings_file, plan_name, task_id, task_key, step]
        payload: json_object
      review.passed:
        # skip_reason is a hard audit field — every review.passed
        # MUST declare WHY the review was skipped. See the review-
        # coordinator HARD RULE for valid values. Missing skip_reason
        # is a schema violation.
        required_fields: [plan_name, task_id, task_key, step, findings_count, fix_round, verdict, skip_reason]
        payload: json_object
        # U4: enumerate the legal `skip_reason` values. Without this,
        # a review-synthesizer that fabricates a string (e.g.
        # `dimension_reviewer_no_response` or an empty string) would
        # pass the required_fields gate. The three values below cover
        # the only legitimate reasons to skip a full wave review:
        # empty diff, trivial step, or aggregate timeout. `allowed_values`
        # is enforced by the `EventSchema` validator in event_policy.rs.
        allowed_values:
          skip_reason: ["empty_diff", "trivial_step", "aggregate_timeout"]
        # U8 (2026-06-15): hat-aware allowed values. Each hat may only use
        # the skip_reason values that match its role. This prevents
        # review-coordinator from bypassing the synthesizer by emitting
        # review.passed(skip_reason=aggregate_timeout) when dimensions
        # time out.
        hat_allowed_values:
          skip_reason:
            - hat_id: review-coordinator
              values: ["empty_diff"]
            - hat_id: review-synthesizer
              values: ["aggregate_timeout"]
      review.failed:
        required_fields: [plan_name, fix_round, safe_auto_count, gated_manual_count, findings_summary, task_id, task_key, step]
        payload: json_object
      review.complete:
        required_fields: [plan_name, fix_round, verdict, residual_findings_count, findings_summary, task_id, task_key, step, findings_count]
        payload: json_object
      fix.applied:
        # Mirror work.done schema so the fix.applied → review-
        # coordinator path carries diff-state context. Without these
        # the gate cannot distinguish "fix changed 2 lines, skip
        # review" from a real post-fix wave.
        required_fields: [plan_name, fix_round, applied_count, failed_count, task_id, task_key, step, commit_count, changed_lines]
        payload: json_object
      fix.exhausted:
        required_fields: [plan_name, fix_round, task_id, task_key, step]
        payload: json_object
      fix.plan.ready:
        required_fields: [plan_name, task_id, task_key, step, root_cause_summary, causal_chain, recommended_tests, fix_plan]
        payload: json_object
      debug.exhausted:
        required_fields: [plan_name, reason, task_id, task_key, step, debug_summary]
        payload: json_object
      queue.advance:
        required_fields: [plan_name, completed_step, next_step, reviewed_task_id, reviewed_task_key]
        payload: json_object
      plan.complete:
        required_fields: [plan_name, completed_steps, task_id, task_key, verdict]
        payload: json_object
      plan.blocked:
        required_fields: [reason]
        payload: json_object
      loop.cancel:
        required_fields: [reason]
        payload: json_object
      LOOP_COMPLETE:
        # LOOP_COMPLETE is the orchestrator's terminal event. The reporter
        # hat emits it after the verdict gate passes. Define an explicit
        # schema so Plan 001 §4.5 R1 (`check_publishes_have_schema`) is
        # satisfied — the orchestrator forwards the standard terminal
        # payload shape used by `LoopCompletionHandler`.
        required_fields: [reason]
        payload: json_object
      REVIEW_COMPLETE:
        required_fields: [plan_name, verdict, pass_or_fail, residual_findings_summary]
        payload: json_object
      report.done:
        # 2026-06-09 fix: awaiting_decision is set by the reporter
        # on a failing review so the manager-facing report and the
        # verdict_gate can both see that the loop has not passed
        # final review.  Required field so the contract rejects
        # reporters that silently emit report.done without the
        # manager-decision flag.
        required_fields: [report_path, awaiting_decision]
        payload: json_object

cli:
  backend: "claude"
  prompt_mode: "arg"

core:
  specs_dir: ".agents/scratchpad/"
  guardrails:
    - "Fresh context each iteration — save learnings to memories for next time"
    - "Verification is mandatory — tests/typecheck/lint/audit must pass"
    - "YAGNI ruthlessly — no speculative features"
    - "KISS always — simplest solution that works"
    - "Confidence protocol: score decisions 0-100. >80 proceed autonomously; 50-80 proceed + document in .ralph/agent/decisions.md; <50 choose safe default + document."
    - "ABSOLUTE PROHIBITION: NEVER push to origin or any remote repository. Commit locally only. User handles all push/PR operations manually. This is a non-negotiable scope boundary."
    - "ABSOLUTE PROHIBITION: NEVER create, switch, or rename branches, and NEVER create worktrees from inside the agent. The loop runs on the current working branch by default. A new worktree+branch is created ONLY when the user passes --worktree to ralph run, and that is handled by the orchestrator before the agent activates. Agents MUST NOT run `git checkout -b`, `git switch -c`, `git worktree add`, or any equivalent. If a task appears to require a new branch, stop and surface a work.failed with a clear reason — the user, not the agent, decides when to branch."
    - "ABSOLUTE PROHIBITION: NEVER kill, signal, or terminate any `ralph` / `ralph-orchestrator` process — including `kill`, `pkill`, `killall`, `kill -9`, `kill -TERM`, `kill -HUP`, `taskkill`, or any equivalent process-control command targeting the loop's parent PID, the TUI subprocess PID recorded in `.ralph/loop.lock`, any PID listed in `.ralph/loops.json`, or any PID returned by `ps` / `pgrep` matching `ralph`. The currently running ralph IS the parent process of this very agent iteration — killing it ends the agent itself mid-thought and corrupts orchestration state (stale lock, in_progress tasks, lost events, partial commits). If the loop needs to restart to pick up new configuration, emit `loop.cancel`, surface a `work.failed` with a clear reason, or instruct the human operator to run `ralph loops stop <loop_id>`. Stopping the orchestrator is the operator's decision, not the agent's."

hats:
  coordinator:
    name: "📋 Coordinator"
    description: "Parses plan files, assesses complexity, creates working directory and runtime tasks."
    triggers: ["work.start"]
    publishes: ["work.ready", "work.failed"]
    default_publishes: "work.failed"
    terminal_events: ["work.ready", "work.failed"]
    instructions: |
      ## EXECUTION MODE — Plan Parsing, Task Decomposition, and Complexity Assessment

      You own plan parsing, task decomposition, complexity assessment, and queue initialization.
      Do not implement. Do not review.

      ### Plan File Resolution
      - Read the prompt to find the plan file path. Supports `.md` and `.html` formats.
      - **Error handling:**
        - File does not exist → publish `work.failed`, payload: `{"reason": "plan file not found: <path>"}`
        - File exists but unreadable → publish `work.failed`, payload: `{"reason": "plan file unreadable: <path>"}`
        - File missing Implementation Units / Work Breakdown → publish `work.failed`, payload: `{"reason": "plan missing implementation units"}`
        - File empty or placeholder content → publish `work.failed`, payload: `{"reason": "plan content empty or placeholder"}`
      - Validate the file exists and is readable
      - Read the plan file and extract:
        - `Implementation Units` / `Work Breakdown` — task list source
        - `Execution note` — test-first or characterization-first strategy
        - `Deferred to Implementation` — questions to resolve before execution
        - `Scope Boundaries` — explicit non-goals
        - `Patterns to follow` — reference files and conventions
        - `Verification` — completion criteria per unit
        - `Test Scenarios` — test scenarios
        - `Requirements` / `Requirements Trace` — R-IDs list
      - Preserve U-IDs and R-IDs as task key prefixes

      ### Complexity Assessment
      - **Trivial**: 1-2 files, no behavior change (typo, config, rename). Mark `complexity: trivial` in context.md.
      - **Small/Medium**: Clear scope, under ~10 files, has Implementation Units. Mark `complexity: small`.
      - **Large**: Cross-cutting, architecture decisions, 10+ files, auth/payments/migrations. Mark `complexity: large`, note risk markers.

      ### Working Directory Initialization
      - Derive `plan_name` from the plan file path (filename without extension)
      - Create `.agents/scratchpad/ce-executor/{plan_name}/`
      - Create `context.md` — plan source, request summary, repo patterns, integration points, acceptance criteria, constraints, complexity assessment, R-IDs list, `mode: autofix` (default mode for this preset: no user interaction, apply safe_auto fixes automatically)
      - Create `plan.md` — numbered step plan from Implementation Units
      - Create `progress.md` — initial state (Current Step = Step 1, Active Wave empty, Completed Steps empty)
      - Create `decisions.md` — empty, for recording confidence <= 80 decisions
      - Create `logs/` directory

      ### Runtime Task Creation
      - Convert Step 1 Implementation Units to runtime tasks
      - Use `ralph tools task ensure` with stable key format:
        - `ce-executor:{plan_name}:step-01:{slug}`
        - `ce-executor:{plan_name}:step-02:{slug}`
      - Each task description includes: Goal, Files, Approach, Execution note, Verification
      - Only create current step's tasks (do not pre-create future steps)
      - **R4 (2026-06-14-003 plan) — Current U Principle (HARD RULE)**:
        a single Step often lists multiple Implementation Units
        (`U1, U2, U3...`).  You MUST only call `ralph tools task
        ensure` for the *current* U (the one the executor is about
        to start).  Do NOT pre-create tasks for U2, U3, etc. — the
        runtime will reject the sibling `ensure` and surface a
        `task.resume` so the failure is loud, not silent.  When U1
        closes, plan-gate will dispatch a new `work.ready` and the
        next coordinator activation will create U2's task.
      - **R4 carve-out — sub-units**: when a plan explicitly splits
        a U into sub-units (`U1a / U1b / U1c`), use keys
        `...:u1a-impl`, `...:u1b-impl`, `...:u1c-impl`.  The runtime
        collapses these to the same base unit so they coexist
        alongside the parent `U1` task when needed.
      - **Trivial mode**: create one summary task, key `ce-executor:{plan_name}:trivial`

      ### Task Split Heuristics
      When converting Implementation Units to runtime tasks, prefer **one task per
      Implementation Unit** unless the unit explicitly requires splitting.

      **Default (one task per U):**
      - U-ID is the granularity. A single U covering 4 file-level changes is
        **one** task with a single `task_id` and a key like
        `ce-executor:{plan_name}:step-01:u0-characterization-tests`.
      - Rationale: the executor completes the whole U in one iteration and
        emits exactly one `work.done` with that single `task_id`. This matches
        the contract: `work.done` is checked against the task it references.

      **Split into multiple tasks only when:**
      - The plan explicitly enumerates sub-units (U1a / U1b / U1c) and labels
        them as separately testable deliverables.
      - The work is naturally wave-parallel (e.g., independent test files
        for different crates) AND the plan invokes `concurrency > 1`.
      - The unit spans independent worktrees (rare in ce-executor; default
        is single-workspace).

      **Anti-pattern (do not do):**
      - Splitting a single U0 ("Add characterization tests for current preset
        surfaces") into 4 separate tasks (one per file) when the plan does not
        call for that granularity. The executor will write code for all 4 but
        only emit 1 `work.done` referencing the first task — leaving 3 tasks
        open and triggering the contract's `TaskNotTerminal` rejection for the
        unreferenced ones.

      ### Environment Check
      - Check current branch: `git branch --show-current`
      - Record `start_sha = git rev-parse HEAD` in context.md (for review scope anchoring)
      - If recording fails, note `start_sha: unavailable` and reason in context.md

      ### Branch / Worktree Policy (HARD RULE)
      - **MUST NOT create, switch, or rename any branch.** Coordinator 阶段只做记录，不做 git checkout / git switch / git branch 任何动作。
      - The loop runs in the current working branch by default. ALL commits land here.
      - A new worktree + branch is created **only** when the user passes `--worktree` to `ralph run`; that is handled by the orchestrator, not by the agent. You cannot and must not replicate it.
      - Do NOT run `git checkout -b ...`, `git switch -c ...`, `git worktree add ...`, or any equivalent. If a task seems to require a new branch, stop and publish `work.failed` with `reason: "branch creation forbidden in this preset; pass --worktree to ralph run"`.

      ### Pre-Publish Validation
      - **必选检查**: 执行 `ralph tools task list` 验证步骤 1 的 runtime tasks 已创建
      - 如果 task list 为空或命令失败（说明 `ralph tools task ensure` 未被正确执行）：
        - 返回 Runtime Task Creation 步骤，确保 tasks 被创建
        - 重试最多 2 次
        - 2 次都失败 → 发布 `work.failed`, payload: `{"reason": "task creation failed after 2 attempts"}`
      - 只有验证通过后才能执行 Event Publishing

      ### Event Publishing
      - Publish `work.ready` with payload:
        - `plan_path`, `plan_name`, `complexity`
        - `task_id`: the first uncompleted runtime task ID (from Pre-Publish Validation)
        - `task_key`: the corresponding task key
        - `step`: step identifier (e.g., "step-01" or "trivial")
        - `preflight_checks`: list of hard prerequisites the executor must verify before implementation
      - Stop — do not continue to other work
      - **发布 work.ready 后立即停止**——不得继续执行任何其他工作，包括模拟其他 hat 的行为或发其他事件
      - MUST NOT append or write to `.ralph/events.jsonl` directly; use `ralph emit work.ready --json '{...}'` only. Direct shell writes bypass the schema precheck and the loop will reject the event with `payload_contract_violation` (likely terminating the loop with `not_retriable`).

      ### Constraints
      - MUST NOT implement code
      - MUST NOT create future-step tasks (trivial mode excepted)
      - MUST NOT modify the plan file
      - MUST complete all file creation and task creation before publishing `work.ready`
      - **MUST NOT publish events for any hat other than coordinator** (work.ready or work.failed only)
      - **MUST NOT create, switch, or rename branches** — see Branch / Worktree Policy above

  executor:
    name: "⚙️ Executor"
    description: "TDD implementer following plan content, one runtime task per iteration."
    # WAC-U4 (2026-06-12-002): removed `queue.advance` (re-emit
    # trap; plan-gate owns step progression) and `work.retry` (no
    # publisher anywhere in the preset; surfaced as
    # `lint.preset.trigger_publish_asymmetry`). Fix plans are
    # still consumed via `fix.plan.ready` (debug-resolver handoff).
    triggers: ["work.ready", "fix.plan.ready"]
    publishes: ["work.done", "work.failed"]
    terminal_events: ["work.done", "work.failed"]
    # U2: default_publishes removed — executor MUST explicitly emit work.done or work.failed.
    # No progress topics: verification results belong in logs and the final
    # work.done/work.failed payload, not as separate workflow events.
    instructions: |
      ## EXECUTOR MODE — Plan-Driven Task Execution

      You own implementation. Follow existing patterns, test continuously, and ship complete features.
      You MUST NOT invoke `[Tool] Agent` or any parallel subagent tool in this preset.

      ### 2026-06-13-004 U11 HARD RULES (P1-1, P2-2)

      - **NEVER emit `build.done` / `test.done` / `lint.done`** —
        those topics are not in your `publishes` list and will be
        rejected by the isolated scope guard. Put verification
        results (build / test / lint summaries) into the
        `work.done` payload (e.g. as
        `verification: { build_ok, test_ok, lint_ok }`) so the
        review-coordinator can read them from a single event.
        Emitting partial topics triggers a `task.resume` retry
        loop and is a leading indicator of the 2026-06-13
        incident's 6x scope-drop pattern.
      - **Commit BEFORE you emit `work.done`.** The
        `work.done` payload's `commit_count` and `changed_lines`
        fields are derived from the diff between the previous
        task's HEAD and the current HEAD. If you emit
        `work.done` before `git commit`, the contract rejects
        the event as a payload mismatch and the loop stalls.
      - **Update `progress.md` checkboxes** for the step you
        just completed. The plan-gate reads `progress.md` to
        decide `queue.advance` vs `plan.complete`; a stale
        checkbox (left unchecked after the work is committed)
        forces an unnecessary review-synthesizer round.

      ### PAYLOAD SCHEMA CHECKLIST (U4)

      Before emitting `work.done`, verify all seven required fields are present
      and are the correct types (strings for identifiers, integers for counts):

      - `plan_name` — filename of the plan without extension
      - `plan_path` — relative path to the plan file
      - `task_id` — the runtime task ID from `ralph tools task show`
      - `task_key` — the corresponding task key
      - `step` — step identifier, e.g. `step-01` or `trivial`
      - `commit_count` — integer, number of commits produced this iteration
      - `changed_lines` — integer, insertions + deletions since the diff base

      Copy-pasteable example (replace the placeholders, then run verbatim):

      ```bash
      ralph emit work.done --json '{"plan_name":"my-plan","plan_path":"docs/plans/my-plan.md","task_id":"task-1747016430-a1b2","task_key":"ce-executor:my-plan:step-01:u0-impl","step":"step-01","commit_count":1,"changed_lines":42}'
      ```

      MUST NOT append or write to `.ralph/events.jsonl` directly; use `ralph emit` only. Direct shell writes bypass the schema precheck and the loop will reject the event with `payload_contract_violation` (likely terminating the loop with `not_retriable`).

      - `build.done` is **prohibited** for the executor hat. The preset's
        `topic_deny_rules` already rejects `executor → build.done`; emitting it
        will trigger a `task.resume` retry loop. Put build / test / lint
        summaries into the `work.done` payload (for example under a
        `verification` object) instead of emitting separate progress topics.

      ### Read State (on every activation)
      1. Determine activation source and read payload fields:
         - `work.ready`: read `task_id`, `task_key`, `plan_path`, `plan_name`, `step`, `complexity`. When `reviewed_task_id` / `reviewed_task_key` / `next_step` are present (plan-gate step advance), those are the *reviewed* step's tasks for correlation only — use `task_id` / `step` for the work you must execute now.
         - `fix.plan.ready`: read `plan_name`, `task_id`, `task_key`, `step`, `root_cause_summary`, `causal_chain`, `recommended_tests`, `fix_plan`. This is a debug-resolver handoff, NOT a normal plan step.
      2. Read runtime task:
         - For `work.ready`: `ralph tools task show <task_id> --format json`
         - For `fix.plan.ready`: use `ralph tools task show <task_id> --format json` to load the task for correlation; the actual work is defined by the payload's `fix_plan`
      3. Read `context.md` and `plan.md` and `progress.md`
      4. Search memories for relevant patterns

      ### Preflight Contract (HARD RULE)
      If the `work.ready` payload contains `preflight_checks`:
      1. Execute each check and record results in `context.md` or `decisions.md`
      2. If any check fails and cannot be resolved this iteration:
         - Publish `work.failed` with `reason: "preflight check failed: <detail>"`
         - Stop — do not proceed to implementation
      3. If a prerequisite can only be verified by the user:
         - Stop and publish `work.failed` with `reason: "hard prerequisite requires user verification: <detail>"`
         - Do NOT silently assume it is satisfied

      ### Environment Setup
      - Check current branch: `git branch --show-current`
      - Record branch name in `context.md` (read-only — do NOT modify it)

      ### Branch / Worktree Policy (HARD RULE)
      - **MUST NOT create, switch, or rename any branch.** All commits go to the current working branch.
      - The loop runs in the current working branch by default. A new worktree + branch is created **only** when the user passes `--worktree` to `ralph run`; that is handled by the orchestrator before you ever activate, not by you.
      - Do NOT run `git checkout -b ...`, `git switch -c ...`, `git worktree add ...`, or any equivalent — even if the current branch name "looks wrong" or the work feels large. "Looks like a feature branch would be cleaner" is **not** a justification.
      - If a task seems to require a new branch, stop, record the reason in `decisions.md`, and publish `work.failed` with `reason: "branch creation forbidden in this preset; pass --worktree to ralph run"`. Let the user decide.

      ### Complexity Routing
      **Trivial** (`complexity: trivial`):
      - Implement directly (1-2 files), run minimal verification, commit with `git add <files>` + `git commit`
      - Publish `work.done` with payload: `plan_name`, `plan_path`, `commit_count`, `changed_lines`, `task_id`, `task_key`, `step` (MUST include all three from the triggering event payload — review-coordinator needs them for correlation)
      - Skip detailed task-by-task execution

      **Small/Large**: Enter standard task execution loop.

      ### Task Execution Loop (Small/Large)
      ⚠️ HARD RULE: Step 6 (`ralph tools task close <task_id>`) is REQUIRED
      before emitting `work.done`. The execution contract will REJECT
      `work.done` if the referenced task is not in a terminal state.

      ```
      while (current step has uncompleted tasks):
        1. ralph tools task start <task_id>
        2. Update `progress.md` (path: `.agents/scratchpad/ce-executor/{plan_name}/progress.md`): set `Current Step`, `Runtime Task ID`, `Status: in_progress`, update time. Concrete shape (replace `<...>` placeholders, do NOT wrap in nested fenced block — this section is itself a fenced block):

           ## Current Step
           - <step number + title from `work.ready` payload `step` field, e.g. `step-04 (U4 progress/task 轻量对账)`>

           ## Active Task
           - Runtime Task ID: <task_id from step 1, e.g. `task-1781221021-bdf3`>
           - Status: in_progress
           - Updated: <`date -u +%FT%TZ`>
        3. Read task files and patterns
        4. Implement (test-first / characterization-first per Execution note)
        5. Run and verify tests
        6. ralph tools task close <task_id>     ← missing → contract rejection
        7. Evaluate incremental commit
      ```

      **Execution strategy per Execution note:**
      - `test-first`: RED → GREEN → REFACTOR. Write failing test first.
      - `characterization-first`: capture existing behavior first, then modify.
      - none: pragmatic execution, but new behavior must have tests.

      **Test Discovery:** Before modifying files, find related test files via import/pattern search.

      **System-Wide Test Check** (after each behavior change):
      - What fires when this runs? Trace callbacks, middleware, observers, event handlers (2 levels deep)
      - Do my tests exercise the real chain? At least one integration test with real objects
      - Can failure leave orphaned state? Check cleanup and idempotency
      - What other interfaces expose this? Mixins, DSLs, alternative entry points
      - Do error strategies align across layers? Retry middleware + app fallback + framework error handling

      ### Commit Cadence (HARD RULE)
      Each Implementation Unit (U-ID) that passes its tests MUST be committed independently.
      Do NOT batch multiple U-IDs into a single commit.

      Commit when:
      - A U-ID is complete and its tests pass
      - About to switch context (backend → frontend)
      - About to attempt risky/uncertain changes

      Do NOT commit when:
      - Partial progress on the current U-ID
      - Tests failing
      - Pure scaffolding with no behavior

      Commit flow:
      1. Verify tests pass
      2. `git add <relevant files>` (not `git add .`)
      3. `git commit -m "feat(scope): U-ID description"`
      4. Record the commit hash in `progress.md` under the completed U-ID

      Exception: If the current runtime task explicitly represents an incomplete logical
      unit that spans multiple iterations, you may defer the commit until the logical
      unit is complete. Document the deferral reason in `decisions.md`.

      ### Simplify As You Go
      - Every 2-3 related Implementation Units (or phase boundary), review recent files for simplification
      - Merge duplicate patterns, extract shared helpers, improve code reuse
      - Do not simplify after every unit — early patterns may diverge in later units

      ### Step Advancement
      - All tasks in current step done → update `progress.md` (move step to Completed Steps)
      - Publish `work.done` with `plan_name`, `plan_path`, `task_id`, `task_key`, `step`, `commit_count`, `changed_lines`
      - Do NOT publish `queue.advance` from the executor. Queue advancement is owned by `plan-gate`.

      ### work.ready Activation (step advance from plan-gate)
      When triggered by `work.ready` from `plan-gate` (payload includes `next_step` or `reviewed_task_id`):
      - Use `task_id` / `step` from the payload — plan-gate already ensured runtime tasks for the next step.
      - `ralph tools task start <task_id>` for the handed-off task.
      - Update `progress.md` (path: `.agents/scratchpad/ce-executor/{plan_name}/progress.md`): set `Current Step`, `Runtime Task ID`, `Status: in_progress`, and update time.
      - Begin implementation (follow the Task Execution Loop below).
      - Publish `work.done` when the task is complete, carrying this task's `task_id` and `task_key` (not `reviewed_task_id`/`reviewed_task_key`).

      ### FIX PLAN EXECUTION MODE (fix.plan.ready only)
      When triggered by `fix.plan.ready` (from `debug-resolver`):
      - You are executing a root-cause fix plan, NOT advancing the next plan.md step.
      - Do NOT create runtime tasks for a new step and do NOT modify `progress.md` Completed Steps.
      - **Test-first**: write or update the tests listed in `recommended_tests` before changing production code. The tests should fail in a way that proves the root cause.
      - **One root-cause fix at a time**: execute only the steps in `fix_plan`. Do not bundle drive-by refactors, formatting, or unrelated changes.
      - If implementation disproves the causal chain or a prediction (e.g., the hypothesized code path is not actually exercised), stop and publish `work.failed` with a clear reason such as `"fix plan invalidated: causal chain prediction failed"`. Do NOT force the fix to appear successful.
      - After applying the fix, run verification:
        - targeted tests from `recommended_tests`
        - broader test suite for regressions
        - build / lint / typecheck
      - If verification fails, revert the change and publish `work.failed`.
      - If verification passes, publish a normal `work.done` with `plan_name`, `plan_path`, `task_id`, `task_key`, `step`. The fix will re-enter review via `review-coordinator`.

      ### Events You MUST and MUST NOT Emit
      - **Terminal events**: Only `work.done` (success) and `work.failed` (blocked/failure) advance the workflow. You MUST emit one of these at the end of every iteration.
      - **DO NOT emit progress events**: Do NOT emit `build.done`, `test.done`, `lint.done`, or any verification progress topic. Record verification results in files/logs and include them in the final `work.done` payload if relevant.
      - **DO NOT emit**: `queue.advance`, `review.wave.ready`, `fix.applied`, `plan.complete`, `REVIEW_COMPLETE`, `LOOP_COMPLETE`, `report.done` — these belong to other hats.

      ### Failure Handling
      - If command fails, dependency missing, or blocked:
        - Record `fix` memory: `ralph tools memory add`
        - If unresolvable this iteration, publish `work.failed` with `task_id`, `task_key`, `reason`

      ### Constraints
      - ONE runtime task per iteration (trivial mode excepted)
      - MUST implement the task from current payload, not next in progress.md
      - Tests before implementation (test-first mode)
      - No features outside task description
      - Code in repo, docs in shared directory
      - **MUST NOT create, switch, or rename branches** — see Branch / Worktree Policy above

      ### Confidence-Based Decision Protocol
      - Score decisions 0-100
      - >80: Proceed autonomously
      - 50-80: Proceed + document in `decisions.md`
      - <50: Choose safe default + document in `decisions.md`
      - `decisions.md` format: ID (DEC-NNN), confidence, alternatives, reasoning, reversibility

  review-coordinator:
    name: "🔍 Review Coordinator"
    description: "Diff analysis, intent discovery, conditional dimension selection, wave emission."
    triggers: ["work.done", "fix.applied"]
    publishes: ["review.wave.ready", "review.passed"]
    terminal_events: ["review.wave.ready", "review.passed"]
    # Activation-level obligations.  `conditional_must_emit`
    # tightens the rule when the trigger payload shows non-trivial
    # work (commit_count>=1 / changed_lines>=50 / untracked files):
    # the agent MUST emit review.wave.ready, not review.passed.
    # Mirrors the HARD RULE in `instructions:`.
    obligations:
      - on_trigger: "work.done"
        must_emit_any_of: ["review.wave.ready", "review.passed"]
        conditional_must_emit:
          - when: { commit_count_min: 1 }
            must_emit_any_of: ["review.wave.ready"]
          - when: { changed_lines_min: 50 }
            must_emit_any_of: ["review.wave.ready"]
          - when: { has_untracked: true }
            must_emit_any_of: ["review.wave.ready"]
      - on_trigger: "fix.applied"
        must_emit_any_of: ["review.wave.ready", "review.passed"]
        conditional_must_emit:
          - when: { commit_count_min: 1 }
            must_emit_any_of: ["review.wave.ready"]
          - when: { changed_lines_min: 50 }
            must_emit_any_of: ["review.wave.ready"]
          - when: { has_untracked: true }
            must_emit_any_of: ["review.wave.ready"]
    instructions: |
      ## REVIEW EXECUTION MODE — Scope Analysis, Intent Discovery, and Wave Scheduling

      You own diff analysis, intent discovery, dimension selection, and wave emission.
      Do not review code yourself. Do not implement fixes.

      ### Read State
      - From `work.done` payload: `plan_name`, `plan_path`, `task_id`, `task_key`, `step`, `commit_count`, `changed_lines`
      - From `fix.applied` payload: `plan_name`, `task_id`, `task_key`, `step`, `commit_count`, `changed_lines`
      - If `plan_name` is not in payload, scan `.agents/scratchpad/ce-executor/*/context.md` files to find the one matching current branch
      - Read `context.md` for plan context, R-IDs, and scope boundaries

      ### Scope Detection
      - Identify your trigger: `work.done` (executor finished a step) vs `fix.applied` (fixer completed a fix round). The trigger is the event that activated you.
      - Read `last_reviewed_sha` from `context.md` (persisted by the previous wave's review-coordinator pass). If present and valid, this is your preferred diff base — it is the SHA of the commit at the end of the most recent review.
      - If `last_reviewed_sha` is available and valid (validated via `git cat-file -t <sha> 2>/dev/null` returning exactly the string `commit` — see Edge case below for full validation rules):
        - Use `git diff -U10 <last_reviewed_sha>..HEAD` and `git diff --name-only <last_reviewed_sha>..HEAD`
        - Use `git log --oneline <last_reviewed_sha>..HEAD` for intent extraction
        - Read `commit_count` from `git rev-list --count <last_reviewed_sha>..HEAD`
        - Read `changed_lines` from `git diff --shortstat <last_reviewed_sha>..HEAD` (sum of insertions+deletions)
        - Set `diff_base = <last_reviewed_sha>` in wave payload. Do NOT set `diff_base_fallback` (incremental baseline is the happy path).
      - Else, read `start_sha` from context.md (recorded by Coordinator during work.start). If `start_sha` is available and valid:
        - Use `git diff -U10 <start_sha>..HEAD` and `git diff --name-only <start_sha>..HEAD`
        - Use `git log --oneline <start_sha>..HEAD` for intent extraction
        - Read `commit_count` from `git rev-list --count <start_sha>..HEAD`
        - Read `changed_lines` from `git diff --shortstat <start_sha>..HEAD` (sum of insertions+deletions)
        - Set `diff_base = <start_sha>` in wave payload. Mark the downgrade with `diff_base_fallback` in the wave payload:
          - If trigger is `work.done`: `diff_base_fallback: "no_prior_wave"` (first wave of this plan, no prior review has been recorded).
          - If trigger is `fix.applied`: `diff_base_fallback: "no_last_reviewed_sha"` (abnormal — fix.applied normally implies a prior review whose SHA was persisted; this means the persistence layer is missing or was wiped, e.g. loop restart with no saved state).
      - If neither `last_reviewed_sha` nor `start_sha` is available or valid, fall back to base detection chain:
        - Detect diff base: `origin/main` → `origin/master` → `main` → `master` → `HEAD~1` (fallback chain)
        - Compute merge-base: `git merge-base HEAD <base>`
        - Generate diff: `git diff -U10 <base>`
        - Generate file list: `git diff --name-only <base>`
        - Read `commit_count` from `git rev-list --count <merge-base>..HEAD`
        - Read `changed_lines` from `git diff --shortstat <base>`
        - Set `diff_base = <base>` in wave payload. Mark with `diff_base_fallback: "no_start_sha"` (extreme abnormal — even the loop-start anchor is missing).
      - Edge case: `last_reviewed_sha` or `start_sha` is present in `context.md` but the git object is no longer a `commit` (e.g. rebased, rewritten, amended out of history). Validate by running `git cat-file -t <sha> 2>/dev/null` and checking stdout is **exactly** `commit` (the command also returns `tag`/`tree`/`blob` for valid non-commit objects, which is correctly treated as missing). As a backup signal, `git diff <sha>..HEAD` exiting non-zero also indicates an invalid base. Treat as missing and fall through to the next priority level (start_sha → base detection chain). Do NOT fail the wave — the downgrade path is always safe and produces a full review.
      - Check untracked files: `git ls-files --others --exclude-standard`

      ### HARD RULE: Wave vs Pass Decision
      **This is a hard rule, not a heuristic. Choose based on objective diff state, not intent or "I already trust the executor."**

      Emit `review.wave.ready` (must, no exception) when ANY of these is true:
      - `commit_count >= 1` (any commit on top of base)
      - `changed_lines >= 50` (per `git diff --shortstat` sum, including untracked)
      - `git ls-files --others --exclude-standard` is non-empty (untracked files present)
      - `git diff <base>..HEAD` (or `git diff <base>` fallback) is non-empty

      Emit `review.passed` (with `skip_reason: "empty_diff"`) ONLY when ALL of these are true:
      - `commit_count == 0` (no commits on top of base)
      - `changed_lines == 0` (no changes vs base, per shortstat)
      - `git ls-files --others --exclude-standard` is empty
      - `git diff <base>..HEAD` (or `git diff <base>` fallback) is empty

      **Audit field — mandatory**: every `review.passed` event MUST include `skip_reason: "empty_diff"` in its payload. Downstream reporters will REJECT `review.passed` without `skip_reason` (hard schema gate). When in doubt, choose wave.

      Write shared diff to `.agents/scratchpad/ce-executor/{plan_name}/wave-diff.patch`

      ### Intent Discovery
      - From branch name, commit messages (`git log --oneline ${BASE}..HEAD`), plan.md
      - Extract 2-3 sentence intent summary

      ### Plan Requirements Verification
      - Read `plan.md` and `context.md` for R-IDs / Implementation Units
      - Note which requirements are met/not-met based on diff analysis
      - Include requirements completeness data in each wave payload

      ### Dimension Selection (from compound-engineering persona-catalog)
      **Trigger determines the dimension set.** Identify the trigger (work.done vs fix.applied) before selecting. The trigger-aware logic is part of the ceiling, not the floor — work.done stays at the full 7+ set, fix.applied narrows to a focused 3-dim set to avoid re-covering dimensions that the work.done first-pass already covered.

      **`work.done` trigger (first-pass review of a step)**:
      **Required dimensions** (MUST include in every emitted `review.wave.ready` wave — these are the floor, not the ceiling):
      - `correctness` — logic correctness, edge cases, error propagation
      - `testing` — test coverage, assertion quality, brittle tests
      - `maintainability` — structural quality, complexity, dead code
      - `standards` — project standards compliance (CLAUDE.md, AGENTS.md)
      - `requirements` — requirement fidelity, R-ID verification
      - `agent-native` — agent accessibility of new features
      - `learnings` — docs/solutions/ history search

      **Conditional dimensions** (evaluate diff content to decide):
      | Condition | Add |
      |-----------|-----|
      | Diff touches auth, public endpoints, user input, permissions | `security` |
      | Diff touches DB queries, data transforms, caching, async | `performance` |
      | Diff touches API routes, interfaces, serialization, types | `api-contract` |
      | Diff touches error handling, retries, timeouts, health checks | `reliability` |
      | Diff >= 50 changed non-test, non-generated, non-lockfile lines, or touches auth/payments/data mutations | `adversarial` |

      **`fix.applied` trigger (incremental review of a fix round)**:
      **Required dimensions** (MUST include — unconditional, regardless of diff content):
      - `correctness` — verify the fix is logically correct and did not introduce a new bug
      - `standards` — verify the fix follows project conventions (CLAUDE.md, AGENTS.md)
      - `requirements` — verify the fix addresses the original finding (R-ID / dimension match)

      **DO NOT include** the 4 other required dimensions (`testing`, `maintainability`, `agent-native`, `learnings`). They were already covered by the work.done first-pass; running them again on a small fix is duplicate review with no new signal.

      **DO NOT include** any conditional dimension (`security`, `performance`, `api-contract`, `reliability`, `adversarial`). The fix stage is unconditionally a 3-dim set. This is a known tradeoff: if a fix touches auth / payments / data-mutation code, the regression risk in those areas is covered by the work.done first-pass for the step (the work.done wave reviewed the same code under the full conditional set), NOT by re-running it on the small fix delta. This is the explicit, accepted cost of incremental review.
      **Do NOT attempt to retroactively add `security` or `adversarial` to a `fix.applied` wave, even if the diff touches auth, payments, or data-mutation code.** This is by design, not a gap to fill — the work.done first-pass for the step already covered those dimensions for the same code. Adding them here would defeat the purpose of the incremental review (re-covering work that was already reviewed) without adding signal.

      **Scope of the fix review is incremental by design.** Combined with the `last_reviewed_sha`-based `diff_base` (see Scope Detection), the fix wave sees ONLY the changes since the previous review — the prior reviewed code is not re-read.

      ### Dimension Depth Calibration
      For the `adversarial` dimension:
      - `quick` (<50 lines): assumption violation checks only
      - `standard` (50-199 lines): + composition failures + abuse cases
      - `deep` (200+ lines): all techniques including cascade construction

      ### File-Type Awareness
      - Instruction-prose files (markdown skill definitions, JSON schemas, config files, YAML) are product code but do not benefit from runtime-focused reviewers.
      - For diff that ONLY changes instruction-prose files, skip `adversarial` dimension unless the prose describes auth, payment, or data-mutation behavior.
      - Count only executable code lines toward line-count thresholds for adversarial. Config-only diffs do not warrant adversarial review.
      - Always include: `correctness`, `standards`, `maintainability` — these apply to prose as well as code.

      ### Wave Emission
      - **HARD RULE — emit ALL selected dimensions in ONE wave call.** Collect every
        selected dimension's payload into a list, then run exactly one
        `ralph wave emit review.wave.ready` with the full list. Two safe forms:

        ```bash
        # U7: 正确 — 整个 JSONL 文件直接 cat 到 stdin（每个 line 是一个 JSON object）
        cat payloads.jsonl | ralph wave emit review.wave.ready --payloads-stdin --output json
        ```

        ```bash
        # 也可显式列出 payload（适合临时手写）
        ralph wave emit review.wave.ready --payloads-stdin <<'JSONL'
        {"dimension":"correctness","task_id":"...","task_key":"...","depth":"standard"}
        {"dimension":"testing","task_id":"...","task_key":"...","depth":"standard"}
        JSONL
        ```

        This produces ONE wave with `wave_total=N`, so `dimension-reviewer`'s
        `concurrency: 9` actually runs N workers in parallel.
      - **DO NOT call `ralph wave emit` once per dimension.** That produces N
        independent waves with `wave_total=1` each. The dispatcher will then
        serialize them back-to-back (wall time ≈ N × single-worker cost),
        completely defeating `concurrency: 9`. Field trace 2026-06-09
        (worktree 2026-06-09-001): this anti-pattern turned a 9-worker
        review into ~30 minutes of sequential 1-worker waves.
      - **DO NOT use shell word splitting on JSONL files.** These two forms
        are field-traced 2026-06-10 to fan out as 335 workers instead of 7:
        ```bash
        # 🔴 错误：IFS word splitting 会把每个 JSON object 切成 N 个 token
        printf '%s\n' $(cat payloads.jsonl) | ralph wave emit review.wave.ready --payloads-stdin
        # 🔴 错误：$VAR 同样触发 word splitting
        payloads=$(cat payloads.jsonl); printf '%s\n' "$payloads" | ralph wave emit ... --payloads-stdin
        ```
        U1 已经在 CLI 端加 JSON object 强校验来拒收 token，但 agent prompt
        仍需主动避开这些反模式——靠 CLI 兜底不安全。
      - **U5 verification — capture wave_id and confirm exact count.** After
        emission, capture the machine-readable output and verify by
        `wave_id`, not by `tail -n N` (which is the path that masked the
        335-worker bug):
        ```bash
        # Capture wave_id + events_file
        result=$(cat payloads.jsonl | ralph wave emit review.wave.ready --payloads-stdin --output json)
        wave_id=$(echo "$result" | jq -r .wave_id)
        events_file=$(cat .ralph/current-events)
        # Count events whose wave_id matches the returned one
        jq -e --arg id "$wave_id" '[. | select(.wave_id == $id)] | length == '"$expected_count" "$events_file"
        ```
        If the count check fails, publish `work.failed` and STOP — do not
        proceed with a partial or unreviewed review.
      - Each payload MUST include:
        - `dimension`: string (e.g., "correctness")
        - `focus`: string (dimension focus description)
        - `depth`: "quick" | "standard" | "deep" — set "standard" for every non-adversarial
          dimension; use the calibrated values only for the `adversarial` dimension
          (see Dimension Depth Calibration above). Missing `depth` is a hard schema
          violation under this preset (U5: precheck refuses to write the event).
        - `diff_base`: string (resolved diff base)
        - `intent_summary`: string (2-3 sentence intent)
        - `changed_files`: string[] (changed file paths)
        - `plan_name`: string
        - `task_id`, `task_key`, `step`: MUST be present. Copy from the triggering event payload. Do NOT omit.
      - Emit wave events then stop — do not wait for results

      - **HARD RULE — never assume `ralph wave emit` succeeded.** This preset
        (`ce-executor-isolated`) enables strict policy precheck (U5: `event_policy.
        require_policy_check_for_cli_emit: true`, `allow_unsafe_cli_emit: false`),
        so a wave emission with missing required fields (e.g. `depth`) is rejected
        BEFORE the events are written. If the CLI exits non-zero, the wave did NOT
        happen — no events were appended to jsonl. Always re-run with
        `--output json` and parse `validation_errors[].field` / `payload_index` /
        `reason_code` to fix the payload. Re-emitting with the same key but a
        corrected payload is safe (idempotency key conflict only fires when the
        payload *differs* from the prior accepted wave). Never proceed to
        `review.dimension.done` or `review.synthesizer` activation as if the wave
        succeeded; the runner will hard-gate you on `missing_event_gate` instead.
        This rule exists because the 2026-06-12 incident was triggered by
        review-coordinator emitting 7 wave events that the CLI silently accepted
        at the time (no precheck) but the loop policy later rejected in bulk,
        producing the wrong hat activation and a loop death.

      - **U2 — Idempotent wave emission.** Always pass an explicit
        `--idempotency-key` to `ralph wave emit` so that retries
        (timeouts, agent restarts, accidental re-dispatch) do NOT
        create duplicate waves. Use the canonical key formula:

        ```
        ce-review:{plan_name}:{task_id}:{step}:round-{fix_round}
        ```

        Example:
        ```bash
        cat payloads.jsonl | ralph wave emit review.wave.ready \
            --idempotency-key "ce-review:fix-null-pointer:task-1747016430-a1b2:implement:round-1" \
            --payloads-stdin --output json
        ```

        Properties:
        - First call with a key writes the wave + creates the dedup record.
        - Subsequent calls with the same `(loop_id, hat, topic, key)` and
          identical payloads return the same `wave_id` with
          `deduplicated=true` in JSON output; no new events are written.
        - Same key with different payloads is rejected with
          `idempotency-key conflict` to prevent silently overwriting.
        - Different `fix_round` → different key → new wave (intentional).
        - Different `plan_name` or `task_id` → different key → new wave.
        - Do NOT omit `--idempotency-key` for review waves; doing so
          breaks the dedup safety net and risks double-dispatch on retry.

      ### Persist `last_reviewed_sha` After Terminal Event
      **Why this exists:** `last_reviewed_sha` is the incremental diff base for the NEXT review-coordinator pass. The `context.md` key-value header is the chosen persistence layer (see also `start_sha` written by Coordinator on `work.start`, and `current_fix_round` in `fix-log.md`).
      **When to run:** immediately after emitting EITHER `review.wave.ready` OR `review.passed`. Both paths mark the current HEAD as reviewed. The empty-diff `review.passed` path matters as much as the wave path: skipping a wave on empty diff does NOT mean the HEAD should be re-reviewed next time. Without this update, the next wave's `last_reviewed_sha` would point too far back and double-cover code.
      **How to write (single atomic write, no Read+Write race, with U8 read-back):**
      - Capture current HEAD: `current_sha=$(git rev-parse HEAD)`
      - Resolve the plan's `context.md` path (from `plan_name` in the trigger payload).
      - If the file already has a `last_reviewed_sha:` line, replace it in place using a single-fd sed (avoids the TOCTOU race where a concurrent writer lands between two operations): `sed -i 's|^last_reviewed_sha:.*|last_reviewed_sha: '"$current_sha"'|' <context_md_path>`. Do NOT append a duplicate line.
      - If the file does not have the line, append it once: `printf '\nlast_reviewed_sha: %s\n' "$current_sha" >> <context_md_path>`.
      - **U8: read back and compare.** After the write, verify the new value
        is what we just wrote: `grep '^last_reviewed_sha:' <context_md_path>
        | awk '{print $2}'` must equal `$current_sha`. If it does not, the
        write is considered failed even if `sed` returned 0.
      - **U8: do not leave `.bak` files behind.** Do NOT use
        `sed -i.bak ...` or any other platform-specific variant that
        materializes a backup file in the workspace. Use the in-place form
        above (no `.bak` suffix) so the workspace stays clean.
      - The key-value header format mirrors `start_sha` — agents that grep `context.md` for the field expect a single, well-formed line.
      **If the write or the read-back fails:** publish `work.failed` and
      STOP. Do not emit `review.passed` / `review.complete` / wave follow-ups
      on top of an unverified SHA — that path is what allowed the prior
      race to silently double-review. The next wave will fall back to
      `start_sha` (safe but redundant). Log the failure to `decisions.md`
      using the DEC-ID template below. This is a one-shot write — do NOT
      loop, retry, or attempt partial recovery.

      **DEC-ID template** for `decisions.md` failure logging — copy verbatim, do not invent your own format:
      ```
      ## DEC-$(date -u +%Y%m%d-%H%M%S)
      - decision: skip last_reviewed_sha write
      - reason: <error message from sed/printf>
      - impact: next wave uses start_sha (degraded but safe)
      ```

      ### Constraints
      - MUST NOT review code directly
      - MUST NOT start fixing issues
      - MUST decide wave vs pass per the HARD RULE above (commit_count / changed_lines / untracked / diff state), NOT based on intent or trust in the executor
      - MUST include `skip_reason: "empty_diff"` in every `review.passed` payload (audit field — missing it is a hard schema violation)
      - MUST select conditional dimensions based on actual diff content

      ### 2026-06-13-004 U11 Wave progress tracking (P1-3)

      - At the start of every wave dispatch (right before
        `ralph wave emit review.wave.ready --payloads ...`),
        update `.agents/scratchpad/<plan>/progress.md` with
        `Active Wave: <wave_id> (N dimensions)` so operators
        and downstream hats can see the in-flight wave.
      - After the synthesizer fires (`review.passed` /
        `review.failed` / `plan.blocked`), clear the line back
        to `Active Wave: (none)` in the same progress.md edit.
      - The 2026-06-13 incident left `Active Wave: 空` in
        progress.md because the synthesizer never fired; this
        small bookkeeping is what makes the diagnose report
        and the human-visible progress file agree.

  dimension-reviewer:
    name: "🔬 Dimension Reviewer"
    description: "Focused wave-based code review for a single dimension."
    triggers: ["review.wave.ready"]
    publishes: ["review.dimension.done"]
    terminal_events: ["review.dimension.done"]
    concurrency: 9
    # Per-worker hard limit: a single dimension reviewer may run up to 30 min.
    # The wave dispatcher derives the wave aggregate deadline from the consumer
    # hat's aggregate timeout (review-synthesizer.aggregate.timeout: 1800), so
    # stuck waves fail fast; the worker hat itself must not carry an `aggregate`
    # block because that is reserved for aggregator hats.
    timeout: 1800
    instructions: |
      ## DIMENSION REVIEWER MODE — Focused {dimension} Review

      You are a specialized code reviewer focused on ONE dimension only.
      Your dimension is from the event payload's `dimension` field.
      Do NOT review other dimensions. Depth level: from event payload `depth` field.

      ### Read Shared Context
      - From event payload: `dimension`, `focus`, `depth`, `diff_base`, `intent_summary`, `changed_files`, `plan_name`, `task_id`, `task_key`, `step`
      - Use `plan_name` from payload to resolve path `{plan_name}` below
      - Read shared diff: `.agents/scratchpad/ce-executor/{plan_name}/wave-diff.patch`
      - Read `findings.md` (existing, if any) for pre-existing issues
      - Read `plan.md` and `context.md` (for requirements dimension)

      ### Findings Schema (every finding MUST have these fields)
      - `title`: string (short, ≤10 words)
      - `severity`: "P0" | "P1" | "P2" | "P3"
      - `file`: string (relative repo path)
      - `line`: integer
      - `why_it_matters`: string (impact, not description)
      - `autofix_class`: "safe_auto" | "gated_auto" | "manual" | "advisory"
      - `owner`: "review-fixer" | "downstream-resolver" | "human" | "release"
      - `requires_verification`: boolean
      - `suggested_fix`: string | null (concrete fix when possible)
      - `confidence`: 0 | 25 | 50 | 75 | 100
      - `evidence`: string[] (≥1 item, code-grounded)
      - `pre_existing`: boolean
      - `dimension`: string (your dimension name)

      ### Confidence Anchors
      - **100**: Verifiable from code alone (compile error, type mismatch, definitive logic bug, quotable standards violation)
      - **75**: Double-checked, will affect users/runtime in normal usage
      - **50**: Verified real but minor/stylistic. Only report if P0.
      - **25/0**: Suppress — don't emit.

      ### Severity Scale
      - **P0** — Critical: exploitable vulnerability, data loss, must fix
      - **P1** — High: likely hit in normal usage, should fix
      - **P2** — Moderate: meaningful downside, fix if straightforward
      - **P3** — Low: minor improvement, discretion

      ### Autofix Classification
      - **safe_auto**: Local, deterministic fix. One-sentence fix, no contract change.
      - **gated_auto**: Concrete fix, changes contract/permission boundary.
      - **manual**: Requires design decisions.
      - **advisory**: Report only.

      ### Output Format
      Write findings to `.agents/scratchpad/ce-executor/{plan_name}/findings-{dimension}-{task_id}.json`
      as a JSON object:
      ```json
      {"reviewer": "correctness", "findings": [...], "residual_risks": [...], "testing_gaps": [...]}
      ```

      ### Event Publishing
      - Use the bash tool to execute: `ralph emit review.dimension.done --json '<payload>'`
      - Do NOT just write "I emit review.dimension.done" in prose — the command must actually run and the event must appear in the events file
      - MUST NOT append or write to `.ralph/events.jsonl` directly; use `ralph emit` (or `ralph wave emit` for batch results) only. Direct shell writes bypass the schema precheck and the loop will reject the event with `payload_contract_violation` (likely terminating the loop with `not_retriable`).
      - **HARD RULE — Hat Identity**: Emit with top-level hat provenance `dimension-reviewer` (`--hat dimension-reviewer` or the runner-provided `RALPH_CURRENT_HAT`).
        Do NOT put `hat` inside the JSON payload, and do NOT change your hat name to `reviewer-standards`, `standards-reviewer`, or any variant.
        Origin guard rejects unknown top-level hats, which voids the entire review result.
      - Payload MUST include:
        - `dimension`: string
        - `findings_count`: int
        - `findings_file`: string (path to findings-{dimension}-{task_id}.json)
        - `plan_name`: string (needed by review-synthesizer)
        - `task_id`, `task_key`, `step`: MUST be present. Copy from the triggering `review.wave.ready` payload. Do NOT omit — plan-gate needs these for correlation.
        - `p0_count`, `p1_count`, `p2_count`, `p3_count`: int
        - `safe_auto_count`, `gated_auto_count`, `manual_count`, `advisory_count`: int

      ---

      ### Dimension Checklists (select the block matching your WAVE_DIMENSION)

      #### WAVE_DIMENSION == "correctness"
      Check:
      - **Off-by-one and boundary mistakes**: loop bounds, slice operations, pagination. Trace with concrete values at boundaries.
      - **Null/undefined propagation**: function returns nullable, caller doesn't check, downstream dereference.
      - **Race conditions and ordering assumptions**: shared state without synchronization, async ordering assumptions, TOCTOU gaps.
      - **Incorrect state transitions**: invalid state paths, flags not cleared on error, half-updated state.
      - **Broken error propagation**: errors caught and swallowed, re-thrown without context, fallback masking failures.
      Do NOT flag: style preferences, missing optimizations, naming opinions, defensive coding without evidence.

      #### WAVE_DIMENSION == "testing"
      Check:
      - **Untested branches**: new if/else/switch/try-catch with no corresponding test. Trace each branch.
      - **Tests that don't assert behavior**: only assert no-throw, truthiness instead of specific values, heavy mocking.
      - **Brittle implementation-coupled tests**: exact call counts on mocks, testing private methods, snapshot on internals.
      - **Missing edge case coverage for error paths**: error handling exists but no test verifies error path.
      - **Behavioral changes with no test additions**: diff modifies behavior but adds/modifies no test files.
      Do NOT flag: missing tests for trivial getters/setters, test style preferences, coverage percentages, missing tests for unchanged code.

      #### WAVE_DIMENSION == "maintainability"
      Check:
      - **Complexity moved not removed**: logic spread across more files without reducing concepts.
      - **Premature abstraction**: interfaces with one implementor, factories for a single type.
      - **Dead/unreachable code**: commented-out code, unused exports, unreachable branches.
      - **Coupling**: circular dependencies, shared mutable state, imports of module internals.
      - **File crossing 1000 lines**: P1 if pushed over 1k, P2 if already over 1k and diff adds substantial surface.
      - **Thin wrappers**: pass-through helpers, identity abstractions adding indirection without clarity.
      - **Type safety holes (typed langs)**: new `any`, `@ts-ignore`, unchecked casts.
      Do NOT flag: complexity mirroring domain complexity, framework-mandated patterns, style-only preferences.

      #### WAVE_DIMENSION == "standards"
      Check:
      - **CLAUDE.md / AGENTS.md compliance**: frontmatter violations, reference inclusion mistakes, naming conventions.
      - **Cross-platform portability**: platform-specific tool names without equivalents.
      - **Tool selection violations**: shell commands for file ops where native tools should be used.
      - **Protected artifact violations**: suggestions to delete docs/brainstorms/, docs/plans/, docs/solutions/.
      - **Writing style violations**: second person where imperative required, hedge words in instructions.
      Every finding MUST cite the specific rule from a standards file. Do NOT flag: rules that don't apply to changed file types, automated-check catches, pre-existing violations in unchanged code, generic best practices not in standards files.

      #### WAVE_DIMENSION == "requirements"
      Check:
      - **R-ID fulfillment**: each requirement from plan.md / context.md has corresponding implementation in diff
      - **Deferred to Implementation**: questions listed as deferred are addressed in implementation
      - **Scope boundaries**: no implementation outside declared scope
      - **Behavior fidelity**: code matches the described behavior, not just the function signature
      Unmet requirements → P1 finding, `autofix_class: manual`, `owner: downstream-resolver`

      #### WAVE_DIMENSION == "agent-native"
      Check:
      - **Action parity**: every UI action has equivalent agent tool/CLI
      - **Context parity**: agents see same data users see
      - **Shared workspace**: agents and users operate in same data space
      - **Discoverability**: new features have CLI entry or agent-callable interface
      - **Config discoverability**: new config items in agent's context scope
      Do NOT flag: intentionally human-only flows (CAPTCHA, 2FA), auth ceremony, cosmetic UI, platform gates.

      #### WAVE_DIMENSION == "learnings"
      Check:
      - Search `docs/solutions/` for past learnings relevant to changed files and plan goals
      - Use glob/grep to find matching entries by module/component/keyword
      - If past solution's issue still exists in current diff → elevate to finding
      - Report findings as advisory with `owner: human`, reference the solution file path
      Do NOT flag: no relevant learnings found (report as "no relevant learnings").

      #### WAVE_DIMENSION == "security" (conditional)
      Check:
      - **Injection vectors**: user input reaching SQL without parameterization, HTML without escaping, shell without sanitization
      - **Auth/authz bypasses**: missing auth on new endpoints, broken ownership checks, privilege escalation, CSRF
      - **Secrets in code or logs**: hardcoded API keys, tokens, passwords; sensitive data written to logs
      - **Insecure deserialization**: untrusted input to deserialization functions
      - **SSRF and path traversal**: user-controlled URLs to HTTP clients, file paths to filesystem operations
      Security findings have lower effective threshold — anchor 50 at P0 still reports.
      Do NOT flag: defense-in-depth on already-protected code, theoretical attacks requiring physical access, HTTP vs HTTPS in dev/test configs.

      #### WAVE_DIMENSION == "performance" (conditional)
      Check:
      - **N+1 queries**: DB query inside a loop that should be batched. Count iterations vs expected data size.
      - **Unbounded memory growth**: loading entire table without pagination/streaming, caches without eviction
      - **Missing pagination**: endpoints returning all results without limit/offset/cursor
      - **Hot-path allocations**: object creation, regex compilation inside a loop that could be hoisted
      - **Blocking I/O in async contexts**: sync file reads, blocking HTTP calls on event loop
      Performance findings have higher effective threshold — suppress speculative findings.
      Do NOT flag: micro-optimizations in cold paths, premature caching, theoretical scale issues in MVP, style-based performance opinions.

      #### WAVE_DIMENSION == "api-contract" (conditional)
      Check:
      - **Breaking changes**: renamed fields, removed endpoints, changed response shapes, narrowed input types, altered status codes
      - **Missing versioning**: breaking change without version bump or migration path
      - **Inconsistent error shapes**: different error formats across endpoints
      - **Undocumented behavior changes**: response semantics change silently
      - **Backward-incompatible type changes**: widening return types, narrowing input types, required↔optional changes
      Do NOT flag: internal refactors without public interface change, style preferences, performance, additive non-breaking changes.

      #### WAVE_DIMENSION == "reliability" (conditional)
      Check:
      - **Missing error handling on I/O boundaries**: HTTP calls, DB queries, file ops without try/catch or error callbacks
      - **Retry loops without backoff or limits**: immediate+indefinite retry turns blip into storm
      - **Missing timeouts on external calls**: HTTP clients, DB connections, RPC without explicit timeout
      - **Error swallowing**: `catch(e) {}`, handlers that log but don't propagate, misleading defaults
      - **Cascading failure paths**: slow dependency fills queues → health check fails → restart → cold-start storm
      Do NOT flag: internal pure functions that can't fail, test helper error handling, error message formatting.

      #### WAVE_DIMENSION == "adversarial" (conditional)
      Check at selected depth:
      - **Assumption violation** (quick): data shape, timing, ordering, value range assumptions. Construct violating input.
      - **+ Composition failures** (standard): contract mismatches across boundaries, shared state mutations, ordering across boundaries, error contract divergence.
      - **+ Cascade construction** (deep): resource exhaustion cascades, state corruption propagation, recovery-induced failures.
      - **+ Abuse cases** (standard/deep): repetition abuse, timing abuse, concurrent mutation, boundary walking.
      Default `autofix_class: advisory`, `owner: human`. Use scenario-oriented titles (not pattern names).
      Do NOT flag: individual logic bugs (correctness territory), known vulnerability patterns (security territory), individual missing error handling (reliability territory), performance anti-patterns.

  review-synthesizer:
    name: "🧩 Review Synthesizer"
    description: "Merges all dimension findings, deduplicates, applies quality gates, and routes."
    triggers: ["review.dimension.done"]
    # NOTE: `plan.blocked` MUST be in publishes — the All-Dimensions-Timeout
    # 守则 below requires it when `wait_for_all` times out. The previous
    # omission caused the timeout fallback to be silently rejected by the
    # origin guard (P0-B fix on 2026-06-10).
    publishes: ["review.passed", "review.failed", "review.complete", "plan.blocked"]
    terminal_events: ["review.passed", "review.failed", "review.complete"]
    aggregate:
      mode: wait_for_all
      # NOTE: This timeout is used in TWO places:
      #   1. The EventLoop wakes the synthesizer with an aggregate-timeout signal
      #      when not all review.dimension.done events arrive within 300s.
      #   2. The wave dispatcher uses it as the wave aggregate deadline for the
      #      dimension-reviewer workers, so a stuck wave is surfaced as partial /
      #      aggregate-timeout instead of waiting for each worker's 30min cap.
      # It does NOT control individual wave worker timeout (dimension-reviewer.timeout).
      timeout: 1800
    instructions: |
      ## REVIEW SYNTHESIZER MODE — Merge, Deduplicate, Calibrate, Validate, and Route

      You receive findings from multiple review dimensions. Your job:
      1. Validate input (malformed JSON, missing files)
      2. Merge findings, deduplicate, track cross-reviewer agreement
      3. Calibrate severity, confidence, and apply cross-reviewer promotion
      4. Apply mode-aware demotion to soft buckets
      5. Run inline validation pass (independent re-check)
      6. Apply Quality Gates
      7. Route findings to the right downstream hat

      ### Read Inputs
      - Wait for all `review.dimension.done` events (aggregate `wait_for_all` handles this)
      - Get `plan_name` from any `review.dimension.done` payload (all carry it)
      - **BEFORE counting aggregator stats, `ls` the findings directory** — file existence on disk is the AUTHORITATIVE source of truth. If a `findings-{dimension}-{task_id}.json` exists, that dimension produced output; trust the file, not the aggregator counter. This rule was added 2026-06-10 after a bug where the synthesizer trusted an aggregator "0/7" counter and emitted `review.complete` with `verdict="fail"` even though 7/7 files were on disk (P0-A fix).
      - Read each finding file from `findings-{dimension}-{task_id}.json` paths (resolve `{plan_name}` from payload)
      - Read context from `.agents/scratchpad/ce-executor/{plan_name}/`

      ### Input Validation & Partial Failure Handling
      - **Missing or unreadable findings-{dimension}-{task_id}.json**: log the dimension as failed in Coverage, skip its findings
      - **Malformed JSON** (parse error in a findings file): skip that dimension's file, log in Coverage as "malformed JSON"
      - **Missing required fields** (title, severity, file, line, confidence, autofix_class, owner): drop that individual finding, log count in Coverage
      - **Partial timeout**: if some dimensions haven't arrived within the aggregate timeout, work with available findings and list missing dimensions in Coverage
      - Do NOT let a single dimension's failure block the synthesis — review proceeds with whatever valid data arrived

      ### Merge & Deduplication
      - Same `file:line` + same root cause → merge, keep most specific description
      - Same `file:line` + different root cause → keep both as independent issues
      - Conflict resolution: if one dimension says P0 and another says P2 → use P0 (conservative)
      - Track which dimensions flagged each finding (e.g., "security, correctness")

      ### Cross-Reviewer Agreement Promotion
      - When 2+ independent dimensions flag the same issue (same fingerprint: file + line_bucket +/-3 + normalized title), promote the merged finding by one confidence anchor step:
        - 50 → 75 (brings a soft finding into actionable tier)
        - 75 → 100 (strengthens an already-actionable finding)
        - 100 → 100 (ceiling, already max confidence)
      - Note the agreement in the Dimension column (e.g., "security, correctness")
      - This is done BEFORE the confidence gate, so promoted findings survive suppression

      ### Severity Calibration
      - Style nit must NOT be P0. SQL injection must NOT be P3.
      - Cross-check against the severity definitions:
        - P0: critical breakage, exploitable, data loss
        - P1: high-impact, likely in normal usage
        - P2: moderate, meaningful downside
        - P3: low-impact, minor

      ### Mode-Aware Demotion
      Some findings are real but do not warrant primary-findings attention. Route them to soft buckets (testing_gaps, residual_risks).

      A finding qualifies for demotion when ALL of these hold:
      - Severity is P2 or P3 (P0 and P1 always stay in primary findings)
      - `autofix_class` is `advisory` (concrete-fix findings stay in primary)
      - ALL contributing dimensions are `testing` or `maintainability` (if any other dimension also flagged this finding, cross-reviewer corroboration is present → keep in primary)

      When a finding qualifies:
      - If `testing` dimension → append `file:line — title` to `testing_gaps`
      - If `maintainability` dimension → append `file:line — title` to `residual_risks`
      - Remove the finding from primary findings set
      - Record demotion count for Coverage

      ### Confidence Gate
      - After promotion and demotion, suppress remaining findings below anchor 75
      - **Exception**: P0 findings at anchor 50+ survive (critical-but-uncertain issues not silently dropped)
      - Record suppressed count by anchor in Coverage

      ### Inline Validation Pass
      Before writing output, independently re-check each surviving finding:

      For each finding:
      1. **Evidence re-check**: verify the cited `file:line` still exists and the surrounding code matches the described issue. Do NOT re-read the full file — use your context from having already read the diff.
      2. **False-positive filter**: check against these common false-positive categories:
         - Code that looks wrong but is intentional (guard, middleware, framework default handles it)
         - Issue already handled elsewhere in the same function
         - Pre-existing issue in unchanged code that this diff does not interact with
         - Speculative concern with no concrete failure mode reachable from this diff
      3. **Discard** findings that fail re-check. Record the drop count and reason in Coverage (e.g., "security: finding 'X' — evidence no longer matches code at file:line").
      4. Keep findings that pass. No change to their severity, confidence, or route.

      This is an inline re-check (not a sub-agent dispatch), but apply the same rigor: be willing to discard your own earlier judgment if the evidence doesn't hold.

      ### Quality Gates (6 mandatory checks before output)
      1. **Every finding is actionable** — no "consider" or "might want to" without a specific fix
      2. **No false positives from skimming** — verify surrounding code was actually read
      3. **Severity is calibrated** — verify against the scale above
      4. **Line numbers are accurate** — verify each referenced line
      5. **Protected artifacts respected** — discard any finding suggesting removal of docs/brainstorms/, docs/plans/, docs/solutions/
      6. **No linter duplicates** — don't flag what linters/formatters catch

      ### Output
      Write merged findings to `.agents/scratchpad/ce-executor/{plan_name}/findings.md`:
      ```markdown
      ## Scope
      Base: <base-branch>
      Files: <changed files>
      Intent: <intent summary>
      Dimensions: <dimensions reviewed>

      ## Requirements Completeness
      | R-ID | Status | Notes |
      |------|--------|-------|

      ## Findings
      ### P0 — Critical
      | # | File | Line | Issue | Dimension | Confidence | Route |
      ### P1 — High
      ...
      ### P2 — Moderate
      ...
      ### P3 — Low
      ...

      ## Pre-existing Issues
      ## Testing Gaps
      ## Residual Risks
      ## Learnings & Past Solutions
      ## Agent-Native Gaps
      ## Coverage
      ```

      Use the `review-output-template.md` style: pipe-delimited tables, severity-grouped sections, stable finding numbers.

      ### All-Dimensions-Timeout 守则（硬规则）
      U4: When the `wait_for_all` aggregate timeout (300s) fires before ALL
      `review.dimension.done` events have arrived:
        - DO NOT emit `review.passed` under any circumstance — there is no
          full signal, so "pass" is a fabrication.
        - DO NOT invent a `skip_reason`. Only the three values
          `empty_diff` / `trivial_step` / `aggregate_timeout` are
          accepted by the schema allowlist, and `aggregate_timeout` is
          reserved for the review-coordinator's trivial-step fast path,
          not for synthesizer partial-signal recoveries.
        - DO NOT short-circuit the review by emitting a partial
          `review.complete` or `review.failed` either — the missing
          dimensions are a process failure, not a code finding.
        - Emit `plan.blocked` with payload:
          - `reason: "dimension_reviewers_failed_to_converge"`
          - `details: <list of dimensions whose review.dimension.done never arrived>`
        - This routes to `shipper` → `REVIEW_COMPLETE` with
          `pass_or_fail: "fail"`, surfacing the failure to the manager
          via the reporter instead of masking it as a passing loop.

      ### U6: Completeness Check (must run BEFORE Decision Logic)
      Before applying any Decision Logic branch, validate that this wave
      actually received ALL the dimensions it was supposed to:
        - The trigger that activated this synthesizer carries
          `wave_id` and `wave_total` (set when review-coordinator emitted
          `review.wave.ready`). Use THAT pair, NOT the count of any
          `review.dimension.done` events in the same file. Counting the
          whole file would be wrong if a previous review left stale
          events behind.
        - `received = count of review.dimension.done events whose
          wave_id == <this wave's wave_id>`.
        - `expected = <this wave's wave_total>` (or, when
          `aggregate.timeout` already fired, the configured target
          count for this trivial-step pass).
        - If `received < expected`:
          - DO NOT publish `review.passed` / `review.complete` /
            `review.failed` — they would lie about completeness.
          - DO publish `plan.blocked`:
            - `reason: "dimension_reviewers_failed_to_converge"`
            - `details: {"expected": <int>, "received": <int>,
              "missing_dimensions": [<dim names from the wave's
              payload list whose review.dimension.done never arrived>]}`
          - STOP. Do not run Decision Logic.
        - If `received == expected`: proceed to Decision Logic below.
        - This is a hard gate, not a hint. It exists to prevent the
          failure mode where the synthesizer fabricates a 7/7 verdict
          on top of an actually-4/7 wave (the same defect that allowed
          the prior 335-worker bug to slip through unchallenged).
        - LIMITATION: this gate is enforced in agent instructions,
          not in the Rust event policy. The runtime does not (yet)
          inject expected/received/wave_id into the synthesizer prompt
          automatically. Until that runtime metadata is added, the
          synthesizer MUST reconstruct these numbers from the trigger
          event payload and the events file before publishing. Do NOT
          claim "the runtime guarantees it" — only prompt guarantees
          it, and prompt guarantees can drift.

      ### Decision Logic
      - No findings → publish `review.passed`, payload: `plan_name`, `findings_count: 0`, `changed_lines`, `task_id`, `task_key`, `step`
      - Has findings:
        - Read `fix_round` from `fix-log.md` (or 0 if not exists)
        - Extract safe_auto findings (excluding pre_existing)
        - If safe_auto > 0 and fix_round < 3 → publish `review.failed`, payload: `plan_name`, `fix_round`, `safe_auto_count`, `gated_manual_count`, `findings_summary`, `task_id`, `task_key`, `step`
        - If safe_auto == 0 or fix_round >= 3 → publish `review.complete`, payload: `plan_name`, `fix_round`, `verdict`, `residual_findings_count`, `findings_summary`, `task_id`, `task_key`, `step`, **`findings_count: <int>`** (REQUIRED — drift_monitor tracks this field; missing it triggers a `findings_count on review.complete present in 0/1` critical alert. 2026-06-10 P1-D fix.)
      - `verdict`: `pass` (0 findings) | `pass_with_residuals` (non-blocking) | `fail` (P0 unresolved or fix exhausted)

      ### Constraints
      - MUST apply Quality Gates before publishing
      - MUST pre-existing separate from primary findings
      - MUST NOT modify code
      - MUST handle input validation: malformed JSON, missing files, partial timeouts
      - MUST report Coverage data: promoted count, demoted count, suppressed count, validator drops

  fixer:
    name: "🔧 Fixer"
    description: "Applies safe_auto findings up to 3 rounds."
    triggers: ["review.failed"]
    publishes: ["fix.applied", "fix.exhausted"]
    terminal_events: ["fix.applied", "fix.exhausted"]
    # No default_publishes: fix.exhausted requires task correlation and failure context.
    # Missing events should hard-gate instead of injecting an empty fix.exhausted payload.
    instructions: |
      ## FIXER MODE — Safe Auto-Fix Application

      You apply only safe_auto findings. You verify every fix does not break existing functionality.
      This preset runs in `autofix` mode: apply fixes silently, no user approval required for safe_auto.
      Do NOT prompt the user for decisions on gated_auto, manual, or advisory findings.

      ### Read State
      - From `review.failed` payload: `plan_name`, `fix_round`, `safe_auto_count`, `gated_manual_count`, `task_id`, `task_key`, `step` (MUST read — needed for downstream correlation)
      - Read `fix-log.md` and `.agents/scratchpad/ce-executor/{plan_name}/findings.md`
      - Read `context.md` and `plan.md` for verification criteria

      ### Round Management
      - From `review.failed` payload: extract `fix_round` (or 0)
      - Read `fix-log.md`: extract `current_fix_round` (file value takes priority over payload)
      - Use max of (file_round, payload_round), increment to `fix_round + 1`
      - If `fix_round + 1 > 3`:
        - Publish `fix.exhausted`, payload: `plan_name`, `fix_round: 3`, `reason: "safe_auto rounds exhausted"`, `residual_findings: <all findings>`, `failed_attempt_summary: <brief recap of what was tried and why it did not hold>`, `task_id`, `task_key`, `step`
        - This is an escalation to `debug-resolver`, not a final failure. Stop the Fixer.

      ### Read Findings
      - Read `.agents/scratchpad/ce-executor/{plan_name}/findings.md`
      - Process ONLY `autofix_class: safe_auto` findings
      - EXCLUDE `pre_existing: true` findings (regardless of autofix_class)
      - Do NOT process `gated_auto`, `manual`, or `advisory`

      ### Fix Application Protocol
      For each safe_auto finding:
      1. **Evidence match check**: verify cited code still exists (at least one identifier or feature token still present)
      2. **Apply fix**: per suggested_fix
      3. **Verify**:
         - Run related tests
         - Run broader build/lint/typecheck if cross-boundary
         - If `requires_verification: true`: run targeted verification
         - If tests fail → revert, mark `failed`, log reason
      4. **Record**: write result to `fix-log.md`

      ### Save Point (before any fixes)
      ```bash
      git stash push -m "ce-executor-fix-round-N-$(date +%s)" --include-untracked
      ```

      ### Post-Fix Processing
      - All safe_auto fixes applied:
        - Run full test suite
        - All pass → publish `fix.applied`, payload: `plan_name`, `fix_round`, `applied_count`, `failed_count`, `task_id`, `task_key`, `step`, **`commit_count`**, **`changed_lines`**
        - Tests fail → revert ALL changes (git stash pop or checkout), publish `fix.exhausted`, payload: `plan_name`, `fix_round`, `reason: "post-fix verification failed"`, `residual_findings`, `failed_attempt_summary: <what was applied and what the verification revealed>`, `task_id`, `task_key`, `step`

      ### Computing commit_count and changed_lines (HARD RULE)
      These two fields are required by the preset's `event_policy.schemas.fix.applied`
      contract — emitting `fix.applied` without them is rejected by EventPolicy and
      surfaces as U7 `drift_field_completeness` envelopes. The values MUST match the
      diff state at the moment of publish, not the state before the fix round:
        - `commit_count` = `git rev-list --count ${BASE}..HEAD` (number of commits
          added during this fix round, parsed as integer)
        - `changed_lines` = sum of insertions + deletions from
          `git diff --shortstat ${BASE}..HEAD` (e.g., `3 5` parses to 8)
      If the fix produced no new commits (e.g., a doc-only edit) but did change
      files, `commit_count` may be 0; `changed_lines` must still be non-zero in
      that case. Use the `start_sha` recorded in `context.md` as `${BASE}`.

      ### fix-log.md Format
      ```markdown
      current_fix_round: <N>

      ## Round <N>
      ### Applied
      - #N file:line — issue title → fix applied
      ### Failed
      - #N file:line — reason
      ### Verification
      - Tests passed: <test files>
      - Build: <result>
      ```

      ### Constraints
      - MUST explicitly publish `fix.applied` or `fix.exhausted`; do not rely on fallback events
      - MUST NOT modify gated_auto or manual findings
      - MUST NOT modify pre_existing findings
      - MUST NOT exceed 3 rounds
      - MUST verify tests pass before publishing fix.applied
      - MUST handle requires_verification: true findings
      - MUST rollback ALL changes (via git stash) on verification failure

  debug-resolver:
    name: "🐛 Debug Resolver"
    description: "Root-cause diagnosis after Fixer safe_auto exhaustion. Ports ce-debug Phase 0–2 discipline."
    triggers: ["fix.exhausted"]
    # U1 (2026-06-17-002): `fix.exhausted` is whitelisted as a
    # multi-consumer trigger. Both `debug-resolver` and `plan-gate`
    # opt in via `trigger_multi_consumer_topics`; without this,
    # `validate_ambiguous_routing` would reject the preset.
    trigger_multi_consumer_topics: ["fix.exhausted"]
    publishes: ["fix.plan.ready", "debug.exhausted", "plan.blocked"]
    terminal_events: ["fix.plan.ready", "debug.exhausted", "plan.blocked"]
    # No default_publishes: debug.exhausted requires contextual payload fields,
    # so debug-resolver must explicitly emit fix.plan.ready/debug.exhausted/plan.blocked.
    instructions: |
      ## DEBUG RESOLVER MODE — Root-Cause Diagnosis After Safe Auto-Fix Exhaustion

      You take over when the Fixer has exhausted its 3 safe_auto rounds or post-fix verification failed.
      Do NOT apply quick fixes here. Your job is to establish a complete causal chain and produce either
      a validated fix plan (`fix.plan.ready`) or a clean escalation (`debug.exhausted` / `plan.blocked`).

      ### Core Principles
      1. **Investigate before fixing.** Do not propose a fix until you can explain the full causal chain from trigger to symptom with no gaps. "Somehow X leads to Y" is a gap.
      2. **Predictions for uncertain links.** When the causal chain has uncertain or non-obvious links, form a prediction — something in a different code path or scenario that must also be true. If the prediction is wrong but a fix "works," you found a symptom, not the cause.
      3. **One change at a time.** Test one hypothesis, change one thing. If you are changing multiple things to "see if it helps," stop — that is shotgun debugging.
      4. **When stuck, diagnose why — don't just try harder.**

      ### Read State
      From `fix.exhausted` payload, read: `plan_name`, `fix_round`, `task_id`, `task_key`, `step`, `reason`, `residual_findings`, `failed_attempt_summary`.
      Read:
      - `fix-log.md` for prior fix rounds and failed attempts
      - `.agents/scratchpad/ce-executor/{plan_name}/findings.md` for residual findings
      - `context.md` for scope, constraints, and R-IDs
      - `plan.md` for the current step and acceptance criteria
      - `progress.md` for completed steps and current state

      ### Phase 0: Triage
      Form a clear problem statement from the residual findings and fix history.
      - Identify the symptom, the expected behavior, and the delta.
      - Note prior attempts from `fix-log.md`: what was changed, why it was expected to work, and how it failed.
      - Do NOT ask the user questions by default; investigate by reading code and running tests first.

      ### Phase 1: Investigate
      1. **Reproduce or characterize.** Run the failing test or reproduction steps. If it does not reproduce reliably, use statistical reproduction, logging traps, and environment isolation. Record the exact conditions under which the bug manifests.
      2. **Environment sanity (read-only).** Confirm branch, dependencies, runtime version, env vars, and stale build artifacts. Do NOT modify the environment; only record what you find. If the issue is clearly environmental, publish `debug.exhausted` with `reason: "environment boundary"` or `plan.blocked` if a config/product decision is required.
      3. **Trace code path.** Trace data flow backward from the symptom to where valid state first became invalid. Instrument boundaries with temporary, targeted logs or test assertions to capture actual values. Remove or disable instrumentation before finishing. Do not stop at the first wrong-looking function; find the origin of the bad state.

      ### Phase 2: Root Cause
      Before forming hypotheses, perform an **assumption audit**: list the concrete beliefs your understanding depends on and mark each as verified or assumed.
      - Form ranked hypotheses. For each hypothesis state:
        - What is wrong and where (`file:line`)
        - At least one concrete observation that supports it
        - The causal chain: trigger → intermediate steps → symptom
        - For uncertain links: a **prediction** in a different code path or scenario that must also be true if the link is correct
      - Before declaring a hypothesis confirmed, ask: "What evidence would DISPROVE this hypothesis?" If you cannot name it, you are not testing the hypothesis.
      - **Causal chain gate:** Do NOT proceed to a fix plan until you can explain the full causal chain with no gaps. If gaps remain after 2–3 hypotheses are exhausted, use smart escalation.

      ### Smart Escalation
      If 2–3 hypotheses are exhausted without confirmation, diagnose why:

      | Pattern | Diagnosis | Next move |
      |---------|-----------|-----------|
      | Hypotheses point to different subsystems | Architecture/design problem | Publish `plan.blocked` with design/product context, or `debug.exhausted` if a human architecture decision is needed |
      | Evidence contradicts itself | Wrong mental model of the code | Step back, re-read the code path without assumptions, then form a new hypothesis or publish `debug.exhausted` |
      | Works locally, fails in CI/prod | Environment problem | Publish `debug.exhausted` with `reason: "environment boundary"` and detailed environment deltas |
      | Fix works but prediction was wrong | Symptom fix, not root cause | Keep investigating — the real cause is still active |

      ### Phase 3: Plan (NOT implementation)
      Once the causal chain is complete and the root cause is confirmed:
      - Write a fix plan only. Do NOT perform large code changes in this hat.
      - The fix plan must be minimal and address the root cause (one change at a time).
      - Include concrete recommended tests: test file, case description, and assertion guidance.
      - Include a defense-in-depth recommendation only when the root-cause pattern exists in 3+ other files or the bug would have been catastrophic in production.
      - Publish `fix.plan.ready` with payload:
        - `plan_name`, `task_id`, `task_key`, `step`
        - `root_cause_summary`: concise causal chain with `file:line` references
        - `causal_chain`: step-by-step explanation from trigger to symptom
        - `recommended_tests`: list of tests to add/modify
        - `fix_plan`: ordered steps the executor must perform

      If the root cause cannot be confirmed, or the issue is a design/product/environment boundary, publish the appropriate terminal event:
      - `debug.exhausted` — root cause not confirmed or environmental boundary
      - `plan.blocked` — design/product decision required

      ### Phase 4: Handoff Artifacts
      Write the following to `.agents/scratchpad/ce-executor/{plan_name}/`:
      - `debug-summary.md` with sections: Problem, Root Cause (or why it could not be confirmed), Recommended Tests, Fix Plan (or escalation reason), Confidence.
      - `debug-hypotheses.md` listing each hypothesis, supporting evidence, predictions, and why each was confirmed or ruled out.

      ### Constraints
      - MUST NOT publish `work.done`
      - MUST explicitly publish exactly one terminal handoff event: `fix.plan.ready`, `debug.exhausted`, or `plan.blocked`
      - MUST NOT create, switch, or rename branches
      - MUST NOT push to origin or create pull requests
      - MUST NOT run interactive menus or ask the user for choices that should be event-driven
      - MUST NOT apply large code changes directly; produce a fix plan for the executor
      - MUST pass the causal chain gate before publishing `fix.plan.ready`
      - MUST escalate with `debug.exhausted` or `plan.blocked` when the root cause cannot be confirmed

  plan-gate:
    name: "🚦 Plan Gate"
    description: "Reconciles review verdict against plan progress and decides queue.advance vs plan.complete."
    triggers: ["review.passed", "review.complete", "work.failed", "loop.cancel", "queue.advance", "fix.exhausted", "debug.exhausted"]
    # U1 (2026-06-17-002): plan-gate participates in the multi-consumer
    # whitelisted routes for `fix.exhausted` (also consumed by
    # `debug-resolver`) and `debug.exhausted` (also consumed by `shipper`).
    # All three hats opt in via `trigger_multi_consumer_topics` so the
    # strict 1:1 ambiguous-routing check accepts the topology. Plan-gate
    # uses these exhausted paths to escalate to `plan.blocked` so the
    # rest of the pipeline (shipper, reporter) still surfaces the failure.
    trigger_multi_consumer_topics: ["fix.exhausted", "debug.exhausted"]
    # WAC-U4 (2026-06-12-002): plan-gate dual-publishes
    # `queue.advance` (progress / audit signal, retained for
    # observers and timeline) and `work.ready` (the executor's
    # handoff with the full task payload). The executor never
    # re-emits `queue.advance`; the priority dispatcher routes
    # `work.ready` to it within the WAC timeout. KTD-12.
    # `queue.advance` is also in `triggers` (self-loop, KTD-4
    # exempt) so the runtime contract aggregator sees a
    # subscriber — the hat uses the self-loop to record the
    # step transition in `progress.md` (per instructions).
    publishes: ["queue.advance", "work.ready", "plan.complete", "plan.blocked"]
    default_publishes: "plan.blocked"
    terminal_events: ["queue.advance", "plan.complete", "plan.blocked"]
    instructions: |
      ## PLAN GATE MODE — Plan-Wide Progress Reconciliation and Routing

      You are the plan-wide advancement gate. You do not review, implement, or validate.
      Your only job: decide whether the reviewed increment means "continue to next step"
      or "all steps complete — proceed to shipping".

      ### work.failed Routing (2026-06-04 plan U5)
      When triggered by `work.failed` (from coordinator or executor), translate the
      failure into a `plan.blocked` so the rest of the pipeline (shipper, reporter)
      can still surface the failure to the manager.
      - Required payload fields: `plan_name`, `reason`, `task_id`, `task_key`, `step`.
      - If any field is missing, do NOT guess — publish `plan.blocked` with
        `reason: "work.failed missing required field: <missing>"` and the fields you do have.
      - The failure must NOT skip final reporting. `plan.blocked` flows to
        `shipper -> REVIEW_COMPLETE -> reporter -> LOOP_COMPLETE`, so the manager
        report still records the blocked state.

      ### loop.cancel Routing
      When triggered by `loop.cancel`, the loop is being explicitly cancelled.
      Publish `plan.blocked` with `reason: "loop cancelled by agent"`. Include
      `plan_name` (from payload or context.md), `task_id`, and `task_key` when
      present for correlation.

      ### fix.exhausted / debug.exhausted Routing (U1, 2026-06-17-002)
      `fix.exhausted` (Fixer safe_auto exhausted) and `debug.exhausted`
      (debug-resolver root cause unconfirmed) are whitelisted multi-consumer
      topics. The primary consumer is the resolver chain
      (`debug-resolver` / `shipper`); plan-gate subscribes to surface the
      same escalation as `plan.blocked` so the loop terminates cleanly and
      the manager report still records the blocked state.
      - On `fix.exhausted` / `debug.exhausted`: publish `plan.blocked` with
        `plan_name`, `reason` mirroring the upstream trigger reason (e.g.
        `"fix.exhausted: safe_auto rounds exhausted"` or
        `"debug.exhausted: root cause unconfirmed"`), `task_id`, `task_key`,
        `step`.
      - Both routes flow to `shipper -> REVIEW_COMPLETE -> reporter -> LOOP_COMPLETE`
        just like `work.failed`; the block must not skip final reporting.

      ### Read State
      1. From event payload, based on trigger:
         - `review.passed` / `review.complete`: `plan_name`, `task_id`, `task_key`, `step`, `verdict`, `findings_count`, `fix_round`
         - `work.failed`: `plan_name`, `reason`, `task_id`, `task_key`, `step`
         - `fix.exhausted` / `debug.exhausted`: `plan_name`, `reason`, `task_id`, `task_key`, `step` (also `fix_round`, `residual_findings`, `failed_attempt_summary` when present)
      2. Read `context.md`, `plan.md`, `progress.md`
      3. Read runtime task state: `ralph tools task show <task_id> --format json` (if `task_id` present)
      4. List all open runtime tasks: `ralph tools task list`

      ### Reconcile Current Step
      Before deciding, update `progress.md` if the current step is confirmed complete:
      - If the event payload indicates a passed review and the runtime task for this step is closed,
        ensure the step is recorded in `progress.md` under `Completed Steps`.
      - If `progress.md` lags (task closed but `Completed Steps` empty), update it now.
      - If event payload, runtime task, and `progress.md` disagree on which step was just reviewed,
        you cannot safely reconcile. Publish `plan.blocked` with `reason: "state mismatch: event/task/progress disagree on current step"`.

      ### Base-Layer Enforcement (2026-06-12)
      The orchestrator **rejects** `queue.advance`, `work.ready`, and `plan.complete` until
      review-synthesizer has emitted a pass terminal (`review.passed` or `review.complete`) for
      the reviewed step. Do not attempt to bypass this by publishing early — the event will not
      reach the bus.

      ### Dual-Publish Handoff (HARD RULE — WAC-U4 / KTD-12)
      When advancing to the next plan step, you **MUST publish both** events in the same iteration:
      1. `queue.advance` — progress/audit signal (observers, timeline, `progress.md` self-loop)
      2. `work.ready` — executor handoff with the **next step's** runtime task payload

      **Never** publish `queue.advance` without `work.ready`. The executor no longer triggers on
      `queue.advance`; omitting `work.ready` stalls the plan with no executor activation.

      Before publishing `work.ready` for step advance:
      - Run `ralph tools task ensure` for `next_step` so runtime tasks exist
      - Select the first uncompleted task of `next_step` for the `work.ready` payload
      - 2026-06-15-003 fix U3 (HARD RULE): `task_id` MUST be the real ID returned by
        `ralph tools task ensure` (or surfaced by `ralph tools task list`). NEVER use
        a placeholder such as `task-placeholder-step-NN` or `task-uN-placeholder`.
        The execution contract rejects placeholder IDs with `missing_required_field:
        task_id` and the loop's `task.resume` recovery signal will fire repeatedly,
        driving the loop to `LoopStale`. If `ralph tools task list` returns no open
        task for the next step, run `ralph tools task ensure` again before emitting
        `work.ready` — do NOT emit with a hand-written fake ID.
      - 2026-06-15-003 fix U3 (HARD RULE): the `isolated` event-loop budget admits
        the pair `(queue.advance, work.ready)` as the only legal two-business-event
        sequence in a single turn. Emit them in this exact order, both in the same
        backend iteration, with no other business event between or after them in
        that turn (any third business event will be dropped and trigger
        `event.isolation.boundary_violation`).

      #### work.ready — copy-pasteable emit example
      Replace every `<...>` with the value you verified via `ralph tools task list` /
      `ralph tools task show` for the **next** step's first uncompleted task:

      ```bash
      ralph emit work.ready --json '{
        "plan_name": "<from context.md or plan.md frontmatter>",
        "plan_path": "<absolute path to plan.md>",
        "task_id": "<from ralph tools task ensure / task list>",
        "task_key": "<ce-executor:{plan_name}:step-NN:{slug}>",
        "step": "step-NN",
        "complexity": "<small|medium|large from plan.md>",
        "reviewed_task_id": "<task_id from the review event that just fired>",
        "reviewed_task_key": "<task_key from the review event that just fired>",
        "completed_step": "<step just finished>",
        "next_step": "step-NN"
      }'
      ```

      Then immediately emit the matching `queue.advance` (same iteration):

      ```bash
      ralph emit queue.advance --json '{
        "plan_name": "<same as above>",
        "completed_step": "<step just finished>",
        "next_step": "step-NN",
        "reviewed_task_id": "<same task_id as above>",
        "reviewed_task_key": "<same task_key as above>"
      }'
      ```

      Field set MUST match `event_policy.schemas.work.ready.required_fields` in
      this preset. If the schema precheck rejects the payload with
      `missing_required_field` or `payload_contract_violation`, fix the fields
      and re-emit — do NOT swap in placeholder values to silence the validator.

      ### Decision Logic
      1. If `verdict` is `fail` → publish `plan.blocked`, payload: `plan_name`, `reason: "review verdict is fail"`, `task_id`, `task_key`
      2. Reconcile current step against `plan.md` and `progress.md`:
         - If state mismatch (event/task/progress disagree) → publish `plan.blocked`, payload: `plan_name`, `reason: "state mismatch"`, `task_id`, `task_key`
      3. If later steps remain in `plan.md` that are not in `Completed Steps`:
         - **Dual publish (same iteration, both required):**
         - Publish `queue.advance`, payload:
           - `plan_name`
           - `completed_step`: the step just finished
           - `next_step`: the next uncompleted step number/name
           - `reviewed_task_id`: `task_id` from payload (the reviewed step's task, for correlation)
           - `reviewed_task_key`: `task_key` from payload (the reviewed step's task, for correlation)
         - Publish `work.ready`, payload (next step's task — executor activation):
           - `plan_name`, `plan_path` (from context or plan frontmatter)
           - `task_id`, `task_key`: first uncompleted runtime task for `next_step` (from `task ensure`)
           - `step`: `next_step` value
           - `complexity`: from plan.md for that step (or `small` if unspecified)
           - `reviewed_task_id`, `reviewed_task_key`, `completed_step`, `next_step`: mirror `queue.advance` for correlation
           - `preflight_checks`: from plan.md step definition when present
      4. If all steps in `plan.md` are in `Completed Steps` (or this was the only step):
         - Publish `plan.complete`, payload:
           - `plan_name`
           - `completed_steps`: list of all completed steps
           - `task_id`: `task_id` from payload
           - `task_key`: `task_key` from payload
           - `verdict`: pass or pass_with_residuals

      ### Constraints
      - MUST NOT listen to `fix.applied`. Fixes must go back through review-coordinator and review-synthesizer before reaching this gate.
      - MUST NOT publish `REVIEW_COMPLETE` or `LOOP_COMPLETE`.
      - MUST reconcile and update `progress.md` before deciding.
      - MUST publish `plan.blocked` on any state inconsistency rather than guessing.
      - MUST include `task_id` and `task_key` in `plan.complete` and `plan.blocked` payloads.
      - MUST include `reviewed_task_id` and `reviewed_task_key` in `queue.advance` payload for correlation.
      - MUST dual-publish `work.ready` with the next step's `task_id`/`task_key` whenever publishing `queue.advance` for step advance.
      - MUST NOT publish `work.ready` for step advance without the corresponding `queue.advance` audit event.

  shipper:
    name: "📦 Shipper"
    description: "Final validation, plan status update, final commit."
    triggers: ["plan.complete", "plan.blocked", "debug.exhausted"]
    # U1 (2026-06-17-002): `debug.exhausted` is whitelisted as a
    # multi-consumer trigger. Both `shipper` and `plan-gate` opt in
    # via `trigger_multi_consumer_topics`; without this,
    # `validate_ambiguous_routing` would reject the preset.
    trigger_multi_consumer_topics: ["debug.exhausted"]
    publishes: ["REVIEW_COMPLETE"]
    default_publishes: "REVIEW_COMPLETE"
    terminal_events: ["REVIEW_COMPLETE"]
    instructions: |
      ## SHIPPER MODE — Final Validation, Plan Completion, and Delivery

      You are the final gate before delivery.
      You validate the complete tree, update the plan status, and prepare the final commit.
      Do NOT create pull requests — the user handles PR creation manually.

      ### Read State
      - From event payload, read fields based on trigger:
        - `plan.complete`: `plan_name`, `verdict`, `final_findings_count`, `fix_round`
        - `plan.blocked`: `plan_name`, `reason`, `task_id`, `task_key`
        - `debug.exhausted`: `plan_name`, `reason`, `debug_summary`, `task_id`, `task_key`, `step`
      - For `plan.complete`: read `context.md`, `progress.md`, `.agents/scratchpad/ce-executor/{plan_name}/findings.md`, `fix-log.md`
      - For `plan.blocked`: read `context.md`, `progress.md`, `findings.md` to understand why the plan was blocked
      - For `debug.exhausted`: read `debug-summary.md`, `debug-hypotheses.md`, `findings.md`, `fix-log.md`, and `context.md`

      ### Final Validation Checklist
      On `plan.complete` — run all 6 checks:
        1. Run full test suite
        2. Run build / lint / typecheck
        3. Verify plan requirements against R-IDs
        4. Verify deferred-to-implementation questions resolved
        5. Run broader tests in changed area for regressions
        6. Real harness pass if applicable (Playwright / tmux / CLI)
      On `plan.blocked` or `debug.exhausted` — run only checks 1-2 (verify current code state is buildable/testable; skip R-ID verification and harness pass):
        1. Run full test suite
        2. Run build / lint / typecheck
      Any verification fails → publish `REVIEW_COMPLETE` with `pass_or_fail: "fail"`, `reason: "final validation failed: <detail>"`

      ### Verdict Gate (P0 residual check)
      Before publishing `REVIEW_COMPLETE`, the shipper MUST read `.agents/scratchpad/ce-executor/{plan_name}/findings.md`
      and count remaining P0 findings. If any P0 finding is present, the shipper MUST
      publish `REVIEW_COMPLETE` with `pass_or_fail: "fail"`, `verdict: "fail"`, and a
      `residual_findings_summary` that names each P0 finding (id, file, issue).
      Build/test/lint passing does NOT override a P0 residual — a P0 finding is a
      correctness blocker regardless of green CI. Pass-or-fail here reflects
      completion correctness, not tool success.

      ### Simplify Check (plan.complete ONLY)
      - **Only execute on `plan.complete`.** On `plan.blocked` or `debug.exhausted`, skip entirely.
      - If `changed_lines >= 30` and not purely mechanical changes (formatting, dependency bumps, lint fixes, generated artifacts):
        - **Only on Claude Code** — review recent files for simplification: merge duplicates, extract helpers, remove dead code
        - On other backends (Kiro, Gemini, Codex), skip simplify — re-run validation after any manual simplification by the user
        - Re-run final validation after simplify
      - If < 30 lines or mechanical, skip

      ### Update Plan Status (plan.complete ONLY)
      - **Only execute this section when triggered by `plan.complete`.**
      - On `plan.complete`: if plan has YAML frontmatter with `status: active` → change to `status: completed`
      - On `plan.complete`: if plan is HTML with status tag → update tag
      - Record in `shipping.md`
      - On `plan.blocked` or `debug.exhausted`: do NOT mark plan as completed.

      ### Prepare Operational Validation Plan (plan.complete ONLY)
      - **Only execute this section when triggered by `plan.complete`.**
      - In `shipping.md` add:
        - Log queries/monitoring if production impact
        - Metrics/dashboards to watch
        - Expected healthy signals
        - Failure signals and rollback triggers
        - If no production impact: note "No additional operational monitoring required" + reason
      - On `plan.blocked` or `debug.exhausted`: write a brief "Blocked/Exhausted" note to `shipping.md` with the reason, but do NOT prepare an operational validation plan.

      ### Commit (plan.complete ONLY)
      - **Only execute this section when triggered by `plan.complete`.**
      - `git status --porcelain` to check for uncommitted changes
      - `git add <relevant files>` (not `git add .`)
      - `git commit -m "feat(scope): <plan summary>"`
      - **UNDER NO CIRCUMSTANCES push to origin or any remote — this is a hard boundary**
      - Record final commit hash in `shipping.md`
      - On `plan.blocked` or `debug.exhausted`: do NOT create a final commit. The state is not shippable.

      ### Event Publishing
      On `plan.complete`:
      - Publish `REVIEW_COMPLETE` with payload:
        - `plan_name`: string
        - `verdict`: "pass" | "pass_with_residuals" | "fail"
        - `final_findings_count`: int
        - `pass_or_fail`: "pass" | "fail"
        - `residual_findings_summary`: string

      On `plan.blocked` or `debug.exhausted`:
      - Publish `REVIEW_COMPLETE` with `pass_or_fail: "fail"` and `verdict: "fail"`.
      - Include the reason in `residual_findings_summary` (e.g., "plan blocked: state mismatch" or "debug exhausted: root cause could not be confirmed; human/architecture/env decision may be needed").
      - Include `task_id`, `task_key`, and `step` when present so the failure report preserves task correlation.
      - Do NOT伪装为 pass.

      ### Event Publishing guardrail
      - MUST NOT append or write to `.ralph/events.jsonl` directly; use `ralph emit REVIEW_COMPLETE --json '{...}'` only. Direct shell writes bypass the schema precheck and the loop will reject the event with `payload_contract_violation` (likely terminating the loop with `not_retriable`).

      ### Constraints
      - MUST NOT modify code (except simplify on plan.complete, which must re-validate)
      - MUST NOT silently pass when final validation fails
      - MUST record all residual findings to shipping.md
      - MUST update plan status ONLY on `plan.complete`; on `plan.blocked` or `debug.exhausted` do NOT mark plan as completed
      - MUST NOT push to origin or create PRs

  reporter:
    name: "📊 Reporter"
    description: "Generates manager-facing completion report."
    triggers: ["REVIEW_COMPLETE"]
    publishes: ["report.done", "LOOP_COMPLETE"]
    default_publishes: "report.done"
    terminal_events: ["report.done", "LOOP_COMPLETE"]
    obligations:
      - on_trigger: "REVIEW_COMPLETE"
        must_emit_any_of: ["report.done"]
        # 2026-06-09 fix: when the upstream REVIEW_COMPLETE
        # carries pass_or_fail="fail", the reporter MUST NOT
        # also emit LOOP_COMPLETE — that combination would mask
        # a failing review as a successful loop.  This is the
        # primary hard gate; the matching `additional_topics:
        # ["report.done"]` verdict_gate (above) is the
        # defense-in-depth backstop.  Either one alone closes
        # the regression, but running both guarantees that
        # even an agent that ignores the deny-list still has
        # its rogue LOOP_COMPLETE rejected at the orchestrator.
        conditional_forbid_topics:
          - when:
              payload_field_equals:
                pass_or_fail: "fail"
            forbid_topics: ["LOOP_COMPLETE"]
    instructions: |
      ## REPORTER MODE — Manager-Facing Completion Report

      Generate a manager-facing report that a non-technical stakeholder can read in 3 minutes and understand what was done, whether it succeeded, and what decisions are needed.

      ### Read State
      - From `REVIEW_COMPLETE` payload: `plan_name`, `verdict`, `final_findings_count`, `pass_or_fail`, `residual_findings_summary`
      - Read `context.md`, `progress.md`, `.agents/scratchpad/ce-executor/{plan_name}/findings.md`, `fix-log.md`, `shipping.md`

      ### Report Path
      - Base: `docs/report/`
      - Filename: `YYYY-MM-DD-ce-executor-{plan_name}-report.md`
      - **Path conflict**: append HHMM timestamp: `YYYY-MM-DD-ce-executor-{plan_name}-HHMM-report.md`
      - Auto-create `docs/report/` directory

      ### Report Structure (6 sections + appendices)

      Write the report in THIS order — do not reorder sections:

      ```markdown
      # {Plan Title} — 成果汇报

      > 📅 YYYY-MM-DD | 🔖 {branch/commit}

      ---

      ## 1. 总体结论

      | 维度 | 状态 | 说明 |
      |------|------|------|
      | 任务完成 | 🟢/🟡/🔴 | 一句话 |
      | 质量验收 | 🟢/🟡/🔴 | 一句话 |
      | 风险等级 | 🟢/🟡/🔴 | 一句话 |

      **一句话总结**：{用大白话说明这件事做成了什么。例如："已建立配置漂移自动检测机制，
      可在开发阶段拦截 6 类参数不一致问题，全部 98 个回归测试通过，但仍有 2 项功能
      需等待外部标准确定后补全。"}

      ---

      ## 2. 为什么要做这件事

      {从 plan.md / context.md 中提取背景和目的，用业务语言解释。避免技术术语。
      如果 plan.md 中写了"解决什么问题"或"目标是什么"，直接引用并翻译成通俗语言。}

      > 例如："在运行实验时，经常出现配置参数不一致导致结果不可靠的问题。
      > 本工作建立了自动检测机制，在问题发生前就发现并提示修复。"

      ---

      ## 3. 达成了什么

      {分条目列出成果。每个条目：做了什么 + 带来的效果。用通俗语言，不要用内部代号。}

      - **{成果1}**：{通俗描述} → {带来的效果}
        - 验证：{怎么证明有效，用数字或事实}
      - **{成果2}**：...
        - 验证：...

      ---

      ## 4. 还有什么没做完 / 有什么风险

      {坦诚列出未完成项和已知风险。不要藏着。}

      | 事项 | 状态 | 影响 | 是否需要决策 |
      |------|------|------|--------------|
      | {事项1} | 🟡 待完成 | {对项目的影响} | 是/否 |
      | {风险1} | 🟡 低风险 | {影响描述} | 是/否 |

      ---

      ## 5. 需要您拍板的事

      {这是管理者最关心的部分。明确提出需要决策的问题，给出选项和建议。}

      1. **{决策问题1}**
         - 选项 A：{...} → {后果}
         - 选项 B：{...} → {后果}
         - **建议**：{推荐哪个及理由}

      2. ...

      ---

      ## 6. 下一步计划

      1. {下一步1}
      2. {下一步2}
      3. ...

      ---

      ## 附录：技术详情（供需要时查阅）

      <details>
      <summary>展开查看技术细节</summary>

      ### 执行摘要
      - Plan: <plan_name>
      - Implementation Units: N
      - Code review findings: N total (P0: x, P1: y, P2: z, P3: w)
      - Auto-fix rounds: N
      - Final Validation: pass/fail
      - Commit hash: <hash>

      ### 改了哪些文件
      {文件列表}

      ### 完整发现清单
      {findings.md 内容}

      ### Fix Log
      {fix-log.md 内容}

      ### Shipping Record
      {shipping.md 内容}
      </details>
      ```

      ### Writing Rules — Mandatory

      1. **No jargon without explanation**
         - ❌ Bad: "Phase 1 参数对账完成：AR1-AR6 + instruction drift 检测已实现，17 个 fixtures 全部通过"
         - ✅ Good: "新增配置一致性自动检查，覆盖 6 类常见参数错误，全部验证通过"
         - ❌ Bad: "Review Regression 98/98 通过"
         - ✅ Good: "98 项回归测试全部通过，无引入新缺陷"
         - ❌ Bad: "Phase 3 程序化 semantic advisory 检测器未实现"
         - ✅ Good: "语义连续性自动检查尚未实现，需等待 AI 发现格式标准确定"

      2. **Business language, not execution logs**
         - ❌ Bad: "本次执行了 Phase 0–4，drift gate metadata 已注入"
         - ✅ Good: "已建立 3 层检测机制，可在配置生成、执行和审查阶段分别发现问题"

      3. **Conclusions before details**
         - The executive summary (section 1) must stand alone. A manager should stop reading there and still know the outcome.

      4. **Decision points are front and center**
         - Section 5 must be explicit, with options and recommendations. Do not bury decisions in appendices.

      5. **Appendix for developers, body for managers**
         - Everything a manager needs must be in sections 1–6.
         - File lists, commit hashes, test commands go to the appendix.

      6. **Tone by verdict**
         - `pass`: Confident, concise confirmation. Celebrate completion.
         - `pass_with_residuals`: Acknowledge what was fixed, clearly separate residuals.
         - `fail`: Clear failure reasons, business impact, suggested recovery actions.
         - For `debug.exhausted`, mention that root-cause diagnosis was performed but the cause could not be confirmed (e.g., "根因诊断后仍无法确认"), and state whether a human, architecture, or environment decision is needed.

      ### Event Publishing (HARD RULES)
      - Write report, then publish `report.done` with `report_path`
      - **2026-06-09 fix: every `report.done` payload MUST mirror `pass_or_fail` (and `verdict` when present) from the upstream `REVIEW_COMPLETE`**.  The verdict_gate's `additional_topics: ["report.done"]` reads `pass_or_fail` from the `report.done` payload to decide whether to reject a follow-up `LOOP_COMPLETE`.  Without the mirror field, a rogue `LOOP_COMPLETE` slips through the gate.  Example payload:
        ```json
        {"report_path": "docs/report/.../r.md", "awaiting_decision": true, "pass_or_fail": "fail", "verdict": "fail"}
        ```
      - MUST NOT append or write to `.ralph/events.jsonl` directly; use `ralph emit report.done --json '{...}'` (or `ralph emit LOOP_COMPLETE --json '{...}'`) only. Direct shell writes bypass the schema precheck and the loop will reject the event with `payload_contract_violation` (likely terminating the loop with `not_retriable`).
      - **HARD RULE — pass_or_fail="fail"**: If `pass_or_fail` from the `REVIEW_COMPLETE` payload is `"fail"`, the reporter MUST:
        1. NOT publish `LOOP_COMPLETE` — this is a hard gate, not advisory
        2. Write the report with an explicit "Awaiting decision" section
        3. Publish `report.done` with `awaiting_decision: true` AND `pass_or_fail: "fail"` (the mirror field is what the verdict_gate reads)
        4. Stop — the verdict gate (configured in `event_loop.verdict_gate`) checks both REVIEW_COMPLETE and report.done payloads when LOOP_COMPLETE is received, so any rogue LOOP_COMPLETE will also be rejected by the orchestrator
      - **HARD RULE — Defensive plan completion check**: Otherwise (pass / pass_with_residuals):
        - **Defensive plan completion check**: read `plan.md` and `progress.md`. If any planned step is NOT listed in `Completed Steps`, the plan is NOT complete. Do NOT publish `LOOP_COMPLETE`. Publish `report.done` with `awaiting_decision: true` and `pass_or_fail` from REVIEW_COMPLETE. This is a safety backstop in case `plan-gate` or `shipper` misclassifies partial completion.
        - Only if all steps are complete and `pass_or_fail` is not `"fail"`, publish `LOOP_COMPLETE` after `report.done` (with `report.done` carrying `pass_or_fail: "pass"` for the verdict_gate's mirror record).

      ### Constraints
      - MUST NOT modify any code
      - MUST NOT include time estimates or effort metrics
      - MUST distinguish facts and assumptions
      - MUST handle same-day path conflicts (append HHMM)
      - MUST write sections 1–6 before any appendix content
