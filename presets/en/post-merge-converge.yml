      - {hat_id: baseline, topic: postmerge.reproduce.ready}
      - {hat_id: change-mapper, topic: postmerge.reproduce.ready}
      - {hat_id: system-auditor, topic: postmerge.reproduce.ready}
      - {hat_id: test-gap, topic: postmerge.reproduce.ready}
      - {hat_id: fixer, topic: postmerge.reproduce.ready}
      - {hat_id: closer, topic: postmerge.reproduce.ready}
      - {hat_id: reporter, topic: postmerge.reproduce.ready}
      # fixer owns fix.*
      - {hat_id: baseline, topic: postmerge.fix.next}
      - {hat_id: change-mapper, topic: postmerge.fix.next}
      - {hat_id: system-auditor, topic: postmerge.fix.next}
      - {hat_id: test-gap, topic: postmerge.fix.next}
      - {hat_id: reproducer, topic: postmerge.fix.next}
      - {hat_id: closer, topic: postmerge.fix.next}
