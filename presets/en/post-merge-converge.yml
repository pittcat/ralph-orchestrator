# Post-Merge Converge Preset
#
# After one or more development plans have landed in the current final
# branch / final code tree, whether via merge commits or sequential commits
# on the same branch, treat the tree as one system: baseline → change map →
# six-dimension
# system audit → test-gap plan → per-Finding reproduce → per-Finding
# root-cause/fix/regression → clean-env + final independent review.
#
# Source process: 15 serial hats from「多开发计划全部合入后的通用系统收敛流程」
# collapsed into 8 hats without dropping steps:
#   baseline (01)
#   change-mapper (02)
#   system-auditor (03–08)
#   test-gap (09)
#   reproducer (10, self-loop)
#   fixer (11–13, self-loop)
#   closer (14–15 technical gates)
#   reporter (operator-facing REPORT.md + completion)
#
# Prompt contract (operator provides via `.ralph/post-merge.prompt.md`,
# referenced by `ralph.post-merge.yml`):
#   - Optional: final branch name
#   - Optional: development plan paths/IDs (if omitted, agent discovers
#     via git log / commit chronology / branch history matching docs/plans/)
#   - Optional: verification command overrides
#
# Does NOT re-execute individual plans and does NOT re-merge branches.
# A single branch may already contain multiple completed plans; treat them
# as input, not as separate merge work.
#
# Usage:
#   ralph run -c ralph.post-merge.yml -H builtin:post-merge-converge
#
# Artifacts (under gitignored .ralph/, like merge-batch):
#   .ralph/post-merge/01-baseline.md … 15-final-review.md
#   .ralph/post-merge/findings/PMI-*.md
#   .ralph/post-merge/REPORT.md  (operator-facing; required before complete)
#
# Artifact lifecycle:
#   owner: this loop's hats (writer of each file); operator is the final reader
#   retention: keep until the operator archives or deletes; agents MUST NOT
#     wipe `.ralph/post-merge/` as cleanup
#   cleanup: operator-owned (manual archive/delete); no automatic purge

topic_format_whitelist:
  - postmerge.complete

# No `mechanism.flow`: flat hat-only linear chain with reproducer and
# fixer self-loops. Routing comes from hat triggers/publishes.

tasks:
  enabled: false

event_loop:
  execution_mode: isolated
  prompt: |
    Post-merge system convergence on the current final code tree after one
    or more development plans have landed.

    Read the prompt file for:
    - Optional final branch name (default: current branch)
    - Optional development plan list (paths or IDs). If omitted, discover
      plans via git history, commit chronology, and branch subjects matching
      docs/plans/ (and repo plan conventions). Same-branch sequential plans
      are in scope.
    - Optional verification command overrides

    Do NOT re-run individual development plans. Do NOT re-merge branches.
    Analyse the current final tree as one system.
  completion_promise: "postmerge.complete"
  required_events:
    - "postmerge.fix.ready"
  max_iterations: 80
  max_runtime_seconds: 28800
  starting_event: "postmerge.start"
  # Payload schemas SSOT: `presets/schemas/post-merge-converge.yml`
  # (build.rs deep-merges into event_policy.schemas).
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    require_emit_provenance: true
    terminal_topics:
      - "postmerge.complete"
    business_topics:
      - "postmerge.baseline.ready"
      - "postmerge.changemap.ready"
      - "postmerge.audit.ready"
      - "postmerge.testplan.ready"
      - "postmerge.reproduce.next"
      - "postmerge.reproduce.ready"
      - "postmerge.fix.next"
      - "postmerge.fix.ready"
      - "postmerge.reviewed"
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    topic_deny_rules:
      # baseline owns baseline.ready
      - {hat_id: change-mapper, topic: postmerge.baseline.ready}
      - {hat_id: system-auditor, topic: postmerge.baseline.ready}
      - {hat_id: test-gap, topic: postmerge.baseline.ready}
      - {hat_id: reproducer, topic: postmerge.baseline.ready}
      - {hat_id: fixer, topic: postmerge.baseline.ready}
      - {hat_id: closer, topic: postmerge.baseline.ready}
      - {hat_id: reporter, topic: postmerge.baseline.ready}
      # change-mapper owns changemap.ready
      - {hat_id: baseline, topic: postmerge.changemap.ready}
      - {hat_id: system-auditor, topic: postmerge.changemap.ready}
      - {hat_id: test-gap, topic: postmerge.changemap.ready}
      - {hat_id: reproducer, topic: postmerge.changemap.ready}
      - {hat_id: fixer, topic: postmerge.changemap.ready}
      - {hat_id: closer, topic: postmerge.changemap.ready}
      - {hat_id: reporter, topic: postmerge.changemap.ready}
      # system-auditor owns audit.ready
      - {hat_id: baseline, topic: postmerge.audit.ready}
      - {hat_id: change-mapper, topic: postmerge.audit.ready}
      - {hat_id: test-gap, topic: postmerge.audit.ready}
      - {hat_id: reproducer, topic: postmerge.audit.ready}
      - {hat_id: fixer, topic: postmerge.audit.ready}
      - {hat_id: closer, topic: postmerge.audit.ready}
      - {hat_id: reporter, topic: postmerge.audit.ready}
      # test-gap owns testplan.ready
      - {hat_id: baseline, topic: postmerge.testplan.ready}
      - {hat_id: change-mapper, topic: postmerge.testplan.ready}
      - {hat_id: system-auditor, topic: postmerge.testplan.ready}
      - {hat_id: reproducer, topic: postmerge.testplan.ready}
      - {hat_id: fixer, topic: postmerge.testplan.ready}
      - {hat_id: closer, topic: postmerge.testplan.ready}
      - {hat_id: reporter, topic: postmerge.testplan.ready}
      # reproducer owns reproduce.*
      - {hat_id: baseline, topic: postmerge.reproduce.next}
      - {hat_id: change-mapper, topic: postmerge.reproduce.next}
      - {hat_id: system-auditor, topic: postmerge.reproduce.next}
      - {hat_id: test-gap, topic: postmerge.reproduce.next}
      - {hat_id: fixer, topic: postmerge.reproduce.next}
      - {hat_id: closer, topic: postmerge.reproduce.next}
