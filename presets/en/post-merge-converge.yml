      - {hat_id: baseline, topic: postmerge.fix.ready}
      - {hat_id: change-mapper, topic: postmerge.fix.ready}
      - {hat_id: system-auditor, topic: postmerge.fix.ready}
      - {hat_id: test-gap, topic: postmerge.fix.ready}
      - {hat_id: reproducer, topic: postmerge.fix.ready}
      - {hat_id: closer, topic: postmerge.fix.ready}
      - {hat_id: reporter, topic: postmerge.fix.ready}
      # closer owns reviewed
      - {hat_id: baseline, topic: postmerge.reviewed}
      - {hat_id: change-mapper, topic: postmerge.reviewed}
      - {hat_id: system-auditor, topic: postmerge.reviewed}
      - {hat_id: test-gap, topic: postmerge.reviewed}
      - {hat_id: reproducer, topic: postmerge.reviewed}
      - {hat_id: fixer, topic: postmerge.reviewed}
      - {hat_id: reporter, topic: postmerge.reviewed}
      # reporter owns completion
      - {hat_id: baseline, topic: postmerge.complete}
      - {hat_id: change-mapper, topic: postmerge.complete}
      - {hat_id: system-auditor, topic: postmerge.complete}
