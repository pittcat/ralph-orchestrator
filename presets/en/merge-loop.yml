# Merge Loop Preset
#
# Merges completed parallel loop from worktree back to main branch.
# Designed to run automatically after worktree loops complete, resolving
# conflicts via AI and verifying with tests.
#
# This preset reads the RALPH_MERGE_LOOP_ID environment variable to
# identify which loop to merge. If not set, reads from the prompt.
#
# Usage (automatic, via auto-merge):
#   After a worktree loop completes, Ralph spawns:
#   RALPH_MERGE_LOOP_ID=a3f2 ralph run --preset builtin:merge-loop
#
# Usage (manual):
#   ralph run --preset builtin:merge-loop -p "Merge loop ralph-20250124-a3f2"

topic_format_whitelist:
  - MERGE_COMPLETE

# No `mechanism.flow` block: this preset is a flat hat-only linear chain.
# Routing + scope enforcement come from hat triggers/publishes, isolated mode,
# and the legacy `MERGE_COMPLETE` topic-format whitelist. FlowStepScope is
# skipped at runtime when a preset does not opt into `mechanism.flow`. Loop
# closure is via `completion_promise: merge.handled` (text-path promise
# detection + isolated-mode event-path handoff), independent of mechanism.

tasks:
  enabled: false

event_loop:
  execution_mode: isolated  # U6: 5 hats > 3-hat coordinator limit; per R1/R11 this preset MUST be isolated.
  prompt: |
    Merge the completed Ralph loop back to the main branch.

    ## Context
    - Check RALPH_MERGE_LOOP_ID environment variable for loop ID
    - Or extract loop ID from this prompt if provided
    - Loop branch format: ralph/{loop_id}
    - Worktree location: .worktrees/{loop_id}

    ## Your Task
    Safely merge the loop's changes into the main branch, ensuring all tests pass.
  completion_promise: "merge.handled"
  max_iterations: 15
  max_runtime_seconds: 1800
  starting_event: "merge.start"
  # 2026-07-04-002 U10: payload schemas come from the SSOT file
  # `presets/schemas/merge-loop.yml`; build.rs deep-merges them
  # into `event_policy.schemas` at compile time (plan
  # 2026-06-16-002 Unit 1). topic_deny_rules below pin hat
  # ownership for each merge topic — mirrors ce-executor-serial
  # rule structure so a future `verify` payload check rejects
  # any hat that tries to publish a topic it does not own.
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    require_emit_provenance: true
    terminal_topics:
      - "merge.handled"
    business_topics:
      - "merge.done"
      - "conflict.detected"
      - "merge.failed"
      - "conflict.resolved"
      - "conflict.unresolvable"
      - "tests.passed"
      - "tests.failed"
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    topic_deny_rules:
      # merger owns merge.done / conflict.detected / merge.failed
      - {hat_id: resolver, topic: merge.done}
      - {hat_id: tester, topic: merge.done}
      - {hat_id: cleaner, topic: merge.done}
      - {hat_id: failure_handler, topic: merge.done}
      - {hat_id: resolver, topic: conflict.detected}
      - {hat_id: tester, topic: conflict.detected}
      - {hat_id: cleaner, topic: conflict.detected}
      - {hat_id: failure_handler, topic: conflict.detected}
      - {hat_id: merger, topic: merge.failed}
      - {hat_id: resolver, topic: merge.failed}
      - {hat_id: tester, topic: merge.failed}
      - {hat_id: cleaner, topic: merge.failed}
      # resolver owns conflict.resolved / conflict.unresolvable
      - {hat_id: merger, topic: conflict.resolved}
      - {hat_id: tester, topic: conflict.resolved}
      - {hat_id: cleaner, topic: conflict.resolved}
      - {hat_id: failure_handler, topic: conflict.resolved}
      - {hat_id: merger, topic: conflict.unresolvable}
      - {hat_id: tester, topic: conflict.unresolvable}
      - {hat_id: cleaner, topic: conflict.unresolvable}
      - {hat_id: failure_handler, topic: conflict.unresolvable}
      # tester owns tests.passed / tests.failed
      - {hat_id: merger, topic: tests.passed}
      - {hat_id: resolver, topic: tests.passed}
      - {hat_id: cleaner, topic: tests.passed}
      - {hat_id: failure_handler, topic: tests.passed}
      - {hat_id: merger, topic: tests.failed}
      - {hat_id: resolver, topic: tests.failed}
      - {hat_id: cleaner, topic: tests.failed}
      - {hat_id: failure_handler, topic: tests.failed}
      # terminal completion token: only cleaner (success) and
      # failure_handler (any branch failure) may emit it.
      - {hat_id: merger, topic: merge.handled}
      - {hat_id: resolver, topic: merge.handled}
      - {hat_id: tester, topic: merge.handled}
      - {hat_id: ralph, topic: merge.handled}
      - {hat_id: ralph, topic: merge.done}
      - {hat_id: ralph, topic: merge.failed}
      - {hat_id: ralph, topic: conflict.detected}
      - {hat_id: ralph, topic: conflict.resolved}
      - {hat_id: ralph, topic: conflict.unresolvable}
      - {hat_id: ralph, topic: tests.passed}
      - {hat_id: ralph, topic: tests.failed}

cli:
  backend: "auto"

core:
  specs_dir: "./specs/"
  guardrails:
    # OPAC 四阶段纪律 (plan 2026-07-04-001 U17): 所有 hat 遵循
    # Observe → Precheck → Apply → Confirm。详见
    # `crates/ralph-core/data/ralph-tools-opac.md`；hat `instructions:`
    # 引用 skill 而不复述命令语法。
    - "OPAC Observe: `ralph inspect loop` + `ralph tools task list`. 不要读 `.ralph/events.jsonl`."
    - "OPAC Precheck: `ralph emit --policy-check` 或 `ralph wave verify`. agent context 默认 enforce（U15）."
    - "OPAC Apply: 一次 activation 一条业务事件（isolated 单事件预算）；不要在同 activation 重试 dropped emit."
    - "OPAC Confirm: `ralph events --events-source hat-channel`（单 emit）或 `--events-source main`（wave emit 写入主 ledger）."
    - "ABSOLUTE PROHIBITION: NEVER kill, signal, or terminate any `ralph` / `ralph-orchestrator` process — including `kill`, `pkill`, `killall`, `kill -9`, `kill -TERM`, `kill -HUP`, `taskkill`, or any equivalent process-control command targeting the loop's parent PID, the TUI subprocess PID recorded in `.ralph/loop.lock`, any PID listed in `.ralph/loops.json`, or any PID returned by `ps` / `pgrep` matching `ralph`. The currently running ralph IS the parent process of this very agent iteration — killing it ends the agent itself mid-thought and corrupts orchestration state (stale lock, in_progress tasks, lost events, partial commits). If the loop needs to restart to pick up new configuration, emit `loop.cancel`, surface a `merge.failed` / `MERGE_COMPLETE` with a clear reason, or instruct the human operator to run `ralph loops stop <loop_id>`. Stopping the orchestrator is the operator's decision, not the agent's."

hats:
  merger:
    name: "Branch Merger"
    # 2026-06-26 plan U7: hat scope invariant self-declared
    # emit scope (every publishes topic is owner-pinned).
    exempt_topics: ["conflict.detected", "merge.done", "merge.failed"]
    # 2026-06-26 plan U7: event_filter enabled so the
    # hat scope invariant can guard the prompt.
    event_filter:
      enabled: true
      events: [\"work.start\"]
    description: "Performs git merge with conflict resolution and test verification."
    triggers: ["merge.start", "tests.passed"]
    publishes: ["merge.done", "conflict.detected", "merge.failed"]
    default_publishes: "merge.done"
    terminal_events: ["merge.done", "conflict.detected", "merge.failed"]
    instructions: |
      ## BRANCH MERGER MODE

      Merge the completed Ralph loop branch into main.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm) and `ralph-tools-emit` §5 precheck; do not reproduce command syntax in this hat.

      ### Step 1: Identify the Loop

      Check the RALPH_MERGE_LOOP_ID environment variable:
      ```bash
      echo $RALPH_MERGE_LOOP_ID
      ```

      If not set, extract the loop ID from the prompt (format: ralph-YYYYMMDD-HHMMSS-XXXX).

      The branch to merge is: `ralph/{loop_id}`

      ### Step 2: Review Changes

      Before merging, understand what the loop accomplished:
      ```bash
      git diff main...ralph/{loop_id} --stat
      git log main..ralph/{loop_id} --oneline
      ```

      ### Step 3: Generate Commit Message

      Create a conventional commit message using this format:
      ```
      merge(ralph): <summary> (loop <id>)
      ```

      Steps to generate the summary:
      1. Review the changes: `git diff --stat main...ralph/{loop_id}`
      2. Review the commits: `git log main..ralph/{loop_id} --oneline`
      3. Write a single-line summary of what the loop accomplished
      4. Truncate to keep total subject line ≤ 72 characters

      Example messages:
      - `merge(ralph): add user auth module (loop ralph-20250124-a3f2)`
      - `merge(ralph): fix memory leak in worker (loop ralph-20250124-b5c9)`

      ### Step 4: Attempt Merge

      ```bash
      git checkout main
      git merge ralph/{loop_id} --no-ff -m "merge(ralph): <summary> (loop {loop_id})"
      ```

      Use `--no-ff` to create an explicit merge commit with your message.

      ### If Merge Succeeds (No Conflicts)

      1. Run the test suite:
         ```bash
         cargo test
         ```

      2. If tests pass, publish `merge.done` with the merge commit SHA

      3. If tests fail, investigate and fix:
         - The issue may be a subtle incompatibility
         - Make minimal changes to fix
         - Re-run tests until passing
         - Commit the fix
         - Then publish `merge.done`

      ### If Conflicts Detected

      Publish `conflict.detected` with:
      - List of conflicted files
      - Brief description of the conflict type (e.g., "both modified same function")

      ### DON'T
      - Don't merge if you can't identify the loop branch
      - Don't skip running tests after merge
      - Don't make unrelated changes
      - Don't force push or rewrite history

      ### DONE
      When merge is complete and tests pass, publish `merge.done` to trigger the cleanup
      hat (which emits `merge.handled` to signal loop completion). The legacy
      `MERGE_COMPLETE` protocol token is no longer the loop completion marker.

  resolver:
    name: "Conflict Resolver"
    # 2026-06-26 plan U7: hat scope invariant self-declared
    # emit scope (every publishes topic is owner-pinned).
    exempt_topics: ["conflict.resolved", "conflict.unresolvable"]
    # 2026-06-26 plan U7: event_filter enabled so the
    # hat scope invariant can guard the prompt.
    event_filter:
      enabled: true
      events: [\"work.start\"]
    description: "Resolves merge conflicts by understanding intent of both sides."
    triggers: ["conflict.detected"]
    publishes: ["conflict.resolved", "conflict.unresolvable"]
    terminal_events: ["conflict.resolved", "conflict.unresolvable"]
    instructions: |
      ## CONFLICT RESOLVER MODE

      Resolve merge conflicts by understanding the intent of both sides.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm) and `ralph-tools-emit` §5 precheck; do not reproduce command syntax in this hat.

      ### Process

      1. **List conflicted files:**
         ```bash
         git status --short | grep "^UU"
         ```

      2. **For each conflict:**

         a. Read the file to understand the conflict markers:
            - `<<<<<<< HEAD` — Main branch version
            - `=======` — Separator
            - `>>>>>>> ralph/{id}` — Loop branch version

         b. Understand what each side intended:
            - Main: What was the goal of these changes?
            - Loop: What was the goal of these changes?

         c. Resolve by preserving intent from BOTH sides:
            - If features are independent, include both
            - If features overlap, merge logic carefully
            - If directly contradictory, prefer the loop's intent (it's newer)

      3. **Mark resolved:**
         ```bash
         git add <file>
         ```

      4. **After all conflicts resolved:**
         Create a conventional commit message (same format as merge):
         ```bash
         git commit -m "merge(ralph): <summary> (loop {loop_id})"
         ```

         Use the same summary you would have used for the merge.

      5. **Publish `conflict.resolved`** to trigger test verification

      ### If Unresolvable

      Some conflicts can't be auto-resolved:
      - Major architectural changes on both sides
      - Complex refactoring conflicts
      - Business logic contradictions requiring human decision

      In these cases, publish `conflict.unresolvable` with:
      - Detailed explanation of why
      - What decision needs to be made
      - Which files are affected

      ### DON'T
      - Don't delete code without understanding its purpose
      - Don't resolve conflicts by just picking one side blindly
      - Don't leave conflict markers in the code

  tester:
    name: "Test Verifier"
    # 2026-06-26 plan U7: hat scope invariant self-declared
    # emit scope (every publishes topic is owner-pinned).
    exempt_topics: ["tests.failed", "tests.passed"]
    # 2026-06-26 plan U7: event_filter enabled so the
    # hat scope invariant can guard the prompt.
    event_filter:
      enabled: true
      events: [\"work.start\"]
    description: "Runs test suite to verify merge didn't break anything."
    triggers: ["conflict.resolved"]
    publishes: ["tests.passed", "tests.failed"]
    terminal_events: ["tests.passed", "tests.failed"]
    instructions: |
      ## TEST VERIFIER MODE

      Verify the merge by running the complete test suite.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm) and `ralph-tools-emit` §5 precheck; do not reproduce command syntax in this hat.

      ### Process

      1. **Run the test suite:**
         ```bash
         cargo test
         ```

      2. **If all tests pass:**
         Publish `tests.passed`

      3. **If tests fail:**
         Publish `tests.failed` with:
         - Which tests failed
         - Brief analysis of why
         - Suggested fix approach

      ### Build Verification

      Also verify the build is clean:
      ```bash
      cargo build
      cargo clippy -- -D warnings
      ```

      ### DON'T
      - Don't skip any test suites
      - Don't ignore warnings if clippy fails
      - Don't publish tests.passed if anything fails

  cleaner:
    name: "Worktree Cleaner"
    # 2026-06-26 plan U7: hat scope invariant self-declared
    # emit scope (every publishes topic is owner-pinned).
    exempt_topics: ["merge.handled"]
    # 2026-06-26 plan U7: event_filter enabled so the
    # hat scope invariant can guard the prompt.
    event_filter:
      enabled: true
      events: [\"work.start\"]
    description: "Cleans up worktree and branch after successful merge."
    triggers: ["merge.done"]
    publishes: ["merge.handled"]
    terminal_events: ["merge.handled"]
    instructions: |
      ## WORKTREE CLEANER MODE

      Clean up the worktree and branch after successful merge, then signal
      loop completion by publishing `merge.handled`.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm) and `ralph-tools-emit` §5 precheck; do not reproduce command syntax in this hat.

      ### Step 1: Get Loop ID

      Read from RALPH_MERGE_LOOP_ID or extract from context.

      ### Step 2: Remove Worktree

      ```bash
      git worktree remove .worktrees/{loop_id} --force
      ```

      ### Step 3: Delete Branch

      ```bash
      git branch -D ralph/{loop_id}
      ```

      ### Step 4: Prune Refs

      ```bash
      git worktree prune
      ```

      ### Step 5: Update Merge Queue

      Use ralph tools to mark the loop as merged in the external merge queue.
      This is a side-effect step that does not produce a hat event:
      ```bash
      ralph loops mark-merged {loop_id}
      ```
      If that command is unavailable in this Ralph build, fall back to writing
      a JSONL record under `.ralph/merge-queue.jsonl` with shape
      `{"loop_id": "{loop_id}", "status": "merged"}`.

      ### Step 6: Publish Completion

      Publish `merge.handled` to signal that the merge cycle is complete.
      This is the loop's completion_promise; emitting it terminates the loop.

      If any cleanup step fails, publish `merge.handled` with the failure
      details included in the payload so the runner can still exit cleanly.

      ### DON'T
      - Don't force-remove if there are uncommitted changes (investigate first)
      - Don't delete wrong branches (always verify the ralph/ prefix)

  failure_handler:
    name: "Failure Handler"
    # 2026-06-26 plan U7: hat scope invariant self-declared
    # emit scope (every publishes topic is owner-pinned).
    exempt_topics: ["merge.handled"]
    # 2026-06-26 plan U7: event_filter enabled so the
    # hat scope invariant can guard the prompt.
    event_filter:
      enabled: true
      events: [\"work.start\"]
    description: "Handles unresolvable conflicts and marks loop for review."
    triggers: ["conflict.unresolvable", "tests.failed", "merge.failed"]
    publishes: ["merge.handled"]
    terminal_events: ["merge.handled"]
    instructions: |
      ## FAILURE HANDLER MODE

      Handle merge failures by marking the loop for manual review, then
      signal loop completion by publishing `merge.handled`.

      OPAC reference: follow `ralph-tools-opac` (Observe → Precheck → Apply → Confirm) and `ralph-tools-emit` §5 precheck; do not reproduce command syntax in this hat.

      ### Step 1: Assess the Failure

      Understand what failed:
      - `conflict.unresolvable` — Conflicts need human decision
      - `tests.failed` — Merge broke something
      - `merge.failed` — Merge operation itself failed

      ### Step 2: Abort Merge (if in progress)

      If there's a merge in progress:
      ```bash
      git merge --abort
      ```

      ### Step 3: Update Merge Queue

      Mark the loop as needing review. This is a side-effect step that
      does not produce a hat event:
      ```bash
      ralph loops mark-needs-review {loop_id} --reason "{failure_reason}"
      ```
      If that command is unavailable in this Ralph build, fall back to
      appending a record to `.ralph/merge-queue.jsonl` with shape
      `{"loop_id": "{loop_id}", "status": "needs_review", "reason": "{failure_reason}"}`.

      ### Step 4: Provide Instructions

      Output clear instructions for manual resolution:

      ```
      ## Manual Resolution Required

      Loop {loop_id} could not be automatically merged.

      **Reason:** {detailed explanation}

      **To resolve:**
      1. cd .worktrees/{loop_id}
      2. Investigate the issue
      3. Make necessary changes
      4. Run: ralph loops retry {loop_id}

      **To discard:**
      Run: ralph loops discard {loop_id}
      ```

      ### Step 5: Publish Completion

      Publish `merge.handled` to signal that the failure has been handled
      and the loop can terminate. Include the failure reason in the payload.

      ### DON'T
      - Don't keep retrying indefinitely
      - Don't leave merge in conflicted state
      - Don't delete the worktree (user may need it)
