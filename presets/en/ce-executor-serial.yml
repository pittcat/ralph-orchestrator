# ce-executor-serial: Isolated Mode Plan-Driven Work Execution with TDD, Validator, and Manager Report
# Pattern: Plan → Execute (TDD) → Validate → Fix (if needed) → Review (after all units) → Ship → Report
#
# 9-hat topology (progress-steward removed in 2026-07-06 plan U10) with TDD executor and validator:
# - Executor writes tests first, then implements (TDD mode)
# - Validator runs full test suite after each unit
# - Fixer handles test failures with diagnosis + fix (merged debug-resolver capability)
# - Review runs once after all units complete (not per-step)
# - Coordinator directly advances units (no plan-gate middle layer)
#
# 9 Hats:
# - Coordinator: Parses plan files, creates unit tasks, advances units on test.passed, triggers review after all units
# - Executor: TDD implementation — write/update tests first, then implement, run unit tests
# - Validator: Runs full test suite (auto-discovers test entry point), publishes test.passed / test.failed
# - Fixer: Diagnoses and fixes test failures (merged debug-resolver: locate max 10 + fix max 10)
# - review-coordinator: Walks fixed 6-dimension sequence (goal-alignment → correctness → testing → maintainability → project-standards → adversarial), one dimension per turn
# - dimension-reviewer: Reviews a single dimension, emits review.dimension.done / review.dimension.failed
# - review-synthesizer: Reads per-dimension findings, writes fix-plan file, emits review.complete with fix_plan_file
# - Shipper: Final validation, plan status update, final commit
# - Reporter: Generates manager-facing completion report
# - progress-steward: REMOVED in 2026-07-06 plan U10; stall recovery is now
#   runtime fail-close (U12) + shipper reason gate (U13); see presets/schemas
#   Coverage comment for the new 9-hat topology.
#
# Usage:
#   ralph run -H builtin:ce-executor-serial -p "docs/plans/my-plan.md"
#
# Event Flow:
#   coordinator → executor (unit-01, TDD) → validator
#     ├─ test.passed(step-01) [PHASE 1] → coordinator (Branch B pre-decision gate:
#     │                                    confirm current step == N_total from
#     │                                    plan.md + progress.md before emitting
#     │                                    review.start; otherwise emit work.ready
#     │                                    for the next unit)
#     │                              → executor (unit-02) → ... → unit-N all done
#     │                                    ↓
#     │                                  coordinator → review.start
#     │                                  review-coordinator → dimension-reviewer(goal-alignment)
#     │                                  → review-coordinator → dimension-reviewer(correctness)
#     │                                  → review-coordinator → dimension-reviewer(testing)
#     │                                  → review-coordinator → review-synthesizer
#     │                                  → review.complete + fix_plan_file
#     │                                  → coordinator (creates fix-unit tasks)
#     │                                  → executor (fix-unit-01) → validator
#     │                                  → test.passed(fix-01) [PHASE 2: branch on step prefix!] → coordinator
#     │                                  → executor (fix-unit-02) → validator → ... → last fix-unit done
#     │                                  → coordinator → plan.complete (DO NOT emit review.start)
#     │                                  → shipper → reporter → [LOOP_COMPLETE]
#     │
#     └─ test.failed → fixer (diagnose + fix, max 10 locate + 10 fix)
#                        ├─ fix.applied → validator (re-run tests)
#                        │   ├─ test.passed → back to main line
#                        │   └─ test.failed → fixer (continue)
#                        └─ fix.exhausted → executor (rewrite chance, max 10) → validator → ...
#
# Why this architecture:
#   - No multi-consumer topics: every event has exactly one subscriber
#   - No plan-gate: coordinator directly advances units on test.passed
#   - No debug-resolver: fixer merges diagnosis + fix capability
#   - No per-step review: review runs once after all units complete
#   - Phase authority engine (U24) handles the unit_loop → review →
#     fix_units → plan_end routing per KTD1

# 2026-06-27 mechanism foundation U10: declarative flow metadata.
# The runtime reads `mechanism.flow` at preset-load time and
# passes it to `FlowStepScopeStage` (U9) and `VerdictGateStage`
# (U9.5). The lint in `preset_lint::flow_declaration` checks
# this block at preset-authoring time. The `repair_budget`,
# `enforce_schema`, and `state_idempotency` keys wire U1, U2,
# U4 / U8 respectively.
mechanism:
  flow:
    type: declared
    version: 1
    terminal_emits: [LOOP_COMPLETE]
    steps:
      - id: unit_loop
        kind: foreach
        over: plan.units
        allowed_emits:
          - work.ready
          - work.done
          - work.failed
          - test.passed
          - test.failed
          - fix.applied
          - fix.exhausted
        body:
          - work.ready
          - work.done
          - work.failed
          - test.passed
          - test.failed
          - fix.applied (if test.failed)
          - fix.exhausted (if fix.exhausted)
        terminal_when: all_done
        on_partial:
          all_done: plan.complete
          any_failed: plan.blocked(reason="unit_failed")
          partial_units_done: plan.blocked(reason="partial_units_done")
      - id: review_walk
        kind: sequence
        allowed_emits:
          - review.start
          - review.dimension.ready
          - review.dimension.done
          - review.dimension.failed
          - review.dimensions.complete
          - review.complete
        body:
          - review.start
          - review.dimension.ready
          - review.dimension.done
          - review.complete
        emit_when: unit_loop.terminal == all_done
      - id: plan_end
        kind: branch
        allowed_emits:
          - plan.complete
          - plan.blocked
        on_partial:
          all_done: plan.complete
          any_failed: plan.blocked(reason="unit_failed")
          partial_units_done: plan.blocked(reason="partial_units_done")
        on_review_passed: plan.complete
        on_review_failed: plan.blocked(reason="review_failed")
        on_residual: plan.complete(verdict="pass_with_residuals")
      - id: ship
        kind: sequence
        allowed_emits:
          - REVIEW_COMPLETE
          - report.done
          - LOOP_COMPLETE
        body:
          - REVIEW_COMPLETE
          - report.done
          - LOOP_COMPLETE
  repair_budget: 3
  enforce_schema: hard
  state_idempotency: required
  # 2026-07-02-006 plan U24: opt-in phase authority.
  # Runtime phase authority (2026-07-02-006): when `enabled: true`
  # the engine is the SSOT for unit_loop → review → fix_units →
  # plan_end routing; coordinator prompt defers to engine snapshot.
  phase_authority:
    enabled: true
    initial_phase: unit_loop
    phases:
      - id: unit_loop
        allowed_emits:
          coordinator: [work.ready, queue.advance, plan.blocked]
          executor: [work.done, work.failed]
          validator: [test.passed, test.failed]
      - id: review
        allowed_emits:
          coordinator: [review.start]
          review-coordinator: [review.dimension.ready, review.dimensions.complete, plan.blocked]
          review-goalalign: [review.goalalign.done, review.goalalign.failed]
          review-correctness: [review.correctness.done, review.correctness.failed]
          review-testing: [review.testing.done, review.testing.failed]
          review-maintainability: [review.maintainability.done, review.maintainability.failed]
          review-project-standards: [review.project-standards.done, review.project-standards.failed]
          review-adversarial: [review.adversarial.done, review.adversarial.failed]
          review-synthesizer: [review.complete]
      - id: fix_units
        allowed_emits:
          coordinator: [work.ready]
          executor: [work.done, work.failed]
          validator: [test.passed, test.failed]
      - id: plan_end
        allowed_emits:
          coordinator: [plan.complete, plan.blocked]
      - id: ship
        allowed_emits:
          shipper: [REVIEW_COMPLETE]
          reporter: [report.done, LOOP_COMPLETE]
      - id: terminal
        allowed_emits: {}
    transitions:
      - on: { event: work.start }
        from: "*"
        to: unit_loop
      - on:
          primitive: on_test_passed_step
          step_kind: plan_unit
          when: last
        from: unit_loop
        to: review
      - on:
          primitive: on_review_complete_verdict
          matrix: serial_default
        from: review
        to: plan_end
      - on:
          primitive: on_test_passed_step
          step_kind: fix_unit
          when: last
        from: fix_units
        to: plan_end
      - on:
          primitive: on_plan_terminal_accepted
          event: plan.complete
          accepted: true
        from: plan_end
        to: ship
      - on:
          primitive: on_plan_terminal_accepted
          event: plan.blocked
          accepted: true
        from: plan_end
        to: ship
      - on:
          primitive: on_loop_complete_honored
        from: ship
        to: terminal
    violation_policy:
      max_resume_per_hat: 3
      on_exhausted: plan_blocked
    progress_projection:
      on_enter:
        plan_end:
          write_current_step: last_completed_step_or_none
        fix_units:
          write_current_step: active_fix_step

topic_format_whitelist:
  - LOOP_COMPLETE
  - REVIEW_COMPLETE
  # 2026-06-27 mechanism foundation: repair-bucket topics are
  # intentionally lowercase_underscore so the orchestrator can
  # route them through the legacy-progress-steward path; the
  # topic-format lint is whitelisted here rather than renaming
  # the topic so the Plan v1.1 §U2 surface contract holds.
  - task.relocate_legacy

tasks:
  enabled: true
  # 2026-07-06 plan U11: narrowed the coordinator allowlist to
  # `coordinator` ONLY. `progress-steward` was removed in U10;
  # the loop-level fallback hat no longer exists, so it cannot
  # be a coordinator. Executor/validator/fixer/shipper/reporter
  # are *workers* and must NOT bypass the role gate to create
  # or ensure cross-hat tasks. The two-step verify gate
  # (`require_verify_for_cli_mutate: true`) remains enabled so
  # all `add` / `ensure` mutations from agents must go through
  # `task verify <verb>` first.
  coordinator_hats:
    - coordinator
  require_verify_for_cli_mutate: true
  allow_unsafe_task_mutate: false

event_loop:
  execution_mode: isolated
  prompt_file: "PROMPT.md"
  # U11: runtime diagnosis is intentionally NOT declared in this preset.
  # Telemetry is operator-controlled (not hat-collection-controlled) due
  # to the operator/hat-collection security boundary. Hat collections
  # cannot silently enable diagnostics, artifact writes, or prompt
  # injection. Operators must enable it in their project ralph.yml under
  # the top-level `telemetry:` key, or set RALPH_DIAGNOSTICS=1.
  completion_promise: "LOOP_COMPLETE"
  required_events: ["report.done"]
  starting_event: "work.start"
  max_iterations: 50
  # 2026-06-24 plan U2: max_residuals is the verdict-promotion
  # threshold for shipper. When translating
  # `plan.complete.verdict == "pass_with_residuals"` to
  # `REVIEW_COMPLETE`, shipper promotes to `pass` if
  # `final_findings_count <= max_residuals`. Default 8.
  # This value is Rust-read and injected into every hat prompt
  # via `## RUNTIME CONFIG` (see
  # `crates/ralph-core/src/event_loop/mod.rs::append_runtime_config_block`).
  max_residuals: 8
  # 2026-06-23: this value is read by Rust (whitelisted in
    # `PRESET_OPT_IN_WHEN_OPERATOR_OMITS`) and injected into every
    # hat prompt via the `## RUNTIME CONFIG` block. Operators can
    # override per-workspace in their `ralph.yml`.
  max_runtime_seconds: 28800  # 8 hours
  enforce_hat_scope: true
  # Ephemeral file isolation is identical to ce-executor-serial — the
  # serial path inherits the same per-loop scratchpad-{loop_id}.md
  # relocation, since the offending agent behaviour (writing scratchpad.md
  # into the source tree) is hat-collection-agnostic.
  ephemeral_isolation: true
  # Same single-U contract as ce-executor-serial. Coordinator must
  # only create the current U's task.
  enforce_current_unit: true
  # 2026-06-28-005: the human.guidance topic and the
  # suppress_human_guidance config field were removed in plan
  # 2026-06-28-005. Automated recovery flows through `task.resume`;
  # the perky-maple probe storm is no longer possible because no
  # guidance event reaches any hat.
  # Plan 2026-06-20-001 F-PS-005: state_projection moved to
  # `presets/schemas/ce-executor-serial.yml` SSOT (uses the
  # `actions_chain` form with `mark_step_completed`). The inline
  # `actions:` map below would shadow the SSOT and break the
  # engine dispatch (state_projector reads `actions_chain`
  # first). It is intentionally removed; edit the SSOT file
  # when the projection chain changes.
  #
  # Plan 2026-06-20-001 F-PS-005: workflow_contract seeds live
  # in the SSOT. The `incomplete_wave_gate` is `false` by
  # default and `step_handoff.progress_task_gate` is `true` —
  # both are SSOT defaults so the inline override is redundant.
  # `handoff_topic_seeds` (the 9+ entry list) is also SSOT.
  # The inline `workflow_contract:` block was removed; operators
  # who need a per-workspace override should set the full block
  # in their project's ralph.yml, not here.
  #
  # Plan 2026-06-20-001 F-PS-005: verdict_gate is SSOT. The
  # inline block here duplicated the SSOT fields exactly. It
  # is intentionally removed; edit
  # `presets/schemas/ce-executor-serial.yml` to change it.
  # 2026-06-17-003 U5: cross-hat HARD RULE (mirrors
  # ce-executor-serial). Per-hat instructions below may still
  # mention hand-writing the ledgers (legacy phrasing); treat
  # those as stale and read the live values from the
  # `## ORCHESTRATOR CONTEXT` block. Forbidden: agent-side
  # `ralph tools task ensure|start|close|fail|reopen`, direct
  # writes to `.ralph/agent/tasks.jsonl` /
  # `.ralph/agent/progress.md`, and `tail` of `.ralph/events.jsonl`
  # to compute the current step.
  #
  # U7: execution_contracts SSOT is the canonical ruleset. The
  # inline block was a partial copy that included
  # `require_payload_fields`, which is **explicitly forbidden**
  # under KTD-12 (rule A) — those fields are joined from
  # `event_policy.schemas` at engine runtime. The inline
  # `require_payload_fields:` sub-keys are removed; the SSOT
  # file at `presets/schemas/ce-executor-serial.yml` is the
  # single source of truth for required payload fields. The
  # other rules (`require_task`, `require_git_change`,
  # `require_test_evidence`, `dedup_key`) are still inline
  # overrides because they encode the executor's specific
  # `loop_scoped` / `auto_close_on_valid` /
  # `allow_empty_for_steps` policy that the SSOT does not pin.
  execution_contracts:
    enabled: true
    rules:
      work.done:
        # commit_count + changed_lines let the review-coordinator
        # gate distinguish "empty diff" from "non-trivial diff".
        # Trivial steps are exempt via allow_empty_for_steps; the
        # executor still reports commit_count=0, changed_lines=0 for
        # them so the schema stays consistent.
        require_payload_fields:
          - "plan_name"
          - "plan_path"
          - "task_id"
          - "task_key"
          - "step"
          - "commit_count"
          - "changed_lines"
        require_task:
          id_field: "task_id"
          key_field: "task_key"
          loop_scoped: true
          allowed_terminal_statuses: ["closed"]
          auto_close_on_valid: false
        # `commit_only_clean` requires both a new commit and a clean
        # working tree before `work.done` can pass.
        # Absorb every intended change into the U-ID commit first;
        # do not leave dirty state behind.
        require_git_change:
          mode: "commit_only_clean"
          allow_empty_for_steps: ["trivial"]
        require_test_evidence:
          mode: "optional"  # "optional" | "required_payload_field"
          payload_field: "tests"  # field name to check when mode is "required_payload_field"
      # U6 (2026-06-18-004 plan, R3): `fix.applied` execution
      # contract. Pins the perky-maple P2-3 commit-count drift
      # path — the agent emitted `commit_count=0` while the
      # real commit was still in flight (or hadn't run yet).
      # `commit_only` requires a real new commit since loop
      # start; uncommitted diff alone is insufficient because
      # the fixer might emit before `git commit` lands.
      fix.applied:
        require_git_change:
          # `commit_only` (NOT a fictional `strict`): a real
          # commit must exist since loop start. `diff_or_commit`
          # would admit the uncommitted-diff-but-payload-claims-0
          # drift. `commit_count_min` in the payload is checked
          # separately by the schema (U0); this rule is the
          # git-evidence half.
          mode: "commit_only"
          allow_empty_for_steps: ["trivial"]
  # 2026-07-06 plan U11: progress_steward fallback DISABLED.
  # The `progress-steward` hat was removed from this preset in
  # U10; the runtime stall detector (event_loop/mod.rs, U12)
  # MUST NOT publish `loop.stalled` wake events. The
  # `enabled: false` flag is the runtime's kill-switch
  # (`event_loop::stall_detector`) and pins the fail-close
  # contract for shipper_reason (U13).
  progress_steward:
    enabled: false
    steward_hat_id: "progress-steward"
    max_steward_iterations: 3
  # 2026-07-06-004 plan U7: handoff envelope prompt injection —
  # serial is the first (and currently the only) preset that
  # turns this on. All four flags are enabled here so the
  # envelope is injected, validated, and summarized in the
  # serial path. Default-closed elsewhere (regression defence #4).
  handoff_envelope:
    enabled: true
    prompt_injection: true
    validate_payload: true
    emit_result_summary: true
  # 2026-07-02-004 plan: precheck gate (LLM-as-judge on critical
  # terminal topics). Desugar rewrites each guarded topic's
  # producers to emit `<X>.proposed` and synthesizes a `precheck-<X>`
  # gate hat. With these two rules, the effective hat count rises
  # from 10 to 12 (within the `isolated` mode cap; no execution_mode
  # change required). Schema SSOT file
  # (`presets/schemas/ce-executor-serial.yml`) keeps the precheck
  # comment placeholder only — this preset deliberately opts in here
  # so other SSOT-derived presets remain unchanged.
  precheck:
    enabled: true
    rules:
      review.complete:
        prompt:
          - "fix_plan_file path exists and is non-empty, with structured fix-plan content (not a stub, 'no changes', or single-sentence placeholder)"
          - "verdict is self-consistent with findings_count: pass must have zero P0/P1 findings, pass_with_residuals must have final_findings_count > 0"
          - "findings_summary is consistent with findings_count in magnitude, no contradiction"
          - "every fix-NN step has explicit owner / description / verification, not generic 'fix issue'"
        on_fail:
          target: review-synthesizer
          retry_budget: 3
          on_exhausted: "plan.blocked(reason=precheck_failed)"
          reason: "review.complete failed subjective checklist"
      plan.complete:
        prompt:
          - "all plan-unit and fix-unit tasks in tasks.jsonl have status=closed"
          - "completed_steps is consistent with context.md / plan.md, no missing step"
          - "verdict is self-consistent with final_findings_count (same rule as review.complete)"
          - "step field is the real terminal step (e.g. fix-NN or step-NN), not a placeholder"
        on_fail:
          target: coordinator
          retry_budget: 3
          on_exhausted: "plan.blocked(reason=precheck_failed)"
          reason: "plan.complete failed subjective checklist"
  # Plan 2026-06-16-002 Unit 1: `presets/schemas/ce-executor-serial.yml`
  # is the authoring SSOT for `event_policy.schemas`; `build.rs` deep-
  # merges it into the embedded preset at compile time. The inline
  # `schemas:` block below is a per-topic override layer during the
  # transition — prefer editing the SSOT file and clearing matching
  # inline entries. Do not reintroduce `schema_file` here (broken for
  # builtin presets without on-disk anchor).
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    # Topics the policy gates. terminal_topics are the legitimate
    # loop-end signals; business_topics are the topics that, after
    # terminal, indicate the loop is being driven past its end.
    # Both lists MUST be present for completion_after_terminal to
    # fire (see event_policy.rs:check_completion_guard).
    terminal_topics:
      - "LOOP_COMPLETE"
    business_topics:
      # Coordinator → shipper/reporter chain (the loop's exit path).
      - "plan.complete"
      - "plan.blocked"
      - "REVIEW_COMPLETE"
      - "report.done"
      # Per-hatter exit-path events that, if accepted after
      # completion, would re-trigger downstream hats.
      - "work.ready"
      - "work.done"
      - "test.passed"
      - "test.failed"
      - "review.start"
      - "review.complete"
      - "fix.applied"
      - "fix.exhausted"
      # 2026-07-04-002 plan U6 (R9): review-coordinator's serial-walk
      # topics used to live on the hat's `exempt_topics` list, which
      # made the budget-admission carve-out (U13) treat them as a
      # scope exception instead of a first-class business signal.
      # Moving them here makes them flow through the standard
      # `event_policy.business_topics` gate (terminal_after / completion
      # derivation / state-machine business-class check) so the 6
      # activation walk admits one `review.dimension.ready` each
      # without bypassing the completion-after-terminal guard.
      # Topic-deny rules (lines below) keep them pinned to
      # review-coordinator / dimension-reviewer / ralph-pseudo,
      # so deleting the hat-level `exempt_topics` does not weaken
      # scope ownership.
      - "review.dimension.ready"
      - "review.dimensions.complete"
    # 2026-06-25: prevent post-completion re-runs.
    # After LOOP_COMPLETE is honored, the loop MUST stay quiet —
    # any business event must be rejected, and a duplicate
    # LOOP_COMPLETE itself must be rejected. Without these guards,
    # any hat re-prompted by task.resume after completion will trigger
    # a second shipper/reporter cycle, doubling event log + handoffs.
    # Observed in ralph-e2e primary-20260624-153613: 2x REVIEW_COMPLETE /
    # 2x report.done / 2x LOOP_COMPLETE after coordinator published
    # plan.blocked post-completion.
    completion_after_terminal:
      duplicate_terminal: reject
      business_after_completion: reject
      write_diagnostic_event: true
    # Force every `ralph emit` to pre-validate against this event_policy
    # schema BEFORE writing to the events file. The `--no-policy-check`
    # escape hatch is removed — there is no other way to write a
    # non-conforming event under this preset.
    require_policy_check_for_cli_emit: true
    allow_unsafe_cli_emit: false
    # U1 (2026-06-17-004 plan): CLI provenance fail-closed. In isolated
    # mode, every `ralph emit` MUST carry a hat (--hat or
    # RALPH_CURRENT_HAT) for business topics. Control topics
    # (loop.cancel, task.resume, human.*) and orchestrator diagnostics
    # are exempt — the loop itself emits them.
    require_emit_provenance: true
    # Topic-deny rules with glob support. Each topic is restricted to
    # its owning hat. The `debug.*` glob is retained for forward-compat
    # even though debug-resolver is removed.
    topic_deny_rules:
      - {hat_id: executor, topic: build.done}
      - {hat_id: executor, topic: test.passed}
      - {hat_id: executor, topic: test.failed}
      - {hat_id: executor, topic: 'review.*'}
      - {hat_id: coordinator, topic: build.done}
      - {hat_id: coordinator, topic: 'test.*'}
      - {hat_id: coordinator, topic: 'review.dimension.*'}
      - {hat_id: coordinator, topic: 'fix.*'}
      - {hat_id: coordinator, topic: 'debug.*'}
      # validator is read-only on work.done / fix.applied; cannot emit
      - {hat_id: validator, topic: build.done}
      - {hat_id: validator, topic: 'review.*'}
      - {hat_id: validator, topic: 'fix.*'}
      - {hat_id: validator, topic: work.ready}
      - {hat_id: validator, topic: work.done}
      # fixer cannot emit work/test/review topics
      - {hat_id: fixer, topic: build.done}
      - {hat_id: fixer, topic: 'review.*'}
      - {hat_id: fixer, topic: work.ready}
      - {hat_id: fixer, topic: work.done}
      - {hat_id: fixer, topic: 'test.*'}
      # Serial-review topic ownership: only review-coordinator may emit
      # these.
      - {hat_id: dimension-reviewer, topic: review.dimension.ready}
      - {hat_id: dimension-reviewer, topic: review.dimensions.complete}
      - {hat_id: dimension-reviewer, topic: review.complete}
      - {hat_id: review-synthesizer, topic: review.dimension.ready}
      - {hat_id: review-synthesizer, topic: review.dimensions.complete}
      - {hat_id: review-coordinator, topic: review.dimension.done}
      - {hat_id: review-coordinator, topic: review.dimension.failed}
      - {hat_id: review-coordinator, topic: review.complete}
      # ralph (the loop-runner fallback hat) is locked out of every
      # workflow topic that downstream hats own.
      - {hat_id: ralph, topic: review.dimension.ready}
      - {hat_id: ralph, topic: review.dimension.done}
      - {hat_id: ralph, topic: review.dimension.failed}
