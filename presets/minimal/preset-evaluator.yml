# Meta-Ralph: Hat Collection Preset Evaluator
# Purpose: Systematically test each hat collection preset with Claude CLI
# Output: Consolidated findings in tools/preset-evaluation-findings.html

# Event loop settings - generous limits for thorough evaluation
event_loop:
  prompt_file: "tools/PRESET_EVALUATOR_PROMPT.md"
  completion_promise: "EVALUATION_COMPLETE"
  max_iterations: 200              # Allow many iterations for 12 presets
  max_runtime_seconds: 28800       # 8 hours max
  max_consecutive_failures: 3
  starting_event: "evaluation.start"  # Ralph publishes this after coordination

# Use Claude CLI as the backend
cli:
  backend: "claude"
  prompt_mode: "arg"
  pty_mode: false
  pty_interactive: false           # Non-interactive for batch evaluation
  idle_timeout_secs: 120           # 2 min timeout per action

# Core behaviors
core:
  specs_dir: "./specs/"
  guardrails:
    - "Document ALL findings - both successes and failures"
    - "Be specific about error messages and stack traces"
    - "Note timing and performance observations"
    - "Capture UX friction points as you experience them"
    - "Confidence protocol: score decisions 0-100. >80 proceed autonomously; 50-80 proceed + document in .ralph/agent/decisions.md; <50 choose safe default + document."

# Single-hat mode for the meta-evaluator
# Ralph handles task.start for coordination, then delegates via evaluation.start
# Skill dependency contract (2026-10-30 preset skill contract spec): the
# single source of truth for hat -> skill dependencies. Evaluated by
# `ralph preset check`, `ralph preflight`, `ralph tools skill check`, and
# the `ralph run` startup gate — a failing required dep blocks the loop
# before any backend spawns.
skills:
  contract:
    - skill: ralph-html
      hats: [evaluator]
      purpose: Entry guidance for offline single-file HTML deliverables (offline/escaping rules).
      required: true
      load: on_demand
      source: builtin
      when: "Loaded before the hat writes its .html artifact."
      install_hint: "Embedded in the ralph binary — no install needed; a resolution failure means `skills.overrides` or the registry is misconfigured."
    - skill: ralph-html-artifact
      hats: [evaluator]
      purpose: Artifact-generation rules for the HTML deliverable.
      required: true
      load: on_demand
      source: builtin
      when: "Loaded with ralph-html before writing the .html artifact."
      install_hint: "Embedded in the ralph binary — no install needed; a resolution failure means `skills.overrides` or the registry is misconfigured."
    - skill: ralph-html-design
      hats: [evaluator]
      purpose: Design direction for the HTML deliverable.
      required: true
      load: on_demand
      source: builtin
      when: "Loaded with ralph-html before writing the .html artifact."
      install_hint: "Embedded in the ralph binary — no install needed; a resolution failure means `skills.overrides` or the registry is misconfigured."

hats:
  evaluator:
    name: "🧪 Preset Evaluator"
    description: "Tests and documents Ralph's hat collection presets."
    triggers: ["evaluation.start"]
    publishes: ["evaluation.complete"]
    instructions: |
      You are evaluating Ralph's hat collection presets.

      Your job:
      1. Manually test each preset with a representative task
      2. Document what works and what doesn't
      3. Identify UX improvements and bugs
      4. Save all findings as a self-contained HTML file to tools/preset-evaluation-findings.html — first run `ralph tools skill load ralph-html`, then `ralph tools skill load ralph-html-artifact` and `ralph tools skill load ralph-html-design`, and follow their offline/escaping rules. If the guidance cannot be loaded, report the failure instead of claiming completion.
