# Preset build manifest.
#
# Single source of truth for which English presets `crates/ralph-cli/build.rs`
# copies into $OUT_DIR at compile time, and which `presets.rs` lists in its
# `PRESETS` array. Both sides read this file and panic on mismatch — see
# `crates/ralph-cli/build.rs` and `crates/ralph-cli/src/presets.rs`.
#
# Authoring rules:
#   * Add a new builtin preset by:
#       1. Writing the YAML under `presets/en/<name>.yml`
#       2. Adding `<name>` to the `embedded` list below
#       3. Adding an `EmbeddedPreset { name, description, content, public }`
#          entry in `crates/ralph-cli/src/presets.rs`
#       4. Adding it to `presets/index.json` if user-facing
#   * Chinese reference copies live under `presets/zh/<name>-zh.yml` and
#     are NEVER embedded. `build.rs` does not read this directory.
#   * Files under `presets/extras/` are kept for reference but are not
#     embedded and not listed in `index.json`.
#   * Files under `presets/minimal/` are not embedded either; see
#     comments at the top of that subdirectory.
#   * Files under `presets/schemas/` are reference copies of payload
#     schemas. Schemas used to be loaded at runtime via
#     `event_policy.schema_file: "../schemas/<name>.yml"`, but that
#     path was broken for builtin presets (no on-disk anchor for
#     `resolve_schema_files`) and is now inlined into the matching
#     `presets/en/<name>.yml` as `event_policy.schemas`. Do NOT
#     reintroduce `schema_file` in a preset; keep the schemas inline.

embedded:
  - autoresearch
  - ce-executor-serial
  # - ce-executor-wave  # deleted 2026-06-23
  - debug
  # - hatless-baseline  # P3 #29: legacy experimental preset; kept on disk
  # for history but excluded from the embedded preset list. Listed as
  # commented-out rather than deleted so a future curator can decide
  # whether to promote it back into the public set or remove the file
  # outright. See `presets/en/hatless-baseline.yml` for contents.
  - merge-loop
