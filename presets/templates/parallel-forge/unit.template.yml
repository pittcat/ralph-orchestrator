# Unit 标准格式 — parallel-dev-preset.md §4
# Planner：为每个 Unit 复制本结构到 execution-plan.yml 的 units[] 条目。
# Executor：只实现与本条目 id 匹配的一个 Unit；不得越 allowed_paths / forbidden_paths。
# 无法确认的路径/命令使用 executor_must_confirm，不得伪造。

id: U01
title: "简短明确的 Unit 名称"
type: foundation  # foundation | vertical_slice | integration | migration | verification
goal: "这个 Unit 唯一负责实现的最小可观察行为"

scenarios:
  - S01

depends_on: []
  # - U00

execution_wave: 1  # 1-based 正整数；禁止 0；与 development-plan「Wave N」同号
integration_order: 1
execution_mode: parallel  # parallel-forge requires at least one multi-Unit wave

# U2 (plan 2026-09-03-0959): 每个 Unit 必须声明其 canonical target_branch；
# 必须通过 git check-ref-format --branch 等价规则（U2 纯 Rust 校验）：
#   不能为空、不能以 '-' 或 '/' 开头、不能以 '/' '.' '.lock' 结尾、
#   不能含 //, .., @{, space, ~, ^, :, ?, *, [, \, ASCII control；最长 255 字节。
# 同一 plan 中每个 Unit 的 target_branch 通常独立（per-Unit integration lane）；
# 共享同一 target_branch 的 Unit 走串行 lane（U4/U8 派发），不影响本字段校验。
target_branch: "feat/unit-<UNIT_ID>"
  # 例：feat/unit-u01、fix/unit-u02-typo；多 Unit 共享 target=integration 分支时
  # 仍然每 Unit 写一份完整字符串，便于 digest 稳定且 audit 直观。

# U2 typed resource_claims: 列出本 Unit 运行时需要的许可资源；key 必须出现在
# 计划级 resource_capacities 中，permits ≥ 1。U4 admission engine 保证每资源
# 总 permits ≤ capacity；U2 不做单 claim 静态 ≤ capacity 检查（避免误拒合理的
# 共享独占资源规划）。
resource_claims: []
  # - key: gpu
  #   permits: 1

parallel_with: []
  # - U02
parallel_reason: "为什么可以安全并发（parallel 时必填）"
serial_reason: "如果必须串行，说明真实原因（serial 时必填）"

allowed_paths:
  - src/example/**
  - tests/example/**

forbidden_paths:
  - src/unrelated/**
  - build/global-config.*

shared_contracts:
  - ExampleInterface

owned_resources: []
  # - Cargo.lock  # 若本 Unit 是 Owner，列在此处

outside_in:
  external_entry: "外部入口"
  application_capability: "应用层协调能力"
  domain_rules:
    - "需要独立验证的领域规则"
  stable_ports:
    - "稳定接口或端口"
  infrastructure:
    - "基础设施适配能力"
  substitutes:
    - "可使用的 Fake、Stub 或 Fixture"

observable_behavior:
  input: "输入"
  output: "输出"
  state_changes:
    - "可观察状态变化"
  errors:
    - "错误表现"
  side_effects:
    - "必要副作用"

acceptance_criteria:
  - "可观察、可执行、可判定的验收条件"

acceptance_test:
  level: unit  # unit | component | integration | contract | cli | e2e
  entry: "测试入口"
  given: "前置状态"
  when: "动作"
  then:
    - "可观察结果"
  dependency_mode: fake  # fake | stub | real
  command: "实际命令或 executor_must_confirm"
  expected_red: "第一次运行时正确失败的原因"

tdd:
  unit_behaviors:
    - behavior: "最小业务行为"
      red: "测试如何以正确原因失败"
      green: "最小实现范围"
      refactor: "允许的重构范围"
  regression:
    commands:
      - "受影响模块的回归测试命令或 executor_must_confirm"
    affected_areas:
      - "受影响范围"

risk_driven_tests: []
  # - type: characterization | contract | property_based | ...
  #   reason: "为什么需要"
  #   scope: "覆盖的风险"

explicitly_out_of_scope:
  - "明确不在本 Unit 实现的能力"

completion_criteria:
  - "验收测试通过"
  - "单元测试通过"
  - "必要集成测试通过"
  - "受影响回归通过"
  - "没有越界修改"
  - "可整理为一个原子 Commit"

deliverables:
  - production_code
  - automated_tests
  - required_fakes_or_fixtures
  - required_documentation
  - unit_completion_report

commit:
  message: "feat(unit-u01): implement observable behavior"
  final_commit_count: 1

risks:
  - "已知风险"

rollback:
  - "Unit 失败时如何回退"
