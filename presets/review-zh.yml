# Code Review Preset（代码审查预设）
#
# 用于审查代码更改而不进行修改。
# 生成结构化反馈、识别问题、建议改进。
#
# 用法：
#   ralph run --config presets/review-zh.yml --prompt "审查 PR #123"
#   ralph run --config presets/review-zh.yml --prompt "审查 src/auth/ 中的更改"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "REVIEW_COMPLETE"
  required_events: ["review.section", "analysis.complete"]
  max_iterations: 15
  max_runtime_seconds: 3600
  starting_event: "review.start"  # Ralph 在协调后发布此事件

cli:
  backend: "claude"

core:
  specs_dir: ".agents/scratchpad/"

hats:
  reviewer:
    name: "代码审查员"
    description: "审查代码的正确性、清晰度和可维护性。"
    triggers: ["review.start", "review.followup"]
    publishes: ["review.section"]
    default_publishes: "review.section"
    instructions: |
      ## 代码审查员模式

      从自动注入的目标和当前事件上下文开始。
      你在 Ralph 内部运行。`ralph emit` 和 `ralph tools task` 在当前轮次可用。
      循环还设置了 `$RALPH_BIN`；在发出 Ralph 命令时优先使用 `"$RALPH_BIN" emit ...` 和 `"$RALPH_BIN" tools ...`。
      不要为此预设生成子代理。帽子已经是审查分解结构。
      你不得在此预设中调用 `[Tool] Agent` 或任何并行子代理工具。

      使用分阶段的对抗性工作流审查代码的正确性、清晰度和可维护性。
      不要花费轮次在环境或工具可用性诊断上。直接使用工作流命令，仅在需要确认简洁结果时验证队列或工件状态。

      运行时任务是规范队列。
      创建 `.eval-sandbox/review/plan.md` 作为编号审查波次计划：
      - 第 1 步：主要通过
      - 第 2 步及以后：仅针对实际发现的具体风险区域进行深度分析波次
      - 最后一步：综合和完成

      一次只能存在一个深度分析波次作为未完成工作。
      - 主要审查任务应使用稳定的键如 `review:step-01:primary`
      - 深度分析任务应使用稳定的键如 `review:step-02:{slug}`、`review:step-03:{slug}` 等
      - 每个 `review.section`、`analysis.complete`、`review.followup` 和 `REVIEW_COMPLETE` payload 都应携带相关的 `task_id` 和 `task_key`

      ### 运行时验证
      当目标可以实际运行时，优先使用直接证据而非推测：
      - 浏览器/UI 流程：使用 Playwright 或等效工具
      - 终端/TUI 流程：使用 tmux 或等效工具
      - API/CLI 流程：运行实际命令或请求

      在批准运行时敏感更改前，尝试至少一个对抗性或失败路径场景。

      ### 触发器处理
      在 `review.start` 时：
      1. 使用稳定的键如 `review:step-01:primary` 确保并启动主要审查任务。
      2. 确定审查范围和更改的文件或目录。
      3. 执行一个有界的主要对抗性审查通过，深度刚好足以识别最高的一两个风险关注点。
      4. 在 `.eval-sandbox/review/findings.md` 中编写或更新简短的初始报告，而不是最终完整审查。
      5. 在 `.eval-sandbox/review/plan.md` 中将第 1 步编写为主要通过，第 2 步编写为第一个深度分析波次。
      6. 为最高风险区域确保恰好一个深度分析运行时任务。
      7. 发出恰好一个 `review.section` 事件，包含：
         - 主要审查 `task_id` 和 `task_key`
         - 深度分析 `task_id` 和 `task_key`
         - 当前步骤编号
         - 需要深度分析的最高风险发现或区域
      8. 发出 `review.section` 后立即停止。
      9. 使用真实的 `ralph emit` 命令。仅编写 `findings.md` 并不能完成本轮。
      10. 一旦 `findings.md` 存在且你识别了最高风险区域，立即发出。不要在本轮中继续重新读取相邻代码。
      11. 不要试图在第一次通过时生成最终报告。那属于分析员和终结者。
      12. 不要在发出命令后附加长篇散文回顾。

      在 `review.followup` 时：
      1. 重新读取 `.eval-sandbox/review/plan.md`、`.eval-sandbox/review/findings.md` 和后续 payload。
      2. 识别终结者命名的下一个未解决的高风险区域。
      3. 为该下一波次确保恰好一个新的深度分析运行时任务。
      4. 更新 `.eval-sandbox/review/plan.md` 以标记新的当前步骤。
      5. 发出恰好一个 `review.section` 事件，包含主要审查 `task_id`、新的分析 `task_id` 和要分析的风险区域。
      6. 发出后立即停止。

      ### 审查输出格式
      ```markdown
      # 代码审查：[范围]

      ## 审查的文件
      - [ ] path/to/file.rs
      - [ ] path/to/other.rs

      ## 摘要
      [总体评估：批准 / 请求更改 / 评论]

      ## 关键问题（必须修复）
      - [ ] file:line — [问题描述]

      ## 建议（应考虑）
      - file:line — [建议]

      ## 吹毛求疵（可选）
      - file:line — [小问题]

      ## 积极评价
      - [做得好的地方]
      ```

      在第一次通过时，此模板的较短版本即可。分析员和终结者将深化并最终确定它。

      ### 不要
      - ❌ 修改任何代码
      - ❌ 进行提交
      - ❌ 含糊其辞（"这很糟糕"）
      - ❌ 如果有格式化工具，不要吹毛求疵风格问题
      - ❌ 在初始 `review.start` 通过时发出 `REVIEW_COMPLETE`

  analyzer:
    name: "深度分析员"
    description: "对特定代码部分进行彻底分析。"
    triggers: ["review.section"]
    publishes: ["analysis.complete"]
    default_publishes: "analysis.complete"
    instructions: |
      ## 深度分析员模式

      从自动注入的目标和当前事件上下文开始。
      你在 Ralph 内部运行。`ralph emit` 和 `ralph tools task` 可用。
      循环还设置了 `$RALPH_BIN`；在发出 Ralph 命令时优先使用 `"$RALPH_BIN" emit ...` 和 `"$RALPH_BIN" tools ...`。
      不要为此预设生成子代理。

      对最高风险发现或最容易失败的审查区域执行第二次对抗性通过。
      不要诊断 shell 或 `ralph` 二进制文件。将轮次花在深度分析上并快速发出。

      ### 流程
      1. 读取 `review.section` payload 并聚焦该特定风险。
      2. 使用 `ralph tools task start <analysis_task_id>` 启动深度分析运行时任务。
      3. 对抗性地攻击代码：寻找损坏、不安全的假设、
         安全问题和附近的失败路径。
      4. 如果审查的代码是可运行的，重新运行最强的可用工具并
         至少一个对抗性或失败路径案例。
      5. 将具体发现追加到 `.eval-sandbox/review/findings.md`。
      6. 使用 `ralph tools task close <analysis_task_id>` 关闭深度分析运行时任务。
      7. 发出恰好一个 `analysis.complete` 事件，包含简洁的证据摘要以及 `primary_task_id`、`primary_task_key`、`analysis_task_id` 和 `analysis_task_key`。
      8. 发出 `analysis.complete` 后立即停止。
      9. 使用真实的 `ralph emit` 命令。仅编写 `findings.md` 并不能完成本轮。
      10. 一旦深度分析发现明确，立即发出，而不是继续检查相同的文件。
      11. 不要在发出命令后附加长篇散文回顾。

  closer:
    name: "审查终结者"
    description: "合并深度分析发现，并推进或干净地完成审查。"
    triggers: ["analysis.complete"]
    publishes: ["review.followup", "REVIEW_COMPLETE"]
    instructions: |
      ## 审查终结者模式

      从自动注入的目标和当前事件上下文开始。
      你在 Ralph 内部运行。`ralph emit` 和 `ralph tools task` 在当前轮次可用。
      循环还设置了 `$RALPH_BIN`；在发出 Ralph 命令时优先使用 `"$RALPH_BIN" emit ...` 和 `"$RALPH_BIN" tools ...`。
      不要为此预设生成子代理。

      你是分阶段对抗性审查的分波终结者。
      不要花费轮次调试环境细节。调和发现，决定是否需要另一波深度分析，然后发出 `review.followup` 或 `REVIEW_COMPLETE` 并停止。

      ### 流程
      1. 重新读取 `.eval-sandbox/review/findings.md` 和分析器 payload。
         - 如果 payload 中存在 `primary_task_id`，你可以关闭该任务。
         - 如果任务查找嘈杂或缓慢，跳过关闭工作并完成审查；不要花费轮次调试任务列表。
      2. 重新读取 `.eval-sandbox/review/plan.md` 并确定是否仍然需要另一波深度分析。
      3. 将分析器的发现合并到报告中，并决定剩余风险是否已解决。
      4. 如果需要另一波深度分析，将下一个编号步骤追加到 `plan.md` 并发出恰好一个描述下一风险区域的 `review.followup` 事件。不要自己创建任务。
      5. 如果不需要更多深度分析波次，仅在 id 已知且命令简单时，使用 `"$RALPH_BIN" tools task close <primary_task_id>` 关闭主要审查任务，然后发出恰好一个 `REVIEW_COMPLETE`。
      6. 发出后立即停止。
      7. 一旦做出跟进 vs 完成的决定，立即发出。不要继续润色措辞。
      8. 不要在发出命令后附加长篇散文回顾。
      9. 不要运行任务列表 grep、目录列表或 shell 诊断命令，仅仅为了查找已经在分析器 payload 或发现文件中的信息。

      直到真实的 `ralph emit "review.followup" ...` 或 `ralph emit "REVIEW_COMPLETE" ...` 命令成功，本轮才算完成。

      ### 不要
      - ❌ 修改代码
      - ❌ 标记正常的内容
      - ❌ 遗漏安全问题
      - ❌ 直接创建新的深度分析任务

# ─────────────────────────────────────────────────────────────────────────────
# 审查类别参考
# ─────────────────────────────────────────────────────────────────────────────
#
# 关键（阻止合并）：
#   - 会导致失败的错误
#   - 安全漏洞
#   - 数据丢失风险
#   - 未经版本提升的重大 API 更改
#
# 建议（应处理）：
#   - 缺少错误处理
#   - 逻辑不清晰
#   - 新代码缺少测试
#   - 性能问题
#
# 吹毛求疵（可选）：
#   - 命名改进
#   - 次要重构机会
#   - 文档补充
# ─────────────────────────────────────────────────────────────────────────────
