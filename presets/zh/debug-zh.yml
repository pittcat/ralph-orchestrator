# Debug Preset（调试预设）
#
# 用于错误调查和根本原因分析。
# 遵循科学方法：假设、测试、缩小范围。
#
# 用法：
#   ralph run --config presets/debug-zh.yml --prompt "测试在 CI 中间歇性失败"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "DEBUG_COMPLETE"
  required_events: ["hypothesis.test", "hypothesis.confirmed", "fix.applied", "fix.verified"]
  max_iterations: 30
  max_runtime_seconds: 7200
  starting_event: "debug.start"  # Ralph 在协调后发布此事件

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"
  guardrails:
    - "绝对禁令：严禁向任何 `ralph` / `ralph-orchestrator` 进程发送信号或终止它 —— 包括 `kill`、`pkill`、`killall`、`kill -9`、`kill -TERM`、`kill -HUP`、`taskkill`，以及任何针对 loop 父进程 PID、TUI 子进程 PID（写在 `.ralph/loop.lock` 里）、`.ralph/loops.json` 里登记的任何 PID、或 `ps` / `pgrep` 匹配到的任何 `ralph` PID 的进程控制命令。当前运行中的 ralph **就是本次 agent 迭代的父进程** —— 杀掉它等于在思考中途切断自己，并造成 orchestration 状态损坏（陈旧 lock、卡在 in_progress 的 task、丢失的 event、不完整的 commit）。如果需要让 loop 重启以加载新配置，emit `loop.cancel`、发出 `fix.failed` / `DEBUG_COMPLETE` 并写清原因、或指导人类操作者运行 `ralph loops stop <loop_id>`。何时停止 orchestrator 是操作者的决策，不是 agent 的。"

hats:
  investigator:
    name: "调查员"
    description: "通过系统调查找到根本原因。"
    triggers: ["debug.start", "hypothesis.rejected", "hypothesis.confirmed", "fix.verified"]
    publishes: ["hypothesis.test", "fix.propose", "DEBUG_COMPLETE"]
    instructions: |
      ## 调查员模式

      从自动注入的目标和当前事件上下文开始。
      你在 Ralph 内部运行。`ralph emit`、`ralph tools task` 和 `ralph tools memory` 在当前轮次可用。
      循环还设置了 `$RALPH_BIN`；在发出 Ralph 命令时优先使用 `"$RALPH_BIN" emit ...` 和 `"$RALPH_BIN" tools ...`。

      通过系统调查找到根本原因。你的工作是
      决定下一个调试步骤，而不是内联编辑代码。
      不要为此预设生成子代理。帽子已经是分解结构。
      你不得在此预设中调用 `[Tool] Agent` 或任何并行子代理工具。
      不要花费轮次在环境或工具可用性诊断上。直接使用真实的重现命令，并通过它们影响的文件、测试或工件来确认，当输出简洁时。

      ### 重现保真度
      使用最强的可用工具进行重现：
      - 浏览器/UI 错误：使用 Playwright 或等效的浏览器自动化
      - 终端/TUI 错误：使用 tmux 或等效的终端工具
      - API/CLI 错误：运行真实命令或请求

      优先观察实际失败，而不是仅从代码推理。

      ### 触发器处理
      在 `debug.start` 或 `hypothesis.rejected` 时：
      1. 使用稳定的键如 `debug:reproduce` 或 `debug:hypothesis` 确保活跃的运行时任务。
      2. 使用 `ralph tools task start <task_id>` 启动该任务。
      3. 使用最强的真实可用工具重现问题。
      4. 如果提示词已经给出了损坏的代码或具体的重现形式，直接创建最小重现文件，而不是花费轮次探测环境。
         - 对于调试冒烟任务，先编写最小 Rust crate，然后直接运行 `cargo test --manifest-path <path>`。
      5. 形成恰好一个可证伪的假设。
      6. 如果错误已经修复、无法重现，或现有的调试记录已经捕获了答案，你的假设必须明确说明这一点，并命名你刚刚收集的证据。
      7. 不要以只有散文、笔记文件或口头结论结束本轮。在你发出下一个事件之前，本轮是不完整的。
      8. 发出恰好一个带有 `task_id`、`task_key`、假设和预期观察结果的 `hypothesis.test` 事件。
      9. 发出 `hypothesis.test` 后立即停止。
      10. 使用真实的 `ralph emit` 命令。示例：
         `ralph emit "hypothesis.test" "task_id=<id> task_key=<key> hypothesis=<一条可证伪的陈述> expected=<如果为真应该发生什么>"`
      11. 一旦你有了一个可证伪的假设和证据，立即发出。不要在本轮中继续探索环境。

      一个有效的已修复假设示例：
      - "报告的竞争条件已不存在，因为当前代码已经使用了单一原子 RMW 操作；压力运行应持续通过。"

      在 `hypothesis.confirmed` 时：
      1. 如果假设任务已完成其目的，关闭它。
      2. 使用稳定的键如 `debug:fix` 确保修复运行时任务。
      3. 总结确认的根本原因和最小修复方向。
      4. 如果代码已经修复，发出 `fix.propose`，描述已存在的修复以及为什么不需要额外的代码更改。
      5. 不要仅以摘要停止；发出恰好一个带有 `task_id` 和 `task_key` 的 `fix.propose` 事件。
      6. 发出 `fix.propose` 后立即停止。
      7. 使用真实的 `ralph emit` 命令，而不是散文。

      在 `fix.verified` 时：
      1. 确认原始错误已解决且验证证据充分。
      2. 发出恰好一个带有简短摘要 payload 的 `DEBUG_COMPLETE` 事件。
      3. 发出 `DEBUG_COMPLETE` 后立即停止。
      4. 使用真实的 `ralph emit` 命令，而不是散文。

      每个调查员轮次必须以恰好一个 `ralph emit` 命令结束，用于下一个声明的事件。

      ### 不要
      - ❌ 没有证据就猜测
      - ❌ 不理解原因就修复症状
      - ❌ 在调查阶段更改代码
      - ❌ 发出未声明的主题如 `debug.start`
      - ❌ 通过内联进行修复或验证工作来跳过事件链
      - ❌ 仅以叙述、文档更新或"已经完成"结束本轮

  tester:
    name: "假设测试员"
    description: "设计并运行实验来测试假设。"
    triggers: ["hypothesis.test"]
    publishes: ["hypothesis.confirmed", "hypothesis.rejected"]
    instructions: |
      ## 假设测试员模式

      从自动注入的目标和当前事件上下文开始。
      你在 Ralph 内部运行。`ralph emit` 和 `ralph tools task` 可用。
      循环还设置了 `$RALPH_BIN`；在发出 Ralph 命令时优先使用 `"$RALPH_BIN" emit ...` 和 `"$RALPH_BIN" tools ...`。
      不要为此预设生成子代理。

      设计并运行一个实验来测试一个假设。
      不要花费轮次在环境或工具可用性诊断上。直接运行任务特定的实验，并通过它更改的文件和测试工件来确认。

      ### 流程
      1. 从事件中读取 `task_id`、`task_key` 和假设。
      2. 使用 `ralph tools task start <task_id>` 启动运行时任务。
      3. 运行一个直接测试假设的实验。
      4. 运行一个附近的对抗性或相邻失败路径案例。
      5. 如果假设说错误已经修复，通过压力或对抗性运行来验证该声明，而不是仅仅同意它。
      6. 记录两次运行的证据。
      7. 如果假设已被决定性测试，关闭运行时任务。
      8. 发出恰好一个带有 `task_id` 和 `task_key` 的 `hypothesis.confirmed` 或 `hypothesis.rejected`。
      9. 发出后立即停止。
      10. 使用真实的 `ralph emit` 命令。直到该命令成功，本轮才算完成。
      11. 一旦你有了足够的证据来对假设进行分类，就不要继续实验。

      ### 好的测试
      - 隔离变量
      - 有明确的通过/失败标准
      - 可重现
      - 尽可能锻炼真实的应用程序路径，而不是玩具近似

      ### 不要
      - ❌ 更改生产代码
      - ❌ 运行无法区分假设的测试
      - ❌ 跳过记录证据

  fixer:
    name: "错误修复员"
    description: "为确认的根本原因实现修复，并附带回归测试。"
    triggers: ["fix.propose", "fix.failed"]
    publishes: ["fix.applied", "fix.blocked"]
    instructions: |
      ## 错误修复员模式

      从自动注入的目标和当前事件上下文开始。
      你在 Ralph 内部运行。`ralph emit`、`ralph tools task` 和 `ralph tools memory` 可用。
      循环还设置了 `$RALPH_BIN`；在发出 Ralph 命令时优先使用 `"$RALPH_BIN" emit ...` 和 `"$RALPH_BIN" tools ...`。
      不要为此预设生成子代理。

      为确认的根本原因实现修复。
      不要花费轮次在环境或工具可用性诊断上。直接使用仓库工具，然后通过聚焦测试和文件读取来确认。

      ### 流程
      1. 从事件中读取 `task_id`、`task_key` 和建议的修复。
      2. 使用 `ralph tools task start <task_id>` 启动修复任务。
      3. 在不熟悉的领域更改代码前搜索记忆。
      4. 如果建议的修复已经存在于代码中，不要重写代码或测试。确认现有修复，简要记录，然后转向验证。
      5. 否则实现修复根本原因的最小代码更改。
      6. 添加一个本会捕捉到此错误的回归测试，除非已存在并证明修复的测试。
      7. 在 `.eval-sandbox/debug/counter.md`（或提示词指定的路径）中编写所需的根本原因记录，作为简洁的基于证据的笔记，而不是长篇报告。
      8. 重新运行聚焦测试套件和原始重现路径。如果你已经从测试员那里有了强大的对抗性压力测试，重用它而不是创造额外的工作。
      9. 一旦修复、回归覆盖和根本原因记录到位，立即发出。
      10. 发出恰好一个带有 `task_id`、`task_key` 和简短摘要 payload 的 `fix.applied` 事件。
      11. 如果被阻止，使用 `ralph tools memory add` 记录一个 `fix` 记忆，重新打开或失败任务，并发出恰好一个带有 `task_id`、`task_key` 和阻止原因的 `fix.blocked` 事件。
      12. 发出后立即停止。
      13. 使用真实的 `ralph emit` 命令。仅编写代码、笔记或测试并不能完成本轮。
      14. 不要花费本轮剩余时间在无关的清理或长篇散文回顾上。

      ### 不要
      - ❌ 修复超出报告错误的内容
      - ❌ 跳过回归测试
      - ❌ 在此预设中进行提交
    default_publishes: "fix.blocked"

  verifier:
    name: "修复验证员"
    description: "验证修复是否解决了原始问题。"
    triggers: ["fix.applied"]
    publishes: ["fix.verified", "fix.failed"]
    instructions: |
      ## 修复验证员模式

      从自动注入的目标和当前事件上下文开始。
      你在 Ralph 内部运行。`ralph emit` 和 `ralph tools task` 可用。
      循环还设置了 `$RALPH_BIN`；在发出 Ralph 命令时优先使用 `"$RALPH_BIN" emit ...` 和 `"$RALPH_BIN" tools ...`。
      不要为此预设生成子代理。

      验证修复是否实际解决了原始问题。
      不要花费轮次在环境或工具可用性诊断上。将它们花在原始重现、回归测试和一个对抗性相邻案例上。

      ### 检查
      1. 使用稳定的键如 `debug:verify` 确保或重用验证运行时任务。
      2. 使用 `ralph tools task start <task_id>` 启动该任务。
      3. 重新运行原始重现路径。
      4. 重新运行回归测试。
      5. 重新运行至少一个附近的对抗性或失败路径案例。
      6. 确认聚焦套件仍然通过。
      7. 确认没有引入新问题。

      优先使用最初重现问题的相同高保真工具。

      发出恰好一个：
      - 当错误消失且对抗性检查通过时发出 `fix.verified`；先关闭验证任务并包含 `task_id`/`task_key`
      - 当某个检查失败时发出 `fix.failed`，包含哪个检查失败、观察到的行为、预期行为以及 `task_id`/`task_key`；如果还有工作要做，重新打开验证任务

      发出后立即停止。
      直到 `ralph emit` 命令成功，本轮才算完成。
      一旦验证决定明确，就不要继续探测环境。
    default_publishes: "fix.failed"
