# Hatless Baseline 预设
#
# 一个控制预设，没有 hat —— 在没有 hat 委托的情况下测试核心 Ralph 循环。
# 用作基线，以区分核心循环问题和 hat 特定的 bug。
#
# 行为：Ralph 直接工作，不委托给专门的 hat。
# 这验证：事件循环、完成检测、基本工具使用。
#
# 用法：
#   ralph run --config presets/hatless-baseline-zh.yml --prompt "实现一个 fibonacci 函数"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 20
  max_runtime_seconds: 900
  starting_event: "task.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"
  guardrails:
    - "绝对禁令：严禁向任何 `ralph` / `ralph-orchestrator` 进程发送信号或终止它 —— 包括 `kill`、`pkill`、`killall`、`kill -9`、`kill -TERM`、`kill -HUP`、`taskkill`，以及任何针对 loop 父进程 PID、TUI 子进程 PID（写在 `.ralph/loop.lock` 里）、`.ralph/loops.json` 里登记的任何 PID、或 `ps` / `pgrep` 匹配到的任何 `ralph` PID 的进程控制命令。当前运行中的 ralph **就是本次 agent 迭代的父进程** —— 杀掉它等于在思考中途切断自己，并造成 orchestration 状态损坏（陈旧 lock、丢失的 event）。如果需要让 loop 重启以加载新配置，emit `LOOP_COMPLETE` 或指导人类操作者运行 `ralph loops stop <loop_id>`。何时停止 orchestrator 是操作者的决策，不是 agent 的。"

# 没有 HAT —— Ralph 直接工作，不委托
# 这是基线测试的故意设计
