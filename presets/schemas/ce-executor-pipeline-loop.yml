# Authoring SSOT for `ce-executor-pipeline-loop` `event_policy.schemas`.
#
# 2026-07-09-001 plan U8: this file is the schema SSOT for the
# high-risk review/fix convergence topics. build.rs deep-merges
# this file's `schemas:` mapping into the inline
# `event_policy.schemas:` block of
# `presets/en/ce-executor-pipeline-loop.yml`. Authors who want
# to change the field set MUST edit this file; the inline
# `schemas:` block in the preset YAML is the runtime-side
# view that ends up in the embedded copy. If the inline block
# already declares the same topic, the merge is additive —
# required_fields / allowed_values / element_constraints from
# SSOT are base, inline is override.
#
# U8 pilot scope: 5 review/fix convergence topics get
# `field_docs` + `examples` so the U3 enrichment layer
# (policy-check error items) and the U6 schema-aware prompt
# section both work for these topics. Other topics
# (work.done, plan.ready, dimension events) keep the
# required_fields-only shape so this pilot is small enough
# to validate end-to-end without a `field_docs` rewrite
# across the whole preset.
#
# Field docs vocabulary is intentionally narrow — we only
# document the high-traffic fields that the agent must
# understand (review_round, must_fix_now_count,
# residual_findings_count, fix_plan_file, etc.). Anything
# else stays on the required-field-only path.

schemas:
  # 2026-07-16 plan U1 (Plan Reviewer unified contract):
  # plan.ready and plan.blocked gain the ce-unified-plan/v1
  # normalized-artifact fields. The semantic-recognition guarantee
  # belongs to plan-reviewer's agent instructions; the runtime only
  # enforces (a) every plan.ready/blocked event carries a stable
  # plan identity (`plan_name` + `plan_path`), (b) a non-empty
  # contract version literal, and (c) on the blocked path a
  # `normalized_plan_file` that is either empty (no fake-ready
  # artifact) or omitted. Field docs describe semantics; presence is
  # the SSOT contract.
  plan.ready:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
    field_docs:
      plan_contract_version:
        meaning: "literal version tag of the ce-unified-plan contract the agent produced; first published version is 'ce-unified-plan/v1'"
        source: "plan-reviewer"
        fill_rule: "literal string; do NOT hand-write; treat as a contract identifier pinned by the preset"
      normalized_plan_file:
        meaning: "absolute or repo-relative path to the Plan Reviewer's semantic projection of the source plan (goal/scope/Requirements/Scenarios/Units/verification gates/tracing); the canonical artifact downstream hats read"
        source: "plan-reviewer writes it via the Write tool before emit"
        fill_rule: "non-empty path under .ralph/agent/normalized/<plan_name>.md; do NOT make up a path — write the file first"
      plan_contract_digest:
        meaning: "hex digest binding the source plan content and the normalized_plan_file together; downstream anchors compare the digest rather than re-reading the source plan"
        source: "plan-reviewer computes over plan_path + normalized_plan_file"
        fill_rule: "16-64 hex chars; do NOT hand-write; recompute on every emit attempt"
      trace_file:
        meaning: "absolute or repo-relative path to the append-only Requirement→Scenario→Unit tracking file the agent opens on first ready emit and updates across the loop"
        source: "plan-reviewer writes it via the Write tool before emit"
        fill_rule: "non-empty path under .ralph/agent/trace/<plan_name>.md; do NOT make up a path — write the file first"
  plan.blocked:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "reason"
      - "plan_contract_version"
      - "plan_contract_digest"
      - "semantic_gaps"
      - "report_input_file"
    field_docs:
      report_input_file:
        meaning: "repo-relative path to the atomically published reporter input bundle"
        source: "plan-reviewer writes and reopens the bundle before emitting plan.blocked"
        fill_rule: "copy the final repo-relative path; never emit a temporary, missing, stale, or absolute path"
      plan_contract_version:
        meaning: "literal version tag of the ce-unified-plan contract the agent was operating under; first published version is 'ce-unified-plan/v1'"
        source: "plan-reviewer"
        fill_rule: "literal 'ce-unified-plan/v1'; the contract applies on the blocked path too so downstream audit can pin the rejection against the right version"
      plan_contract_digest:
        meaning: "hex digest of the source plan only (no normalized_plan_file digest on the blocked path; the rejection forbids a fake-ready artifact)"
        source: "plan-reviewer computes over plan_path"
        fill_rule: "16-64 hex chars; do NOT hand-write"
      semantic_gaps:
        meaning: "non-empty list of semantic capability gaps that prevented acceptance (missing observable outcomes, missing per-Unit verification, missing completion gate, ambiguous scope, contradictory requirements, etc.); each entry names ONE capability the agent could not recover in-place"
        source: "plan-reviewer"
        fill_rule: "non-empty array of strings; never empty when plan.blocked is emitted for semantic reasons; pure file-error paths (plan_file_not_found / plan_file_unreadable) may emit semantic_gaps: [\"<file-error-code>\"] but the array must remain present and non-empty"
      normalized_plan_file:
        meaning: "reserved field on the blocked path; MUST be empty string OR omitted — the contract forbids a non-empty normalized_plan_file when plan-reviewer rejected the plan"
        source: "plan-reviewer"
        fill_rule: "always empty string (\"\") or absent; never a real path; a non-empty value is a contract violation and downstream alignment MUST treat it as a fake-ready artifact"

  review.synthesized:
    # 2026-07-09-003 plan (U6): declare `trigger_context` for the
    # review-gate hat so the downstream isolated prompt block surfaces
    # the gate-driving counts and routing hints instead of asking the
    # agent to re-derive them from the full payload. `known_fields`
    # widens the reference surface for hint conditions that read
    # `synthesized_review_file` / `round_base_sha` / `diff_patch_file`,
    # which are required for the fix round but are pass-through fields
    # rather than gate decisions. Summary field order matches the
    # agent's scan order: round, fix-now count, blocking count,
    # residual count, decision basis, verdict, then supporting paths.
    known_fields:
      - "round_base_sha"
      - "diff_patch_file"
      - "synthesized_review_file"
    trigger_context:
      summary_fields:
        - "review_round"
        - "must_fix_now_count"
        - "blocking_main_conflict_count"
        - "residual_findings_count"
        - "loop_decision_basis"
        - "verdict"
        - "synthesized_review_file"
      routing_hints:
        - label: "accept_or_residual_report_only"
          conditions:
            - field: "blocking_main_conflict_count"
              op: "eq"
              value: 0
          guidance: "If blocking_main_conflict_count == 0: emit only review.accepted. Any residual P0/P1 findings are report-only; do not open another fix round for them."
        - label: "must_fix_only"
          conditions:
            - field: "blocking_main_conflict_count"
              op: "gt"
              value: 0
          guidance: "If blocking_main_conflict_count > 0 and review_round < 6: emit only fix.requested and treat only must_fix_now findings as actionable; ignore residual_findings_count for fix planning."
        - label: "max_round_blocked"
          conditions:
            - field: "review_round"
              op: "gte"
              value: 6
            - field: "blocking_main_conflict_count"
              op: "gt"
              value: 0
          guidance: "If review_round >= 6 and blocking_main_conflict_count > 0: emit only review.loop.blocked with max_review_rounds: 6. Do not request another fix round."
    required_fields:
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "stabilization_audit_file"
      - "correction_ids"
      - "plan_name"
      - "plan_path"
      - "executor_head_sha"
      - "resolved_baseline_sha"
      - "review_round"
      - "round_base_sha"
      - "diff_patch_file"
      - "synthesized_review_file"
      - "findings_count"
      - "p0_count"
      - "p1_count"
      - "must_fix_now_count"
      - "main_conflict_count"
      - "unfixed_previous_count"
      - "new_regression_p0_count"
      - "newly_discovered_residual_count"
      - "blocking_main_conflict_count"
      - "residual_findings_count"
      - "findings_summary"
      - "loop_decision_basis"
      - "verdict"
    field_docs:
      plan_contract_version:
        meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
        source: "review-synthesizer carries forward from plan.ready"
        fill_rule: "literal copy; do NOT recompute"
      normalized_plan_file:
        meaning: "canonical semantic projection of the source plan that downstream hats read"
        source: "review-synthesizer carries forward from plan.ready"
        fill_rule: "literal copy; do NOT make up a path"
      plan_contract_digest:
        meaning: "hex digest binding the source plan and normalized_plan_file for this execution chain"
        source: "review-synthesizer carries forward from plan.ready"
        fill_rule: "literal copy; do NOT recompute"
      trace_file:
        meaning: "append-only requirement→scenario→unit trace file for this plan"
        source: "review-synthesizer carries forward from plan.ready"
        fill_rule: "literal copy; do NOT make up a path"
      review_round:
        meaning: "current convergence round (1..max_review_rounds); review-synthesizer increments"
        source: "review-synthesizer reads it from .ralph/review/<plan>/round-<n>/"
        fill_rule: "do NOT hand-write; copy the round directory name"
      synthesized_review_file:
        meaning: "path to the synthesized review file written by review-synthesizer"
        source: "review-synthesizer"
        fill_rule: "absolute path; do NOT make up a filename"
      must_fix_now_count:
        meaning: "findings classified as must_fix_now in this round; not every current-round P0/P1 is automatically a blocking loop obligation"
        source: "review-synthesizer computes from p0/p1"
        fill_rule: "integer; use blocking_main_conflict_count for the gate decision"
      main_conflict_count:
        meaning: "current findings that are the loop's main conflict: initial review P0/P1, unfixed previous obligations, or current-fix P0 regressions"
        source: "review-synthesizer classifies findings from the synthesized table and current round context"
        fill_rule: "integer; count only findings that should drive this loop, not all severe residuals"
      unfixed_previous_count:
        meaning: "prior fix-plan obligations that are still not closed in this review round"
        source: "review-synthesizer compares current findings with previous fix-plan / fix.done fixed_findings"
        fill_rule: "integer; 0 when all prior obligations are closed"
      new_regression_p0_count:
        meaning: "P0 findings clearly introduced by the current fix diff"
        source: "review-synthesizer checks evidence against the current fix diff range"
        fill_rule: "integer; evidence must point to the current fix diff, otherwise classify as residual"
      newly_discovered_residual_count:
        meaning: "new severe findings discovered after round 1 that are not current-fix regressions and therefore report-only"
        source: "review-synthesizer"
        fill_rule: "integer; these do not keep the loop open"
      blocking_main_conflict_count:
        meaning: "gate-driving count; if > 0 review-gate requests fixes or blocks at max rounds, if 0 review-gate accepts"
        source: "review-synthesizer"
        fill_rule: "integer; usually main_conflict_count, and must exclude report-only residuals"
      residual_findings_count:
        meaning: "findings kept in the report but not blocking the loop (baseline / out-of-scope / newly discovered)"
        source: "review-synthesizer"
        fill_rule: "integer; 0 means nothing left to report"
      loop_decision_basis:
        meaning: "short explanation of why the loop should continue or close"
        source: "review-synthesizer"
        fill_rule: "one short sentence; mention main conflict closure, unfixed prior obligations, or current-fix regression evidence"
      verdict:
        meaning: "final decision for the topic"
        source: "review-synthesizer"
        fill_rule: "one of pass, blocked, failed"
    examples:
      - plan_name: "2026-07-09-001-feat-policy-check-agent-feedback-plan"
        plan_path: "docs/plans/2026-07-09-001-feat-policy-check-agent-feedback-plan.md"
        review_round: 1
        must_fix_now_count: 2
        main_conflict_count: 2
        unfixed_previous_count: 0
        new_regression_p0_count: 0
        newly_discovered_residual_count: 0
        blocking_main_conflict_count: 2
        residual_findings_count: 0
        loop_decision_basis: "round 1 P0/P1 findings are initial main-conflict obligations"
        verdict: "blocked"

  review.accepted:
    # 2026-07-09-003 plan (U6): alignment consumes this topic. Surface
    # the verdict, gate-driving count, residual count, and decision
    # basis so the alignment agent does not have to re-derive
    # "why this round was accepted" from the full payload.
    trigger_context:
      summary_fields:
        - "review_round"
        - "must_fix_now_count"
        - "blocking_main_conflict_count"
        - "residual_findings_count"
        - "loop_decision_basis"
        - "verdict"
      routing_hints:
        - label: "alignment_after_acceptance"
          conditions:
            - field: "blocking_main_conflict_count"
              op: "eq"
              value: 0
          guidance: "If blocking_main_conflict_count == 0: the review round has been accepted. residual_findings_count is report-only context; do not open another fix round from alignment. Record residuals and emit align.done."
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "review_round"
      - "executor_head_sha"
      - "resolved_baseline_sha"
      - "p0_count"
      - "p1_count"
      - "must_fix_now_count"
      - "main_conflict_count"
      - "blocking_main_conflict_count"
      - "residual_findings_count"
      - "loop_decision_basis"
      - "verdict"
    field_docs:
      plan_contract_version:
        meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
        source: "review-gate"
        fill_rule: "literal copy; do NOT recompute"
      normalized_plan_file:
        meaning: "canonical semantic projection of the source plan that downstream hats read"
        source: "review-gate"
        fill_rule: "literal copy; do NOT make up a path"
      plan_contract_digest:
        meaning: "hex digest binding the source plan and normalized_plan_file for this execution chain"
        source: "review-gate"
        fill_rule: "literal copy; do NOT recompute"
      trace_file:
        meaning: "append-only requirement→scenario→unit trace file for this plan"
        source: "review-gate"
        fill_rule: "literal copy; do NOT make up a path"
      must_fix_now_count:
        meaning: "accepted review has no remaining blocking loop obligations"
        source: "review-gate"
        fill_rule: "must be 0 when closing the loop"
      main_conflict_count:
        meaning: "main-conflict findings that remain after review-gate decision"
        source: "review-gate"
        fill_rule: "must be 0 on review.accepted"
      blocking_main_conflict_count:
        meaning: "gate-driving count; accepted only when this is 0 even if residual P0/P1 findings remain"
        source: "review-gate"
        fill_rule: "must be 0"
      loop_decision_basis:
        meaning: "short explanation of why residuals do not keep the loop open"
        source: "review-gate"
        fill_rule: "one short sentence"
      verdict:
        meaning: "must equal 'pass' on this topic; the review-gate never accepts with anything else"
        source: "review-gate"
        fill_rule: "literal string 'pass'"

  fix.requested:
    # 2026-07-09-003 plan (U6): fix-planner consumes this topic.
    # Surface the gate-driving count, must-fix count, residual count,
    # and supporting round paths so fix-planner only acts on must-fix
    # findings and never creates Units for residual report-only items.
    known_fields:
      - "round_base_sha"
      - "diff_patch_file"
      - "synthesized_review_file"
    trigger_context:
      summary_fields:
        - "review_round"
        - "must_fix_now_count"
        - "blocking_main_conflict_count"
        - "residual_findings_count"
        - "loop_decision_basis"
        - "synthesized_review_file"
        - "diff_patch_file"
      routing_hints:
        - label: "fix_planner_must_fix_only"
          conditions:
            - field: "blocking_main_conflict_count"
              op: "gt"
              value: 0
          guidance: "If blocking_main_conflict_count > 0: write a full fix plan with one Unit per must_fix_now finding. residual_findings_count is report-only; do not create fix Units for residual findings."
    required_fields:
      - "plan_name"
      - "plan_path"
      - "review_round"
      - "executor_head_sha"
      - "resolved_baseline_sha"
      - "round_base_sha"
      - "diff_patch_file"
      - "synthesized_review_file"
      - "p0_count"
      - "p1_count"
      - "must_fix_now_count"
      - "main_conflict_count"
      - "unfixed_previous_count"
      - "new_regression_p0_count"
      - "newly_discovered_residual_count"
      - "blocking_main_conflict_count"
      - "residual_findings_count"
      - "findings_summary"
      - "loop_decision_basis"
      - "verdict"
    field_docs:
      round_base_sha:
        meaning: "git SHA at the start of the current review round (fixer rebases onto this)"
        source: "review-gate"
        fill_rule: "40-char git SHA; do NOT hand-write"
      diff_patch_file:
        meaning: "path to the round-N diff patch (review.* and fix.* are diff-locked to this)"
        source: "review-gate / loop runner"
        fill_rule: "absolute path under .ralph/review/<plan>/round-<n>/"
      must_fix_now_count:
        meaning: "findings that the synthesizer marked must_fix_now for this round"
        source: "review-gate"
        fill_rule: "integer >= 1 when blocking_main_conflict_count > 0"
      blocking_main_conflict_count:
        meaning: "gate-driving count for the requested fix round"
        source: "review-gate"
        fill_rule: "integer >= 1; do not request fixes for report-only residuals"
      loop_decision_basis:
        meaning: "short explanation of why the loop is still blocked"
        source: "review-gate"
        fill_rule: "one short sentence"
      verdict:
        meaning: "must equal 'blocked' on this topic; review-gate never requests fixes for a passing review"
        source: "review-gate"
        fill_rule: "literal string 'blocked'"

  review.complete:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "review_round"
      - "executor_head_sha"
      - "resolved_baseline_sha"
      - "fix_base_sha"
      - "fix_plan_file"
      - "findings_count"
      - "p0_count"
      - "p1_count"
      - "must_fix_now_count"
      - "main_conflict_count"
      - "unfixed_previous_count"
      - "new_regression_p0_count"
      - "newly_discovered_residual_count"
      - "blocking_main_conflict_count"
      - "residual_findings_count"
      - "findings_summary"
      - "loop_decision_basis"
      - "verdict"
    field_docs:
      plan_contract_version:
        meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
        source: "fix-planner carries forward from review.synthesized"
        fill_rule: "literal copy; do NOT recompute"
      normalized_plan_file:
        meaning: "canonical semantic projection of the source plan that downstream hats read"
        source: "fix-planner carries forward from review.synthesized"
        fill_rule: "literal copy; do NOT make up a path"
      plan_contract_digest:
        meaning: "hex digest binding the source plan and normalized_plan_file for this execution chain"
        source: "fix-planner carries forward from review.synthesized"
        fill_rule: "literal copy; do NOT recompute"
      trace_file:
        meaning: "append-only requirement→scenario→unit trace file for this plan"
        source: "fix-planner carries forward from review.synthesized"
        fill_rule: "literal copy; do NOT make up a path"
      fix_plan_file:
        meaning: "path to the fix plan written by fix-planner; fixer reads ONLY this file (not the original plan)"
        source: "fix-planner"
        fill_rule: "absolute path under .ralph/review/<plan>/round-<n>/"
      fix_base_sha:
        meaning: "git SHA the fixer should rebase onto before applying the fix plan"
        source: "fix-planner"
        fill_rule: "40-char git SHA; do NOT hand-write"
      blocking_main_conflict_count:
        meaning: "number of actionable main-conflict findings represented by the fix plan"
        source: "fix-planner"
        fill_rule: "integer >= 1 for full fix plans; 0 only for defensive placeholder plans"

  fix.done:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "review_round"
      - "executor_head_sha"
      - "resolved_baseline_sha"
      - "fixed_from_sha"
      - "head_sha"
      - "fix_plan_file"
      - "review_verdict"
      - "fixes_applied"
      - "fixes_skipped"
      - "planned_fix_units"
      - "attempted_fix_units"
      - "completed_fix_units"
      - "skipped_fix_units"
      - "failed_fix_units"
      - "blocked_fix_units"
      - "fix_attempt_commit_sha"
      - "worktree_status"
      - "fix_status"
      - "failure_reason"
      - "decisions_file"
      - "baseline_verification_status"
      - "baseline_verification_file"
      - "post_verification_status"
      - "post_verification_file"
      - "verification_delta_file"
      - "baseline_existing_count"
      - "new_business_regressions_count"
      - "test_compatibility_updates_count"
      - "flaky_or_environmental_count"
      - "fix_summary"
      - "next_review_plan"
    field_docs:
      plan_contract_version:
        meaning: "literal version tag of the ce-unified-plan contract carried through from plan.ready"
        source: "fixer carries forward from review.complete"
        fill_rule: "literal copy; do NOT recompute"
      normalized_plan_file:
        meaning: "canonical semantic projection of the source plan that downstream hats read"
        source: "fixer carries forward from review.complete"
        fill_rule: "literal copy; do NOT make up a path"
      plan_contract_digest:
        meaning: "hex digest binding the source plan and normalized_plan_file for this execution chain"
        source: "fixer carries forward from review.complete"
        fill_rule: "literal copy; do NOT recompute"
      trace_file:
        meaning: "append-only requirement→scenario→unit trace file for this plan"
        source: "fixer carries forward from review.complete"
        fill_rule: "literal copy; do NOT make up a path"
      fix_status:
        meaning: "outcome of this fixer attempt; fix.done means the fixer is handing off a complete attempt report, not necessarily claiming all fixes succeeded"
        source: "fixer"
        fill_rule: "one of applied, partial, blocked"
      failure_reason:
        meaning: "short reason when fix_status is partial or blocked; empty string only when fix_status is applied"
        source: "fixer verification / subagent result / blocker notes"
        fill_rule: "one short sentence explaining the unfinished Unit, failed verification, or blocker"
      failed_fix_units:
        meaning: "actionable fix Units attempted but not completed successfully"
        source: "fixer per-Unit execution log"
        fill_rule: "array of U tokens; [] only when no Unit failed"
      attempted_fix_units:
        meaning: "actionable fix Units for which a Unit subagent was actually dispatched and returned"
        source: "main fixer's per-Unit dispatch log in decisions_file"
        fill_rule: "array of U tokens; failed_fix_units must be a subset"
      blocked_fix_units:
        meaning: "unattempted actionable fix Units blocked by an explicit dependency on an actually failed fix Unit"
        source: "Dependencies fields in fix_plan_file plus failed_fix_units"
        fill_rule: "array of U tokens; record every dependency edge in decisions_file"
      decisions_file:
        meaning: "fix execution ledger containing dispatch, acceptance, commit, failure, and dependency evidence"
        source: "fixer writes .ralph/agent/decisions.md"
        fill_rule: "literal .ralph/agent/decisions.md"
      fix_attempt_commit_sha:
        meaning: "git commit SHA that captures this fixer attempt, including partial or blocked attempt evidence when changes were made"
        source: "git rev-parse HEAD after the final fixer commit"
        fill_rule: "40-char git SHA; if no files changed, use the unchanged HEAD and explain in failure_reason"
      worktree_status:
        meaning: "final git worktree state after fixer commits or reverts the attempt"
        source: "git status --porcelain --untracked-files=all (excluding .ralph/)"
        fill_rule: "clean on successful handoff; dirty only when fix_status is blocked on unowned residual dirt — never fabricate clean"
      baseline_verification_file:
        meaning: "baseline verification snapshot for this fixer round"
        source: "baseline-verifier subagent"
        fill_rule: "absolute path under .ralph/review/<plan>/round-<n>/"
      post_verification_file:
        meaning: "final verification snapshot for this fixer round"
        source: "delta-verifier subagent"
        fill_rule: "absolute path under .ralph/review/<plan>/round-<n>/"
      verification_delta_file:
        meaning: "delta between the baseline snapshot and final verification for this fixer round"
        source: "delta-verifier subagent"
        fill_rule: "absolute path under .ralph/review/<plan>/round-<n>/"
    examples:
      - plan_name: "2026-06-20-001-feat-python-sort-algorithms-plan"
