  review.loop.blocked:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "review_round"
      - "max_review_rounds"
      - "executor_head_sha"
      - "resolved_baseline_sha"
      - "p0_count"
      - "p1_count"
      - "must_fix_now_count"
      - "main_conflict_count"
      - "blocking_main_conflict_count"
      - "residual_findings_count"
      - "loop_decision_basis"
      - "reason"
      - "report_input_file"
    field_docs:
      report_input_file:
        meaning: "repo-relative path to the atomically published reporter input bundle"
        source: "review-gate writes and reopens the bundle before emitting review.loop.blocked"
        fill_rule: "copy the final repo-relative path; never emit a temporary, missing, stale, or absolute path"
      max_review_rounds:
        meaning: "hard cap on the review loop (6 in ce-executor-pipeline-loop); loop.blocked fires when reached with must_fix_now > 0"
        source: "review-gate / preset"
        fill_rule: "integer; do NOT hand-write (preset constant)"
      must_fix_now_count:
        meaning: "must-fix findings still present when the loop gives up"
        source: "review-gate"
        fill_rule: "integer >= 1"
      blocking_main_conflict_count:
        meaning: "gate-driving count still open at max rounds"
        source: "review-gate"
        fill_rule: "integer >= 1"
      loop_decision_basis:
        meaning: "short explanation of the remaining main conflict"
        source: "review-gate"
        fill_rule: "one short sentence"
      reason:
        meaning: "human-readable reason the loop gave up (exceeded max_review_rounds, etc.)"
        source: "review-gate"
        fill_rule: "free text; do NOT include the synthetic 'pass' verdict"

  # 2026-07-16-001 plan U3: Test Hat (test-stabilizer) schemas.
  # Both topics share an honest accounting of what the gate saw.
  # Inline schemas in `ce-executor-pipeline-loop.yml` deep-merge from
  # this SSOT via `crates/ralph-cli/build.rs`.
  stabilization.done:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "review_phase"
      - "tested_from_sha"
      - "head_sha"
      - "stabilization_audit_file"
      - "correction_ids"
      - "classification_counts"
      - "worktree_status"
      - "tests_run"
      - "tests_passed"
    field_docs:
      tested_from_sha:
        meaning: "git SHA captured at the start of stabilization (= work.done.executor_head_sha); this is the gate's input anchor"
        source: "test-stabilizer"
        fill_rule: "40-char git SHA; copy from the triggering work.done payload verbatim"
      head_sha:
        meaning: "current git HEAD at stabilization emit time; equals tested_from_sha when the gate made no production corrections, otherwise points to the latest correction commit"
        source: "test-stabilizer"
        fill_rule: "40-char git SHA; recompute right before each emit attempt"
      correction_ids:
        meaning: "stable correction IDs for any production-code commits the gate produced; empty array when only test code (or nothing) was changed"
        source: "test-stabilizer"
        fill_rule: "array of strings; [] is valid but producers MUST document why an empty list is allowed alongside any production change"
      classification_counts:
        meaning: "summary of per-category failure counts observed during the full-suite run"
        source: "test-stabilizer"
        fill_rule: "object with keys test_bug, production_bug, pre_existing_failure, flaky_or_env, unattributable; integer per key"
      worktree_status:
        meaning: "real git worktree status at stabilization emit (excluding .ralph/)"
        source: "test-stabilizer"
        fill_rule: "one of clean | dirty; never fake-clean"
      stabilization_audit_file:
        meaning: "absolute path to the gate's audit markdown written under .ralph/review/<plan>/stabilization/"
        source: "test-stabilizer"
        fill_rule: "absolute path under .ralph/review/<plan>/stabilization/audit.md"

  stabilization.blocked:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "review_phase"
      - "tested_from_sha"
      - "head_sha"
      - "stabilization_audit_file"
      - "reason"
      - "classification_counts"
      - "worktree_status"
      - "report_input_file"
    field_docs:
      report_input_file:
        meaning: "repo-relative path to the atomically published reporter input bundle"
        source: "test-stabilizer writes and reopens the bundle before emitting stabilization.blocked"
        fill_rule: "copy the final repo-relative path; never emit a temporary, missing, stale, or absolute path"
      reason:
        meaning: "canonical reason the gate refused to emit stabilization.done; lets reporter drive blocked terminal without re-deriving"
        source: "test-stabilizer"
        fill_rule: "one of baseline_already_failed | flaky_or_environmental | unattributable | full_test_command_failed | oracle_weakening_prohibited | unknown_dirty_worktree | correction_regression_unrecoverable"
      worktree_status:
        meaning: "real git worktree status at stabilization block time (excluding .ralph/)"
        source: "test-stabilizer"
        fill_rule: "one of clean | dirty | unattributable_dirty; never fake-clean"
      classification_counts:
        meaning: "summary of failure attribution leading to the block"
        source: "test-stabilizer"
        fill_rule: "same shape as stabilization.done; must always be present even when zero"

  review.artifact.blocked:
    # review-synthesizer 在 mandatory artifact integrity gate 失败时发送此事件
    # any of the six mandatory dimension artifacts fails the
    # integrity gate. Routes to reporter only; fix-planner /
    # review-gate / alignment must NOT consume it.
    required_fields:
      - "plan_name"
      - "plan_path"
      - "review_round"
      - "review_phase"
      - "resolved_baseline_sha"
      - "normalized_plan_file"
      - "plan_contract_version"
      - "plan_contract_digest"
      - "trace_file"
      - "artifact_block_file"
      - "failure_dimensions"
      - "failure_reasons"
      - "report_input_file"
    field_docs:
      report_input_file:
        meaning: "repo-relative path to the atomically published reporter input bundle"
        source: "review-synthesizer writes and reopens the bundle before emitting review.artifact.blocked"
        fill_rule: "copy the final repo-relative path; never emit a temporary, missing, stale, or absolute path"
      plan_name:
        meaning: "plan file basename without extension; copied from review.adversarial.done for reporter routing"
        source: "review-synthesizer carries forward from review.adversarial.done"
        fill_rule: "literal copy; do NOT hand-write"
      plan_path:
        meaning: "repo-relative path to the source plan file"
        source: "review-synthesizer carries forward from review.adversarial.done"
        fill_rule: "literal copy"
      review_round:
        meaning: "round number whose mandatory artifacts failed the integrity gate"
        source: "review-synthesizer reads from review.adversarial.done trigger payload"
        fill_rule: "non-negative integer; do NOT recompute"
      review_phase:
        meaning: "current phase token; report-only audit marker"
        source: "review-synthesizer"
        fill_rule: "literal 'review_artifact_blocked'; do NOT change"
      resolved_baseline_sha:
        meaning: "canonical baseline SHA carried through the chain from plan.ready"
        source: "review-synthesizer carries forward from review.adversarial.done"
        fill_rule: "literal copy"
      normalized_plan_file:
        meaning: "path to plan-reviewer's normalized plan artifact"
        source: "review-synthesizer carries forward from review.adversarial.done"
        fill_rule: "literal copy; do NOT make up a path"
      plan_contract_version:
        meaning: "literal version tag of the ce-unified-plan contract"
        source: "review-synthesizer carries forward from review.adversarial.done"
        fill_rule: "literal 'ce-unified-plan/v1'; do NOT hand-write"
      plan_contract_digest:
        meaning: "hex digest binding source plan + normalized plan"
        source: "review-synthesizer carries forward from review.adversarial.done"
        fill_rule: "16-64 hex chars; do NOT hand-write"
      trace_file:
        meaning: "append-only Requirement→Scenario→Unit tracking file"
        source: "review-synthesizer carries forward from review.adversarial.done"
        fill_rule: "literal copy"
      artifact_block_file:
        meaning: "absolute path to the audit block the synthesizer wrote to <ROUND_DIR>/review-synthesizer-block.md"
        source: "review-synthesizer writes it via the Write tool before emit"
        fill_rule: "non-empty path under .ralph/review/<plan_name>/round-<NN>/review-synthesizer-block.md; do NOT make up a path — write the file first"
      failure_dimensions:
        meaning: "ordered array of dimension names that failed the integrity gate (subset of goal-alignment, correctness, testing, maintainability, project-standards, adversarial)"
        source: "review-synthesizer enumerates the failing dimensions during Step 1"
        fill_rule: "non-empty array of strings; never empty when review.artifact.blocked is emitted"
      failure_reasons:
        meaning: "ordered array of failure reason codes aligned with failure_dimensions; one of missing_file, unreadable, missing_findings_section, findings_count_mismatch, dimension_field_mismatch, diff_patch_missing"
        source: "review-synthesizer classifies per dimension during Step 1"
        fill_rule: "non-empty array of strings; length must equal failure_dimensions"

  report.done:
    required_fields: ["plan_name", "report_path", "verdict"]
    # Plan 2026-08-16-1015 Unit 4: report.done must target reporter;
    # see ce-executor-pipeline.yml schema for the rationale.
    required_target_hat: reporter
    field_docs:
      plan_name:
        meaning: "plan file basename without extension; identifies which plan this report belongs to"
        source: "reporter copies from the last event in the chain"
        fill_rule: "literal copy"
      report_path:
        meaning: "repo-relative path to the final aggregated report under `.ralph/review/<plan>/report.md`; agent must verify readable before emit (schema checks field presence, not filesystem)"
        source: "reporter writes the file this activation, then copies the real path"
        fill_rule: "repo-relative path only after the file is readable; do NOT invent a path; Confirm must print DELIVERABLE_PATH with the same value"
      verdict:
        meaning: "single-field terminal verdict driving LOOP_COMPLETE"
        source: "reporter aggregates from the chain"
        fill_rule: "literal one of pass, pass_with_residuals, blocked"

  LOOP_COMPLETE:
    required_fields: ["reason", "report_path"]
    field_docs:
      reason:
        meaning: "human-readable short reason for why the loop ended; recorded by the runtime"
        source: "reporter derives from report.done (or plan.blocked / work.failed fallback)"
        fill_rule: "one short sentence; mention final verdict and any blockers"
      report_path:
        meaning: "repo-relative path to the final aggregated report"
        source: "reporter copies the exact accepted report.done.report_path"
        fill_rule: "must match report.done.report_path and the readable report file"
