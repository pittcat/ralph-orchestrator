# Payload schemas for code-assist.
#
# STATUS: DEPRECATED REFERENCE COPY. As of 2026-06-03 the same content is
# inlined into `presets/en/code-assist.yml` under `event_policy.schemas`,
# and `presets/en/code-assist.yml` no longer sets `event_policy.schema_file`.
# `resolve_schema_files` cannot resolve a relative `schema_file` for builtin
# presets (no on-disk anchor), so the previous `../schemas/code-assist.yml`
# reference caused `ralph -H builtin:code-assist run` to fail with
# `Payload contract gate failed ... SchemaMissingForRequiredTopic` for
# the `review.ready` topic.
#
# This file is kept as a diff-able reference only. If you add or change a
# schema, edit `presets/en/code-assist.yml` and update this file in lockstep
# (or delete it once no consumers remain).
#
# Coverage mirrors the explicit `payload MUST include:` lines in
# code-assist.yml. Each `tasks.*` / `review.*` / `finalization.*` topic
# must carry at least `task_id` and `task_key` so consumers can correlate
# the work to the runtime task store.

tasks.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

review.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

review.rejected:
  required_fields:
    - task_id
    - task_key
  payload: json_object

finalization.failed:
  required_fields:
    - task_id
    - task_key
  payload: json_object
