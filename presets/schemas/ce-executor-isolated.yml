# Authoring SSOT for `ce-executor-isolated` `event_policy.schemas`.
# `build.rs` merges this file's top-level `schemas:` mapping into
# `$OUT_DIR/presets/ce-executor-isolated.yml` at compile time (plan
# 2026-06-16-002 Unit 1). Edit ONLY this file when changing payload
# contract requirements for any hat below; the next `cargo build`
# propagates the change to the CLI precheck, the loop gate, the drift
# engine, and the prompt builder — they all read the embedded copy,
# so a single source eliminates the previous inline-vs-reference drift
# that required lockstep updates of `presets/en/`.
#
# The inline `event_policy.schemas:` block in `presets/en/ce-executor-isolated.yml`
# is kept as a per-field override layer during the transition. Any
# topic listed there with explicit values will overwrite the SSOT
# value for that topic after the merge; topics absent from the inline
# block come straight from this file. Once a topic is stable, prefer
# editing this SSOT and clearing the inline entry so the merge is
# trivially auditable.
#
# If you delete or rename a topic here, also delete the matching
# inline entry in `presets/en/ce-executor-isolated.yml`. The embedded
# preset is regenerated on every build; there is no other path that
# the four consumer chains read.
#
# Coverage:
#   coordinator     -> work.ready
#   coordinator/executor -> work.failed
#   executor        -> work.done
#   review-coordinator  -> review.wave.ready
#   dimension-reviewer  -> review.dimension.done
#   review-synthesizer  -> review.passed / review.failed / review.complete
#   fixer           -> fix.applied / fix.exhausted
#   debug-resolver  -> fix.plan.ready / debug.exhausted / plan.blocked
#   plan-gate       -> queue.advance / plan.complete / plan.blocked
#   shipper         -> REVIEW_COMPLETE
#   reporter        -> report.done

work.ready:
  required_fields:
    - plan_name
    - plan_path
    - task_id
    - task_key
    - step
    - complexity
  payload: json_object

work.done:
  required_fields:
    - plan_name
    - plan_path
    - task_id
    - task_key
    - step
    - commit_count
    - changed_lines
  payload: json_object

work.failed:
  required_fields:
    - reason
  payload: json_object

review.wave.ready:
  required_fields:
    - dimension
    - focus
    - depth
    - diff_base
    - intent_summary
    - changed_files
    - plan_name
    - task_id
    - task_key
    - step
  payload: json_object

review.dimension.done:
  required_fields:
    - dimension
    - findings_count
    - findings_file
    - plan_name
    - task_id
    - task_key
    - step
  payload: json_object

review.passed:
  required_fields:
    - plan_name
    - task_id
    - task_key
    - step
    - findings_count
    - fix_round
    - verdict
    - skip_reason
  payload: json_object
  allowed_values:
    skip_reason:
      - empty_diff
      - trivial_step
      - aggregate_timeout
  hat_allowed_values:
    skip_reason:
      - hat_id: review-coordinator
        values:
          - empty_diff
      - hat_id: review-synthesizer
        values:
          - aggregate_timeout

review.failed:
  required_fields:
    - plan_name
    - fix_round
    - safe_auto_count
    - gated_manual_count
    - findings_summary
    - task_id
    - task_key
    - step
  payload: json_object

review.complete:
  required_fields:
    - plan_name
    - fix_round
    - verdict
    - residual_findings_count
    - findings_summary
    - task_id
    - task_key
    - step
    - findings_count
  payload: json_object

fix.applied:
  required_fields:
    - plan_name
    - fix_round
    - applied_count
    - failed_count
    - task_id
    - task_key
    - step
    # Mirror work.done schema so the fix.applied → review-
    # coordinator path carries diff-state context. Without these
    # the gate cannot distinguish "fix changed 2 lines, skip
    # review" from a real post-fix wave.
    - commit_count
    - changed_lines
  payload: json_object

fix.exhausted:
  required_fields:
    - plan_name
    - fix_round
    - task_id
    - task_key
    - step
  payload: json_object

fix.plan.ready:
  required_fields:
    - plan_name
    - task_id
    - task_key
    - step
    - root_cause_summary
    - causal_chain
    - recommended_tests
    - fix_plan
  payload: json_object

debug.exhausted:
  required_fields:
    - plan_name
    - reason
    - task_id
    - task_key
    - step
    - debug_summary
  payload: json_object

queue.advance:
  required_fields:
    - plan_name
    - completed_step
    - next_step
    - reviewed_task_id
    - reviewed_task_key
  payload: json_object

plan.complete:
  required_fields:
    - plan_name
    - completed_steps
    - task_id
    - task_key
    - verdict
  payload: json_object

plan.blocked:
  required_fields:
    - reason
  payload: json_object

loop.cancel:
  required_fields:
    - reason
  payload: json_object

LOOP_COMPLETE:
  required_fields:
    - reason
  payload: json_object

REVIEW_COMPLETE:
  required_fields:
    - plan_name
    - verdict
    - pass_or_fail
    - residual_findings_summary
  payload: json_object

report.done:
  required_fields:
    - report_path
    # 2026-06-09 fix: awaiting_decision is set by the reporter
    # on a failing review so the manager-facing report and the
    # verdict_gate can both see that the loop has not passed
    # final review.  Required field so the contract rejects
    # reporters that silently emit report.done without the
    # manager-decision flag.
    - awaiting_decision
  payload: json_object

# 2026-06-16-001 U2: synthetic record emitted by the wave dispatcher
# when a dimension-reviewer worker fails or times out. Attribution is
# `review-synthesizer` (the wave-result aggregator); see also
# `presets/en/ce-executor-isolated.yml` `review-synthesizer.publishes`.
wave.worker.failed:
  required_fields:
    - reason
    - wave_id
    - wave_index
  payload: json_object

# 2026-06-16-001 U3/U5: recovery signal emitted by origin guard,
# workflow guard, execution contract, isolated scope, and the
# `progress-steward` hat. Carries the original event's id and
# timestamp for freshness filtering (U3 TTL) and audit. U5 uses
# this topic to nudge a stuck hat (e.g. plan-gate that never
# emitted plan.complete).
task.resume:
  required_fields:
    - reason
    - target_task_id
    - target_hat
    - source_event_id
  payload: json_object

# 2026-06-16-001 U5: diagnostic topic emitted by the loop when no
# accepted business event has advanced for `max_steward_iterations`
# consecutive turns. The `progress-steward` hat is the only
# subscriber (it is the recovery handler).
loop.stalled:
  required_fields:
    - reason
  payload: json_object

# 2026-06-16-001 U5: human-in-the-loop guidance injected by Telegram
# (or any RObot client). The `progress-steward` hat subscribes to
# this topic so an operator's proactive guidance also wakes the
# fallback path (e.g. "skip the failing step").
human.guidance:
  required_fields:
    - message
  payload: json_object
