    - task_id
    - task_key
  payload: json_object

design.approved:
  required_fields:
    - task_id
    - task_key
  payload: json_object

design.rejected:
  required_fields:
    - task_id
    - task_key
  payload: json_object

answer.proposed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

context.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

plan.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

work.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

work.done:
  required_fields:
    - task_id
    - task_key
  payload: json_object

work.failed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

review.passed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

review.failed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

report.done:
  required_fields:
    - task_id
    - task_key
  payload: json_object
