# Payload schemas for pdd-to-code-assist.
#
# Loaded by `presets/pdd-to-code-assist.yml` via
# `event_policy.schema_file: "../schemas/pdd-to-code-assist.yml"`.
#
# Each topic in the PDD flow (requirements -> design -> context -> plan
# -> work -> review -> report) carries the active `task_id` and
# `task_key` so consumers can correlate work to the runtime task store.
# Specific topics also carry topic-unique fields per the contract lines
# in pdd-to-code-assist.yml.

question.asked:
  required_fields:
    - task_id
    - task_key
  payload: json_object

requirements.complete:
  required_fields:
    - task_id
    - task_key
  payload: json_object

design.start:
  required_fields:
    - task_id
    - task_key
  payload: json_object

design.drafted:
  required_fields:
    - task_id
    - task_key
  payload: json_object

design.approved:
  required_fields:
    - task_id
    - task_key
  payload: json_object

design.rejected:
  required_fields:
    - task_id
    - task_key
  payload: json_object

answer.proposed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

context.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

plan.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

work.ready:
  required_fields:
    - task_id
    - task_key
  payload: json_object

work.done:
  required_fields:
    - task_id
    - task_key
  payload: json_object

work.failed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

review.passed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

review.failed:
  required_fields:
    - task_id
    - task_key
  payload: json_object

report.done:
  required_fields:
    - task_id
    - task_key
  payload: json_object
