# Payload schemas for pdd-to-code-assist.
#
# STATUS: DEPRECATED REFERENCE COPY. As of 2026-06-03 the same content is
# inlined into `presets/en/pdd-to-code-assist.yml` under
# `event_policy.schemas`, and `presets/en/pdd-to-code-assist.yml` no
# longer sets `event_policy.schema_file`. `resolve_schema_files` cannot
# resolve a relative `schema_file` for builtin presets (no on-disk
# anchor), so the previous `../schemas/pdd-to-code-assist.yml`
# reference caused `ralph -H builtin:pdd-to-code-assist run` to fail
# with `Payload contract gate failed ... SchemaMissingForRequiredTopic`
# for 7 topics (question.asked, requirements.complete, design.*,
# answer.proposed, context.ready, plan.ready, work.*, review.*,
# report.done).
#
# This file is kept as a diff-able reference only. If you add or change a
# schema, edit `presets/en/pdd-to-code-assist.yml` and update this file
# in lockstep (or delete it once no consumers remain).
#
# Each topic in the PDD flow (requirements -> design -> context -> plan
# -> work -> review -> report) carries the active `task_id` and
# `task_key` so consumers can correlate work to the runtime task store.
# Specific topics also carry topic-unique fields per the contract lines
# in pdd-to-code-assist.yml.

question.asked:
  required_fields:
    - task_id
    - task_key
  payload: json_object

requirements.complete:
  required_fields:
    - task_id
    - task_key
  payload: json_object

design.start:
  required_fields:
    - task_id
    - task_key
  payload: json_object

