# Authoring SSOT for `ce-executor-pipeline` `event_policy.schemas`.
#
# 本文件是线性 CE pipeline preset 的 schema SSOT。构建过程会把这里的
# `schemas:` mapping deep-merge 到
# into the inline `event_policy.schemas:` block of
# `presets/en/ce-executor-pipeline.yml`. Authors who want to change the
# field set MUST edit this file; the inline `schemas:` block in the
# preset YAML is the runtime-side view that ends up in the embedded
# copy. If the inline block already declares the same topic, the merge
# is additive — required_fields / field_docs / examples from SSOT are
# base, inline is override.
#
# This preset has 16 schema topics covering the linear single-chain
# execution path: plan.* → work.* → stabilization.* → 6 dimension hats
# → review.synthesized → review.complete → fix.done → align.done →
# report.done → LOOP_COMPLETE. Every required field carries meaning /
# source / fill_rule so agent payloads can be authored mechanically and
# reviewed for semantic sufficiency (Q4 Payload Audit).
#
# Field docs vocabulary matches the loop SSOT — keep new entries in the
# same shape so cross-preset parity stays trivial to verify.

schemas:
  plan.ready:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "plan_revised"
      - "review_summary"
      - "flow_audit"
      - "resolved_baseline_sha"
    field_docs:
      plan_name:
        meaning: "plan file basename without extension; stable identifier for the rest of the loop"
        source: "plan-reviewer derives from plan_path"
        fill_rule: "do NOT make up a name; copy from plan_path basename"
      plan_path:
        meaning: "repo-relative path to the plan file passed into the loop (for hat prompts to re-read)"
        source: "plan-reviewer derives from the prompt's plan file path"
        fill_rule: "absolute repo-relative path; never absolute filesystem path"
      plan_contract_version:
        meaning: "version of the normalized plan contract used by this run"
        source: "plan-reviewer reads the contract declared by the source plan"
        fill_rule: "copy the visible contract version; do not invent a value"
      normalized_plan_file:
        meaning: "business artifact containing the normalized plan"
        source: "plan-reviewer writes the artifact before emit"
        fill_rule: "write the file first, then use its repo-relative path"
      plan_contract_digest:
        meaning: "digest binding the source plan to the normalized plan artifact"
        source: "plan-reviewer computes it from the two visible plan artifacts"
        fill_rule: "recompute after either artifact changes; do not reuse a stale digest"
      trace_file:
        meaning: "business artifact mapping requirements, scenarios, and implementation units"
        source: "plan-reviewer writes the trace artifact before emit"
        fill_rule: "write the file first, then use its repo-relative path"
      plan_revised:
        meaning: "boolean flag — true when plan-reviewer edited the plan file in-place, false when the plan was already executable"
        source: "plan-reviewer"
        fill_rule: "literal boolean true or false"
      review_summary:
        meaning: "one or two sentence summary of the plan-reviewer's verdict and any in-place edits"
        source: "plan-reviewer"
        fill_rule: "short prose; mention revision outcome and any unresolved concerns the executor must know"
      flow_audit:
        meaning: "execution-loop skip verdict decided by plan-reviewer §Step 2.5; tells executor whether to skip the per-Unit TDD round"
        source: "plan-reviewer §Step 2.5"
        fill_rule: "literal one of first_run, post_merge_complete, post_merge_no_canary"
      resolved_baseline_sha:
        meaning: "canonical baseline SHA the downstream chain uses for <DIFF_BASE> (reconciles against orphaned anchors)"
        source: "plan-reviewer §Step 2.5b"
        fill_rule: "40-char git SHA; do NOT hand-write (plan-reviewer resolves)"
  plan.blocked:
    required_fields: ["plan_name", "plan_path", "plan_contract_version", "plan_contract_digest", "reason", "semantic_gaps", "report_input_file"]
    field_docs:
      report_input_file:
        meaning: "repo-relative path to the atomically published reporter input bundle"
        source: "plan-reviewer writes and reopens the bundle before emitting plan.blocked"
        fill_rule: "copy the final repo-relative path; never emit a temporary, missing, stale, or absolute path"
      plan_name:
        meaning: "plan file basename without extension; identifies which plan failed"
        source: "plan-reviewer derives from plan_path"
        fill_rule: "do NOT make up a name; copy from plan_path basename"
      plan_path:
        meaning: "repo-relative source plan path that could not pass review"
        source: "plan-reviewer reads it from the current request"
        fill_rule: "copy the visible path; never substitute another plan"
      plan_contract_version:
        meaning: "plan contract version used while evaluating the blocked plan"
        source: "plan-reviewer reads the source plan contract"
        fill_rule: "copy the visible contract version"
      plan_contract_digest:
        meaning: "digest of the blocked source plan used for audit identity"
        source: "plan-reviewer computes it from the source plan"
        fill_rule: "recompute from the current source plan"
      semantic_gaps:
        meaning: "specific semantic gaps that prevent safe execution"
        source: "plan-reviewer records observed review failures"
        fill_rule: "non-empty array; each entry names one observed gap"
      reason:
        meaning: "sole routing signal so reporter drives terminal LOOP_COMPLETE with verdict blocked"
        source: "plan-reviewer"
        fill_rule: "one of the canonical reason strings (plan_file_not_found, plan_file_unreadable, plan_missing_implementation_units, plan_content_empty_or_placeholder, plan_unusable, baseline_reconciliation_io_failure) — never add recoverable/other hint fields the runtime does not read"
  work.done:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "plan_contract_version"
      - "normalized_plan_file"
      - "plan_contract_digest"
      - "trace_file"
      - "executor_head_sha"
      - "resolved_baseline_sha"
      - "planned_units"
      - "completed_units"
      - "baseline_verification_status"
      - "baseline_verification_file"
      - "post_verification_status"
      - "post_verification_file"
      - "verification_delta_file"
      - "baseline_existing_count"
      - "new_business_regressions_count"
      - "test_compatibility_updates_count"
      - "flaky_or_environmental_count"
      - "tests_run"
      - "tests_passed"
      - "changed_lines"
      - "commit_count"
    field_docs:
      plan_name:
        meaning: "plan file basename without extension; copied from plan.ready for downstream hat routing"
        source: "executor carries forward from plan.ready"
        fill_rule: "literal copy of the same field from the prior plan.ready payload"
      plan_path:
        meaning: "repo-relative path to the original plan file; executor uses it to re-read the plan if needed"
        source: "executor carries forward from plan.ready"
        fill_rule: "literal copy of the same field from the prior plan.ready payload"
      executor_head_sha:
        meaning: "git SHA at HEAD after the last executor commit; the SHA reviewers/reporter anchor their work onto"
        source: "executor runs `git rev-parse HEAD` after the final executor commit"
        fill_rule: "40-char git SHA; recompute on every emit attempt; do not reuse a stale SHA"
      resolved_baseline_sha:
        meaning: "canonical baseline SHA carried through from plan.ready §Step 2.5b — reconciliation anchor"
        source: "executor carries forward from plan.ready"
        fill_rule: "literal copy; do NOT hand-write"
      planned_units:
        meaning: "ordered array of U-IDs from the original plan's Implementation Units"
        source: "executor extracts from plan_path Implementation Units section"
        fill_rule: "array of U-ID strings; preserve order"
      completed_units:
        meaning: "ordered array of U-IDs that reached a commit this run"
        source: "executor derives from git log over the executor range"
        fill_rule: "subset of planned_units; alignment will flag any U missing here as residual"
      baseline_verification_status:
        meaning: "result of the Step 1.75 baseline-snapshot verifier (green / red / unknown / skipped)"
        source: "executor runs the baseline-verifier subagent"
        fill_rule: "literal one of green, red, unknown, skipped"
      baseline_verification_file:
        meaning: "absolute path to the baseline verifier report written under .ralph/review/<plan>/"
        source: "executor writes via the Write tool; path follows the basename-verifier convention"
        fill_rule: "absolute path; do NOT make up a path — write the file first"
      post_verification_status:
        meaning: "result of the Step 1.95 delta-verifier final snapshot"
        source: "executor runs the delta-verifier subagent after the final Unit commit"
        fill_rule: "literal one of green, red, unknown"
      post_verification_file:
        meaning: "absolute path to the final-verification report under .ralph/review/<plan>/"
        source: "executor writes via the Write tool"
        fill_rule: "absolute path; do NOT make up a path"
      verification_delta_file:
        meaning: "absolute path to the baseline-vs-final delta report under .ralph/review/<plan>/"
        source: "executor writes via the Write tool"
        fill_rule: "absolute path; do NOT make up a path"
      baseline_existing_count:
        meaning: "failures that already existed before this run; report-only — do not block"
        source: "executor / delta-verifier classifies"
        fill_rule: "integer >= 0"
      new_business_regressions_count:
        meaning: "failures clearly introduced by this diff; must be 0 before work.done"
        source: "executor / delta-verifier classifies"
        fill_rule: "integer = 0 when emitting work.done; if > 0, emit work.failed instead"
      test_compatibility_updates_count:
        meaning: "tests intentionally updated to reflect intended behavior change; counted separately from regressions"
        source: "executor / delta-verifier classifies"
        fill_rule: "integer >= 0; document each test in the delta file"
      flaky_or_environmental_count:
        meaning: "failures that cannot be trusted without a repro-worthy environment signal"
        source: "executor / delta-verifier classifies"
        fill_rule: "integer = 0 before work.done; if > 0, emit work.failed"
      tests_run:
        meaning: "total tests run across the final verification suite"
        source: "executor captures from the final-suite command output"
        fill_rule: "integer >= 0"
      tests_passed:
        meaning: "total checks that passed in the final verification run"
        source: "executor captures from the final-suite command output"
        fill_rule: "integer; should equal tests_run minus open new_regressions/flaky counts"
      changed_lines:
        meaning: "insertions + deletions since DIFF_BASE; shortstat snapshot of the executor range"
        source: "executor runs `git diff --shortstat <DIFF_BASE>..HEAD`"
        fill_rule: "integer >= 0; recompute on every emit attempt"
      commit_count:
        meaning: "commits in DIFF_BASE..HEAD attributable to executor; one per passed Unit"
        source: "executor runs `git rev-list --count <DIFF_BASE>..HEAD`"
        fill_rule: "integer; must be >= the number of completed_units"
    examples:
      - plan_name: "2026-07-12-003-feat-ce-executor-pipeline-schema-metadata-backfill-plan"
        plan_path: "docs/plans/2026-07-12-003-feat-ce-executor-pipeline-schema-metadata-backfill-plan.md"
        executor_head_sha: "0123456789abcdef0123456789abcdef01234567"
        resolved_baseline_sha: "fedcba9876543210fedcba9876543210fedcba98"
        planned_units: ["U1", "U2", "U3", "U4", "U5", "U6", "U7", "U8", "U9", "U10", "U11", "U12"]
        completed_units: ["U1", "U2", "U3", "U4", "U5", "U6", "U7", "U8", "U9", "U10", "U11", "U12"]
        baseline_verification_status: "green"
        baseline_verification_file: ".ralph/review/2026-07-12-003-feat-ce-executor-pipeline-schema-metadata-backfill-plan/baseline-verification.md"
        post_verification_status: "green"
        post_verification_file: ".ralph/review/2026-07-12-003-feat-ce-executor-pipeline-schema-metadata-backfill-plan/final-verification.md"
        verification_delta_file: ".ralph/review/2026-07-12-003-feat-ce-executor-pipeline-schema-metadata-backfill-plan/verification-delta.md"
        baseline_existing_count: 0
        new_business_regressions_count: 0
        test_compatibility_updates_count: 0
        flaky_or_environmental_count: 0
        tests_run: 480
        tests_passed: 480
        changed_lines: 320
        commit_count: 12
  work.failed:
    required_fields:
      - "plan_name"
      - "plan_path"
      - "planned_units"
      - "attempted_units"
      - "completed_units"
      - "failed_units"
