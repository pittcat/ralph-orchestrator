      - "baseline_verification_file"
      - "decisions_file"
      - "reason"
      - "report_input_file"
    field_docs:
      report_input_file:
        meaning: "repo-relative path to the atomically published reporter input bundle"
        source: "executor writes and reopens the bundle before emitting work.failed"
        fill_rule: "copy the final repo-relative path; never emit a temporary, missing, stale, or absolute path"
      plan_name:
        meaning: "plan file basename without extension; identifies which plan failed"
        source: "executor derives from plan_path"
        fill_rule: "literal copy of plan_name from the plan.ready payload"
      plan_path:
        meaning: "repo-relative path to the original plan"
        source: "executor copies from plan.ready"
        fill_rule: "literal copy; do not invent a path"
      planned_units:
        meaning: "complete ordered U-ID list extracted from the original plan"
        source: "executor reads the Implementation Units section"
        fill_rule: "include every planned U-ID, including failed or blocked Units"
      reason:
        meaning: "evidence-backed execution failure; plan size, Unit count, file count, predicted context pressure, or predicted duration are not failures"
        source: "executor"
        fill_rule: "starts with tests_not_green / build_failed / clippy_failed / unreachable and names an observed failed attempt or external blocker; never use a forecast that the remaining plan may not fit"
      attempted_units:
        meaning: "ordered U-IDs for which a Unit subagent was actually dispatched and returned an outcome"
        source: "executor's per-Unit dispatch log in decisions_file"
        fill_rule: "array of U-ID strings; a Unit may not enter failed_units unless it appears here"
      completed_units:
        meaning: "ordered attempted U-IDs accepted by the main executor and committed independently"
        source: "executor cross-checks the dispatch log with git log"
        fill_rule: "subset of attempted_units and planned_units"
      failed_units:
        meaning: "ordered attempted U-IDs whose implementation or verification actually failed"
        source: "Unit subagent result plus executor acceptance evidence"
        fill_rule: "subset of attempted_units; never include a Unit that was only predicted to be difficult"
      blocked_units:
        meaning: "ordered unattempted U-IDs made unsafe by an explicit dependency on an actually failed Unit"
        source: "Dependencies fields in the original plan plus failed_units"
        fill_rule: "array of U-ID strings; record the failed dependency edge in decisions_file"
      skipped_units:
        meaning: "ordered U-IDs legitimately closed by the existing-commit skip path"
        source: "flow-audit and git-log evidence"
        fill_rule: "array of U-ID strings; remaining work, context pressure, or elapsed time are not skip reasons"
      baseline_verification_file:
        meaning: "baseline verifier report produced before any Unit implementation begins"
        source: "baseline-verifier subagent"
        fill_rule: "existing path under .ralph/review/<plan>/; do not invent a path"
      decisions_file:
        meaning: "execution ledger containing dispatch, acceptance, commit, failure, and dependency evidence"
        source: "executor writes .ralph/agent/decisions.md"
        fill_rule: "literal .ralph/agent/decisions.md after recording every planned Unit's disposition"
