        fill_rule: "literal copy"
      report_path:
        meaning: "absolute path to the final aggregated report file the reporter wrote"
        source: "reporter writes it via the Write tool"
        fill_rule: "absolute path; do NOT make up a path — write the file first"
      verdict:
        meaning: "single-field terminal verdict driving LOOP_COMPLETE"
        source: "reporter aggregates from the chain"
        fill_rule: "literal one of pass, pass_with_residuals, blocked"
  LOOP_COMPLETE:
    required_fields: ["reason"]
    field_docs:
      reason:
        meaning: "human-readable short reason for why the loop ended; recorded by the runtime"
        source: "reporter derives from report.done (or plan.blocked / work.failed fallback)"
        fill_rule: "one short sentence; mention final verdict and any blockers"
