# Authoring SSOT for `parallel-forge` `event_policy.schemas`.
#
# Parallel Forge: Spec-First → BDD → ATDD → Outside-In planning,
# supervisor-driven parallel Unit TDD in worktrees, per-Unit review,
# sequential integration with linear Unit commits, full regression,
# final audit, and manager Markdown report.
#
# Supervisor coordination topics (`exec.wave.*`, `exec.unit.*`) are
# system-injected; agents must NOT emit them. Custom `forge.*` topics
# carry control-plane handoffs; long content lives in `.ralph/forge/`
# business artifacts.
#
# Lint: always `ralph preset check -H builtin:parallel-forge --strict`
# (build.rs merges this SSOT into the embedded preset). Checking the
# raw `presets/en/parallel-forge.yml` file path alone will fail
# publishes_missing_schema because schemas are not inlined there.

schemas:
  forge.plan.inspected:
    required_fields:
      - plan_path
      - inspection_report_path
      - plan_usable
      - plan_key
    payload: json_object
    field_docs:
      plan_path:
        meaning: Repo-relative path to the operator-supplied plan or requirements input.
        source: Trigger payload or ralph inspect loop plan anchor.
        fill_rule: Use the live plan path; do not invent filenames.
      inspection_report_path:
        meaning: Artifact path for the Plan Inspection Report (full findings).
        source: File written this activation under .ralph/forge/plan-key/inspection-report.md.
        fill_rule: Verify file exists before emit; path must be repo-relative.
        examples: [".ralph/<plan>/inspection-report.md"]
      plan_usable:
        meaning: Whether the input is sufficient for Planner to proceed.
        source: Inspector judgment after reading plan and repository.
        fill_rule: '"true" only when Planner can proceed; "false" routes to blocked path.'
      plan_key:
        meaning: Forge plan key basename for artifact roots.
        source: Basename of plan_path without .md/.html.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.

  forge.plan.ready:
    required_fields:
      - plan_path
      - development_plan_path
      - execution_plan_path
      - plan_key
    payload: json_object
    field_docs:
      plan_path:
        meaning: Original operator input path.
        source: Upstream trigger or loop anchor.
        fill_rule: Same path Planner read; no fabrication.
      development_plan_path:
        meaning: Artifact path for the full Spec-First Development Plan (BDD, ATDD, DAG).
        source: File written this activation at .ralph/forge/plan-key/development-plan.md.
        fill_rule: Must exist before emit.
        examples: [".ralph/<plan>/development-plan.md"]
      execution_plan_path:
        meaning: Machine-readable Unit DAG SSOT for supervisor dispatch.
        source: File written this activation at .ralph/forge/plan-key/execution-plan.yml.
        fill_rule: Must exist; runtime reads it once inside the workspace boundary and derives the task DAG.
        examples: [".ralph/<plan>/execution-plan.yml"]
      plan_digest:
        meaning: Runtime-verifiable canonical SHA-256 digest of execution-plan.yml.
        source: Ralph CLI derives it from the referenced artifact during policy-check/apply.
        fill_rule: Do not hand-calculate; omit it from the CLI payload and let ralph emit add the verified value.
      plan_key:
        meaning: Forge plan key basename for artifact roots.
        source: Basename of plan_path without .md/.html.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.

  forge.concurrency.approved:
    required_fields:
      - execution_plan_path
      - approval_report_path
      - approved
    payload: json_object
    field_docs:
      execution_plan_path:
        meaning: Path to the execution-plan SSOT Guardian audited.
        source: Trigger payload from Planner handoff.
        fill_rule: Must match Planner artifact path.
      approval_report_path:
        meaning: Concurrency Safety Approval artifact path.
        source: File written this activation at .ralph/forge/plan-key/concurrency-approval.md.
        fill_rule: File must exist before emit.
        examples: [".ralph/<plan>/concurrency-approval.md"]
      approved:
        meaning: Whether parallel execution may proceed.
        source: Guardian audit of DAG, shared resources, and path boundaries.
        fill_rule: '"false" blocks worktree creation; emit forge.plan.blocked instead.'

  forge.correction.requested:
    required_fields:
      - plan_key
      - affected_unit_ids
      - correction_request_path
    payload: json_object
    field_docs:
      plan_key:
        meaning: Forge plan key basename for the runtime correction.
        source: The accepted per-Unit or full-verification failure event.
        fill_rule: Must match the active execution-plan artifact root.
      affected_unit_ids:
        meaning: Unit ids whose next fixer attempt is requested.
        source: forge-failure-handler.
        fill_rule: Non-empty subset of the active plan's Unit ids.
      correction_request_path:
        meaning: Evidence artifact that the fixer must use as feedback.
        source: Failure handler correction artifact.
        fill_rule: Must exist and be repo-relative; runtime passes it to the fixer prompt.
        examples: [".ralph/<plan>/corrections/U1-round-1.md"]

  forge.final.correction.settled:
    required_fields:
      - plan_key
      - wave_id
      - correction_round
      - verification_log_path
    payload: json_object
    # Post-review fix (#2): the FINAL settled is only meaningful at
    # the budget-exhausted round. Earlier rounds are intermediate
    # forge.correction.requested/done; emitting final settled at
    # round 0..2 would prematurely hand off to the full tester and
    # bypass the correction ladder. `allowed_values` is runtime-
    # enforced by the event policy validator (payload_consistency
    # cannot express "<3 reject" because the predicate whitelist
    # lacks lt/not; allowed_values:[3] is the equivalent runtime-
    # enforceable mechanism).
    allowed_values:
      correction_round: [3]
    field_docs:
      plan_key:
        meaning: Forge plan key basename.
        source: forge.correction.done.plan_key.
        fill_rule: Must match .ralph/forge/<plan-key>/.
      wave_id:
        meaning: Final wave that exhausted the 3-round correction budget.
        source: Last correction done event for this plan.
        fill_rule: Stable id from forge.wave.worktrees.ready.
      correction_round:
        meaning: The final round number that exhausted the budget.
        source: forge-failure-handler correction counter.
        fill_rule: Must be 3 — the budget-exhausted final round. Earlier rounds (0..2) belong to forge.correction.requested/done; the FINAL settled is only valid at the exhaustion round, and runtime allowed_values enforces this.
      verification_log_path:
        meaning: Path to the final-correction verification log written by the tester.
        source: File under .ralph/forge/<plan-key>/final-correction/verification.log.
        fill_rule: Must exist before emit.
        examples: [".ralph/<plan>/final-correction/verification.log"]

  forge.exec.development.done:
    required_fields:
      - execution_plan_path
      - completed_unit_count
      - failed_unit_count
      - plan_key
    payload: json_object
    field_docs:
      execution_plan_path:
        meaning: Execution plan SSOT; all integrated development Units finished.
        source: DAG runtime after every Unit integration acknowledgement is durable.
        fill_rule: Same path used since Planner handoff.
        examples: [".ralph/<plan>/execution-plan.yml"]
      completed_unit_count:
        meaning: Units whose runtime integration acknowledgement is complete.
        source: DAG integration projection, not an agent-emitted wave count.
        fill_rule: Non-negative integer.
      failed_unit_count:
        meaning: Units with an unresolved terminal failure.
        source: DAG runtime failure projection.
        fill_rule: Zero when proceeding to the final verification path.
      plan_key:
        meaning: Forge plan key basename (artifact root segment under .ralph/forge/).
        source: Basename of operator plan without .md, or path parent of execution_plan_path.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.

  # ──────────────────────────────────────────────────────────────────────
  # DAG 模式 per-unit typed topic 族(2026-09-03-0959 plan DAG 接线
  # Step 2,方案 (b))。scheduler_mode: dag 下由 runtime 驱动的 per-unit
  # worker(executor/reviewer/verifier hat)发射; legacy wave topics are not
  # part of the active DAG execution face.
  # `forge.unit.integrated` 由 runtime 在 lane CAS FF 后发射(D25),
  # 无 hat 发射方——比照 exec.wave.failed 的 runtime-injected 先例。
  # ──────────────────────────────────────────────────────────────────────
  forge.unit.executed:
    required_fields:
      - unit_id
      - plan_key
      - task_id
      - task_key
      - content_hash
      - unit_report_path
    payload: json_object
    field_docs:
      unit_id:
        meaning: Unit id whose Execute stage reached a successful terminal.
        source: DAG runtime job context (unit registration / JobDescriptor).
        fill_rule: Exact id string from execution plan; never hand-invented.
      plan_key:
        meaning: Forge plan key basename.
        source: DAG runtime job context.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.
      task_id:
        meaning: Live runtime task id for this unit.
        source: ralph tools task list for the matching task_key.
        fill_rule: Never hand-write; copy the live id from task list.
      task_key:
        meaning: Stable task key registered by planner.
        source: ralph tools task list / execution-plan unit id mapping.
        fill_rule: Must match forge:<plan-key>:<unit-id> key form used at registration.
      content_hash:
        meaning: Hash of the unit worktree diff or commit content for idempotency.
        source: Computed from unit commit / tree.
        fill_rule: Non-empty hex or stable digest string.
      unit_report_path:
        meaning: Unit Completion Report artifact for this unit.
        source: File at .ralph/forge/<plan-key>/units/<unit-id>-completion.md.
        fill_rule: Written before emit; path repo-relative.
        examples: [".ralph/<plan>/units/<unit>-completion.md"]

  forge.unit.execution_failed:
    required_fields:
      - unit_id
      - plan_key
      - task_id
      - task_key
      - reason
      - failure_class
    payload: json_object
    field_docs:
      unit_id:
        meaning: Unit id whose Execute stage failed.
        source: DAG runtime job context (unit registration / JobDescriptor).
        fill_rule: Exact id string from execution plan.
      plan_key:
        meaning: Forge plan key basename.
        source: DAG runtime job context.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.
      task_id:
        meaning: Live runtime task id for this unit.
        source: ralph tools task list for the matching task_key.
        fill_rule: Never hand-write; copy the live id from task list.
      task_key:
        meaning: Stable task key registered by planner.
        source: ralph tools task list / execution-plan unit id mapping.
        fill_rule: Must match forge:<plan-key>:<unit-id> key form used at registration.
      reason:
        meaning: Why this unit's execution failed.
        source: Executor failure evidence this activation.
        fill_rule: Non-empty; no fabricated upstream blame.
      failure_class:
        meaning: >-
          Typed failure classification the failure handler triages on
          (timeout / orphan_or_empty_result / identity_mismatch /
          cancel / required_slot_failure / unknown), aligned with the
          exec.wave.failed slot_failures vocabulary.
        source: DAG runtime job kernel classification of the job terminal.
        fill_rule: One of the listed class labels; identical failures reuse the same class.

  forge.unit.reviewed:
    required_fields:
      - unit_id
      - plan_key
      - task_id
      - task_key
      - verdict
      - review_report_path
    payload: json_object
    allowed_values:
      verdict: [ACCEPTED, REJECTED]
    field_docs:
      unit_id:
        meaning: Unit id whose Review stage concluded.
        source: DAG runtime job context (unit registration / JobDescriptor).
        fill_rule: Exact id string from execution plan.
      plan_key:
        meaning: Forge plan key basename.
        source: DAG runtime job context.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.
      task_id:
        meaning: Live runtime task id for this unit.
        source: ralph tools task list for the matching task_key.
        fill_rule: Never hand-write; copy the live id from task list.
      task_key:
        meaning: Stable task key registered by planner.
        source: ralph tools task list / execution-plan unit id mapping.
        fill_rule: Must match forge:<plan-key>:<unit-id> key form used at registration.
      verdict:
        meaning: Per-unit review verdict consumed by the DAG driver.
        source: Reviewer six-dimension audit of this unit.
        fill_rule: One of ACCEPTED, REJECTED (aligned with the preset-wide verdict vocabulary).
      review_report_path:
        meaning: Repo-relative path to the per-unit review artifact.
        source: File at .ralph/forge/<plan-key>/units/<unit-id>-review.md.
        fill_rule: Must exist before emit.
        examples: [".ralph/<plan>/units/<unit>-review.md"]

  forge.unit.verified:
    required_fields:
      - unit_id
      - plan_key
      - task_id
      - task_key
      - content_hash
      - verification_log_path
    payload: json_object
    field_docs:
      unit_id:
        meaning: Unit id whose Verify stage passed.
        source: DAG runtime job context (unit registration / JobDescriptor).
        fill_rule: Exact id string from execution plan.
      plan_key:
        meaning: Forge plan key basename.
        source: DAG runtime job context.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.
      task_id:
        meaning: Live runtime task id for this unit.
        source: ralph tools task list for the matching task_key.
        fill_rule: Never hand-write; copy the live id from task list.
      task_key:
        meaning: Stable task key registered by planner.
        source: ralph tools task list / execution-plan unit id mapping.
        fill_rule: Must match forge:<plan-key>:<unit-id> key form used at registration.
      content_hash:
        meaning: Hash of the verified unit commit content for idempotency.
        source: Computed from the verified unit commit / tree.
        fill_rule: Non-empty hex or stable digest string.
      verification_log_path:
        meaning: Repo-relative path to the per-unit verification log.
        source: File at .ralph/forge/<plan-key>/units/<unit-id>-verification.md.
        fill_rule: Must list every gate command run and its outcome.
        examples: [".ralph/<plan>/units/<unit>-verification.md"]

  forge.unit.verification_failed:
    required_fields:
      - unit_id
      - plan_key
      - task_id
      - task_key
      - reason
      - verification_failure_path
    payload: json_object
    field_docs:
      unit_id:
        meaning: Unit id whose Verify stage failed.
        source: DAG runtime job context (unit registration / JobDescriptor).
        fill_rule: Exact id string from execution plan.
      plan_key:
        meaning: Forge plan key basename.
        source: DAG runtime job context.
        fill_rule: Must match .ralph/forge/<plan-key>/ directory name.
      task_id:
        meaning: Live runtime task id for this unit.
        source: ralph tools task list for the matching task_key.
        fill_rule: Never hand-write; copy the live id from task list.
      task_key:
        meaning: Stable task key registered by planner.
        source: ralph tools task list / execution-plan unit id mapping.
        fill_rule: Must match forge:<plan-key>:<unit-id> key form used at registration.
      reason:
        meaning: Why this unit's verification failed.
        source: Verifier failure evidence this activation.
        fill_rule: Non-empty; name the failing gate commands.
      verification_failure_path:
        meaning: Per-unit verification failure log artifact.
        source: File at .ralph/forge/<plan-key>/units/<unit-id>-verification-failure.md.
        fill_rule: Must list commands run and the failure manifest.
        examples: [".ralph/<plan>/units/<unit>-verification-failure.md"]

  forge.unit.integrated:
    required_fields:
      - unit_id
      - plan_key
      - task_id
      - task_key
      - integrated_commit
    payload: json_object
    field_docs:
      unit_id:
        meaning: Unit id whose lane CAS fast-forward landed.
        source: "Runtime DAG scheduler (scheduler_mode: dag), emitted after the lane CAS FF persisted the integrated commit (plan D25)."
        fill_rule: Read-only for hats; never emitted by an agent.
      plan_key:
        meaning: Forge plan key basename.
        source: Runtime DAG scheduler.
        fill_rule: Read-only for hats; never emitted by an agent.
      task_id:
        meaning: Live runtime task id the idempotent projection closes.
        source: Runtime DAG scheduler task registry read.
        fill_rule: Read-only for hats; never emitted by an agent.
      task_key:
        meaning: Stable task key registered by planner.
        source: Runtime DAG scheduler task registry read.
        fill_rule: Read-only for hats; never emitted by an agent; must match forge:<plan-key>:<unit-id>.
      integrated_commit:
        meaning: Commit SHA on the integration lane after this unit's CAS fast-forward.
        source: Runtime DAG scheduler lane CAS FF result (persisted before emit).
        fill_rule: 40-char git SHA; read-only for hats; never emitted by an agent.

  forge.full.verified:
    required_fields:
      - verification_report_path
      - all_required_passed
      - plan_key
    payload: json_object
    field_docs:
      verification_report_path:
        meaning: Full regression and CI-equivalent test report.
        source: File at .ralph/forge/plan-key/full-verification.md.
        fill_rule: Must list every command executed and outcome.
        examples: [".ralph/<plan>/full-verification.md"]
      all_required_passed:
        meaning: Whether every required gate command passed.
        source: Parsed full-verification.md outcomes.
        fill_rule: '"false" means the tester must emit forge.full.verification.failed instead.'
      plan_key:
        meaning: Forge plan key basename.
        source: Trigger / forge artifact root.
        fill_rule: Must match directory name.

  forge.full.verification.failed:
    required_fields:
      - plan_key
      - verification_report_path
      - failure_fingerprint
      - context_artifact_path
      - forge_artifact_root
      - reason
    payload: json_object
    field_docs:
      plan_key:
        meaning: Forge plan key basename.
        source: Trigger / forge artifact root.
        fill_rule: Must match directory name.
      verification_report_path:
        meaning: Full regression and CI-equivalent test report with the failing outcomes.
        source: File at .ralph/forge/plan-key/full-verification.md.
        fill_rule: Must list every command executed and outcome; test -f before emit.
        examples: [".ralph/<plan>/full-verification.md"]
      failure_fingerprint:
        meaning: Stable identifier for this full-verification failure pattern.
        source: Tester (failed gate commands + exit signals).
        fill_rule: Hash-like string; reused for identical failures.
      context_artifact_path:
        meaning: Repo-relative path to a failure note written this activation.
        source: File under .ralph/forge/<plan-key>/failures/tester-failed.md.
        fill_rule: Write before emit; test -f.
        examples: [".ralph/<plan>/failures/tester-failed.md"]
      forge_artifact_root:
        meaning: Directory holding forge artifacts (.ralph/forge/<plan-key>/).
        source: Known plan_key.
        fill_rule: Must point at the plan forge root.
      reason:
        meaning: Human-readable failure reason for the manager report.
        source: Tester summary of the failing full-gate commands.
        fill_rule: Non-empty; name the failing gate commands.

  forge.audit.done:
    required_fields:
      - verdict
      - audit_report_path
      - plan_key
      - target_branch
      - target_start_sha
      - target_status_fingerprint
      - integration_head_sha
    payload: json_object
    allowed_values:
      verdict: [ACCEPTED, REJECTED, BLOCKED]
    field_docs:
      verdict:
        meaning: Final delivery audit outcome.
        source: Auditor cross-check of plan, tests, git history, and artifacts.
        fill_rule: One of ACCEPTED, REJECTED, BLOCKED.
      audit_report_path:
        meaning: Final audit artifact path.
        source: File at .ralph/forge/plan-key/final-audit.md.
        fill_rule: File must exist before emit.
        examples: [".ralph/<plan>/final-audit.md"]
      plan_key:
        meaning: Forge plan key basename.
        source: Trigger / forge artifact root.
        fill_rule: Must match directory name.
      target_branch:
        meaning: Target branch captured at initial fan-out.
        source: forge.worktrees.ready.target_branch.
        fill_rule: Must match the current target branch.
      target_start_sha:
        meaning: Target HEAD captured at initial fan-out.
        source: forge.worktrees.ready.target_start_sha.
        fill_rule: Must equal the current target HEAD.
      target_status_fingerprint:
        meaning: Target status captured at initial fan-out.
        source: forge.worktrees.ready.target_status_fingerprint.
        fill_rule: Must equal the current canonical status fingerprint.
      integration_head_sha:
        meaning: HEAD of the verified integration branch.
        source: git rev-parse of the integration branch.
        fill_rule: Must be a descendant of target_start_sha.

  forge.audit.done.proposed:
    required_fields:
      - verdict
      - audit_report_path
      - plan_key
      - target_branch
      - target_start_sha
      - target_status_fingerprint
      - integration_head_sha
    payload: json_object

  forge.finalized:
    required_fields:
      - audit_report_path
      - target_branch
      - integration_branch
      - target_commit_sha
      - finalization_report_path
      - plan_key
    payload: json_object
    field_docs:
      audit_report_path:
        meaning: Final audit artifact carried into the delivery handoff.
        source: forge.audit.done.audit_report_path.
        fill_rule: Must exist before emit and match the audit event.
        examples: [".ralph/<plan>/final-audit.md"]
      target_branch:
        meaning: Branch that received the final fast-forward.
        source: forge.worktrees.ready.target_branch.
        fill_rule: Must be a real branch and must not equal integration_branch.
      integration_branch:
        meaning: Forge branch whose verified commits were delivered.
        source: forge.worktrees.ready.integration_branch.
        fill_rule: Must be the same branch used by the wave integrator.
      target_commit_sha:
        meaning: Target branch HEAD after the final fast-forward.
        source: "git rev-parse after merge."
        fill_rule: 40-character commit SHA.
      finalization_report_path:
        meaning: Artifact recording the target merge and required artifact checks.
        source: File at .ralph/forge/plan-key/finalization.md.
        fill_rule: Must exist before emit.
        examples: [".ralph/<plan>/finalization.md"]
      plan_key:
        meaning: Forge plan key basename.
        source: Trigger / forge artifact root.
        fill_rule: Must match directory name.

  forge.cleanup.done:
    required_fields:
      - cleanup_report_path
      - cleanup_status
      - attempted_count
      - cleaned_count
      - pending_count
      - plan_key
    payload: json_object
    allowed_values:
      cleanup_status:
        - completed
        - partial
        - retained_for_diagnosis
    field_docs:
      cleanup_report_path:
        meaning: Per-resource cleanup report written before the reporter runs.
        source: File at .ralph/forge/<plan-key>/cleanup.md.
        fill_rule: Verify file exists; path must be repo-relative.
        examples: [".ralph/<plan>/cleanup.md"]
      cleanup_status:
        meaning: Aggregate forge resource cleanup result.
        source: Cleanup hat after processing the worktree map.
        fill_rule: One of completed, partial, retained_for_diagnosis.
      attempted_count:
        meaning: Number of forge worktree/branch resources considered.
        source: Cleanup report.
        fill_rule: Non-negative integer.
      cleaned_count:
        meaning: Number of forge resources fully cleaned.
        source: Cleanup report.
        fill_rule: Non-negative integer and no greater than attempted_count.
      pending_count:
        meaning: Number of forge resources still present or retained.
        source: Cleanup report.
        fill_rule: Non-negative integer; partial success must be visible here.
      plan_key:
        meaning: Forge plan key basename.
        source: Trigger / forge artifact root.
        fill_rule: Must match directory name.

  forge.report.done:
    required_fields:
      - report_path
      - status
      - final_audit
      - plan_key
    payload: json_object
    field_docs:
      report_path:
        meaning: Manager-readable Markdown report path.
        source: File written at docs/reports/date-task-manager-report.md per naming rules.
        fill_rule: Verify file exists; follow parallel-forge naming rules.
        examples: [".ralph/<plan>/manager-report.md"]
      status:
        meaning: Manager report status derived from Auditor verdict or blocked/failed mapping.
        source: Map ACCEPTED→COMPLETED, REJECTED→FAILED/PARTIAL, BLOCKED→BLOCKED; work.failed→FAILED.
        fill_rule: Must align with trigger verdict / reason mapping in instructions.
      final_audit:
        meaning: Auditor verdict or BLOCKED/FAILED stand-in for non-audit terminals.
        source: Trigger forge.audit.done.verdict, or BLOCKED/FAILED for blocked/failed triggers.
        fill_rule: Do not invent ACCEPTED when audit did not run.
      plan_key:
        meaning: Forge plan key basename.
        source: Trigger forge_artifact_root / plan_key fields.
        fill_rule: Must match directory name.

  forge.plan.blocked:
    required_fields:
      - reason
      - plan_path
      - context_artifact_path
      - forge_artifact_root
      - plan_key
    payload: json_object
    field_docs:
      reason:
        meaning: Human-readable block reason for the manager report.
        source: Current hat judgment after reading visible artifacts.
        fill_rule: Non-empty; do not invent upstream facts.
      plan_path:
        meaning: Operator plan path being blocked.
        source: Trigger / loop anchor.
        fill_rule: Live path only.
      context_artifact_path:
        meaning: Repo-relative path to a block note written this activation (what failed and evidence).
        source: File under .ralph/forge/<plan-key>/blocks/<hat-id>-blocked.md.
        fill_rule: Write file before emit; test -f; path must be repo-relative.
        examples: [".ralph/<plan>/blocks/<hat>-blocked.md"]
      forge_artifact_root:
        meaning: Directory holding forge artifacts for this plan (.ralph/forge/<plan-key>/).
        source: Known plan_key from this run.
        fill_rule: Must exist or be creatable; trailing slash optional.
      plan_key:
        meaning: Forge plan key basename.
        source: Basename of plan_path without .md.
        fill_rule: Must match forge_artifact_root segment.

  LOOP_COMPLETE:
    required_fields:
      - report_path
    payload: json_object
    field_docs:
      report_path:
        meaning: Repo-relative path to the manager report (same as forge.report.done.report_path).
        source: forge.report.done trigger payload or file written this activation.
        fill_rule: Must match an existing report file path.
        examples: [".ralph/<plan>/manager-report.md"]

  # Supervisor slot topics (worker publishes; schema parity with ce-executor-supervisor)
  exec.wave.complete:
    required_fields:
      - wave_id
      - completed_slots
      - merge_root_event_id

  exec.wave.failed:
    required_fields:
      - wave_id
      - blocking_slots
      - reason
    payload: json_object
    field_docs:
      wave_id:
        meaning: Execution wave that failed fan-in.
        source: Supervisor fan-in (runtime-injected).
        fill_rule: Read-only for hats; never emitted by an agent.
      blocking_slots:
        meaning: >-
          Slot indices in Failed or Cancelled state. Every listed slot has
          already spent its full attempt budget (each retry is a fresh
          worker process resuming the same worktree), so this event means
          exhaustion, not a single failure.
        source: Supervisor fan-in (runtime-injected).
        fill_rule: Read-only for hats; never emitted by an agent.
      reason:
        meaning: >-
          Wave-level failure reason: cancelled / timeout /
          required_slot_failure / incomplete_evidence /
          expected_total_zero.
        source: Supervisor fan-in (runtime-injected).
        fill_rule: Read-only for hats; never emitted by an agent.
      slot_failures:
        meaning: >-
          Per-slot detail, one entry per blocking slot, each with
          slot_index / reason / duration_ms / failure_class. The
          failure_class labels (timeout / orphan_or_empty_result /
          identity_mismatch / cancel / required_slot_failure /
          unknown) are what the failure handler triages on.
        source: Supervisor fan-in (runtime-injected).
        fill_rule: Read-only for hats; never emitted by an agent.
      salvaged_slots:
        meaning: >-
          Completed slot indices whose business events were merged to
          the main ledger before this failure. Their Units are done and
          must stay out of any correction scope.
        source: Supervisor fan-in (runtime-injected).
        fill_rule: Read-only for hats; never emitted by an agent.
      redrive_slots:
        meaning: >-
          Blocking slots whose reason is classified retryable. These slots
          already exhausted their in-wave attempts, so this is an operator
          hint only — redrive is an operator command, no hat can
          re-dispatch a worker.
        source: Supervisor fan-in (runtime-injected).
        fill_rule: Read-only for hats; never emitted by an agent.

  work.failed:
    required_fields:
      - reason
      - plan_path
      - context_artifact_path
      - forge_artifact_root
      - plan_key
      - dead_end_confidence
      - dead_end_evidence_coverage
      - dead_end_evidence_file
      - failure_evidence_status
      - correction_status
      - dead_end_gate_passed
    payload: json_object
    field_types:
      dead_end_gate_passed: bool
    allowed_values:
      failure_evidence_status: [complete, incomplete]
      correction_status: [exhausted, not_exhausted, not_applicable]
    field_docs:
      reason:
        meaning: Human-readable failure reason for the manager report.
        source: Current hat or supervisor-injected wave failure summary.
        fill_rule: Non-empty; copy upstream reason when translating exec.wave.failed.
      plan_path:
        meaning: Operator plan path for this forge run.
        source: Loop anchor / prior projection / trigger.
        fill_rule: Live path only.
      context_artifact_path:
        meaning: Repo-relative path to a failure note written this activation.
        source: File under .ralph/forge/<plan-key>/failures/<hat-id>-failed.md.
        fill_rule: Write before emit; test -f.
        examples: [".ralph/<plan>/failures/<hat>-failed.md"]
      forge_artifact_root:
        meaning: Directory holding forge artifacts (.ralph/forge/<plan-key>/).
        source: Known plan_key.
        fill_rule: Must point at the plan forge root.
      plan_key:
        meaning: Forge plan key basename.
        source: Basename of plan_path or prior trigger plan_key.
        fill_rule: Must match forge_artifact_root segment.

  work.failed.proposed:
    required_fields:
      - reason
      - plan_path
      - context_artifact_path
      - forge_artifact_root
      - plan_key
      - dead_end_confidence
      - dead_end_evidence_coverage
      - dead_end_evidence_file
      - failure_evidence_status
      - correction_status
      - dead_end_gate_passed
    payload: json_object

state_projection:
  enabled: true
  actions:
    forge.plan.ready:
      kind: ensure_task_batch
      # Runtime-only derived fields. The public event carries only the
      # artifact reference/identity/digest; the projector materializes these
      # pointers from execution-plan.yml before entering the validated batch
      # path. Non-Parallel-Forge EnsureTaskBatch behavior is unchanged.
      items: unit_tasks
      count: unit_count
      key: task_key
      title: title
      blocked_by_keys: depends_on_task_keys
      execution_wave: execution_wave
      integration_order: integration_order
      execution_plan_digest: plan_digest
    forge.wave.settled:
      kind: close_task_batch
      task_ids: settled_task_ids
    # DAG 模式(D25):runtime 在 lane CAS FF 后发射 forge.unit.integrated;
    # 事件过 acceptance 时投影关闭该 unit 的任务,ack 由 runtime 在事件
    # 回流后写入 DAG store(全部 ack 才允许 forge.exec.development.done)。
    forge.unit.integrated:
      kind: close_task
      task_id: task_id
