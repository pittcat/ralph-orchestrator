# Payload schemas for ce-executor.
#
# STATUS: DEPRECATED REFERENCE COPY. As of 2026-06-03 the same content is
# inlined into `presets/en/ce-executor.yml` under `event_policy.schemas`,
# and `presets/en/ce-executor.yml` no longer sets `event_policy.schema_file`.
# `resolve_schema_files` cannot resolve a relative `schema_file` for builtin
# presets (no on-disk anchor), so the previous `../schemas/ce-executor.yml`
# reference caused `ralph -H builtin:ce-executor run` to fail with
# `Payload contract gate failed ... SchemaMissingForRequiredTopic` for
# 5 topics (work.done, review.wave.ready, review.passed, review.complete,
# fix.applied).
#
# This file is kept as a diff-able reference only. If you add or change a
# schema, edit `presets/en/ce-executor.yml` and update this file in lockstep
# (or delete it once no consumers remain).
#
# Coverage:
#   coordinator     -> work.ready
#   coordinator/executor -> work.failed
#   executor        -> work.done
#   review-coordinator  -> review.wave.ready
#   dimension-reviewer  -> review.dimension.done
#   review-synthesizer  -> review.passed / review.failed / review.complete
#   fixer           -> fix.applied / fix.exhausted
#   debug-resolver  -> fix.plan.ready / debug.exhausted / plan.blocked
#   plan-gate       -> queue.advance / plan.complete / plan.blocked
#   shipper         -> REVIEW_COMPLETE
#   reporter        -> report.done

work.ready:
  required_fields:
    - plan_name
    - plan_path
    - task_id
    - task_key
    - step
    - complexity
  payload: json_object

work.done:
  required_fields:
    - plan_name
    - plan_path
    - task_id
    - task_key
    - step
    - commit_count
    - changed_lines
  payload: json_object

work.failed:
  required_fields:
    - reason
  payload: json_object

review.wave.ready:
  required_fields:
    - dimension
    - focus
    - depth
    - diff_base
    - intent_summary
    - changed_files
    - plan_name
    - task_id
    - task_key
    - step
  payload: json_object

review.dimension.done:
  required_fields:
    - dimension
    - findings_count
    - findings_file
    - plan_name
    - task_id
    - task_key
    - step
  payload: json_object

review.passed:
  required_fields:
    - plan_name
    - task_id
    - task_key
    - step
    - findings_count
    - fix_round
    - verdict
  payload: json_object

review.failed:
  required_fields:
    - plan_name
    - fix_round
    - safe_auto_count
    - gated_manual_count
    - findings_summary
    - task_id
    - task_key
    - step
  payload: json_object

review.complete:
  required_fields:
    - plan_name
    - fix_round
    - verdict
    - residual_findings_count
    - findings_summary
    - task_id
    - task_key
    - step
    - findings_count
  payload: json_object

fix.applied:
  required_fields:
    - plan_name
    - fix_round
    - applied_count
    - failed_count
    - task_id
    - task_key
    - step
    # Mirror work.done schema so the fix.applied → review-
    # coordinator path carries diff-state context. Without these
    # the gate cannot distinguish "fix changed 2 lines, skip
    # review" from a real post-fix wave.
    - commit_count
    - changed_lines
  payload: json_object

fix.exhausted:
  required_fields:
    - plan_name
    - fix_round
    - task_id
    - task_key
    - step
  payload: json_object

fix.plan.ready:
  required_fields:
    - plan_name
    - task_id
    - task_key
    - step
    - root_cause_summary
    - causal_chain
    - recommended_tests
    - fix_plan
  payload: json_object

debug.exhausted:
  required_fields:
    - plan_name
    - reason
    - task_id
    - task_key
    - step
    - debug_summary
  payload: json_object

queue.advance:
  required_fields:
    - plan_name
    - completed_step
    - next_step
    - reviewed_task_id
    - reviewed_task_key
  payload: json_object

plan.complete:
  required_fields:
    - plan_name
    - completed_steps
    - task_id
    - task_key
    - verdict
  payload: json_object

plan.blocked:
  required_fields:
    - reason
  payload: json_object

REVIEW_COMPLETE:
  required_fields:
    - plan_name
    - verdict
    - pass_or_fail
    - residual_findings_summary
  payload: json_object

report.done:
  required_fields:
    - report_path
    # 2026-06-09 fix: awaiting_decision is set by the reporter
    # on a failing review so the manager-facing report and the
    # verdict_gate can both see that the loop has not passed
    # final review.  Required field so the contract rejects
    # reporters that silently emit report.done without the
    # manager-decision flag.
    - awaiting_decision
  payload: json_object
