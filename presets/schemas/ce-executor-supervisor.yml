# Authoring SSOT for `ce-executor-supervisor` `event_policy.schemas`.
#
# 2026-07-03-001 plan U13: schema SSOT for the six supervisor
# coordination topics + a handful of slot-level worker events.
# Builds.rs merges this file's `schemas:` mapping into the
# inline `event_policy.schemas:` block of
# `presets/en/ce-executor-supervisor.yml`. See the
# `presets/en/ce-executor-serial.yml` schema for the full
# schema-format reference.
#
# All entries here MUST round-trip through
# `EventSchema.required_fields` checks at CLI emit time;
# U13 BDD scenario asserts the worker fan-out + integrator
# merge path. Wave-coord payloads are system-injected by the
# supervisor (U8 / U12); agents must NOT emit them.

schemas:
  exec.wave.complete:
    required_fields:
      - wave_id
      - completed_slots
      - merge_root_event_id
  exec.wave.failed:
    required_fields:
      - wave_id
      - blocking_slots
      - reason
  fix.wave.complete:
    required_fields:
      - wave_id
      - completed_slots
      - merge_root_event_id
  fix.wave.failed:
    required_fields:
      - wave_id
      - blocking_slots
      - reason
  review.wave.complete:
    required_fields:
      - wave_id
      - completed_dimensions
      - aggregate_timeout
  review.wave.failed:
    required_fields:
      - wave_id
      - missing_dimensions
      - reason
  exec.unit.done:
    required_fields:
      - wave_id
      - slot_index
      - content_hash
  exec.unit.failed:
    required_fields:
      - wave_id
      - slot_index
      - reason
  fix.unit.done:
    required_fields:
      - wave_id
      - slot_index
      - content_hash
  fix.unit.failed:
    required_fields:
      - wave_id
      - slot_index
      - reason
  review.unit.done:
    required_fields:
      - wave_id
      - dimension
      - findings
  review.unit.ready:
    required_fields:
      - wave_id
      - dimension
