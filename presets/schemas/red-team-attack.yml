# Authoring SSOT for `red-team-attack` `event_policy.schemas`.
#
# `build.rs` deep-merges this file's `schemas:` mapping into
# `event_loop.event_policy.schemas` of `presets/en/red-team-attack.yml`
# at compile time. Edit ONLY this file when changing payload contract
# requirements for any hat below.
#
# Topic coverage (9 declared hats plus the evidence queue handoff):
#   target-locker       -> redteam.target.locked
#   plan-resolver       -> redteam.plan.resolved
#   attack-surface-mapper -> redteam.experiment.plan.ready
#   experiment-plan-validator -> redteam.experiment.plan.valid|invalid
#   experiment-runner   -> redteam.experiment.done
#   evidence-gate       -> redteam.evidence.gated
#   impact-boundary     -> redteam.plan.ready
#   independent-reviewer -> redteam.reviewed
#   reporter            -> redteam.complete (terminal completion token)
#   producer hats       -> redteam.failed -> reporter
#   target-locker failure is relayed by plan-resolver after required target.locked.
#
# Evidence-gate failures are recorded and the queue continues with independent
# experiments. Producer failures (tree mutation, missing target, or broken
# artifact ownership) remain terminal for this run.
#
# Topic deny rules live in `presets/en/red-team-attack.yml`
# `event_policy.topic_deny_rules` (not in this SSOT).

schemas:
  # target-locker -> lock confirmed. All downstream hats read the lock
  # file to verify HEAD/tree unchanged before and after their work.
  redteam.target.locked:
    required_fields:
      - target_head
      - target_tree
      - plan_count
      - lock_file_path
      - lock_status
    payload: json_object
    field_docs:
      target_head:
        meaning: Locked Git HEAD SHA at experiment start.
        source: "git rev-parse HEAD at lock time."
        fill_rule: "Full 40-char SHA; must match git rev-parse HEAD at emit time."
      target_tree:
        meaning: Locked Git tree SHA at experiment start.
        source: "git rev-parse HEAD^{tree} at lock time."
        fill_rule: "Full 40-char SHA; must match git rev-parse HEAD^{tree} at emit time."
      plan_count:
        meaning: Number of development plans provided as input.
        source: Count of plan paths from prompt file.
        fill_rule: Positive integer.
      lock_file_path:
        meaning: Path to the target-lock artifact under `.ralph/`.
        source: File actually written this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<target-lock>.md"]
      lock_status:
        meaning: Whether the target was successfully locked (no in-progress git operations, clean tree).
        source: Locker writes from git status checks.
        fill_rule: One of `locked`, `failed`. `locked` means clean tree and no MERGE_HEAD/REBASE_HEAD/CHERRY_PICK_HEAD; `failed` means any check failed.

  # Any producer -> reporter. This is the only business failure branch.
  redteam.failed:
    required_fields:
      - failed_stage
      - reason
      - failure_artifact_path
    payload: json_object
    allowed_values:
      failed_stage:
        - plan-resolver
        - experiment-plan-validator
        - attack-surface-mapper
        - experiment-runner
        - evidence-gate
        - impact-boundary
        - independent-reviewer
    field_docs:
      failed_stage:
        meaning: Hat stage that could not satisfy its activation contract.
        source: The producer hat emitting this failure.
        fill_rule: One of the listed producer hat IDs; it must match the emitting hat.
      reason:
        meaning: Stable reason code for the failure.
        source: Producer's failure analysis written to the failure artifact.
        fill_rule: Non-empty stable token; do not use prose or claim a qualified finding.
      failure_artifact_path:
        meaning: Path to the failure artifact under `.ralph/` containing full evidence and follow-up guidance.
        source: File written by the producer before the failure emit.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<failure>.md"]

  # plan-resolver -> per-plan commit resolution result. attack-surface-mapper
  # reads the resolution artifact to build attack surfaces.
  #
  # 2026-08-08-004 plan U1 (D3/D7/D8/D12): scope manifest fields added.
  # The plan-resolver emits redteam.plan.resolved only when scope_status
  # is resolved AND all thresholds are met; otherwise it emits redteam.failed.
  #
  # 2026-08-08-004 plan U6: extended with coverage, boundary_consistency,
  # boundary_conflict, critical_traceability for mixed/conflict gates.
  redteam.plan.resolved:
    required_fields:
      - resolved_count
      - unresolved_count
      - resolution_file_path
      # U1 scope manifest fields
      - scope_manifest_path
      - scope_digest
      - scope_status
      - proceed
      - overall_confidence
      - critical_unknown_count
      - scope_base_sha
      - resolved_patch_path
      - patch_digest
      # U6: mixed/conflict gates
      - coverage
      - critical_traceability
      - boundary_consistency
      - boundary_conflict
    payload: json_object
    allowed_values:
      scope_status:
        - resolved
        - ambiguous
        - blocked
    field_docs:
      resolved_count:
        meaning: Plans with commit match confidence >= 85 and at least one hard evidence.
        source: Count from `.ralph/red-team/02-plan-resolution.md`.
        fill_rule: Integer >= 0.
      unresolved_count:
        meaning: Plans that exhausted retry and still below threshold.
        source: Count from `.ralph/red-team/02-plan-resolution.md`.
        fill_rule: Integer >= 0.
      resolution_file_path:
        meaning: Path to the plan-resolution artifact under `.ralph/`.
        source: File actually written by plan-resolver during this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<plan-resolution>.md"]
      scope_manifest_path:
        meaning: Repo-relative path to the multi-plan scope manifest JSON artifact under `.ralph/`.
        source: Plan-resolver writes the scope manifest during this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` and reject emit if missing or digest mismatches.
        examples: [".ralph/<plan>/<unit>/<scope-manifest>.json"]
      scope_digest:
        meaning: SHA-256 hex digest of canonical scope manifest bytes (64 hex chars).
        source: Plan-resolver computes from scope-manifest.json canonical JSON.
        fill_rule: 64-char hex from SHA-256 of canonical JSON; recompute on every emit attempt.
      scope_status:
        meaning: Scope resolution decision from plan-resolver analysis.
        source: Plan-resolver resolves via plan candidates, commit attribution, and hunk classification.
        fill_rule: One of `resolved | ambiguous | blocked`; only `resolved` allows proceed to attack surface.
      proceed:
        meaning: Whether the resolved scope is allowed to activate attack-surface-mapper.
        source: Plan-resolver's threshold decision from the current scope analysis.
        fill_rule: Boolean; true only when scope_status=resolved, overall_confidence>=90, critical_unknown_count==0, resolved_count>=1, coverage>=90, critical_traceability>=90, boundary_conflict=false, and boundary_consistency=true; otherwise false and emit redteam.failed.
      overall_confidence:
        meaning: Weighted overall confidence score (0/85/90/100) for the scope resolution.
        source: "Plan-resolver computes per D7: identity 15% + base 15% + commit_attribution 20% + hunk_attribution 25% + interleaved 10% + override_revert 5% + cross_check 10%."
        fill_rule: One of 0/85/90/100; resolved requires overall >= 90 AND base/hunk/interleaved/cross_check >= 90.
      critical_unknown_count:
        meaning: Number of critical-path hunk/commit attributions that could not be resolved.
        source: Plan-resolver counts critical unknown from classification table.
        fill_rule: Non-negative integer; resolved requires critical_unknown_count == 0.
      scope_base_sha:
        meaning: Git SHA of the scope base commit (lower bound of scoped diff); MUST NOT be a placeholder.
        source: Plan-resolver resolves via explicit input or fixed anchor/parent algorithm (D5).
        fill_rule: 40-char hex SHA; must not be `<global-baseline>`, `TBD`, `<pending>`, or any other placeholder string.
        examples: ["<40-hex-git-sha>"]
      resolved_patch_path:
        meaning: Repo-relative path to the resolved scoped patch artifact under `.ralph/`.
        source: Plan-resolver writes the patch after combining all plan-owned diffs.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit and reject if missing.
        examples: [".ralph/<plan>/<unit>/<resolved-patch>.patch"]
      patch_digest:
        meaning: SHA-256 hex digest of the resolved patch file bytes (64 hex chars).
        source: Plan-resolver computes from resolved_patch_path.
        fill_rule: 64-char hex; recompute on every emit attempt.
      # U6: mixed/conflict gates
      coverage:
        meaning: Percentage of hunks/commits attributed to known plans (0-100).
        source: "Plan-resolver computes from classification table: attributed_hunks / total_hunks * 100."
        fill_rule: "Integer 0-100; resolved requires coverage >= 90."
      critical_traceability:
        meaning: Percentage of critical-path items with full trace (0-100).
        source: Plan-resolver computes from critical-path coverage analysis.
        fill_rule: "Integer 0-100; default 100."
      boundary_consistency:
        meaning: Whether independent manifest and optional boundary agree on scope base (true/false).
        source: Plan-resolver compares independent base SHA with optional merge_boundary SHA.
        fill_rule: "Boolean; default true; when no boundary is provided, set to true and cross_check=not_applicable."
      boundary_conflict:
        meaning: Whether a boundary disagreement was detected (true = conflict, blocks attack-surface).
        source: Plan-resolver detects when independent base SHA differs from boundary base SHA.
        fill_rule: "Boolean; default false; true means cross_check=0 and attack-surface must refuse."

  # attack-surface-mapper -> a plan artifact is ready for generic feasibility validation.
  redteam.experiment.plan.ready:
    required_fields:
      - attack_surface_path
      - experiment_plan_path
      - experiment_count
      - validation_attempt
    payload: json_object
    field_docs:
      attack_surface_path:
        meaning: Path to the attack-surface artifact under `.ralph/`.
        source: Attack-surface-mapper writes the artifact before emitting.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<attack-surface>.md"]
      experiment_plan_path:
        meaning: Path to the complete experiment plan awaiting validation.
        source: Attack-surface-mapper writes the plan before emitting.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<experiment-plan>.md"]
      experiment_count:
        meaning: Number of RTE entries declared in the experiment plan.
        source: Count from the written experiment plan.
        fill_rule: Positive integer matching the plan artifact.
      validation_attempt:
        meaning: Number of mapper rewrites already applied to this plan.
        source: Zero on the initial plan; incremented only after a validator rejection.
        fill_rule: Integer from 0 through 3; do not exceed the bounded rewrite budget.

  # experiment-plan-validator -> plan passed generic feasibility checks.
  redteam.experiment.plan.valid:
    required_fields:
      - attack_surface_path
      - experiment_plan_path
      - validation_report_path
      - experiment_count
      - validation_attempt
      - validation_status
    payload: json_object
    allowed_values:
      validation_status: [valid]
    field_docs:
      attack_surface_path:
        meaning: Path to the validated attack-surface artifact.
        source: Copied from the accepted plan.ready trigger after `test -f`.
        fill_rule: Real readable `.ralph/` artifact path.
        examples: [".ralph/<plan>/<unit>/<attack-surface>.md"]
      experiment_plan_path:
        meaning: Path to the experiment plan approved for execution.
        source: Copied from the accepted plan.ready trigger after validation.
        fill_rule: Real readable `.ralph/` artifact path.
        examples: [".ralph/<plan>/<unit>/<experiment-plan>.md"]
      validation_report_path:
        meaning: Path to the validator's generic feasibility report.
        source: Validator writes it before emit.
        fill_rule: Real readable `.ralph/` artifact path; report must include discovery evidence for every RTE.
        examples: [".ralph/<plan>/<unit>/plan-validation.md"]
      experiment_count:
        meaning: Number of experiments validated and released to the runner.
        source: Validator counts the plan entries after reading the artifact.
        fill_rule: Positive integer equal to the plan count.
      validation_attempt:
        meaning: Rewrite attempt associated with this validated plan.
        source: Copied from the plan.ready trigger.
        fill_rule: Integer from 0 through 3.
      validation_status:
        meaning: Validator's release decision.
        source: Validator's per-experiment feasibility checks.
        fill_rule: Literal `valid` only.

  # experiment-plan-validator -> the named experiment needs mapper repair.
  redteam.experiment.plan.invalid:
    required_fields:
      - experiment_plan_path
      - validation_report_path
      - failed_experiment_id
      - reason
      - validation_attempt
      - validation_status
    payload: json_object
    allowed_values:
      validation_status: [invalid]
    field_docs:
      experiment_plan_path:
        meaning: Path to the plan containing the rejected experiment.
        source: Copied from the plan.ready trigger.
        fill_rule: Real readable `.ralph/` artifact path.
        examples: [".ralph/<plan>/<unit>/<experiment-plan>.md"]
      validation_report_path:
        meaning: Path to the report containing concrete rewrite evidence.
        source: Validator writes it before emit.
        fill_rule: Real readable `.ralph/` artifact path.
        examples: [".ralph/<plan>/<unit>/plan-validation.md"]
      failed_experiment_id:
        meaning: First RTE entry that failed generic feasibility validation.
        source: Validator reads the experiment plan and report.
        fill_rule: Existing `RTE-NNN` identifier; do not invent or skip entries.
      reason:
        meaning: Stable short reason identifying the missing feasibility proof.
        source: Validator's report; full evidence stays in the validation artifact.
        fill_rule: Non-empty stable token or bounded short summary; no fabricated project fact.
      validation_attempt:
        meaning: Rewrite attempt that produced this rejection.
        source: Copied from the plan.ready trigger.
        fill_rule: Integer 0 through 2; after attempt 3 emit redteam.failed instead.
      validation_status:
        meaning: Validator's release decision.
        source: Validator's per-experiment feasibility checks.
        fill_rule: Literal `invalid` only.

  # experiment-runner -> one experiment completed with raw evidence saved.
  # evidence-gate reads the experiment artifact and evidence files.
  redteam.experiment.done:
    required_fields:
      - experiment_id
      - control_passed
      - attack_reproduced
      - evidence_paths
      - experiment_file_path
      - evidence_manifest_path
      - ledger_sha256
      - experiment_worktree_path
    payload: json_object
    field_docs:
      experiment_id:
        meaning: Unique experiment identifier (RTE-NNN).
        source: Runner assigns from experiment plan.
        fill_rule: Format `RTE-\d{3,}`; must match experiment artifact filename.
      control_passed:
        meaning: Whether control group passed all required repetitions.
        source: Runner writes from control execution results.
        fill_rule: Boolean.
      attack_reproduced:
        meaning: Whether attack group reproduced the invariant violation.
        source: Runner writes from attack execution results.
        fill_rule: Boolean.
      evidence_paths:
        meaning: Paths to raw evidence files (stdout, stderr, state dumps, screenshots).
        source: Runner writes from actual files saved under `.ralph/red-team/evidence/RTE-<NNN>/`.
        fill_rule: Array of real readable `.ralph/` artifact paths; run `test -f` for every entry before emit.
        examples: [[".ralph/<plan>/<unit>/<evidence>.log"]]
      experiment_file_path:
        meaning: Path to the experiment artifact under `.ralph/`.
        source: File actually written by experiment-runner during this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<experiment>.md"]
      evidence_manifest_path:
        meaning: Path to the machine-readable evidence manifest under `.ralph/`.
        source: Runner writes the manifest after hashing every mandatory evidence item.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit; the manifest must enumerate every mandatory evidence item and its SHA-256.
        examples: [".ralph/<plan>/<unit>/<evidence-manifest>.json"]
      ledger_sha256:
        meaning: SHA-256 of the ledger/state artifact required by this experiment.
        source: Runner reads the hash from the evidence manifest after computing it from the actual target file.
        fill_rule: Exactly 64 lowercase hexadecimal characters; never infer it from a narrative, event log, or transition ID.
      experiment_worktree_path:
        meaning: Repo-relative path of the git worktree used for this RTE's mutating experiment. Not a host `.ralph/` evidence artifact; identity/routing field so later hats know where the scratch tree lived.
        source: Path created or reused by experiment-runner via `git worktree add --detach .worktrees/redteam-<experiment_id> <locked-head>`.
        fill_rule: Must be `.worktrees/redteam-<experiment_id>/`; must appear in `git worktree list`; must not equal host `git rev-parse --show-toplevel`. Do not invent a path without creating the worktree.
        examples: [".worktrees/redteam-<RTE-id>/"]

  # evidence-gate -> request the next independent experiment. This explicit
  # serial queue edge was missing from the previous preset.
  redteam.experiment.next:
    required_fields:
      - next_experiment_id
      - completed_count
      - remaining_count
      - accepted_count
      - rejected_count
      - evidence_board_path
    payload: json_object
    field_docs:
      next_experiment_id:
        meaning: The exact next unexecuted RTE identifier selected from the experiment plan.
        source: Evidence-gate reads the queue and accepted/rejected records from the evidence board.
        fill_rule: Existing RTE-NNN identifier; do not invent or skip an experiment.
      completed_count:
        meaning: Number of experiments with a recorded done or rejected result.
        source: Evidence-gate counts durable queue records in the evidence board.
        fill_rule: Non-negative integer; must equal the number of accepted redteam.experiment.done events and satisfy completed_count + remaining_count = experiment_count.
      remaining_count:
        meaning: Number of planned experiments still not executed after the current result.
        source: Evidence-gate computes from the experiment plan and durable result records.
        fill_rule: Positive integer for this topic; when zero, emit redteam.evidence.gated or redteam.failed instead.
      accepted_count:
        meaning: Number of completed experiments that passed the evidence gate so far.
        source: Evidence-gate counts qualified entries in the evidence board.
        fill_rule: Non-negative integer; rejected experiments are not counted, and accepted_count + rejected_count must equal completed_count.
      rejected_count:
        meaning: Number of completed experiments that failed evidence qualification so far.
        source: Evidence-gate counts rejected entries in the evidence board.
        fill_rule: Non-negative integer; every rejection retains its reason and artifact path, and accepted_count + rejected_count must equal completed_count.
      evidence_board_path:
        meaning: Durable queue and evidence-board artifact consumed by the next runner activation.
        source: Evidence-gate writes `.ralph/red-team/07-evidence-board.md` before emitting.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` and read it before the next runner activation; retain for reporter and independent review.
        examples: [".ralph/<plan>/<unit>/<evidence-board>.md"]

  # evidence-gate -> all experiments accounted for and at least one qualified.
  # impact-boundary reads the aggregate board to bound impact.
  redteam.evidence.gated:
    required_fields:
      - qualified_experiment_ids
      - qualified_experiment_count
      - rejected_experiment_count
      - total_experiment_count
      - minimum_confidence
      - minimum_evidence_coverage
      - minimum_verifiability
      - minimum_impact_certainty
      - evidence_board_path
    payload: json_object
    field_docs:
      qualified_experiment_ids:
        meaning: Ordered identifiers of experiments that passed all binary gates and thresholds.
        source: Evidence-gate reads accepted entries in the evidence board.
        fill_rule: Non-empty array of existing RTE-NNN identifiers; rejected IDs must not appear.
      qualified_experiment_count:
        meaning: Number of qualified experiments available for impact analysis.
        source: Length of qualified_experiment_ids.
        fill_rule: Positive integer; must match the array length.
      rejected_experiment_count:
        meaning: Number of planned experiments rejected after evidence review.
        source: Evidence-gate counts rejected entries in the evidence board.
        fill_rule: Non-negative integer; rejected candidates remain in the report.
      total_experiment_count:
        meaning: Number of experiments in the declared experiment plan.
        source: experiment.plan.valid experiment_count and the completed evidence board.
        fill_rule: Positive integer; must equal qualified plus rejected counts at finalization.
      minimum_confidence:
        meaning: Lowest confidence score among qualified experiments.
        source: Evidence-gate computes from accepted experiment scores.
        fill_rule: Integer 0-100 and at least the applicable threshold.
      minimum_evidence_coverage:
        meaning: Lowest evidence coverage score among qualified experiments.
        source: Evidence-gate computes from accepted experiment scores.
        fill_rule: Integer 0-100 and at least the applicable threshold.
      minimum_verifiability:
        meaning: Lowest verifiability score among qualified experiments.
        source: Evidence-gate computes from accepted experiment scores.
        fill_rule: Integer 0-100 and at least 90.
      minimum_impact_certainty:
        meaning: Lowest impact certainty score among qualified experiments.
        source: Evidence-gate computes from accepted experiment scores.
        fill_rule: Integer 0-100 and at least the applicable threshold.
      evidence_board_path:
        meaning: Aggregate evidence board consumed by impact-boundary and independent-reviewer.
        source: Evidence-gate writes `.ralph/red-team/07-evidence-board.md` before final emit.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` and read it before impact analysis; must include accepted and rejected experiments.
        examples: [".ralph/<plan>/<unit>/<evidence-board>.md"]

  # impact-boundary -> all findings processed and PLAN.md written.
  # independent-reviewer picks this up to run the final audit.
  redteam.plan.ready:
    required_fields:
      - plan_file_path
      - finding_count
      - impact_file_path
    payload: json_object
    field_docs:
      plan_file_path:
        meaning: Path to the completed repair-plan artifact under `.ralph/`.
        source: File actually written by impact-boundary during this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<repair-plan>.md"]
      finding_count:
        meaning: Number of formal findings (RTF-*) included in the plan.
        source: Count from `.ralph/red-team/findings/`.
        fill_rule: Integer >= 0.
      impact_file_path:
        meaning: Path to the impact-boundary artifact under `.ralph/`.
        source: File actually written by impact-boundary during this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<impact-boundary>.md"]

  # independent-reviewer -> final review complete. reporter reads review
  # artifact to write REPORT.md and emit completion.
  redteam.reviewed:
    required_fields:
      - verdict
      - review_file_path
      - plan_file_path
    payload: json_object
    field_docs:
      verdict:
        meaning: Final review verdict.
        source: Reviewer writes from audit checklist.
        fill_rule: One of `PLAN_READY`, `PLAN_REJECTED`.
      review_file_path:
        meaning: Path to the independent-review artifact under `.ralph/`.
        source: File actually written by independent-reviewer during this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<independent-review>.md"]
      plan_file_path:
        meaning: Path to the repair-plan artifact under `.ralph/`.
        source: File written by impact-boundary and verified by independent-reviewer.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<repair-plan>.md"]

  # reporter -> sole completion token for red-team-attack.
  redteam.complete:
    required_fields:
      - success
      - report_path
      - plan_path
      - questions_path
    completion_artifact_fields:
      report_path: required
      plan_path: allow_empty
      questions_path: allow_empty
    payload: json_object
    field_docs:
      success:
        meaning: Whether the red team analysis completed successfully (PLAN_READY).
        source: Reporter copies from `redteam.reviewed.verdict`.
        fill_rule: true only when verdict is `PLAN_READY`; otherwise false.
      report_path:
        meaning: Path to the operator-facing report artifact under `.ralph/`.
        source: File actually written by reporter during this activation.
        fill_rule: Real readable `.ralph/` artifact path; run `test -f` before emit.
        examples: [".ralph/<plan>/<unit>/<report>.md"]
      plan_path:
        meaning: Path to the repair-plan artifact under `.ralph/`; it may be empty on the failure branch.
        source: Reporter reads the repair plan on success, or the failure artifact on failure.
        fill_rule: When success=true, use the readable repair-plan artifact path and verify `test -f`; when success=false, use an empty string. Never invent a path.
        examples: [".ralph/<plan>/<unit>/<repair-plan>.md", ""]
      questions_path:
        meaning: Path to the questions artifact under `.ralph/`, or an empty string when no questions exist.
        source: Reporter writes the questions artifact during this activation.
        fill_rule: When non-empty, use a real readable `.ralph/` artifact path and run `test -f`; otherwise use an empty string.
        examples: [".ralph/<plan>/<unit>/<questions>.md", ""]
