# Authoring SSOT for `ce-executor-wave` `event_policy.schemas`.
# `build.rs` merges this file's top-level `schemas:` mapping into
# `$OUT_DIR/presets/ce-executor-wave.yml` at compile time (plan
# 2026-06-16-002 Unit 1). Edit ONLY this file when changing payload
# contract requirements for any hat below; the next `cargo build`
# propagates the change to the CLI precheck, the loop gate, the drift
# engine, and the prompt builder — they all read the embedded copy,
# so a single source eliminates the previous inline-vs-reference drift.
#
# The inline `event_policy.schemas:` block in `presets/en/ce-executor-wave.yml`
# is kept as a per-field override layer during the transition. Any
# topic listed there with explicit values will overwrite the SSOT
# value for that topic after the merge; topics absent from the inline
# block come straight from this file.
#
# Coverage:
#   coordinator            -> work.batch.ready / work.failed
#   execution-dispatcher   -> work.unit.ready / work.serial.ready / work.failed
#   parallel-executor      -> work.unit.done / work.unit.failed
#   execution-synthesizer  -> work.done / work.failed
#   serial-executor        -> work.done / work.failed
#   review-coordinator     -> review.wave.ready / review.passed
#   dimension-reviewer     -> review.dimension.done
#   review-synthesizer     -> review.passed / review.failed / review.complete
#   fixer                  -> fix.applied / fix.exhausted
#   debug-resolver         -> fix.plan.ready / debug.exhausted / plan.blocked
#   plan-gate              -> queue.advance / plan.complete / plan.blocked
#   shipper                -> REVIEW_COMPLETE
#   reporter               -> report.done

work.batch.ready:
  required_fields:
    - plan_name
    - plan_path
    - step
    - task_ids
    - task_keys
    - parallel_mode
  payload: json_object

work.unit.ready:
  required_fields:
    - plan_name
    - plan_path
    - step
    - task_id
    - task_key
    - owned_files
    - verification
  payload: json_object

work.unit.done:
  required_fields:
    - plan_name
    - plan_path
    - step
    - task_id
    - task_key
    - owned_files
    - changed_files
    - tests
  payload: json_object

work.unit.failed:
  required_fields:
    - plan_name
    - plan_path
    - step
    - task_id
    - task_key
    - reason
  payload: json_object

work.serial.ready:
  required_fields:
    - plan_name
    - plan_path
    - step
    - task_id
    - task_key
    - reason
  payload: json_object

work.done:
  required_fields:
    - plan_name
    - plan_path
    - task_id
    - task_key
    - step
    - commit_count
    - changed_lines
  payload: json_object

work.failed:
  required_fields:
    - plan_name
    - plan_path
    - step
    - task_id
    - task_key
    - reason
  payload: json_object

review.wave.ready:
  required_fields:
    - dimension
    - focus
    - depth
    - diff_base
    - intent_summary
    - changed_files
    - plan_name
    - task_id
    - task_key
    - step
  payload: json_object

review.dimension.done:
  required_fields:
    - dimension
    - findings_count
    - findings_file
    - plan_name
    - task_id
    - task_key
    - step
  payload: json_object

review.passed:
  required_fields:
    - plan_name
    - task_id
    - task_key
    - step
    - findings_count
    - fix_round
    - verdict
  payload: json_object

review.failed:
  required_fields:
    - plan_name
    - fix_round
    - safe_auto_count
    - gated_manual_count
    - findings_summary
    - task_id
    - task_key
    - step
  payload: json_object

review.complete:
  required_fields:
    - plan_name
    - fix_round
    - verdict
    - residual_findings_count
    - findings_summary
    - task_id
    - task_key
    - step
    - findings_count
  payload: json_object

fix.applied:
  required_fields:
    - plan_name
    - fix_round
    - applied_count
    - failed_count
    - task_id
    - task_key
    - step
  payload: json_object

fix.exhausted:
  required_fields:
    - plan_name
    - fix_round
    - task_id
    - task_key
    - step
  payload: json_object

fix.plan.ready:
  required_fields:
    - plan_name
    - task_id
    - task_key
    - step
    - root_cause_summary
    - causal_chain
    - recommended_tests
    - fix_plan
  payload: json_object

debug.exhausted:
  required_fields:
    - plan_name
    - reason
    - task_id
    - task_key
    - step
    - debug_summary
  payload: json_object

queue.advance:
  required_fields:
    - plan_name
    - completed_step
    - next_step
    - reviewed_task_id
    - reviewed_task_key
  payload: json_object

plan.complete:
  required_fields:
    - plan_name
    - completed_steps
    - task_id
    - task_key
    - verdict
  payload: json_object

plan.blocked:
  required_fields:
    - reason
  payload: json_object

LOOP_COMPLETE:
  required_fields:
    - reason
  payload: json_object

REVIEW_COMPLETE:
  required_fields:
    - plan_name
    - verdict
    - pass_or_fail
    - residual_findings_summary
  payload: json_object

report.done:
  required_fields:
    - report_path
    - awaiting_decision
  payload: json_object
