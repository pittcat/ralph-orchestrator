# Authoring SSOT for `merge-batch` `event_policy.schemas`.
#
# Plan 2026-07-04-002 U10: schema SSOT for the merge-batch preset.
# `build.rs` deep-merges this file's `schemas:` mapping into
# `event_loop.event_policy.schemas` of `presets/en/merge-batch.yml`
# at compile time (plan 2026-06-16-002 Unit 1). Edit ONLY this file
# when changing payload contract requirements for any hat below;
# the next `cargo build` propagates the change to the CLI precheck,
# the loop gate, the drift engine, and the prompt builder.
#
# Topic coverage (4 hats):
#   reviewer    -> merge.reviewed
#   integrator  -> merge.integrated
#   stabilizer  -> merge.retest / merge.stabilized
#   reporter    -> merge.batch.complete (terminal completion token)
#
# 2026-07-04-002 U10: completion is split from protocol tokens on
# purpose (P0-5 / merge-loop pattern): `merge.stabilized` is a
# required workflow event; only `reporter` may emit
# `merge.batch.complete` (the completion_promise). This blocks
# text-path `MERGE_COMPLETE` races before the report is written.
#
# Topic deny rules live in `presets/en/merge-batch.yml`
# `event_policy.topic_deny_rules` (not in this SSOT); the schema
# SSOT only owns payload field shapes.

schemas:
  # reviewer → review complete, integrator picks this up. The
  # The event is the control plane. The complete review is stored in
  # `.ralph/merge/review.md`; the integrator reads and verifies that artifact.
  merge.reviewed:
    required_fields:
      - target_branch
      - branch_order
      - review_path
    payload: json_object
    field_docs:
      review_path:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 review 文件路径。
        source: Reviewer writes the review artifact in the current workspace.
        fill_rule: Use the real readable path written this activation; reject the emit if it is missing.
        examples: [".ralph/<plan>/review.md"]

  # integrator → all prompt branches merged (or skipped because
  # already merged). Stabilizer picks this up. The integration
  # gate is `integration_complete`: true iff every prompt branch
  # is merged (this run or pre-merged); false aborts
  # stabilization immediately. `merge_commit_shas` is the list
  # of commits made this run so the reporter can include them
  # in the final report.
  #
  # 2026-08-08-004 plan U1 (D3/D12/D13): scope boundary fields
  # added — `merge_boundary_path` and `merge_boundary_digest`
  # provide machine-readable evidence of the merge window. The
  # reporter reads the boundary artifact to cross-check the
  # commit set; downstream presets (post-merge-converge,
  # red-team-attack) MUST NOT treat merge-boundary as authoritative.
  merge.integrated:
    required_fields:
      - integration_complete
      - ready_for_stabilization
      - branches_merged
      - branches_skipped
      - branches_failed
      - merge_commit_shas
      - integration_path
      # U1 scope boundary fields
      - merge_boundary_path
      - merge_boundary_digest
      - merge_boundary_status
      # Independent scope manifest contract
      - scope_manifest_path
      - scope_digest
      - scope_status
      - scope_base_sha
      - scope_source
      - overall_confidence
      - critical_unknown_count
      - proceed
    payload: json_object
    allowed_values:
      scope_status:
        - resolved
        - ambiguous
        - blocked
      scope_source:
        - explicit
        - direct-target
        - branch-merge
        - inferred
      overall_confidence:
        - 0
        - 85
        - 90
        - 100
    # Single source of truth for the Integrator's handoff payload. Values in
    # angle brackets are computed from the artifacts written in this activation;
    # they are placeholders, not values that may be emitted verbatim.
    examples:
      - integration_complete: true
        ready_for_stabilization: true
        branches_merged:
          - "<merged-branch>"
        branches_skipped: []
        branches_failed: []
        merge_commit_shas:
          - "<full-merge-commit-sha>"
        integration_path: ".ralph/merge/integration.md"
        merge_boundary_path: ".ralph/merge/merge-boundary.json"
        merge_boundary_digest: "<canonical-boundary-sha256>"
        merge_boundary_status: "complete"
        scope_manifest_path: ".ralph/merge/scope-manifest.json"
        scope_digest: "<canonical-scope-sha256>"
        scope_status: "resolved"
        scope_base_sha: "<target-sha-before-first-merge>"
        scope_source: "branch-merge"
        overall_confidence: 100
        critical_unknown_count: 0
        proceed: true
    field_docs:
      integration_complete:
        meaning: True iff every prompt branch is merged (this run or pre-merged);
          false aborts stabilization immediately.
        source: Integrator writes from final state of `git merge` attempts.
        fill_rule: true only if `branches_failed` is empty AND every prompt branch
          is in `branches_merged` or `branches_skipped`.
      ready_for_stabilization:
        meaning: Mirror of `integration_complete`; false tells stabilizer to skip
          the verification loop and emit `merge.stabilized(passed:false, reason:merge_incomplete)`.
        source: Integrator writes equal to `integration_complete`.
        fill_rule: Same value as `integration_complete`.
      branches_merged:
        meaning: Branches successfully merged into `<target>` during this run.
        source: Integrator writes from `git merge` outputs.
        fill_rule: Array of branch names; no overlap with `branches_failed` or
          `branches_skipped`.
      branches_skipped:
        meaning: Branches already merged into `<target>` before this run
          (verified via `git branch --merged <target>`).
        source: Integrator writes from `git branch --merged <target>`.
        fill_rule: Array of branch names; no overlap with `branches_merged`.
      branches_failed:
        meaning: Branches whose merge was aborted or could not complete,
          with per-branch reasons.
        source: Integrator writes from `git merge --abort` / conflict resolution failures.
        fill_rule: Array of {branch, reason} objects; no overlap with `branches_merged`.
      merge_commit_shas:
        meaning: SHAs of merge commits created during this run, for the reporter
          to include in REPORT.md.
        source: Integrator writes from `git rev-parse HEAD` after each successful merge.
        fill_rule: Array of full commit SHAs.
      integration_path:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 integration evidence path。
        source: Integrator writes the merge order, conflicts, SHAs, and verification evidence.
        fill_rule: Use the real readable path written this activation; reject the emit if it is missing.
        examples: [".ralph/<plan>/integration.md"]
      merge_boundary_path:
        meaning: Repo-relative path to the machine-readable merge-boundary artifact (`.ralph/merge/merge-boundary.json`).
        source: Integrator writes after the last successful or failed merge.
        fill_rule: Must be under `.ralph/merge/`; real readable path only; reject emit if file is missing.
        examples: [".ralph/merge/merge-boundary.json"]
      merge_boundary_digest:
        meaning: SHA-256 hex digest of canonical merge-boundary.json (64 hex chars).
        source: Integrator computes after writing merge-boundary.json.
        fill_rule: Remove `boundary_digest`, serialize compact JSON with keys sorted, append one newline, then compute SHA-256; recompute on every emit attempt.
      merge_boundary_status:
        meaning: Whether the merge-boundary artifact is complete or incomplete.
        source: Integrator writes from final merge state.
        fill_rule: One of `complete` or `incomplete`; `complete` only when every branch merged successfully.
      scope_manifest_path:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 batch scope manifest JSON 路径。
        source: Integrator writes `.ralph/merge/scope-manifest.json` before the handoff.
        fill_rule: Use the real readable path; reject the emit if the file is missing or outside `.ralph/merge/`.
        examples: [".ralph/merge/scope-manifest.json"]
      scope_digest:
        meaning: SHA-256 hex digest of the canonical scope manifest, excluding its self-referential digest field.
        source: Integrator recomputes the digest from the manifest written in this activation.
        fill_rule: Remove `scope_digest`, serialize compact JSON with sorted keys, append one newline, and hash; recompute before every emit.
      scope_status:
        meaning: Whether the merge batch scope is fully resolved for downstream verification and reporting.
        source: Integrator decides from branch coverage and the scope manifest evidence.
        fill_rule: One of `resolved | ambiguous | blocked`; use `resolved` only when no critical scope fact is unknown.
      scope_base_sha:
        meaning: Full Git SHA of the target branch before this batch's first merge.
        source: Integrator records `git rev-parse <target>` before mutating the target branch.
        fill_rule: Exact 40-character SHA observed before the first merge; never hand-write or use a placeholder.
      scope_source:
        meaning: How the batch scope base was established.
        source: Integrator records the Git-first merge-batch workflow used for this activation.
        fill_rule: One of `explicit | direct-target | branch-merge | inferred`; use `branch-merge` when the base is taken from the target before merging.
      overall_confidence:
        meaning: Confidence score for branch coverage, merge identity, and scope manifest completeness.
        source: Integrator scores the evidence recorded in `scope-manifest.json`.
        fill_rule: One of `0 | 85 | 90 | 100`; `proceed=true` requires at least 90.
      critical_unknown_count:
        meaning: Number of unresolved critical branch, commit, or scope facts.
        source: Integrator counts unresolved critical entries in the scope manifest.
        fill_rule: Non-negative integer; `scope_status=resolved` and `proceed=true` require zero.
      proceed:
        meaning: Whether the stabilizer may run the verification loop.
        source: Integrator derives from complete integration and resolved scope evidence.
        fill_rule: true only when `integration_complete=true`, `scope_status=resolved`, `overall_confidence >= 90`, and `critical_unknown_count=0`; otherwise false.

  # stabilizer → self-loop retry signal. The hat itself emits
  # this after a fix attempt; the next activation re-enters
  # the stabilizer. `attempt` and `classification` mirror the
  # stabilizer-state.json shape so the next attempt can read
  # `why_not_fixed` without re-deriving the failure class.
  merge.retest:
    # This is the one intentional business self-loop in this preset. The
    # runtime accepts it only because stabilizer declares this topic in both
    # `triggers` and `publishes`; ordinary isolated self-targets remain blocked.
    required_fields:
      - attempt
      - classification
    payload: json_object
    field_docs:
      attempt:
        meaning: 1-indexed stabilization attempt number.
        source: Stabilizer reads from `.ralph/merge/stabilize-state.json`
          (or 1 on first attempt).
        fill_rule: Increment from prior attempt; emit on every `merge.retest`.
      classification:
        meaning: Failure class from the last verification run.
        source: Stabilizer writes from failure protocol §A
          (`test_problem` | `business_problem`).
        fill_rule: One of `test_problem` or `business_problem`; do not invent other values.

  # stabilizer → terminal workflow event. Reporter picks this
  # up to write the report and emit `merge.batch.complete`.
  # `passed: true` is the ONLY signal the reporter uses to
  # choose between success / failure cleanup paths.
  #
  # 2026-08-08-004 plan U1 (D3/D12): merge_boundary_path and
  # merge_boundary_digest are echoed from merge.integrated so the
  # reporter can cross-check the boundary artifact is unchanged.
  merge.stabilized:
    required_fields:
      - passed
      - report_input_file
      # U1 scope boundary echo
      - merge_boundary_path
      - merge_boundary_digest
      # Scope identity is echoed to the reporter.
      - scope_manifest_path
      - scope_digest
      - scope_status
      - scope_base_sha
      - scope_source
      - overall_confidence
      - critical_unknown_count
      - proceed
    payload: json_object
    allowed_values:
      scope_status:
        - resolved
        - ambiguous
        - blocked
      scope_source:
        - explicit
        - direct-target
        - branch-merge
        - inferred
      overall_confidence:
        - 0
        - 85
        - 90
        - 100
    field_docs:
      passed:
        meaning: True iff verification passed AND the integrator gate
          (`integration_complete`) was true.
        source: Stabilizer writes from verification outcome.
        fill_rule: true only when verification passes AND merge was complete;
          false otherwise (incl. `merge_incomplete` and
          `stabilization_exhausted`).
      reason:
        meaning: Why `passed` is false; null/omit when passed is true.
        source: Stabilizer writes from failure / exhaustion gate.
        fill_rule: One of `merge_incomplete` | `stabilization_exhausted`;
          omit or null when `passed` is true.
      branches_failed:
        meaning: Echoed from `merge.integrated.branches_failed` when stabilization
          short-circuits due to incomplete merge. Omit when merge was complete.
        source: Stabilizer forwards from `merge.integrated.branches_failed`.
        fill_rule: Same shape as `merge.integrated.branches_failed`;
          only set when `reason == merge_incomplete`.
      attempts:
        meaning: Number of stabilization attempts made before this terminal event.
        source: Stabilizer counts from `.ralph/merge/stabilize-state.json`.
        fill_rule: Positive integer; ≥ 1 when stabilization actually ran.
      report_input_file:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 reporter 输入清单路径。
        source: Stabilizer writes a manifest listing review, integration, and stabilization evidence paths.
        fill_rule: Use the real readable manifest path; if any required evidence is unavailable, write a failure manifest and keep passed false.
        examples: [".ralph/<plan>/report-input.md"]
      merge_boundary_path:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 merge-boundary JSON 路径，供 reporter 交叉核验。
        source: Stabilizer copies from `merge.integrated` trigger payload.
        fill_rule: Must match the trigger path and point to a readable artifact; reject emit if missing or digest changed.
        examples: [".ralph/merge/merge-boundary.json"]
      merge_boundary_digest:
        meaning: Echoed from `merge.integrated.merge_boundary_digest` for reporter cross-check.
        source: Stabilizer copies from `merge.integrated` trigger payload.
        fill_rule: Must match the digest from the merge.integrated trigger; recompute and reject if artifact changed since merge.integrated.
      scope_manifest_path:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 scope manifest JSON 路径。
        source: Stabilizer copies from `merge.integrated.scope_manifest_path` after reading the artifact.
        fill_rule: Preserve the exact readable path; reject if missing, outside `.ralph/merge/`, or unreadable.
        examples: [".ralph/merge/scope-manifest.json"]
      scope_digest:
        meaning: Scope manifest digest carried unchanged from the integration handoff.
        source: Stabilizer copies and recomputes `merge.integrated.scope_digest`.
        fill_rule: Must equal the recomputed canonical manifest digest; never invent a replacement.
      scope_status:
        meaning: Scope resolution status carried to the reporter.
        source: Stabilizer copies from the integration handoff after manifest validation.
        fill_rule: One of `resolved | ambiguous | blocked`; do not upgrade an unresolved status.
      scope_base_sha:
        meaning: Full target-before-merge SHA carried to the reporter.
        source: Stabilizer copies from `merge.integrated.scope_base_sha`.
        fill_rule: Preserve the exact 40-character SHA; reject a missing or placeholder value.
      scope_source:
        meaning: Scope-base provenance carried to the reporter.
        source: Stabilizer copies from `merge.integrated.scope_source`.
        fill_rule: Preserve one of `explicit | direct-target | branch-merge | inferred`.
      overall_confidence:
        meaning: Scope evidence confidence carried to the reporter.
        source: Stabilizer copies from the validated integration handoff.
        fill_rule: Preserve one of `0 | 85 | 90 | 100`; never increase it during stabilization.
      critical_unknown_count:
        meaning: Unresolved critical scope facts carried to the reporter.
        source: Stabilizer copies from the validated integration handoff.
        fill_rule: Preserve the non-negative count; never reduce it during stabilization.
      proceed:
        meaning: Whether the integration and scope contract allow verification to proceed.
        source: Stabilizer copies from `merge.integrated.proceed` after entry-gate validation.
        fill_rule: Must remain false when integration is incomplete or scope is unresolved; true only for a resolved, high-confidence handoff.

  # reporter → sole completion token for merge-batch. Mirrors
  # the `merge.handled` shape in merge-loop: a single required
  # boolean that the runtime completion guard checks.
  merge.batch.complete:
    required_fields:
      - success
      - report_path
      - scope_manifest_path
      - scope_digest
      - scope_status
      - scope_base_sha
      - scope_source
      - overall_confidence
      - critical_unknown_count
      - proceed
    completion_artifact_fields:
      report_path: required
      scope_manifest_path: required
    payload: json_object
    allowed_values:
      scope_status:
        - resolved
        - ambiguous
        - blocked
      scope_source:
        - explicit
        - direct-target
        - branch-merge
        - inferred
      overall_confidence:
        - 0
        - 85
        - 90
        - 100
    field_docs:
      success:
        meaning: Whether the merge batch completed successfully for the operator.
        source: Reporter copies from merge.stabilized.passed (true only when stabilization passed).
        fill_rule: true only when merge.stabilized.passed is true; otherwise false.
      report_path:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 operator-facing merge report 路径。Agent must verify the file is readable before emit.
        source: File actually written this activation under .ralph/merge/ (typically REPORT.md).
        fill_rule: Real readable path only. Agent must verify the file exists before emit (schema checks the field is present, not the filesystem). Confirm must print DELIVERABLE_PATH with the same path.
        examples: [".ralph/<plan>/REPORT.md"]
      scope_manifest_path:
        meaning: Artifact落盘点，相对仓库根目录 `.ralph/` 的 scope manifest JSON 路径 retained for audit.
        source: Reporter copies from `merge.stabilized.scope_manifest_path` after reading it.
        fill_rule: Exact readable path under `.ralph/merge/`; reject if missing or changed.
        examples: [".ralph/merge/scope-manifest.json"]
      scope_digest:
        meaning: Canonical digest of the scope manifest included in the final report identity.
        source: Reporter copies from the validated `merge.stabilized` payload.
        fill_rule: Must match the recomputed manifest digest; never hand-write.
      scope_status:
        meaning: Final scope resolution status recorded in REPORT.md.
        source: Reporter copies from `merge.stabilized.scope_status`.
        fill_rule: One of `resolved | ambiguous | blocked`.
      scope_base_sha:
        meaning: Target-before-merge SHA recorded in REPORT.md.
        source: Reporter copies from `merge.stabilized.scope_base_sha`.
        fill_rule: Exact 40-character SHA from the validated handoff.
      scope_source:
        meaning: Provenance of the scope base recorded in REPORT.md.
        source: Reporter copies from `merge.stabilized.scope_source`.
        fill_rule: One of `explicit | direct-target | branch-merge | inferred`.
      overall_confidence:
        meaning: Scope evidence confidence recorded in REPORT.md.
        source: Reporter copies from `merge.stabilized.overall_confidence`.
        fill_rule: One of `0 | 85 | 90 | 100`.
      critical_unknown_count:
        meaning: Unresolved critical scope fact count recorded in REPORT.md.
        source: Reporter copies from `merge.stabilized.critical_unknown_count`.
        fill_rule: Non-negative integer; report any non-zero value as an unresolved risk.
      proceed:
        meaning: Whether the scope contract allowed stabilization to proceed.
        source: Reporter copies from `merge.stabilized.proceed`.
        fill_rule: Must be true only for a resolved high-confidence scope; success must also be false when proceed is false.
      merged_branches:
        meaning: Optional final list of branches confirmed merged by reporter.
        source: Reporter obtains from `git branch --merged <target>` and the report artifact.
        fill_rule: Array of real branch names; omit only when the report cannot establish the list.
      failed_stage:
        meaning: Optional stage that prevented a successful batch completion.
        source: Reporter derives from `merge.stabilized.reason` and the report-input manifest.
        fill_rule: Short stage identifier such as `integration` or `stabilization`; omit on success.
      reason:
        meaning: Optional human-readable failure reason carried into the terminal event.
        source: Reporter copies the stabilized reason and report-input evidence.
        fill_rule: Omit on success; on failure use the observed reason, never an invented diagnosis.
