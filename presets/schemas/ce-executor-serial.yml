# Authoring SSOT for `ce-executor-serial` `event_policy.schemas`.
# `build.rs` merges this file's top-level `schemas:` mapping into
# `$OUT_DIR/presets/ce-executor-serial.yml` at compile time (plan
# 2026-06-16-002 Unit 1). Edit ONLY this file when changing payload
# contract requirements for any hat below; the next `cargo build`
# propagates the change to the CLI precheck, the loop gate, the drift
# engine, and the prompt builder — they all read the embedded copy,
# so a single source eliminates the previous inline-vs-reference drift
# that required lockstep updates of `presets/en/`.
#
# The inline `event_policy.schemas:` block in
# `presets/en/ce-executor-serial.yml` is kept as a per-field override
# layer during the transition. Any topic listed there with explicit
# values will overwrite the SSOT value for that topic after the merge;
# topics absent from the inline block come straight from this file.
# Once a topic is stable, prefer editing this SSOT and clearing the
# inline entry so the merge is trivially auditable.
#
# If you delete or rename a topic here, also delete the matching
# inline entry in `presets/en/ce-executor-serial.yml`. The embedded
# preset is regenerated on every build; there is no other path that
# the four consumer chains read.
#
# 2026-06-24 plan U2: 10-hat architecture (TDD executor + validator +
# overall review). debug-resolver and plan-gate removed; fixer merges
# diagnosis capability; coordinator directly advances units.
#
# Coverage (10 hats):
#   coordinator         -> work.ready / review.start / plan.complete / plan.blocked
#   executor            -> work.done / work.failed
#   validator           -> test.passed / test.failed
#   fixer               -> fix.applied / fix.exhausted
#   review-coordinator  -> review.dimension.ready / review.dimensions.complete
#   dimension-reviewer  -> review.dimension.done / review.dimension.failed
#   review-synthesizer  -> review.complete (with fix_plan_file)
#   shipper             -> REVIEW_COMPLETE
#   reporter            -> report.done / LOOP_COMPLETE
#   progress-steward    -> task.resume / plan.blocked
#
# Removed topics (2026-06-24 plan U1/U2):
#   - review.passed / review.failed  (review-synthesizer only emits review.complete)
#   - fix.plan.ready                 (debug-resolver removed; fixer merges diagnosis)
#   - debug.exhausted                (debug-resolver removed)
#   - queue.advance                  (plan-gate removed; coordinator advances directly)
#
# New topics (2026-06-24 plan U1/U2):
#   - test.passed  — validator emits when full test suite passes
#   - test.failed  — validator emits when full test suite fails
#   - review.start — coordinator emits to trigger overall review after all units done
#
# 2026-06-25 plan 001 U7: coordinator gained a Same-Plan Learning & Plan
# Amendment Protocol (see `presets/en/ce-executor-serial.yml` →
# `coordinator.instructions`). The amendment flow uses ONLY existing
# topics — `work.ready` may carry an optional `amendment_path` payload
# field, but `required_fields` is unchanged. No new topics are
# introduced; original plan files remain read-only; amendments land in
# `.agents/scratchpad/ce-executor/{plan_name}/plan-amendments.md`.

schemas:
  work.ready:
    required_fields:
      - plan_name
      - plan_path
      - task_id
      - task_key
      - step
      - complexity
    payload: json_object

  work.done:
    required_fields:
      - plan_name
      - plan_path
      - task_id
      - task_key
      - step
      - commit_count
      - changed_lines
    payload: json_object

  work.failed:
    # 2026-06-24 plan U2: work.failed now carries task correlation
    # fields so the coordinator can identify which unit failed and
    # emit a meaningful plan.blocked. Previously only `reason` was
    # required, leaving the coordinator blind to the failing unit.
    required_fields:
      - plan_name
      - task_id
      - task_key
      - step
      - reason
    payload: json_object

  # 2026-06-24 plan U2: new test.* topics from validator hat.
  # validator runs `cargo nextest run` (full suite) after executor
  # completes a unit or fixer applies a fix, then emits one of these.
  test.passed:
    required_fields:
      - plan_name
      - task_id
      - task_key
      - step
      - tests_run
      - tests_passed
    payload: json_object

  test.failed:
    required_fields:
      - plan_name
      - task_id
      - task_key
      - step
      - failures
      - test_errors
    payload: json_object

  # 2026-06-26 plan U8: review.start emitted by coordinator when all
  # units + fix-units complete. Triggers review-coordinator to begin
  # the 6-dimension review sequence
  # (goal-alignment → correctness → testing → maintainability → project-standards → adversarial).
  review.start:
    required_fields:
      - plan_name
      - task_id
      - task_key
    payload: json_object

  # Serial path replaces the parallel `review.wave.ready` with a per-dimension
  # kick-off event. The shape mirrors the wave payload that dimension-reviewer
  # used to consume, minus the wave metadata. `findings_file` is intentionally
  # absent on this event — it is the dimension-reviewer's output path, not its
  # input.
  review.dimension.ready:
    required_fields:
      - dimension
      - focus
      - depth
      - diff_base
      - intent_summary
      - changed_files
      - plan_name
      - task_id
      - task_key
      - step
    payload: json_object

  # Single-dimension completion, mirrors the wave path's `review.dimension.done`
  # payload. Carries the path to the per-dimension findings file the synthesizer
  # will read.
  review.dimension.done:
    required_fields:
      - dimension
      - findings_count
      - findings_file
      - plan_name
      - task_id
      - task_key
      - step
    payload: json_object

  # Single-dimension failure, emitted by dimension-reviewer when it cannot
  # complete the review for this specific dimension (timeout, panic, or
  # explicit decision to fail). Coordinator MUST accept a minimal payload
  # (only `dimension` + `reason` is strictly required by the runtime contract)
  # and continue to the next pending dimension. Findings files are NOT
  # required for failed dimensions.
  review.dimension.failed:
    required_fields:
      - dimension
      - reason
      - plan_name
      - task_id
      - task_key
      - step
    # 2026-07-02 P1-A: dimension must be in the 6-dimension
    # whitelist so a payload with `dimension=unknown` (the bug
    # surfaced in the 2026-07-01 ralph-e2e run, iter 12
    # `flow_unknown_emit`) is caught at the schema gate
    # instead of stalling the review chain. The list mirrors
    # the 6-dimension review walk in
    # `crates/ralph-core/src/event_policy.rs`
    # `DIMENSION_WHITELIST` and `ce-executor-serial.yml` line
    # 1505-1528 (review-coordinator walk).
    allowed_values:
      dimension:
        - goal-alignment
        - correctness
        - testing
        - maintainability
        - project-standards
        - adversarial
    payload: json_object

  # Aggregate event over the entire review sequence. Triggers
  # review-synthesizer. The `dimensions` array is the authoritative per-dim
  # status list; the synthesizer does NOT need to read review-sequence.json
  # to know which dimensions completed. The `dimensions` array element shape
  # (dimension / status / optional findings_file / optional reason) is
  # enforced by agent prompt discipline and by the coordinator + synthesizer
  # instructions, not by EventSchema, because the current EventSchema only
  # validates top-level fields and has no nested array-element validation.
  review.dimensions.complete:
    # 2026-06-18-004 plan U0 (R4, KTD3): fix_round is the dedup SSOT for
    # `review.dimensions.complete`. The policy layer keys dedup on
    # `{plan}::{step}::{task}::{fix_round}` (U5), and `fix.applied` prune
    # (U1) clears the matching bucket so a re-review round can legally
    # close a new `review.dimensions.complete`. Default to 0 for the
    # empty-diff fast path / pre-fix round.
    required_fields:
      - plan_name
      - task_id
      - task_key
      - step
      - dimensions
      - fix_round
    payload: json_object

  # 2026-06-24 plan U2: review-synthesizer only emits `review.complete`
  # (no `review.passed` / `review.failed` pair). The `fix_plan_file`
  # field carries the repo-relative path to a fix-plan markdown file
  # (written by review-synthesizer to the plan's scratchpad) for the
  # coordinator to read and create fix-unit tasks. `fix_round` is
  # retained for dedup compatibility — the policy layer keys dedup on
  # `{plan}::{step}::{task}::{fix_round}`.
  #
  # 2026-06-24 P0-D: when there are no P0/P1 findings,
  # `fix_plan_file` MUST be the literal **string** `"null"` (six
  # characters: `"`, `n`, `u`, `l`, `l`, `"`). A JSON `null` literal
  # is NOT acceptable — the runtime will reject the event with
  # `PayloadTypeMismatch(expected="string", actual="null")`. The
  # enforcement lives in `validate_event_with_hat` (string-only
  # field guard) and is mirrored as a unit test in
  # `event_policy.rs::p0d_review_complete_fix_plan_file_null_literal_is_rejected`.
  # Root cause of the regression: the 2026-06-24 ralph-e2e
  # python-sort-algorithms run shipped `fix_plan_file: null` for the
  # fix-01 review round, slipped past `required_fields` (the field
  # existed), and broke the downstream coordinator's
  # `fix_plan_file == "null"` string equality check — leaving
  # `plan.complete` un-emitted.
  review.complete:
    required_fields:
      - plan_name
      - fix_round
      - fix_plan_file
      - verdict
      - residual_findings_count
      - findings_summary
      - task_id
      - task_key
      - step
      - findings_count
    payload: json_object

  fix.applied:
    required_fields:
      - plan_name
      - fix_round
      - applied_count
      - failed_count
      - task_id
      - task_key
      - step
      - commit_count
      - changed_lines
    payload: json_object

  # 2026-06-24 plan U2: fix.exhausted now carries `reason` so the
  # consuming executor (rewrite chance) and shipper (terminal) can
  # log/branch on the exhaustion cause. fixer emits this when locate
  # budget (max 10) or fix budget (max 10) is exhausted.
  fix.exhausted:
    required_fields:
      - plan_name
      - fix_round
      - task_id
      - task_key
      - step
      - reason
    payload: json_object

  plan.complete:
    # 2026-06-24 plan U2: `final_findings_count` is read by shipper
    # for verdict promotion (pass_with_residuals → pass when
    # final_findings_count <= max_residuals). `fix_round` is the
    # dedup SSOT carried from the last review.complete.
    # 2026-06-30 P0-A: `step` is required so plan_gate can recognise
    # fix-* exemption path; without it plan.complete from the fix-unit
    # chain is rejected as `plan_gate_review_not_terminal`.
    required_fields:
      - plan_name
      - completed_steps
      - task_id
      - task_key
      - step
      - verdict
      - final_findings_count
      - fix_round
    payload: json_object

  plan.blocked:
    # 2026-06-24 P1-4: `reason` drives shipper routing.
    # Recoverable reasons (shipper runs verification 1-2; if both
    # pass → REVIEW_COMPLETE pass_or_fail=pass, verdict=pass_with_residuals):
    #   - loop_stalled_max_iterations (progress-steward gave up)
    #   - steward_escalation (progress-steward escalated)
    #   - review_terminal_drift (legacy; kept for forward-compat)
    # Hard-fail reasons (shipper → REVIEW_COMPLETE pass_or_fail=fail):
    #   - executor failed: <detail> (coordinator on work.failed)
    #   - work_failed
    #   - fix budget exhausted / fix_exhausted (fixer hard cap)
    #   - dimension_failed / all_dimensions_failed (review dimension)
    #   - any other reason not listed as recoverable
    #
    # 2026-07-01-001 plan U5: lock the recoverable reasons
    # with `allowed_values` so narrative prefix matching
    # (`progress_md_validation_stale`, `stall_no_events
    # recovery: ...`) can no longer leak through. The
    # `progress_md_validation_stale` value used by the
    # 175407 run is intentionally absent — it was never in
    # the recoverable whitelist and the schema now refuses
    # to accept it. Anything outside this list routes to
    # hard-fail per the comment above; shipper's strict
    # exact-match gate (see preset_lint/strict_reason_routing)
    # already enforces that comparison.
    required_fields:
      - reason
    payload: json_object
    allowed_values:
      reason:
        - loop_stalled_max_iterations
        - steward_escalation
        - review_terminal_drift
        - unit_failed
        - partial_units_done
        - review_failed
        - work_failed
        - fix_exhausted
        - fix_budget_exhausted
        - dimension_failed
        - all_dimensions_failed
        - plan_file_not_found
        - plan_file_unreadable
        - plan_missing_implementation_units
        - plan_content_empty_or_placeholder
        - progress_md_invalid
        # 2026-07-02-005 plan U7: drift engine emits
        # `plan.blocked(reason=recovery_exhausted)` when the
        # responder promotes a Final hint to RecoveryExhausted.
        # Without this entry, the schema's strict
        # `allowed_values` check rejects the event before
        # shipper can route it.
        - recovery_exhausted
        # 2026-07-02-004 plan U6: precheck gate hat retry-budget
        # exhaustion escalates to `plan.blocked(reason=
        # precheck_failed)`. Adding it here keeps the
        # recoverable whitelist honest — U6's
        # `build_exhausted_payload` already stamps the reason,
        # so the runtime does not need a schema exception.
        - precheck_failed

  loop.cancel:
    required_fields:
      - reason
    payload: json_object

  LOOP_COMPLETE:
    required_fields:
      - reason
    payload: json_object

  REVIEW_COMPLETE:
    required_fields:
      - plan_name
      - verdict
      - pass_or_fail
      - residual_findings_summary
    payload: json_object

  report.done:
    required_fields:
      - report_path
      - awaiting_decision
    payload: json_object

  # 2026-06-16-001 U3/U5: recovery signal used by origin guard,
  # workflow guard, execution contract, isolated scope, and the
  # `progress-steward` hat. Carries the source event's id and
  # timestamp for freshness filtering (U3 TTL) and audit.
  #
  # `target_task_id` / `source_event_id` removed: the runtime
  # cannot reconstruct a task id from a Rejection (the task
  # id lives in `tasks.jsonl`, not the rejection). See the
  # matching SSOT entry in
  # `presets/schemas/ce-executor-serial.yml` for the
  # rationale.
  #
  # 2026-06-23 fix plan U5 (CB-2): `kind` is the typed-dispatch SSOT
  # surfaced by `build_task_resume_payload` (rejection.rs:503-519).
  # It carries the gate's `RejectionKind::reason_code()` so the
  # coordinator's typed dispatch can route on kind rather than
  # substring-matching `reason`. The U4 typed dispatch (plan
  # 2026-06-23-004) uses `CoordinatorDispatcher::dispatch(kind, count)`
  # driven by this field; without it declared here, the drift
  # detector never reports producer-side omission as a finding.
  task.resume:
    required_fields:
      - reason
      - target_hat
      - kind
    payload: json_object

  # 2026-06-27 mechanism foundation U7/U10: repair stream topics.
  # All repair topics must include `task_key` (P1-2) so the
  # `stall_recovery_counts` index in `loop_state` can clear the
  # right counter on `repair.close`.
  task.relocate:
    required_fields:
      - task_key
      - task_id
      - target_loop_id
      - reason
    payload: json_object

  task.relocate_legacy:
    required_fields:
      - task_key
      - target_loop_id
      - reason
    payload: json_object

  repair.budget.exhausted:
    required_fields:
      - task_key
      - retry_key
      - exhausted_after
      - reason
    payload: json_object

  repair.close:
    required_fields:
      - task_key
      - retry_key
      - reason
    payload: json_object

  # 2026-06-16-001 U5: diagnostic topic emitted when the loop
  # has stalled (no accepted business event for
  # `max_steward_iterations` consecutive turns). Routes to
  # the `progress-steward` hat.
  loop.stalled:
    required_fields:
      - reason
    payload: json_object

# =============================================================================
# Protocol SSOT extensions (plan 2026-06-20-001 v3.1)
# Top-level topic keys above remain the payload SSOT (plan 2026-06-16-002).
# Sections below extend the schemas file into the *full serial protocol*:
# `build.rs` deep-merges them into the embedded preset at `event_loop.*`
# paths (see Merge mapping table in plan). Operators edit ONLY this file +
# `cargo build` to change behavior. Rust does NOT maintain a duplicate
# field table — engine reads these values via `ProtocolView`.
#
# Merge mapping (KTD-1, U1 spike):
#   execution_contracts:   → event_loop.execution_contracts
#   verdict_gate:          → event_loop.verdict_gate
#   workflow_contract:     → event_loop.workflow_contract
#   state_projection:      → event_loop.state_projection
#
# Per KTD-12, `execution_contracts.rules.<topic>` MUST NOT redeclare
# `require_payload_fields`; engine derives required fields from
# `event_policy.schemas[topic].required_fields ∪
#  execution_contracts.rules[topic].extra_required_fields` at runtime.
#
# 2026-07-02-004 plan milestone A (U1) placeholder:
#   precheck:                → event_loop.precheck
# Not activated on this preset (zero-regression contract, U4).
# Add `precheck: { enabled: true, rules: { ... } }` here to opt
# in; `build.rs` will deep-merge it into `event_loop.precheck`.
# =============================================================================

# R2 / R7-5: Execution contract rules per topic. SSOT for
# `event_loop.execution_contracts`. KTD-12 enforces no
# `require_payload_fields` here; payload field requirements
# come from the top-level topic keys above.
execution_contracts:
  enabled: true
  rules:
    work.done:
      require_git_change: true
      require_task:
        id_field: "task_id"
        key_field: "task_key"
        loop_scoped: true
        allowed_terminal_statuses: ["closed"]
        auto_close_on_valid: false
      require_test_evidence:
        mode: "optional"
        payload_field: "tests"
    fix.applied:
      # R7-5: dedup_key for fix.applied events. Plan 2026-06-18-004
      # identified that perky-maple's 135 duplicate emissions were caused
      # by missing dedup dimensions. Dedup runs through
      # `engine::run_gates` against `effective_required_fields`.
      dedup_key: ["plan_name", "task_id", "fix_round", "commit_count", "applied_count"]
      require_git_change:
        mode: "commit_only"
        allow_empty_for_steps: ["trivial"]

# R2: Verdict gate configuration (REVIEW_COMPLETE fails the loop if
# pass_or_fail == "fail"). Mirrors what ce-executor-serial declares
# inline; bringing it into SSOT removes a hand-maintained inline copy.
#
# U9 (2026-06-27-002 plan completion): `additional_topics` is
# removed. The legacy `report.done` → `TerminationReason
# ::ReviewFailed` auto-terminate path is retired; only
# `LOOP_COMPLETE` now terminates the dispatcher (U10).
verdict_gate:
  topic: "REVIEW_COMPLETE"
  fail_field: "pass_or_fail"
  fail_value: "fail"
  additional_topics: []

# R2 / R19: Workflow contract — seeds, step_handoff.
# `handoff_topic_seeds` is the SSOT list that `HandoffIndex` checks
# against `macro_edges.required`. Builders must keep this ⊇
# `HANDOFF_TOPIC_SEEDS` const at compile time (asserted by
# `WorkflowContractConfig::validate_seeds_coverage`).
workflow_contract:
  incomplete_wave_gate:
    enabled: false
  step_handoff:
    progress_task_gate: true
  handoff_topic_seeds:
    # 2026-06-24 plan U2: 10-hat architecture.
    # Removed: queue.advance, review.passed, review.failed,
    #          fix.plan.ready, debug.exhausted.
    # Added:   test.passed, test.failed, review.start.
    - work.ready
    - work.done
    - work.failed
    - test.passed
    - test.failed
    - review.start
    - review.dimension.ready
    - review.dimension.done
    - review.dimension.failed
    - review.dimensions.complete
    - review.complete
    - fix.applied
    - fix.exhausted
    - plan.complete
    - plan.blocked
    - REPORT_COMPLETE

# R3 / R4: State projection action chain. Order is semantic —
# `close_task` MUST precede `mark_step_completed` on `work.done`.
# `preset_lint` asserts this order at build time (KTD-3).
state_projection:
  enabled: true
  actions_chain:
    work.ready:
      - kind: ensure_task
        key: "task_key"
        title: "step"
    work.done:
      - kind: close_task
        task_id: "task_id"
        step: "step"
      - kind: mark_step_completed
        step: "step"
    plan.complete:
      - kind: plan_complete
        final_step: "step"

# -----------------------------------------------------------------------------
# 2026-07-02-006 plan U24: `mechanism.phase_authority` authoring SSOT reference.
# build.rs only merges the `schemas:` block above; phase authority lives in
# `presets/en/ce-executor-serial.yml` under top-level `mechanism.phase_authority`.
# `preset_lint::phase_authority` validates phases, transitions, and primitive
# names at lint time. Required phase ids for serial:
#   unit_loop, review, fix_units, plan_end, ship, terminal
# Required primitives (engine-known):
#   on_event, on_test_passed_step, on_review_complete_verdict,
#   on_loop_complete_honored, on_plan_terminal_accepted
# KTD4 matrix name: serial_default
# -----------------------------------------------------------------------------
