# Ralph Reviewer Preset
# Hat collection for reviewing pull requests

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 15
  max_runtime_seconds: 900
  starting_event: "review.start"

cli:
  backend: "claude"

# Skill dependency contract (2026-10-30 preset skill contract spec): the
# single source of truth for hat -> skill dependencies. Evaluated by
# `ralph preset check`, `ralph preflight`, `ralph tools skill check`, and
# the `ralph run` startup gate — a failing required dep blocks the loop
# before any backend spawns.
skills:
  contract:
    - skill: ralph-html
      hats: [synthesizer]
      purpose: Entry guidance for offline single-file HTML deliverables (offline/escaping rules).
      required: true
      load: on_demand
      source: builtin
      when: "Loaded before the hat writes its .html artifact."
      install_hint: "Embedded in the ralph binary — no install needed; a resolution failure means `skills.overrides` or the registry is misconfigured."
    - skill: ralph-html-artifact
      hats: [synthesizer]
      purpose: Artifact-generation rules for the HTML deliverable.
      required: true
      load: on_demand
      source: builtin
      when: "Loaded with ralph-html before writing the .html artifact."
      install_hint: "Embedded in the ralph binary — no install needed; a resolution failure means `skills.overrides` or the registry is misconfigured."
    - skill: ralph-html-design
      hats: [synthesizer]
      purpose: Design direction for the HTML deliverable.
      required: true
      load: on_demand
      source: builtin
      when: "Loaded with ralph-html before writing the .html artifact."
      install_hint: "Embedded in the ralph binary — no install needed; a resolution failure means `skills.overrides` or the registry is misconfigured."

hats:
  scoper:
    name: "Scoper"
    triggers: ["review.start"]
    publishes: ["review.scoped"]
    instructions: |
      Scope the PR review. Identify:
      - What files changed and why
      - The stated purpose vs actual changes
      - Risk areas to focus on
      Publish a brief scope summary as review.scoped event.

  verifier:
    name: "Verifier"
    triggers: ["review.scoped"]
    publishes: ["review.verified"]
    instructions: |
      Verify the PR: checkout the branch, run tests, check compilation.
      Record results (pass/fail with details) and publish review.verified event.

  reviewer:
    name: "Reviewer"
    triggers: ["review.verified"]
    publishes: ["review.complete"]
    instructions: |
      Conduct a thorough code review focusing on:
      - Correctness and logic errors
      - Security issues
      - Performance concerns
      - Test coverage gaps
      - Documentation completeness
      Publish findings as review.complete event with structured output.

  synthesizer:
    name: "Synthesizer"
    triggers: ["review.complete"]
    publishes: ["review.report"]
    aggregate:
      mode: wait_for_all
      timeout: 300
    instructions: |
      Synthesize all review findings into a structured report.
      Write the report as a self-contained HTML file to .ralph/REVIEW-REPORT.html
      — first run `ralph tools skill load ralph-html`, then
      `ralph tools skill load ralph-html-artifact` and
      `ralph tools skill load ralph-html-design`, and follow their
      offline/escaping rules. If the guidance cannot be loaded, do not
      publish review.report; report the load failure instead.
      Include:
      - Summary
      - Findings by category
      - Recommendations
      - Verdict (APPROVE / REQUEST_CHANGES / COMMENT)
      Publish review.report event to signal completion.
