<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ralphbot Mission Control</title>
    <script>
      // Sync theme before first paint to avoid FOUC. Reads the zustand
      // persist envelope; falls back to the OS preference only when no
      // stored choice exists (mirrors features/monitor/theme.ts).
      try {
        var s = localStorage.getItem("ralph-monitor-theme");
        var t = s && JSON.parse(s).state ? JSON.parse(s).state.theme : null;
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
      } catch (e) {
        t = "dark";
      }
      document.documentElement.dataset.theme = t;
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
