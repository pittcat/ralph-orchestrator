name: ralph-project-bootstrap
display_name: "Ralph Project Bootstrap"
description: |
  Bring an arbitrary target project onto an existing Ralph preset with a
  verified runtime suite and a clear handoff.
when_to_use: |
  Use when the operator needs to provision a brand-new or
  under-provisioned target project, restore a missing Ralph pipeline
  suite, or fix a target whose static checks fail because the suite is
  incomplete. Do NOT use this skill to author or review presets
  (`ralph-preset-author` / `ralph-preset-review`), to operate the
  in-loop CLI (`ralph run` / `ralph loops` / `ralph diagnose`), or to
  diagnose a loop that already ran (`ralph-run-diagnosis`).
entry_point: |
  ONE unified entry drives the whole pipeline; never call the helper
  modules by hand to re-implement the flow.
  CLI: python skills/ralph-project-bootstrap/scripts/bootstrap_pipeline.py
       --cwd <project> --preset <preset> [--plan <plan.md>]
       [--prompt-file <prompt.md>] [--binary <ralph>]
       [--refresh-existing] [--replay-transcript <dir>] [--json]
  Code: bootstrap_pipeline.run_pipeline(cwd=..., preset=..., ...)
  --replay-transcript is the ONLY switch that enables an auto-running
  (content_fixed_replay, bounded) smoke backend.
inputs:
  - project_root
  - preset (path or builtin id, already passing strict lint)
  - optional launch context (prompt file, plan, environment, or runtime id)
outputs:
  - owned AGENTS.md / CLAUDE.md managed sections (idempotent)
  - preset-bound ralph.<stem>.yml and PROMPT.<stem>.md (idempotent)
  - provenance embedded in the generated config
  - PipelineResult report in text (default) or --json form
  - staged validation evidence + verification-level handoff
  - command template for missing first-run inputs (without blocking provisioning)
handoff_levels:
  - blocked: a stage returned a typed blocker; no launch command; exit 2.
      Fix what the typed code names, then rerun the entry.
  - incomplete_static_only: artifacts provisioned and the static gate is
      green, but the loop is NOT closed (dry-run green != loop closed);
      the command is a [CANDIDATE] (or [TEMPLATE] when no plan exists)
      the operator must run manually; exit 0.
  - complete: static gate green AND the bounded replay smoke reached the
      terminal marker; the command is the official launch command; exit 0.
boundaries:
  - Does not author or review presets.
  - Does not run loops outside an authorized smoke path.
  - Does not mutate git history, branches, worktrees, or remote refs.
verification_gates:
  - ralph preset check --strict
  - ralph preflight --strict
  - ralph run --dry-run
