# Supervisor capability negative fixture — NOT a builtin preset. For ralph-preset-review acceptance only.
#
# Anti-pattern axes (2026-07-22-002 plan U6 — Supervisor capability audit):
#   (a) supervisor enabled but execution_mode != isolated               → preset.supervisor_requires_isolated
#   (b) hat publishes supervisor coordination topic `exec.wave.failed`  → preset.supervisor_hat_publishes_coord_topic
#   (c) dispatcher reads `.ralph/supervisor.db` for unit state          → preset.supervisor_unit_state_not_via_task_api
#   (d) hat instructions require reading supervisor.db as business artifact → preset.artifact_uses_internal_ledger
#   (e) execution_model Intent mismatch: yaml enables supervisor but intent stays single-chain → preset.execution_model_intent_mismatch
#   (f) supervisor wave consumer hat (triggers contain `*.unit.ready`) without concurrency declaration
#       (concurrency defaults to 1 → no parallelism)                      → preset.supervisor_wave_consumer_low_concurrency
#
# Not registered in presets/manifest.yml; intentionally anonymous.
event_loop:
  # Axis (a): supervisor.enabled without isolated → preset.supervisor_requires_isolated
  execution_mode: coordinator
  supervisor:
    enabled: true
  starting_event: work.start
  completion_promise: work.done
  max_iterations: 12
hats:
  dispatcher:
    name: Dispatcher
    description: Schedules units under supervisor; tracks completion via supervisor.db.
    triggers:
      - work.start
    publishes:
      - exec.unit.ready
    instructions: |
      ## DISPATCHER MODE

      Use `ralph tools task ensure` to register sub-units, then watch
      `.ralph/supervisor.db` to see which slots are free. When all units
      finish, read the final state from the same db to compose the
      final summary. The db is the source of truth for unit state.
    terminal_events:
      - exec.unit.ready
  worker:
    name: Worker
    # Axis (f): supervisor wave consumer hat (`*.unit.ready` trigger)
    # WITHOUT an explicit `concurrency` field (default 1) — exercising
    # `preset.supervisor_wave_consumer_low_concurrency`. A production
    # supervisor worker must declare `concurrency >= 2` to actually
    # parallelize (R4) and the value is further clamped by
    # `event_loop.supervisor.max_concurrent_workers` (U2/U3).
    description: Executes a single unit.
    triggers:
      - exec.unit.ready
    publishes:
      - exec.unit.done
      - exec.wave.failed
    instructions: |
      ## WORKER MODE

      Do the unit, then emit `exec.unit.done` with the result. If the
      unit fails for any reason, emit `exec.wave.failed` so the
      supervisor can re-schedule.
    terminal_events:
      - exec.unit.done
  coordinator:
    name: Coordinator
    description: Closes the loop.
    triggers:
      - exec.unit.done
    publishes:
      - work.done
    instructions: |
      ## COORDINATOR MODE

      Emit `work.done` when all sub-units report `exec.unit.done`.
    terminal_events:
      - work.done