# Payload-content negative fixture — NOT a builtin preset. For ralph-preset-review acceptance only.
#
# Goal: mechanically valid topology + schemas, but payload content still fails
# agent-flow review: (a) fabricated live identity, (b) vague decision field, and
# (c) downstream reference with no upstream emit. Use to verify the review skill
# reports payload-content P0/P1 findings even when mechanical lint stays quiet.
event_loop:
  execution_mode: isolated
  starting_event: review.start
  completion_promise: review.done
  max_iterations: 5
  event_policy:
    enabled: true
    mode: enforce
    topic_deny_rules:
      - {hat_id: reviewer_consumer, topic: review.dimension.done}
      - {hat_id: dimension_reviewer, topic: review.done}
      - {hat_id: ralph, topic: review.dimension.done}
      - {hat_id: ralph, topic: review.done}
    schemas:
      review.dimension.done:
        required_fields:
          - task_id
          - verdict
          - reason
          - summary
      review.done:
        type: object
hats:
  dimension_reviewer:
    name: Dimension Reviewer
    description: Reviews a single dimension of work.
    triggers:
      - review.start
    publishes:
      - review.dimension.done
    instructions: |
      ## DIMENSION REVIEWER MODE

      Use the task id `task-123` from this preset note.

      Emit `review.dimension.done` with:
      - task_id: task-123
      - verdict: pass / fail / needs-fix
      - reason: free-form justification
      - summary: "done"
    event_filter:
      enabled: true
      events:
        - work.start
    exempt_topics:
      - review.dimension.done
    terminal_events:
      - review.dimension.done
  reviewer_consumer:
    name: Reviewer Consumer
    description: Aggregates dimension results.
    triggers:
      - review.dimension.done
    publishes:
      - review.done
    instructions: |
      ## REVIEWER CONSUMER MODE

      When all `review.dimension.done` events arrive, read the upstream
      `correction_signal` payload field to decide fix / block / complete.

      Emit `review.done` when satisfied.
    event_filter:
      enabled: true
      events:
        - work.start
    exempt_topics:
      - review.done
    terminal_events:
      - review.done
