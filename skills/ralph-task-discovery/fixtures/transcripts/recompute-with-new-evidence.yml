    source: Cargo.toml
    observation: "ralph-core 为 workspace 成员,测试入口为 nextest"
    level: E1
  - topic: test_command
    source: "cargo nextest run -p ralph-core 实际执行输出"
    observation: "ralph-core 测试入口真实可运行,修复后连续 10 次运行全绿"
