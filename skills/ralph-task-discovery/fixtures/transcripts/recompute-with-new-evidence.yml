# 重算 transcript(deterministic):第一轮只有文档/源码证据 → 0.78 停留调查带;
# 第二轮新增 E3(真实执行)与 E4(独立验收 replay)证据 → 重算到 0.87,
# 覆盖达标 → author_ready。investigation_attempts 保留完整重算审计链。
project_root: /workspace/demo-repo
goal_request: "稳定超时路径的 flaky 测试并给出回归证据"
task_type: feature
previous_status: needs_investigation
attempt_count: 2
project_facts:
