    source: docs/solutions/testing/timeout-flake-history.md
    observation: "该 flake 历史出现 3 次,均在超时路径"
    level: E1
  - topic: race_window
    source: crates/ralph-core/src/event_loop/timeout.rs
    observation: "竞态窗口定位在 producer/consumer 唤醒之间"
    level: E2
  - topic: acceptance_replay
    source: replay/timeout-flake
    observation: "独立 replay 场景确认回归不再复现"
    level: E4
user_answers:
  - topic: goal
    clarity: explicit
    answer: "目标是消除超时路径 flake 并留下回归 replay"
  - topic: scope
    clarity: explicit
    answer: "只改超时路径与其测试"
  - topic: completion_evidence
    clarity: explicit
    answer: "连续 10 次绿且 replay 不复现"
  - topic: failure_boundaries
    clarity: explicit
    answer: "其它测试套件出现回归即停止"
candidates:
