    summary: "事件驱动等待替代固定 sleep,并补 replay 回归场景"
    confidence: 0.87
    goal_coverage: 0.90
    acceptance_coverage: 0.88
    project_fit: 0.85
    evidence_topics: [flake_history, race_window]
    selected: true
    status: selected
investigation_attempts:
  - round: 1
    candidate_id: C1
    added_topics: [package_manifest, flake_history, race_window]
    score_before: 0.50
    score_after: 0.78
    provenance: "第一轮:文档 + 源码证据,无可执行验证"
  - round: 2
    candidate_id: C1
