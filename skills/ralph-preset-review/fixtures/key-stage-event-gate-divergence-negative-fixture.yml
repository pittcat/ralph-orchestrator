# Key-stage event gate notes-vs-preset divgergence negative fixture — NOT a builtin preset. For ralph-preset-review acceptance only.
#
# Plan 2026-08-05-007 axes (capability-triggered key-stage event gate):
#   (a) author notes record `guard_selection: precheck` + `precheck_retry_budget: 3`
#       for the main handoff, but the preset YAML has no `event_loop.precheck.rules`
#       entry → coverage drift between notes and preset.
#       → expected review-only finding: `preset.key_stage_event_gate_notes_preset_diverge`.
#   (b) author notes record `precheck_retry_budget: 3` and
#       `payload_consistency_retry_budget: 3` separately, but the YAML
#       collapses them into a single `retry_budget: 3` field.
#       → expected review-only finding: `preset.key_stage_event_gate_shared_budget`.
#   (c) author notes record `guard_selection: neither` + `reason: "用户偏好"`
#       (vague / non-auditable reason) for a non-critical stage.
#       → expected review-only finding: `preset.key_stage_event_gate_no_reason`.
#
# This fixture is intentionally minimal — it carries the topology for one
# key stage and the divergence / shared-budget / no-reason axes. It is NOT
# a copy of `parallel-forge.yml`. Loader scripts MUST NOT key on preset name.
#
# Acceptance gate:
#   ralph preset check -H skills/ralph-preset-review/fixtures/key-stage-event-gate-divergence-negative-fixture.yml --strict --format json
#     -> no automated lint output for the divergence axis (review-only).
#
# Not registered in presets/manifest.yml.
event_loop:
  execution_mode: isolated
  starting_event: work.start
  completion_promise: plan.complete
  # Divergence axis: notes claimed precheck guard enabled, but rules absent.
  # Shared-budget axis: the two stage budgets are merged into a single
  # `retry_budget` field via an inline operator note (runtime ignores this;
  # review-only evidence).
  retry_budget: 3
hats:
  executor:
    name: Executor
    description: Pretends to author notes that diverge from preset YAML.
    triggers:
      - work.start
    publishes:
      - work.done
    instructions: |
      ## EXECUTOR — KEY-STAGE NOTES-PRESET DIVERGENCE
      Notes claim this fixture enables a precheck guard at the main handoff,
      but the preset YAML contains no `event_loop.precheck.rules`. The
      retry budgets are also collapsed into a single `retry_budget: 3`.
    terminal_events:
      - work.done
