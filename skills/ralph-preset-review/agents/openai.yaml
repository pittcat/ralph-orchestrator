interface:
  display_name: "Ralph Preset Review"
  short_description: "Per-hat activation dry-run + payload audit + preset-review-report"
  default_prompt: "Use $ralph-preset-review to review this Ralph preset. Independently rebuild the key-hat scope from real topology signals (capability-triggered, not preset-name gated), then re-ask the operator to opt in (hard / record / off) to the decision confidence gate; simulate each hat's activation, build a per-hat AAF section, a payload audit table, and a handoff audit table; write preset-review-report.md with P0/P1 findings, confidence scores, decision_gate mode/scope/critical counts, author/reviewer scope delta, and a remediation plan ordered by runtime unblock order."

policy:
  allow_implicit_invocation: true