# Minimal preset fixture — two-hat review loop.
event_loop:
  execution_mode: isolated
  prompt_file: PROMPT.md
  completion_promise: REVIEW_COMPLETE
  starting_event: review.start
  max_iterations: 10
  required_events:
    - review.done
tasks:
  enabled: false
cli:
  backend: claude
hats:
  worker:
    name: Worker
    description: Does the work.
    triggers:
      - review.start
      - review.changes_requested
    publishes:
      - work.done
      - REVIEW_COMPLETE
    terminal_events:
      - work.done
      - REVIEW_COMPLETE
    instructions: "Do the thing, emit work.done."
    event_filter:
      enabled: true
      events:
        - work.start
  reviewer:
    name: Reviewer
    description: Reviews the work.
    triggers:
      - work.done
    publishes:
      - review.done
      - review.changes_requested
    terminal_events:
      - review.done
      - review.changes_requested
    default_publishes: review.changes_requested
    instructions: "Review and emit verdict."
