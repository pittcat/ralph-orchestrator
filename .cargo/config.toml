# Cargo configuration for the ralph-orchestrator workspace.
#
# This file is read by `cargo` for all invocations in this repository. It is
# version-controlled alongside the code so the build, test, and run behaviour
# is reproducible across machines and CI.
#
# See: https://doc.rust-lang.org/cargo/reference/config.html

# Force NO_PROXY for every process cargo spawns (including test binaries).
#
# Background: `reqwest::Client::new()` reads the `HTTP_PROXY` / `HTTPS_PROXY`
# env vars and routes 127.0.0.1 traffic through them when no `NO_PROXY`
# exclusion exists. In environments with a corporate proxy (e.g.
# `HTTP_PROXY=http://192.168.3.231:909`), the proxy cannot reach a local
# `TcpListener::bind("127.0.0.1:0")` and closes the connection before the
# HTTP response is delivered, producing
# `error sending request ... connection closed before message completed`
# in tests that spin up a local RPC server.
#
# Setting `NO_PROXY` here (with `force = true`) makes every test binary in
# the workspace bypass the proxy for loopback hosts, regardless of what the
# user has in their shell environment. The shell env is preserved for
# non-cargo processes; this only affects `cargo` children.
[env]
NO_PROXY = { value = "127.0.0.1,localhost,::1", force = true }
# 2026-07-28-002 fix S1 (R-F2): do NOT force TMPDIR to
# `/private/tmp` here — that path is macOS-only and forces
# every cargo subprocess (incl. `tempfile` / `std::env::temp_dir()`
# users) onto the platform-specific private tmp. The Ubuntu CI
# runners under `.github/workflows/ci.yml` have no `/private/tmp`
# and the entire test suite breaks on TMPDIR-not-found. Cargo
# defaults TMPDIR to the platform-correct temp directory
# (`/tmp` on Linux, `/var/folders/...` on macOS) without help.
# Removed: TMPDIR = { value = "/private/tmp", force = true }

# Repo task runner: `cargo xtask test` mirrors scripts/run-tests.sh
# cross-platform (Windows cannot execute the .sh entrypoint directly).
[alias]
xtask = "run --package xtask --"

# Windows main-thread stack reserve.
#
# Windows gives the main thread a 1 MiB default stack vs 8 MiB on Linux.
# The `clap` derive-generated `Cli::command()` construction for the full
# `Commands` tree (28 subcommands + nested subcommand enums) uses large
# stack frames in debug builds and overflows the 1 MiB reserve, so even
# `ralph --version` crashes with "thread 'main' has overflowed its stack".
# `/STACK:16777216` raises the PE header reserve to 16 MiB for every
# workspace binary linked on MSVC (link.exe and rust-lld both honour it).
# Unix targets are untouched — their default stack is already sufficient.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:16777216"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:16777216"]
