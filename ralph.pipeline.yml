cli:
  backend: claude
  autonomous_idle_timeout_secs: 900

event_loop:
  max_runtime_seconds: 28800 # 新增
  completion_promise: LOOP_COMPLETE
  max_iterations: 500
  prompt_file: execution.target  # 固定编排契约；换 plan 只改 execution.target

telemetry:
  runtime_diagnosis:
    enabled: true
    write_artifacts: true
    prompt_injection_enabled: true     # 让 agent 在 prompt 看到 "## Runtime Diagnosis Alert"
    max_repeated_recoveries: 2         # 从默认 3 降到 2：第 2 次同 retry_key 直接 escalation
    max_prompt_findings: 8             # 从默认 5 提到 8：更早暴露问题
    artifact_retention: 20             # 从默认 10 提到 20：留更多回溯
    max_prompt_chars: 4096             # 从默认 2000 提到 4096：容下 8 条较长 finding 不被截断
    retry_window_iterations: 8         # 从默认 5 提到 8：拉长短期记忆到 4 小时（配合长 iter 时间）
    drift:                             # U5 烟雾报警器：三个传感器阈值（多 hat preset 必配）
      field_completeness_threshold: 0.85   # 从默认 0.9 降到 0.85：兼容"先占位后补全"的两阶段发事件
      coord_join_mode: serial              # ce-executor-serial 4-dim 串行链,默认 parallel 的 60% 阈值会误报;operator 接管 telemetry 后此模式生效
      coord_join_rate_threshold: 0.6       # 默认 0.6：多 hat 协作上下衔接率底线
      emit_cadence_sigma: 2.0              # 默认 2.0：节拍器灵敏度 2σ（工业界标准）

core:
  guardrails:
    - "Fresh context each iteration — re-read scratchpad and plan."
    - "Commit after each completed step. Never commit Ralph files."
    - "For code-writing and verification hats (`executor`, `test-stabilizer`, `fixer`), Rust compiler warnings are forbidden at final verification: run `RUSTFLAGS='-D warnings' rtk cargo check --workspace --all-targets`; fix every diagnostic and rerun until it exits 0. Do not silence warnings with `#[allow]` unless intentional and documented. Read-only review and reporting hats must not rerun or repair this gate."
    - "For `executor`, `test-stabilizer`, and `fixer`, verification is mandatory: after the Rust warning gate passes, run the project-authoritative tests required by this preset and AGENTS.md. A non-zero exit blocks that hat's success event; fix and rerun instead of passing failure downstream as success."
    - "Acceptance tests must be real — no placeholder/pending/stub acceptance scenarios when emitting LOOP_COMPLETE."
    - "BDD acceptance checks must verify runtime behavior; comment-only or `Ok(())`-only evaluator passes are invalid."
    - "Confidence protocol: >80 proceed; 50-80 proceed + note in scratchpad; <50 choose safe default + note."
    - "Preserve primary sources — capture referenced code snippets with file:line attribution in scratchpad."
    - "During implementation/fixing, run targeted tests via `rtk cargo nextest run -p <crate> -- <relevant-test>`; all packages, including `ralph-cli`, use nextest default concurrency. At the preset's full-suite gates, run `./scripts/run-tests.sh`. 若全量基线出现竞态/时序 flake，仅使用 `RALPH_BASELINE_SERIAL=1 ./scripts/run-tests.sh` 作为文档化的单线程兜底；serial 仍失败才是真失败。"
    - "Never push to a remote, create/switch/rename branches, or create worktrees. The operator owns all remote, branch, and worktree actions."
    - "Never kill, signal, or terminate Ralph processes. If orchestration must stop or restart, emit the event allowed by the current hat or report the blocker to the operator."
    - "When `RALPH_CURRENT_HAT` is set (in-loop), never `ralph wave emit` / `ralph wave verify` into the live loop events file (`RALPH_EVENTS_FILE` or workspace `.ralph/events*.jsonl`). Wave protocol experiments must use a temp workspace or an explicit scratch events file. In-loop hats may only emit topics listed in their `publishes` (for `executor`: only `work.done` / `work.failed`)."
