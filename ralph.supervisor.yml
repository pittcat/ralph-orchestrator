# ralph.supervisor.yml
# 配套 builtin:ce-executor-supervisor preset 的项目级 overlay
#
# 用法:
#   cargo build -p ralph-cli --release --features supervisor-db
#   ralph run -H builtin:ce-executor-supervisor \
#     -c ralph.supervisor.yml \
#     --worktree --reuse-worktree \
#     --plan docs/plans/<plan>.md
#
# 字段职责:
# - preset 自带:16+1 hat 拓扑 / event_loop.execution_mode=isolated /
#   event_policy.mode=enforce / 6 维 review 维度 / topic_format_whitelist /
#   default_publishes,均不在此处重写(算子省略时 preset opt-in 自动生效)。
# - 此处只放:CLI 默认 backend、agent 后端模型、supervisor 调优覆盖、
#   tasks/memories/hooks 启用、profiles 按 hat 角色分级、worktree 配置。

# ── CLI 默认 backend ─────────────────────────────────────────────
# preset 的 17 hat 默认继承此 backend;profile 可逐 hat 覆盖
# backend 不写,走 framework 默认(claude)
cli: {}

# ── Event loop 与 supervisor 编排(关键) ────────────────────────
# execution_mode: isolated 与 supervisor.enabled: true 由 preset 提供,
# 此处只覆盖**算子层面**关心的字段。
event_loop:
  # 启动 prompt:进 loop 第一个 activation 用这个文件
  prompt_file: PROMPT.md

  # 迭代上限 + 总时长(hard kill)
  max_iterations: 60
  max_runtime_seconds: 14400   # 4 小时(默认 7200=2h 偏紧,supervisor 长 plan 容易超)

  # ── Supervisor 调优(覆盖 preset 的 framework 默认) ──
  # 详细语义见 crates/ralph-core/src/supervisor/mod.rs
  supervisor:
    enabled: true                                          # preset opt-in(KTD-1 / R-SW-1)
    db_path: .ralph/supervisor.db                          # 默认值,显式写便于审计
    max_concurrent_workers: 4                              # ≤ CPU 核数;>4 个 unit 排队 FIFO
    aggregate_timeout_secs: 1800                           # 默认 600(10min),baseline ./scripts/run-tests.sh
                                                           # 跑 ralph-cli 串行测试套经常 >10min,
                                                           # 拉到 1800 (30min) 避免 progress-steward 误恢复

  # ── event_policy 严格度 ──
  # preset 默认 mode: enforce + reject_with_resume(fail closed)
  # 仅当需要"宽松"时才打开 allow_unsafe_cli_emit(默认 false)
  event_policy:
    enabled: true
    mode: enforce
    on_violation: reject_with_resume
    allow_unsafe_cli_emit: false

  # ── 隔离 / 单事件预算 ──
  ephemeral_isolation: true
  enforce_current_unit: true
  enforce_hat_scope: true

  # 启动 + 终态事件(preset 已声明,显式写便于审计)
  starting_event: plan.ready
  required_events:
    - work.done
    - LOOP_COMPLETE

  # 失败时进度上报的兜底(stall detector)
  progress_steward:
    enabled: true
    stall_threshold_secs: 1200  # 20min 无业务事件触发 loop.stalled → progress-steward 兜底

# ── Tasks / Memories / Hooks ─────────────────────────────────
# tasks / coordinator_hats 与 preset 一致;memories 跨 iteration 复用决策
tasks:
  enabled: true
  coordinator_hats:
    - coordinator
    - progress-steward

memories:
  enabled: true
  # 关键决策写进 .ralph/agent/decisions.md,跨 fresh-context iteration 复用

hooks:
  # 可选:每个 hat activation 前/后挂脚本(此处仅占位,实际启用时打开)
  # pre_hat: scripts/pre-hat-check.sh
  # post_hat: scripts/post-hat-summary.sh

# ── Worktree / 并行执行 ──────────────────────────────────────
# 配合 --worktree --reuse-worktree 标志使用;
# supervisor 已为每个 slot 分配 per-slot worktree。
# 主 worktree 的 base 分支与清理策略走框架默认,不在此处覆盖。
