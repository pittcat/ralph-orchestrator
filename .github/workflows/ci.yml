name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check that embedded files are in sync before other jobs
  # This catches packaging issues early (before they break cargo install)
  check-embedded-files:
    name: Check embedded files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded files are in sync
        run: ./scripts/sync-embedded-files.sh check

  # Format check: no compile needed, runs in seconds
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: ./scripts/ci-rust-gate.sh --skip-embedded-files --skip-clippy --skip-tests --skip-hooks-bdd --skip-mock-e2e

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-embedded-files
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Install cargo-nextest via the official pre-built binary action. The
      # step uses `continue-on-error: true` so a download/install failure does
      # not abort the job; scripts/run-tests.sh and scripts/ci-rust-gate.sh
      # automatically fall back to the legacy single-threaded `cargo test`
      # path when nextest is unavailable, preserving the historical CI gate.
      # tool-version must match mise.toml `"cargo:cargo-nextest"` pin.
      - name: Install cargo-nextest
        continue-on-error: true
        uses: taiki-e/install-action@nextest
        with:
          tool-version: 0.9.140
      - name: Run shared Rust CI gate
        run: ./scripts/ci-rust-gate.sh --skip-embedded-files --skip-format
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            .e2e-tests/report.md
            .artifacts/hooks-bdd/
          if-no-files-found: warn
          retention-days: 30

  # Clippy and Format checks also run in lint.yml on fork PRs
  # (pull_request_target, no secrets needed for fmt-only)

  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: check-embedded-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run test:server
      - run: npm run test -w @ralph-web/dashboard

  # Hooks mutation testing is expensive (~20min). Run locally with:
  #   ./scripts/hooks-mutation-gate.sh

  # Verify the crate can be packaged (catches include_str! issues)
  # Only runs on PRs - main pushes are either merges (already verified) or
  # version bumps (Release workflow handles publishing with correct deps)
  package-check:
    name: Package check
    runs-on: ubuntu-latest
    needs: [check-embedded-files, test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check ralph-cli packages correctly
        run: |
          # This will fail if include_str! references files outside the crate
          # Use --list to validate without resolving crates.io dependencies
          cargo package -p ralph-cli --allow-dirty --list > /dev/null
          echo "Package check passed - all embedded files are included"

  # CLI doc drift check (plan U7): 检测 ralph-tools*.md 文档与 --help 输出的双向漂移
  # baseline 模式: baseline 内已知漂移不阻塞 CI; 新增漂移导致 exit 1
  cli-doc-drift:
    name: CLI doc drift check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build ralph-cli
        run: cargo build -p ralph-cli
      - name: Run CLI doc drift check (strict)
        run: |
          export PATH="$PWD/target/debug:$PATH"
          bash scripts/check-cli-doc-drift.sh --strict

  # Prompt size guard (plan U8 F3 修订): 防止 ralph-tools.md 重新膨胀到 500+ 行
  prompt-size-guard:
    name: Prompt size guard
    runs-on: ubuntu-latest
    needs: [cli-doc-drift]
    steps:
      - uses: actions/checkout@v4
      - name: Verify ralph-tools.md size ≤ 200 lines
        run: bash scripts/guard-prompt-size.sh

  # Agent reference 真实验收 (plan 2026-06-02-001 Unit 3):
  # 用真实 CLI binary 测试 ralph-tools skill list/load、ralph emit 等命令.
  # 使用精确 test name 过滤, 防止空跑.
  agent-reference:
    name: Agent reference CLI tests
    runs-on: ubuntu-latest
    needs: [prompt-size-guard]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build ralph-cli
        run: cargo build -p ralph-cli
      - name: Run agent reference integration tests
        run: |
          TEST_COUNT=$(cargo test -p ralph-cli --test integration_agent_reference -- --test-threads=1 --list 2>/dev/null | grep -c '^test_agent_reference_')
          echo "Found $TEST_COUNT agent reference tests"
          if [ "$TEST_COUNT" -lt 5 ]; then
            echo "ERROR: Expected at least 5 agent reference tests, found $TEST_COUNT"
            exit 1
          fi
          cargo test -p ralph-cli --test integration_agent_reference -- --test-threads=1
