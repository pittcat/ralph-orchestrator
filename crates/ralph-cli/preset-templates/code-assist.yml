# Code Assist Preset Template
# Flexible implementation workflow following TDD principles
#
# Usage:
#   ralph preset new code-assist --name my-code --output .ralph/hats/my-code.yml

x_preset:
  schema_version: 1
  template: code-assist
  template_version: "1.0.0"
  generated_by: "ralph preset new"
  generated_at: {{generated_at}}
  name: {{preset_name}}
  description: {{description}}
  check_profile: strict
  ralph_compat: ">=0.2.0"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  required_events: ["review.passed"]
  starting_event: "build.start"
  max_iterations: 50
  max_runtime_seconds: 7200
  event_policy:
    enabled: true
    mode: enforce
    schemas:
      tasks.ready:
        required_fields: [task_id, task_key]
        payload: json_object
      review.ready:
        required_fields: [task_id, task_key]
        payload: json_object

cli:
  backend: "claude"
  prompt_mode: "arg"

core:
  specs_dir: "./specs/"

hats:
  planner:
    name: "Planner"
    description: "Detects input type and bootstraps implementation context."
    triggers: ["build.start"]
    publishes: ["work.ready"]
    instructions: |
      ## PLANNER MODE

      Analyze the input (PDD output, code task, or rough description) and create implementation tasks.
      Emit `work.ready` for the executor.

  builder:
    name: "Builder"
    description: "TDD implementation following RED → GREEN → REFACTOR."
    triggers: ["work.ready"]
    publishes: ["review.ready"]
    instructions: |
      ## BUILDER MODE

      Follow TDD principles: RED → GREEN → REFACTOR.

      1. Write a failing test
      2. Implement the minimal code to pass
      3. Refactor for clarity
      4. Emit `review.ready`

  critic:
    name: "Critic"
    description: "Fresh-eyes adversarial review of each increment."
    triggers: ["review.ready"]
    publishes: ["review.passed"]
    instructions: |
      ## CRITIC MODE

      Review the implementation with fresh eyes.

      If changes are needed, emit `review.passed` with findings.
      If acceptable, emit `review.passed` with no findings.

  finalizer:
    name: "Finalizer"
    description: "Final gate that decides whether to continue, repair, or finish."
    triggers: ["review.passed"]
    publishes: ["LOOP_COMPLETE"]
    instructions: |
      ## FINALIZER MODE

      Final check before completion.

      If all tasks are complete, emit `LOOP_COMPLETE`.
      If issues remain, route back to builder.
