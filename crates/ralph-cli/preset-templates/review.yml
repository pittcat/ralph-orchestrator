# Review Preset Template
# For reviewing code changes without making modifications
#
# Usage:
#   ralph preset new review --name my-review --output .ralph/hats/my-review.yml

x_preset:
  schema_version: 1
  template: review
  template_version: "1.0.0"
  generated_by: "ralph preset new"
  generated_at: {{generated_at}}
  name: {{preset_name}}
  description: {{description}}
  check_profile: strict
  ralph_compat: ">=0.2.0"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "REVIEW_COMPLETE"
  required_events: ["review.section", "analysis.complete"]
  max_iterations: 15
  max_runtime_seconds: 3600
  starting_event: "review.start"

cli:
  backend: "claude"

core:
  specs_dir: ".agents/scratchpad/"
  guardrails:
    - "ABSOLUTE PROHIBITION: NEVER kill, signal, or terminate any `ralph` / `ralph-orchestrator` process — including `kill`, `pkill`, `killall`, `kill -9`, `kill -TERM`, `kill -HUP`, `taskkill`, or any equivalent process-control command targeting the loop's parent PID, the TUI subprocess PID recorded in `.ralph/loop.lock`, any PID listed in `.ralph/loops.json`, or any PID returned by `ps` / `pgrep` matching `ralph`. The currently running ralph IS the parent process of this very agent iteration — killing it ends the agent itself mid-thought and corrupts orchestration state (stale lock, in_progress tasks, lost events, partial commits). If the loop needs to restart to pick up new configuration, emit `loop.cancel`, surface a `review.blocked` / `REVIEW_COMPLETE` with a clear reason, or instruct the human operator to run `ralph loops stop <loop_id>`. Stopping the orchestrator is the operator's decision, not the agent's."

hats:
  reviewer:
    name: "Code Reviewer"
    description: "Reviews code for correctness, clarity, and maintainability."
    triggers: ["review.start", "review.followup"]
    publishes: ["review.section"]
    default_publishes: "review.section"
    instructions: |
      ## CODE REVIEWER MODE

      Review code for correctness, clarity, and maintainability.
      NO code changes, NO commits.

      ### Process
      1. Create `.eval-sandbox/review/plan.md` as a review-wave plan
      2. Perform bounded adversarial review pass
      3. Identify highest-risk areas for deep analysis
      4. Emit `review.section` with findings

  analyzer:
    name: "Deep Analyzer"
    description: "Performs thorough analysis of specific code sections."
    triggers: ["review.section"]
    publishes: ["analysis.complete"]
    default_publishes: "analysis.complete"
    instructions: |
      ## DEEP ANALYZER MODE

      Perform second adversarial pass against highest-risk finding.
      Attack code adversarially: breakage, unsafe assumptions, security, failure paths.
      Emit `analysis.complete`.

  closer:
    name: "Review Closer"
    description: "Merges findings and advances or completes the review cleanly."
    triggers: ["analysis.complete"]
    publishes: ["review.followup", "REVIEW_COMPLETE"]
    instructions: |
      ## REVIEW CLOSER MODE

      Merge findings, decide whether another wave is required.
      If gaps remain, emit `review.followup`.
      If complete, emit `REVIEW_COMPLETE`.
