[package]
name = "ralph-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Command-line interface for Ralph Orchestrator"
repository.workspace = true
homepage.workspace = true

# Mark this crate for distribution by cargo-dist
[package.metadata.dist]
dist = true

# Copy canonical preset yml into $OUT_DIR at build time, so the
# Rust code can `include_str!(concat!(env!("OUT_DIR"), "/..."))`
# without the crate owning a `presets/` mirror directory.
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "ralph"
path = "src/main.rs"

[dependencies]
ralph-proto.workspace = true
ralph-core.workspace = true
ralph-adapters.workspace = true
ralph-telegram.workspace = true
ralph-tui.workspace = true
ralph-api.workspace = true

tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
reqwest.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures.workspace = true
regex.workspace = true
keyring.workspace = true

# For raw mode handling in PTY mode / terminal restore
crossterm.workspace = true
scopeguard.workspace = true

# For TUI stream handler line types
ratatui.workspace = true

# For progress spinners
indicatif.workspace = true

# For PTY-based wave worker spawning (forces unbuffered stdout)
portable-pty.workspace = true
tempfile.workspace = true

# For opening URLs in the default browser
open.workspace = true

# Cross-platform process tree enumeration for reliable cleanup on TUI quit
sysinfo.workspace = true

# For Unix process group and signal handling
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

# `test-util` enables `Builder::start_paused`, which the U3 paused-time
# dispatcher tests rely on. `full` (the only feature enabled in the
# main tokio dependency above) deliberately does not include
# `test-util`, so we add it here.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "calculator"
path = "examples/calculator.rs"

[[example]]
name = "greeter"
path = "examples/greeter.rs"
