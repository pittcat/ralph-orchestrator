# 2026-07-02-005 U7 runtime: recoverable plan.blocked → REVIEW_COMPLETE(pass)
# 2026-07-06 U3 (DEV-003): bare `recovery_exhausted` is no longer
# recoverable — it would mask the underlying stall retry_key. This
# scenario now exercises a still-recoverable literal reason
# (`review_terminal_drift`) to verify the recoverable path
# continues to admit REVIEW_COMPLETE(pass) after the fail-close
# tightening.
# 2026-07-06-001 U13 (KTD-1 fail-close): `loop_stalled_max_iterations`
# is NO LONGER recoverable (removed from `RECOVERABLE_REASONS` in
# shipper_reason.rs). Scenario must use a reason that remains on
# the post-U13 whitelist — `review_terminal_drift` is the closest
# semantic match (stall-adjacent, recoverable, not delegated to
# progress-steward hat which U10 removed).

name: ce_executor_serial_shipper_recoverable_reasons
description: U7 shipper runtime — recoverable reason (review_terminal_drift) allows REVIEW_COMPLETE pass

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  event_loop:
    execution_mode: isolated
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        plan.blocked:
          payload: json_object
          required_fields: [reason]
        REVIEW_COMPLETE:
          payload: json_object
          required_fields: [pass_or_fail, verdict]
  hats:
    coordinator:
      subscribes_to: [work.done]
      publishes: [plan.blocked]
    shipper:
      subscribes_to: [plan.blocked]
      publishes: [REVIEW_COMPLETE]

mock_responses:
  - |
    <event topic="plan.blocked">
    {"plan_name":"rec-demo","reason":"review_terminal_drift","task_id":"t1","task_key":"k1"}
    </event>
  - |
    <event topic="REVIEW_COMPLETE">
    {"plan_name":"rec-demo","verdict":"pass_with_residuals","pass_or_fail":"pass","residual_findings_summary":"recoverable reason review_terminal_drift; verification passed"}
    </event>
  - |
    waiting.

expected:
  iterations: 3
  events:
    - topic: plan.blocked
    - topic: REVIEW_COMPLETE
  event_topic_counts:
    - topic: REVIEW_COMPLETE
      count: 1
  completion: false
