# 2026-07-07-002 plan Unit 10: task ledger live identity idempotency
#
# work.done with a stale task_key is rejected; a second attempt with
# an unknown task_id is also rejected — neither enters main events.

name: ce_executor_serial_task_identity_idempotent
description: 2026-07-07-002 U10 — stale task identity work.done rejected by execution contract

config:
  prompt_file: PROMPT.md
  max_iterations: 5
  tasks:
    enabled: true
    coordinator_hats:
      - coordinator
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - task.resume
      publishes:
        - work.ready
    executor:
      subscribes_to:
        - work.ready
        - task.resume
      publishes:
        - work.done
        - work.failed
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    execution_contracts:
      enabled: true
      rules:
        work.done:
          require_payload_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
          require_task:
            id_field: task_id
            key_field: task_key
            loop_scoped: true
            allowed_terminal_statuses:
              - closed
            auto_close_on_valid: false
    state_projection:
      enabled: true
      actions_chain:
        work.ready:
          - kind: ensure_task
            key: task_key
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.ready:
          payload: json_object
          required_fields: [plan_name, plan_path, task_id, task_key, step]
        work.done:
          payload: json_object
          required_fields: [plan_name, plan_path, task_id, task_key, step, commit_count]

mock_responses:
  - |
    <event topic="work.start">
    {"plan_name":"task-idem","plan_path":"docs/plans/task-idem.md","task_id":"live-t1","task_key":"ce-executor:task-idem:step-01:u1-impl","step":"step-01"}
    </event>
  - |
    <event topic="work.ready">
    {"plan_name":"task-idem","plan_path":"docs/plans/task-idem.md","task_id":"live-t1","task_key":"ce-executor:task-idem:step-01:u1-impl","step":"step-01","complexity":"small"}
    </event>
  - |
    <event topic="work.done">
    {"plan_name":"task-idem","plan_path":"docs/plans/task-idem.md","task_id":"live-t1","task_key":"ce-executor:task-idem:step-01:u1-stale","step":"step-01","commit_count":1}
    </event>
  - |
    <event topic="work.ready">
    {"plan_name":"task-idem","plan_path":"docs/plans/task-idem.md","task_id":"live-t1","task_key":"ce-executor:task-idem:step-01:u1-impl","step":"step-01","complexity":"small"}
    </event>
  - |
    <event topic="work.done">
    {"plan_name":"task-idem","plan_path":"docs/plans/task-idem.md","task_id":"stale-t2","task_key":"ce-executor:task-idem:step-01:u1-impl","step":"step-01","commit_count":1}
    </event>

expected:
  iterations: 5
  events:
    - topic: work.ready
    - topic: task.resume
  event_topic_counts:
    - topic: work.ready
      count: 1
    - topic: work.done
      count: 0
    - topic: task.resume
      count: 2
  absent_events:
    - topic: work.done
    - topic: plan.blocked
  recovery_contains:
    - live identity mismatch
  completion: false
