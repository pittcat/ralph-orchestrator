# 2026-06-30-001 U4 BDD scenario: shipper reason 严格白名单
#
# BDD 覆盖:P0-2 (primary-20260630-032648 diagnosis) 修复。
# shipper 收到 plan.blocked(reason=stall_no_events recovery: ...)
# (recovery bucket reason,**不在**白名单内)时,必须走 hard-fail
# 路径,不能升级为 pass。Pre-fix 行为:shipper 把
# "with recoverable reason X" 解读为 substring 匹配, 把
# stall_no_events recovery 升级为 pass_with_residuals,导致
# LOOP_COMPLETE 但实际工作失败。
#
# 期望:REVIEW_COMPLETE 的 pass_or_fail 是 "fail",verdict
# 是 "fail",residual_findings_summary 包含 reason 的
# 字面量。无 plan.blocked 之外的事件。

name: u4_shipper_reason_whitelist
description: U4 - shipper reason 路由严格白名单:非白名单 reason 走 hard-fail

config:
  prompt_file: PROMPT.md
  max_iterations: 5
  hats:
    coordinator:
      subscribes_to:
        - work.done
      publishes:
        - plan.blocked
    shipper:
      subscribes_to:
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE

mock_responses:
  - text: |
      <event topic="plan.blocked">
      {"reason":"stall_no_events recovery: progress-steward did not advance","plan_name":"u4-demo","task_id":"t1","task_key":"k1"}
      </event>
    hat: coordinator
  - text: |
      <event topic="REVIEW_COMPLETE">
      {"verdict":"fail","pass_or_fail":"fail","residual_findings_summary":"plan.blocked with reason 'stall_no_events recovery: progress-steward did not advance'; shipper strict-match routed to hard-fail because reason is not in the strict whitelist (loop_stalled_max_iterations, steward_escalation, review_terminal_drift)"}
      </event>
    hat: shipper
  - text: |
      waiting.
    hat: shipper
  - text: |
      waiting.
    hat: shipper
  - text: |
      waiting.
    hat: shipper

expected:
  iterations: 5
  events:
    - topic: plan.blocked
    - topic: REVIEW_COMPLETE
  absent_events:
    - topic: plan.complete
  completion: false
