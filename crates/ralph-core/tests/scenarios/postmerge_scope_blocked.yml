# U4 (plan 2026-08-08-004 §Unit 4 §9): critical unknown blocks audit.
# A hunk in a critical path cannot be attributed to any known plan.
# change-mapper emits blocked postmerge.changemap.ready with proceed:false,
# critical_unknown_count>0, scope_status:blocked. The EventLoop accepts the event.
# system-auditor short-circuits; no postmerge.audit.ready is emitted;
# closer emits postmerge.reviewed with verdict:FAIL.

name: postmerge_scope_blocked
description: Critical unknown hunk blocks audit — change-mapper emits proceed:false scope_status:blocked; loop completes with FAIL

config:
  prompt_file: PROMPT.md
  topic_format_whitelist:
    - LOOP_COMPLETE
  max_iterations: 10
  hats:
    baseline:
      subscribes_to:
        - postmerge.start
      publishes:
        - postmerge.baseline.ready
    change-mapper:
      subscribes_to:
        - postmerge.baseline.ready
      publishes:
        - postmerge.changemap.ready
    system-auditor:
      subscribes_to:
        - postmerge.changemap.ready
      publishes:
        - postmerge.audit.ready
    closer:
      subscribes_to:
        - postmerge.audit.ready
      publishes:
        - postmerge.reviewed
    reporter:
      subscribes_to:
        - postmerge.reviewed
      publishes:
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "postmerge.start"
    completion_promise: "LOOP_COMPLETE"
    required_events:
      - "postmerge.audit.ready"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        postmerge.baseline.ready:
          required_fields:
            - baseline_valid
            - artifact_path
            - head_sha
            - branch
          payload: json_object
        postmerge.changemap.ready:
          required_fields:
            - proceed
            - artifact_path
            - scope_manifest_path
            - scope_digest
            - scope_status
            - overall_confidence
            - critical_unknown_count
            - scope_base_sha
            - scope_source
            - plan_match_confidence
            - high_risk_crossings_count
            - interleaved_diff_path
            - override_diff_path
            - unknown_diff_path
            - interleaved_commits_count
            - override_commits_count
            - unknown_commits_count
          payload: json_object
        postmerge.audit.ready:
          required_fields:
            - proceed
            - findings_created_count
            - audit_docs_complete
            - low_confidence_findings_count
          payload: json_object
        postmerge.reviewed:
          required_fields:
            - verdict
            - verdict_confidence
            - final_review_path
            - clean_validation_path
          payload: json_object
        LOOP_COMPLETE:
          required_fields:
            - success
            - verdict
            - report_path
          payload: json_object

mock_responses:
  - text: |
      <event topic="postmerge.baseline.ready">
      {"baseline_valid":true,"artifact_path":".ralph/post-merge/01-baseline.md","head_sha":"abc1234def5678901234567890abcdef1234567890","branch":"main"}
      </event>
    hat: baseline
  - text: |
      <event topic="postmerge.changemap.ready">
      {"proceed":false,"artifact_path":".ralph/post-merge/02-change-map.md","scope_manifest_path":".ralph/post-merge/scope-manifest.json","scope_digest":"abcd1234ef5678901234567890abcdef1234567890abcdef1234567890abcdef1234567890","scope_status":"blocked","overall_confidence":0,"critical_unknown_count":1,"scope_base_sha":"aaa1234def5678901234567890abcdef1234567890","scope_source":"branch-merge","plan_match_confidence":"medium","high_risk_crossings_count":0,"interleaved_diff_path":".ralph/post-merge/diffs/interleaved.patch","override_diff_path":".ralph/post-merge/diffs/override.patch","unknown_diff_path":".ralph/post-merge/diffs/unknown.patch","interleaved_commits_count":0,"override_commits_count":0,"unknown_commits_count":1}
      </event>
    hat: change-mapper
  - text: |
      <event topic="postmerge.audit.ready">
      {"proceed":false,"findings_created_count":0,"audit_docs_complete":true,"low_confidence_findings_count":0}
      </event>
    hat: system-auditor
  - text: |
      <event topic="postmerge.reviewed">
      {"verdict":"FAIL","verdict_confidence":"high","final_review_path":".ralph/post-merge/15-final-review.md","clean_validation_path":".ralph/post-merge/14-clean-validation.md"}
      </event>
    hat: closer
  - text: |
      <event topic="LOOP_COMPLETE">
      {"success":false,"verdict":"FAIL","report_path":".ralph/post-merge/REPORT.md"}
      </event>
    hat: reporter

expected:
  iterations: 5
  events:
    - topic: postmerge.baseline.ready
    - topic: postmerge.changemap.ready
    - topic: postmerge.audit.ready
    - topic: postmerge.reviewed
  completion: true
  payload_matches:
    - topic: postmerge.changemap.ready
      fields:
        proceed: false
        scope_manifest_path: ".ralph/post-merge/scope-manifest.json"
        scope_status: "blocked"
        critical_unknown_count: 1
        unknown_commits_count: 1
    - topic: postmerge.reviewed
      fields:
        verdict: "FAIL"
