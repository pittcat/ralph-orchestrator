# ce_executor_pipeline_loop_fixer_fail_stop: U6 Fixer per-Fix-Unit fail-stop
#
# 2026-07-16-001 plan U6: Fixer MUST execute Fix Units strictly
# serially. When a non-final Fix Unit fails (UF2 in this scenario),
# subsequent Fix Units (UF3..U5) MUST NOT start. `fix.done` MUST
# carry the complete Fix Unit accounting bill:
#   planned_fix_units = [UF1, UF2, UF3, UF4, UF5]
#   attempted_fix_units = [UF1, UF2]
#   completed_fix_units = [UF1]
#   failed_fix_units = [UF2]
#   skipped_fix_units = [UF3, UF4, UF5]
#
# Then fix.done directly triggers review-reentry → review.loop.blocked (round 2
# P0/P1 still not closed). Reporter consumes review.loop.blocked and
# emits report.done + LOOP_COMPLETE with verdict=blocked.
#
# Asserts:
# - fix.done carries the complete fix-unit bill (mutually exclusive,
#   exhaustive over planned_fix_units).
# - UF3..UF5 never start (no further fix-related events between
#   fix.done and the next review-reentry round).
# - review.loop.blocked fires because round 2 still has unresolved
#   must-fix-now findings.
# - LOOP_COMPLETE reason explicitly references max_round_blocked or
#   review.loop.blocked.

name: ce_executor_pipeline_loop_fixer_fail_stop
description: ce-executor-pipeline-loop U6 — Fixer fail-stop on UF2 with fix-unit bill and review.loop.blocked terminal

config:
  prompt_file: PROMPT.md
  max_iterations: 50
  hats:
    plan-reviewer:
      subscribes_to: [work.start]
      publishes: [plan.ready, plan.blocked]
    executor:
      subscribes_to: [plan.ready]
      publishes: [work.done, work.failed]
    test-stabilizer:
      subscribes_to: [work.done]
      publishes: [stabilization.done, stabilization.blocked]
    review-reentry:
      subscribes_to: [stabilization.done, fix.done]
      publishes: [review.round.ready]
    "dim:goal-alignment":
      subscribes_to: [review.round.ready]
      publishes: [review.goalalign.done]
    "dim:correctness":
      subscribes_to: [review.goalalign.done]
      publishes: [review.correctness.done]
    "dim:testing":
      subscribes_to: [review.correctness.done]
      publishes: [review.testing.done]
    "dim:maintainability":
      subscribes_to: [review.testing.done]
      publishes: [review.maintainability.done]
    "dim:project-standards":
      subscribes_to: [review.maintainability.done]
      publishes: [review.standards.done]
    "dim:adversarial":
      subscribes_to: [review.standards.done]
      publishes: [review.adversarial.done]
    review-synthesizer:
      subscribes_to: [review.adversarial.done]
      publishes: [review.synthesized]
    review-gate:
      subscribes_to: [review.synthesized]
      publishes: [review.accepted, fix.requested, review.loop.blocked]
    fix-planner:
      subscribes_to: [fix.requested]
      publishes: [review.complete]
    fixer:
      subscribes_to: [review.complete]
      publishes: [fix.done]
    alignment:
      subscribes_to: [review.accepted]
      publishes: [align.done]
    reporter:
      subscribes_to: [align.done, plan.blocked, work.failed, stabilization.blocked, review.loop.blocked]
      publishes: [report.done, LOOP_COMPLETE]
  event_loop:
    execution_mode: isolated
    starting_event: work.start
    completion_promise: LOOP_COMPLETE
    required_events: [report.done]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics: [LOOP_COMPLETE]
      business_topics:
        - plan.ready
        - plan.blocked
        - work.done
        - work.failed
        - stabilization.done
        - stabilization.blocked
        - review.round.ready
        - review.goalalign.done
        - review.correctness.done
        - review.testing.done
        - review.maintainability.done
        - review.standards.done
        - review.adversarial.done
        - review.synthesized
        - review.accepted
        - fix.requested
        - review.complete
        - fix.done
        - review.loop.blocked
        - align.done
        - report.done

