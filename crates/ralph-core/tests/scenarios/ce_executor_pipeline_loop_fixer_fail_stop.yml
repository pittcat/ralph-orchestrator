    - topic: stabilization.done
      count: 1
    - topic: review.round.ready
      count: 2
    - topic: review.synthesized
      count: 2
    - topic: fix.done
      count: 1
    - topic: fix.requested
      count: 1
  payload_matches:
    - topic: fix.done
      fields:
        review_round: 1
        head_sha: "0000000000000000000000000000000000000003"
        planned_fix_units: ["UF1","UF2","UF3","UF4","UF5"]
        attempted_fix_units: ["UF1","UF2"]
        completed_fix_units: ["UF1"]
        failed_fix_units: ["UF2"]
        skipped_fix_units: ["UF3","UF4","UF5"]
        fix_status: "partial"
    - topic: review.round.ready
      occurrence: 1
      fields:
        review_round: 1
        source_topic: work.done
    - topic: review.round.ready
      occurrence: 2
      fields:
        review_round: 2
        source_topic: fix.done
    - topic: review.loop.blocked
      fields:
        review_round: 2
        reason: "max_round_blocked"
    - topic: report.done
      fields:
        verdict: "blocked"
        reason: "review.loop.blocked: max_round_blocked"
  completion: true
