# Isolated Multi-Hat: strategist -> implementer -> reviewer
# Isolated mode requires a separate backend iteration per hat stage.
#
# U3 update: review.complete is a legitimate terminal topic for the
# reviewer (declared in its `publishes` list), so it passes the
# per-hat scope check and enters the existing completion safety
# pipeline as a normal business event. The completion promise is
# published in a later iteration (separate turn / backend call),
# which the U3 isolated boundary allows because it is the only
# business event in that turn.

name: isolated_multi_hat
description: Isolated mode with 3 hats requires separate iterations

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    strategist:
      subscribes_to:
        - task.start
      publishes:
        - experiment.planned
    implementer:
      subscribes_to:
        - experiment.planned
      publishes:
        - experiment.ready
    reviewer:
      subscribes_to:
        - experiment.ready
      publishes:
        - review.complete
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE

mock_responses:
  - |
    <event topic="experiment.planned">
    plan: "Build the feature"
    </event>
  - |
    <event topic="experiment.ready">
    status: "implemented"
    </event>
  - |
    <event topic="review.complete">
    verdict: "approved"
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 4
  events:
    - topic: experiment.planned
    - topic: experiment.ready
    - topic: review.complete
  completion: true
