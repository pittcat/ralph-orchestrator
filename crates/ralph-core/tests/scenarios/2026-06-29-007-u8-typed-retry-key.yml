# 2026-06-29-007 U8: typed RejectionKind 共享 + scenario helper
#
# BDD 覆盖:RejectionKind typed enum 提供稳定 retry key 计算,
# 不再依赖 from_reason 字符串拼接。单测在 rejection_kind::tests
# 已覆盖 parse / as_str / compute_retry_key / outcome migration;
# 此 scenario 是 integration 冒烟。
#
