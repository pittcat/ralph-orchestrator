name: u8_typed_retry_key
description: U8 - typed RejectionKind 在 happy path 不破坏既有流

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    coordinator:
      subscribes_to:
        - work.done
      publishes:
        - plan.complete
      default_publishes: plan.complete

mock_responses:
  - |
    <event topic="work.done">
    plan_name: "u8-demo"
    step: "step-01"
    task_id: "u8-task"
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "u8-demo"
    verdict: pass
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 3
  events:
    - topic: work.done
    - topic: plan.complete
  absent_events:
    - topic: plan.blocked
  completion: false