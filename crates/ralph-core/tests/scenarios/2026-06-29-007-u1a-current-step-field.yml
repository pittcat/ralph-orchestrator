# 2026-06-29-007 U1a: flow_lifecycle.current_step 独立字段
#
# BDD 覆盖:FlowLifecycleRegistry 新增独立 current_step 字段,
# current_step_id() 直接返回字段值(空时降级到 records 兜底 → unit_loop)。
# 单元测试在 flow_lifecycle::tests::* 已经覆盖;此 scenario 作为
# 跨模块冒烟,验证 integration 层没有破坏既有 scenario_runner。
#
# 期望:
# - 2 步 plan 全部 work.done 后 scenario 正常结束(无 reject 报错)
# - recovery.jsonl 没有任何 flow_unknown_emit / current_step drift

name: u1a_current_step_field
description: flow_lifecycle.current_step 字段化,不破坏既有 scenarios

config:
  prompt_file: PROMPT.md
  max_iterations: 4
  hats:
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
      default_publishes: work.done

mock_responses:
  - |
    <event topic="work.ready">
    plan_name: "u1a-demo"
    step: "step-01"
    task_id: "u1a-task-1"
    </event>
  - |
    <event topic="work.done">
    plan_name: "u1a-demo"
    step: "step-01"
    task_id: "u1a-task-1"
    </event>
  - |
    <event topic="work.ready">
    plan_name: "u1a-demo"
    step: "step-02"
    task_id: "u1a-task-2"
    </event>
  - |
    <event topic="work.done">
    plan_name: "u1a-demo"
    step: "step-02"
    task_id: "u1a-task-2"
    </event>

expected:
  iterations: 4
  events:
    - topic: work.ready
    - topic: work.done
    - topic: work.ready
    - topic: work.done
  absent_events:
    - topic: plan.blocked
    - topic: LOOP_COMPLETE
  completion: false