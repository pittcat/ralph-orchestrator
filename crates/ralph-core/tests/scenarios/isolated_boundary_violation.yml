# Isolated Boundary Violation: extra business events beyond the first are dropped
# In isolated mode a single backend call may only advance one hat stage.
#
# 2026-07-28-001 plan U3 (commit-aware over-emit recovery): the
# recovery `task.resume` is injected only when ZERO business
# events committed. To exercise both the recovery round-trip
# AND the boundary diagnostic, this scenario emits ONE
# out-of-scope business event (no commit) plus the over-emit
# so the hat's primary intent never lands and the
# bounded `task.resume` reaches turn 2 with the "EXACTLY ONE
# business event" instruction. The boundary diagnostic is
# still required in the events stream for the over-emit topic.
#
# Scenario: turn 1 strategist emits `experiment.planned` (an
# out-of-scope topic the hat does not own) and
# `experiment.ready` (its only authorised business event).
# Because the first event is dropped by the scope gate, the
# turn commits zero business events; the budget drops the
# second event, publishes a boundary diagnostic, and stages
# a recovery resume. Turn 2 strategist receives the recovery
# text and emits LOOP_COMPLETE.

name: isolated_boundary_violation
description: Isolated mode drops extra business events beyond the first and records a boundary diagnostic; the recovery resume fires only on a zero-commit turn

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    strategist:
      subscribes_to:
        - task.start
        - experiment.ready
      publishes:
        - experiment.ready
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE

# Turn 1: strategist writes experiment.ready (the only business
# event it owns) and emits an out-of-scope topic first to make
# the turn zero-commit. U3 injects the recovery resume.
# Turn 2: strategist is re-activated by that recovery resume
# and emits LOOP_COMPLETE.
mock_responses:
  - |
    <event topic="experiment.planned">
    plan: "Build the feature"
    </event>
    <event topic="experiment.ready">
    status: "ready"
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 2
  events:
    - topic: experiment.ready
  absent_events:
    - topic: experiment.planned
  completion: true
