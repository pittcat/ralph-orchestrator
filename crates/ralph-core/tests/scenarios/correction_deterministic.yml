# correction_deterministic: U7a / U9 — deterministic correction injection
#
# 2026-06-21-002 plan U7a / U9: when the orchestrator rejects a
# recoverable event, the rejection flows into the prompt as a
# `CorrectionContext` (rendered as `## ORCHESTRATOR CORRECTION`)
# instead of relying on a `task.resume` event being published to
# the bus.
#
# This BDD scenario pins the deterministic-correction contract end
# to end:
#
#   iter 1: clean baseline — no correction block in the prompt.
#   iter 2: a recoverable rejection (missing required field) fires;
#           `state.prompt_context.correction_blocks` accumulates
#           a `CorrectionContext` with `reason_code` containing
#           `policy:` prefix.
#   iter 3: the next `build_prompt` output contains
#           `## ORCHESTRATOR CORRECTION` — the legacy
#           `task.resume` injection is NOT required.
#
# Note: per plan §"保守做法" the `task.resume` legacy path is
# preserved; this scenario asserts the *new* path produces the
# `## ORCHESTRATOR CORRECTION` block. The legacy path stays
# covered by `event_loop/tests/task_resume_ttl.rs` (T2-FRESH,
# T2-STALE, etc.) and other test files in the U9 list.

name: correction_deterministic
description: recoverable rejection accumulates CorrectionContext and is rendered as ## ORCHESTRATOR CORRECTION in the next prompt

config:
  prompt_file: PROMPT.md
  max_iterations: 4
  hats:
    executor:
      name: "Executor"
      subscribes_to:
        - task.start
      publishes:
        - work.done
  event_loop:
    execution_mode: isolated
    starting_event: "task.start"
    completion_promise: "LOOP_COMPLETE"
    hat_handoff:
      enabled: true
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.done:
          required_fields:
            - plan_name
            - step
            - commit_count

mock_responses:
  # iter 1: clean baseline — no rejections yet.
  - text: |
      <event topic="task.start">
      {"plan_name":"plan-s","task_id":"t1","step":"step-01"}
      </event>
    hat: executor
  # iter 2: schema-INVALID work.done — engine gate rejects,
  # seeding the correction pipeline. Recovery.jsonl is
  # appended by `emit_correction_context`.
  - text: |
      <event topic="work.done">
      {"commit_count":1}
      </event>
    hat: executor
  # iter 3: a valid `task.start` to advance without re-triggering
  # a fresh rejection — the correction block should still be in
  # the prompt queue from iter 2.
  - text: |
      <event topic="task.start">
      {"plan_name":"plan-s","task_id":"t1","step":"step-02"}
      </event>
    hat: executor
  # iter 4: clean work.done — clear the queue.
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-s","step":"step-04","commit_count":4}
      </event>
    hat: executor

expected:
  iterations: 4
  events: []
  completion: false
  assert_state:
    # iter 2: prompt_context has a correction block with the
    # `policy:` reason_code prefix (engine gate rejection is
    # routed via `from_lint_hint` which sets reason_code to
    # `lint:...`; we accept either as the deterministic
    # contract is "a correction block is present", not the
    # specific prefix).
    - at_iteration: 2
      correction_block_present:
        reason_code_prefix: "lint:"
    # iter 3: the next build_prompt output carries
    # ## ORCHESTRATOR CORRECTION block — the legacy task.resume
    # channel is not required. The harness's
    # `next_hat()` rotation prompts the orchestrator hat
    # (`ralph`) before the executor in single-hat isolated
    # mode, so the snapshot records `ralph`'s prompt.
    - at_iteration: 3
      prompt_injects:
        hat: ralph
        block: "## ORCHESTRATOR CORRECTION"
