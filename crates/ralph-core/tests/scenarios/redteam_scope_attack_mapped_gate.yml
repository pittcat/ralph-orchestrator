# U1 (plan 2026-08-08-004 fix-plan §Unit 1) + U3 (plan 2026-08-10-002
# §Unit 3, R1/R2/R6/D5): red-team attack.mapped HARD GATE.
#
# 2026-08-08-004 review: HARD GATE in `presets/en/red-team-attack.yml`
# is prompt-text only. The runtime gate is now implemented via
# schema-required `predecessor_event` field PLUS a payload_consistency
# rule that rejects wrong literals via `ne` (2026-08-10-002 U3
# correction: the previous `exists:true AND eq:"redteam.plan.resolved"`
# form was inverted — it Hit on the legal value and Missed on the
# missing/wrong case).
#
# This fixture exercises three chains:
#   1) **Missing predecessor** — attack-surface-mapper emits
#      `redteam.attack.mapped` WITHOUT `predecessor_event`. Schema
#      `required_fields` rejects the emit; attack.mapped absent from
#      trace; loop falls through to `redteam.complete(success:false)`.
#   2) **Wrong predecessor** — attack-surface-mapper emits
#      `redteam.attack.mapped` WITH `predecessor_event:
#      "redteam.plan.unresolved"`. Schema accepts the field (it's
#      present), but the payload_consistency rule
#      `redteam-attack-mapped-predecessor-must-be-resolved` (ne form)
#      rejects the wrong literal; attack.mapped absent from trace;
#      loop falls through to `redteam.complete(success:false)`.
#   3) **Legal predecessor** — attack-surface-mapper emits
#      `redteam.attack.mapped` WITH `predecessor_event:
#      "redteam.plan.resolved"`. Schema accepts; payload_consistency
#      rule Misses (value == literal); attack.mapped lands; experiment
#      runner activates; loop reaches `redteam.complete(success:true)`.
#
# 2026-08-10-002 plan U3 §6 + §9: this single fixture covers the
# three-part predecessor matrix (correct / missing / wrong). The
# missing and wrong paths preserve the original reject assertion;
# the legal path is the new acceptance branch added by U3.

name: redteam_scope_attack_mapped_gate
description: Red-team attack.mapped HARD GATE — schema-required `predecessor_event` + payload_consistency `ne` rule reject missing/wrong predecessors and accept the legal literal

config:
  prompt_file: PROMPT.md
  topic_format_whitelist:
    - LOOP_COMPLETE
  max_iterations: 24
  hats:
    target-locker:
      subscribes_to: []
      publishes:
        - redteam.target.locked
    plan-resolver:
      subscribes_to:
        - redteam.target.locked
      publishes:
        - redteam.plan.resolved
        - redteam.plan.unresolved
    attack-surface-mapper:
      subscribes_to:
        - redteam.plan.resolved
      publishes:
        - redteam.attack.mapped
    reporter:
      subscribes_to:
        - redteam.reviewed
        - redteam.plan.unresolved
      publishes:
        - redteam.complete
  event_loop:
    execution_mode: isolated
    starting_event: "redteam.start"
    completion_promise: "redteam.complete"
    required_events:
      - "redteam.target.locked"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        redteam.target.locked:
          required_fields:
            - target_head
            - target_tree
            - plan_count
            - lock_file_path
            - lock_status
          payload: json_object
        redteam.plan.resolved:
          required_fields:
            - resolved_count
            - unresolved_count
            - resolution_file_path
            - scope_manifest_path
            - scope_digest
            - scope_status
            - overall_confidence
            - critical_unknown_count
            - scope_base_sha
            - resolved_patch_path
            - patch_digest
            - coverage
            - critical_traceability
            - boundary_consistency
            - boundary_conflict
          payload: json_object
        redteam.plan.unresolved:
          required_fields:
            - reason
            - resolution_file_path
          payload: json_object
        redteam.attack.mapped:
          # U1 fix: add `predecessor_event` to required_fields so the
          # runtime schema check rejects emits that omit it.
          # U3 (2026-08-10-002): legal predecessor acceptance is now
          # exercised — the runtime payload_consistency rule below uses
          # `ne` (negative contradiction) rather than the previous
          # inverted `exists:true AND eq` form.
          required_fields:
            - surface_count
            - experiment_count
            - attack_surface_path
            - experiment_plan_path
            - predecessor_event
          payload: json_object
        redteam.complete:
          required_fields:
            - success
            - report_path
            - plan_path
            - questions_path
          payload: json_object
      payload_consistency:
        enabled: true
        rules:
          # 2026-08-10-002 U3 (D5): runtime enforcement of the
          # attack-surface-mapper HARD GATE. The schema declares
          # `predecessor_event` as required; this rule is the
          # negative contradiction — reject when the literal is
          # wrong. Correct literal (`"redteam.plan.resolved"`) →
          # rule Misses → attack.mapped accepted. Missing field →
          # rejected by schema `required_fields`. Wrong value →
          # rejected by this rule's `ne` predicate.
          - id: redteam-attack-mapped-predecessor-must-be-resolved
            topic: redteam.attack.mapped
            when:
              field: predecessor_event
              ne: "redteam.plan.resolved"
            message: "redteam.attack.mapped requires predecessor_event == 'redteam.plan.resolved'; runtime gate rejects attack.mapped emits whose predecessor is missing or has a different value."

mock_responses:
  - text: |
      <event topic="redteam.target.locked">
      {"target_head":"abc1234def5678901234567890abcdef1234567890","target_tree":"def5678901234567890abcdef1234567890abcdef0","plan_count":1,"lock_file_path":".ralph/red-team/01-target-lock.md","lock_status":"locked"}
      </event>
    hat: target-locker
  - text: |
      <event topic="redteam.plan.resolved">
      {"resolved_count":1,"unresolved_count":0,"resolution_file_path":".ralph/red-team/02-plan-resolution.md","scope_manifest_path":".ralph/red-team/scope-manifest.json","scope_digest":"abcd1234ef5678901234567890abcdef1234567890abcdef1234567890abcdef1234567890","scope_status":"resolved","overall_confidence":90,"critical_unknown_count":0,"scope_base_sha":"abc1234def5678901234567890abcdef12345678","resolved_patch_path":".ralph/red-team/patches/full-current.patch","patch_digest":"def7567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1","coverage":92,"critical_traceability":100,"boundary_consistency":true,"boundary_conflict":false}
      </event>
    hat: plan-resolver
  # Chain 1 (MISSING predecessor): attack.mapped WITHOUT
  # predecessor_event. Schema `required_fields` rejects the emit;
  # attack.mapped absent in trace; loop falls through to
  # redteam.complete(success:false) via the plan.unresolved path.
  - text: |
      <event topic="redteam.attack.mapped">
      {"surface_count":1,"experiment_count":1,"attack_surface_path":".ralph/red-team/04-attack-surface.md","experiment_plan_path":".ralph/red-team/05-experiment-plan.md"}
      </event>
    hat: attack-surface-mapper
  # plan.unresolved fires after bounded retry exhaustion (same
  # fallback as redteam_scope_boundary_conflict.yml).
  - text: |
      <event topic="redteam.plan.unresolved">
      {"reason":"REJECTED_NO_RESOLVED_PLAN","resolution_file_path":".ralph/red-team/02-plan-resolution.md"}
      </event>
    hat: plan-resolver
  - text: |
      <event topic="redteam.complete">
      {"success":false,"report_path":".ralph/red-team/REPORT.md","plan_path":"","questions_path":".ralph/red-team/QUESTIONS.md"}
      </event>
    hat: reporter

# U2 (plan 2026-08-15-2211): stage the terminal report file so the
# completion artifact admission gate (which checks `report_path` on the
# redteam.complete schema) has a real file to validate.
fixture_files:
  - path: .ralph/red-team/REPORT.md
    content: |
      # Red-team report (auto-staged fixture for U2 gate)

expected:
  iterations: 5
  events:
    - topic: redteam.target.locked
    - topic: redteam.plan.resolved
    - topic: redteam.complete
  completion: true
  absent_events:
    - topic: redteam.attack.mapped
  payload_matches:
    - topic: redteam.complete
      fields:
        success: false
        plan_path: ""
