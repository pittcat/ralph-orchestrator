# U1 (plan 2026-08-08-004 fix-plan §Unit 1): red-team attack.mapped HARD GATE.
#
# Plan 2026-08-08-004 review: HARD GATE in `presets/en/red-team-attack.yml`
# L473-482 is prompt-text only. This fixture forces the gate to fire at
# runtime via a `payload_consistency` rule requiring
# `predecessor_event == "redteam.plan.resolved"`. Two scenarios chained:
#   1) Reject path: attack-surface-mapper emits `redteam.attack.mapped`
#      WITHOUT `predecessor_event` -> rule fires -> attack.mapped is
#      rejected -> experiment-runner does NOT activate -> redteam.complete
#      unreachable on resolved chain -> loop must surface a rejection
#      (per `on_violation: reject_with_resume`) before redteam.complete.
#   2) (Sibling) Happy path is the existing `redteam_scope_mixed_history`
#      fixture; this file focuses on the reject path that the new rule
#      closes. (Mixed-history fixture ships predecessor_event once the
#      schema/rule is added; otherwise its mock response would also
#      reject.)
#
# Loop walks: target-locker -> plan-resolver (emits
# redteam.plan.resolved) -> attack-surface-mapper (emits
# redteam.attack.mapped WITHOUT predecessor_event) -> gate fires ->
# on_violation=reject_with_resume blocks the event from landing ->
# attack.mapped absent in trace -> redteam.complete reached via
# unresolved path (reporter responds to plan.unresolved from the
# plan-resolver when attack.mapped is rejected for too many rounds).
#
# The plan.unresolved emit by plan-resolver is part of the fixture's
# own redteam.plan.resolved path: the gate fires, the retry budget
# runs out, plan-resolver emits unresolved. This matches the
# existing `redteam_scope_boundary_conflict.yml` precedent (U6).

name: redteam_scope_attack_mapped_gate
description: Red-team attack.mapped HARD GATE — runtime guard rejects when predecessor_event is missing or wrong

config:
  prompt_file: PROMPT.md
  topic_format_whitelist:
    - LOOP_COMPLETE
  max_iterations: 20
  hats:
    target-locker:
      subscribes_to: []
      publishes:
        - redteam.target.locked
    plan-resolver:
      subscribes_to:
        - redteam.target.locked
      publishes:
        - redteam.plan.resolved
        - redteam.plan.unresolved
    attack-surface-mapper:
      subscribes_to:
        - redteam.plan.resolved
      publishes:
        - redteam.attack.mapped
    reporter:
      subscribes_to:
        - redteam.reviewed
        - redteam.plan.unresolved
      publishes:
        - redteam.complete
  event_loop:
    execution_mode: isolated
    starting_event: "redteam.start"
    completion_promise: "redteam.complete"
    required_events:
      - "redteam.target.locked"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        redteam.target.locked:
          required_fields:
            - target_head
            - target_tree
            - plan_count
            - lock_file_path
            - lock_status
          payload: json_object
        redteam.plan.resolved:
          required_fields:
            - resolved_count
            - unresolved_count
            - resolution_file_path
            - scope_manifest_path
            - scope_digest
            - scope_status
            - overall_confidence
            - critical_unknown_count
            - scope_base_sha
            - resolved_patch_path
            - patch_digest
            - coverage
            - critical_traceability
            - boundary_consistency
            - boundary_conflict
          payload: json_object
        redteam.plan.unresolved:
          required_fields:
            - reason
            - resolution_file_path
          payload: json_object
        redteam.attack.mapped:
          # U1 fix: add `predecessor_event` to required_fields so the
          # runtime schema check rejects emits that omit it.
          required_fields:
            - surface_count
            - experiment_count
            - attack_surface_path
            - experiment_plan_path
            - predecessor_event
          payload: json_object
        redteam.complete:
          required_fields:
            - success
            - report_path
            - plan_path
            - questions_path
          payload: json_object
      payload_consistency:
        enabled: true
        rules:
          # U1 fix: redteam.attack.mapped must carry a
          # predecessor_event whose value references a prior accepted
          # redteam.plan.resolved event. The string check
          # (`predecessor_event == "redteam.plan.resolved"`) closes
          # the prompt-text-only HARD GATE bypass surface.
          - id: redteam-attack-mapped-requires-predecessor
            topic: redteam.attack.mapped
            when:
              all:
                - {field: predecessor_event, exists: true}
                - {field: predecessor_event, eq: "redteam.plan.resolved"}
            message: "redteam.attack.mapped requires predecessor_event == 'redteam.plan.resolved'; runtime gate rejects attack.mapped emits without a bound prior plan.resolved event."

mock_responses:
  - text: |
      <event topic="redteam.target.locked">
      {"target_head":"abc1234def5678901234567890abcdef1234567890","target_tree":"def5678901234567890abcdef1234567890abcdef0","plan_count":1,"lock_file_path":".ralph/red-team/01-target-lock.md","lock_status":"locked"}
      </event>
    hat: target-locker
  - text: |
      <event topic="redteam.plan.resolved">
      {"resolved_count":1,"unresolved_count":0,"resolution_file_path":".ralph/red-team/02-plan-resolution.md","scope_manifest_path":".ralph/red-team/scope-manifest.json","scope_digest":"abcd1234ef5678901234567890abcdef1234567890abcdef1234567890abcdef1234567890","scope_status":"resolved","overall_confidence":90,"critical_unknown_count":0,"scope_base_sha":"abc1234def5678901234567890abcdef1234567890","resolved_patch_path":".ralph/red-team/patches/full-current.patch","patch_digest":"def7567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1","coverage":92,"critical_traceability":100,"boundary_consistency":true,"boundary_conflict":false}
      </event>
    hat: plan-resolver
  # attack.mapped WITHOUT predecessor_event -> U1 rule
  # redteam-attack-mapped-requires-predecessor fires -> attack.mapped
  # is rejected. The runtime reschedules (reject_with_resume); once
  # the bounded retry budget is exhausted, plan-resolver emits
  # redteam.plan.unresolved, which the reporter catches to land
  # redteam.complete.
  - text: |
      <event topic="redteam.attack.mapped">
      {"surface_count":1,"experiment_count":1,"attack_surface_path":".ralph/red-team/04-attack-surface.md","experiment_plan_path":".ralph/red-team/05-experiment-plan.md"}
      </event>
    hat: attack-surface-mapper
  # Plan-resolver emits unresolved after the bounded retry exhausts
  # (this is the same fallback the existing
  # redteam_scope_boundary_conflict.yml uses for U6).
  - text: |
      <event topic="redteam.plan.unresolved">
      {"reason":"REJECTED_NO_RESOLVED_PLAN","resolution_file_path":".ralph/red-team/02-plan-resolution.md"}
      </event>
    hat: plan-resolver
  - text: |
      <event topic="redteam.complete">
      {"success":false,"report_path":".ralph/red-team/REPORT.md","plan_path":"","questions_path":".ralph/red-team/QUESTIONS.md"}
      </event>
    hat: reporter

expected:
  iterations: 5
  events:
    - topic: redteam.target.locked
    - topic: redteam.plan.resolved
    - topic: redteam.complete
  completion: true
  absent_events:
    - topic: redteam.attack.mapped
  payload_matches:
    - topic: redteam.complete
      fields:
        success: false
        plan_path: ""
