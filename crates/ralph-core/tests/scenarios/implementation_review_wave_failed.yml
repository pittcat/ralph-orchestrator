# 2026-07-26-003 plan U6: review.wave.failed → finalizer → LOOP_COMPLETE blocked.
#
# Outside-In BDD: confirm the failure path lands `review.wave.failed`
# on `finalizer` (NOT `review-synthesizer` — the primary-20260726
# incident root cause), and that `finalizer` emits exactly one
# `LOOP_COMPLETE` with no synthesizer / fix-planner in between. The
# `absent_events` guarantee locks the S7 / AE5 acceptance contract:
# `review.synthesized` / `review.wave.complete` must NOT appear when
# the wave goes down the failed path.

name: implementation_review_wave_failed
description: review.wave.failed → finalizer → LOOP_COMPLETE blocked (no synthesizer detour)

config:
  prompt_file: PROMPT.md
  topic_format_whitelist:
    - LOOP_COMPLETE
  max_iterations: 12
  hats:
    scope-preparer:
      subscribes_to:
        - review.start
      publishes:
        - scope.ready
        - scope.blocked
    review-dispatcher:
      subscribes_to:
        - scope.ready
      publishes:
        - review.unit.ready
    review-worker:
      subscribes_to:
        - review.unit.ready
      publishes:
        - review.unit.done
      concurrency: 6
    wave-runtime:
      # Stand-in for the runtime / supervisor that injects the
      # coordination topic. In a real preset, only the supervisor
      # can publish `review.wave.failed`; here the stand-in simply
      # models the inject semantics so the EventLoop's hat-selection
      # + payload gate is exercised end-to-end.
      subscribes_to:
        - review.unit.done
      publishes:
        - review.wave.complete
        - review.wave.failed
    review-synthesizer:
      subscribes_to:
        - review.wave.complete
      publishes:
        - review.synthesized
        - review.blocked
    fix-planner:
      subscribes_to:
        - review.synthesized
      publishes:
        - fix.plan.ready
    finalizer:
      subscribes_to:
        - fix.plan.ready
        - scope.blocked
        - review.blocked
        - review.wave.failed
      publishes:
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "review.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: []
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        scope.ready:
          required_fields:
            - plan_name
            - scope_digest
            - patch_path
            - patch_digest
            - scope_manifest_path
            - review_head_sha
          payload: json_object
        review.unit.ready:
          required_fields:
            - plan_name
            - dimension
            - slot_index
          payload: json_object
        review.unit.done:
          required_fields:
            - plan_name
            - dimension
            - findings_count
            - findings_file
          payload: json_object
        review.wave.failed:
          required_fields:
            - wave_id
            - missing_dimensions
            - reason
          payload: json_object
        LOOP_COMPLETE:
          required_fields:
            - reason
          payload: json_object

mock_responses:
  - text: |
      <event topic="scope.ready">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_path":".ralph/review/demo-plan/review.diff.patch","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","scope_manifest_path":".ralph/review/demo-plan/scope-manifest.json","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","first_implementation_commit_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","resolved_baseline_sha":"cccccccccccccccccccccccccccccccccccccccc","dirty_verdict":"clean"}
      </event>
    hat: scope-preparer
  - text: |
      <event topic="review.unit.ready">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_path":".ralph/review/demo-plan/review.diff.patch","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","scope_manifest_path":".ralph/review/demo-plan/scope-manifest.json","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","first_implementation_commit_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","resolved_baseline_sha":"cccccccccccccccccccccccccccccccccccccccc","slot_index":0,"dimension":"goal-alignment","idempotency_payload_version":1}
      </event>
    hat: review-dispatcher
  - text: |
      <event topic="review.unit.done">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","dimension":"goal-alignment","slot_index":0,"findings_count":0,"findings_file":".ralph/review/demo-plan/dimensions/goal-alignment.md","handoff_precheck_failed":false}
      </event>
    hat: review-worker
  - text: |
      <event topic="review.wave.failed">
      {"wave_id":"wave-demo-1","missing_dimensions":["correctness","testing","security","maintainability","performance"],"reason":"worker_timeout"}
      </event>
    hat: wave-runtime
  - text: waiting.
  - text: |
      <event topic="LOOP_COMPLETE">
      {"reason":"implementation-review wave-failed scenario"}
      </event>
    hat: finalizer

expected:
  iterations: 6
  events:
    - topic: scope.ready
    - topic: review.unit.ready
    - topic: review.unit.done
    - topic: review.wave.failed
    - topic: LOOP_COMPLETE
  absent_events:
    # S7 / AE5: the failure path must NOT trigger the
    # success-side chain — the synthesizer must NOT activate
    # and no fix-planner intermediate should ever publish.
    - topic: review.wave.complete
    - topic: review.synthesized
    - topic: review.blocked
    - topic: fix.plan.ready
    - topic: scope.blocked
  completion: true
