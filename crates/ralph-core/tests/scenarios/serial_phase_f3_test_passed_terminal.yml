# 2026-07-02-006 FV1: F3 terminal path (AE1)

name: serial_phase_f3_test_passed_terminal
description: Phase engine at plan_end rejects review.start and accepts plan.complete

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  event_loop:
    execution_mode: isolated
    mechanism:
      phase_authority:
        enabled: true
        initial_phase: plan_end
        phases:
          - id: plan_end
            allowed_emits:
              coordinator: [plan.complete, plan.blocked]
        transitions: []
  hats:
    coordinator:
      subscribes_to: []
      publishes: [plan.complete, review.start]
      default_publishes: plan.complete

mock_responses:
  - text: |
      <event topic="review.start">
      {"plan_id":"phase-f3","plan_name":"phase-f3","task_id":"t1"}
      </event>
    hat: coordinator
  - text: |
      <event topic="plan.complete">
      {"plan_name":"phase-f3","task_id":"t1","task_key":"k1","step":"fix-02","completed_steps":["fix-01","fix-02"],"verdict":"pass","final_findings_count":0,"fix_round":0}
      </event>
    hat: coordinator
  - text: |
      waiting.

expected:
  iterations: 3
  absent_events:
    - topic: review.start
  events:
    - topic: plan.complete
  completion: false
