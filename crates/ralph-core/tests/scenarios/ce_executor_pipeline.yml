# ce_executor_pipeline: linear one-shot plan execution end-to-end
#
# 2026-07-02-003 plan U2: extends the 2026-07-02-003 U1 BDD to
# the full 12-hat flat single-consumer chain
# (plan-reviewer → executor → 6 dim hats → review-synthesizer →
# fixer → alignment → reporter → LOOP_COMPLETE), replacing the
# coordinator-driven multi-unit walk of ce-executor-serial with
# a flat serial chain.
#
# Wire-level chain (single plan, whole-plan execution, no fix round):
#   work.start → plan.ready → work.done
#     → review.goalalign.done → review.correctness.done
#     → review.testing.done → review.maintainability.done
#     → review.standards.done → review.adversarial.done
#     → review.complete → fix.done → align.done
#     → report.done → LOOP_COMPLETE
#
# Asserts: 6 review.*.done events (one per dimension), review.complete,
# fix.done, align.done, report.done, LOOP_COMPLETE in order. No
# plan-gate, no coordinator loop, no review.dimension.* (the
# ce-executor-serial terminology is intentionally NOT used here).

name: ce_executor_pipeline
description: Linear one-shot plan execution for ce-executor-pipeline preset — plan-reviewer → executor → 6 dim hats → synthesizer → fixer → alignment → reporter → LOOP_COMPLETE

config:
  prompt_file: PROMPT.md
  max_iterations: 30
  hats:
    plan-reviewer:
      subscribes_to:
        - work.start
      publishes:
        - plan.ready
        - plan.blocked
    executor:
      subscribes_to:
        - plan.ready
      publishes:
        - work.done
        - work.failed
    "dim:goal-alignment":
      subscribes_to:
        - work.done
      publishes:
        - review.goalalign.done
    "dim:correctness":
      subscribes_to:
        - review.goalalign.done
      publishes:
        - review.correctness.done
    "dim:testing":
      subscribes_to:
        - review.correctness.done
      publishes:
        - review.testing.done
    "dim:maintainability":
      subscribes_to:
        - review.testing.done
      publishes:
        - review.maintainability.done
    "dim:project-standards":
      subscribes_to:
        - review.maintainability.done
      publishes:
        - review.standards.done
    "dim:adversarial":
      subscribes_to:
        - review.standards.done
      publishes:
        - review.adversarial.done
    review-synthesizer:
      subscribes_to:
        - review.adversarial.done
      publishes:
        - review.complete
    fixer:
      subscribes_to:
        - review.complete
      publishes:
        - fix.done
    alignment:
      subscribes_to:
        - fix.done
      publishes:
        - align.done
    reporter:
      subscribes_to:
        - align.done
        - plan.blocked
        - work.failed
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        plan.ready:
          required_fields:
            - plan_name
            - plan_path
            - plan_revised
            - review_summary
          payload: json_object
        plan.blocked:
          required_fields:
            - plan_name
            - reason
          payload: json_object
        work.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - tests_run
            - tests_passed
            - changed_lines
            - commit_count
          payload: json_object
        work.failed:
          required_fields:
            - plan_name
            - reason
          payload: json_object
        review.goalalign.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - dimension
            - findings_file
            - findings_count
          payload: json_object
        review.correctness.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - dimension
            - findings_file
            - findings_count
          payload: json_object
        review.testing.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - dimension
            - findings_file
            - findings_count
          payload: json_object
        review.maintainability.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - dimension
            - findings_file
            - findings_count
          payload: json_object
        review.standards.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - dimension
            - findings_file
            - findings_count
          payload: json_object
        review.adversarial.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - dimension
            - findings_file
            - findings_count
          payload: json_object
        review.complete:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - fix_plan_file
            - findings_count
            - p0_count
            - p1_count
            - findings_summary
            - verdict
          payload: json_object
        fix.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - fix_plan_file
            - review_verdict
            - fixes_applied
            - fixes_skipped
          payload: json_object
        align.done:
          required_fields:
            - plan_name
            - plan_path
            - executor_head_sha
            - fix_plan_file
            - review_verdict
            - plan_executed
            - fix_plan_executed
            - residuals_count
            - residuals_summary
          payload: json_object
        report.done:
          required_fields:
            - plan_name
            - report_path
            - verdict
          payload: json_object
        LOOP_COMPLETE:
          required_fields:
            - reason
          payload: json_object

mock_responses:
  # 0. plan-reviewer reviews plan, in-place edits, emits plan.ready
  - text: |
      <event topic="plan.ready">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","plan_revised":true,"review_summary":"plan reviewed and tightened"}
      </event>
    hat: plan-reviewer
  # 1. executor completes whole-plan execution (TDD + full suite green)
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","tests_run":12,"tests_passed":12,"changed_lines":85,"commit_count":3}
      </event>
    hat: executor
  # 2. dim:goal-alignment completes
  - text: |
      <event topic="review.goalalign.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","dimension":"goal-alignment","findings_file":".ralph/review/plan-p/goal-alignment.md","findings_count":0}
      </event>
    hat: "dim:goal-alignment"
  # 3. dim:correctness completes
  - text: |
      <event topic="review.correctness.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","dimension":"correctness","findings_file":".ralph/review/plan-p/correctness.md","findings_count":1}
      </event>
    hat: "dim:correctness"
  # 4. dim:testing completes
  - text: |
      <event topic="review.testing.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","dimension":"testing","findings_file":".ralph/review/plan-p/testing.md","findings_count":0}
      </event>
    hat: "dim:testing"
  # 5. dim:maintainability completes
  - text: |
      <event topic="review.maintainability.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","dimension":"maintainability","findings_file":".ralph/review/plan-p/maintainability.md","findings_count":2}
      </event>
    hat: "dim:maintainability"
  # 6. dim:project-standards completes
  - text: |
      <event topic="review.standards.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","dimension":"project-standards","findings_file":".ralph/review/plan-p/standards.md","findings_count":0}
      </event>
    hat: "dim:project-standards"
  # 7. dim:adversarial completes (last dim, triggers synthesizer)
  - text: |
      <event topic="review.adversarial.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","dimension":"adversarial","findings_file":".ralph/review/plan-p/adversarial.md","findings_count":0}
      </event>
    hat: "dim:adversarial"
  # 8. review-synthesizer aggregates and emits review.complete
  - text: |
      <event topic="review.complete">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","fix_plan_file":".ralph/review/plan-p/fix-plan.md","findings_count":3,"p0_count":0,"p1_count":1,"findings_summary":"1 P1 from correctness, 2 P3 from maintainability","verdict":"pass_with_residuals"}
      </event>
    hat: review-synthesizer
  # 9. fixer applies the synthesizer fix plan (not the original plan)
  - text: |
      <event topic="fix.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","fix_plan_file":".ralph/review/plan-p/fix-plan.md","review_verdict":"pass_with_residuals","fixes_applied":1,"fixes_skipped":2}
      </event>
    hat: fixer
  # 10. alignment cross-checks original plan vs fix-plan execution
  - text: |
      <event topic="align.done">
      {"plan_name":"plan-p","plan_path":"docs/plans/p.md","executor_head_sha":"aabbccddaabbccddaabbccddaabbccddaabbccdd","fix_plan_file":".ralph/review/plan-p/fix-plan.md","review_verdict":"pass_with_residuals","plan_executed":true,"fix_plan_executed":true,"residuals_count":2,"residuals_summary":"2 P3 maintainability findings not applied (deferred)"}
      </event>
    hat: alignment
  # 11. reporter emits report.done
  - text: |
      <event topic="report.done">
      {"plan_name":"plan-p","report_path":".ralph/review/plan-p/report.md","verdict":"pass_with_residuals"}
      </event>
    hat: reporter
  # 12. reporter emits LOOP_COMPLETE (separate turn for clean completion)
  - text: |
      <event topic="LOOP_COMPLETE">
      {"reason":"plan execution complete with 2 residuals"}
      </event>
    hat: reporter

expected:
  iterations: 13
  events:
    - topic: plan.ready
    - topic: work.done
    # 6-dim flat serial chain
    - topic: review.goalalign.done
    - topic: review.correctness.done
    - topic: review.testing.done
    - topic: review.maintainability.done
    - topic: review.standards.done
    - topic: review.adversarial.done
    - topic: review.complete
    - topic: fix.done
    - topic: align.done
    - topic: report.done
  absent_events:
    # ce-executor-serial terminology must NOT appear (no coordinator walk)
    - topic: review.start
    - topic: review.dimension.ready
    - topic: review.dimension.done
    - topic: review.dimensions.complete
    - topic: test.passed
    - topic: test.failed
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    # Failure events must be absent on happy path
    - topic: plan.blocked
    - topic: work.failed
    - topic: queue.advance
  completion: true
