# 2026-06-29-007 U7: 终态 guard + LOOP_COMPLETE 显式 emit
#
# BDD 覆盖:TerminalStateGuardStage 在 flow_phase = Closed/Failed
# 时拒绝 review.dimension.* / work.ready 等业务事件,
# 但 LOOP_COMPLETE 不在 reject 集合,继续放行让 event_loop
# 显式 LOOP_COMPLETE 终结 run。单测在 terminal_state_guard_stage::tests
# 已覆盖核心逻辑;此 scenario 是 integration 冒烟。
#
# 期望:happy path 完整跑通,无 flow_state_closed 出现。

name: u7_terminal_state_guard
description: U7 - TerminalStateGuard 在 happy path 不破坏既有流

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    coordinator:
      subscribes_to:
        - work.done
      publishes:
        - plan.complete
      default_publishes: plan.complete

mock_responses:
  - |
    <event topic="work.done">
    plan_name: "u7-demo"
    step: "step-01"
    task_id: "u7-task"
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "u7-demo"
    verdict: pass
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 3
  events:
    - topic: work.done
    - topic: plan.complete
  absent_events:
    - topic: plan.blocked
  recovery_absent:
    - "flow_state_closed"
  completion: false