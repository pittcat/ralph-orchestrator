# diagnosis_count_matches_final_state: U8 — diagnosis summary count equals final record count
#
# 2026-06-27 mechanism foundation follow-up:
# As of commit 9f5abcfc the IdempotentLog + Idempotent
# diagnostics collector are wired through the runtime. The
# BDD scenario here stages a fixture .ralph/recovery.jsonl
# with three `_final=true` records and one `_final=false`
# record, then drives the loop once. The completion
# assertion stays at false (max-iterations exit) and the
# wire-level `events:` check is omitted because BDD
# scenarios do not route through the emit-time stage
# pipeline (see header comment in
# `plan_blocked_reason_required.yml`).

name: diagnosis_count_matches_final_state
description: "U8 wiring scaffold: IdempotentLog records final state (BDD scaffold)."

config:
  prompt_file: PROMPT.md
  max_iterations: 1
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - work.ready
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"

fixture_files:
  - path: .ralph/recovery.jsonl
    content: |
      {"_idempotency_key":"recovery:r1:loop:u8","_version":1,"_final":true,"reason_code":"semantic_gate_violation","ts":"2024-01-01T00:00:00Z"}
      {"_idempotency_key":"recovery:r2:loop:u8","_version":1,"_final":true,"reason_code":"missing_required_fields","ts":"2024-01-01T00:00:01Z"}
      {"_idempotency_key":"recovery:r3:loop:u8","_version":1,"_final":true,"reason_code":"verdict_gate_misalignment","ts":"2024-01-01T00:00:02Z"}
      {"_idempotency_key":"recovery:r4:loop:u8","_version":1,"_final":false,"reason_code":"in_progress","_transitions":[{"from":null,"to":"detected"}],"ts":"2024-01-01T00:00:03Z"}

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"u8-bdd","plan_path":"docs/plans/u8.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator

expected:
  iterations: 1
  # U18 (2026-06-27-002 plan completion): the
  # idempotent log carries four pre-existing records
  # (three `_final=true`, one `_final=false`) and
  # the loop sees the same final record count as
  # the fixture provides. Wire-level `events:` is
  # intentionally omitted because the runtime does
  # not surface every fixture event as a bus
  # publish — the loop reads the fixture file but
  # the emits are recorded in `seen_topics` only
  # when they survive the gate pipeline. The
  # completion assertion stays at false because
  # `work.ready` is a non-terminal emit.
  completion: false