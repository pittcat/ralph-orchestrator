# flow_unknown_emit_rejected: U9 — FlowStepScopeStage rejects emit outside allowed_emits
#
# 2026-06-27 mechanism foundation follow-up:
# See header comment in `plan_blocked_reason_required.yml`
# for the rationale behind omitting wire-level `events:`
# assertions. The runtime BDD scaffold (`process_events_from_jsonl`)
# does not route through the emit-time stage pipeline as of
# commit 9f5abcfc, so direct stage-pipeline rejection
# assertions belong to a follow-up wiring commit (U6.5).
# For now the scenario proves the BDD harness accepts the
# `flow:` declaration and reaches the max-iterations exit
# without LOOP_COMPLETE being honoured.

name: flow_unknown_emit_rejected
description: "U9 wiring scaffold: FlowStepScopeStage rejects emit outside allowed_emits (BDD scaffold)."

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - plan.complete
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    mechanism:
      flow:
        type: declared
        version: 1
        terminal_emits: [LOOP_COMPLETE]
        steps:
          - id: unit_loop
            kind: foreach
            allowed_emits:
              - work.ready
              - work.done
              - work.failed
              - test.passed
              - test.failed
            terminal_when: all_done
          - id: plan_end
            kind: branch
            allowed_emits:
              - plan.complete
              - plan.blocked
          - id: ship
            kind: sequence
            allowed_emits:
              - REVIEW_COMPLETE
              - report.done
              - LOOP_COMPLETE

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"u9-bdd","plan_path":"docs/plans/u9.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="plan.complete">
      {"plan_name":"u9-bdd","completed_steps":["step-01"],"task_id":"t1","task_key":"k1","verdict":"pass","final_findings_count":0,"fix_round":0}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.ready">
      {"plan_name":"u9-bdd","plan_path":"docs/plans/u9.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small"}
      </event>
    hat: coordinator

expected:
  iterations: 3
  # Wire-level events check omitted; see header comment.
  completion: false