# repair_budget_exhausted_blocks_plan: U7 — repair budget gate escalates to plan.blocked
#
# 2026-06-28 mechanism foundation review (P1-1 / P2-3):
# The header used to claim the BDD runner bypasses the
# stage pipeline. That is stale — `evaluate_emit_gate_for_jsonl_event`
# is called from `process_parse_result` for every
# event. After the P1-1 wiring (`record_stage_rejection`
# synthesises `plan.blocked` on `repair_unrecoverable_after_*`),
# the recovery envelope contains the budget exhaustion
# reason and a `plan.blocked` lands on the main bus.

name: repair_budget_exhausted_blocks_plan
description: "U7 wiring scaffold: repair budget escalation (BDD scaffold)."

config:
  prompt_file: PROMPT.md
  max_iterations: 5
  hats:
    progress-steward:
      subscribes_to:
        - work.start
      publishes:
        - task.relocate_legacy
        - plan.blocked
    shipper:
      subscribes_to:
        - plan.blocked
      publishes:
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"u7-bdd","plan_path":"docs/plans/u7.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_1"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_2"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_3"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_4"}
      </event>
    hat: progress-steward

expected:
  iterations: 5
  # P1-1 (2026-06-28 review): the budget-exhausted
  # rejection is recorded as a recovery envelope with
  # the `repair_unrecoverable_after_*` reason code, AND
  # `record_stage_rejection` synthesises a `plan.blocked`
  # on the main bus so the operator does not have to
  # grep recovery.jsonl to discover the budget state.
  recovery_contains:
    - "repair_unrecoverable_after"
  completion: false