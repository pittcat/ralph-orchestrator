# repair_budget_exhausted_blocks_plan: U7 — repair budget gate escalates to plan.blocked
#
# 2026-06-27 mechanism foundation follow-up:
# Wire-level `events:` / `absent_events:` assertions are
# omitted because the BDD scenario runner uses
# `process_events_from_jsonl`, which does NOT route through
# the emit-time stage pipeline as of commit 9f5abcfc (see
# header comment in `plan_blocked_reason_required.yml`).
# The mock still exercises four `task.relocate_legacy`
# emits to simulate budget exhaustion; the scenario proves
# the harness accepts the topology and the loop reaches
# max-iterations without LOOP_COMPLETE.

name: repair_budget_exhausted_blocks_plan
description: "U7 wiring scaffold: repair budget escalation (BDD scaffold)."

config:
  prompt_file: PROMPT.md
  max_iterations: 5
  hats:
    progress-steward:
      subscribes_to:
        - work.start
      publishes:
        - task.relocate_legacy
        - plan.blocked
    shipper:
      subscribes_to:
        - plan.blocked
      publishes:
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"u7-bdd","plan_path":"docs/plans/u7.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_1"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_2"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_3"}
      </event>
    hat: progress-steward
  - text: |
      <event topic="task.relocate_legacy">
      {"task_key":"k1","task_key_prefix":"u7-bdd","target_loop_id":"loop-u7","reason":"legacy_relocate_attempt_4"}
      </event>
    hat: progress-steward

expected:
  iterations: 5
  # U15 (2026-06-27-002 plan completion): after the
  # publish-time gate is wired (U3/U7), repair topics
  # survive `accepted_events` (so the lifecycle tracker
  # still records them) but are routed to the
  # `<workspace>/recovery.jsonl` U6 sink via the
  # `AcceptRepairStream` path. The bus never receives
  # them. The pre-U3 `absent_events: [task.relocate_legacy]`
  # assertion is retired because the invariant it pinned
  # (the event not even appearing in the loop's event
  # list) no longer holds. The U6 sink contract is
  # verified by the loop_runner integration test
  # `u7_repair_sink_wiring.rs`.
  completion: false