# plan_blocked_reason_required: U6 — emit-time schema gate rejects plan.blocked with empty `reason`
#
# 2026-06-28 mechanism foundation review (P1-2 / P2-3):
# The header used to claim the BDD runner does not route
# through the emit-time stage pipeline. That is stale —
# `evaluate_emit_gate_for_jsonl_event` (event_loop/mod.rs)
# IS called from `process_parse_result` for every JSONL
# event. The wire-level assertion is therefore restored
# at the recovery-envelope layer: the empty-reason
# `plan.blocked` event is rejected before reaching the
# bus and the rejection is recorded in the session's
# `recovery.jsonl` with `reason_code: missing_required_fields`.

name: plan_blocked_reason_required
description: "U14 wiring: stage pipeline rejects plan.blocked with empty reason."

config:
  prompt_file: PROMPT.md
  max_iterations: 2
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - plan.blocked
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"u14-bdd","plan_path":"docs/plans/u14.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="plan.blocked">
      {"reason":""}
      </event>
    hat: coordinator

expected:
  iterations: 2
  # P1-2 (2026-06-28 review): the wire-level assertion
  # is restored. The schema gate rejects the
  # empty-reason `plan.blocked` BEFORE it reaches the
  # bus, so we assert the rejection was actually
  # recorded via the recovery envelope channel
  # rather than `absent_events` (the
  # `AcceptMainBus` arm of
  # `evaluate_emit_gate_for_jsonl_event` admits the
  # event to `seen_topics` for lifecycle tracking,
  # so absent_events checks against `seen_topics`
  # would be a false positive).
  recovery_contains:
    - "missing_required_fields"
  completion: false