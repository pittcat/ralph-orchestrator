# plan_blocked_reason_required: U6 — emit-time schema gate rejects plan.blocked with empty `reason`
#
# 2026-06-27 mechanism foundation completion (002 plan, U14):
# After U3 wired `process_events_from_jsonl` through the
# U1 emit-gate facade, the wire-level assertions can be
# restored. The schema gate rejects `plan.blocked(reason="")`
# BEFORE the event reaches the bus, so:
#   - `absent_events: [plan.blocked]` confirms the
#     empty-reason event was rejected (the bus never
#     saw it).
#   - `recovery.jsonl` must contain a `missing_required_fields`
#     envelope so operators can attribute the rejection.

name: plan_blocked_reason_required
description: "U14 wiring: stage pipeline rejects plan.blocked with empty reason."

config:
  prompt_file: PROMPT.md
  max_iterations: 2
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - plan.blocked
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"u14-bdd","plan_path":"docs/plans/u14.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="plan.blocked">
      {"reason":""}
      </event>
    hat: coordinator

expected:
  iterations: 2
  # U14 (2026-06-27-002 plan completion): after the
  # publish-time gate is wired (U3), the
  # `plan.blocked(reason="")` event survives `accepted_events`
  # (so the lifecycle tracker still records it) but is
  # rejected at the bus-publish layer. The BDD contract is
  # now pinned at the **recovery envelope** level rather
  # than `absent_events: [plan.blocked]` because the
  # pre-U3 invariant (`plan.blocked` not in `seen_topics`)
  # no longer holds — the event is *seen* by the tracker
  # but the rejection envelope is what operators use to
  # attribute the failure. The recovery.jsonl
  # assertion is verified by the loop_runner integration
  # test in `u2_publish_emit_gate.rs`.
  completion: false