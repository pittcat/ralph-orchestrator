# plan_blocked_reason_required: U6 — emit-time schema gate rejects plan.blocked with empty `reason`
#
# 2026-06-27 mechanism foundation follow-up:
# This scenario asserts the *intent* of the U6 schema gate
# (a `plan.blocked` event with an empty `reason` must not be
# silently accepted into the main bus), but the assertion
# surface is limited by the runtime wiring as of
# commit 9f5abcfc:
#   - `publish_event` runs the stage pipeline (U6 wiring done).
#   - `process_events_from_jsonl` (used by BDD scenarios)
#     does NOT yet route through the stage pipeline.
#   - `seen_topics` only tracks hat-emit events, not JSONL
#     ingest.
# Therefore the wire-level `events:` / `absent_events:`
# assertions are intentionally omitted; we instead rely on
# `assert_state.rejection_log_contains_reason_code` once the
# pipeline is wired through (see U6.5 follow-up). For now,
# the scenario is a placeholder proving the BDD scaffold
# compiles and the loop completes with the expected topology.

name: plan_blocked_reason_required
description: "U6 wiring: stage pipeline rejects plan.blocked with empty reason (BDD scaffold)."

config:
  prompt_file: PROMPT.md
  max_iterations: 2
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - plan.blocked
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"u6-bdd","plan_path":"docs/plans/u6.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="plan.blocked">
      {"reason":""}
      </event>
    hat: coordinator

expected:
  iterations: 2
  # Wire-level event assertions are intentionally omitted;
  # see header comment for rationale. Completion stays at
  # false because the loop terminates via max_iterations
  # without the coordinator hat reaching LOOP_COMPLETE.
  completion: false