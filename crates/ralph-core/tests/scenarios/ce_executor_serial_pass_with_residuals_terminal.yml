# 2026-07-02-005 BDD-1: pass_with_residuals terminal path
#
# Plan 2026-07-02-005 Final Verification BDD-1: 覆盖
# `ce-executor-serial` 终态收口的 pass_with_residuals 路径
# (140149 root cause):
#
#   work.start → plan.ready (step-01)
#     → work.done (step-01) → queue.advance (step-01 → step-02)
#     → work.done (step-02) → plan.complete (verdict=pass_with_residuals,
#       completed_steps=[step-01, step-02])
#     → REVIEW_COMPLETE (pass)
#     → report.done
#     → LOOP_COMPLETE
#
# BP0-1 修复:plan.complete(payload.completed_steps) 经 U1
# progress gate (Current Step=None + completed_steps 全部在
# snapshot) 放行;U2 plan-level terminal 已置位;U5/U6
# 接线无 false reject;最终 LOOP_COMPLETE 仅一次 (U12 拒绝
# 重复 emit)。

name: ce_executor_serial_pass_with_residuals_terminal
description: ce-executor-serial pass_with_residuals 路径 — plan.complete 入账 → REVIEW_COMPLETE(pass) → report.done → LOOP_COMPLETE ×1 (140149 修复)

config:
  prompt_file: PROMPT.md
  max_iterations: 16
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - plan.ready
        - plan.blocked
        - plan.complete
    executor:
      subscribes_to:
        - plan.ready
      publishes:
        - work.done
        - work.failed
        - queue.advance
    review-synthesizer:
      subscribes_to:
        - work.done
      publishes:
        - review.complete
        - review.passed
    shipper:
      subscribes_to:
        - plan.complete
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE
mock_responses:
  # 1) coordinator → plan.ready(step-01)
  - |
    <event topic="plan.ready">
    plan_name: "pwr-demo"
    step: "step-01"
    task_id: "pwr-task-01"
    task_key: "ce-executor:pwr-demo:step-01:u1-impl"
    complexity: "small"
    </event>
  # 2) executor → work.done(step-01)
  - |
    <event topic="work.done">
    plan_name: "pwr-demo"
    step: "step-01"
    task_id: "pwr-task-01"
    task_key: "ce-executor:pwr-demo:step-01:u1-impl"
    </event>
  # 3) coordinator → queue.advance(step-01 → step-02)
  - |
    <event topic="queue.advance">
    plan_name: "pwr-demo"
    completed_step: "step-01"
    next_step: "step-02"
    reviewed_task_id: "pwr-task-01"
    reviewed_task_key: "ce-executor:pwr-demo:step-01:u1-impl"
    </event>
  # 4) coordinator → plan.ready(step-02)
  - |
    <event topic="plan.ready">
    plan_name: "pwr-demo"
    step: "step-02"
    task_id: "pwr-task-02"
    task_key: "ce-executor:pwr-demo:step-02:u2-impl"
    complexity: "small"
    </event>
  # 5) executor → work.done(step-02)
  - |
    <event topic="work.done">
    plan_name: "pwr-demo"
    step: "step-02"
    task_id: "pwr-task-02"
    task_key: "ce-executor:pwr-demo:step-02:u2-impl"
    </event>
  # 6) review-synthesizer → review.complete(plan-level pass_with_residuals)
  # fix_plan_file=null/empty → U2 plan-level terminal recorded.
  - |
    <event topic="review.complete">
    plan_name: "pwr-demo"
    task_id: "pwr-finalize"
    task_key: "ce-executor:pwr-demo:finalize:u-synth"
    step: "finalize"
    verdict: "pass_with_residuals"
    final_findings_count: 3
    fix_plan_file: ""
    </event>
  # 7) coordinator → plan.complete (BP0-1: 之前被拒 4 次;
  # U1 payload.completed_steps + U2 plan terminal 联合放行)
  - |
    <event topic="plan.complete">
    plan_name: "pwr-demo"
    completed_steps: ["step-01", "step-02"]
    task_id: "pwr-task-02"
    task_key: "ce-executor:pwr-demo:step-02:u2-impl"
    step: "step-02"
    verdict: "pass_with_residuals"
    </event>
  # 8) shipper → REVIEW_COMPLETE(pass)
  - |
    <event topic="REVIEW_COMPLETE">
    plan_name: "pwr-demo"
    verdict: "pass_with_residuals"
    pass_or_fail: "pass"
    residual_findings_summary: "all units passed with 3 residuals"
    </event>
  # 9) reporter → report.done
  - |
    <event topic="report.done">
    plan_name: "pwr-demo"
    report_path: ".ralph/agent/reports/pwr-demo.md"
    awaiting_decision: false
    </event>
  # 10) reporter → LOOP_COMPLETE (唯一一次,U12 honor 后拒收重复)
  - |
    <event topic="LOOP_COMPLETE">
    plan_name: "pwr-demo"
    reason: "all_units_done"
    </event>
  # 11) reporter → 错发 2nd LOOP_COMPLETE — U12 必须 reject
  - |
    <event topic="LOOP_COMPLETE">
    plan_name: "pwr-demo"
    reason: "all_units_done"
    </event>
  # 12) reporter → 错发 report.done — U12 必须 reject
  - |
    <event topic="report.done">
    plan_name: "pwr-demo"
    report_path: ".ralph/agent/reports/pwr-demo-dup.md"
    awaiting_decision: false
    </event>

expected:
  iterations: 12
  events:
    - topic: plan.ready
    - topic: work.done
    - topic: queue.advance
    - topic: plan.ready
    - topic: work.done
    - topic: review.complete
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    - topic: report.done
  absent_events:
    - topic: plan.blocked
    - topic: work.failed
  completion: true
