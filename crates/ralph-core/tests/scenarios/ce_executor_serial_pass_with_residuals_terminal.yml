# 2026-07-02-005 BDD-1: pass_with_residuals terminal path (gate-enabled)
#
# Exercises production gate stack: state_projection + event_policy +
# U1/U2/U5/U6 wiring + U12 completion_after_terminal.

name: ce_executor_serial_pass_with_residuals_terminal
description: ce-executor-serial pass_with_residuals — plan.complete 入账 → LOOP_COMPLETE ×1 (140149)

config:
  prompt_file: PROMPT.md
  max_iterations: 16
  event_loop:
    execution_mode: isolated
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    state_projection:
      enabled: true
      actions_chain:
        work.done:
          - kind: close_task
            task_id: "task_id"
            step: "step"
          - kind: mark_step_completed
            step: "step"
        plan.complete:
          - kind: plan_complete
            final_step: "step"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics:
        - "LOOP_COMPLETE"
      business_topics:
        - "plan.complete"
        - "plan.blocked"
        - "REVIEW_COMPLETE"
        - "report.done"
        - "work.done"
        - "test.passed"
        - "review.complete"
      completion_after_terminal:
        duplicate_terminal: reject
        business_after_completion: reject
        write_diagnostic_event: true
      schemas:
        work.done:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        test.passed:
          payload: json_object
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - tests_run
            - tests_passed
        review.complete:
          payload: json_object
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - verdict
            - fix_plan_file
        plan.complete:
          payload: json_object
          required_fields:
            - plan_name
            - completed_steps
            - task_id
            - task_key
            - step
            - verdict
        REVIEW_COMPLETE:
          payload: json_object
          required_fields: [pass_or_fail, verdict]
        report.done:
          payload: json_object
          required_fields: [plan_name, report_path]
        LOOP_COMPLETE:
          payload: json_object
          required_fields: [plan_name, reason]
  hats:
    coordinator:
      subscribes_to: [work.start]
      publishes: [plan.ready, plan.blocked, plan.complete, queue.advance]
    executor:
      subscribes_to: [plan.ready]
      publishes: [work.done, work.failed, queue.advance]
    review-synthesizer:
      subscribes_to: [work.done]
      publishes: [review.complete, review.passed]
    validator:
      subscribes_to: [work.done]
      publishes: [test.passed, test.failed]
    shipper:
      subscribes_to: [plan.complete, plan.blocked]
      publishes: [REVIEW_COMPLETE]
    reporter:
      subscribes_to: [REVIEW_COMPLETE]
      publishes: [report.done, LOOP_COMPLETE]

fixture_files:
  - path: .ralph/agent/progress.md
    content: |
      ## Completed Steps
  - path: .ralph/agent/tasks.jsonl
    content: |
      {"id":"pwr-task-01","title":"step-01","key":"ce-executor:pwr-demo:step-01:u1-impl","status":"open","priority":1,"blocked_by":[],"loop_id":null,"owner_hat_id":null,"created":"2024-01-01T00:00:00Z"}
      {"id":"pwr-task-02","title":"step-02","key":"ce-executor:pwr-demo:step-02:u2-impl","status":"open","priority":1,"blocked_by":[],"loop_id":null,"owner_hat_id":null,"created":"2024-01-01T00:00:00Z"}

