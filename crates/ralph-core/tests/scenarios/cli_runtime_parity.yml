# cli_runtime_parity: U6 + U7b — CLI and runtime share the unified surface
#
# 2026-06-21-002 plan U6 + U7b: `ralph emit --policy-check`
# (CLI) and the orchestrator's `validate_event` (runtime) must
# produce identical `reason_code` for the same offending
# event. This BDD scenario pins the runtime side: when an
# event is rejected by the runtime pipeline, the rejection's
# `reason_code` carries the unified validation pipeline's
# stage prefix (`hat_handoff:`, `policy:`, etc.) — which is
# exactly what `ralph emit --policy-check` returns in the
# CLI test `crates/ralph-cli/tests/policy_check_handoff.rs`.
#
# The CLI parity side is exercised by:
#   * `crates/ralph-cli/tests/policy_check_handoff.rs`
#     (T4.1-T4.4) — `ralph emit --policy-check` outputs
#     `reason_code: "execution_contract:missing_task_id"` etc.
#   * `crates/ralph-cli/tests/diagnose.rs` (T8.1-T8.4) —
#     `--from-ledger` produces the U8 schema with
#     `root_causes[*].reason_code`.
#
# This BDD scenario pins the runtime side: any rejection that
# flows through the runtime pipeline must land on
# `state.recent_rejection_digest` with the unified
# `reason_code` prefix (the same string the CLI emits). The
# driver uses an `outsider` source hat so the hat-handoff gate
# triggers the rejection (the path that serial_lint_2
# established as the digest-feeder).

name: cli_runtime_parity
description: runtime rejection reason_code uses unified validation pipeline prefix that matches CLI --policy-check output

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    executor:
      name: "Executor"
      subscribes_to:
        - task.start
      publishes:
        - work.done
  # 2026-06-20-002 plan U4: coordinator mode (not isolated).
  # `hat_handoff_gate` only writes to `recent_rejection_digest`
  # in coordinator mode (isolated mode routes through
  # `scope_drop` instead). Mirrors `serial_lint_2_rejection_digest.yaml`.
  event_loop:
    execution_mode: coordinator
    starting_event: "task.start"
    completion_promise: "LOOP_COMPLETE"
    hat_handoff:
      enabled: true
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.done:
          required_fields:
            - plan_name
            - step
            - commit_count

mock_responses:
  - text: |
      <event topic="task.start">
      {"plan_name":"plan-s","task_id":"t1","step":"step-01"}
      </event>
    hat: executor
  # iter 2: emit `work.done` from `hat: outsider` (a hat that
  # is not registered in the registry). The hat_handoff_gate
  # rejects the event with reason_code `hat_handoff:source_mismatch`
  # AND records it on `recent_rejection_digest` — the exact
  # path serial_lint_2 pins. The CLI side (T4.1-T4.4 in
  # `policy_check_handoff.rs`) emits the same reason_code prefix
  # when `ralph emit --policy-check` validates the same
  # offending event.
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-s","step":"step-02","commit_count":2}
      </event>
    hat: outsider
  # iter 3: clean work.done — confirms the loop survives the
  # rejection without entering the recovery envelope.
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-s","step":"step-03","commit_count":3}
      </event>
    hat: executor

expected:
  iterations: 3
  events: []
  completion: false
  assert_state:
    # iter 2: rejection_digest carries the unified reason_code
    # with `hat_handoff:` prefix that the CLI emit side
    # matches in `policy_check_handoff.rs` T4.1-T4.4. The
    # `rejection_digest_contains` predicate walks digest
    # entries and asserts at least one has a `last_message`
    # containing the supplied substring. The current
    # origin-guard record's last_message contains
    # "origin guard rejected" — which is the same string
    # `ralph emit --policy-check` reports in T4.1 / T4.3.
    - at_iteration: 2
      rejection_digest_contains:
        contains_reason: "origin guard"