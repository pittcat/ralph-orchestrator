# ce_executor_serial_handoff_envelope_happy_path: minimal serial happy path
# with handoff_envelope carried on every business event.
#
# 2026-07-06-004 plan U12: BDD regression for the serial handoff
# envelope contract. Mirrors the 2026-06-26 U8 review chain but
# adds the `handoff_envelope` object to every emit payload (so
# the validator gates are exercised at runtime, not just in
# unit tests). When the agent produces a payload without
# `handoff_envelope`, the loop's policy-check rejects the
# emit and the scenario stalls — that is the regression
# defence the plan pins down at U12.
#
# Topology (simplified 1-step plan, no full review chain so
# the focus stays on the envelope validator):
#   work.start → work.ready → work.done → test.passed
#   → plan.complete → REVIEW_COMPLETE → report.done → LOOP_COMPLETE
#
# Asserts: every business emit lands and the loop reaches
# completion. Any regression that breaks envelope-driven
# routing or validator wiring fails this scenario.

name: ce_executor_serial_handoff_envelope_happy_path
description: 2026-07-06-004 U12 — minimal serial happy path with handoff_envelope carried on every business emit.

config:
  prompt_file: PROMPT.md
  max_iterations: 12
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - test.passed
        - work.failed
      publishes:
        - work.ready
        - plan.complete
        - plan.blocked
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
        - work.failed
    validator:
      subscribes_to:
        - work.done
      publishes:
        - test.passed
        - test.failed
    shipper:
      subscribes_to:
        - plan.complete
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    # 2026-07-06-004 plan U10: serial turns all three handoff
    # envelope flags on; the schema requires `handoff_envelope`
    # on every business topic.
    handoff_envelope:
      enabled: true
      prompt_injection: true
      validate_payload: true
      emit_result_summary: true
    # Mirror ce_executor_serial_pass_with_residuals_terminal: rely
    # on the legacy plan_gate + completion_after_terminal rules
    # (no phase_authority) so the topology mirrors the working
    # BDD scenarios and only the envelope contract is exercised.
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics:
        - "LOOP_COMPLETE"
      business_topics:
        - "plan.complete"
        - "plan.blocked"
        - "REVIEW_COMPLETE"
        - "report.done"
        - "work.ready"
        - "work.done"
        - "test.passed"
        - "test.failed"
      completion_after_terminal:
        duplicate_terminal: reject
        business_after_completion: reject
        write_diagnostic_event: true
      schemas:
        work.ready:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - complexity
            - handoff_envelope
          payload: json_object
        work.done:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - commit_count
            - changed_lines
            - handoff_envelope
          payload: json_object
        work.failed:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - reason
            - handoff_envelope
          payload: json_object
        test.passed:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - tests_run
            - tests_passed
            - handoff_envelope
          payload: json_object
        test.failed:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - failures
            - test_errors
            - handoff_envelope
          payload: json_object
        plan.complete:
          required_fields:
            - plan_name
            - completed_steps
            - task_id
            - task_key
            - step
            - verdict
            - final_findings_count
            - fix_round
            - handoff_envelope
          payload: json_object
        plan.blocked:
          required_fields:
            - reason
          payload: json_object

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"plan-u12","plan_path":"docs/plans/u12.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.ready">
      {"plan_name":"plan-u12","plan_path":"docs/plans/u12.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small","handoff_envelope":{"schema_version":"handoff-envelope.v1","root_goal":"ship without regressions","plan":{"name":"plan-u12","path":"docs/plans/u12.md","current_step":"step-01","completed_steps":[]},"state":{"current_status":"ready","last_signal":"work.start","blocking_reason":null},"receiver_contract":{"to_hat":"executor","must_do":["complete step-01"],"must_not_do":["regress baseline"],"success_signal":"work.done","failure_signal":"work.failed"}}}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-u12","plan_path":"docs/plans/u12.md","task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":10,"handoff_envelope":{"schema_version":"handoff-envelope.v1","root_goal":"ship without regressions","plan":{"name":"plan-u12","path":"docs/plans/u12.md","current_step":"step-01","completed_steps":["step-01"]},"state":{"current_status":"ready_for_review","last_signal":"work.done","blocking_reason":null},"receiver_contract":{"to_hat":"validator","must_do":["run full suite"],"must_not_do":["skip tests"],"success_signal":"test.passed","failure_signal":"test.failed"}}}
      </event>
    hat: executor
  - text: |
      <event topic="test.passed">
      {"plan_name":"plan-u12","task_id":"t1","task_key":"k1","step":"step-01","tests_run":3,"tests_passed":3,"handoff_envelope":{"schema_version":"handoff-envelope.v1","root_goal":"ship without regressions","plan":{"name":"plan-u12","path":"docs/plans/u12.md","current_step":"step-01","completed_steps":["step-01"]},"state":{"current_status":"ready_for_terminal","last_signal":"test.passed","blocking_reason":null},"receiver_contract":{"to_hat":"coordinator","must_do":["emit plan.complete"],"must_not_do":["regress anything"],"success_signal":"plan.complete","failure_signal":"plan.blocked"}}}
      </event>
    hat: validator
  - text: |
      <event topic="plan.complete">
      {"plan_name":"plan-u12","completed_steps":["step-01"],"task_id":"t1","task_key":"k1","step":"fix-01","verdict":"pass","final_findings_count":0,"fix_round":1,"handoff_envelope":{"schema_version":"handoff-envelope.v1","root_goal":"ship without regressions","plan":{"name":"plan-u12","path":"docs/plans/u12.md","current_step":"fix-01","completed_steps":["step-01"]},"state":{"current_status":"ready_for_shipper","last_signal":"plan.complete","blocking_reason":null},"receiver_contract":{"to_hat":"shipper","must_do":["promote to REVIEW_COMPLETE pass"],"must_not_do":["block on residuals=0"],"success_signal":"REVIEW_COMPLETE","failure_signal":"REVIEW_COMPLETE"}}}
      </event>
    hat: coordinator
  - text: |
      <event topic="REVIEW_COMPLETE">
      {"plan_name":"plan-u12","verdict":"pass","pass_or_fail":"pass","residual_findings_summary":"happy path"}
      </event>
    hat: shipper
  - text: |
      <event topic="report.done">
      {"plan_name":"plan-u12","reason":"happy path"}
      </event>
    hat: reporter
  - text: |
      <event topic="LOOP_COMPLETE">
      {"plan_name":"plan-u12","reason":"happy path"}
      </event>
    hat: reporter

expected:
  iterations: 8
  events:
    - topic: work.ready
    - topic: work.done
    - topic: test.passed
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    - topic: report.done
  absent_events:
    - topic: plan.blocked
    - topic: test.failed
    - topic: work.failed
  completion: true