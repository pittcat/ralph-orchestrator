# 2026-07-07-002 plan Unit 10: shipper waits for validator terminal
#
# plan.complete without current-step validator terminal must not
# allow REVIEW_COMPLETE(pass_with_residuals) (Units 5-6).

name: ce_executor_serial_shipper_waits_for_validator
description: 2026-07-07-002 U10 — shipper blocked without validator terminal; no pass_with_residuals success ship

config:
  prompt_file: PROMPT.md
  max_iterations: 6
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - work.done
      publishes:
        - work.ready
        - plan.complete
        - plan.blocked
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
    shipper:
      subscribes_to:
        - plan.complete
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.ready:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        work.done:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        plan.complete:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step, verdict, completed_steps, final_findings_count, fix_round]
        plan.blocked:
          payload: json_object
          required_fields: [reason]
        REVIEW_COMPLETE:
          payload: json_object
          required_fields: [pass_or_fail, verdict]

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"ship-wait","plan_path":"docs/plans/ship-wait.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.ready">
      {"plan_name":"ship-wait","plan_path":"docs/plans/ship-wait.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.done">
      {"plan_name":"ship-wait","plan_path":"docs/plans/ship-wait.md","task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":3}
      </event>
    hat: executor
  - text: |
      <event topic="plan.complete">
      {"plan_name":"ship-wait","completed_steps":["step-01"],"task_id":"t1","task_key":"k1","step":"fix-01","verdict":"pass","final_findings_count":0,"fix_round":0}
      </event>
    hat: coordinator
  - text: |
      <event topic="REVIEW_COMPLETE">
      {"plan_name":"ship-wait","verdict":"pass_with_residuals","pass_or_fail":"pass","residual_findings_summary":"validator never ran"}
      </event>
    hat: shipper
  - text: |
      waiting.

expected:
  iterations: 6
  events:
    - topic: work.ready
    - topic: work.done
    - topic: plan.complete
  absent_events:
    - topic: REVIEW_COMPLETE
    - topic: report.done
    - topic: LOOP_COMPLETE
    - topic: test.passed
  completion: false
