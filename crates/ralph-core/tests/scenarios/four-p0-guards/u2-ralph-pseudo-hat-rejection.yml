# U2: builtin ralph hat 业务 topic 越界拦截
#
# 场景：验证 hat="ralph" 发出业务 topic 被 EventOriginGuard 拒绝，
# 但发出 control topic（LOOP_COMPLETE）仍被接受。
# 精确的 ralph_control_only 拒绝逻辑在 event_origin.rs 单元测试中覆盖。
# 本 BDD 验证正常事件流不被 U2 守卫误伤。

name: u2_ralph_pseudo_hat_rejection
description: 验证 ralph hat 业务 topic 被拦截，正常事件流不受影响

config:
  prompt_file: PROMPT.md
  max_iterations: 4
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - work.ready
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done

mock_responses:
  - |
    <event topic="work.start" plan_name="plan-u2" plan_path="docs/plans/u2.md" task_id="t1" task_key="k1" step="step-01">
    Starting work.
    </event>
  - |
    <event topic="work.ready" plan_name="plan-u2" plan_path="docs/plans/u2.md" task_id="t1" task_key="k1" step="step-01">
    Work ready.
    </event>
  - |
    <event topic="work.done" plan_name="plan-u2" plan_path="docs/plans/u2.md" task_id="t1" task_key="k1" step="step-01">
    Work completed.
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 4
  events:
    - topic: work.start
    - topic: work.ready
    - topic: work.done
  completion: true
