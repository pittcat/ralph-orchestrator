# U1: partial wave dispatch — 验证 partial wave 事件流正常通过
#
# 场景：coordinator → executor → review-coordinator 的基本事件流，
# 确保 partial wave detection 的底层支持不破坏正常事件流。
# partial wave 的精确逻辑在 wave_detection.rs 和 wave_tracker.rs
# 的单元测试中覆盖。

name: u1_partial_wave_dispatch
description: 验证 partial wave 场景下事件流正常通过

config:
  prompt_file: PROMPT.md
  max_iterations: 5
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - work.ready
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
    review-coordinator:
      subscribes_to:
        - work.done
      publishes:
        - review.wave.ready
        - review.passed

mock_responses:
  - |
    <event topic="work.start" plan_name="plan-u1" plan_path="docs/plans/u1.md" task_id="t1" task_key="k1" step="step-01">
    Starting work.
    </event>
  - |
    <event topic="work.ready" plan_name="plan-u1" plan_path="docs/plans/u1.md" task_id="t1" task_key="k1" step="step-01">
    Work ready for execution.
    </event>
  - |
    <event topic="work.done" plan_name="plan-u1" plan_path="docs/plans/u1.md" task_id="t1" task_key="k1" step="step-01">
    Work completed.
    </event>
  - |
    <event topic="review.passed" plan_name="plan-u1" plan_path="docs/plans/u1.md" task_id="t1" task_key="k1" step="step-01">
    Review passed.
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    All done.
    </event>

expected:
  iterations: 5
  events:
    - topic: work.start
    - topic: work.ready
    - topic: work.done
    - topic: review.passed
  completion: true
