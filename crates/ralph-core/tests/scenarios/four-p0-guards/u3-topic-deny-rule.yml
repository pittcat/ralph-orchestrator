# U3: topic-deny 规则
#
# 场景：验证 topic_deny_rules 不误伤正常事件流。
# executor 发出 work.done（不在 deny list 中）应被接受。
# topic_deny 的精确拒绝逻辑在 event_policy.rs 单元测试中覆盖。

name: u3_topic_deny_rule
description: 验证 topic-deny 规则不误伤正常事件流

config:
  prompt_file: PROMPT.md
  max_iterations: 4
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - work.ready
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done

mock_responses:
  - |
    <event topic="work.start" plan_name="plan-u3" plan_path="docs/plans/u3.md" task_id="t1" task_key="k1" step="step-01">
    Starting work.
    </event>
  - |
    <event topic="work.ready" plan_name="plan-u3" plan_path="docs/plans/u3.md" task_id="t1" task_key="k1" step="step-01">
    Work ready.
    </event>
  - |
    <event topic="work.done" plan_name="plan-u3" plan_path="docs/plans/u3.md" task_id="t1" task_key="k1" step="step-01">
    Work completed (allowed topic).
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 4
  events:
    - topic: work.start
    - topic: work.ready
    - topic: work.done
  completion: true
