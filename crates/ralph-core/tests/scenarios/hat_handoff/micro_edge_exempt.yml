# 2026-06-18-002 plan U9: T3 / AE3 — review.dimension.* exempt
#
# The `review.dimension.{ready,done,failed}` micro-edges are
# exempt by default. They must NOT trigger the gate; agents can
# emit them without a handoff file.
#
# Topology: review-coordinator fans out to N reviewers. The
# `review.dimension.ready` micro-edges pass through the gate even
# when `hat_handoff.enabled: true`.
#
# References: plan T3 / AE3 / R2.

name: hat_handoff_micro_edge_exempt
description: "T3 AE3: review.dimension.* micro-edges are exempt, no handoff required"

config:
  prompt_file: PROMPT.md
  max_iterations: 5
  hats:
    reviewer-correctness:
      subscribes_to:
        - review.dimension.ready
      publishes:
        - review.dimension.done
    reviewer-style:
      subscribes_to:
        - review.dimension.ready
      publishes:
        - review.dimension.done
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE
    hat_handoff:
      enabled: true

mock_responses:
  - |
    <event topic="review.dimension.ready">
    dimension: "correctness"
    </event>
  - |
    <event topic="review.dimension.done">
    dimension: "correctness"
    verdict: "pass"
    </event>

expected:
  iterations: 2
  events:
    - topic: review.dimension.ready
    - topic: review.dimension.done
  completion: false
