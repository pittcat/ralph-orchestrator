# evidence_bound_precheck_routing
#
# Plan 2026-08-06-001 U5 (S5+S6): real EventLoop scenario proving
# precheck rejection routes to a specific hat via target_hat, and
# that synthetic/unavailable observations are surfaced correctly.
#
# Topology:
#   executor --(work.failed.proposed)--> precheck-work.failed --(work.failed.rejected)--> executor
#   executor --(work.failed)--> reporter --(LOOP_COMPLETE)->
#
# The precheck rule declares `on_fail.target: executor`, so a
# rejection must only inject the correction block into the
# executor's prompt — not the reporter's.
#
# S5 (precheck LLM reject routing): the precheck gate emits a
# normal `work.failed.rejected`; the correction block carries
# `target_hat = Some("executor")` so only executor sees it.
#
# S6 (synthetic unavailable): after a passing attempt, the
# precheck gate emits a synthetic `work.failed.rejected` with
# `reason: gate_silent_or_ambiguous` and `synthetic: true`
# (simulating the runtime-synthesized silent case). The correction
# block must surface `gate_silent_or_ambiguous` in the evidence
# and mark observations as `unchecked` — not guess from the LLM.

name: evidence_bound_precheck_routing
description: evidence-bound precheck correction — target_hat routing (S5) + synthetic unavailable evidence (S6)

config:
  prompt_file: PROMPT.md
  max_iterations: 8
  hats:
    executor:
      subscribes_to:
        - task.start
        - task.resume
      publishes:
        - work.failed
    precheck-work.failed:
      subscribes_to:
        - work.failed.proposed
      publishes:
        - work.failed.rejected
        - work.failed
    reporter:
      subscribes_to:
        - work.failed
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "task.start"
    completion_promise: "LOOP_COMPLETE"
    precheck:
      enabled: true
      rules:
        work.failed:
          prompt:
            - "dead_end_evidence_insufficient"
          on_fail:
            target: executor
            retry_budget: 3
            on_exhausted: "plan.blocked(reason=precheck_failed)"
            reason: "dead_end_evidence_insufficient"
          # The precheck rule carries `common` items plus a
          # `by_check["1"]` entry (1-based checklist index).
          recovery_guidance:
            common:
              - "rebuild the artifact referenced by dead_end_evidence_file"
              - "rerun ralph emit <topic> --policy-check before re-emitting"
            by_check:
              "1":
                - "drop dead_end_confidence to ≤ 80 unless the artifact supports it"
                - "include both coverage and confidence numbers in the dead-end evidence file"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        task.start:
          payload: json_object
        work.failed:
          required_fields:
            - plan_name
            - dead_end_confidence
            - dead_end_evidence_coverage
            - dead_end_evidence_file

mock_responses:
  # ── S5: LLM rejection with target_hat routing ──────────────────
  # iter 1: executor proposes work.failed — precheck gate rejects
  # with a normal LLM-emitted rejection.
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":60,"dead_end_evidence_coverage":40,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed.rejected">
      {"failed_checks":["1"],"reason":"dead_end_evidence_insufficient","synthetic":false}
      </event>
  # iter 2: executor re-proposes after reading the correction block.
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":62,"dead_end_evidence_coverage":45,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed.rejected">
      {"failed_checks":["1"],"reason":"dead_end_evidence_insufficient","synthetic":false}
      </event>
  # iter 3: executor lands a passing payload — gate forwards.
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":92,"dead_end_evidence_coverage":80,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed">
      {"plan_name":"demo","dead_end_confidence":92,"dead_end_evidence_coverage":80,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: reporter
    text: |
      <event topic="report.done">
      {"verdict":"blocked","plan_name":"demo"}
      </event>
  - hat: reporter
    text: |
      <event topic="LOOP_COMPLETE">
      {"reason":"reported"}
      </event>
  # ── S6: synthetic / gate_silent_or_ambiguous path ─────────────
  # iter 4: executor re-proposes after the reporter run — gate
  # stays silent (no response from precheck hat in time), so
  # the runtime synthesises a `work.failed.rejected` with
  # synthetic=true and reason=gate_silent_or_ambiguous.
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":70,"dead_end_evidence_coverage":60,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  # The runtime synthesises this because the precheck hat did not
  # emit work.failed or work.failed.rejected in the grace window.
  # S6: synthetic=true triggers gate_silent_or_ambiguous evidence.
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed.rejected">
      {"failed_checks":[1,2],"reason":"gate_silent_or_ambiguous","synthetic":true}
      </event>
  # iter 5: executor retries — now passes.
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":95,"dead_end_evidence_coverage":90,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed">
      {"plan_name":"demo","dead_end_confidence":95,"dead_end_evidence_coverage":90,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: reporter
    text: |
      <event topic="report.done">
      {"verdict":"clean","plan_name":"demo"}
      </event>
  - hat: reporter
    text: |
      <event topic="LOOP_COMPLETE">
      {"reason":"reported"}
      </event>

expected:
  iterations: 14
  events:
    - topic: work.failed.rejected
    - topic: work.failed
    - topic: report.done
    # S6: synthetic rejection appears as work.failed.rejected
    - topic: work.failed.rejected
    - topic: work.failed
    - topic: report.done
  absent_events:
    - topic: plan.blocked
  completion: true
  assert_state:
    # NOTE: at_iteration=1 has empty correction_blocks because the
    # precheck gate's CorrectionContext is built asynchronously after
    # the rejection event is processed (iter 2+). The assertions
    # below pin S5/S6's precheck routing behavior across iter 2+.
    # iter 2 (S5): precheck rejection queues a semantic correction
    # block targeted at the executor (target_hat=Some("executor")
    # pins the routing — other hats do not see this block).
    - at_iteration: 2
      correction_block_present:
        reason_code_prefix: "policy:"
        needs_escalation: false
        feedback_kind: "semantic"
    # iter 4 (S6): synthetic rejection — evidence carries
    # gate_silent_or_ambiguous marker. The correction block
    # feedback_kind is semantic and the evidence shows
    # the gate was silent/unchecked (not a real LLM check result).
    # 2026-08-17-1841 U5 (S1/S2): the correction block rendered
    # to the executor carries both the preset-supplied `common`
    # guidance and the `by_check["1"]` items that the
    # LLM-reported failed check triggered.
    - at_iteration: 2
      correction_block_contains:
        - "Common recovery guidance"
        - "rebuild the artifact referenced by dead_end_evidence_file"
        - "rerun ralph emit <topic> --policy-check before re-emitting"
        - "Check-specific recovery guidance"
        - "drop dead_end_confidence to ≤ 80 unless the artifact supports it"
        - "include both coverage and confidence numbers in the dead-end evidence file"
    # 2026-08-17-1841 U5 (S2/D3): synthetic rejection carries
    # the same preset-supplied guidance, but the
    # check-specific sub-section is suppressed by the renderer.
    - at_iteration: 4
      correction_block_contains:
        - "Common recovery guidance"
        - "rebuild the artifact referenced by dead_end_evidence_file"
      correction_block_absent:
        - "Check-specific recovery guidance"
        - "drop dead_end_confidence to ≤ 80 unless the artifact supports it"
