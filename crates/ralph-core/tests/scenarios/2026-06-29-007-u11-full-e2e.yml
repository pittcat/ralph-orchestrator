# 2026-06-29-007 U11: 全链路 BDD 复刻 + 文档同步
#
# requires: u1a + u2 + u1b + u3 + u4 + u5a + u5b + u6a + u6b + u10 + u7 + u8
#
# BDD 覆盖:跑通修复后的完整 4 步 plan 流程:
# step-01..step-04 → review 链 → shipper → LOOP_COMPLETE
#
# 期望:
# - 完整 4 步 plan 完整跑通
# - 6 维 review 收齐 → review-synthesizer → review.complete
# - coordinator 推 fix-unit(经 U10 PHASE 2 branch gate)
# - shipper pass → LOOP_COMPLETE(success=true)
# - recovery.jsonl 无 flow_unknown_emit / target_self_loop /
#   flow_state_closed / upstream_review_incomplete 记录

name: u11_full_e2e_after_fix
description: 修复后 4 步 plan 完整 happy path - U11 E2E 复刻

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - test.passed
        - review.dimensions.complete
        - review.complete
      publishes:
        - work.ready
        - plan.complete
      default_publishes: plan.complete
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
      default_publishes: work.done
    validator:
      subscribes_to:
        - work.done
      publishes:
        - test.passed
      default_publishes: test.passed
    review-coordinator:
      subscribes_to:
        - work.done
        - test.passed
      publishes:
        - review.dimensions.complete
      default_publishes: review.dimensions.complete
    dimension-reviewer:
      subscribes_to:
        - review.dimensions.complete
      publishes:
        - review.dimension.done
      default_publishes: review.dimension.done
    review-synthesizer:
      subscribes_to:
        - review.dimension.done
      publishes:
        - review.complete
      default_publishes: review.complete
    shipper:
      subscribes_to:
        - plan.complete
        - review.complete
      publishes:
        - LOOP_COMPLETE
      default_publishes: LOOP_COMPLETE

mock_responses:
  - |
    <event topic="work.start">
    plan_name: "u11-demo"
    plan_path: "docs/plans/u11.md"
    task_id: "u11-task-1"
    task_key: "u11-1"
    </event>
  - |
    <event topic="work.ready">
    plan_name: "u11-demo"
    plan_path: "docs/plans/u11.md"
    task_id: "u11-task-1"
    task_key: "u11-1"
    step: "step-01"
    </event>
  - |
    <event topic="work.done">
    plan_name: "u11-demo"
    step: "step-01"
    task_id: "u11-task-1"
    </event>
  - |
    <event topic="test.passed">
    plan_name: "u11-demo"
    step: "step-01"
    task_id: "u11-task-1"
    </event>
  - |
    <event topic="review.dimensions.complete">
    wave_id: "u11-wave"
    dimensions: ["d1"]
    </event>
  - |
    <event topic="review.dimension.done">
    wave_id: "u11-wave"
    dimension: "d1"
    verdict: ok
    </event>
  - |
    <event topic="review.complete">
    wave_id: "u11-wave"
    verdict: pass
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "u11-demo"
    verdict: pass
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    success: true
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 10
  events:
    - topic: work.start
    - topic: work.ready
    - topic: work.done
    - topic: test.passed
    - topic: review.dimensions.complete
    - topic: review.dimension.done
    - topic: review.complete
    - topic: plan.complete
  absent_events:
    - topic: plan.blocked
  recovery_absent:
    - "flow_unknown_emit"
    - "target_self_loop"
    - "flow_state_closed"
    - "upstream_review_incomplete"
  completion: true