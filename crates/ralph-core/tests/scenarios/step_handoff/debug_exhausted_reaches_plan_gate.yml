# debug.exhausted reaches shipper ONLY (single-consumer, 2026-06-24 fix)
#
# 2026-06-24 fix: removed plan-gate from the consumers of `debug.exhausted`.
# Previously `debug.exhausted` was a multi-consumer topic (both shipper
# and plan-gate subscribed), mirroring the same scheduling race as
# `fix.exhausted`. Now `debug.exhausted` has a SINGLE consumer (shipper).
#
# This scenario pins the new wire flow:
#   debug-resolver --(debug.exhausted)--> shipper (sole consumer)
# shipper drives the manager report chain. plan-gate MUST NOT see
# `debug.exhausted`.
#
# Reference:
#   2026-06-24 diagnosis: fix.exhausted multi-consumer scheduling race
#   presets/en/ce-executor-serial.yml (plan-gate triggers no longer include debug.exhausted)

name: debug_exhausted_reaches_plan_gate
description: |
  debug.exhausted reaches shipper ONLY (single consumer after 2026-06-24
  fix). plan-gate no longer subscribes to debug.exhausted, eliminating
  the round-robin scheduling race.

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    debug-resolver:
      # task.start is the default starting_event — debug-resolver listens
      # for it so the scenario can boot without an extra coordinator hat.
      subscribes_to:
        - task.start
        - fix.exhausted
      publishes:
        - debug.exhausted
        - LOOP_COMPLETE
    shipper:
      # Sole consumer of debug.exhausted (2026-06-24 fix).
      subscribes_to:
        - debug.exhausted
      publishes:
        - LOOP_COMPLETE
    plan-gate:
      # plan-gate no longer subscribes to debug.exhausted. It only listens
      # for review/queue/work events. If debug.exhausted reaches plan-gate
      # here, the scenario's absent_events check will fail.
      subscribes_to:
        - review.passed
      publishes:
        - plan.blocked
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE

# Iter 1: debug-resolver emits `debug.exhausted` after the causal
# chain gate fails (root cause unconfirmed or environmental boundary).
# ONLY shipper receives it (single consumer).
# Iter 2: terminate via LOOP_COMPLETE.
mock_responses:
  - |
    <event topic="debug.exhausted">
    plan_name: "demo"
    task_id: "task-debug-001"
    task_key: "step-01"
    step: "step-01"
    reason: "root cause unconfirmed"
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 2
  events:
    - topic: debug.exhausted
  absent_events:
    - topic: plan.blocked
  completion: true
