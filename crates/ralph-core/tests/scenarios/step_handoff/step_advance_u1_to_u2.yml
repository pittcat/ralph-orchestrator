# Step Advance U1→U2: queue.advance + work.ready dual-publish handoff
# reaches the executor in a later turn (e2e <30s target).
#
# 2026-06-17-002 feat-ce-executor-step-handoff U8 (multi-step E2E):
# The full ce-executor-serial topology must carry plan-gate's
# dual-publish `(queue.advance, work.ready)` through to executor
# activation. WAC-U4 (2026-06-12-002) added the dual-publish
# carve-out so executor is woken by `work.ready` priority dispatch
# instead of having to re-listen to `queue.advance`.
#
# This scenario uses the minimal topology (plan-gate + executor + ralph)
# to validate the wire flow without dragging in review / fix / debug /
# ship pipelines. It mirrors `plan_gate_dual_publish_handoff.yml`
# (U3 regression) but exercises both turns end-to-end and pins the
# dual-publish on the same iteration that an actual U1→U2 step advance
# would emit.
#
# Topology (mirroring ce-executor-serial core handoff):
#   plan-gate --(queue.advance + work.ready)--> executor --(work.done)--> plan-gate
#
# Reference:
#   docs/plans/2026-06-17-002-feat-ce-executor-step-handoff-plan.md U8
#   docs/plans/2026-06-15-003-fix-plan-gate-dual-publish-isolated-budget-plan.md

name: step_advance_u1_to_u2
description: |
  U1→U2 step advance: plan-gate dual-publishes queue.advance + work.ready
  in one turn; executor wakes on work.ready priority dispatch and emits
  work.done; loop completes via plan-gate (collapsed onto terminal for
  minimal topology).

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    plan-gate:
      subscribes_to:
        - task.start
        - work.done
      publishes:
        - queue.advance
        - work.ready
        - LOOP_COMPLETE
    executor:
      subscribes_to:
        - work.ready
        - queue.advance
      publishes:
        - work.done
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE

# Iter 1: plan-gate dual-publishes the U1→U2 handoff in a single turn:
#   - `queue.advance` (step="step-02", U1 done → U2 begins)
#   - `work.ready`   (full U2 task payload: task_id, plan_name, plan_path,
#                     task_key, step, complexity)
# Both must be accepted in the same turn (U3 dual-publish carve-out).
# Iter 2: executor wakes on `work.ready` (priority dispatch) and emits
#         `work.done` to close U2.
# Iter 3: plan-gate wakes on `work.done` and emits LOOP_COMPLETE to
#         terminate the loop. (Real ce-executor-serial routes through
#         review/synth gates; the minimal scenario collapses that onto
#         plan-gate to keep the wire flow deterministic.)
mock_responses:
  - |
    <event topic="queue.advance">
    step: "step-02"
    </event>
    <event topic="work.ready">
    task_id: "task-u2-001"
    plan_name: "demo"
    plan_path: "/tmp/demo.md"
    task_key: "step-02"
    step: "step-02"
    complexity: "small"
    </event>
  - |
    <event topic="work.done">
    task_id: "task-u2-001"
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    U2 complete.
    </event>

expected:
  iterations: 3
  events:
    - topic: queue.advance
    - topic: work.ready
    - topic: work.done
  completion: true
