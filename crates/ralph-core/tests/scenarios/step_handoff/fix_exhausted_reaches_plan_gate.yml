# fix.exhausted reaches plan-gate (multi-consumer U1 path)
#
# 2026-06-17-002 feat-ce-executor-step-handoff U8 (multi-step E2E):
# After U1 added plan-gate to the multi-consumer whitelist for
# `fix.exhausted` (alongside debug-resolver), the orchestration must
# route `fix.exhausted` to BOTH debug-resolver (primary consumer) AND
# plan-gate (U1 escalation consumer). Plan-gate translates the
# escalation into `plan.blocked` so shipper → reporter still produce
# a manager report.
#
# This scenario pins the wire flow with the minimal topology:
#   fixer --(fix.exhausted)--> debug-resolver + plan-gate
# Both downstream hats MUST see the event and react: debug-resolver
# decides the next move (fix.plan.ready → executor in real preset,
# simplified here as terminal handoff to keep wire flow deterministic),
# plan-gate emits `plan.blocked` for the manager report chain.
#
# Reference:
#   docs/plans/2026-06-17-002-feat-ce-executor-step-handoff-plan.md U1 / U8
#   crates/ralph-cli/src/presets.rs:1310 test_ce_executor_plan_gate_exists_and_routes_correctly

name: fix_exhausted_reaches_plan_gate
description: |
  fix.exhausted reaches BOTH debug-resolver (primary) and plan-gate
  (U1 multi-consumer escalation) and plan-gate emits plan.blocked
  for the manager report chain.

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    fixer:
      # task.start is the default starting_event — fixer listens for it
      # so the scenario can boot without an extra coordinator hat.
      subscribes_to:
        - task.start
        - review.failed
      publishes:
        - fix.exhausted
        - LOOP_COMPLETE
    debug-resolver:
      # Multi-consumer whitelisted trigger: both debug-resolver and
      # plan-gate opt in via trigger_multi_consumer_topics.
      subscribes_to:
        - fix.exhausted
      publishes:
        - LOOP_COMPLETE
    plan-gate:
      subscribes_to:
        - fix.exhausted
      publishes:
        - plan.blocked
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE

# Iter 1: fixer emits `fix.exhausted` after safe_auto rounds are
# exhausted. Both debug-resolver AND plan-gate must receive it
# (multi-consumer whitelist from U1).
# Iter 2: plan-gate translates the escalation into `plan.blocked`
# to feed the manager report chain. The dual-publish carve-out is
# scoped to `(queue.advance, work.ready)` only, so plan.blocked is
# published in a SEPARATE turn — this matches the real wire flow
# because fixer and plan-gate are distinct hats.
# Iter 3: terminate via LOOP_COMPLETE.
#
# NOTE: events are split across iterations because isolated mode
# drops extra business events from distinct hats within the same turn
# (per-turn sticky budget — see plan_gate_dual_publish_third_blocked).
mock_responses:
  - |
    <event topic="fix.exhausted">
    plan_name: "demo"
    task_id: "task-fix-001"
    task_key: "step-01"
    step: "step-01"
    fix_round: 3
    reason: "safe_auto rounds exhausted"
    </event>
  - |
    <event topic="plan.blocked">
    plan_name: "demo"
    reason: "fix.exhausted: safe_auto rounds exhausted"
    task_id: "task-fix-001"
    task_key: "step-01"
    step: "step-01"
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 3
  events:
    - topic: fix.exhausted
    - topic: plan.blocked
  completion: true
