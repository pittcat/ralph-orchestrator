# fix.exhausted reaches debug-resolver ONLY (single-consumer, 2026-06-24 fix)
#
# 2026-06-24 fix: removed plan-gate from the consumers of `fix.exhausted`.
# Previously `fix.exhausted` was a multi-consumer topic (both debug-resolver
# and plan-gate subscribed), which caused a round-robin scheduling race —
# plan-gate could preempt debug-resolver, emit `plan.blocked`, and cascade
# to loop.terminate before debug-resolver ever ran.
#
# Now `fix.exhausted` has a SINGLE consumer (debug-resolver). This scenario
# pins the new wire flow:
#   fixer --(fix.exhausted)--> debug-resolver (sole consumer)
# debug-resolver decides the next move (here: terminal handoff to keep the
# wire flow deterministic). plan-gate MUST NOT see `fix.exhausted`.
#
# Reference:
#   2026-06-24 diagnosis: fix.exhausted multi-consumer scheduling race
#   presets/en/ce-executor-serial.yml (plan-gate triggers no longer include fix.exhausted)

name: fix_exhausted_reaches_plan_gate
description: |
  fix.exhausted reaches debug-resolver ONLY (single consumer after 2026-06-24
  fix). plan-gate no longer subscribes to fix.exhausted, eliminating the
  round-robin scheduling race.

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    fixer:
      # task.start is the default starting_event — fixer listens for it
      # so the scenario can boot without an extra coordinator hat.
      subscribes_to:
        - task.start
        - review.failed
      publishes:
        - fix.exhausted
        - LOOP_COMPLETE
    debug-resolver:
      # Sole consumer of fix.exhausted (2026-06-24 fix).
      subscribes_to:
        - fix.exhausted
      publishes:
        - LOOP_COMPLETE
    plan-gate:
      # plan-gate no longer subscribes to fix.exhausted. It only listens
      # for review/queue/work events. If fix.exhausted reaches plan-gate
      # here, the scenario's absent_events check will fail.
      subscribes_to:
        - review.passed
      publishes:
        - plan.blocked
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE

# Iter 1: fixer emits `fix.exhausted` after safe_auto rounds are
# exhausted. ONLY debug-resolver receives it (single consumer).
# Iter 2: terminate via LOOP_COMPLETE.
mock_responses:
  - |
    <event topic="fix.exhausted">
    plan_name: "demo"
    task_id: "task-fix-001"
    task_key: "step-01"
    step: "step-01"
    fix_round: 3
    reason: "safe_auto rounds exhausted"
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 2
  events:
    - topic: fix.exhausted
  absent_events:
    - topic: plan.blocked
  completion: true
