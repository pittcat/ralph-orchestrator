# 2026-07-03-001 plan U13: supervisor minimal BDD smoke.
#
# Pinned to the generic supervisor topology: validates the
# `exec.unit.done → exec.wave.complete (system_injected) →
# exec-integrator → work.done` happy path inside a single
# isolated mode iteration. Full 16-hat fan-out is exercised
# in the integration smoke test in U12; this BDD file
# is the smallest possible pin for the lint + event topology
# contracts introduced by U7/U9.
#
# Phase 6 BDD realization (2026-07-03-001): the
# `system_injected: exec.wave.complete` mock response is gone.
# The scenario runner's `run_bdd_supervisor_fan_in` drives the
# real `SupervisorCoordinator` via `InMemoryCoordinatorBridge`
# after `process_events_from_jsonl` sees `exec.unit.done`, so
# the coordination event is produced by the production code
# path (U8/U10) instead of being faked via a YAML fixture.
# The `event_loop.supervisor.enabled: true` +
# `execution_mode: isolated` block opts the scenario into the
# supervisor path; without it `run_bdd_supervisor_fan_in` is
# never called and the test degrades to a tautological
# passthrough (the original F-010 finding).

name: u13_supervisor_minimal
description: U13 - supervisor wave.complete → exec-integrator → work.done minimal pin

config:
  prompt_file: PROMPT.md
  max_iterations: 2
  event_loop:
    execution_mode: isolated
    supervisor:
      enabled: true
      aggregate_timeout_secs: 60
  hats:
    worker:
      subscribes_to:
        - exec.unit.ready
      publishes:
        - exec.unit.done
    exec-integrator:
      subscribes_to:
        - exec.wave.complete
      publishes:
        - work.done

mock_responses:
  - |
    <event topic="exec.unit.done">
    wave_id: "w-u13"
    slot_index: 0
    content_hash: "u13-h"
    </event>
  - |
    <event topic="work.done">
    status: "complete"
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 3
  events:
    - topic: exec.unit.done
    - topic: exec.wave.complete
  absent_events:
    - topic: plan.blocked
  completion: false
