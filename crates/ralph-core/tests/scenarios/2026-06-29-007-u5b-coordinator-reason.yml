# 2026-06-29-007 U5b: coordinator reason 拼装收紧
#
# BDD 覆盖:PlanBlockedReason typed enum 拒绝原 run 实际产物
# reason=review_never_completed_scope_violation_blocked_review_coordinator
# 这种字符串拼接的 reason。单测在 plan_blocked_reason::tests
# 已覆盖 parse / as_str round-trip;此 scenario 是 plan_blocked
# reason 收紧契约的 integration 冒烟。
#
# 期望:happy path 完整跑通,无 scope_violation 字符串污染。

name: u5b_coordinator_reason
description: U5b - plan.blocked reason typed enum 拒绝字符串拼接

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    coordinator:
      subscribes_to:
        - work.done
      publishes:
        - plan.complete
      default_publishes: plan.complete

mock_responses:
  - |
    <event topic="work.done">
    plan_name: "u5b-demo"
    step: "step-01"
    task_id: "u5b-task"
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "u5b-demo"
    verdict: pass
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 3
  events:
    - topic: work.done
    - topic: plan.complete
  absent_events:
    - topic: plan.blocked
  recovery_absent:
    - "reason_invalid"
  completion: false