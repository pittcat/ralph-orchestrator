# ce_executor_pipeline_executor_fail_stop: U2 fail-stop per-Unit contract
#
# 2026-07-16-001 plan U2: when Executor fails on Unit U2 (or any
# non-final Unit), it MUST emit work.failed with a complete
# Unit accounting bill:
#   planned_units = [U1, U2, U3, ..., Un]
#   attempted_units = [U1, U2]
#   completed_units = [U1]
#   failed_units = [U2]
#   blocked_units = []
#   skipped_units = [U3, ..., Un]
# And there MUST NOT be any subsequent Unit-related business event
# (work.done, fix.done, review.*, align.done) — only reporter handles
# the failure short-circuit.

name: ce_executor_pipeline_executor_fail_stop
description: ce-executor-pipeline U2 — Unit-level fail-stop with bill accounting (U2 fails, U3..Un never start)

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    plan-reviewer:
      subscribes_to: [work.start]
      publishes: [plan.ready, plan.blocked]
    executor:
      subscribes_to: [plan.ready]
      publishes: [work.done, work.failed]
    test-stabilizer:
      subscribes_to: [work.done, fix.done]
      publishes: [stabilization.done, stabilization.blocked]
    "dim:goal-alignment":
      subscribes_to: [stabilization.done]
      publishes: [review.goalalign.done]
    "dim:correctness":
      subscribes_to: [review.goalalign.done]
      publishes: [review.correctness.done]
    "dim:testing":
      subscribes_to: [review.correctness.done]
      publishes: [review.testing.done]
    "dim:maintainability":
      subscribes_to: [review.testing.done]
      publishes: [review.maintainability.done]
    "dim:project-standards":
      subscribes_to: [review.maintainability.done]
      publishes: [review.standards.done]
    "dim:adversarial":
      subscribes_to: [review.standards.done]
      publishes: [review.adversarial.done]
    review-synthesizer:
      subscribes_to: [review.adversarial.done]
      publishes: [review.synthesized]
    fix-planner:
      subscribes_to: [review.synthesized]
      publishes: [review.complete]
    fixer:
      subscribes_to: [review.complete]
      publishes: [fix.done]
    alignment:
      subscribes_to: [fix.done]
      publishes: [align.done]
    reporter:
      subscribes_to: [align.done, plan.blocked, work.failed, stabilization.blocked, review.loop.blocked]
      publishes: [report.done, LOOP_COMPLETE]
  event_loop:
    execution_mode: isolated
    starting_event: work.start
    completion_promise: LOOP_COMPLETE
    required_events: [report.done]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics: [LOOP_COMPLETE]
      business_topics:
        - plan.ready
        - plan.blocked
        - work.done
        - work.failed
        - stabilization.done
        - stabilization.blocked
        - review.round.ready
        - review.goalalign.done
        - review.correctness.done
        - review.testing.done
        - review.maintainability.done
        - review.standards.done
        - review.adversarial.done
        - review.synthesized
        - fix.done
        - align.done
        - report.done

mock_responses:
  - hat: plan-reviewer
    text: |
      <event topic="plan.ready">{"plan_name":"plan-fail-stop","plan_path":"docs/plans/fail-stop.md","plan_revised":false,"review_summary":"ok","flow_audit":"first_run","resolved_baseline_sha":"0000000000000000000000000000000000000001"}</event>
  # Executor fails on U2; emits work.failed with full Unit bill.
  # U3..U6 must NOT start.
  - hat: executor
    text: |
      <event topic="work.failed">
      {"plan_name":"plan-fail-stop","plan_path":"docs/plans/fail-stop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","reason":"unit_failed: U2 tests_not_green after 3 attempts","planned_units":["U1","U2","U3","U4","U5","U6"],"attempted_units":["U1","U2"],"completed_units":["U1"],"failed_units":["U2"],"blocked_units":[],"skipped_units":["U3","U4","U5","U6"],"decisions_file":".ralph/agent/decisions.md","report_input_file":".ralph/review/plan-fail-stop/report-input.work-failed.json"}
      </event>
  - hat: reporter
    text: |
      <event topic="report.done">{"plan_name":"plan-fail-stop","report_path":".ralph/review/plan-fail-stop/report.md","verdict":"blocked","reason":"executor fail-stop at U2"}</event>
  - hat: reporter
    text: |
      <event topic="LOOP_COMPLETE">{"reason":"executor fail-stop at U2"}</event>

expected:
  iterations: 4
  events:
    - topic: plan.ready
    - topic: work.failed
    - topic: report.done
  absent_events:
    # U2 fail-stop: U3..U6 must NEVER start. No review/fix/align events.
    - topic: work.done
    - topic: stabilization.done
    - topic: stabilization.blocked
    - topic: review.round.ready
    - topic: review.goalalign.done
    - topic: review.correctness.done
    - topic: review.testing.done
    - topic: review.maintainability.done
    - topic: review.standards.done
    - topic: review.adversarial.done
    - topic: review.synthesized
    - topic: fix.requested
    - topic: review.complete
    - topic: fix.done
    - topic: align.done
    - topic: review.loop.blocked
    - topic: plan.blocked
  payload_matches:
    - topic: work.failed
      fields:
        planned_units: ["U1","U2","U3","U4","U5","U6"]
        attempted_units: ["U1","U2"]
        completed_units: ["U1"]
        failed_units: ["U2"]
        skipped_units: ["U3","U4","U5","U6"]
        reason: "unit_failed: U2 tests_not_green after 3 attempts"
  completion: true
