# 2026-07-07-002 plan Unit 10: post-terminal business event rejection
#
# After LOOP_COMPLETE is honored, recovery/agent attempts to emit
# work.done and plan.blocked must be frozen (Units 3-4).

name: ce_executor_serial_rejects_post_terminal_business_event
description: 2026-07-07-002 U10 — post-terminal work.done rejected after LOOP_COMPLETE honored

config:
  prompt_file: PROMPT.md
  max_iterations: 11
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - test.passed
      publishes:
        - work.ready
        - plan.complete
        - plan.blocked
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
    validator:
      subscribes_to:
        - work.done
      publishes:
        - test.passed
    shipper:
      subscribes_to:
        - plan.complete
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics:
        - "LOOP_COMPLETE"
      business_topics:
        - "plan.complete"
        - "plan.blocked"
        - "REVIEW_COMPLETE"
        - "report.done"
        - "work.ready"
        - "work.done"
        - "test.passed"
      completion_after_terminal:
        duplicate_terminal: reject
        business_after_completion: reject
        write_diagnostic_event: true
      schemas:
        work.ready:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        work.done:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        test.passed:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        plan.complete:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step, verdict, completed_steps, final_findings_count, fix_round]
        plan.blocked:
          payload: json_object
          required_fields: [reason]
        REVIEW_COMPLETE:
          payload: json_object
          required_fields: [pass_or_fail, verdict]
        report.done:
          payload: json_object
          required_fields: [plan_name]
        LOOP_COMPLETE:
          payload: json_object
          required_fields: [plan_name, reason]

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"post-term","plan_path":"docs/plans/post-term.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.ready">
      {"plan_name":"post-term","plan_path":"docs/plans/post-term.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.done">
      {"plan_name":"post-term","plan_path":"docs/plans/post-term.md","task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":1}
      </event>
    hat: executor
  - text: |
      <event topic="test.passed">
      {"plan_name":"post-term","task_id":"t1","task_key":"k1","step":"step-01","tests_run":1,"tests_passed":1}
      </event>
    hat: validator
  - text: |
      <event topic="plan.complete">
      {"plan_name":"post-term","completed_steps":["step-01"],"task_id":"t1","task_key":"k1","step":"fix-01","verdict":"pass","final_findings_count":0,"fix_round":0}
      </event>
    hat: coordinator
  - text: |
      <event topic="REVIEW_COMPLETE">
      {"plan_name":"post-term","verdict":"pass","pass_or_fail":"pass","residual_findings_summary":"none"}
      </event>
    hat: shipper
  - text: |
      <event topic="report.done">
      {"plan_name":"post-term","status":"completed"}
      </event>
    hat: reporter
  - text: |
      <event topic="LOOP_COMPLETE">
      {"plan_name":"post-term","reason":"terminal honored"}
      </event>
    hat: reporter
  - text: |
      <event topic="work.done">
      {"plan_name":"post-term","plan_path":"docs/plans/post-term.md","task_id":"t1","task_key":"k1","step":"step-02","commit_count":1,"changed_lines":1}
      </event>
    hat: executor
  - text: |
      <event topic="plan.blocked">
      {"plan_name":"post-term","reason":"late recovery after terminal"}
      </event>
    hat: coordinator
  - text: |
      waiting.

checkpoints:
  - after_response: 8
    honor_completion: true

expected:
  iterations: 11
  events:
    - topic: work.ready
    - topic: work.done
    - topic: test.passed
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    - topic: report.done
  event_topic_counts:
    - topic: LOOP_COMPLETE
      count: 1
    - topic: work.done
      count: 1
    - topic: plan.blocked
      count: 0
  absent_events:
    - topic: plan.blocked
  recovery_contains:
    - post_terminal_business_event_frozen
  completion: true
