# 2026-07-02-005 BDD-2: fix-unit terminal path (gate-enabled)

name: ce_executor_serial_fix_unit_terminal
description: ce-executor-serial fix-unit — plan.complete(fix-*) 收口 → LOOP_COMPLETE ×1

config:
  prompt_file: PROMPT.md
  max_iterations: 12
  event_loop:
    execution_mode: isolated
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    state_projection:
      enabled: true
      actions_chain:
        work.done:
          - kind: close_task
            task_id: "task_id"
            step: "step"
          - kind: mark_step_completed
            step: "step"
        plan.complete:
          - kind: plan_complete
            final_step: "step"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics:
        - "LOOP_COMPLETE"
      business_topics:
        - "plan.complete"
        - "REVIEW_COMPLETE"
        - "report.done"
        - "work.done"
        - "work.ready"
        - "review.failed"
      completion_after_terminal:
        duplicate_terminal: reject
        business_after_completion: reject
        write_diagnostic_event: true
      schemas:
        work.done:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        work.ready:
          payload: json_object
          required_fields: [plan_name, task_id, task_key, step]
        review.failed:
          payload: json_object
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - fix_plan_file
        plan.complete:
          payload: json_object
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - verdict
        REVIEW_COMPLETE:
          payload: json_object
          required_fields: [pass_or_fail, verdict]
        report.done:
          payload: json_object
          required_fields: [plan_name, report_path]
        LOOP_COMPLETE:
          payload: json_object
          required_fields: [plan_name, reason]
  hats:
    coordinator:
      subscribes_to: [work.start, work.done]
      publishes: [plan.ready, plan.blocked, plan.complete, work.ready]
    executor:
      subscribes_to: [plan.ready, work.ready]
      publishes: [work.done, work.failed]
    review-synthesizer:
      subscribes_to: [work.done]
      publishes: [review.failed]
    fixer:
      subscribes_to: [work.ready]
      publishes: [work.done]
    shipper:
      subscribes_to: [plan.complete, plan.blocked]
      publishes: [REVIEW_COMPLETE]
    reporter:
      subscribes_to: [REVIEW_COMPLETE]
      publishes: [report.done, LOOP_COMPLETE]

fixture_files:
  - path: .ralph/agent/progress.md
    content: |
      ## Completed Steps
  - path: .ralph/agent/tasks.jsonl
    content: |
      {"id":"fix-task-01","title":"step-01","key":"ce-executor:fix-terminal-demo:step-01:u1-impl","status":"open","priority":1,"blocked_by":[],"loop_id":null,"owner_hat_id":null,"created":"2024-01-01T00:00:00Z"}
      {"id":"fix-task-fix01","title":"fix-01","key":"ce-executor:fix-terminal-demo:fix-01:u1","status":"open","priority":1,"blocked_by":[],"loop_id":null,"owner_hat_id":null,"created":"2024-01-01T00:00:00Z"}

