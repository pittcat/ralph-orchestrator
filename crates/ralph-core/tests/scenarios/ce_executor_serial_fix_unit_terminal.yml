      {"plan_name":"fix-terminal-demo","step":"step-01","task_id":"fix-task-01","task_key":"ce-executor:fix-terminal-demo:step-01:u1-impl","complexity":"small"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.done">
      {"plan_name":"fix-terminal-demo","step":"step-01","task_id":"fix-task-01","task_key":"ce-executor:fix-terminal-demo:step-01:u1-impl"}
      </event>
    hat: executor
  - text: |
      <event topic="review.failed">
      {"plan_name":"fix-terminal-demo","task_id":"fix-task-01","task_key":"ce-executor:fix-terminal-demo:step-01:u1-impl","step":"step-01","fix_round":1,"safe_auto_count":0,"gated_manual_count":1,"findings_summary":"step-01 has 1 manual fix needed","fix_plan_file":"docs/plans/fix-terminal-demo-fix.md"}
      </event>
    hat: review-synthesizer
  - text: |
      <event topic="work.ready">
      {"plan_name":"fix-terminal-demo","step":"fix-01","task_id":"fix-task-fix01","task_key":"ce-executor:fix-terminal-demo:fix-01:u1","complexity":"small"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.done">
      {"plan_name":"fix-terminal-demo","step":"fix-01","task_id":"fix-task-fix01","task_key":"ce-executor:fix-terminal-demo:fix-01:u1"}
      </event>
    hat: fixer
  - text: |
      <event topic="plan.complete">
      {"plan_name":"fix-terminal-demo","completed_steps":["fix-01"],"task_id":"fix-task-fix01","task_key":"ce-executor:fix-terminal-demo:fix-01:u1","step":"fix-01","verdict":"pass","final_findings_count":0,"fix_round":1}
