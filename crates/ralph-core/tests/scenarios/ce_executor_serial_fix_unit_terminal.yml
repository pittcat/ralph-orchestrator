# 2026-07-02-005 BDD-2: fix-unit terminal path
#
# Plan 2026-07-02-005 Final Verification BDD-2: 覆盖
# `ce-executor-serial` 终态收口的 fix-unit 路径
# (2026-06-30-001 P0 root cause):
#
#   work.start → plan.ready (step-01)
#     → work.done (step-01) → review.failed (with fix_plan_file)
#     → work.ready (fix-01) → work.done (fix-01)
#     → plan.complete (step=fix-01, NOT work.ready)
#     → REVIEW_COMPLETE → report.done → LOOP_COMPLETE
#
# 关键:fix-unit 完成后 coordinator 必须 emit `plan.complete`
# (不是 `work.ready`);U2 fix-* step 豁免;U7 shipper 白名单
# 让 fix_plan_file 类 reason 可入账。

name: ce_executor_serial_fix_unit_terminal
description: ce-executor-serial fix-unit 路径 — plan.complete (非 work.ready) 收口 fix 单元 → REVIEW_COMPLETE → report.done → LOOP_COMPLETE

config:
  prompt_file: PROMPT.md
  max_iterations: 12
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - work.done
      publishes:
        - plan.ready
        - plan.blocked
        - plan.complete
        - work.ready
    executor:
      subscribes_to:
        - plan.ready
        - work.ready
      publishes:
        - work.done
        - work.failed
    review-synthesizer:
      subscribes_to:
        - work.done
      publishes:
        - review.failed
    fixer:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
    shipper:
      subscribes_to:
        - plan.complete
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE

mock_responses:
  # 1) coordinator → plan.ready (step-01)
  - |
    <event topic="plan.ready">
    plan_name: "fix-terminal-demo"
    step: "step-01"
    task_id: "fix-task-01"
    task_key: "ce-executor:fix-terminal-demo:step-01:u1-impl"
    complexity: "small"
    </event>
  # 2) executor → work.done (step-01)
  - |
    <event topic="work.done">
    plan_name: "fix-terminal-demo"
    step: "step-01"
    task_id: "fix-task-01"
    task_key: "ce-executor:fix-terminal-demo:step-01:u1-impl"
    </event>
  # 3) review-synthesizer → review.failed (带 fix_plan_file)
  # 注:本场景用 review.failed 演示 fix 链触发;
  # plan-level review.complete 路径走 BDD-1。
  - |
    <event topic="review.failed">
    plan_name: "fix-terminal-demo"
    task_id: "fix-task-01"
    task_key: "ce-executor:fix-terminal-demo:step-01:u1-impl"
    step: "step-01"
    fix_round: 1
    safe_auto_count: 0
    gated_manual_count: 1
    findings_summary: "step-01 has 1 manual fix needed"
    fix_plan_file: "docs/plans/fix-terminal-demo-fix.md"
    </event>
  # 4) coordinator → work.ready (fix-01)
  - |
    <event topic="work.ready">
    plan_name: "fix-terminal-demo"
    step: "fix-01"
    task_id: "fix-task-fix01"
    task_key: "ce-executor:fix-terminal-demo:fix-01:u1"
    complexity: "small"
    </event>
  # 5) fixer → work.done (fix-01)
  - |
    <event topic="work.done">
    plan_name: "fix-terminal-demo"
    step: "fix-01"
    task_id: "fix-task-fix01"
    task_key: "ce-executor:fix-terminal-demo:fix-01:u1"
    </event>
  # 6) coordinator → plan.complete (fix-01 步骤, NOT work.ready)
  # U2 修:fix-* step 走豁免;U7 shipper 白名单允许 plan.complete
  - |
    <event topic="plan.complete">
    plan_name: "fix-terminal-demo"
    completed_steps: 1
    task_id: "fix-task-fix01"
    task_key: "ce-executor:fix-terminal-demo:fix-01:u1"
    step: "fix-01"
    verdict: "pass"
    </event>
  # 7) shipper → REVIEW_COMPLETE
  - |
    <event topic="REVIEW_COMPLETE">
    plan_name: "fix-terminal-demo"
    verdict: "pass"
    pass_or_fail: "pass"
    residual_findings_summary: "fix-01 applied successfully"
    </event>
  # 8) reporter → report.done
  - |
    <event topic="report.done">
    plan_name: "fix-terminal-demo"
    report_path: ".ralph/agent/reports/fix-terminal-demo.md"
    awaiting_decision: false
    </event>
  # 9) reporter → LOOP_COMPLETE
  - |
    <event topic="LOOP_COMPLETE">
    plan_name: "fix-terminal-demo"
    reason: "fix_unit_terminal_reached"
    </event>

expected:
  iterations: 9
  events:
    - topic: plan.ready
    - topic: work.done
    - topic: review.failed
    - topic: work.ready
    - topic: work.done
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    - topic: report.done
  absent_events:
    - topic: plan.blocked
    - topic: work.failed
  completion: true
