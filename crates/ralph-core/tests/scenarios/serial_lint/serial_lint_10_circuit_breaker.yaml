# serial_lint_10: circuit_breaker — 连续 lint rejections 保持有界
#
# Plan 2026-06-20-002（以及原 2026-06-20-001 U6 表）曾要求就
# `consecutive_lint_rejections >= 3 → linter_disabled` 转移做
# circuit-breaker 断言。当前 `LoopState`（event_loop::loop_state
# 类型）中已有该字段（plan 2026-06-20-001 KTD-7 / RISK-6）：
#   - `consecutive_engine_gate_rejections: u32`
#   - `lint_circuit_breaker_tripped: bool`
# 阈值 `LINT_CIRCUIT_BREAKER_LIMIT = 2`，由 `engine_required_field_filter`
# 在第 2 次连续全 reject 时 latch。`should_run_engine_gate` 在 latch
# 为 true 时短路（`return false`），d623c09 runtime gates 保持运行。
#
# 本场景断言 circuit-breaker 落地后的新不变式：
#   - iter 2 / 3：engine gate 拒收 → 每次都播种 hint，counter 递增
#   - iter 3：counter 达 2，breaker latch；hint 仍被本次拒收播种
#   - iter 4：build_prompt 消费 iter-3 hint（→ 含 `## LINT RESUME REQUIRED`）
#     engine gate 已短路 → 不再播种新 hint；breaker latch 保持
#   - iter 5 / 6：合法 emit 仍被接受，hint slot 保持清空，breaker
#     latch 保持（one-way until loop restart）
#
# 2026-06-20-002 plan U6：scenario 10 of 11。
# 2026-06-20-001 plan v3.3 + KTD-7：原 "iter 4 仍播种 hint" 断言被
# 替换为 "iter 3 trip + iter 4 consume-on-use"；本 YAML 与
# `state.lint_circuit_breaker_tripped` 实现同步演化。

name: serial_lint_10_circuit_breaker
description: 三次连续 engine-gate rejection 触发 circuit breaker——iter 3 trip,iter 4 consume-on-use,iter 5/6 合法 emit 仍接受

config:
  prompt_file: PROMPT.md
  max_iterations: 6
  hats:
    executor:
      name: "Executor"
      subscribes_to:
        - task.start
      publishes:
        - work.done
  event_loop:
    execution_mode: isolated
    starting_event: "task.start"
    completion_promise: "LOOP_COMPLETE"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.done:
          required_fields:
            - plan_name
            - step
            - commit_count

mock_responses:
  - text: |
      <event topic="task.start">
      {"plan_name":"plan-s","task_id":"t1","step":"step-01"}
      </event>
    hat: executor
  # iter 2: invalid #1 — engine gate rejects; counter=1; hint seeded.
  - text: |
      <event topic="work.done">
      {"commit_count":1}
      </event>
    hat: executor
  # iter 3: invalid #2 — engine gate rejects; counter=2 → TRIP.
  # 本次调用内先拒收后 latch，hint 仍被本次播种。
  - text: |
      <event topic="work.done">
      {"commit_count":2}
      </event>
    hat: executor
  # iter 4: invalid #3 — engine gate 已 bypass（tripped），无 hint 播种；
  # 但 build_prompt 消费 iter-3 留下的 hint（→ 含 `## LINT RESUME REQUIRED`）。
  - text: |
      <event topic="work.done">
      {"commit_count":3}
      </event>
    hat: executor
  # iter 5: 合法 task.start。breaker latch 保持；engine gate bypass；无 hint。
  - text: |
      <event topic="task.start">
      {"plan_name":"plan-s","task_id":"t1","step":"step-02"}
      </event>
    hat: executor
  # iter 6: 合法 work.done。engine gate bypass → 合法 emit 仍通过 d623c09。
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-s","step":"step-02","commit_count":4}
      </event>
    hat: executor

expected:
  iterations: 6
  events:
    - topic: work.done
  completion: false
  assert_state:
    - at_iteration: 1
      pending_lint_resume_cleared: {}
    # iter 2 / 3: 每次 engine-gate rejection 播种 hint，counter 递增。
    - at_iteration: 2
      pending_lint_resume:
        topic: work.done
        reason_contains: "missing"
    - at_iteration: 2
      lint_circuit_breaker:
        tripped: false
    - at_iteration: 3
      pending_lint_resume:
        topic: work.done
        reason_contains: "missing"
    - at_iteration: 3
      lint_circuit_breaker:
        tripped: true
    # iter 4: build_prompt 消费 iter-3 hint（prompt_injects 移到 iter 4
    # 因为 consume 发生在 iter 4 的 build_prompt，比 baseline 提前 1 iter）；
    # engine gate 已 bypass，iter 4 本身不再播种新 hint。
    - at_iteration: 4
      prompt_injects:
        hat: ralph
        block: "## LINT RESUME REQUIRED"
    - at_iteration: 4
      pending_lint_resume_cleared: {}
    - at_iteration: 4
      lint_circuit_breaker:
        tripped: true
    # iter 5 / 6: 合法 emit；breaker latch 保持；hint slot 保持清空。
    - at_iteration: 5
      pending_lint_resume_cleared: {}
    - at_iteration: 5
      lint_circuit_breaker:
        tripped: true
    - at_iteration: 6
      pending_lint_resume_cleared: {}
    - at_iteration: 6
      lint_circuit_breaker:
        tripped: true