# serial_lint_7: R7-7 / R19 — handoff_seeds_coverage（preset 端 smoke）
#
# 断言 serial_lint_6 用的最小 2-hat 拓扑对 event loop **合法**:
# `executor` ↔ `reviewer` handoff 已注册,`reviewer.subscribes_to`
# 覆盖 `executor` 发布的 `work.done` topic,且上一个场景以行为方式
# 验证的 auto-prepare hook 所需的全部输入都已存在于 runtime
# registry。
#
# 实现说明:本场景走 **coordinator** 模式而非 isolated。
# isolated 模式下 2-hat 拓扑激活 hat_handoff_gate,要求每个
# emit 显式带 `from_hat` 来源。coordinator 模式仍走完拓扑
# 接线,又不把场景和 hat_handoff_gate 的 from_hat 契约耦合。
# 此 preset 端的 seed-coverage 检查（runtime smoke 的静态对照）
# 由 `preset_lint` 强制,通过 `cargo run -p ralph-cli --
# preset lint <file>` 验证——这不属于本 BDD 场景的职责。
#
# 2026-06-20-002 plan U5:handoff-coverage 两个场景中的第二个,
# 与 serial_lint_6 配对——后者走 auto-prepare consume 路径。

name: serial_lint_7_handoff_seeds_coverage
description: 最小 2-hat 拓扑已注册；reviewer 订阅 work.done,auto-prepare seeds 齐备

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    executor:
      name: "Executor"
      subscribes_to:
        - task.start
      publishes:
        - work.done
    reviewer:
      name: "Reviewer"
      subscribes_to:
        - work.done
      publishes:
        - review.done
  # coordinator 模式:拓扑 smoke,绕开 hat_handoff_gate 的 from_hat
  # 契约。详见文件头注释。
  event_loop:
    execution_mode: coordinator
    starting_event: "task.start"
    completion_promise: "LOOP_COMPLETE"
    # engine gate 要求 `execution_mode != Coordinator`,
    # 故本场景的 coordinator 模式关闭 engine gate。OK:本场景
    # 验证的是拓扑接线,不是 engine-gate rejections。
    hat_handoff:
      enabled: true
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.done:
          required_fields:
            - plan_name
            - step
            - commit_count

mock_responses:
  - text: |
      <event topic="task.start">
      {"plan_name":"plan-s","task_id":"t1","step":"step-01"}
      </event>
    hat: executor
  # iter 2:schema-VALID work.done,来自 executor。coordinator 模式下,
  # 该 topic 直接落到 seen_topics（不受 hat_handoff_gate 干扰）——
  # 即"拓扑接线正确"的 smoke。
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-s","step":"step-01","commit_count":1}
      </event>
    hat: executor
  # iter 3:由 reviewer emit review.done,关闭第二个 hat 的循环。
  # `review.done` topic 有结构化 payload 契约（event_parser::
  # parse_review_json）：payload 必须是 JSON 对象,且 `checks.tests`
  # 与 `checks.build` 设为 `"pass"`（或 sentinel 变体）。
  # 其他任何取值都会被 runtime 的 review status 检查改写成
  # `review.blocked`。
  - text: |
      <event topic="review.done">
      {"checks":{"tests":"pass","build":"pass"}}
      </event>
    hat: reviewer

expected:
  iterations: 3
  # smoke:两个 topic 都落到 seen_topics。某次回归若丢掉了
  # review.done（在 reviewer 的 publishes 中）或因 hat 接线漂移
  # 在 origin guard 拒绝该 topic,本断言会失败。
  events:
    - topic: work.done
    - topic: review.done
  completion: false
  # 全迭代状态断言:确认 loop 处于良好静止状态——无 hint、
  # 无 digest 条目。某次回归若在 happy path 上错误播种 hint
  # （例如 engine gate accept 路径误播种 hint）,本断言失败。
  assert_state:
    - at_iteration: 1
      pending_lint_resume_cleared: {}
    - at_iteration: 2
      pending_lint_resume_cleared: {}
    - at_iteration: 3
      pending_lint_resume_cleared: {}