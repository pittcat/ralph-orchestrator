# serial_lint_3: R7-3 — steward guidance 不计入 rejection_digest
#
# 根据 2026-06-18-001 plan U6（event_loop::recovery_topic_filter）：
# "recovery topic（`task.resume` / `human.guidance` / 控制类 topic）
# 不应进入 digest,调用方负责过滤。"
#
# 本场景在运行中段 emit 一个 `human.guidance` 事件,断言
# `recent_rejection_digest` 保持空——guidance 属于控制类 topic,
# 而非需要 agent 处理的 rejection。
#
# 2026-06-20-002 plan U4:digest 否定谓词的正向测试。与
# serial_lint_2 配对——后者证明真正的 rejection 会填充 digest。
#
# `human.guidance` payload 是自由文本（不受 engine gate 的
# required-fields 检查约束）,本场景使用纯文本 payload 即可。

name: serial_lint_3_steward_guidance_exempt
description: human.guidance 事件**不得**写入 recent_rejection_digest（控制类 topic 过滤）

config:
  prompt_file: PROMPT.md
  max_iterations: 2
  hats:
    executor:
      name: "Executor"
      subscribes_to:
        - task.start
        - human.guidance
      publishes:
        - work.done
  event_loop:
    execution_mode: isolated
    starting_event: "task.start"
    completion_promise: "LOOP_COMPLETE"
    hat_handoff:
      enabled: true
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.done:
          required_fields:
            - plan_name
            - step
            - commit_count

mock_responses:
  - text: |
      <event topic="task.start">
      {"plan_name":"plan-s","task_id":"t1","step":"step-01"}
      </event>
    hat: executor
  # iter 2:emit human.guidance 事件。依据 U6 过滤规则,
  # 其**不**得进入 `recent_rejection_digest`。
  - text: |
      <event topic="human.guidance">
      please pivot to a smaller scope
      </event>
    hat: ralph

expected:
  iterations: 2
  events: []
  completion: false
  # 唯一的负载级断言:guidance 事件之后 digest 仍为空。
  # 同时再次确认 slot 保持清空,让 smoke 更紧凑。
  assert_state:
    - at_iteration: 1
      pending_lint_resume_cleared: {}
    - at_iteration: 2
      pending_lint_resume_cleared: {}
    # digest 必须保持为空:空谓词（无 contains_topic、无 contains_reason）
  # 意味着"仍为空"。
    - at_iteration: 2
      rejection_digest_contains: {}