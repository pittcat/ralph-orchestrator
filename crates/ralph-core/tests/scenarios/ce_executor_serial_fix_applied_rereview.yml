# ce_executor_serial_fix_applied_rereview: fix → re-review → review.passed →
# plan-gate dual-publish handoff (AE5, multi-step)
#
# 2026-06-18-004 plan U4 (R1, R6): BDD scenario pinning the
# fix→re-review→`review.passed`→plan-gate handoff that the
# perky-maple loop missed (P1-3, P2-5). After `fix.applied` is
# accepted the `review-coordinator` MUST walk a fresh 4-dim
# sequence (U1 policy prune + U3 obligations close the
# perky-maple shortcut paths), the 2nd round's
# `review.dimensions.complete` carries the next `fix_round`
# (U0 schema SSOT, U5 dedup), and `plan-gate` dispatches the
# **AE5 dual-publish** (`queue.advance` + `work.ready` for the
# next step) in a single iteration, then the executor picks up
# step-02 and walks its own review chain before plan-gate finally
# emits `plan.complete(completed_steps=[step-01, step-02])`.
#
# The plan is intentionally multi-step (`step-01` then `step-02`)
# so plan-gate's decision logic routes through the dual-publish
# branch (`next_step != null`) instead of the single-step
# `plan.complete` shortcut. This is the structural smoke alarm
# for AE5: any future change that closes the re-review window,
# breaks the dual-publish handoff, or short-circuits step-02's
# executor + review pass must fail this BDD before integration
# tests do.

name: ce_executor_serial_fix_applied_rereview
description: |
  ce-executor-serial fix → re-review → review.passed → plan-gate AE5
  dual-publish handoff (multi-step plan). Pin U0/U1/U3/U5 contracts
  end-to-end with stub events, including step-02's executor run and
  review pass so the dual-publish is observable instead of short-circuited.

config:
  prompt_file: PROMPT.md
  max_iterations: 50
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - work.ready
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
    # U3: review-coordinator subscribes to fix.applied so the
    # 2nd-round walk can start. U1 dedup prune is what makes
    # the 2nd round's `review.dimension.ready` legal.
    review-coordinator:
      subscribes_to:
        - work.done
        - fix.applied
        - review.dimension.done
      publishes:
        - review.dimension.ready
        - review.dimensions.complete
    dimension-reviewer:
      subscribes_to:
        - review.dimension.ready
      publishes:
        - review.dimension.done
    review-synthesizer:
      subscribes_to:
        - review.dimensions.complete
      publishes:
        - review.passed
        - review.failed
    fixer:
      subscribes_to:
        - review.failed
      publishes:
        - fix.applied
    plan-gate:
      subscribes_to:
        - review.passed
      publishes:
        - queue.advance
        - work.ready
        - plan.complete
    shipper:
      subscribes_to:
        - plan.complete
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - LOOP_COMPLETE

# Round 1 (fix_round=0): work.done → 4×(ready→done) → complete
# (fix_round=0) → review.failed → fix.applied(fix_round=1).
# Round 2 (fix_round=1): 4×(ready→done) → complete(fix_round=1)
# → review.passed (step-01) → plan-gate **dual-publishes**
# `queue.advance` + `work.ready` for step-02 (AE5 carve-out: both
# events in the same iteration).
# Step-02 (no fix): executor → work.done → 4×(ready→done) →
# complete(fix_round=0) → review.passed (step-02) → plan-gate →
# `plan.complete(completed_steps=[step-01, step-02])` →
# shipper → REVIEW_COMPLETE → reporter → LOOP_COMPLETE.
#
# 39 iterations covers 39 stub events (one event emitted per
# iteration, except the AE5 dual-publish iter which carries two
# events in one turn).
mock_responses:
  # 0. coordinator parses plan
  - |
    <event topic="work.start" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01">
    Plan parsed.
    </event>
  # 1. coordinator emits work.ready
  - |
    <event topic="work.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" complexity="small">
    Work ready.
    </event>
  # 2. executor completes (1 commit)
  - |
    <event topic="work.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" commit_count="1" changed_lines="10">
    Implementation done.
    </event>
  # 3. review-coordinator kicks correctness (round 1)
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="correctness" focus="logic" depth="standard" diff_base="HEAD~1" intent_summary="Round 1" changed_files="src/foo.rs">
    Round 1 dim 1.
    </event>
  # 4. dimension-reviewer completes correctness with 1 P0
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="correctness" findings_count="1" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-correctness-t1.json">
    Round 1 correctness done.
    </event>
  # 5. review-coordinator kicks testing
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="testing" focus="coverage" depth="standard" diff_base="HEAD~1" intent_summary="Round 1" changed_files="src/foo.rs">
    Round 1 dim 2.
    </event>
  # 6. dimension-reviewer completes testing
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="testing" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-testing-t1.json">
    Round 1 testing done.
    </event>
  # 7. review-coordinator kicks maintainability
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="maintainability" focus="structure" depth="standard" diff_base="HEAD~1" intent_summary="Round 1" changed_files="src/foo.rs">
    Round 1 dim 3.
    </event>
  # 8. dimension-reviewer completes maintainability
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="maintainability" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-maintainability-t1.json">
    Round 1 maintainability done.
    </event>
  # 9. review-coordinator kicks requirements
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="requirements" focus="R-IDs" depth="standard" diff_base="HEAD~1" intent_summary="Round 1" changed_files="src/foo.rs">
    Round 1 dim 4.
    </event>
  # 10. dimension-reviewer completes requirements
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="requirements" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-requirements-t1.json">
    Round 1 requirements done.
    </event>
  # 11. review-coordinator closes round 1 (U0/U5: fix_round=0)
  - |
    <event topic="review.dimensions.complete" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" fix_round="0" dimensions='[{"dimension":"correctness","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-correctness-t1.json"},{"dimension":"testing","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-testing-t1.json"},{"dimension":"maintainability","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-maintainability-t1.json"},{"dimension":"requirements","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-requirements-t1.json"}]'>
    Round 1 closed.
    </event>
  # 12. review-synthesizer emits review.failed (1 P0)
  - |
    <event topic="review.failed" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" fix_round="0" safe_auto_count="1" gated_manual_count="0" findings_summary="1 P0 in correctness">
    Round 1 failed.
    </event>
  # 13. fixer.applied (fix_round=1) — U1 prune triggers here
  - |
    <event topic="fix.applied" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" fix_round="1" applied_count="1" failed_count="0" commit_count="1" changed_lines="3">
    Fix applied.
    </event>
  # === ROUND 2 — U1 dedup prune makes these ready emits legal ===
  # 14. review-coordinator kicks correctness (round 2)
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="correctness" focus="logic" depth="standard" diff_base="HEAD" intent_summary="Round 2" changed_files="src/foo.rs">
    Round 2 dim 1.
    </event>
  # 15. dimension-reviewer completes correctness
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="correctness" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-correctness-t1.json">
    Round 2 correctness done.
    </event>
  # 16. review-coordinator kicks testing
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="testing" focus="coverage" depth="standard" diff_base="HEAD" intent_summary="Round 2" changed_files="src/foo.rs">
    Round 2 dim 2.
    </event>
  # 17. dimension-reviewer completes testing
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="testing" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-testing-t1.json">
    Round 2 testing done.
    </event>
  # 18. review-coordinator kicks maintainability
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="maintainability" focus="structure" depth="standard" diff_base="HEAD" intent_summary="Round 2" changed_files="src/foo.rs">
    Round 2 dim 3.
    </event>
  # 19. dimension-reviewer completes maintainability
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="maintainability" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-maintainability-t1.json">
    Round 2 maintainability done.
    </event>
  # 20. review-coordinator kicks requirements
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="requirements" focus="R-IDs" depth="standard" diff_base="HEAD" intent_summary="Round 2" changed_files="src/foo.rs">
    Round 2 dim 4.
    </event>
  # 21. dimension-reviewer completes requirements
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" dimension="requirements" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-requirements-t1.json">
    Round 2 requirements done.
    </event>
  # 22. review-coordinator closes round 2 (U0/U5: fix_round=1, distinct from round 1)
  - |
    <event topic="review.dimensions.complete" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" fix_round="1" dimensions='[{"dimension":"correctness","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-correctness-t1.json"},{"dimension":"testing","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-testing-t1.json"},{"dimension":"maintainability","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-maintainability-t1.json"},{"dimension":"requirements","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-requirements-t1.json"}]'>
    Round 2 closed.
    </event>
  # 23. review-synthesizer emits review.passed (round 2 verdict)
  - |
    <event topic="review.passed" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t1" task_key="k1" step="step-01" findings_count="0" fix_round="1" verdict="pass" skip_reason="dimensions_complete">
    Round 2 passed.
    </event>
  # 24. plan-gate AE5 dual-publish: queue.advance + work.ready for step-02
  # in the SAME iteration. The dual-publish carve-out (WAC-U4 / KTD-12)
  # admits this exact pair in one turn; only `queue.advance` is audited,
  # only `work.ready` wakes the executor.
  - |
    <event topic="queue.advance" plan_name="plan-r" completed_step="step-01" next_step="step-02" reviewed_task_id="t1" reviewed_task_key="k1">
    Advance.
    </event>
    <event topic="work.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" complexity="small" reviewed_task_id="t1" reviewed_task_key="k1" completed_step="step-01" next_step="step-02">
    Step-02 ready.
    </event>
  # 25. executor completes step-02 (1 commit)
  - |
    <event topic="work.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" commit_count="1" changed_lines="8">
    Step-02 done.
    </event>
  # 26. review-coordinator kicks correctness (step-02, round 1)
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="correctness" focus="logic" depth="standard" diff_base="HEAD~1" intent_summary="Step-02 round 1" changed_files="src/bar.rs">
    Step-02 dim 1.
    </event>
  # 27. dimension-reviewer completes correctness (step-02)
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="correctness" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-correctness-t2.json">
    Step-02 correctness done.
    </event>
  # 28. review-coordinator kicks testing (step-02)
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="testing" focus="coverage" depth="standard" diff_base="HEAD~1" intent_summary="Step-02 round 1" changed_files="src/bar.rs">
    Step-02 dim 2.
    </event>
  # 29. dimension-reviewer completes testing (step-02)
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="testing" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-testing-t2.json">
    Step-02 testing done.
    </event>
  # 30. review-coordinator kicks maintainability (step-02)
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="maintainability" focus="structure" depth="standard" diff_base="HEAD~1" intent_summary="Step-02 round 1" changed_files="src/bar.rs">
    Step-02 dim 3.
    </event>
  # 31. dimension-reviewer completes maintainability (step-02)
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="maintainability" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-maintainability-t2.json">
    Step-02 maintainability done.
    </event>
  # 32. review-coordinator kicks requirements (step-02)
  - |
    <event topic="review.dimension.ready" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="requirements" focus="R-IDs" depth="standard" diff_base="HEAD~1" intent_summary="Step-02 round 1" changed_files="src/bar.rs">
    Step-02 dim 4.
    </event>
  # 33. dimension-reviewer completes requirements (step-02)
  - |
    <event topic="review.dimension.done" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" dimension="requirements" findings_count="0" findings_file=".agents/scratchpad/ce-executor/plan-r/findings-requirements-t2.json">
    Step-02 requirements done.
    </event>
  # 34. review-coordinator closes step-02 round 1 (fix_round=0, no findings)
  - |
    <event topic="review.dimensions.complete" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" fix_round="0" dimensions='[{"dimension":"correctness","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-correctness-t2.json"},{"dimension":"testing","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-testing-t2.json"},{"dimension":"maintainability","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-maintainability-t2.json"},{"dimension":"requirements","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-requirements-t2.json"}]'>
    Step-02 round 1 closed.
    </event>
  # 35. review-synthesizer emits review.passed for step-02 (round 1, no fix)
  - |
    <event topic="review.passed" plan_name="plan-r" plan_path="docs/plans/r.md" task_id="t2" task_key="k2" step="step-02" findings_count="0" fix_round="0" verdict="pass" skip_reason="dimensions_complete">
    Step-02 passed.
    </event>
  # 36. plan-gate emits plan.complete (both steps)
  - |
    <event topic="plan.complete" plan_name="plan-r" completed_steps="[step-01,step-02]" task_id="t2" task_key="k2" verdict="pass">
    Plan complete.
    </event>
  # 37. shipper emits REVIEW_COMPLETE
  - |
    <event topic="REVIEW_COMPLETE" plan_name="plan-r" verdict="pass" pass_or_fail="pass" residual_findings_summary="none">
    Reviewed.
    </event>
  # 38. reporter emits LOOP_COMPLETE
  - |
    <event topic="LOOP_COMPLETE" plan_name="plan-r" reason="fix-applied re-review success + step-02 pass">
    Done.
    </event>

