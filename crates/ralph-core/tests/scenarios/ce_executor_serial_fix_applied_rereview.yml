# ce_executor_serial_fix_applied_rereview: fix → re-test → re-review → review.complete
#
# 2026-06-24 P0-2/P0-3 rewrite: aligns with the 10-hat production
# topology (TDD executor + validator + 2-dim review + no plan-gate).
# The old 4-dim + review.passed/review.failed + plan-gate + queue.advance
# topology was stale and silently passed via the `run_scenario` stub.
#
# Wire-level chain (single-step plan, one fix round):
#   work.start → work.ready → work.done → test.failed
#   → fix.applied (fix_round=1)
#   → test.passed (re-run after fix)
#   → review.start
#   → review.dimension.ready (correctness) → review.dimension.done
#   → review.dimension.ready (testing)     → review.dimension.done
#   → review.dimensions.complete (fix_round=1)
#   → review.complete (fix_plan_file="null", verdict=pass, fix_round=1)
#   → plan.complete (verdict=pass, fix_round=1)
#   → REVIEW_COMPLETE (pass)
#   → report.done → LOOP_COMPLETE
#
# Asserts: test.failed → fix.applied → test.passed recovery path,
# 2-dim review (not 4-dim), review.complete (not review.passed),
# no queue.advance, no plan-gate, no fix.exhausted.

name: ce_executor_serial_fix_applied_rereview
description: |
  ce-executor-serial fix → re-test → 2-dim re-review → review.complete
  (single-step plan, one fix round). Pins the new 10-hat topology
  end-to-end with stub events.

config:
  prompt_file: PROMPT.md
  max_iterations: 30
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - test.passed
        - review.complete
        - work.failed
      publishes:
        - work.ready
        - review.start
        - plan.complete
        - plan.blocked
    executor:
      subscribes_to:
        - work.ready
        - fix.exhausted
      publishes:
        - work.done
        - work.failed
    validator:
      subscribes_to:
        - work.done
        - fix.applied
      publishes:
        - test.passed
        - test.failed
    fixer:
      subscribes_to:
        - test.failed
      publishes:
        - fix.applied
        - fix.exhausted
    review-coordinator:
      subscribes_to:
        - review.start
        - review.dimension.done
        - review.dimension.failed
      publishes:
        - review.dimension.ready
        - review.dimensions.complete
    dimension-reviewer:
      subscribes_to:
        - review.dimension.ready
      publishes:
        - review.dimension.done
        - review.dimension.failed
    review-synthesizer:
      subscribes_to:
        - review.dimensions.complete
      publishes:
        - review.complete
    shipper:
      subscribes_to:
        - plan.complete
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.ready:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - complexity
          payload: json_object
        work.done:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - commit_count
            - changed_lines
          payload: json_object
        test.passed:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - tests_run
            - tests_passed
          payload: json_object
        test.failed:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - failures
            - test_errors
          payload: json_object
        fix.applied:
          required_fields:
            - plan_name
            - fix_round
            - applied_count
            - failed_count
            - task_id
            - task_key
            - step
            - commit_count
            - changed_lines
          payload: json_object
        review.start:
          required_fields:
            - plan_name
            - task_id
            - task_key
          payload: json_object
        review.dimension.ready:
          required_fields:
            - dimension
            - focus
            - depth
            - diff_base
            - intent_summary
            - changed_files
            - plan_name
            - task_id
            - task_key
            - step
          payload: json_object
        review.dimension.done:
          required_fields:
            - dimension
            - findings_count
            - findings_file
            - plan_name
            - task_id
            - task_key
            - step
          payload: json_object
        review.dimensions.complete:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - dimensions
            - fix_round
          payload: json_object
        review.complete:
          required_fields:
            - plan_name
            - fix_round
            - fix_plan_file
            - verdict
            - residual_findings_count
            - findings_summary
            - task_id
            - task_key
            - step
            - findings_count
          payload: json_object
        plan.complete:
          required_fields:
            - plan_name
            - completed_steps
            - task_id
            - task_key
            - verdict
            - final_findings_count
            - fix_round
          payload: json_object

mock_responses:
  # 0. coordinator parses plan
  - text: |
      <event topic="work.start">
      {"plan_name":"plan-r","plan_path":"docs/plans/r.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  # 1. coordinator emits work.ready
  - text: |
      <event topic="work.ready">
      {"plan_name":"plan-r","plan_path":"docs/plans/r.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small"}
      </event>
    hat: coordinator
  # 2. executor completes (1 commit)
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-r","plan_path":"docs/plans/r.md","task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":10}
      </event>
    hat: executor
  # 3. validator emits test.failed (1 failure)
  - text: |
      <event topic="test.failed">
      {"plan_name":"plan-r","task_id":"t1","task_key":"k1","step":"step-01","failures":1,"test_errors":0}
      </event>
    hat: validator
  # 4. fixer applies fix (fix_round=1)
  - text: |
      <event topic="fix.applied">
      {"plan_name":"plan-r","fix_round":1,"applied_count":1,"failed_count":0,"task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":3}
      </event>
    hat: fixer
  # 5. validator re-runs tests → test.passed
  - text: |
      <event topic="test.passed">
      {"plan_name":"plan-r","task_id":"t1","task_key":"k1","step":"step-01","tests_run":5,"tests_passed":5}
      </event>
    hat: validator
  # 6. coordinator emits review.start (all units + fix-units done)
  - text: |
      <event topic="review.start">
      {"plan_name":"plan-r","task_id":"t1","task_key":"k1"}
      </event>
    hat: coordinator
  # 7. review-coordinator kicks correctness
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"correctness","focus":"logic correctness","depth":"standard","diff_base":"HEAD","intent_summary":"post-fix review","changed_files":"src/foo.rs","plan_name":"plan-r","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 8. dimension-reviewer completes correctness
  - text: |
      <event topic="review.dimension.done">
      {"dimension":"correctness","findings_count":0,"findings_file":".agents/scratchpad/ce-executor/plan-r/findings-correctness-t1.json","plan_name":"plan-r","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: dimension-reviewer
  # 9. review-coordinator kicks testing
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"testing","focus":"test coverage","depth":"standard","diff_base":"HEAD","intent_summary":"post-fix review","changed_files":"src/foo.rs","plan_name":"plan-r","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 10. dimension-reviewer completes testing
  - text: |
      <event topic="review.dimension.done">
      {"dimension":"testing","findings_count":0,"findings_file":".agents/scratchpad/ce-executor/plan-r/findings-testing-t1.json","plan_name":"plan-r","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: dimension-reviewer
  # 11. review-coordinator closes the sequence (fix_round=1)
  - text: |
      <event topic="review.dimensions.complete">
      {"plan_name":"plan-r","task_id":"t1","task_key":"k1","step":"step-01","fix_round":1,"dimensions":[{"dimension":"correctness","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-correctness-t1.json"},{"dimension":"testing","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-r/findings-testing-t1.json"}]}
      </event>
    hat: review-coordinator
  # 12. review-synthesizer emits review.complete (pass, no fix plan, fix_round=1)
  - text: |
      <event topic="review.complete">
      {"plan_name":"plan-r","fix_round":1,"fix_plan_file":"null","verdict":"pass","residual_findings_count":0,"findings_summary":"no findings","task_id":"t1","task_key":"k1","step":"step-01","findings_count":0}
      </event>
    hat: review-synthesizer
  # 13. coordinator emits plan.complete (verdict=pass, fix_round=1)
  - text: |
      <event topic="plan.complete">
      {"plan_name":"plan-r","completed_steps":["step-01"],"task_id":"t1","task_key":"k1","verdict":"pass","final_findings_count":0,"fix_round":1}
      </event>
    hat: coordinator
  # 14. shipper emits REVIEW_COMPLETE
  - text: |
      <event topic="REVIEW_COMPLETE">
      {"plan_name":"plan-r","verdict":"pass","pass_or_fail":"pass","residual_findings_summary":"none"}
      </event>
    hat: shipper
  # 15. reporter emits report.done
  - text: |
      <event topic="report.done">
      {"plan_name":"plan-r","status":"completed"}
      </event>
    hat: reporter
  # 16. reporter emits LOOP_COMPLETE (separate turn for clean completion check)
  - text: |
      <event topic="LOOP_COMPLETE">
      {"plan_name":"plan-r","reason":"fix-applied re-test + 2-dim re-review success"}
      </event>
    hat: reporter

expected:
  iterations: 17
  events:
    - topic: work.ready
    - topic: work.done
    # Fix recovery path
    - topic: test.failed
    - topic: fix.applied
    - topic: test.passed
    # 2-dim review
    - topic: review.start
    - topic: review.dimension.ready
    - topic: review.dimension.done
    - topic: review.dimension.ready
    - topic: review.dimension.done
    - topic: review.dimensions.complete
    - topic: review.complete
    # Plan completion
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    - topic: report.done
  absent_events:
    - topic: review.passed
    - topic: review.failed
    - topic: queue.advance
    - topic: plan.blocked
    - topic: fix.exhausted
  completion: true
