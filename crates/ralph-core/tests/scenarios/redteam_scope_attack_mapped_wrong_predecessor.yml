# 2026-08-10-002 plan U3 (R2/R6/D5): red-team attack.mapped HARD GATE
# rejects WRONG predecessor literal via the new
# `ne`-form payload_consistency rule.
#
# Schema declares `predecessor_event` as required; payload_consistency
# rule `redteam-attack-mapped-predecessor-must-be-resolved` rejects
# any value other than the literal `"redteam.plan.resolved"`. This
# fixture exercises the wrong-literal branch: attack-surface-mapper
# emits `redteam.attack.mapped` WITH `predecessor_event:
# "redteam.plan.unresolved"`. Schema accepts the field (it's
# present), but the payload_consistency rule fires; attack.mapped is
# rejected; experiment-runner does not activate; loop falls through
# to `redteam.complete(success:false)` via the plan.unresolved path.
#
# Companion to redteam_scope_attack_mapped_gate.yml (missing
# predecessor → rejected by schema required_fields) and
# redteam_scope_attack_mapped_legal_predecessor.yml (legal literal →
# accepted, experiment-runner activates, loop reaches
# redteam.complete(success:true)). Together the three fixtures form
# the predecessor matrix required by plan U3 §9.

name: redteam_scope_attack_mapped_wrong_predecessor
description: Red-team attack.mapped HARD GATE — `ne` rule rejects wrong predecessor literal `redteam.plan.unresolved`

config:
  prompt_file: PROMPT.md
  topic_format_whitelist:
    - LOOP_COMPLETE
  max_iterations: 20
  hats:
    target-locker:
      subscribes_to: []
      publishes:
        - redteam.target.locked
    plan-resolver:
      subscribes_to:
        - redteam.target.locked
      publishes:
        - redteam.plan.resolved
        - redteam.plan.unresolved
    attack-surface-mapper:
      subscribes_to:
        - redteam.plan.resolved
      publishes:
        - redteam.attack.mapped
    reporter:
      subscribes_to:
        - redteam.reviewed
        - redteam.plan.unresolved
      publishes:
        - redteam.complete
  event_loop:
    execution_mode: isolated
    starting_event: "redteam.start"
    completion_promise: "redteam.complete"
    required_events:
      - "redteam.target.locked"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        redteam.target.locked:
          required_fields:
            - target_head
            - target_tree
            - plan_count
            - lock_file_path
            - lock_status
          payload: json_object
        redteam.plan.resolved:
          required_fields:
            - resolved_count
            - unresolved_count
            - resolution_file_path
            - scope_manifest_path
            - scope_digest
            - scope_status
            - overall_confidence
            - critical_unknown_count
            - scope_base_sha
            - resolved_patch_path
            - patch_digest
            - coverage
            - critical_traceability
            - boundary_consistency
            - boundary_conflict
          payload: json_object
        redteam.plan.unresolved:
          required_fields:
            - reason
            - resolution_file_path
          payload: json_object
        redteam.attack.mapped:
          required_fields:
            - surface_count
            - experiment_count
            - attack_surface_path
            - experiment_plan_path
            - predecessor_event
          payload: json_object
        redteam.complete:
          required_fields:
            - success
            - report_path
            - plan_path
            - questions_path
          payload: json_object
      payload_consistency:
        enabled: true
        rules:
          # 2026-08-10-002 U3 (D5): runtime enforcement of the
          # attack-surface-mapper HARD GATE. Wrong predecessor literal
          # → rule fires (Hit) → emit rejected.
          - id: redteam-attack-mapped-predecessor-must-be-resolved
            topic: redteam.attack.mapped
            when:
              field: predecessor_event
              ne: "redteam.plan.resolved"
            message: "redteam.attack.mapped requires predecessor_event == 'redteam.plan.resolved'; runtime gate rejects attack.mapped emits whose predecessor is missing or has a different value."

mock_responses:
  - text: |
      <event topic="redteam.target.locked">
      {"target_head":"abc1234def5678901234567890abcdef1234567890","target_tree":"def5678901234567890abcdef1234567890abcdef0","plan_count":1,"lock_file_path":".ralph/red-team/01-target-lock.md","lock_status":"locked"}
      </event>
    hat: target-locker
  - text: |
      <event topic="redteam.plan.resolved">
      {"resolved_count":1,"unresolved_count":0,"resolution_file_path":".ralph/red-team/02-plan-resolution.md","scope_manifest_path":".ralph/red-team/scope-manifest.json","scope_digest":"abcd1234ef5678901234567890abcdef1234567890abcdef1234567890abcdef1234567890","scope_status":"resolved","overall_confidence":90,"critical_unknown_count":0,"scope_base_sha":"abc1234def5678901234567890abcdef12345678","resolved_patch_path":".ralph/red-team/patches/full-current.patch","patch_digest":"def7567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1","coverage":92,"critical_traceability":100,"boundary_consistency":true,"boundary_conflict":false}
      </event>
    hat: plan-resolver
  # attack.mapped WITH WRONG predecessor_event value. Schema accepts
  # the field (it IS present), but payload_consistency `ne` rule fires
  # because "redteam.plan.unresolved" != "redteam.plan.resolved".
  - text: |
      <event topic="redteam.attack.mapped">
      {"surface_count":1,"experiment_count":1,"attack_surface_path":".ralph/red-team/04-attack-surface.md","experiment_plan_path":".ralph/red-team/05-experiment-plan.md","predecessor_event":"redteam.plan.unresolved"}
      </event>
    hat: attack-surface-mapper
  # plan.unresolved fires after bounded retry exhaustion (same
  # fallback as redteam_scope_attack_mapped_gate.yml).
  - text: |
      <event topic="redteam.plan.unresolved">
      {"reason":"REJECTED_WRONG_PREDECESSOR","resolution_file_path":".ralph/red-team/02-plan-resolution.md"}
      </event>
    hat: plan-resolver
  - text: |
      <event topic="redteam.complete">
      {"success":false,"report_path":".ralph/red-team/REPORT.md","plan_path":"","questions_path":".ralph/red-team/QUESTIONS.md"}
      </event>
    hat: reporter

expected:
  iterations: 5
  events:
    - topic: redteam.target.locked
    - topic: redteam.plan.resolved
    - topic: redteam.complete
  completion: true
  absent_events:
    - topic: redteam.attack.mapped
  payload_matches:
    - topic: redteam.complete
      fields:
        success: false
        plan_path: ""
