# U2 Green 2b / Production Fan-In Proof: failed/timeout path via real Supervisor fan-in.
# This scenario exercises the production Supervisor fan-in seam for the failure path:
# all 6 slots register via review.unit.done → supervisor bridge injects
# review.wave.complete (fan-in success) → wave-runtime stand-in then injects
# review.wave.failed → finalizer receives it and emits LOOP_COMPLETE{result:blocked}.
#
# NOTE on review.wave.failed from coordinator: the BDD harness calls
# coordinator.tick() with elapsed_secs=0. The coordinator returns InjectedFailed
# only when elapsed_secs > aggregate_timeout_secs (wall-clock timeout simulation).
# Since the BDD harness cannot simulate wall-clock progression, we use a
# wave-runtime stand-in to inject review.wave.failed directly (per the pattern
# in implementation_review_wave_failed.yml). The supervisor bridge still handles
# the production fan-in for review.wave.complete from the 6 review.unit.done events.
#
# This scenario proves:
# 1. Supervisor fan-in injects review.wave.complete from 6 review.unit.done (production seam)
# 2. review.wave.failed routes to finalizer (not review-synthesizer) via runtime contract

name: implementation_review_wave_failed_runtime_fan_in
description: review.wave.failed via wave-runtime + real Supervisor fan-in → finalizer blocked

config:
  prompt_file: PROMPT.md
  topic_format_whitelist:
    - LOOP_COMPLETE
  max_iterations: 20
  hats:
    scope-preparer:
      subscribes_to:
        - review.start
      publishes:
        - scope.ready
        - scope.blocked
    review-dispatcher:
      subscribes_to:
        - scope.ready
      publishes:
        - review.unit.ready
    review-worker:
      subscribes_to:
        - review.unit.ready
      publishes:
        - review.unit.done
      concurrency: 6
    wave-runtime:
      # Stand-in for runtime injection of review.wave.failed.
      # In production, this event comes from the dispatcher module's
      # run_supervisor_fan_in after coordinator tick detects timeout.
      # The BDD harness cannot simulate wall-clock elapsed_secs, so
      # we use this stand-in to prove the routing contract (failed → finalizer).
      subscribes_to:
        - review.unit.done
      publishes:
        - review.wave.failed
    review-synthesizer:
      subscribes_to:
        - review.wave.complete
      publishes:
        - review.synthesized
        - review.blocked
    fix-planner:
      subscribes_to:
        - review.synthesized
      publishes:
        - fix.plan.ready
    finalizer:
      subscribes_to:
        - fix.plan.ready
        - scope.blocked
        - review.blocked
        - review.wave.failed
      publishes:
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "review.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: []
    supervisor:
      enabled: true
      max_concurrent_workers: 6
      aggregate_timeout_secs: 60
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        scope.ready:
          required_fields:
            - plan_name
            - plan_path
            - scope_digest
            - patch_path
            - patch_digest
            - scope_manifest_path
            - review_head_sha
          payload: json_object
        review.unit.ready:
          required_fields:
            - plan_name
            - scope_digest
            - dimension
            - slot_index
          payload: json_object
        review.unit.done:
          required_fields:
            - plan_name
            - scope_digest
            - dimension
            - findings_count
            - findings_file
          payload: json_object
        review.wave.complete:
          required_fields:
            - wave_id
            - completed_dimensions
          payload: json_object
        review.wave.failed:
          required_fields:
            - wave_id
            - missing_dimensions
            - reason
          payload: json_object
        LOOP_COMPLETE:
          required_fields:
            - reason
          payload: json_object

mock_responses:
  # Response 0: scope-preparer → scope.ready
  - text: |
      <event topic="scope.ready">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_path":".ralph/review/demo-plan/review.diff.patch","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","scope_manifest_path":".ralph/review/demo-plan/scope-manifest.json","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","first_implementation_commit_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","resolved_baseline_sha":"cccccccccccccccccccccccccccccccccccccccc","dirty_verdict":"clean"}
      </event>
    hat: scope-preparer
  # Response 1: review-dispatcher → review.unit.ready
  - text: |
      <event topic="review.unit.ready">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_path":".ralph/review/demo-plan/review.diff.patch","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","scope_manifest_path":".ralph/review/demo-plan/scope-manifest.json","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","first_implementation_commit_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","resolved_baseline_sha":"cccccccccccccccccccccccccccccccccccccccc","slot_index":0,"dimension":"goal-alignment","idempotency_payload_version":1}
      </event>
    hat: review-dispatcher
  # Responses 2-7: six review-worker activations → supervisor fan-in injects
  # review.wave.complete after all 6 slots register and complete.
  - text: |
      <event topic="review.unit.done">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","wave_id":"review-wave-1","slot_index":0,"dimension":"goal-alignment","findings_count":0,"findings_file":".ralph/review/demo-plan/dimensions/goal-alignment.md","handoff_precheck_failed":false}
      </event>
    hat: review-worker
  - text: |
      <event topic="review.unit.done">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","wave_id":"review-wave-1","slot_index":1,"dimension":"correctness","findings_count":0,"findings_file":".ralph/review/demo-plan/dimensions/correctness.md","handoff_precheck_failed":false}
      </event>
    hat: review-worker
  - text: |
      <event topic="review.unit.done">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","wave_id":"review-wave-1","slot_index":2,"dimension":"testing","findings_count":0,"findings_file":".ralph/review/demo-plan/dimensions/testing.md","handoff_precheck_failed":false}
      </event>
    hat: review-worker
  - text: |
      <event topic="review.unit.done">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","wave_id":"review-wave-1","slot_index":3,"dimension":"maintainability","findings_count":0,"findings_file":".ralph/review/demo-plan/dimensions/maintainability.md","handoff_precheck_failed":false}
      </event>
    hat: review-worker
  - text: |
      <event topic="review.unit.done">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","wave_id":"review-wave-1","slot_index":4,"dimension":"project-standards","findings_count":0,"findings_file":".ralph/review/demo-plan/dimensions/project-standards.md","handoff_precheck_failed":false}
      </event>
    hat: review-worker
  - text: |
      <event topic="review.unit.done">
      {"plan_name":"demo-plan","plan_path":"docs/plans/demo-plan.md","scope_digest":"abcd1234ef567890","patch_digest":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","review_head_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","wave_id":"review-wave-1","slot_index":5,"dimension":"adversarial","findings_count":0,"findings_file":".ralph/review/demo-plan/dimensions/adversarial.md","handoff_precheck_failed":false}
      </event>
    hat: review-worker
  # Response 8: supervisor fan-in produces review.wave.complete (injected by run_bdd_supervisor_fan_in).
  # No wave-runtime hat here for the success path — the coordinator bridge handles it.
  # Response 9: wave-runtime stand-in injects review.wave.failed (mimics coordinator timeout path).
  - text: |
      <event topic="review.wave.failed">
      {"wave_id":"review-wave-1","missing_dimensions":["testing","maintainability","project-standards","adversarial"],"reason":"worker_timeout"}
      </event>
    hat: wave-runtime
  # Response 10: finalizer → LOOP_COMPLETE{result:blocked}
  - text: |
      <event topic="LOOP_COMPLETE">
      {"reason":"implementation-review wave quality gate blocked"}
      </event>
    hat: finalizer

expected:
  iterations: 10
  events:
    - topic: scope.ready
    - topic: review.unit.ready
    - topic: review.unit.done
    - topic: review.wave.complete
    - topic: review.wave.failed
    - topic: LOOP_COMPLETE
  absent_events:
    - topic: scope.blocked
    - topic: review.synthesized
    - topic: review.blocked
    - topic: fix.plan.ready
  completion: true
  event_topic_counts:
    - topic: review.unit.done
      count: 6
