# 2026-07-06 plan U16: post-completion recovery emits blocked.
# Originally (2026-07-02-006 FV1 R12) the scenario declared a
# progress-steward hat and asserted `task.resume` was absent in
# the second iteration. After U10-U13 the ce-executor-serial
# preset no longer declares a progress-steward hat AND
# `event_loop.progress_steward.enabled` defaults to `false`.
#
# U16 rewrites this scenario to express the **post-U10**
# contract:
#   - config has NO `progress-steward` hat
#   - `event_loop.progress_steward.enabled: false`
#   - the post-completion guard still rejects any
#     `task.resume`-shaped recovery emit (the runtime's
#     `completion_after_terminal` gate covers this), but the
#     source of the guard is no longer the steward hat — it's
#     the runtime completion gate.
#   - `absent_events: [task.resume]` still holds because the
#     gate rejects ALL post-completion recovery emits, not just
#     those from a steward.

name: serial_phase_post_loop_steward_silent
description: post-completion recovery emits blocked after LOOP_COMPLETE (post-U10/U11/U12 fail-close)

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    reporter:
      subscribes_to: [report.done]
      publishes: [LOOP_COMPLETE]
    # NOTE: `progress-steward` hat is INTENTIONALLY absent.
    # Post-U10 ce-executor-serial removed this hat entirely.
    # The runtime's `completion_after_terminal` gate (U12 fail-close)
    # is the new owner of post-completion recovery suppression.
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE
    # 2026-07-06 plan U11: `progress_steward.enabled: false`.
    # The runtime stall detector MUST NOT publish `loop.stalled`
    # when this flag is false; the scenario pins the post-U11
    # contract that recovery-emit protection survives the
    # removal of the steward hat.
    progress_steward:
      enabled: false
      steward_hat_id: progress-steward
      max_steward_iterations: 1
    mechanism:
      flow:
        type: declared
        version: 1
        terminal_emits: [LOOP_COMPLETE]
        steps:
          - id: ship
            kind: sequence
            allowed_emits:
              - report.done
              - LOOP_COMPLETE

mock_responses:
  # First response: the loop's legitimate terminal path —
  # reporter emits LOOP_COMPLETE (the loop's exit signal).
  - text: |
      <event topic="LOOP_COMPLETE">
      {"plan_name":"steward-silent","reason":"post_completion_guard"}
      </event>
    hat: reporter
  # Second response: a stale-hat recovery attempt. Pre-U10 this
  # came from the `progress-steward` hat. Post-U10 the hat no
  # longer exists; the runtime's `completion_after_terminal`
  # gate rejects this emit regardless of source. The scenario
  # keeps the response shape so the assertion target
  # (`task.resume` absent) stays the same, but the `hat` field
  # is left empty because no hat owns this code path any more.
  - text: |
      <event topic="task.resume">
      {"reason":"stall_recovery","target_hat":"coordinator"}
      </event>
    hat: ""
  - |
    waiting.

expected:
  iterations: 3
  absent_events:
    - topic: task.resume
  completion: true

checkpoints:
  - after_response: 1
    honor_completion: true