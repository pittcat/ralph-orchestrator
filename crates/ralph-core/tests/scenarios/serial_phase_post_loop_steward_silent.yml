# 2026-07-02-006 FV1: R12 — steward silent after LOOP_COMPLETE honored

name: serial_phase_post_loop_steward_silent
description: post-completion recovery emits are blocked after LOOP_COMPLETE

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    reporter:
      subscribes_to: [report.done]
      publishes: [LOOP_COMPLETE]
    progress-steward:
      subscribes_to: [loop.stalled]
      publishes: [task.resume, plan.blocked]
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE
    progress_steward:
      enabled: true
      steward_hat_id: progress-steward
      max_steward_iterations: 1
    mechanism:
      flow:
        type: declared
        version: 1
        terminal_emits: [LOOP_COMPLETE]
        steps:
          - id: ship
            kind: sequence
            allowed_emits:
              - report.done
              - LOOP_COMPLETE

mock_responses:
  - text: |
      <event topic="LOOP_COMPLETE">
      {"plan_name":"steward-silent","reason":"post_completion_guard"}
      </event>
    hat: reporter
  - text: |
      <event topic="task.resume">
      {"reason":"stall_recovery","target_hat":"coordinator"}
      </event>
    hat: progress-steward
  - |
    waiting.

expected:
  iterations: 3
  absent_events:
    - topic: task.resume
  completion: true

checkpoints:
  - after_response: 1
    honor_completion: true
