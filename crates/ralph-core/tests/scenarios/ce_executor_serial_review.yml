# ce_executor_serial_review: 5-dim serial review chain end-to-end
#
# 2026-06-25 plan U8: extends the 2026-06-24 P0-2/P0-3 scenario from
# 2-dim (correctness → testing) to the 5-dim serial sequence
# (correctness → testing → maintainability → project-standards → adversarial),
# matching the 2026-06-25 plan `feat(preset): U1 5-dim` commit which
# updated review-coordinator / dimension-reviewer / review-synthesizer.
#
# The earlier 2-dim + review.passed + plan-gate + queue.advance
# topology was stale and silently passed via the `run_scenario` stub
# runner; this scenario uses the real EventLoop runner
# (`run_workflow_guard_scenario`) which asserts on the actual events
# emitted, catching topology drift.
#
# Wire-level chain (single-step plan, no fix):
#   work.start → work.ready → work.done → test.passed
#   → review.start
#   → review.dimension.ready (correctness)        → review.dimension.done
#   → review.dimension.ready (testing)            → review.dimension.done
#   → review.dimension.ready (maintainability)    → review.dimension.done
#   → review.dimension.ready (project-standards)  → review.dimension.done
#   → review.dimension.ready (adversarial)        → review.dimension.done
#   → review.dimensions.complete (fix_round=0, dimensions=5)
#   → review.complete (fix_plan_file="null", verdict=pass, fix_round=0)
#   → plan.complete (verdict=pass)
#   → REVIEW_COMPLETE (pass)
#   → report.done → LOOP_COMPLETE
#
# Asserts: 5 review.dimension.ready/done pairs (not 2 / not 4),
# review.complete (not review.passed), no queue.advance, no
# plan-gate, no plan.blocked. Any future regression that drops
# a dimension (e.g. silently collapsing back to 2-dim) fails this
# BDD via the `expected.events` count mismatch.

name: ce_executor_serial_review
description: 5-dim serial review chain for ce-executor-serial preset — TDD executor + validator + review.complete (no plan-gate)

config:
  prompt_file: PROMPT.md
  max_iterations: 25
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - test.passed
        - review.complete
        - work.failed
      publishes:
        - work.ready
        - review.start
        - plan.complete
        - plan.blocked
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
        - work.failed
    validator:
      subscribes_to:
        - work.done
        - fix.applied
      publishes:
        - test.passed
        - test.failed
    review-coordinator:
      subscribes_to:
        - review.start
        - review.dimension.done
        - review.dimension.failed
      publishes:
        - review.dimension.ready
        - review.dimensions.complete
    dimension-reviewer:
      subscribes_to:
        - review.dimension.ready
      publishes:
        - review.dimension.done
        - review.dimension.failed
    review-synthesizer:
      subscribes_to:
        - review.dimensions.complete
      publishes:
        - review.complete
    shipper:
      subscribes_to:
        - plan.complete
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.ready:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - complexity
          payload: json_object
        work.done:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - commit_count
            - changed_lines
          payload: json_object
        test.passed:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - tests_run
            - tests_passed
          payload: json_object
        review.start:
          required_fields:
            - plan_name
            - task_id
            - task_key
          payload: json_object
        review.dimension.ready:
          required_fields:
            - dimension
            - focus
            - depth
            - diff_base
            - intent_summary
            - changed_files
            - plan_name
            - task_id
            - task_key
            - step
          payload: json_object
        review.dimension.done:
          required_fields:
            - dimension
            - findings_count
            - findings_file
            - plan_name
            - task_id
            - task_key
            - step
          payload: json_object
        review.dimensions.complete:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - dimensions
            - fix_round
          payload: json_object
        review.complete:
          required_fields:
            - plan_name
            - fix_round
            - fix_plan_file
            - verdict
            - residual_findings_count
            - findings_summary
            - task_id
            - task_key
            - step
            - findings_count
          payload: json_object
        plan.complete:
          required_fields:
            - plan_name
            - completed_steps
            - task_id
            - task_key
            - verdict
            - final_findings_count
            - fix_round
          payload: json_object

mock_responses:
  # 0. coordinator parses plan
  - text: |
      <event topic="work.start">
      {"plan_name":"plan-s","plan_path":"docs/plans/s.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  # 1. coordinator emits work.ready
  - text: |
      <event topic="work.ready">
      {"plan_name":"plan-s","plan_path":"docs/plans/s.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small"}
      </event>
    hat: coordinator
  # 2. executor completes
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-s","plan_path":"docs/plans/s.md","task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":10}
      </event>
    hat: executor
  # 3. validator emits test.passed
  - text: |
      <event topic="test.passed">
      {"plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01","tests_run":5,"tests_passed":5}
      </event>
    hat: validator
  # 4. coordinator emits review.start (all units done)
  - text: |
      <event topic="review.start">
      {"plan_name":"plan-s","task_id":"t1","task_key":"k1"}
      </event>
    hat: coordinator
  # 5. review-coordinator kicks correctness
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"correctness","focus":"Logic correctness, edge cases, error propagation, state machine consistency","depth":"standard","diff_base":"HEAD~1","intent_summary":"5-dim review","changed_files":"src/foo.rs","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 6. dimension-reviewer completes correctness
  - text: |
      <event topic="review.dimension.done">
      {"dimension":"correctness","findings_count":0,"findings_file":".agents/scratchpad/ce-executor/plan-s/findings-correctness-t1.json","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: dimension-reviewer
  # 7. review-coordinator kicks testing
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"testing","focus":"Test coverage gaps, brittle assertions, behavioral changes without test additions","depth":"standard","diff_base":"HEAD~1","intent_summary":"5-dim review","changed_files":"src/foo.rs","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 8. dimension-reviewer completes testing
  - text: |
      <event topic="review.dimension.done">
      {"dimension":"testing","findings_count":0,"findings_file":".agents/scratchpad/ce-executor/plan-s/findings-testing-t1.json","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: dimension-reviewer
  # 9. review-coordinator kicks maintainability
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"maintainability","focus":"Coupling, complexity, naming, dead code, abstraction debt — adapted from ce-code-review ce-maintainability-reviewer","depth":"standard","diff_base":"HEAD~1","intent_summary":"5-dim review","changed_files":"src/foo.rs","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 10. dimension-reviewer completes maintainability
  - text: |
      <event topic="review.dimension.done">
      {"dimension":"maintainability","findings_count":0,"findings_file":".agents/scratchpad/ce-executor/plan-s/findings-maintainability-t1.json","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: dimension-reviewer
  # 11. review-coordinator kicks project-standards
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"project-standards","focus":"AGENTS.md/CLAUDE.md compliance, frontmatter, citations, portability — adapted from ce-code-review ce-project-standards-reviewer","depth":"standard","diff_base":"HEAD~1","intent_summary":"5-dim review","changed_files":"src/foo.rs","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 12. dimension-reviewer completes project-standards
  - text: |
      <event topic="review.dimension.done">
      {"dimension":"project-standards","findings_count":0,"findings_file":".agents/scratchpad/ce-executor/plan-s/findings-project-standards-t1.json","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: dimension-reviewer
  # 13. review-coordinator kicks adversarial
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"adversarial","focus":"Hidden side effects, compat breaks, edge/concurrency, unsafe paths, misleading names, test sufficiency, maintenance cost, rollback safety","depth":"standard","diff_base":"HEAD~1","intent_summary":"5-dim review","changed_files":"src/foo.rs","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 14. dimension-reviewer completes adversarial
  - text: |
      <event topic="review.dimension.done">
      {"dimension":"adversarial","findings_count":0,"findings_file":".agents/scratchpad/ce-executor/plan-s/findings-adversarial-t1.json","plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: dimension-reviewer
  # 15. review-coordinator closes the sequence (5-dim closure, fix_round=0)
  - text: |
      <event topic="review.dimensions.complete">
      {"plan_name":"plan-s","task_id":"t1","task_key":"k1","step":"step-01","fix_round":0,"dimensions":[{"dimension":"correctness","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-s/findings-correctness-t1.json"},{"dimension":"testing","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-s/findings-testing-t1.json"},{"dimension":"maintainability","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-s/findings-maintainability-t1.json"},{"dimension":"project-standards","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-s/findings-project-standards-t1.json"},{"dimension":"adversarial","status":"done","findings_file":".agents/scratchpad/ce-executor/plan-s/findings-adversarial-t1.json"}]}
      </event>
    hat: review-coordinator
  # 16. review-synthesizer emits review.complete (pass, no fix plan)
  - text: |
      <event topic="review.complete">
      {"plan_name":"plan-s","fix_round":0,"fix_plan_file":"null","verdict":"pass","residual_findings_count":0,"findings_summary":"no findings","task_id":"t1","task_key":"k1","step":"step-01","findings_count":0}
      </event>
    hat: review-synthesizer
  # 17. coordinator emits plan.complete (verdict=pass)
  - text: |
      <event topic="plan.complete">
      {"plan_name":"plan-s","completed_steps":["step-01"],"task_id":"t1","task_key":"k1","verdict":"pass","final_findings_count":0,"fix_round":0}
      </event>
    hat: coordinator
  # 18. shipper emits REVIEW_COMPLETE
  - text: |
      <event topic="REVIEW_COMPLETE">
      {"plan_name":"plan-s","verdict":"pass","pass_or_fail":"pass","residual_findings_summary":"none"}
      </event>
    hat: shipper
  # 19. reporter emits report.done
  - text: |
      <event topic="report.done">
      {"plan_name":"plan-s","status":"completed"}
      </event>
    hat: reporter
  # 20. reporter emits LOOP_COMPLETE (separate turn for clean completion check)
  - text: |
      <event topic="LOOP_COMPLETE">
      {"plan_name":"plan-s","reason":"5-dim review success"}
      </event>
    hat: reporter

expected:
  iterations: 21
  events:
    - topic: work.ready
    - topic: work.done
    - topic: test.passed
    - topic: review.start
    # 5-dim serial review hops
    - topic: review.dimension.ready
    - topic: review.dimension.done
    - topic: review.dimension.ready
    - topic: review.dimension.done
    - topic: review.dimension.ready
    - topic: review.dimension.done
    - topic: review.dimension.ready
    - topic: review.dimension.done
    - topic: review.dimension.ready
    - topic: review.dimension.done
    # Sequence closure + downstream terminal
    - topic: review.dimensions.complete
    - topic: review.complete
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    - topic: report.done
  absent_events:
    - topic: review.passed
    - topic: review.failed
    - topic: queue.advance
    - topic: plan.blocked
    - topic: fix.applied
    - topic: fix.exhausted
  completion: true
