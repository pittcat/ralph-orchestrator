# 2026-07-07-002 plan Unit 10: protocol violation bounded retry
#
# Four TaskNotTerminal work.done attempts (coordinator-owned open task)
# exhaust the protocol retry budget (U2 limit 3 → 3 task.resume + fail-close).

name: ce_executor_serial_protocol_violation_retry_then_fail_close
description: 2026-07-07-002 U10 — TaskNotTerminal corrections then protocol_violation_repeated fail-close

config:
  prompt_file: PROMPT.md
  max_iterations: 9
  tasks:
    enabled: true
    coordinator_hats:
      - coordinator
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - task.resume
      publishes:
        - work.ready
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
        - work.failed
  event_loop:
    execution_mode: isolated
    execution_contracts:
      enabled: true
      rules:
        work.done:
          require_payload_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
          require_task:
            id_field: task_id
            key_field: task_key
            loop_scoped: false
            allowed_terminal_statuses:
              - closed
            auto_close_on_valid: false
          require_git_change:
            mode: diff_or_commit
            allow_empty_for_steps:
              - trivial
          require_test_evidence:
            mode: optional

