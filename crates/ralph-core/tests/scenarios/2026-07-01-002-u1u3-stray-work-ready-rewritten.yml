# 2026-07-01-002 U1+U3 BDD scenario: stray work.ready 不阻塞终态
#
# 验证:isolated 模式下,如果 coordinator 在同一个 activation 里
# 先发 `work.ready(fix-02, last_in_phase=true)`,runtime 必须
# 通过 CoordinatorDecisionGateStage(U3) 把其改写为 plan.complete;
# loop 不应被错误地降级为 plan.blocked,也不应保留 stray
# work.ready 作为最终业务事件。
#
# 注意:scenario runner 的 `seen_topics` 在 stage 改写**前**
# 记录事件 topic,所以这里断言`absent_events`比断言
# `events`更精确——见 scenarios.rs L696 与 loop_state L1491。
#
# Plan ref: 2026-07-01-002-fix-ce-executor-serial-fix-unit-terminal-guidance-plan.md U1/U3

name: u1u3_fix_unit_stray_work_ready_rewritten_to_plan_complete
description: U1+U3 - stray work.ready(last_in_phase=true) 被改写且不阻断终态

config:
  prompt_file: PROMPT.md
  max_iterations: 6
  event_loop:
    execution_mode: isolated
    ephemeral_isolation: false
  hats:
    coordinator:
      subscribes_to:
        - work.done
      publishes:
        - plan.complete
        - work.ready
    fix-executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done

mock_responses:
  # fix-01 完成
  - |
    <event topic="work.done">
    plan_name: "u1u3-rewrite-demo"
    step: "fix-01"
    task_id: "u1u3-fix-01"
    task_key: "ce-executor:u1u3-rewrite-demo:step:fix-01:u1"
    </event>
  # fix-02 完成 — chain exhausted
  - |
    <event topic="work.done">
    plan_name: "u1u3-rewrite-demo"
    step: "fix-02"
    task_id: "u1u3-fix-02"
    task_key: "ce-executor:u1u3-rewrite-demo:step:fix-02:u2"
    </event>
  # 错发 work.ready 但带 last_in_phase=true — U3 改写为 plan.complete
  - |
    <event topic="work.ready">
    plan_name: "u1u3-rewrite-demo"
    step: {"id":"fix-02","last_in_phase":true}
    task_id: "u1u3-fix-02"
    task_key: "ce-executor:u1u3-rewrite-demo:step:fix-02:u2"
    </event>
  - |
    waiting.
  - |
    waiting.

expected:
  iterations: 5
  events:
    - topic: work.done
  absent_events:
    - topic: plan.blocked
    - topic: review.start
  completion: false
