# 2026-06-29-007 U5a: dimension-reviewer 写 plan.md hard reject
#
# BDD 覆盖:dimension_reviewer_write_paths lint 拒绝 dimension-reviewer
# 持有 docs/plans/ 写权限的 preset。单测在
# dimension_reviewer_write_paths::tests 已覆盖核心逻辑;此 scenario
# 是 preset_lint 集成冒烟,验证 lint 在 run_preset_lint 路径里不破坏
# 既有 happy path。
#
# 期望:happy path 完整跑通,无 plan.blocked 出现。

name: u5a_dimension_reviewer_scope
description: U5a - dimension_reviewer_write_paths lint 集成冒烟

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    coordinator:
      subscribes_to:
        - work.done
      publishes:
        - plan.complete
      default_publishes: plan.complete

mock_responses:
  - |
    <event topic="work.done">
    plan_name: "u5a-demo"
    step: "step-01"
    task_id: "u5a-task"
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "u5a-demo"
    verdict: pass
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 3
  events:
    - topic: work.done
    - topic: plan.complete
  absent_events:
    - topic: plan.blocked
  completion: false