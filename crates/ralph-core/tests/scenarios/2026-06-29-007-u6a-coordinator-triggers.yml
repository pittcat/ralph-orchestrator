# 2026-06-29-007 U6a: coordinator.triggers 增 review.dimensions.complete
#
# BDD 覆盖:coordinator hat 在收到 review.dimensions.complete 时被
# 激活(从 inactive → active)。preset yml 已经加上
# review.dimensions.complete 到 coordinator.triggers 列表,此
# scenario 验证 hat 状态机按声明的 trigger 唤醒。
#
# 期望:
# - coordinator 收到 review.dimensions.complete 后 emit work.ready
#   (next step)或 plan.complete
# - 无 plan.blocked 出现

name: u6a_coordinator_triggers
description: U6a - coordinator.triggers 增 review.dimensions.complete

config:
  prompt_file: PROMPT.md
  max_iterations: 4
  hats:
    coordinator:
      subscribes_to:
        - review.dimensions.complete
      publishes:
        - plan.complete
        - work.ready
      default_publishes: plan.complete

mock_responses:
  - |
    <event topic="review.dimensions.complete">
    wave_id: "u6a-wave"
    dimensions: ["d1"]
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "u6a-demo"
    verdict: pass
    </event>
  - |
    waiting.
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 4
  events:
    - topic: review.dimensions.complete
    - topic: plan.complete
  absent_events:
    - topic: plan.blocked
  completion: false