# verdict_gate_fail_keeps_loop_open: O3 regression coverage
#
# 2026-06-09: closes the "rogue LOOP_COMPLETE masks a failing review"
# gap identified by the ce-executor mechanism-vs-orchestration
# diagnosis.  The preset was documented as carrying
# pass_or_fail="fail" through REVIEW_COMPLETE → reporter →
# LOOP_COMPLETE, but neither obligation schema nor verdict_gate
# had a hard rule that prevented reporter from emitting
# LOOP_COMPLETE on a failing review.  This scenario exercises the
# defense-in-depth posture now in place:
#
#   1. reporter obligation: `conditional_forbid_topics` rejects
#      LOOP_COMPLETE in the candidate set when REVIEW_COMPLETE
#      carries pass_or_fail="fail".  (primary gate, enforced at
#      activation time)
#   2. verdict_gate: `additional_topics: ["report.done"]` means
#      that any `report.done` carrying pass_or_fail="fail" is
#      recorded as the most recent verdict payload, so a
#      follow-up LOOP_COMPLETE is rejected by `check_completion_event`
#      even if the obligation check were bypassed.  (backstop
#      gate, enforced at completion check time)
#
# Three iterations exercise the three outcomes:
#   - iter 1 (pass): REVIEW_COMPLETE pass + report.done
#     awaiting_decision=false + LOOP_COMPLETE → accepted.
#   - iter 2 (fail, no rogue): REVIEW_COMPLETE fail + report.done
#     awaiting_decision=true → LOOP_COMPLETE is rejected by
#     verdict_gate.
#   - iter 3 (fail, rogue): REVIEW_COMPLETE fail + report.done
#     awaiting_decision=true + LOOP_COMPLETE in same response →
#     still rejected: report.done pass_or_fail="fail" is enough
#     for the gate to fire on the follow-up.
#
# `completion_rejected: true` checkpoint verifies that even after
# all responses are processed, `check_completion_event` returns
# None (i.e. the loop does NOT terminate).
#
# IMPORTANT: mock_responses use JSON payloads (not XML
# attributes) because the EventParser drops XML attributes —
# only the element text becomes `event.payload`.  Real reporters
# emit via `ralph emit --payload '{json}'` so pass_or_fail ends
# up in the payload, which the verdict_gate can parse.  Using
# JSON here matches production reality.

name: verdict_gate_fail_keeps_loop_open
description: |
  Defense-in-depth verification of the 2026-06-09 fix to the
  "rogue LOOP_COMPLETE masks a failing review" regression.
  Covers reporter obligation + verdict_gate + awaiting_decision
  schema, all three layers of the O3 close.

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  event_loop:
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    # 2026-06-09: gate covers both REVIEW_COMPLETE and report.done.
    # Without `additional_topics`, a rogue LOOP_COMPLETE following
    # a failing report.done would slip through.
    verdict_gate:
      topic: "REVIEW_COMPLETE"
      fail_field: "pass_or_fail"
      fail_value: "fail"
      additional_topics: ["report.done"]
  hats:
    reporter:
      triggers: ["REVIEW_COMPLETE"]
      publishes: ["report.done", "LOOP_COMPLETE"]
      default_publishes: "report.done"
      # 2026-06-09: forbid LOOP_COMPLETE on failing review.
      # `must_emit_any_of: ["report.done"]` alone (pre-fix) lets
      # reporters emit BOTH report.done and LOOP_COMPLETE — the
      # `conditional_forbid_topics` closes that gap.
      obligations:
        - on_trigger: "REVIEW_COMPLETE"
          must_emit_any_of: ["report.done"]
          conditional_forbid_topics:
            - when:
                payload_field_equals:
                  pass_or_fail: "fail"
              forbid_topics: ["LOOP_COMPLETE"]

# Three responses covering the three outcomes.  Each response
# is what the reporter agent would emit on its single hat
# activation.  Payloads are JSON (matches the `ralph emit
# --payload '{...}'` real-world format) so the verdict_gate's
# `verdict_payload_is_fail` can extract `pass_or_fail` from them.
mock_responses:
  # iter 1: happy path.  REVIEW_COMPLETE pass → reporter emits
  # report.done with pass_or_fail="pass" mirror → LOOP_COMPLETE accepted.
  - |
    <event topic="REVIEW_COMPLETE">{"plan_name":"plan-x","verdict":"pass","pass_or_fail":"pass","residual_findings_summary":"none"}</event>
    <event topic="report.done">{"report_path":"r.md","awaiting_decision":false,"pass_or_fail":"pass","verdict":"pass"}</event>
    <event topic="LOOP_COMPLETE">{"plan_name":"plan-x"}</event>
  # iter 2: failing review, reporter behaves correctly (no
  # LOOP_COMPLETE).  report.done mirrors pass_or_fail="fail" so
  # the verdict_gate has the most recent failing verdict.  When
  # the orchestrator subsequently processes this state, completion
  # is rejected.
  - |
    <event topic="REVIEW_COMPLETE">{"plan_name":"plan-x","verdict":"fail","pass_or_fail":"fail","residual_findings_summary":"P0 in src/x.rs"}</event>
    <event topic="report.done">{"report_path":"r.md","awaiting_decision":true,"pass_or_fail":"fail","verdict":"fail"}</event>
  # iter 3: failing review, reporter emits rogue LOOP_COMPLETE.
  # This is the regression case — the BUG observed in the
  # gentle-orchid worktree (4 REVIEW_COMPLETEs, 3 fail, reporter
  # still emitted LOOP_COMPLETE).  The verdict_gate must catch
  # it: report.done pass_or_fail="fail" alone is enough for the
  # gate to reject LOOP_COMPLETE at completion check.
  - |
    <event topic="REVIEW_COMPLETE">{"plan_name":"plan-x","verdict":"fail","pass_or_fail":"fail","residual_findings_summary":"P0 in src/y.rs"}</event>
    <event topic="report.done">{"report_path":"r.md","awaiting_decision":true,"pass_or_fail":"fail","verdict":"fail"}</event>
    <event topic="LOOP_COMPLETE">{"plan_name":"plan-x"}</event>

expected:
  iterations: 3
  events:
    - topic: REVIEW_COMPLETE
    - topic: report.done
    # LOOP_COMPLETE is intentionally NOT in the seen-topics set
    # for the failing iterations — the verdict_gate rejects it
    # before it lands in seen_topics.
  # completion=false: after the third (failing) response, the
  # verdict_gate must still reject LOOP_COMPLETE — the loop
  # is NOT considered complete.
  completion: false

checkpoints:
  - after_response: 3
    completion_rejected: true
