# OPAC FV-2: ce-executor-serial 6-dim serial review walk
#
# 2026-07-04-002 plan U9 (R11 BDD): 6 个 activation (每个 dimension)
# 各 emit 一条 `review.dimension.ready`,断言全部 6 条都被 runtime
# accept,无 silent drop。
#
# 与现有 `ce_executor_serial_review.yml` 的差别:
# - 本 scenario 是 BDD minimal pin (R11 覆盖),不测完整 plan.complete
#   /REVIEW_COMPLETE/report.done 链。
# - focus 在 review-coordinator 端 6 次连续 emit review.dimension.ready
#   全部 accepted (duplicate 也不 drop),以及每条 event_topic_counts
#   = 1 (6 条全过)。
# - 6 个 dimension names 与 ce-executor-serial builtin 完全对齐:
#   goal-alignment → correctness → testing → maintainability →
#   project-standards → adversarial。
#
# 用 `run_workflow_guard_scenario`(真 EventLoop runner,
# 2026-06-24 P0-2/P0-3 教训:stub 不断言事件)。

name: opac_fv2_serial_walk_6dim
description: FV-2 - 6 次连续 review.dimension.ready 全 accept (silence/drop 不接受)

config:
  prompt_file: PROMPT.md
  max_iterations: 7
  event_loop:
    execution_mode: isolated
  hats:
    review-coordinator:
      subscribes_to:
        - review.start
      publishes:
        - review.dimension.ready
    dimension-reviewer:
      subscribes_to:
        - review.dimension.ready
      publishes:
        - review.dimension.done

mock_responses:
  # 1) review-coordinator kicks goal-alignment
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"goal-alignment","focus":"Goal-to-plan-to-code alignment","depth":"standard","diff_base":"HEAD~1","intent_summary":"6-dim walk","changed_files":"src/foo.rs","plan_name":"fv2-walk","task_id":"fv2-t-1","task_key":"k-1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 2) review-coordinator kicks correctness
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"correctness","focus":"Logic correctness","depth":"standard","diff_base":"HEAD~1","intent_summary":"6-dim walk","changed_files":"src/foo.rs","plan_name":"fv2-walk","task_id":"fv2-t-1","task_key":"k-1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 3) review-coordinator kicks testing
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"testing","focus":"Test coverage gaps","depth":"standard","diff_base":"HEAD~1","intent_summary":"6-dim walk","changed_files":"src/foo.rs","plan_name":"fv2-walk","task_id":"fv2-t-1","task_key":"k-1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 4) review-coordinator kicks maintainability
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"maintainability","focus":"Coupling, complexity, naming","depth":"standard","diff_base":"HEAD~1","intent_summary":"6-dim walk","changed_files":"src/foo.rs","plan_name":"fv2-walk","task_id":"fv2-t-1","task_key":"k-1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 5) review-coordinator kicks project-standards
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"project-standards","focus":"AGENTS.md/CLAUDE.md compliance","depth":"standard","diff_base":"HEAD~1","intent_summary":"6-dim walk","changed_files":"src/foo.rs","plan_name":"fv2-walk","task_id":"fv2-t-1","task_key":"k-1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 6) review-coordinator kicks adversarial
  - text: |
      <event topic="review.dimension.ready">
      {"dimension":"adversarial","focus":"Hidden side effects, compat breaks","depth":"standard","diff_base":"HEAD~1","intent_summary":"6-dim walk","changed_files":"src/foo.rs","plan_name":"fv2-walk","task_id":"fv2-t-1","task_key":"k-1","step":"step-01"}
      </event>
    hat: review-coordinator
  # 7) idle iteration (loop exit / no further dims)
  - text: |
      waiting.

expected:
  iterations: 7
  events:
    - topic: review.dimension.ready
    - topic: review.dimension.ready
    - topic: review.dimension.ready
    - topic: review.dimension.ready
    - topic: review.dimension.ready
    - topic: review.dimension.ready
  # R11: 6 条 review.dimension.ready 全部 accept 1 次,无 silent drop。
  event_topic_counts:
    - topic: review.dimension.ready
      count: 6
  absent_events:
    - topic: review.complete
    - topic: review.dimension.done
    - topic: plan.complete
  completion: false
