# Plan 2026-07-29-005 U7 / S7: slot failure routes through
# `forge.wave.review.failed` → `forge.correction.requested` →
# `forge.correction.done` → re-review chain, NOT a terminal
# `work.failed`. Asserts:
#
#   - exactly one `forge.wave.review.failed` is observed
#   - `forge.correction.requested` is observed once and
#     `forge.correction.done` is observed once
#   - NO `work.failed` event appears anywhere in the run
#   - the run still ends with `LOOP_COMPLETE` after the
#     corrected wave settles

name: pf_w7_slot_fail_routes_to_correction
description: 'parallel-forge slot fail routes to forge.wave.review.failed -> forge.correction.{requested,done} -> re-review -> settle, no work.failed'

config:
  prompt_file: PROMPT.md
  max_iterations: 30
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE
    supervisor:
      enabled: true
      aggregate_timeout_secs: 60
    required_events:
      - LOOP_COMPLETE
    starting_event: forge.start
  hats:
    pf-inspector:
      subscribes_to: [forge.start]
      publishes: [forge.plan.inspected]
    pf-planner:
      subscribes_to: [forge.plan.inspected]
      publishes: [forge.plan.ready]
    pf-guardian:
      subscribes_to: [forge.plan.ready]
      publishes: [forge.concurrency.approved]
    pf-worktree:
      subscribes_to:
        - forge.concurrency.approved
        - forge.wave.verified
      publishes: [forge.wave.worktrees.ready]
    pf-dispatcher:
      subscribes_to:
        - forge.wave.worktrees.ready
        - exec.unit.done
      publishes: [exec.unit.ready]
    pf-executor:
      subscribes_to: [exec.unit.ready]
      publishes: [exec.unit.done]
    pf-reviewer:
      subscribes_to:
        - exec.wave.complete
        - forge.correction.done
      publishes: [forge.wave.reviewed, forge.wave.review.failed]
    pf-failure-handler:
      subscribes_to: [forge.wave.review.failed]
      publishes: [forge.correction.requested]
    pf-wave-fixer:
      subscribes_to: [forge.correction.requested]
      publishes: [forge.correction.done]
    pf-integrator:
      subscribes_to: [forge.wave.reviewed]
      publishes: [forge.wave.integrated]
    pf-verifier:
      subscribes_to: [forge.wave.integrated]
      publishes: [forge.wave.verified]
    pf-integration:
      subscribes_to: [forge.wave.verified]
      publishes: [forge.wave.settled]
    pf-reporter:
      subscribes_to: [LOOP_COMPLETE]
      publishes: [LOOP_COMPLETE]

mock_responses:
  - text: |
      <event topic="forge.plan.inspected">
      plan_key: "pf-w7-p"
      plan_usable: true
      </event>
    hat: pf-inspector
  - text: |
      <event topic="forge.plan.ready">
      plan_key: "pf-w7-p"
      unit_count: 1
      </event>
    hat: pf-planner
  - text: |
      <event topic="forge.concurrency.approved">
      approved: true
      plan_key: "pf-w7-p"
      </event>
    hat: pf-guardian
  - text: |
      <event topic="forge.wave.worktrees.ready">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      wave_index: 1
      wave_total: 1
      verified_base_commit: "BASE"
      integration_branch: "pf/w7"
      </event>
    hat: pf-worktree
  - text: |
      <event topic="forge.wave.review.failed">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      wave_index: 1
      failure_fingerprint: "fp-w7-1"
      unit_verdicts: ["U1:REJECTED"]
      affected_task_ids: ["task-pf-w7-p-u1"]
      failure_observation_path: ".ralph/forge/pf-w7-p/waves/w1/failure-1.md"
      </event>
    hat: pf-reviewer
  - text: |
      <event topic="forge.correction.requested">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      correction_round: 0
      correction_request_path: ".ralph/forge/pf-w7-p/waves/w1/corrections/round-0.md"
      </event>
    hat: pf-failure-handler
  - text: |
      <event topic="forge.correction.done">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      wave_index: 1
      correction_round: 0
      commit_sha: "FIX-W1-1"
      affected_unit_ids: ["U1"]
      correction_report_path: ".ralph/forge/pf-w7-p/waves/w1/corrections/round-0/report.md"
      </event>
    hat: pf-wave-fixer
  - text: |
      <event topic="forge.wave.reviewed">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      wave_index: 1
      aggregate_verdict: ACCEPTED
      unit_verdicts: []
      </event>
    hat: pf-reviewer
  - text: |
      <event topic="forge.wave.integrated">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      wave_index: 1
      integration_branch: "pf/w7"
      integration_complete: true
      linear_history: true
      commit_map_path: ".ralph/forge/pf-w7-p/commit-map.yml"
      integration_log_path: ".ralph/forge/pf-w7-p/integration-log.md"
      </event>
    hat: pf-integrator
  - text: |
      <event topic="forge.wave.verified">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      wave_index: 1
      passed: true
      candidate_commit_sha: "CAND-W1"
      last_integrated_unit: "U1"
      </event>
    hat: pf-verifier
  - text: |
      <event topic="forge.wave.settled">
      plan_key: "pf-w7-p"
      wave_id: "w1"
      wave_index: 1
      settled_task_ids: ["task-pf-w7-p-u1"]
      settled_unit_ids: ["U1"]
      verified_base_commit: "CAND-W1"
      settlement_log_path: ".ralph/forge/pf-w7-p/waves/w1/settlement.md"
      </event>
    hat: pf-integration
  - text: |
      <event topic="LOOP_COMPLETE">
      </event>
    hat: pf-reporter

expected:
  iterations: 12
  events:
    - topic: forge.plan.inspected
    - topic: forge.plan.ready
    - topic: forge.concurrency.approved
    - topic: forge.wave.worktrees.ready
    - topic: forge.wave.review.failed
    - topic: forge.correction.requested
    - topic: forge.correction.done
    - topic: forge.wave.reviewed
    - topic: forge.wave.integrated
    - topic: forge.wave.verified
    - topic: forge.wave.settled
    - topic: LOOP_COMPLETE
  absent_events:
    - topic: work.failed
    - topic: exec.wave.failed
  event_topic_counts:
    - topic: forge.correction.requested
      count: 1
    - topic: forge.correction.done
      count: 1
  completion: true