# 2026-07-02-006 FV1: phase_violation resume budget (AE1 subset)

name: serial_phase_violation_resume_budget
description: Phase authority rejects out-of-phase emit with phase_violation

config:
  prompt_file: PROMPT.md
  max_iterations: 2
  event_loop:
    execution_mode: isolated
    mechanism:
      phase_authority:
        enabled: true
        initial_phase: plan_end
        phases:
          - id: plan_end
            allowed_emits:
              coordinator: [plan.complete, plan.blocked]
        transitions: []
        violation_policy:
          max_resume_per_hat: 3
          on_exhausted: plan_blocked
  hats:
    coordinator:
      subscribes_to: []
      publishes: [plan.complete, review.start]

mock_responses:
  - text: |
      <event topic="review.start">
      {"plan_id":"phase-demo"}
      </event>
    hat: coordinator
  - text: |
      waiting.

expected:
  iterations: 2
  absent_events:
    - topic: review.start
  recovery_contains:
    - phase_violation
  completion: false
