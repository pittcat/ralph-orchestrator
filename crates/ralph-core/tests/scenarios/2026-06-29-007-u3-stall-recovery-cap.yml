# 2026-06-29-007 U3: stall_recovery retry cap + 白名单
#
# BDD 覆盖:recovery_runtime retry_cap 行为 - 同一 review-chain
# retry_key 注入 ≥ 2 次后,emit ForcePlanBlocked(reason=
# <hat>_unrecoverable_after_2_retries)而非继续 task.resume。
# 非白名单 hat(executor)走原 stall_recovery 路径,不升级。
#
# 单元测试在 recovery_runtime::retry_cap::tests 已经覆盖核心
# 逻辑;此 scenario 是 recovery_runtime::dispatch 在端到端
# 场景里不打破既有行为的冒烟。

name: u3_stall_recovery_cap
description: U3 - review-chain stall retry cap 在 dispatch 路径里不破坏既有 signal

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    review-coordinator:
      subscribes_to:
        - work.done
      publishes:
        - review.dimensions.complete
      default_publishes: review.dimensions.complete

mock_responses:
  - |
    <event topic="work.done">
    plan_name: "u3-demo"
    step: "step-01"
    task_id: "u3-task"
    </event>
  - |
    <event topic="review.dimensions.complete">
    wave_id: "u3-wave"
    dimensions: ["d1"]
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 3
  events:
    - topic: work.done
    - topic: review.dimensions.complete
  absent_events:
    - topic: plan.blocked
    - topic: LOOP_COMPLETE
  completion: false