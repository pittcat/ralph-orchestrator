# plan 2026-07-29-001 U7: ce-executor-pipeline fail-gate exhaust path.
#
# retry_budget=3 → gate rejects the executor's work.failed.proposed
# three times in a row → runtime emits plan.blocked(kind=precheck_exhausted)
# directly and work.failed NEVER lands.

name: ce_executor_pipeline_fail_gate_exhaust
description: ce-executor-pipeline fail gate exhausts retry budget and runtime escalates to plan.blocked

config:
  prompt_file: PROMPT.md
  max_iterations: 8
  hats:
    executor:
      name: "Executor"
      subscribes_to:
        - task.start
        - task.resume
      publishes:
        - work.failed
  event_loop:
    execution_mode: isolated
    starting_event: "task.start"
    completion_promise: "LOOP_COMPLETE"
    precheck:
      enabled: true
      rules:
        work.failed:
          prompt:
            - "evidence-backed dead-end audit"
          on_fail:
            target: executor
            retry_budget: 3
            on_exhausted: "plan.blocked(reason=precheck_failed)"
            reason: "dead_end_evidence_insufficient"
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        task.start:
          payload: json_object
        work.failed:
          required_fields:
            - plan_name
            - dead_end_confidence
            - dead_end_evidence_coverage
            - dead_end_evidence_file

mock_responses:
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":60,"dead_end_evidence_coverage":40,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed.rejected">
      {"failed_checks":["confidence_inflated"],"reason":"attempt 1 — confidence 60 < 90","synthetic":false}
      </event>
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":70,"dead_end_evidence_coverage":50,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed.rejected">
      {"failed_checks":["confidence_inflated"],"reason":"attempt 2 — confidence 70 < 90","synthetic":false}
      </event>
  - hat: executor
    text: |
      <event topic="work.failed.proposed">
      {"plan_name":"demo","dead_end_confidence":80,"dead_end_evidence_coverage":60,"dead_end_evidence_file":".ralph/review/demo/dead-end-evidence.md"}
      </event>
  - hat: precheck-work.failed
    text: |
      <event topic="work.failed.rejected">
      {"failed_checks":["confidence_inflated"],"reason":"attempt 3 — confidence 80 < 90","synthetic":false}
      </event>

expected:
  iterations: 6
  events:
    - topic: plan.blocked
  absent_events:
    - topic: work.failed
  completion: false
