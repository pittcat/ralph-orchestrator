# ce_executor_pipeline_loop_executor_partial_done: partial work.done keeps the loop chain alive
#
# 2026-07-24-002 plan U3 (B5, loop half): in the loop preset a
# partial `work.done` (U2 failed, U1/U3 delivered,
# execution_status=partial) MUST flow through test-stabilizer →
# review-reentry → 6-dim review → review-gate instead of
# short-circuiting via `work.failed`. Round 1 review has no
# must-fix-now findings, so the gate emits `review.accepted`,
# alignment runs, and reporter finishes with
# verdict=pass_with_residuals — the failed Unit is a residual,
# not a dead end.

name: ce_executor_pipeline_loop_executor_partial_done
description: ce-executor-pipeline-loop — partial work.done walks stabilizer → review-reentry → gate accept → report.done; work.failed stays absent

config:
  prompt_file: PROMPT.md
  max_iterations: 30
  hats:
    plan-reviewer:
      subscribes_to: [work.start]
      publishes: [plan.ready, plan.blocked]
    executor:
      subscribes_to: [plan.ready]
      publishes: [work.done, work.failed]
    test-stabilizer:
      subscribes_to: [work.done]
      publishes: [stabilization.done, stabilization.blocked]
    review-reentry:
      subscribes_to: [stabilization.done, fix.done]
      publishes: [review.round.ready]
    "dim:goal-alignment":
      subscribes_to: [review.round.ready]
      publishes: [review.goalalign.done]
    "dim:correctness":
      subscribes_to: [review.goalalign.done]
      publishes: [review.correctness.done]
    "dim:testing":
      subscribes_to: [review.correctness.done]
      publishes: [review.testing.done]
    "dim:maintainability":
      subscribes_to: [review.testing.done]
      publishes: [review.maintainability.done]
    "dim:project-standards":
      subscribes_to: [review.maintainability.done]
      publishes: [review.standards.done]
    "dim:adversarial":
      subscribes_to: [review.standards.done]
      publishes: [review.adversarial.done]
    review-synthesizer:
      subscribes_to: [review.adversarial.done]
      publishes: [review.synthesized]
    review-gate:
      subscribes_to: [review.synthesized]
      publishes: [review.accepted, fix.requested, review.loop.blocked]
    fix-planner:
      subscribes_to: [fix.requested]
      publishes: [review.complete]
    fixer:
      subscribes_to: [review.complete]
      publishes: [fix.done]
    alignment:
      subscribes_to: [review.accepted]
      publishes: [align.done]
    reporter:
      subscribes_to: [align.done, plan.blocked, work.failed, stabilization.blocked, review.loop.blocked]
      publishes: [report.done, LOOP_COMPLETE]
  event_loop:
    execution_mode: isolated
    starting_event: work.start
    completion_promise: LOOP_COMPLETE
    required_events: [report.done]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics: [LOOP_COMPLETE]
      business_topics:
        - plan.ready
        - plan.blocked
        - work.done
        - work.failed
        - stabilization.done
        - stabilization.blocked
        - review.round.ready
        - review.goalalign.done
        - review.correctness.done
        - review.testing.done
        - review.maintainability.done
        - review.standards.done
        - review.adversarial.done
        - review.synthesized
        - review.accepted
        - fix.requested
        - review.complete
        - fix.done
        - review.loop.blocked
        - align.done
        - report.done

mock_responses:
  - hat: plan-reviewer
    text: |
      <event topic="plan.ready">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","plan_revised":false,"review_summary":"ok","flow_audit":"first_run","resolved_baseline_sha":"0000000000000000000000000000000000000001"}</event>
  # Partial settlement: U1/U3 delivered, U2 failed. completed_units
  # is non-empty → work.done (never work.failed).
  - hat: executor
    text: |
      <event topic="work.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","planned_units":["U1","U2","U3"],"completed_units":["U1","U3"],"attempted_units":["U1","U2","U3"],"failed_units":["U2"],"blocked_units":[],"skipped_units":[],"execution_status":"partial","decisions_file":".ralph/agent/decisions.md","baseline_verification_status":"green","post_verification_status":"red","verification_delta_file":".ralph/review/plan-loop-partial/verification-delta.md","new_business_regressions_count":1,"tests_run":60,"tests_passed":59,"changed_lines":70,"commit_count":2}</event>
  - hat: test-stabilizer
    text: |
      <event topic="stabilization.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","tested_from_sha":"0000000000000000000000000000000000000002","head_sha":"0000000000000000000000000000000000000002","stabilization_audit_file":".ralph/review/plan-loop-partial/stabilization/r1-audit.md","correction_ids":[],"classification_counts":{"test_bug":0,"production_bug":1,"pre_existing_failure":0,"flaky_or_env":0,"unattributable":0},"worktree_status":"clean","tests_run":60,"tests_passed":59}</event>
  - hat: review-reentry
    text: |
      <event topic="review.round.ready">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","review_round":1,"source_topic":"work.done","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","round_base_sha":"0000000000000000000000000000000000000002","review_plan":{"focus_areas":["full diff"],"fixed_findings":[],"verification_performed":["cargo nextest"],"residual_risks":["U2 undelivered"],"diff_ranges":["0000000000000000000000000000000000000001..0000000000000000000000000000000000000002"]}}</event>
  - hat: "dim:goal-alignment"
    text: |
      <event topic="review.goalalign.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"goal-alignment","findings_file":".ralph/review/plan-loop-partial/r1-goal-alignment.md","findings_count":1}</event>
  - hat: "dim:correctness"
    text: |
      <event topic="review.correctness.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"correctness","findings_file":".ralph/review/plan-loop-partial/r1-correctness.md","findings_count":0}</event>
  - hat: "dim:testing"
    text: |
      <event topic="review.testing.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"testing","findings_file":".ralph/review/plan-loop-partial/r1-testing.md","findings_count":0}</event>
  - hat: "dim:maintainability"
    text: |
      <event topic="review.maintainability.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"maintainability","findings_file":".ralph/review/plan-loop-partial/r1-maintainability.md","findings_count":0}</event>
  - hat: "dim:project-standards"
    text: |
      <event topic="review.standards.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"project-standards","findings_file":".ralph/review/plan-loop-partial/r1-standards.md","findings_count":0}</event>
  - hat: "dim:adversarial"
    text: |
      <event topic="review.adversarial.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"adversarial","findings_file":".ralph/review/plan-loop-partial/r1-adversarial.md","findings_count":0}</event>
  - hat: review-synthesizer
    text: |
      <event topic="review.synthesized">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","diff_patch_file":".ralph/review/plan-loop-partial/round-01/review.diff.patch","synthesized_review_file":".ralph/review/plan-loop-partial/r1-synthesized-review.md","findings_count":1,"p0_count":0,"p1_count":0,"must_fix_now_count":0,"main_conflict_count":0,"unfixed_previous_count":0,"new_regression_p0_count":0,"newly_discovered_residual_count":1,"blocking_main_conflict_count":0,"residual_findings_count":1,"findings_summary":"U2 undelivered is a residual, not a must-fix-now conflict","loop_decision_basis":"no must-fix-now findings; failed Unit reported as residual","verdict":"pass_with_residuals"}</event>
  - hat: review-gate
    text: |
      <event topic="review.accepted">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","review_round":1,"executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","p0_count":0,"p1_count":0,"must_fix_now_count":0,"main_conflict_count":0,"blocking_main_conflict_count":0,"residual_findings_count":1,"loop_decision_basis":"must_fix_now_count == 0; partial delivery accepted with residuals","verdict":"pass_with_residuals"}</event>
  - hat: alignment
    text: |
      <event topic="align.done">{"plan_name":"plan-loop-partial","plan_path":"docs/plans/loop-partial.md","review_round":1,"executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","fix_plan_file":".ralph/review/plan-loop-partial/fix-plan.md","review_verdict":"pass_with_residuals","plan_executed":false,"fix_plan_executed":false,"residuals_count":1,"residuals_summary":"U2 failed during execution; reported as residual","report_input_file":".ralph/review/plan-loop-partial/report-input.align-done.json"}</event>
  - hat: reporter
    text: |
      <event topic="report.done">{"plan_name":"plan-loop-partial","report_path":".ralph/review/plan-loop-partial/report.md","verdict":"pass_with_residuals","reason":"partial delivery: U1,U3 committed; U2 residual"}</event>
  - hat: reporter
    text: |
      <event topic="LOOP_COMPLETE">{"reason":"partial delivery accepted with residuals; no work.failed short-circuit"}</event>

expected:
  iterations: 15
  events:
    - topic: plan.ready
    - topic: work.done
    - topic: stabilization.done
    - topic: review.round.ready
    - topic: review.accepted
    - topic: align.done
    - topic: report.done
  absent_events:
    # The contract: partial work.done never degrades to work.failed.
    - topic: work.failed
    - topic: plan.blocked
    - topic: stabilization.blocked
    # No fix cycle and no loop block on the partial-but-accepted path.
    - topic: fix.requested
    - topic: review.complete
    - topic: fix.done
    - topic: review.loop.blocked
  event_topic_counts:
    - topic: review.round.ready
      count: 1
    - topic: review.accepted
      count: 1
    - topic: stabilization.done
      count: 1
  payload_matches:
    - topic: work.done
      fields:
        execution_status: "partial"
        completed_units: ["U1","U3"]
        failed_units: ["U2"]
        skipped_units: []
    - topic: review.round.ready
      fields:
        review_round: 1
        source_topic: "work.done"
    - topic: review.accepted
      fields:
        verdict: "pass_with_residuals"
        must_fix_now_count: 0
    - topic: report.done
      fields:
        verdict: "pass_with_residuals"
  completion: true
