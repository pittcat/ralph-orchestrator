# 2026-07-07-002 plan Unit 10: serial runtime protocol happy path
#
# Integration regression for Units 1-4 wiring: terminal chain with
# validator before shipper, completion_after_terminal policy armed.
#
# Wire-level chain (single-step plan):
#   work.start → work.ready → work.done → test.passed
#   → plan.complete → REVIEW_COMPLETE → report.done → LOOP_COMPLETE

name: ce_executor_serial_runtime_protocol_happy_path
description: 2026-07-07-002 U10 — serial happy path terminal chain with validator before shipper

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  hats:
    coordinator:
      subscribes_to:
        - work.start
        - test.passed
        - work.failed
      publishes:
        - work.ready
        - plan.complete
        - plan.blocked
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
        - work.failed
    validator:
      subscribes_to:
        - work.done
      publishes:
        - test.passed
        - test.failed
    shipper:
      subscribes_to:
        - plan.complete
        - plan.blocked
      publishes:
        - REVIEW_COMPLETE
    reporter:
      subscribes_to:
        - REVIEW_COMPLETE
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics:
        - "LOOP_COMPLETE"
      business_topics:
        - "plan.complete"
        - "plan.blocked"
        - "REVIEW_COMPLETE"
        - "report.done"
        - "work.ready"
        - "work.done"
        - "test.passed"
        - "test.failed"
      completion_after_terminal:
        duplicate_terminal: reject
        business_after_completion: reject
        write_diagnostic_event: true
      schemas:
        work.ready:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - complexity
          payload: json_object
        work.done:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - commit_count
            - changed_lines
          payload: json_object
        test.passed:
          required_fields:
            - plan_name
            - task_id
            - task_key
            - step
            - tests_run
            - tests_passed
          payload: json_object
        plan.complete:
          required_fields:
            - plan_name
            - completed_steps
            - task_id
            - task_key
            - step
            - verdict
            - final_findings_count
            - fix_round
          payload: json_object
        REVIEW_COMPLETE:
          payload: json_object
          required_fields: [plan_name, pass_or_fail, verdict]
        report.done:
          payload: json_object
          required_fields: [plan_name, status]
        LOOP_COMPLETE:
          payload: json_object
          required_fields: [plan_name, reason]

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"proto-happy","plan_path":"docs/plans/proto-happy.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.ready">
      {"plan_name":"proto-happy","plan_path":"docs/plans/proto-happy.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small"}
      </event>
    hat: coordinator
  - text: |
      <event topic="work.done">
      {"plan_name":"proto-happy","plan_path":"docs/plans/proto-happy.md","task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":5}
      </event>
    hat: executor
  - text: |
      <event topic="test.passed">
      {"plan_name":"proto-happy","task_id":"t1","task_key":"k1","step":"step-01","tests_run":4,"tests_passed":4}
      </event>
    hat: validator
  - text: |
      <event topic="plan.complete">
      {"plan_name":"proto-happy","completed_steps":["step-01"],"task_id":"t1","task_key":"k1","step":"fix-01","verdict":"pass","final_findings_count":0,"fix_round":0}
      </event>
    hat: coordinator
  - text: |
      <event topic="REVIEW_COMPLETE">
      {"plan_name":"proto-happy","verdict":"pass","pass_or_fail":"pass","residual_findings_summary":"none"}
      </event>
    hat: shipper
  - text: |
      <event topic="report.done">
      {"plan_name":"proto-happy","status":"completed"}
      </event>
    hat: reporter
  - text: |
      <event topic="LOOP_COMPLETE">
      {"plan_name":"proto-happy","reason":"protocol happy path"}
      </event>
    hat: reporter

expected:
  iterations: 8
  events:
    - topic: work.ready
    - topic: work.done
    - topic: test.passed
    - topic: plan.complete
    - topic: REVIEW_COMPLETE
    - topic: report.done
  event_topic_counts:
    - topic: LOOP_COMPLETE
      count: 1
  absent_events:
    - topic: plan.blocked
    - topic: test.failed
    - topic: work.failed
  completion: true
