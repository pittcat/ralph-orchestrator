# 2026-06-29-007 U6b: CoordinatorDecisionGate 拦截 work.ready
#
# BDD 覆盖:coordinator 推 work.ready 时若 review.complete 未到,
# CoordinatorDecisionGateStage 拒绝(reason=upstream_review_incomplete)。
# 单测在 coordinator_decision_gate_stage::tests 已覆盖核心逻辑;
# 此 scenario 是 integration 冒烟。
#
# 期望:happy path 完整跑通,无 upstream_review_incomplete 出现。

name: u6b_coordinator_step_guard
description: U6b - CoordinatorDecisionGate 在 happy path 不破坏既有流

config:
  prompt_file: PROMPT.md
  max_iterations: 3
  hats:
    coordinator:
      subscribes_to:
        - work.done
      publishes:
        - plan.complete
      default_publishes: plan.complete

mock_responses:
  - |
    <event topic="work.done">
    plan_name: "u6b-demo"
    step: "step-01"
    task_id: "u6b-task"
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "u6b-demo"
    verdict: pass
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 3
  events:
    - topic: work.done
    - topic: plan.complete
  absent_events:
    - topic: plan.blocked
  recovery_absent:
    - "upstream_review_incomplete"
  completion: false