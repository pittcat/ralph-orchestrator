# Parallel Forge artifact-first task materialization. The real EventLoop reads
# execution-plan.yml, verifies the handoff, and atomically creates a two-task
# DAG without planner-supplied `unit_tasks`.
#
# Assertions pin the live task ledger to the artifact DAG and prove U2 remains
# blocked by U1. The final LOOP_COMPLETE attempt is intentionally rejected
# while projected tasks remain open; settlement/terminal closure is covered by
# the dedicated two-wave scenarios.

name: pf_task_dispatch_runtime
description: 'parallel-forge artifact authority path: forge.plan.ready derives a two-task DAG from execution-plan.yml and preserves dependency readiness'

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE
    supervisor:
      enabled: true
      aggregate_timeout_secs: 60
    state_projection:
      enabled: true
      actions:
        forge.plan.ready:
          kind: ensure_task_batch
          items: unit_tasks
          count: unit_count
          key: task_key
          title: title
          blocked_by_keys: depends_on_task_keys
          execution_wave: execution_wave
          integration_order: integration_order
          execution_plan_digest: plan_digest
    required_events:
      - exec.unit.done
    starting_event: forge.start
  hats:
    pf-inspector:
      subscribes_to:
        - forge.start
      publishes:
        - forge.plan.inspected
    pf-planner:
      subscribes_to:
        - forge.plan.inspected
      publishes:
        - forge.plan.ready
    pf-guardian:
      subscribes_to:
        - forge.plan.ready
      publishes:
        - forge.concurrency.approved
    pf-worktree:
      subscribes_to:
        - forge.concurrency.approved
      publishes:
        - forge.worktrees.ready
    pf-dispatcher:
      subscribes_to:
        - forge.worktrees.ready
        - exec.unit.done
      publishes:
        - exec.unit.ready
    pf-executor:
      subscribes_to:
        - exec.unit.ready
      publishes:
        - exec.unit.done
    pf-reporter:
      subscribes_to:
        - exec.unit.done
      publishes:
        - LOOP_COMPLETE

fixture_files:
  - path: .ralph/forge/pf-td-p/development-plan.md
    content: |
      # Parallel Forge test plan
  - path: .ralph/forge/pf-td-p/execution-plan.yml
    content: |
      version: 1
      plan_key: pf-td-p
      units:
        - id: U1
          title: Foundation
          depends_on: []
          execution_wave: 1
          integration_order: 1
        - id: U2
          title: Feature
          depends_on: [U1]
          execution_wave: 2
          integration_order: 2

mock_responses:
  - text: |
      <event topic="forge.plan.inspected">
      plan_key: "pf-td-p"
      plan_usable: true
      </event>
    hat: pf-inspector
  - text: |
      <event topic="forge.plan.ready">
      {"plan_path":"docs/plans/pf-td-p.md","development_plan_path":".ralph/forge/pf-td-p/development-plan.md","execution_plan_path":".ralph/forge/pf-td-p/execution-plan.yml","plan_key":"pf-td-p"}
      </event>
    hat: pf-planner
  - text: |
      <event topic="forge.concurrency.approved">
      approved: true
      plan_key: "pf-td-p"
      </event>
    hat: pf-guardian
  - text: |
      <event topic="forge.worktrees.ready">
      plan_key: "pf-td-p"
      integration_branch: "pf/td"
      </event>
    hat: pf-worktree
  - text: |
      <event topic="exec.unit.ready">
      wave_id: "pf-td-wave-1"
      slot_index: 0
      task_id: "task-bd-pf-td-p-u1"
      unit_id: "U1"
      plan_key: "pf-td-p"
      </event>
    hat: pf-dispatcher
  - text: |
      <event topic="exec.unit.done">
      wave_id: "pf-td-wave-1"
      slot_index: 0
      content_hash: "pf-td-h1"
      unit_id: "U1"
      plan_key: "pf-td-p"
      </event>
    hat: pf-executor
  - text: |
      <event topic="exec.unit.ready">
      wave_id: "pf-td-wave-2"
      slot_index: 0
      task_id: "task-bd-pf-td-p-u2"
      unit_id: "U2"
      plan_key: "pf-td-p"
      </event>
    hat: pf-dispatcher
  - text: |
      <event topic="exec.unit.done">
      wave_id: "pf-td-wave-2"
      slot_index: 0
      content_hash: "pf-td-h2"
      unit_id: "U2"
      plan_key: "pf-td-p"
      </event>
    hat: pf-executor
  - text: |
      <event topic="LOOP_COMPLETE">
      </event>
    hat: pf-reporter

expected:
  iterations: 9
  events:
    - topic: forge.plan.inspected
    - topic: forge.plan.ready
    - topic: forge.concurrency.approved
    - topic: forge.worktrees.ready
    - topic: exec.unit.ready
    - topic: exec.unit.done
    - topic: exec.unit.ready
    - topic: exec.unit.done
  event_topic_counts:
    - topic: exec.unit.ready
      count: 2
    - topic: exec.unit.done
      count: 2
  completion: false
  supervisor_fan_in:
    expected_slots: 2
  task_ledger:
    - task_key: forge:pf-td-p:U1
      status: open
      blocked_by_keys: []
    - task_key: forge:pf-td-p:U2
      status: open
      blocked_by_keys: [forge:pf-td-p:U1]
  ready_task_keys:
    - forge:pf-td-p:U1
