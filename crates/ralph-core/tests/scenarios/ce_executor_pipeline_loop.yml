# ce_executor_pipeline_loop: first review round accepts without P0/P1

name: ce_executor_pipeline_loop
description: ce-executor-pipeline-loop happy path — first synthesized review has no P0/P1, review-gate emits review.accepted and no fix events appear

config:
  prompt_file: PROMPT.md
  max_iterations: 32
  hats:
    plan-reviewer:
      subscribes_to: [work.start]
      publishes: [plan.ready, plan.blocked]
    executor:
      subscribes_to: [plan.ready]
      publishes: [work.done, work.failed]
    review-reentry:
      subscribes_to: [work.done, fix.done]
      publishes: [review.round.ready]
    "dim:goal-alignment":
      subscribes_to: [review.round.ready]
      publishes: [review.goalalign.done]
    "dim:correctness":
      subscribes_to: [review.goalalign.done]
      publishes: [review.correctness.done]
    "dim:testing":
      subscribes_to: [review.correctness.done]
      publishes: [review.testing.done]
    "dim:maintainability":
      subscribes_to: [review.testing.done]
      publishes: [review.maintainability.done]
    "dim:project-standards":
      subscribes_to: [review.maintainability.done]
      publishes: [review.standards.done]
    "dim:adversarial":
      subscribes_to: [review.standards.done]
      publishes: [review.adversarial.done]
    review-synthesizer:
      subscribes_to: [review.adversarial.done]
      publishes: [review.synthesized]
    review-gate:
      subscribes_to: [review.synthesized]
      publishes: [review.accepted, fix.requested, review.loop.blocked]
    fix-planner:
      subscribes_to: [fix.requested]
      publishes: [review.complete]
    fixer:
      subscribes_to: [review.complete]
      publishes: [fix.done]
    alignment:
      subscribes_to: [review.accepted]
      publishes: [align.done]
    reporter:
      subscribes_to: [align.done, plan.blocked, work.failed, review.loop.blocked]
      publishes: [report.done, LOOP_COMPLETE]
  event_loop:
    execution_mode: isolated
    starting_event: work.start
    completion_promise: LOOP_COMPLETE
    required_events: [report.done]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics: [LOOP_COMPLETE]
      business_topics:
        - plan.ready
        - plan.blocked
        - work.done
        - work.failed
        - review.round.ready
        - review.goalalign.done
        - review.correctness.done
        - review.testing.done
        - review.maintainability.done
        - review.standards.done
        - review.adversarial.done
        - review.synthesized
        - review.accepted
        - fix.requested
        - review.complete
        - fix.done
        - review.loop.blocked
        - align.done
        - report.done

mock_responses:
  - hat: plan-reviewer
    text: |
      <event topic="plan.ready">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","plan_revised":false,"review_summary":"ok","flow_audit":"first_run","resolved_baseline_sha":"0000000000000000000000000000000000000001"}</event>
  - hat: executor
    text: |
      <event topic="work.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","tests_run":1,"tests_passed":1,"changed_lines":4,"commit_count":1}</event>
  - hat: review-reentry
    text: |
      <event topic="review.round.ready">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","review_round":1,"source_topic":"work.done","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","round_base_sha":"0000000000000000000000000000000000000002","review_plan":{"focus_areas":["full diff"],"fixed_findings":[],"verification_performed":["cargo nextest"],"residual_risks":[],"diff_ranges":["0000000000000000000000000000000000000001..0000000000000000000000000000000000000002"]}}</event>
  - hat: "dim:goal-alignment"
    text: |
      <event topic="review.goalalign.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"goal-alignment","findings_file":".ralph/review/plan-loop/goal-alignment.md","findings_count":0}</event>
  - hat: "dim:correctness"
    text: |
      <event topic="review.correctness.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"correctness","findings_file":".ralph/review/plan-loop/correctness.md","findings_count":0}</event>
  - hat: "dim:testing"
    text: |
      <event topic="review.testing.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"testing","findings_file":".ralph/review/plan-loop/testing.md","findings_count":0}</event>
  - hat: "dim:maintainability"
    text: |
      <event topic="review.maintainability.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"maintainability","findings_file":".ralph/review/plan-loop/maintainability.md","findings_count":0}</event>
  - hat: "dim:project-standards"
    text: |
      <event topic="review.standards.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"project-standards","findings_file":".ralph/review/plan-loop/standards.md","findings_count":0}</event>
  - hat: "dim:adversarial"
    text: |
      <event topic="review.adversarial.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","dimension":"adversarial","findings_file":".ralph/review/plan-loop/adversarial.md","findings_count":0}</event>
  - hat: review-synthesizer
    text: |
      <event topic="review.synthesized">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","diff_patch_file":".ralph/review/plan-loop/round-01/review.diff.patch","synthesized_review_file":".ralph/review/plan-loop/synthesized-review.md","findings_count":0,"p0_count":0,"p1_count":0,"must_fix_now_count":0,"main_conflict_count":0,"unfixed_previous_count":0,"new_regression_p0_count":0,"newly_discovered_residual_count":0,"blocking_main_conflict_count":0,"residual_findings_count":0,"findings_summary":"no P0/P1","loop_decision_basis":"no main-conflict findings remain","verdict":"pass"}</event>
  - hat: review-gate
    text: |
      <event topic="review.accepted">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","review_round":1,"executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","p0_count":0,"p1_count":0,"must_fix_now_count":0,"main_conflict_count":0,"blocking_main_conflict_count":0,"residual_findings_count":0,"loop_decision_basis":"no main-conflict findings remain","verdict":"pass"}</event>
  - hat: alignment
    text: |
      <event topic="align.done">{"plan_name":"plan-loop","plan_path":"docs/plans/loop.md","review_round":1,"executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","fix_plan_file":"","review_verdict":"pass","plan_executed":true,"fix_plan_executed":true,"residuals_count":0,"residuals_summary":"none"}</event>
  - hat: reporter
    text: |
      <event topic="report.done">{"plan_name":"plan-loop","report_path":".ralph/review/plan-loop/report.md","verdict":"pass"}</event>
  - hat: reporter
    text: |
      <event topic="LOOP_COMPLETE">{"reason":"first review round accepted with no P0/P1"}</event>

expected:
  iterations: 14
  events:
    - topic: review.round.ready
    - topic: review.synthesized
    - topic: review.accepted
    - topic: align.done
    - topic: report.done
  absent_events:
    - topic: fix.requested
    - topic: review.complete
    - topic: fix.done
    - topic: review.loop.blocked
  event_topic_counts:
    - topic: review.round.ready
      count: 1
    - topic: review.accepted
      count: 1
  payload_matches:
    - topic: review.round.ready
      fields:
        review_round: 1
        source_topic: work.done
    - topic: review.accepted
      fields:
        review_round: 1
        p0_count: 0
        p1_count: 0
  completion: true
