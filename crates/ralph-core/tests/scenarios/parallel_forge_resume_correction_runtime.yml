# U3 (plan 2026-08-03-004) / S4: parallel-forge correction resume.
#
# The OLD run stopped in the correction phase: `forge.correction.requested`
# was accepted (failure handler done) but `forge.correction.done` never
# landed. The reuse cleanup archived the old runtime state, so the NEW
# loop boots from the U1 resume manifest alone: pending hat = the
# correction executor (wave-fixer), original trigger = the accepted
# `forge.correction.requested` snapshot (wave metadata + failure
# fingerprint intact).
#
# Assertions (runtime face of S4):
#   - the resume targets the correction executor directly
#     (`activation_hats` starts with pf-wave-fixer); the failure
#     handler does NOT re-run (no duplicate `forge.correction.requested`)
#   - the fixer sees the original correction request payload in its
#     prompt: same `wave_id` and `failure_fingerprint` (consistency)
#   - the resumed correction starts a FRESH round budget: the recovery
#     payload carries no correction-round state and the chain emits
#     `forge.correction.done` with `correction_round: 0`
#   - the corrected wave re-reviews and settles to completion

name: pf_resume_correction_runtime
description: 'S4 parallel-forge resume: correction executor re-binds to the accepted forge.correction.requested boundary with fresh round budget'

config:
  prompt_file: PROMPT.md
  max_iterations: 10
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE
    supervisor:
      enabled: true
      aggregate_timeout_secs: 60
    required_events:
      - LOOP_COMPLETE
    starting_event: forge.start
  hats:
    pf-failure-handler:
      subscribes_to: [forge.wave.review.failed]
      publishes: [forge.correction.requested, work.failed]
      event_filter:
        enabled: true
        events: [forge.wave.review.failed]
    pf-wave-fixer:
      subscribes_to: [forge.correction.requested]
      publishes: [forge.correction.done]
      event_filter:
        enabled: true
        events: [forge.correction.requested]
    pf-reviewer:
      subscribes_to:
        - forge.correction.done
        - exec.wave.complete
      publishes: [forge.wave.reviewed, forge.wave.review.failed]
      event_filter:
        enabled: true
        events:
          - forge.correction.done
          - exec.wave.complete
    pf-integrator:
      subscribes_to: [forge.wave.reviewed]
      publishes: [forge.wave.integrated]
      event_filter:
        enabled: true
        events: [forge.wave.reviewed]
    pf-verifier:
      subscribes_to: [forge.wave.integrated]
      publishes: [forge.wave.verified]
      event_filter:
        enabled: true
        events: [forge.wave.integrated]
    pf-integration:
      subscribes_to: [forge.wave.verified]
      publishes: [forge.wave.settled]
      event_filter:
        enabled: true
        events: [forge.wave.verified]
    pf-reporter:
      subscribes_to: [forge.wave.settled]
      publishes: [LOOP_COMPLETE]
      event_filter:
        enabled: true
        events: [forge.wave.settled]

# U1 boundary: correction requested (accepted), fixer triggered.
# The old run had already spent correction rounds; the snapshot's
# `correction_round: 1` is old-run evidence only — the resume payload
# itself must not carry round / budget state.
resume_bootstrap:
  accepted:
    - topic: forge.wave.review.failed
      hat: pf-reviewer
    - topic: forge.correction.requested
      hat: pf-failure-handler
  pending_hat: pf-wave-fixer
  original_trigger:
    topic: forge.correction.requested
    hat: pf-failure-handler
    payload: '{"plan_key":"pf-res4","wave_id":"w1","wave_index":1,"correction_round":1,"failure_fingerprint":"fp-res4-1","affected_unit_ids":["U1"],"affected_task_ids":["task-res4-u1"],"correction_request_path":".ralph/forge/pf-res4/waves/w1/corrections/round-1.md"}'
  wave:
    wave_id: w1
    wave_index: 1
    wave_total: 1

mock_responses:
  # Iter 1: resumed correction executor starts a FRESH round (0) with
  # the same wave metadata + failure fingerprint as the boundary.
  - text: |
      <event topic="forge.correction.done">
      {"plan_key":"pf-res4","wave_id":"w1","wave_index":1,"correction_round":0,"commit_sha":"FIX-RES4","affected_unit_ids":["U1"],"failure_fingerprint":"fp-res4-1","correction_report_path":".ralph/forge/pf-res4/waves/w1/corrections/round-0/report.md"}
      </event>
    hat: pf-wave-fixer
  # Iter 2-5: corrected wave re-reviews and settles.
  - text: |
      <event topic="forge.wave.reviewed">
      {"plan_key":"pf-res4","wave_id":"w1","wave_index":1,"aggregate_verdict":"ACCEPTED","unit_verdicts":[]}
      </event>
    hat: pf-reviewer
  - text: |
      <event topic="forge.wave.integrated">
      {"plan_key":"pf-res4","wave_id":"w1","wave_index":1,"integration_branch":"pf/res4","integration_complete":true,"linear_history":true,"commit_map_path":".ralph/forge/pf-res4/commit-map.yml","integration_log_path":".ralph/forge/pf-res4/integration-log.md"}
      </event>
    hat: pf-integrator
  - text: |
      <event topic="forge.wave.verified">
      {"plan_key":"pf-res4","wave_id":"w1","wave_index":1,"passed":true,"candidate_commit_sha":"CAND-RES4","last_integrated_unit":"U1"}
      </event>
    hat: pf-verifier
  - text: |
      <event topic="forge.wave.settled">
      {"plan_key":"pf-res4","wave_id":"w1","wave_index":1,"settled_task_ids":["task-res4-u1"],"settled_unit_ids":["U1"],"verified_base_commit":"CAND-RES4","settlement_log_path":".ralph/forge/pf-res4/waves/w1/settlement.md"}
      </event>
    hat: pf-integration
  # Iter 6: terminal.
  - text: |
      <event topic="LOOP_COMPLETE">
      </event>
    hat: pf-reporter

expected:
  iterations: 6
  # Correction executor first (pinned); failure handler never re-runs.
  activation_hats:
    - pf-wave-fixer
    - pf-reviewer
    - pf-integrator
    - pf-verifier
    - pf-integration
    - pf-reporter
  events:
    - topic: forge.correction.done
    - topic: forge.wave.reviewed
    - topic: forge.wave.integrated
    - topic: forge.wave.verified
    - topic: forge.wave.settled
    - topic: LOOP_COMPLETE
  # The consumed boundary is never replayed; no failure path fires.
  absent_events:
    - topic: forge.correction.requested
    - topic: forge.wave.review.failed
    - topic: exec.wave.failed
    - topic: work.failed
  event_topic_counts:
    - topic: forge.correction.done
      count: 1
  payload_matches:
    # Fresh round budget + boundary-consistent wave metadata and
    # failure fingerprint.
    - topic: forge.correction.done
      occurrence: 1
      fields:
        wave_id: "w1"
        correction_round: 0
        failure_fingerprint: "fp-res4-1"
  # The resumed fixer must actually SEE the original correction
  # request payload (fingerprint + wave metadata) in its prompt.
  prompt_contains:
    - hat: pf-wave-fixer
      substrings:
        - "manifest_resume"
        - "forge.correction.requested"
        - "fp-res4-1"
        - "w1"
  completion: true
