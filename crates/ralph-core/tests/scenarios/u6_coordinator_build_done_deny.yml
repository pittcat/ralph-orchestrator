# u6_coordinator_build_done_deny: Coordinator cannot emit build.done (Unit 4 deny rule)
#
# 2026-06-16-002 plan U6: 端到端场景与文档收尾
#
# In isolated mode (and in the strict preset lint aggregator), a hat
# that has not declared a terminal/business topic in its `publishes`
# list must be denied when it tries to publish that topic.  This
# scenario wires the deny rule end-to-end through the real EventLoop
# + origin guard:
#
#   - iteration 0: coordinator parses the plan, emits work.start.
#   - iteration 1: coordinator emits work.ready (declared in publishes).
#   - iteration 2: coordinator attempts build.done (NOT declared in
#     publishes).  The event is rejected by the origin guard /
#     execution contract as a scope_violation.  It must NOT be
#     recorded in seen_topics and must NOT route to the executor.
#   - iteration 3: coordinator emits work.failed (declared) so the
#     loop ends cleanly with completion: false.
#
# Note: completion is false here because the loop never reaches a
# valid LOOP_COMPLETE — the rejected build.done must NOT be
# accepted, and no hat is positioned to emit LOOP_COMPLETE.

name: u6_coordinator_build_done_deny
description: Coordinator cannot emit build.done (per Unit 4 deny rule) — denied, not accepted

config:
  prompt_file: PROMPT.md
  max_iterations: 5
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - work.ready
        - work.failed
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
        - work.failed

mock_responses:
  - |
    <event topic="work.start" plan_name="plan-c" plan_path="docs/plans/c.md" task_id="t1" task_key="k1" step="step-01">
    Plan parsed.
    </event>
  - |
    <event topic="work.ready" plan_name="plan-c" plan_path="docs/plans/c.md" task_id="t1" task_key="k1" step="step-01" complexity="small">
    Work ready.
    </event>
  - |
    <event topic="build.done" plan_name="plan-c" commit_count="1" changed_lines="10">
    Tried to emit build.done (not allowed).
    </event>
  - |
    <event topic="work.failed" plan_name="plan-c" reason="build.done_denied">
    Cannot publish build.done.
    </event>

expected:
  iterations: 4
  events:
    - topic: work.start
    - topic: work.ready
  completion: false
