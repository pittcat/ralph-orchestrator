name: ce_executor_pipeline_post_fix_review
description: Linear fix.done routes directly to alignment after fixer-owned full-suite verification

config:
  prompt_file: PROMPT.md
  max_iterations: 8
  hats:
    alignment:
      subscribes_to: [fix.done]
      publishes: [align.done]
    reporter:
      subscribes_to: [align.done]
      publishes: [report.done, LOOP_COMPLETE]
  event_loop:
    execution_mode: isolated
    starting_event: fix.done
    completion_promise: LOOP_COMPLETE
    required_events: [report.done]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume

mock_responses:
  - {hat: alignment, text: '<event topic="align.done">{"plan_name":"p","head_sha":"222"}</event>'}
  - {hat: reporter, text: '<event topic="report.done">{"plan_name":"p","verdict":"pass"}</event>'}
  - {hat: reporter, text: '<event topic="LOOP_COMPLETE">{"reason":"fixer-verified HEAD aligned"}</event>'}

expected:
  iterations: 3
  events:
    - {topic: align.done}
    - {topic: report.done}
  absent_events:
    - {topic: stabilization.done}
    - {topic: review.accepted}
    - {topic: review.synthesized}
    - {topic: review.complete}
  completion: true
