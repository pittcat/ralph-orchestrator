      <event topic="review.round.ready">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","diff_patch_file":".ralph/review/plan-loop-artifact-blocked/round-01/review.diff.patch"}</event>
  - hat: "dim:goal-alignment"
    text: |
      <event topic="review.goalalign.done">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","diff_patch_file":".ralph/review/plan-loop-artifact-blocked/round-01/review.diff.patch","dimension":"goal-alignment","findings_file":".ralph/review/plan-loop-artifact-blocked/round-01/goal-alignment.md","findings_count":1}</event>
  - hat: "dim:correctness"
    text: |
      <event topic="review.correctness.done">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","diff_patch_file":".ralph/review/plan-loop-artifact-blocked/round-01/review.diff.patch","dimension":"correctness","findings_file":".ralph/review/plan-loop-artifact-blocked/round-01/correctness.md","findings_count":1}</event>
  - hat: "dim:testing"
    text: |
      <event topic="review.testing.done">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","diff_patch_file":".ralph/review/plan-loop-artifact-blocked/round-01/review.diff.patch","dimension":"testing","findings_file":".ralph/review/plan-loop-artifact-blocked/round-01/testing.md","findings_count":1}</event>
  - hat: "dim:maintainability"
    text: |
      <event topic="review.maintainability.done">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","diff_patch_file":".ralph/review/plan-loop-artifact-blocked/round-01/review.diff.patch","dimension":"maintainability","findings_file":".ralph/review/plan-loop-artifact-blocked/round-01/maintainability.md","findings_count":1}</event>
  - hat: "dim:project-standards"
    text: |
      <event topic="review.standards.done">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","review_round":1,"round_base_sha":"0000000000000000000000000000000000000002","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","diff_patch_file":".ralph/review/plan-loop-artifact-blocked/round-01/review.diff.patch","dimension":"project-standards","findings_file":".ralph/review/plan-loop-artifact-blocked/round-01/standards.md","findings_count":1}</event>
  - hat: "dim:adversarial"
