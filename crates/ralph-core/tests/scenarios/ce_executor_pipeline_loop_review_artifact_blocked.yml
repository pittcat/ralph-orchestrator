  - hat: review-synthesizer
    text: |
      <event topic="review.artifact.blocked">
      {"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","review_round":1,"review_phase":"review_artifact_blocked","resolved_baseline_sha":"0000000000000000000000000000000000000001","normalized_plan_file":".ralph/agent/normalized/plan-loop-artifact-blocked.md","plan_contract_version":"ce-unified-plan/v1","plan_contract_digest":"deadbeefdeadbeefdeadbeefdeadbeefdeadbeef","trace_file":".ralph/agent/trace/plan-loop-artifact-blocked.md","artifact_block_file":".ralph/review/plan-loop-artifact-blocked/round-01/review-synthesizer-block.md","failure_dimensions":["adversarial","testing"],"failure_reasons":["findings_count_mismatch","unreadable"],"report_input_file":".ralph/review/plan-loop-artifact-blocked/round-01/report-input.review_artifact_blocked.json"}
