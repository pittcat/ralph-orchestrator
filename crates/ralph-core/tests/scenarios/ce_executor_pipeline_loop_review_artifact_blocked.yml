      <event topic="LOOP_COMPLETE">{"reason":"review_artifact_blocked: adversarial+testing missing"}</event>

expected:
  iterations: 12
  completion: true
  events:
    - topic: plan.ready
    - topic: work.done
    - topic: stabilization.done
    - topic: review.round.ready
    - topic: review.goalalign.done
    - topic: review.correctness.done
    - topic: review.testing.done
    - topic: review.maintainability.done
    - topic: review.standards.done
    - topic: review.adversarial.done
    - topic: review.artifact.blocked
    - topic: report.done
  absent_events:
    - topic: review.synthesized
    - topic: review.accepted
    - topic: fix.requested
    - topic: review.complete
    - topic: fix.done
    - topic: align.done
    - topic: review.loop.blocked
    - topic: stabilization.blocked
    - topic: plan.blocked
    - topic: work.failed
  payload_matches:
    - topic: review.artifact.blocked
      fields:
        review_phase: "review_artifact_blocked"
        review_round: 1
        failure_dimensions: ["adversarial", "testing"]
        failure_reasons: ["findings_count_mismatch", "unreadable"]
    - topic: report.done
      fields:
        verdict: "blocked"
