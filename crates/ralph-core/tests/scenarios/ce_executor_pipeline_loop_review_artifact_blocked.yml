# ce_executor_pipeline_loop_review_artifact_blocked: U3 loop preset — review-synthesizer fail-close on missing dimension artifact (mid-loop round)
#
# 2026-07-16-004 plan U3: same fail-close contract as the linear
# variant, but inside a multi-round review/fix loop. The synthesizer
# detects missing mandatory artifacts in round 1 (or any subsequent
# round) and emits ONLY review.artifact.blocked. The loop MUST NOT
# enter another fix round; reporter MUST emit a blocked report.

name: ce_executor_pipeline_loop_review_artifact_blocked
description: ce-executor-pipeline-loop U3 — review-synthesizer fail-close inside multi-round loop

config:
  prompt_file: PROMPT.md
  max_iterations: 12
  hats:
    plan-reviewer:
      subscribes_to: [work.start]
      publishes: [plan.ready, plan.blocked]
    executor:
      subscribes_to: [plan.ready]
      publishes: [work.done, work.failed]
    test-stabilizer:
      subscribes_to: [work.done, fix.done]
      publishes: [stabilization.done, stabilization.blocked]
    review-reentry:
      subscribes_to: [stabilization.done, fix.done]
      publishes: [review.round.ready]
    "dim:goal-alignment":
      subscribes_to: [review.round.ready]
      publishes: [review.goalalign.done]
    "dim:correctness":
      subscribes_to: [review.goalalign.done]
      publishes: [review.correctness.done]
    "dim:testing":
      subscribes_to: [review.correctness.done]
      publishes: [review.testing.done]
    "dim:maintainability":
      subscribes_to: [review.testing.done]
      publishes: [review.maintainability.done]
    "dim:project-standards":
      subscribes_to: [review.maintainability.done]
      publishes: [review.standards.done]
    "dim:adversarial":
      subscribes_to: [review.standards.done]
      publishes: [review.adversarial.done]
    review-synthesizer:
      subscribes_to: [review.adversarial.done]
      publishes: [review.synthesized, review.artifact.blocked]
    review-gate:
      subscribes_to: [review.synthesized]
      publishes: [review.accepted, fix.requested, review.loop.blocked]
    fix-planner:
      subscribes_to: [fix.requested]
      publishes: [review.complete]
    fixer:
      subscribes_to: [review.complete]
      publishes: [fix.done]
    alignment:
      subscribes_to: [review.accepted]
      publishes: [align.done]
    reporter:
      subscribes_to:
        - align.done
        - plan.blocked
        - work.failed
        - review.loop.blocked
        - stabilization.blocked
        - review.artifact.blocked
      publishes: [report.done, LOOP_COMPLETE]
  event_loop:
    execution_mode: isolated
    starting_event: work.start
    completion_promise: LOOP_COMPLETE
    required_events: [report.done]
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      terminal_topics: [LOOP_COMPLETE]
      business_topics:
        - plan.ready
        - plan.blocked
        - work.done
        - work.failed
        - stabilization.done
        - stabilization.blocked
        - review.round.ready
        - review.goalalign.done
        - review.correctness.done
        - review.testing.done
        - review.maintainability.done
        - review.standards.done
        - review.adversarial.done
        - review.synthesized
        - review.accepted
        - fix.requested
        - review.loop.blocked
        - review.artifact.blocked
        - fix.done
        - align.done
        - report.done

mock_responses:
  - hat: plan-reviewer
    text: |
      <event topic="plan.ready">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","plan_revised":false,"review_summary":"ok","flow_audit":"first_run","resolved_baseline_sha":"0000000000000000000000000000000000000001"}</event>
  - hat: executor
    text: |
      <event topic="work.done">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","executor_head_sha":"0000000000000000000000000000000000000002","resolved_baseline_sha":"0000000000000000000000000000000000000001","tests_run":5,"tests_passed":5,"changed_lines":18,"commit_count":3}</event>
  - hat: test-stabilizer
    text: |
      <event topic="stabilization.done">{"plan_name":"plan-loop-artifact-blocked","plan_path":"docs/plans/loop-artifact-blocked.md","tested_from_sha":"0000000000000000000000000000000000000002","head_sha":"0000000000000000000000000000000000000002","stabilization_audit_file":".ralph/review/plan-loop-artifact-blocked/stabilization/audit.md","correction_ids":[],"classification_counts":{"test_bug":0,"production_bug":0,"pre_existing_failure":0,"flaky_or_env":0,"unattributable":0},"worktree_status":"clean","tests_run":5,"tests_passed":5,"review_phase":"stabilization"}</event>
  - hat: review-reentry
