# ce_executor_serial_handoff_envelope_rejects_missing_payload: minimal
# rejection scenario for the serial handoff envelope validator.
#
# 2026-07-06-004 plan U12: BDD regression for the reject path.
# The `validate_payload: true` flag turns on U8's
# `check_handoff_envelope` validator, so an emit whose payload
# omits `handoff_envelope` must surface a `task.resume` carrying
# the rejection reason. The scenario pins the contract end-to-end
# so a future regression that silently drops the validator
# (and accepts the bad emit) fails this scenario's `expected.events`
# and `expected.absent_events` checks.

name: ce_executor_serial_handoff_envelope_rejects_missing_payload
description: 2026-07-06-004 U12 — minimal serial reject path; emit missing handoff_envelope must surface task.resume.

config:
  prompt_file: PROMPT.md
  max_iterations: 6
  hats:
    coordinator:
      subscribes_to:
        - work.start
      publishes:
        - work.ready
        - plan.complete
        - plan.blocked
    executor:
      subscribes_to:
        - work.ready
      publishes:
        - work.done
        - work.failed

  event_loop:
    execution_mode: isolated
    starting_event: "work.start"
    completion_promise: "LOOP_COMPLETE"
    required_events: ["report.done"]
    # U10: serial validates envelopes.
    handoff_envelope:
      enabled: true
      prompt_injection: true
      validate_payload: true
      emit_result_summary: true
    event_policy:
      enabled: true
      mode: enforce
      on_violation: reject_with_resume
      schemas:
        work.ready:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - complexity
            - handoff_envelope
          payload: json_object
        work.done:
          required_fields:
            - plan_name
            - plan_path
            - task_id
            - task_key
            - step
            - commit_count
            - changed_lines
            - handoff_envelope
          payload: json_object

mock_responses:
  - text: |
      <event topic="work.start">
      {"plan_name":"plan-u12-r","plan_path":"docs/plans/u12-r.md","task_id":"t1","task_key":"k1","step":"step-01"}
      </event>
    hat: coordinator
  # coordinator emits work.ready WITH a valid envelope → accepted.
  - text: |
      <event topic="work.ready">
      {"plan_name":"plan-u12-r","plan_path":"docs/plans/u12-r.md","task_id":"t1","task_key":"k1","step":"step-01","complexity":"small","handoff_envelope":{"schema_version":"handoff-envelope.v1","root_goal":"ship without regressions","plan":{"name":"plan-u12-r","path":"docs/plans/u12-r.md","current_step":"step-01","completed_steps":[]},"state":{"current_status":"ready","last_signal":"work.start","blocking_reason":null},"receiver_contract":{"to_hat":"executor","must_do":["complete step-01"],"must_not_do":["regress baseline"],"success_signal":"work.done","failure_signal":"work.failed"}}}
      </event>
    hat: coordinator
  # executor emits work.done WITHOUT an envelope → rejected.
  - text: |
      <event topic="work.done">
      {"plan_name":"plan-u12-r","plan_path":"docs/plans/u12-r.md","task_id":"t1","task_key":"k1","step":"step-01","commit_count":1,"changed_lines":10}
      </event>
    hat: executor
  # After the rejection, the executor falls through to a follow-up
  # emit that the runtime will still reject (the runtime does not
  # automatically re-emit). We assert `task.resume` is the only
  # recovery signal and the loop never reaches `work.done`.

expected:
  iterations: 3
  events:
    - topic: work.ready
    - topic: task.resume
  absent_events:
    - topic: work.done
    - topic: work.failed
    - topic: plan.complete
    - topic: plan.blocked
    - topic: REVIEW_COMPLETE
    - topic: report.done
    - topic: LOOP_COMPLETE
  completion: false