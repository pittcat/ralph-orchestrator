# Wave 维度分配强化 (2026-06-17-002 U1-U7):
# 模拟 4 维 review wave 的 convergence 路径,所有 4 维 dimension-reviewer
# worker 最终返回正确 dimension。Scenario 验证:
#   1. 4 维 review.dimension.done 全部被接受
#   2. review-synthesizer 收到 4 维 + 发出 review.passed
#   3. 无 plan.blocked
#
# 单元测试层(ralph-cli::wave::dispatcher)已覆盖 mismatched payload
# 被 drop + task.resume 注入的细节(见 u5_mismatch_writes_task_resume 等)。
# 本 BDD 场景聚焦 end-to-end 的"修正后能 converge"不变量。
#
# 注: 复用 incomplete_wave_plan_blocked 的 4-hat 拓扑;只断言
# review-synthesizer 的输出和事件 accepted 状态,不验证
# plan-gate 的 LOOP_COMPLETE 链(那是 plan-gate 自身的职责)。

name: wave_dimension_mismatch_retry
description: |
  4 维 review wave 的 retry convergence: 所有 worker 最终返回正确
  dimension,wave 收敛,无 plan.blocked,review.passed 路由到 plan-gate。

config:
  prompt_file: PROMPT.md
  max_iterations: 8
  hats:
    review-coordinator:
      subscribes_to:
        - work.done
      publishes:
        - review.wave.ready
        - review.passed
      default_publishes: review.wave.ready
    dimension-reviewer:
      subscribes_to:
        - review.wave.ready
      publishes:
        - review.dimension.done
      default_publishes: review.dimension.done
    review-synthesizer:
      subscribes_to:
        - review.dimension.done
        - wave.worker.failed
      publishes:
        - review.passed
        - plan.blocked
      default_publishes: review.passed
    plan-gate:
      subscribes_to:
        - review.passed
        - plan.blocked
      publishes:
        - plan.complete
      default_publishes: plan.complete
  event_loop:
    execution_mode: isolated

# Mock 序列: 4 worker 全部正确返回 (converged path 端到端)
mock_responses:
  - |
    <event topic="work.done">
    plan_name: "demo"
    step: "implement"
    task_id: "u1-impl"
    </event>
  # review-coordinator 派发 4 维 review wave
  - |
    派发 review wave...
    <event topic="review.wave.ready">
    wave_id: "wave-mismatch"
    wave_total: 4
    expected_dimensions: ["testing","maintainability","correctness","requirements"]
    aggregate_timeout_secs: 60
    </event>
  # worker 0: testing (正确)
  - |
    <event topic="review.dimension.done">
    wave_id: "wave-mismatch"
    dimension: "testing"
    findings_count: 0
    plan_name: "demo"
    task_id: "u1-impl"
    </event>
  # worker 1: maintainability (正确,假设 retry 后返回正确 dimension)
  - |
    <event topic="review.dimension.done">
    wave_id: "wave-mismatch"
    dimension: "maintainability"
    findings_count: 0
    plan_name: "demo"
    task_id: "u1-impl"
    </event>
  # worker 2: correctness (正确)
  - |
    <event topic="review.dimension.done">
    wave_id: "wave-mismatch"
    dimension: "correctness"
    findings_count: 0
    plan_name: "demo"
    task_id: "u1-impl"
    </event>
  # worker 3: requirements (正确)
  - |
    <event topic="review.dimension.done">
    wave_id: "wave-mismatch"
    dimension: "requirements"
    findings_count: 0
    plan_name: "demo"
    task_id: "u1-impl"
    </event>
  # review-synthesizer: 4 维到齐,发 review.passed
  - |
    <event topic="review.passed">
    plan_name: "demo"
    task_id: "u1-impl"
    findings_count: 0
    </event>
  - |
    <event topic="plan.complete">
    plan_name: "demo"
    task_id: "u1-impl"
    </event>

expected:
  iterations: 8
  events:
    - topic: work.done
    - topic: review.wave.ready
    - topic: review.dimension.done
    - topic: review.dimension.done
    - topic: review.dimension.done
    - topic: review.dimension.done
    - topic: review.passed
  absent_events:
    - topic: plan.blocked
  # scenario 仅验证 wave convergence 路径;plan-gate 终止循环
  # 留作 plan-gate 自身的测试覆盖(本 preset 中只有 ralph hat 能发
  # LOOP_COMPLETE)。
  completion: false
