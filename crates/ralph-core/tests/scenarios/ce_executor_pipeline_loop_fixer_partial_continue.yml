expected:
  iterations: 26
  events:
    - topic: plan.ready
    - topic: work.done
    - topic: stabilization.done
    - topic: review.round.ready
    - topic: fix.requested
    - topic: review.complete
    - topic: fix.done
    - topic: review.round.ready
    - topic: review.accepted
    - topic: align.done
    - topic: report.done
  absent_events:
    # The contract: one failed Fix Unit with independent progress
    # must NOT produce fix_status=blocked or a premature loop block.
    - topic: review.loop.blocked
    - topic: work.failed
    - topic: plan.blocked
    - topic: stabilization.blocked
  event_topic_counts:
    - topic: review.round.ready
      count: 2
    - topic: fix.requested
      count: 1
    - topic: fix.done
      count: 1
    - topic: review.accepted
      count: 1
  payload_matches:
    - topic: fix.done
      fields:
        review_round: 1
        fix_status: "partial"
        planned_fix_units: ["UF1","UF2","UF3"]
        attempted_fix_units: ["UF1","UF2","UF3"]
        completed_fix_units: ["UF1","UF3"]
        failed_fix_units: ["UF2"]
        skipped_fix_units: []
        blocked_fix_units: []
    - topic: review.round.ready
      occurrence: 2
      fields:
        review_round: 2
        source_topic: "fix.done"
    - topic: report.done
      fields:
        verdict: "pass_with_residuals"
  completion: true
