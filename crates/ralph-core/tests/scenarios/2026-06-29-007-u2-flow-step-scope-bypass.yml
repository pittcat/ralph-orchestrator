# 2026-06-29-007 U2: FlowStepScope bypass 前置验证
#
# BDD 覆盖:DEFENSIVE_BYPASS 列表在 unit_loop 期间允许 review-coordinator
# 触发 review.dimensions.complete / review-synthesizer 触发 review.complete /
# dimension-reviewer 触发 review.dimension.done / shipper 触发 REVIEW_COMPLETE。
# 单元测试在 flow_step_scope_stage::tests 已经覆盖;此 scenario 是 BDD 集成冒烟。
#
# 期望:
# - review.dimensions.complete / review.dimension.done / review.complete 落盘
#   (不被 flow_unknown_emit 拦截)
# - work.done 触发后不被强行推进 step(本 scenario 不测 step 推进,U1b 才测)
# - recovery.jsonl 不出现 flow_unknown_emit 记录

name: u2_flow_step_scope_bypass
description: FlowStepScope bypass 前置验证 - unit_loop 期间 review 序列事件不 reject

config:
  prompt_file: PROMPT.md
  max_iterations: 6
  hats:
    review-coordinator:
      subscribes_to:
        - work.done
      publishes:
        - review.dimensions.complete
      default_publishes: review.dimensions.complete
    dimension-reviewer:
      subscribes_to:
        - review.dimensions.complete
      publishes:
        - review.dimension.done
      default_publishes: review.dimension.done
    review-synthesizer:
      subscribes_to:
        - review.dimension.done
      publishes:
        - review.complete
      default_publishes: review.complete

mock_responses:
  - |
    <event topic="work.done">
    plan_name: "u2-demo"
    step: "step-01"
    task_id: "u2-task"
    </event>
  - |
    <event topic="review.dimensions.complete">
    wave_id: "u2-wave"
    dimensions: ["d1","d2"]
    </event>
  - |
    <event topic="review.dimension.done">
    wave_id: "u2-wave"
    dimension: "d1"
    verdict: ok
    </event>
  - |
    <event topic="review.dimension.done">
    wave_id: "u2-wave"
    dimension: "d2"
    verdict: ok
    </event>
  - |
    <event topic="review.complete">
    wave_id: "u2-wave"
    verdict: pass
    </event>
  - |
    waiting.
    </event>

expected:
  iterations: 6
  events:
    - topic: work.done
    - topic: review.dimensions.complete
    - topic: review.dimension.done
    - topic: review.complete
  absent_events:
    - topic: plan.blocked
  recovery_absent:
    - "flow_unknown_emit"
  completion: false