# U5 plan: Complex 11-hat isolated runtime regression harness.
#
# Topology (11 hats, all isolated single-event-per-turn).  The
# topology is intentionally designed so that EVERY hat has exactly
# one trigger and one publish, and no two hats share a trigger.
# This makes the 11-hat happy path deterministic under U4 round-robin
# scheduling: each mock response advances exactly one hat stage.
#
# Flow (linear with named branch / wave / aggregate stages):
#   1.  planner         subscribes: task.start           publishes: plan.created
#   2.  branch_a_worker subscribes: plan.created         publishes: a.impl.done
#   3.  branch_b_worker subscribes: a.impl.done          publishes: b.impl.done
#   4.  wave_a_dispatch subscribes: b.impl.done          publishes: a.wave.merged
#   5.  branch_a_verify subscribes: a.wave.merged        publishes: a.verified
#   6.  branch_b_verify subscribes: a.verified           publishes: b.verified
#   7.  aggregator      subscribes: b.verified           publishes: aggregate.done
#   8.  recoverer       subscribes: aggregate.done       publishes: recovery.complete
#   9.  human_consumer  subscribes: recovery.complete    publishes: guidance.acknowledged
#  10.  reporter        subscribes: guidance.acknowledged
#                       publishes: report.done, LOOP_COMPLETE
#
# Note: a "branch" hat pair (branch_a, branch_b) is included; the
# two branch hats run sequentially via distinct trigger topics so
# both execute deterministically.  A wave hat (wave_a_dispatch) and
# an aggregate hat (aggregator) are also part of the 10-hats above;
# the 11th hat slot is reserved by the single "human_consumer" hat
# that mirrors the spec's human-in-the-loop seam.
#
# Authorization rule (U3): ONLY `reporter` declares LOOP_COMPLETE in
# its `publishes` list.  Every other hat is forbidden from
# publishing it.  The 11-hat topology therefore has a single,
# named terminal authority.

name: isolated_complex_topology
description: U5 isolated 10-hat topology happy path - single completion owner

config:
  prompt_file: PROMPT.md
  max_iterations: 30
  hats:
    planner:
      subscribes_to:
        - task.start
      publishes:
        - plan.created
    branch_a_worker:
      subscribes_to:
        - plan.created
      publishes:
        - a.impl.done
    branch_b_worker:
      subscribes_to:
        - a.impl.done
      publishes:
        - b.impl.done
    wave_a_dispatch:
      subscribes_to:
        - b.impl.done
      publishes:
        - a.wave.merged
    branch_a_verify:
      subscribes_to:
        - a.wave.merged
      publishes:
        - a.verified
    branch_b_verify:
      subscribes_to:
        - a.verified
      publishes:
        - b.verified
    aggregator:
      subscribes_to:
        - b.verified
      publishes:
        - aggregate.done
    recoverer:
      subscribes_to:
        - aggregate.done
      publishes:
        - recovery.complete
    human_consumer:
      subscribes_to:
        - recovery.complete
      publishes:
        - guidance.acknowledged
    reporter:
      subscribes_to:
        - guidance.acknowledged
      publishes:
        - report.done
        - LOOP_COMPLETE
  event_loop:
    execution_mode: isolated
    completion_promise: LOOP_COMPLETE

# Mock responses: 10 turns, one business event per turn.  The fixture
# exercises a non-trivial linear pipeline: planner -> branch_a -> b
# -> wave -> a_verify -> b_verify -> aggregator -> recoverer ->
# human_consumer -> reporter -> LOOP_COMPLETE.
mock_responses:
  - |
    <event topic="plan.created">
    plan: "isolated complex topology"
    </event>
  - |
    <event topic="a.impl.done">
    branch: "a"
    </event>
  - |
    <event topic="b.impl.done">
    branch: "b"
    </event>
  - |
    <event topic="a.wave.merged">
    wave_id: "w-a-1"
    </event>
  - |
    <event topic="a.verified">
    verdict: "pass"
    </event>
  - |
    <event topic="b.verified">
    verdict: "pass"
    </event>
  - |
    <event topic="aggregate.done">
    count: 2
    </event>
  - |
    <event topic="recovery.complete">
    status: "ok"
    </event>
  - |
    <event topic="guidance.acknowledged">
    note: "human guidance consumed"
    </event>
  - |
    <event topic="report.done">
    pass_or_fail: "pass"
    </event>
  - |
    <event topic="LOOP_COMPLETE">
    Done.
    </event>

expected:
  iterations: 11
  events:
    - topic: plan.created
    - topic: a.impl.done
    - topic: b.impl.done
    - topic: a.wave.merged
    - topic: a.verified
    - topic: b.verified
    - topic: aggregate.done
    - topic: recovery.complete
    - topic: guidance.acknowledged
    - topic: report.done
  completion: true
