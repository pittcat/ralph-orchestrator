[package]
name = "ralph-core"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Core orchestration loop, configuration, and state management for Ralph Orchestrator"

[features]
recording = []

[lints]
workspace = true

[dependencies]
ralph-proto.workspace = true

tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
crossterm.workspace = true
regex.workspace = true
uuid.workspace = true
keyring.workspace = true
reqwest.workspace = true
sha2.workspace = true
tempfile.workspace = true

# For Unix file locking (flock)
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.18", features = ["draft202012"] }
# U11-T7: env-isolation tests (`UNIFIED_PROTOCOL_VIEW`) flip the
# global env var, so they must run serially relative to one another.
serial_test = "3"

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "protocol_view_bench"
harness = false
