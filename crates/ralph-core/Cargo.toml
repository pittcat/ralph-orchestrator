[package]
name = "ralph-core"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Core orchestration loop, configuration, and state management for Ralph Orchestrator"

[features]
recording = []

[lints]
workspace = true

[dependencies]
ralph-proto.workspace = true

tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
crossterm.workspace = true
regex.workspace = true
uuid.workspace = true
keyring.workspace = true
reqwest.workspace = true
sha2.workspace = true
tempfile.workspace = true

# For Unix file locking (flock)
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.18", features = ["draft202012"] }
# U11-T7: env-isolation tests (`UNIFIED_PROTOCOL_VIEW`) flip the
# global env var, so they must run serially relative to one another.
serial_test = "3"
# 2026-06-23-005 F1: `trybuild` runs `compile_fail` tests under
# `tests/ui/` so we can pin the `RejectionKind` `#[non_exhaustive]`
# contract — if a future change adds a variant and forgets to
# extend `CoordinatorDispatcher::dispatch`, the compile_fail test
# catches it at the `cargo test` boundary (R9 BLOCKER).
trybuild = "1"
# 2026-06-23-005 F1: `static_assertions` enforces compile-time
# invariants on `RejectionKind` shape (e.g. that it is not constructible
# via unsafe transmutation tricks). Pairs with the `trybuild`
# `compile_fail` test to make the `#[non_exhaustive]` contract a
# two-layer guard (runtime API + compile-time type property).
static_assertions = "1"

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "protocol_view_bench"
harness = false
